<!-- 자동 생성: scripts/build_pages.py 로 apps-script/Index.html + tab_*.html 에서 만든다. 직접 고치지 말 것 -->
<html lang="ko">
<head>
<script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MARKET TERMINAL</title>
<script>
/* GitHub Pages 용: Apps Script 의 google.script.run 을 같은 저장소 파일 fetch 로 대체 */
(function(){
  const get = p => fetch(p + '?t=' + Date.now(), {cache: 'no-store'}).then(r => {
    if (!r.ok) throw new Error('HTTP ' + r.status + ' (' + p + ')'); return r.text(); });
  const api = {
    getData: () => get('reports/dashboard.json').then(t => JSON.parse(t)),
    getDetail: m => get('reports/detail_' + m + '.json'),
    getStock: (m, s) => get('reports/detail/' + m + '/' + encodeURIComponent(s) + '.json'),
    getMarkdown: n => get('reports/' + n + '.md').catch(() => ''),
    // live.json 은 자주 바뀌므로 Pages 재배포를 기다리지 않고 raw 에서 직접 (CDN 캐시 최대 5분)
    getLive: () => fetch('https://raw.githubusercontent.com/hk99915-bot/market-screener/main/reports/live.json?t=' + Date.now()).then(r => r.ok ? r.text() : get('reports/live.json')).catch(() => get('reports/live.json').catch(() => '')),
    getResearch: () => get('reports/research.json'),
    getDisclosures: () => get('reports/disclosures.json'),
    getMacroSeries: () => get('reports/macro_series.json'),
    getAnalysts: () => get('reports/analysts.json'),
    getMomentum: m => get('reports/momentum_' + m + '.json'),
    getMomentumBt: () => get('reports/momentum_bt.json'),
    getDaily: () => get('reports/daily_brief.json'),
    getDailyIndex: () => get('reports/daily_hist/_index.json'),
    getDailyAt: (d) => get('reports/daily_hist/' + d + '.json'),
    getStockIndex: m => get('reports/detail/' + m + '/_index.json'),
    getPortfolios: () => get('reports/portfolios.json'),
    getSignals: () => get('reports/signal_scores.json'),
    getMacroView: () => get('reports/macro_view.json'),
    getChainSeries: () => get('reports/chains.json'),
    getEvents: () => get('reports/events_stats.json'),
    getMacroHist: () => get('reports/macro_hist.json'),
    getStudy: () => get('reports/studies/crash_rebound.json'),
    getLab: () => get('reports/lab.json'),
    getBoard: () => get('ops/board.json'),
    getTeam: () => get('ops/team.json'),
    getLocks: () => get('ops/locks.json'),
    getChangelog: () => get('reports/changelog.json'),
    getOpsDaily: (d) => get('reports/ops/daily/' + d + '.md').catch(() => ''),
    getOpsRuns: () => get('reports/ops/runs.json'),
    getHealth: () => get('reports/health.json'),
    getBonds: () => get('reports/bonds.json'),
    getJapan: () => get('reports/japan.json'),
    getStudyGuide: () => get('content/study.json'),
    getDerivs: () => get('reports/derivs.json'),
    getDerivHist: () => get('data/deriv/daily.csv'),
    getDerivSignals: () => get('reports/studies/derivs_signals.json'),
    getGammaStudy: () => get('reports/studies/gamma_regime.json'),
    getMacroReleases: () => get('reports/macro_releases.json'),
    getEnglishLatest: () => get('reports/english/latest.json'),
    getEnglishAt: (d) => get('reports/english/' + d + '.json'),
    getEnglishIndex: () => get('reports/english/index.json'),
    getCalendar: () => get('reports/calendar.json'),
    getPeers: (mk) => get('reports/peers_' + mk + '.json'),
    getDecisions: () => get('reports/decisions.json'),
    getCommittee: () => get('reports/committee.json'),
    getCommitteeUS: () => get('reports/committee_us.json'),
    getArchIndex: (k) => get('reports/archive/' + k + '/_index.json'),
    getArchAt: (k, d) => get('reports/archive/' + k + '/' + d + '.json'),
    getChains: () => get('reports/chains_view.json'),
    getViews: () => get('reports/views.json'),
    getValuation: () => get('reports/valuation.json'),
    getDotplot: () => get('reports/dotplot.json'),
  };
  function runner(ok, fail) {
    const r = { withSuccessHandler: f => runner(f, fail), withFailureHandler: f => runner(ok, f) };
    for (const k in api) r[k] = (...a) => api[k](...a).then(v => ok && ok(v), e => fail ? fail(e) : console.error(e));
    return r;
  }
  window.google = { script: { run: runner() } };
})();
</script>

<script>
/* ───── 공용: 상수·도우미·검색·수치 도구 (탭 파일들이 쓴다) ───── */
const CLS={TREND_LONG:'추세상승',TREND_OVEREXTENDED:'추세과열',PULLBACK_IN_UPTREND:'눌림',COUNTERTREND_BOUNCE:'역추세반등',TREND_SHORT:'추세하락',NEUTRAL:'중립',OVEREXTENDED:'과열'};
const SEC=[['TREND_LONG','TREND LONG'],['PULLBACK_IN_UPTREND','PULLBACK IN UPTREND'],['COUNTERTREND_BOUNCE','COUNTERTREND BOUNCE'],['OVEREXTENDED','OVEREXTENDED / RISK≥60'],['TREND_SHORT','TREND SHORT']];
let D=null, view='home';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const pct=(x,d=1)=>x==null?'':`<span class="${x>0?'up':x<0?'dn':'mu'}">${(x*100).toFixed(d)>0?'+':''}${(x*100).toFixed(d)}%</span>`;
const num=(x,d=0)=>x==null?'':Number(x).toLocaleString(undefined,{maximumFractionDigits:d,minimumFractionDigits:d});
const n0=x=>x==null?'':Math.round(x);
function tick(){const t=new Date();$('#clock').textContent=t.toLocaleString('ko-KR',{timeZone:'Asia/Seoul',hour12:false});}
setInterval(tick,1000);tick();

const shortNm=x=>String(x||'').replace(/\s*[-–]\s*(Class [A-Z] )?(Common Stock|Ordinary Shares|American Depositary|New York Registry).*$/i,'').replace(/\s+(Class [A-Z]\s+)?(Common Stock|Ordinary Shares).*$/i,'').replace(/,?\s+(Inc\.?|Corporation|Corp\.?|Ltd\.?|plc|Holdings?|Company|Co\.)$/i,'').replace(/,?\s+(Inc\.?|Corporation|Corp\.?)$/i,'').trim();
function repTable(rows){
  if(!rows||!rows.length) return '<div class="mu">—</div>';
  return `<table><tr><th class="l">DATE</th><th class="l">NAME</th><th class="l">BROKER</th><th class="l">OP</th><th>TP</th><th class="l">TITLE</th></tr>`+rows.map(r=>`<tr><td class="l mu">${r.date}</td><td class="l am sym" data-sym="${esc(r.code)}" data-mk="KR">${esc(r.name)}</td><td class="l">${esc(r.broker)}</td><td class="l">${esc(r.opinion||'')}</td><td>${num(r.target)}</td><td class="l">${r.link?`<a href="${esc(r.link)}" target="_blank">${esc(r.title).slice(0,50)}</a>`:esc(r.title).slice(0,50)}</td></tr>`).join('')+'</table>';
}
function simTable(m){
  if(!m||!m.days) return '<div class="mu">시뮬레이션 데이터 부족 (60거래일 미만)</div>';
  const P=x=>x==null?'—':pct(x,1), pos=p=>p>0?'<b class="up">롱</b>':p<0?'<b class="dn">숏</b>':'<span class="mu">관망</span>';
  const row=(name,desc,k,mode)=>{const r=m[k][mode]; return `<tr><td class="l">${name}</td><td class="l mu">${desc}</td><td>${P(r.ret)}</td><td>${P(r.ret-m.bh)}</td><td>${P(r.mdd)}</td><td>${r.trades}</td><td>${r.win==null?'—':(r.win*100).toFixed(0)+'%'}</td><td class="l">${pos(r.pos)}${r.pos?` <span class="mu">${r.entry_date} 진입 ${num(r.entry_px)}</span> ${P(r.open_ret)}`:''}</td></tr>`;};
  return `<table class="simt"><tr><th class="l">전략</th><th class="l">방식</th><th>누적수익</th><th>보유대비</th><th>MDD</th><th>거래</th><th>승률</th><th class="l">현재 포지션 · 진입 후 손익</th></tr>
    ${row('이평 추세 롱','종가>50일선 & 20>50 이면 보유','ma','long')}${row('이평 추세 롱숏','위 조건이면 롱, 반대면 숏','ma','ls')}${row('PSAR 롱','종가>PSAR 이면 보유','psar','long')}${row('PSAR 롱숏','종가>PSAR 롱, 아니면 숏','psar','ls')}
    <tr><td class="l">단순 보유</td><td class="l mu">기간 시작에 사서 보유</td><td>${P(m.bh)}</td><td>—</td><td>—</td><td>—</td><td>—</td><td></td></tr></table>`;
}
function finTable(f,kr){
  const q=(f&&f.quarters)||[]; if(!q.length) return `<div class="mu">재무 데이터 없음 (${kr?'DART':'SEC'} 수집 대기 중이거나 대상 밖)</div>`;
  const n=v=>v==null?'—':num(v,0), m=(a,b)=>a!=null&&b?`${(a/b*100).toFixed(1)}%`:'—';
  const yoy=(i,k)=>{const p=q[i-4]; return p&&p[k]&&q[i][k]!=null?pct(q[i][k]/p[k]-1,0):'';};
  const row=(l,k,fmt)=>`<tr><td class="l mu">${l}</td>${q.map((r,i)=>`<td>${fmt?fmt(r,i):n(r[k])}</td>`).join('')}<td class="am">${f.ttm&&k?n(f.ttm[k]):''}</td></tr>`;
  return `<div style="overflow:auto"><table><tr><th class="l">항목</th>${q.map(r=>`<th>${r.period}</th>`).join('')}<th>TTM</th></tr>
   ${row('매출','revenue')}${row('  YoY','',(r,i)=>yoy(i,'revenue'))}${row('영업이익','op')}${row('  OPM','',(r)=>m(r.op,r.revenue))}${row('순이익','ni')}${row('영업현금흐름','cfo')}${row('CAPEX','capex')}${row('자본총계','equity')}${row('부채총계','liab')}</table></div>`;
}
let SIX=null;
let SIXT=0;
function loadIndex(cb){ if(SIX&&SIX.length&&Date.now()-SIXT<600000) return cb(); SIX=[]; SIXT=Date.now(); let left=2;
  for(const mk of ['KR','US']) google.script.run.withSuccessHandler(t=>{try{const j=JSON.parse(t); const ee=new Set(j.etf||[]); for(const s of j.symbols||[]) SIX.push({s, n:(j.names||{})[s]||s, m:mk, e:ee.has(s)});}catch(e){} if(--left===0) cb();}).withFailureHandler(()=>{if(--left===0) cb();}).getStockIndex(mk); }
function srch(q){ q=q.trim().toLowerCase(); const box=$('#sres'); if(!q){box.style.display='none';return;}
  loadIndex(()=>{ const r=SIX.filter(x=>x.s.toLowerCase().startsWith(q)||String(x.n).toLowerCase().includes(q))
      .sort((a,b)=>(a.s.toLowerCase()===q?-1:0)-(b.s.toLowerCase()===q?-1:0)||(String(a.n).toLowerCase().startsWith(q)?-1:1)-(String(b.n).toLowerCase().startsWith(q)?-1:1)).slice(0,12);
    box.innerHTML=r.length?r.map((x,i)=>`<div class="${i?'':'on'}" data-sym="${esc(x.s)}" data-mk="${x.m}">${esc(x.n)}<i>${esc(x.s)} · ${x.m}${x.e?' · ETF':''}</i></div>`).join(''):'<div class="mu">결과 없음 (스크리너 대상 종목만 검색됩니다)</div>';
    box.style.display='block'; }); }
document.addEventListener('input',e=>{ if(e.target.id==='sq') srch(e.target.value); });
document.addEventListener('keydown',e=>{ if(e.target.id!=='sq') return; const box=$('#sres'), it=[...box.querySelectorAll('div[data-sym]')], cur=it.findIndex(x=>x.classList.contains('on'));
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){ e.preventDefault(); if(!it.length) return; const n=(cur+(e.key==='ArrowDown'?1:-1)+it.length)%it.length; it.forEach((x,i)=>x.classList.toggle('on',i===n)); }
  else if(e.key==='Enter'){ const t=it[Math.max(cur,0)]; if(t){ openDetail(t.dataset.sym,t.dataset.mk); box.style.display='none'; e.target.blur(); } }
  else if(e.key==='Escape'){ box.style.display='none'; } });
document.addEventListener('click',e=>{ const t=e.target.closest('#sres div[data-sym]'); if(t){ openDetail(t.dataset.sym,t.dataset.mk); $('#sres').style.display='none'; return; } if(!e.target.closest('.srch')) { const b=$('#sres'); if(b) b.style.display='none'; } });
/* 수치 도구 */
const mean=a=>a.reduce((x,y)=>x+y,0)/a.length;
const cov=(a,b)=>{const ma=mean(a),mb=mean(b);let s=0;for(let i=0;i<a.length;i++)s+=(a[i]-ma)*(b[i]-mb);return s/(a.length-1);};
const sd=a=>Math.sqrt(cov(a,a));
const corr=(a,b)=>cov(a,b)/(sd(a)*sd(b)||1);
const quant=(a,q)=>{const s=[...a].sort((x,y)=>x-y);return s[Math.floor(q*(s.length-1))];};
function cl(series){ const m={}; for(const r of series||[]) m[r[0]]=r.length>=6?r[4]:r[1]; return m; }
let SG=null, CH=null;
function med(a){const s=[...a].sort((x,y)=>x-y),n=s.length;return n?(n%2?s[(n-1)/2]:(s[n/2-1]+s[n/2])/2):null;}
</script>

<script>
function sigTable(rows,market){
  if(!rows||!rows.length) return '<div class="mu">—</div>';
  const kr=market==='KR';
  return `<table><tr><th class="l">SYM</th><th class="l">NAME</th><th>PX</th><th>1D</th><th>20D</th><th>T</th><th>M</th><th>RISK</th><th>ADX</th><th>RSI</th><th>52H</th><th>VOL×</th><th class="l">CLS</th></tr>`+
  rows.map(r=>`<tr><td class="l am sym" data-sym="${esc(r.symbol)}" data-mk="${market}">${esc(r.symbol)}</td><td class="l">${esc(r.name).slice(0,16)}</td><td>${num(r.close,kr?0:2)}</td><td>${pct(r.ret1)}</td><td>${pct(r.ret20)}</td><td class="am">${n0(r.trend_score)}</td><td>${n0(r.momentum_score)}</td><td class="${r.reversal_risk>=60?'dn':''}">${n0(r.reversal_risk)}</td><td>${n0(r.adx14)}</td><td>${n0(r.rsi14)}</td><td>${pct(r.from_high52,0)}</td><td class="${r.vol_ratio>=3?'am':''}">${(r.vol_ratio??0).toFixed(1)}</td><td class="l mu">${CLS[r.class]||r.class||''}</td></tr>`).join('')+'</table>';
}
function breadthPanel(mk){
  const b=(D.breadth||[]).filter(x=>x.market===mk);
  if(!b.length) return `<div class="mu">—</div>`;
  const L=b[b.length-1], P=b.length>20?b[b.length-21]:b[0];
  const p200=L.pct_above200??0, p50=L.pct_above50??0, p20=L.pct_above20??0, d200=(p200-(P.pct_above200??p200))*100;
  // 판정: 200일선 위 비율(장기 체력) × 20일선 위 비율(단기 흐름)
  const lvl=p200>=0.6?'강세':p200>=0.4?'중립':'약세', cls=p200>=0.6?'up':p200>=0.4?'am':'dn';
  const shortv=p20>=0.6?'단기 매수세 우위':p20<=0.3?'단기 투매 구간':'단기 혼조';
  const trend=b.length<6?'추이 데이터 쌓는 중':Math.abs(d200)<3?'20일 전과 비슷':d200>0?`20일 전보다 +${d200.toFixed(0)}%p 개선`:`20일 전보다 ${d200.toFixed(0)}%p 악화`;
  const verdict=`<div class="bv ${cls}"><b>${lvl}</b> 체력 · ${shortv}</div><div class="mu" style="margin-bottom:6px">200일선 위 ${Math.round(p200*100)}% (${trend}) · ${L.date} · ${L.n}종목</div>`;
  const gauge=(l,v)=>{const c=v>=0.6?'up':v>=0.4?'am':'dn'; return `<div class="bg"><span class="bl">${l}</span><span class="bt"><i class="${c}" style="width:${(v*100).toFixed(0)}%"></i><u style="left:40%"></u><u style="left:60%"></u></span><b class="${c}">${Math.round(v*100)}%</b></div>`;};
  const split=(l,a,d)=>{const t=(a+d)||1, pa=a/t*100; return `<div class="bg"><span class="bl">${l}</span><span class="bs"><i class="up" style="width:${pa.toFixed(0)}%"></i><i class="dn" style="width:${(100-pa).toFixed(0)}%"></i></span><b><span class="up">${a}</span>/<span class="dn">${d}</span></b></div>`;};
  // 30일 추이: 200일선 위 비율 선 + 40/60 기준선
  const s=b.slice(-30), w=220, h=46, X=i=>i*(w-4)/Math.max(s.length-1,1)+2, Y=v=>h-2-(v||0)*(h-4);
  const pts=s.map((x,i)=>`${X(i).toFixed(1)},${Y(x.pct_above200).toFixed(1)}`).join(' ');
  const svg=`<svg viewBox="0 0 ${w} ${h}" class="bsv" preserveAspectRatio="none"><line x1="0" x2="${w}" y1="${Y(.6)}" y2="${Y(.6)}" class="g60"/><line x1="0" x2="${w}" y1="${Y(.4)}" y2="${Y(.4)}" class="g40"/><polyline points="${pts}" class="pl"/><circle cx="${X(s.length-1)}" cy="${Y(p200)}" r="2.5" class="pd"/></svg>`;
  return `${verdict}${gauge('20일선 위',p20)}${gauge('50일선 위',p50)}${gauge('200일선 위',p200)}${split('상승/하락',L.adv,L.dec)}${split('신고가/신저가',L.new_high52,L.new_low52)}
   ${s.length>=5?`<div class="mu" style="margin-top:6px">200일선 위 비율 · 최근 ${s.length}거래일 (점선 40% / 60%)</div>${svg}`:`<div class="mu" style="margin-top:6px">추이 그래프는 5거래일 이상 쌓이면 표시</div>`}`;
}
let MV=null;
function macroPanel(mk){
  if(MV===null){ MV=false; google.script.run.withSuccessHandler(t=>{try{MV=JSON.parse(t);}catch(e){MV={};} render();}).withFailureHandler(()=>{MV={};}).getMacroView(); }
  if(MV&&MV.rows&&MV.rows.length){
    const col=x=>x==null?'var(--muted)':x>0.15?'var(--up)':x<-0.15?'var(--dn)':'var(--amber)';
    const lv=k=>L&&L.items&&L.items.find(x=>x.key===k);
    const rows=MV.rows.map(d=>{ const l=lv(d.key), rate=d.key==='US10Y'||d.key==='JGB10Y', last=l&&l.last?l.last:d.last;
      const c1=rate?(l&&l.last?`${((l.last-(d.last-(d.d1||0)))*100).toFixed(0)}bp`:`${((d.d1||0)*100).toFixed(0)}bp`):pct(l&&l.chg!=null?l.chg:d.chg1);
      const c20=rate?`${((d.d20||0)*100>0?'+':'')}${((d.d20||0)*100).toFixed(0)}bp`:pct(d.chg20);
      return `<tr class="mvr" data-k="${esc(d.key)}"><td class="l am mac" data-key="${esc(d.key)}">${esc(d.name)}</td><td>${num(last,2)}</td><td>${c1}</td><td>${c20}</td><td class="hm">${d.key==='VIX'||rate?'—':pct(d.from_hi,0)}</td><td style="color:${col(d.impact)}">${d.impact==null?'—':(d.impact>0?'+':'')+d.impact.toFixed(2)}</td><td class="tg mu" data-x="${esc(d.key)}">▸</td></tr>
        <tr class="sub" id="mvx-${esc(d.key)}"><td colspan="7" style="white-space:normal"><div style="color:var(--txt)">${esc(d.state)}</div><div class="mu" style="font-size:11px;margin-top:2px">${esc(d.what)}</div></td></tr>`;}).join('');
    return `<div style="border:1px solid ${col(MV.score)};padding:6px 9px;margin-bottom:6px;line-height:1.6;font-size:12.5px;white-space:normal"><b style="color:${col(MV.score)}">${esc(MV.label||'')}</b> ${esc((MV.summary||'').replace(/^매크로 바람 \S+ /,''))}</div>
      <table class="mvt"><tr><th class="l">지표</th><th>현재</th><th>1D</th><th>20D</th><th class="hm">고점대비</th><th>영향</th><th></th></tr>${rows}</table>
      <div class="mu" style="font-size:11px;margin-top:4px;white-space:normal">▸ 누르면 해설. 영향 = 한국 주식 전체에 대한 바람(−1~+1), 종합해서 위 판단에 반영. 한국 지수는 결과라 점수 제외. 현재·1D는 실시간, 나머지는 ${esc(MV.asof||'')} 일봉 기준.</div>`;
  }
  const m=(D.state||{})['macro_'+mk]; if(!m||!m.value||!m.value.length) return '<div class="mu">—</div>';
  const reg=(D.state||{})['regime_'+mk];
  return `<table><tr><th class="l">KEY</th><th>LAST</th><th>1D</th><th>20D</th><th>vs50D</th><th class="l">REG</th></tr>`+m.value.map(d=>`<tr><td class="l am mac" data-key="${esc(d.key)}">${d.key}</td><td>${num(d.last,2)}</td><td>${pct(d.chg1)}</td><td>${pct(d.chg20)}</td><td>${pct(d.vs_sma50)}</td><td class="l mu">${d.regime}</td></tr>`).join('')+`</table>`+(reg&&reg.value?`<div class="mu" style="margin-top:4px">${esc(reg.value)}</div>`:'');
}
let JP=null;
function japanPanel(){   // 일본: 닛케이·TOPIX·엔·JGB + 한국 종목과 연결된 일본 피어 그룹 (reports/japan.json)

function squarify(items,x,y,w,h){ // items: [{v,...}] → [{...,x,y,w,h}]
  const out=[]; let rest=items.filter(o=>o.v>0).sort((a,b)=>b.v-a.v); const tot=rest.reduce((s,o)=>s+o.v,0); if(!tot) return out;
  const scale=w*h/tot; rest=rest.map(o=>({...o,_a:o.v*scale}));
  const worst=(row,len)=>{const s=row.reduce((a,o)=>a+o._a,0),mx=Math.max(...row.map(o=>o._a)),mn=Math.min(...row.map(o=>o._a)); return Math.max(len*len*mx/(s*s),(s*s)/(len*len*mn));};
  while(rest.length){ const len=Math.min(w,h); let row=[rest[0]], i=1;
    while(i<rest.length && worst([...row,rest[i]],len)<=worst(row,len)){ row.push(rest[i]); i++; }
    const s0=row.reduce((a,o)=>a+o._a,0), thick=s0/len; let off=0;
    for(const o of row){ const l=o._a/thick; if(w>=h) out.push({...o,x:x,y:y+off,w:thick,h:l}); else out.push({...o,x:x+off,y:y,w:l,h:thick}); off+=l; }
    if(w>=h){ x+=thick; w-=thick; } else { y+=thick; h-=thick; } rest=rest.slice(i); }
  return out; }

function mdToHtml(md,mk){
  const lines=md.split('\n'); let out='',intab=false;
  const MACK={KOSPI:'KOSPI',KOSDAQ:'KOSDAQ',SPX:'SPX',NASDAQ:'NASDAQ',RUT:'RUT',VIX:'VIX',US10Y:'US10Y',DXY:'DXY',USDKRW:'USDKRW',USDJPY:'USDJPY',WTI:'WTI',GOLD:'GOLD',BTC:'BTC',

  const symCell=c=>{const t=c.trim(); if(MACK[t]) return `<td class="l am mac" data-key="${MACK[t]}">${esc(t)}</td>`; return mk&&(/^[0-9A-Z]{6}$/.test(t)&&mk==='KR'||/^[A-Z][A-Z.\-]{0,5}$/.test(t)&&mk==='US')?`<td class="l am sym" data-sym="${esc(t)}" data-mk="${mk}">${esc(t)}</td>`:`<td class="l">${inline(t)}</td>`;};

    if(l.startsWith('# ')) out+=`<h1>${esc(l.slice(2))}</h1>`; else if(l.startsWith('## ')) out+=`<h2>${esc(l.slice(3))}</h2>`;

// '## ISA' 줄 아래는 ISA 코어 북(book:'isa'), 그 위는 위성 북(book:'sat'). 분모(순자산)는 두 북 + 현금 전부.
const ISA_HEAD=/^#{1,3}\s*ISA\b/i;
function myParse(txt){ const out=[]; let book='sat'; for(const ln of txt.split(/\n/)){ const t=ln.trim(); if(ISA_HEAD.test(t)){ book='isa'; continue; } if(t.startsWith('#')) continue; const p=t.split(/[\s,]+/).filter(Boolean); if(!p.length) continue;
    const n=x=>{const v=parseFloat(String(x||'').replace(/,/g,'')); return isFinite(v)?v:null;};
    const k=p[0].toUpperCase();
    if(['현금','KRW','CMA','원화','예수금','RP'].includes(k)||/^CMA/.test(k)) out.push({cash:'KRW', amt:n(p[1])||0, book});
    else if(['USD','달러','미국달러'].includes(k)) out.push({cash:'USD', amt:n(p[1])||0, book});
    else { // 끝의 숫자 최대 2개 = 수량·평단, 나머지 = 종목 (이름에 공백·숫자 허용: "TIGER 200 IT 5 30000")
      let k2=p.length; const nums=[]; while(k2>1&&nums.length<2&&n(p[k2-1])!=null){ nums.unshift(n(p[k2-1])); k2--; }
      out.push({key:p.slice(0,k2).join(' '), qty:nums.length?nums[0]:0, avg:nums.length>1?nums[1]:null, book}); } } return out; }
// ISA 코어 목표 (안건 8): S&P500 40 · NDX 10 · K200 15 · 국고채 20 · 금 15, 밴드 ±5%p
const ISA_TARGET=[['S&P500',0.40],['NDX',0.10],['K200',0.15],['KTB',0.20],['Gold',0.15]], ISA_BAND=0.05;
function isaBucket(s,nm){ const n=String(nm||'').toUpperCase();
  if(s==='360750'||n.includes('S&P')||['SPY','IVV','VOO','SPLG'].includes(s)) return 'S&P500';
  if(s==='133690'||n.includes('나스닥')||n.includes('NDX')||['QQQ','QQQM'].includes(s)) return 'NDX';
  if(['148070','305080','152380'].includes(s)||/국고채|국채|KTB/.test(n)) return 'KTB';
  if(s==='132030'||/골드|금선물|GOLD/.test(n)||['GLD','IAU'].includes(s)) return 'Gold';
  if(s==='069500'||(/(^|\s)200(\s|$)|코스피/.test(n)&&!/IT|반도체|인버스|레버리지/.test(n))) return 'K200';
  return null; }
// 반도체 분류 (pb.py semi_class 와 동일): 'semi' = 한도 산입(반도체 체인·미국 반도체·반도체/IT 섹터 ETF 전액), 'elec' = 전기·IT 하드웨어(상관 테마, 보조 수치),
// 지수 ETF(KODEX 200·S&P500 …)는 한도 밖 — 속의 반도체 룩스루는 lookW 로 돌려 '참고 경보' 로만 보인다 (합의 1-④)
const SEMI_ETFS=['139260','091160','PSI','SOXX','SMH','SOXL','SOXQ','XSD','SMHX','396500','395160','449450'];
const US_SEMIS=['MU','SNDK','NVDA','AMD','AVGO','TSM','INTC','QCOM','ARM','MRVL','LRCX','AMAT','KLAC','ASML','WDC','STX'];
function semiClass(a){ const s=a.h.r.s, n=String(a.d.name||'').toUpperCase();
  if(a.etf){ if(SEMI_ETFS.includes(s)||/반도체|SEMI|SOX|IT$|\bIT\b|테크/.test(n)) return {kind:'semi',lookW:0};
    const lc=(a.d.etf.look||{}).chains||{}; let lw=0; for(const [k,w] of Object.entries(lc)) if(/반도체|IT 하드웨어/.test(k)) lw+=w; return {kind:null,lookW:lw}; }
  const ch=((a.d.drivers||{}).chain||{}).name||'';
  if(US_SEMIS.includes(s)||/반도체/.test(ch)) return {kind:'semi',lookW:0};
  if(/IT 하드웨어/.test(ch)) return {kind:'elec',lookW:0};
  return {kind:null,lookW:0}; }
function myResolve(k){ const x=k.toLowerCase().trim();
  const ex=SIX.find(s=>s.s.toLowerCase()===x)||SIX.find(s=>String(s.n).toLowerCase()===x); if(ex) return ex;
  if(/^[a-z][a-z.\-]{0,5}$/.test(x)||/^\d{6}$/.test(x)) return null;   // 티커·코드는 정확히 일치할 때만 (PSI → PepsiCo 오인 방지)
  return SIX.find(s=>String(s.n).toLowerCase().startsWith(x))||SIX.find(s=>String(s.n).toLowerCase().replace(/\s/g,'').includes(x.replace(/\s/g,'')))||null; }
// 비공개 저장소(pb-private/holdings.txt) 동기화 — 읽기 전용 토큰은 이 브라우저 localStorage 에만 보관
const GHK='mt_gh_tok', PBSRC='https://api.github.com/repos/hk99915-bot/pb-private/contents/holdings.txt';
function ghTok(){ try{ return sessionStorage.getItem(GHK)||localStorage.getItem(GHK)||''; }catch(e){ return ''; } }
// PIN 잠금 기억: 토큰을 PIN 으로 암호화(AES-GCM, PBKDF2 25만 회)해 이 브라우저에 저장 → 다음부턴 PIN 만 입력. 복호화한 토큰은 이 창(sessionStorage)에만.
const GHE='mt_gh_enc';
function alertMsg(m){ const e=$('#mysync'); if(e) e.textContent=m; }
const _b64=u=>btoa(String.fromCharCode(...new Uint8Array(u))), _ub64=t=>Uint8Array.from(atob(t),c=>c.charCodeAt(0));
async function _ghKey(pin,salt){ const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pin),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:250000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['encrypt','decrypt']); }
async function ghLock(tok,pin){ const salt=crypto.getRandomValues(new Uint8Array(16)), iv=crypto.getRandomValues(new Uint8Array(12));
  const c=await crypto.subtle.encrypt({name:'AES-GCM',iv},await _ghKey(pin,salt),new TextEncoder().encode(tok));
  localStorage.setItem(GHE,JSON.stringify({s:_b64(salt),i:_b64(iv),c:_b64(c)})); }
async function ghUnlock(pin){ try{ const o=JSON.parse(localStorage.getItem(GHE)||'null'); if(!o) return false;
  const p=await crypto.subtle.decrypt({name:'AES-GCM',iv:_ub64(o.i)},await _ghKey(pin,_ub64(o.s)),_ub64(o.c));
  sessionStorage.setItem(GHK,new TextDecoder().decode(p)); return true; }catch(e){ return false; } }
function ghLocked(){ try{ return !ghTok() && !!localStorage.getItem(GHE); }catch(e){ return false; } }
function myClean(t){ return String(t||'').split('\n').filter(l=>l.trim()&&(ISA_HEAD.test(l.trim())||!l.trim().startsWith('#'))).join('\n'); }

    .then(r=>{ if(!r.ok) throw new Error(r.status); return r.text(); })
    .then(t=>{ const c=myClean(t); if(c){ mySave(c); const ta=$('#myta'); if(ta) ta.value=c; } MYSYNC={st:'동기화됨',at:new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'})}; cb&&cb(true); })
    .catch(e=>{ MYSYNC={st:'실패('+e.message+') — 토큰 권한·만료 확인'}; cb&&cb(false); }); }
let MYSYNCED=false;
function myOpen(){ try{ return localStorage.getItem('mt_myopen')==='1'; }catch(e){ return false; } }
function myView(){
  const txt=myLoad();
  setTimeout(()=>{ const ta=$('#myta'); if(!ta) return; $('#mygo').onclick=()=>{ mySave(ta.value); $('#myin').open=false; myRun(); };
    const st=()=>{ const e=$('#mysync'); if(e) e.textContent=MYSYNC.st+(MYSYNC.at?' · '+MYSYNC.at:''); };
    $('#mysyncb').onclick=()=>{ mySync(ok=>{ st(); if(ok) myRun(); }); st(); };
    $('#mytokb').onclick=async()=>{ const v=($('#mytok').value||'').trim(); const ses=$('#mytokses')&&$('#mytokses').checked; const pin=(($('#mytokpin')||{}).value||'').trim();
      try{ localStorage.removeItem(GHK); sessionStorage.removeItem(GHK); if(v){ if(pin){ if(pin.length<6){ alertMsg('PIN 은 6자 이상'); return; } await ghLock(v,pin); localStorage.removeItem(GHK); sessionStorage.setItem(GHK,v); } else { localStorage.removeItem(GHE); (ses?sessionStorage:localStorage).setItem(GHK,v); } } }catch(_){}
      $('#mytok').value=''; if($('#mytokpin')) $('#mytokpin').value=''; mySync(ok=>{ st(); if(ok) myRun(); }); st(); render(); };
    const pu=$('#mypinb'); if(pu) pu.onclick=async()=>{ const ok=await ghUnlock(($('#mypin').value||'').trim()); $('#mypin').value=''; if(ok){ mySync(k=>{ st(); if(k) myRun(); }); render(); } else { const e=$('#mypinmsg'); if(e) e.textContent='PIN 이 틀렸어요'; } };
    const pi=$('#mypin'); if(pi) pi.onkeydown=e=>{ if(e.key==='Enter') $('#mypinb').click(); };
    const fg=$('#mypinforget'); if(fg) fg.onclick=()=>{ try{ localStorage.removeItem(GHE); }catch(_){} render(); };
    if(ghTok()&&!MYSYNCED){ MYSYNCED=true; mySync(ok=>{ st(); if(ok) myRun(); }); st(); }

      <div class="am" style="font-size:12px;margin-top:8px">② 분산 (주식 10%p를 옮기면)</div><table><tr><th class="l">수단</th><th>상관</th><th>변동성 감소</th><th>1년 수익</th></tr>
      ${hedge.filter(h=>h.ty==='div').sort((a,b)=>b.red-a.red).map(h=>`<tr><td class="l"><span class="am sym" data-sym="${esc(h.sy)}" data-mk="${h.m}" style="cursor:pointer">${esc(h.nm)}</span></td><td>${F(h.rho)}</td><td class="${h.red>0?'up':'dn'}">${W(h.red)}</td><td>${pct(h.ret1y,0)}</td></tr>`).join('')}</table>
      <div class="mu" style="font-size:11px;margin-top:4px;white-space:normal">① 필요 금액 = 변동성을 가장 많이 줄이는 매수 금액(100% 헷지). 인버스·레버리지는 일간 재조정으로 오래 들면 손실이 쌓임. ② 상관이 낮거나 음수일수록 분산 효과. 과거 1년 상관이라 위기 때는 바뀔 수 있음(물가 충격엔 채권도 같이 빠짐).</div></div></div>
   </div>
   ${pf?`<div class="p" style="margin-bottom:8px"><h2>모의 전략과 비교<small>2011~ 월간 · 원화</small></h2><div class="b"><table><tr><th class="l">전략</th><th>연수익</th><th>변동성</th><th>샤프</th><th>최대낙폭</th><th class="l">지금 배분</th></tr>
      <tr><td class="l am">내 포트 (최근 1년)</td><td>${pct(Pm.ret,1)}</td><td>${W(Pm.vol)}</td><td>${F(Pm.sh)}</td><td>${pct(Pm.mdd,0)}</td><td class="l mu">반도체 중심</td></tr>
      ${pf.filter(x=>!/스트래들/.test(x.name)).map(x=>`<tr><td class="l">${esc(x.name)}</td><td>${pct(x.stats.cagr,1)}</td><td>${W(x.stats.vol)}</td><td>${F(x.stats.sharpe)}</td><td>${pct(x.stats.mdd,0)}</td><td class="l mu" style="white-space:normal;font-size:11px">${Object.entries(x.now||{}).filter(([k,w])=>Math.abs(w)>0.005).map(([k,w])=>`${esc(k)} ${W(w)}`).join(' · ')}</td></tr>`).join('')}</table>
      <div class="mu" style="font-size:11px;margin-top:4px">내 포트는 1년, 전략은 15년 성과라 직접 비교는 거칠다. 핵심은 변동성·낙폭 대비 수익 구조.</div></div></div>`:''}
   ${miss.length?`<div class="mu" style="margin-top:6px">인식 못 한 종목: ${esc(miss.join(', '))}</div>`:''}
   <div class="mu" style="font-size:11px;margin-top:8px;white-space:normal">현재가는 최근 종가. 수익·위험은 지금 비중을 지난 1년(${esc(days[0]||'')}~)에 그대로 적용한 가상 수익률로 계산. 미장은 원화 환산, 한국 날짜 기준 전일 미국 종가. 무위험 3%.</div>`;
}

<!-- tab_life.html — LIFE 탭 — pb-private/life/summary.json (lifeView·건강 패널).
     apps-script/Index.html 이 include('tab_life') 템플릿 태그로 끼워 넣는다 (GAS 는 HtmlService include, Pages 는 scripts/build_pages.py 가 인라인).
     전역 도우미($·esc·num·pct·render·setView·openDetail 등)는 Index.html 에 있다. -->
<script>
/* ───── LIFE: pb-private/life/summary.json (가계부·커리어·건강·목표) — 토큰으로 이 브라우저에서만 읽음, 공개 서버 경유 없음 ───── */
let LIFE=null, LIFEERR='';
function lifeView(){
  const tk=ghTok();
  if(tk&&!LIFE&&!LIFEERR) setTimeout(()=>pbGet('life/summary.json').then(t=>{ LIFE=JSON.parse(t); if(view==='life') lifeFill(); }).catch(e=>{ LIFEERR=e.message; const b=$('#lifeb'); if(b) b.innerHTML=`<div class="p c12"><div class="b dn">불러오기 실패(${esc(e.message)}) — 토큰 권한(pb-private Contents: Read) 확인 · <a href="#" onclick="LIFEERR='';render();return false">다시 시도</a></div></div>`; }),0);
  else if(LIFE) setTimeout(lifeFill,0);
  const head=`<div class="p c12"><h2>LIFE<small>가계부 · 커리어 · 건강 · 목표 · 비공개 저장소(pb-private/life)에서 이 브라우저로 직접 읽음</small></h2><div class="b mu" style="font-size:12px;white-space:normal">
    업데이트 방법: 뱅샐 내보내기 파일·운동·지원 현황은 PB에게 보내면 비공개 저장소에 반영돼요. <a href="#" onclick="LIFE=null;LIFEERR='';render();return false">새로고침</a></div></div>`;
  if(!tk) return `<div class="grid">${head}<div class="p c12"><div class="b" style="white-space:normal">이 탭은 비공개 저장소 토큰이 있어야 보여요. <a href="#" onclick="setView('my');return false">MY 탭 → 토큰 설정</a>에서 읽기 전용 토큰을 저장한 뒤 돌아오세요.</div></div></div>`;
  return `<div class="grid">${head}<div id="lifeb" style="display:contents"><div class="p c12"><div class="b mu">${LIFEERR?'불러오기 실패('+esc(LIFEERR)+') · <a href="#" onclick="LIFEERR=\'\';render();return false">다시 시도</a>':'불러오는 중…'}</div></div></div></div>`;
}
function lifeFill(){
  const S=LIFE, b=$('#lifeb'); if(!S||!b) return;
  const W=v=>v==null||isNaN(v)?'—':Math.round(v).toLocaleString('ko-KR'), M=v=>v==null?'—':(v/1e4).toLocaleString('ko-KR',{maximumFractionDigits:0})+'만',
        P=v=>v==null?'—':(v*100).toFixed(1)+'%', K=S.kpi||{}, G=S.progress_1e8||{}, A=G.assumption||{}, NW=S.net_worth||{}, PR=S.period||{};
  const bva=S.budget_vs_actual||{}, used=bva.budget_total?bva.actual_total/bva.budget_total:null;
  const bar=(p,c)=>`<div class="bar"><i style="width:${Math.max(0,Math.min(100,(p||0)*100))}%;${c?'background:var('+c+')':''}"></i></div>`;
  const tile=(t,v,s)=>`<div class="p c3"><h2>${t}</h2><div class="b"><div style="font-size:20px;font-weight:700">${v}</div><div class="mu" style="font-size:11px;white-space:normal">${s}</div></div></div>`;
  const eta=G.eta;
  const kpis=tile('저축률 (12개월)',`<span class="${K.savings_rate>=0.5?'up':'am'}">${P(K.savings_rate)}</span>`,`${esc(PR.from||'')}~${esc(PR.to||'')} · 수입 ${M(K.income_12m)} − 소비 ${M(K.spend_12m)} (이체 제외)`)+
    tile('월 평균 지출',W(K.avg_spend)+'원',`소비=지출−환불 · 월 평균 수입 ${W(K.avg_income)}원`)+
    tile(`${esc(bva.month||'')} 지출 vs 예산`,`<span class="${used>1?'dn':'up'}">${W(bva.actual_total)}</span> <span class="mu" style="font-size:13px">/ ${W(bva.budget_total)}</span>`,bar(used,used>1?'--dn':'--up')+`예산 사용 ${P(used)}`)+
    tile('순자산',W(NW.net_worth)+'원',`${esc(NW.date||'')} · 현금성 ${M(NW.cash)} · 예적금 ${M(NW.savings)} · 투자 ${M(NW.invest)}`);
  const prog=`<div class="p c12"><h2>서른 전 순자산 1억<small>목표 ${esc(G.target_date||'')}</small></h2><div class="b" style="white-space:normal">
    <div style="display:flex;gap:12px;align-items:baseline;flex-wrap:wrap"><b style="font-size:18px">${P(G.pct)}</b><span>${M(G.current)} / ${M(G.target)}</span>
    <span>예상 도달 <b class="${eta&&eta.on_track?'up':'dn'}">${eta?esc(eta.date)+' ('+eta.months+'개월)':'계산 불가'}</b> ${eta?(eta.on_track?'<span class="up">· 목표일 이전</span>':'<span class="dn">· 목표일 이후</span>'):''}</span></div>
    ${bar(G.pct)}<div class="mu" style="font-size:11px">가정: 월 저축 ${W(A.monthly_saving)}원 (${esc(A.basis||'')}) · 이체 순유출·보너스 변동은 반영 안 됨 · 순자산: ${esc(NW.note||'')}</div></div></div>`;
  // 월별 막대 (inline SVG — 테마 변수만 사용)
  const ms=S.monthly||[], mx=Math.max(1,...ms.map(m=>Math.max(m.income,m.spend,m.invest_in))), H=160, bw=100/Math.max(1,ms.length);
  const svg=`<svg viewBox="0 0 100 ${H}" preserveAspectRatio="none" style="width:100%;height:180px;display:block">`+ms.map((m,i)=>{ const x=i*bw, w=bw/4.2;
      const r=(v,k,c)=>{ v=Math.max(0,v||0); return `<rect x="${(x+bw*0.08+k*w).toFixed(2)}" y="${(H-v/mx*H).toFixed(2)}" width="${(w*0.92).toFixed(2)}" height="${(v/mx*H).toFixed(2)}" style="fill:var(${c})"><title>${m.month} ${['수입','소비','투자납입'][k]} ${W(v)}</title></rect>`; };
      return r(m.income,0,'--up')+r(m.spend,1,'--dn')+r(m.invest_in,2,'--amber'); }).join('')+`<line x1="0" x2="100" y1="${H}" y2="${H}" style="stroke:var(--line)" stroke-width="0.6"/></svg>`+
    `<div style="display:flex;font-size:10.5px" class="mu">${ms.map(m=>`<span style="flex:1;text-align:center">${m.month.slice(2).replace('-','.')}</span>`).join('')}</div>`;
  const money=`<div class="p c8"><h2>MONEY · 월별 흐름<small><span class="up">■ 수입</span> <span class="dn">■ 소비</span> <span class="am">■ 투자납입</span></small></h2><div class="b">${svg}
    <table style="margin-top:6px"><tr><th class="l">월</th><th>수입</th><th>소비</th><th>투자납입</th><th>이체(순)</th></tr>${ms.slice().reverse().map(m=>`<tr><td class="l">${m.month}</td><td>${W(m.income)}</td><td>${W(m.spend)}</td><td>${W(m.invest_in)}</td><td class="${m.transfer_net<0?'dn':'mu'}">${W(m.transfer_net)}</td></tr>`).join('')}</table></div></div>`;
  const cats=`<div class="p c4"><h2>카테고리<small>12개월 평균 vs 월예산</small></h2><div class="b"><table><tr><th class="l">카테고리</th><th>평균</th><th>예산</th><th>${esc((bva.month||'').slice(2))}</th></tr>`+
    (S.categories||[]).filter(c=>c.avg_12m||c.budget).map(c=>`<tr><td class="l">${esc(c.category)}</td><td class="${c.budget&&c.avg_12m>c.budget?'dn':''}">${W(c.avg_12m)}</td><td class="mu">${c.budget?W(c.budget):'—'}</td><td>${W(c.last_month)}</td></tr>`).join('')+
    `<tr><td class="l"><b>합계</b></td><td><b>${W(K.avg_spend)}</b></td><td class="mu">${W(K.budget_total)}</td><td>${W(K.last_month_spend)}</td></tr></table><div class="mu" style="font-size:11px;margin-top:4px;white-space:normal">빨강 = 12개월 평균이 예산 초과. 예산 합계가 실제 평균보다 크게 낮으면 예산을 현실에 맞출지 소비를 줄일지 먼저 정하기.</div></div></div>`;
  const recent=`<div class="p c12"><h2>최근 거래<small>최근 20건 · money/ledger.csv</small></h2><div class="b"><table><tr><th class="l">날짜</th><th class="l">유형</th><th class="l">카테고리</th><th class="l">상대처</th><th>금액</th><th class="l">메모</th></tr>`+
    (S.recent||[]).map(r=>`<tr><td class="l">${esc(r.date)}</td><td class="l ${r.type==='수입'||r.type==='환불'||r.type==='이자'?'up':r.type==='지출'?'dn':'mu'}">${esc(r.type)}</td><td class="l">${esc(r.category||'')}</td><td class="l">${esc(r.payee||'')}</td><td>${W(r.amount)}</td><td class="l mu" style="white-space:normal">${esc(r.memo||'')}</td></tr>`).join('')+`</table></div></div>`;
  const C=S.career||{};
  const apps=`<div class="p c6"><h2>CAREER · 지원 현황<small>${Object.entries(C.applications_by_status||{}).map(([k,v])=>esc(k)+' '+v).join(' · ')||'0건'}</small></h2><div class="b">`+
    ((C.applications||[]).length?`<table><tr><th class="l">회사</th><th class="l">직무</th><th class="l">단계</th><th class="l">다음 액션</th><th class="l">기한</th><th class="l">결과</th></tr>${C.applications.map(a=>`<tr><td class="l"><b>${esc(a['회사'])}</b></td><td class="l">${esc(a['직무'])}</td><td class="l am">${esc(a['현재단계'])}</td><td class="l">${esc(a['다음 액션'])}</td><td class="l">${esc(a['기한']||'—')}</td><td class="l">${esc(a['결과'])}</td></tr>`).join('')}</table>`:'<span class="mu">지원 기록 없음</span>')+`</div></div>`;
  const specs=`<div class="p c6"><h2>스펙 현황</h2><div class="b"><table><tr><th class="l">구분</th><th class="l">항목</th><th class="l">현재</th><th class="l">목표</th><th class="l">마감</th><th class="l">상태</th></tr>${(C.specs||[]).map(s=>`<tr><td class="l mu">${esc(s['구분'])}</td><td class="l">${esc(s['항목'])}</td><td class="l">${esc(s['현재상태'])}</td><td class="l">${esc(s['목표'])}</td><td class="l">${esc(s['마감일']||'')}</td><td class="l ${s['상태']==='완료'?'up':'am'}">${esc(s['상태'])}</td></tr>`).join('')}</table></div></div>`;
  const story=`<div class="p c12"><h2>STORY BANK<small>${C.story_bank_count||0}개 · 자소서·면접용 핵심 경험</small></h2><div class="b"><div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px">`+
    (C.story_bank||[]).map(s=>`<div style="border:1px solid var(--line);padding:8px;white-space:normal"><div class="am" style="font-weight:700">${esc(s['경험명'])}</div><div style="font-size:15px;margin:4px 0"><b>${esc(s['정량 결과'])}</b></div><div class="mu" style="font-size:12px">${esc(s['자소서 한 줄'])}</div></div>`).join('')+`</div></div></div>`;
  const Hh=S.health||{}, wk=Hh.weekly||[];

      :`<div class="mu" style="white-space:normal;padding:10px 0">기록 시작 전 — '이번 주 체중 OO, 운동 N회'를 폰 입력 폼이나 PB 대화로 보내면 기록돼요</div>`)+`</div></div>`;
  const body=lifeHealthBody(Hh);
  const fv=(g,v)=>v==null||v===''?'—':(g.unit==='원'?M(+v):isNaN(+v)?esc(v):(+v).toLocaleString('ko-KR',{maximumFractionDigits:1}));
  const goals=`<div class="p c6"><h2>GOALS<small>goals/goals.csv</small></h2><div class="b"><table><tr><th class="l">영역</th><th class="l">목표</th><th>현재</th><th>목표치</th><th class="l" style="width:22%">진행</th><th class="l">기한</th></tr>`+
    (S.goals||[]).map(g=>`<tr title="${esc(g.note||'')}"><td class="l mu">${esc(g.area||'')}</td><td class="l">${esc(g.goal)}</td><td>${fv(g,g.current)}</td><td class="mu">${fv(g,g.target)}${g.target!=null&&g.unit&&g.unit!=='원'?' '+esc(g.unit):''}</td><td class="l">${g.pct!=null?bar(g.pct)+`<span class="mu" style="font-size:10.5px">${P(g.pct)}</span>`:`<span class="mu">${esc(g.status||'')}</span>`}</td><td class="l">${esc(g.target_date||'')}</td></tr>`).join('')+`</table></div></div>`;
  b.innerHTML=kpis+prog+money+cats+recent+apps+specs+story+body+health+goals+
    `<div class="p c12"><div class="b mu" style="font-size:11px;white-space:normal">생성 ${esc(S.generated||'')} · 데이터: 비공개 저장소 life/ CSV → build_summary.py → summary.json. 이 화면은 공개 서버에 아무것도 보내지 않아요.</div></div>`;
  setTimeout(()=>lifeHealthCharts(Hh),0);
}
/* LIFE · 건강 체성분 패널 — summary.json.health(body·series·targets·weight_path·pace·workouts_weekly·lifts). 수치는 비공개 저장소에서 런타임에만 읽음 */
let LIFECH=[];
function lifeHealthBody(H){
  const B=H.body||{}, S=H.series||{}, L=H.lifts||{}, WW=H.workouts_weekly||[], T=H.targets||[], WP=H.weight_path, PC=H.pace||{};
  const f1=v=>v==null?'—':(+v).toLocaleString('ko-KR',{maximumFractionDigits:1});
  const sg=(v,good)=>{ if(v==null) return '<span class="mu">—</span>'; const c=v===0?'mu':((v<0)===(good==='down')?'up':'dn'); return `<span class="${c}">${v>0?'+':''}${f1(v)}</span>`; };
  const bar=(p,c)=>`<div class="bar"><i style="width:${Math.max(0,Math.min(100,(p||0)*100))}%;${c?'background:var('+c+')':''}"></i></div>`;
  const keys=[['fat_kg','체지방량','kg','down'],['smm','골격근량','kg','up'],['fat_pct','체지방률','%','down'],['visceral_area','내장지방면적','cm²','down'],['weight','체중','kg','down']];
  const any=keys.some(k=>B[k[0]]);
  const forms=`<a href="https://github.com/hk99915-bot/pb-private/issues/new?template=health.yml" target="_blank" rel="noopener">주간 입력(체중·운동·음주)</a> · <a href="https://github.com/hk99915-bot/pb-private/issues/new?template=inbody.yml" target="_blank" rel="noopener">인바디 입력</a>`;
  const tiles=keys.map(([k,lab,u,good])=>{ const m=B[k]; return `<div style="border:1px solid var(--line);padding:8px;min-width:0"><div class="mu" style="font-size:11px">${lab}</div><div style="font-size:18px;font-weight:700">${m?f1(m.latest):'—'}<span class="mu" style="font-size:11px"> ${u}</span></div><div style="font-size:11px">직전 ${sg(m&&m.d_prev,good)} · 4주 ${sg(m&&m.d_4w,good)}</div><div class="mu" style="font-size:10.5px">${m?esc(m.date)+' · '+m.n+'회':'기록 없음'}</div></div>`; }).join('');
  const stc=s=>s==='달성'||s==='유지 중'?'up':s==='실패'||s==='목표 아래'?'dn':s==='미달'?'am':'mu';
  const tgt=T.length?`<table><tr><th class="l">Q4 목표 (${esc((T[0]||{}).deadline||'')})</th><th>기준선</th><th>현재</th><th>목표</th><th>실패선</th><th class="l" style="width:24%">진행</th><th class="l">상태</th></tr>${T.map(t=>`<tr title="${esc(t.note||'')}"><td class="l">${esc(t.label)}${t.metric==='weight'?' <span class="mu" style="font-size:10.5px">(결과 지표)</span>':''}</td><td class="mu">${f1(t.baseline)}</td><td><b>${f1(t.latest)}</b></td><td>${t.metric==='visceral_area'?'&lt; '+f1(Math.ceil(t.target)):(t.direction==='up'?'≥ ':'≤ ')+f1(t.target)}</td><td class="mu">${t.fail==null?'—':f1(t.fail)}</td><td class="l">${t.pct==null?'':bar(t.pct,t.direction==='up'?(t.pct<0.5?'--amber':'--up'):'')+`<span class="mu" style="font-size:10.5px">${t.direction==='up'?'여유 ':''}${(t.pct*100).toFixed(0)}%</span>`}</td><td class="l ${stc(t.status)}">${esc(t.status||'—')}</td></tr>`).join('')}</table>`:'';
  const path=WP?`체중 기준 경로 ${f1(WP.from[1])}→${f1(WP.to[1])} (주 ${f1(WP.per_week)}kg) · 오늘 기준 ${f1(WP.ref_today)}kg · 최근 측정은 경로 대비 ${sg(WP.gap,'down')}kg`:'';
  const pace=`<div style="white-space:normal;font-size:12px;margin-top:6px"><span class="${PC.flag?'dn':'mu'}">● ${esc(PC.rule||'')}</span> &nbsp; <span class="${PC.smm_per_month!=null&&PC.smm_per_month<-0.5?'dn':'mu'}">● ${esc(PC.smm_rule||'')}</span><br><span class="mu">${path}</span></div>`;
  const mx=Math.max(4,...WW.map(w=>w.count||0)), y3=(38-3/mx*36).toFixed(1);
  const bars=`<svg viewBox="0 0 120 40" preserveAspectRatio="none" style="width:100%;height:56px;display:block">`+WW.map((w,i)=>{ const v=w.count||0, h=v/mx*36; return `<rect x="${i*10+1}" y="${(38-h).toFixed(1)}" width="8" height="${h.toFixed(1)}" style="fill:var(${v>=3?'--up':'--amber'})"><title>${esc(w.week)} 주 운동 ${w.count==null?'기록 없음':w.count+'회'}</title></rect>`; }).join('')+`<line x1="0" x2="120" y1="${y3}" y2="${y3}" style="stroke:var(--muted)" stroke-width="0.4" stroke-dasharray="2 2"/></svg>`;
  const alc=`<div style="display:flex;gap:2px">`+WW.map(w=>{ const a=w.alcohol_days, lim=w.alcohol_target, over=a!=null&&lim!=null&&a>lim; return `<div title="${esc(w.week)} 주 음주 ${a==null?'기록 없음':a+'일'}${lim==null?'':' · 한도 '+lim}" style="flex:1;text-align:center;font-size:11px;padding:2px 0;border:1px solid var(--line)" class="${a==null?'mu':over?'dn':'up'}">${a==null?'·':a}</div>`; }).join('')+`</div>`;
  const spark=pts=>{ if(!pts||pts.length<2) return ''; const v=pts.map(p=>p[1]), lo=Math.min(...v), hi=Math.max(...v), r=hi-lo||1; return `<svg viewBox="0 0 60 16" style="width:60px;height:16px;vertical-align:middle"><polyline fill="none" style="stroke:var(--amber)" stroke-width="1.2" points="${v.map((x,i)=>(i/(v.length-1)*60).toFixed(1)+','+(15-(x-lo)/r*14).toFixed(1)).join(' ')}"/></svg>`; };
  const lifts=Object.entries(L).sort((a,b)=>b[1].sessions-a[1].sessions);
  const liftT=lifts.length?`<table><tr><th class="l">종목</th><th>최근 e1RM</th><th>4주</th><th>최고</th><th>세션</th><th class="l">추세</th></tr>${lifts.map(([n,x])=>`<tr><td class="l">${esc(n)}</td><td><b>${f1(x.latest)}</b></td><td>${sg(x.d_4w,'up')}</td><td class="mu">${f1(x.best)}</td><td class="mu">${x.sessions}</td><td class="l">${spark(x.series)}</td></tr>`).join('')}</table>`
    :`<div class="mu" style="white-space:normal;font-size:12px">세트 기록 없음 — '스쿼트 60×8×3' 처럼 PB 대화로 보내면 e1RM(무게×(1+반복/30)) 추세가 떠요. 감량기엔 e1RM 유지 = 근육 지키는 중.</div>`;
  const hasSeries=(S.weight||[]).length+(S.smm||[]).length+(S.fat_kg||[]).length>0;
  return `<div class="p c12"><h2>HEALTH · Q4 체성분<small>목표: 체지방량↓ · 골격근량 유지 · 기록은 폰 폼이 원본(브라우저 메모는 기기 바뀌면 사라짐) · ${forms}</small></h2><div class="b" style="white-space:normal">`+
    (any?`<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:6px">${tiles}</div>`:`<div class="mu" style="padding:6px 0">측정값 없음 — ${forms}</div>`)+
    `<div style="overflow-x:auto;margin-top:8px">${tgt}</div>`+pace+
    (hasSeries?`<div id="lhc1" style="margin-top:8px;height:240px"></div><div id="lhc1l" class="mu" style="font-size:11px"></div>`:'')+
    `<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px;margin-top:10px"><div><div class="mu" style="font-size:11px">주간 운동 (최근 12주 · 점선 = 주 3회) · 4주 평균 ${H.workouts_avg4==null?'—':(+H.workouts_avg4).toFixed(1)}회</div>${bars}<div class="mu" style="font-size:11px;margin-top:6px">주간 음주 일수 (빨강 = 그 주 한도 초과 · 한도는 비공개 targets.csv)</div>${alc}</div><div style="overflow-x:auto">${liftT}</div></div>`+
    `</div></div>`;
}
function lifeHealthCharts(H){
  LIFECH.forEach(c=>{try{c.remove();}catch(e){}}); LIFECH=[];
  const el=$('#lhc1'); if(!el||!H||!window.LightweightCharts) return;
  const S=H.series||{}, WP=H.weight_path, cs=getComputedStyle(document.documentElement), cv=n=>(cs.getPropertyValue(n)||'').trim()||'#888';
  const c=LightweightCharts.createChart(el,{width:el.clientWidth,height:240,layout:{background:{type:'solid',color:cv('--panel')},textColor:cv('--muted'),fontSize:11},
    grid:{vertLines:{color:cv('--line')},horzLines:{color:cv('--line')}},rightPriceScale:{borderColor:cv('--line'),visible:true},leftPriceScale:{borderColor:cv('--line'),visible:true},
    timeScale:{borderColor:cv('--line')},crosshair:{mode:0},handleScroll:{vertTouchDrag:false},localization:{locale:'ko-KR',priceFormatter:v=>v.toFixed(1)}});
  LIFECH.push(c);
  const add=(pts,color,scale,w,style,markers)=>{ if(!pts||!pts.length) return; const s=c.addLineSeries({color,lineWidth:w,lineStyle:style||0,priceScaleId:scale,priceLineVisible:false,lastValueVisible:markers!==false,pointMarkersVisible:markers!==false});
    const seen={}; s.setData(pts.filter(p=>p[1]!=null&&!seen[p[0]]&&(seen[p[0]]=1)).map(p=>({time:p[0],value:+p[1]}))); return s; };
  if(WP) add([WP.from,WP.to],cv('--muted'),'right',1,2,false);
  add(S.weight,cv('--amber'),'right',2); add(S.smm,cv('--up'),'left',2); add(S.fat_kg,cv('--dn'),'left',2,2);
  c.timeScale().fitContent();
  const l=$('#lhc1l'); if(l) l.innerHTML=`<span style="color:var(--amber)">━ 체중</span> <span class="mu">┅ 기준 경로 (오른쪽 축)</span> &nbsp; <span style="color:var(--up)">━ 골격근량</span> &nbsp; <span style="color:var(--dn)">┅ 체지방량</span> <span class="mu">(왼쪽 축, kg) · 인바디는 4주 추세로만 판단</span>`;
}

<!-- tab_research.html — RESEARCH 탭 — 리서치 리포트·애널리스트·밸류에이션 바스켓·공시 (repView·valView·dartView).
     apps-script/Index.html 이 include('tab_research') 템플릿 태그로 끼워 넣는다 (GAS 는 HtmlService include, Pages 는 scripts/build_pages.py 가 인라인).
     전역 도우미($·esc·num·pct·render·setView·openDetail 등)는 Index.html 에 있다. -->
<script>
let DS=null, DV={c:'ALL',q:'',d:7};
const FLAGC={'희석':'dn','주의':'dn','정정':'mu'};
function discTable(rows,withName){ return `<table><tr><th class="l">날짜</th>${withName?'<th class="l">종목</th>':''}<th class="l">유형</th><th class="l">공시</th></tr>${rows.map(r=>`<tr><td class="l mu">${r.date}</td>${withName?`<td class="l am sym" data-sym="${esc(r.code)}" data-mk="KR">${esc(r.name)}</td>`:''}<td class="l">${esc(r.category)}${r.flag?` <b class="${FLAGC[r.flag]||'am'}">${esc(r.flag)}</b>`:''}</td><td class="l"><a href="${esc(r.link)}" target="_blank">${esc(r.title)}</a></td></tr>`).join('')}</table>`; }
function dartView(){
  if(!DS){ google.script.run.withSuccessHandler(t=>{try{DS=JSON.parse(t);}catch(e){DS={items:[]};} if(view==='dart') render();}).withFailureHandler(e=>{DS={items:[],err:'공시 데이터가 아직 없습니다 (DART_API_KEY 설정 후 다음 자동 실행 때 생성)'}; if(view==='dart') render();}).getDisclosures(); return '<div class="load">LOADING …</div>'; }
  const cats=['ALL','⚠ 주의·희석',...new Set((DS.items||[]).map(r=>r.category))];
  const b=(k,v,l)=>`<button class="${DV[k]===v?'on':''}" onclick="DV['${k}']=${typeof v==='number'?v:`'${v}'`};render()">${l}</button>`;
  return `<div class="grid"><div class="p c12"><h2>DART 주요 공시<span class="ctab">${[1,3,7,30].map(d=>b('d',d,d+'D')).join('')}</span><small id="dcnt"></small></h2><div class="b">
   <div class="ctab" style="margin:0 0 8px 0;display:flex;flex-wrap:wrap;gap:4px">${cats.map(c=>b('c',c,c==='ALL'?'전체':c)).join('')}</div>
   <input class="rq" placeholder="종목 · 공시 제목 검색" value="${esc(DV.q)}" oninput="DV.q=this.value;dartFill()">${DS.err?`<div class="mu">${esc(DS.err)}</div>`:''}<div id="dbody"></div></div></div></div>`;
}
function dartFill(){ const b=$('#dbody'); if(!b||!DS) return; const cut=new Date(Date.now()-DV.d*864e5+9*36e5).toISOString().slice(0,10), q=DV.q.trim().toLowerCase();
  const it=(DS.items||[]).filter(r=>r.date>=cut&&(DV.c==='ALL'||(DV.c==='⚠ 주의·희석'?(r.flag==='주의'||r.flag==='희석'):r.category===DV.c))&&(!q||[r.name,r.code,r.title,r.category].join(' ').toLowerCase().includes(q)));
  b.innerHTML=it.length?discTable(it.slice(0,500),true):'<div class="mu">해당 공시 없음</div>'; const c=$('#dcnt'); if(c) c.textContent=`${it.length}건 · 기준 ${DS.asof||''}`; }
let AN=null;
function loadAnalysts(cb){ if(AN) return cb&&cb(); google.script.run.withSuccessHandler(t=>{try{AN=JSON.parse(t);}catch(e){AN={analysts:{}};} cb&&cb();}).withFailureHandler(()=>{AN={analysts:{}}; cb&&cb();}).getAnalysts(); }
const normB=b=>String(b||'').replace(/\s|\(주\)|증권|투자|금융|주식회사/g,'');   // research._norm_broker 와 동일
function anBadge(r){
  if(!r.analyst) return '';
  const a=AN&&AN.analysts&&(AN.analysts[normB(r.broker)+'|'+r.analyst]);
  if(!a) return ` <span class="mu">${esc(r.analyst)}</span>`;
  const st=[]; if(a.n60>=((AN.meta||{}).min_n||8)) st.push(`매수 적중 ${(a.hit60_buy*100).toFixed(0)}% (n=${a.n60}, 60일 초과수익 ${(a.exc60_buy>0?'+':'')+(a.exc60_buy*100).toFixed(1)}%)`); else st.push(`표본 부족 (n=${a.n})`);
  if(a.tp_hit!=null&&a.n_tp>=5) st.push(`목표가 도달 ${(a.tp_hit*100).toFixed(0)}%`);
  if(a.upside_med!=null) st.push(`평균 여력 ${(a.upside_med*100).toFixed(0)}%`);
  return ` <span class="an" title="${esc((a.style||[]).join(' · '))}">${esc(r.analyst)}<i>${esc(st.join(' · '))}${(a.style||[]).length?' · '+esc(a.style.join(' · ')):''}</i></span>`;
}
let VAL=null;
function valView(){   // 반도체 밸류에이션 바스켓 (reports/valuation.json) — 비율만, 참고 등급, 매매 트리거 아님
  if(VAL===null){ VAL=false; google.script.run.withSuccessHandler(t=>{try{VAL=JSON.parse(t);}catch(e){VAL={};} if(view==='val') render();}).withFailureHandler(e=>{VAL={err:/404/.test(e.message)?'밸류에이션 데이터가 아직 없습니다 (다음 자동 실행 때 생성)':e.message}; if(view==='val') render();}).getValuation(); return '<div class="load">LOADING …</div>'; }
  if(!VAL||!VAL.rows) return `<div class="grid"><div class="p c12"><h2>밸류에이션</h2><div class="b">${VAL&&VAL.err?`<div class="err">${esc(VAL.err)}</div>`:'<div class="mu">—</div>'}</div></div></div>`;
  const B=VAL.basket||{}, RT=VAL.rates||{}, D=B.decomp20||{}, S=B.rate_sens||{};
  const f=(x,d=1,s='')=>x==null?'—':Number(x).toFixed(d)+s;
  const trend=r=>{ if(!r.n_quarters) return '<span class="mu">재무 없음</span>'; const om=(r.op_margin_4q||[]).filter(x=>x!=null); const ar=om.length>=2?(om[om.length-1]>om[0]+0.01?'↑':om[om.length-1]<om[0]-0.01?'↓':'→'):'';
    return `${r.rev_yoy!=null?'매출 '+pct(r.rev_yoy,0):'<span class="mu">매출 —</span>'} · OPM ${ar}${om.length?(om[om.length-1]*100).toFixed(0)+'%':''}${r.ocf_ni!=null?' · OCF/NI '+f(r.ocf_ni,1):''}`; };
  const rows=VAL.rows.map(r=>`<tr><td class="l"><span class="sym am" data-sym="${esc(r.sym)}" data-mk="${r.mk}" style="cursor:pointer">${esc(r.name)}</span>${r.verified?'':' <span class="mu" title="분기 4개 미만 또는 데이터 없음">⚠검증전</span>'}</td><td>${r.loss?'적자':f(r.per,1)} / ${f(r.pbr,2)}</td><td class="l mu">${trend(r)}</td><td>${pct(r.rate_adj)}</td></tr>`).join('');
  const top=a=>(a||[]).map(x=>`${esc(x.name)} ${pct(x.rate_adj)}`).join(' / ')||'—';
  return `<div class="grid">
   <div class="p c12"><h2>반도체 밸류에이션 바스켓<small>${esc(VAL.asof)} · 검증 ${B.n_verified||0}/${B.n||0} · ${esc(VAL.grade||'')}</small></h2><div class="b">
    <div class="mu" style="margin-bottom:6px">중앙 PER ${f(B.median_per,1)} · PBR ${f(B.median_pbr,2)} · 미 10Y ${f(RT.us10y,2,'%')} (5일 ${f(RT.us10y_w1_bp,0,'bp')}) · 국고 3Y ${f(RT.kr3y,2,'%')} (5일 ${f(RT.kr3y_w1_bp,0,'bp')})</div>
    <table><tr><th class="l">종목</th><th>PER/PBR</th><th class="l">이익추세</th><th>금리조정 매력</th></tr>${rows}</table>
    <div class="mu" style="margin-top:6px">금리조정 매력 상위: ${top(B.cheapest)} · 하위: ${top(B.richest)}</div>
    <div class="mu">20일 분해(중앙): 가격 ${pct(D.d_price)} = 멀티플 ${pct(D.d_multiple)} + EPS ${pct(D.d_eps)} · ${esc(D.basis||'')}</div>
    <div class="mu">금리 ±${S.bp||25}bp → 중앙 PER ${pct(S.up)} / ${pct(S.down)} · ${esc(S.formula||'')}</div>
    <div class="mu">다음 이벤트: ${((VAL.events||{}).next||[]).slice(0,4).map(e=>`${esc(e.date.slice(5))} ${esc(e.name)}`).join(' · ')||'—'} · 발동선: ${((VAL.events||{}).tripwires||[]).filter(t=>t.date).slice(0,3).map(t=>`${esc(t.date.slice(5))} ${esc(t.name)}`).join(' · ')}</div>
    <div class="mu" style="margin-top:4px">📎 비율만 · 금리조정 매력 = E/P − 무위험(US 미10Y, KR 국고3Y) · 매매 트리거 아님</div>
   </div></div></div>`;
}
let R=null, RV={m:'theme',d:30,q:''};
function repView(){
  if(!AN) loadAnalysts(()=>{ if(view==='rep'&&R) repFill(); });
  if(!R){ google.script.run.withSuccessHandler(t=>{try{R=JSON.parse(t);}catch(e){R={items:[],close:{}};} if(view==='rep') render();}).withFailureHandler(e=>{R={items:[],close:{},err:/404/.test(e.message)?'리서치 데이터가 아직 생성되지 않았습니다 (다음 자동 실행 때 생성)':e.message}; if(view==='rep') render();}).getResearch(); return '<div class="load">LOADING …</div>'; }
  const btn=(k,v,l)=>`<button class="${RV[k]===v?'on':''}" onclick="RV['${k}']=${typeof v==='number'?v:`'${v}'`};render()">${l}</button>`;
  return `<div class="grid"><div class="p c12"><h2>RESEARCH<span class="ctab">${btn('m','theme','테마별')}${btn('m','sector','업종별')}${btn('m','stock','종목별')}${btn('m','all','전체')}</span><span class="ctab">${[7,30,90,180].map(d=>btn('d',d,d+'D')).join('')}</span><small id="rcnt"></small></h2>
   <div class="b"><input id="rq" class="rq" placeholder="종목 · 증권사 · 섹터 · 제목 검색" value="${esc(RV.q)}" oninput="RV.q=this.value;repFill()">${R.err?`<div class="err">${esc(R.err)}</div>`:''}<div id="rbody"></div></div></div></div>`;
}
function repFill(){ const b=$('#rbody'); if(!b||!R) return; const it=repFilter(); b.innerHTML=repBody(it); const c=$('#rcnt'); if(c) c.textContent=`${it.length}건 · ${new Set(it.map(r=>r.code)).size}종목 · 기준 ${R.asof||''}`; }
function repFilter(){ const cut=new Date(Date.now()-RV.d*864e5+9*36e5).toISOString().slice(0,10), q=RV.q.trim().toLowerCase();
  return (R.items||[]).filter(r=>r.date>=cut&&(!q||[r.name,r.code,r.broker,r.sector,r.theme,r.analyst,r.title].join(' ').toLowerCase().includes(q))); }
function stockAgg(items){ const m=new Map(); for(const r of items){ if(!m.has(r.code)) m.set(r.code,{code:r.code,name:r.name,sector:r.sector||'기타',theme:r.theme||r.sector||'기타',rs:[]}); m.get(r.code).rs.push(r);}
  return [...m.values()].map(s=>{ s.rs.sort((a,b)=>b.date.localeCompare(a.date)); const lb=new Map(); for(const r of s.rs) if(r.target&&!lb.has(r.broker)) lb.set(r.broker,r.target);
    const tp=med([...lb.values()]), c=(R.close||{})[s.code]; return {...s,n:s.rs.length,nb:new Set(s.rs.map(r=>r.broker)).size,last:s.rs[0],tp,close:c,up:(tp&&c)?tp/c-1:null}; })
   .sort((a,b)=>b.n-a.n||b.last.date.localeCompare(a.last.date)); }
const BUYR=/buy|매수|outperform|overweight|비중확대|strong/i, SELLR=/sell|매도|underperform|underweight|비중축소|reduce/i;
function coreView(s){
  const lb=new Map(); for(const r of s.rs) if(!lb.has(r.broker)) lb.set(r.broker,r);
  const L=[...lb.values()], tps=L.map(r=>r.target).filter(Boolean);
  const b=L.filter(r=>BUYR.test(r.opinion||'')).length, se=L.filter(r=>SELLR.test(r.opinion||'')).length, h=L.length-b-se;
  const up=s.rs.filter(r=>r.tp_chg>0.001).length, dn=s.rs.filter(r=>r.tp_chg<-0.001).length;
  const parts=[`${L.length}곳`, [b?`매수 ${b}`:'',h?`중립·기타 ${h}`:'',se?`매도 ${se}`:''].filter(Boolean).join(' / ')];
  if(tps.length) parts.push(`TP ${num(Math.min(...tps))}${tps.length>1?'~'+num(Math.max(...tps)):''}${s.up!=null?` (${(s.up*100>0?'+':'')+(s.up*100).toFixed(0)}%)`:''}`);
  if(up||dn) parts.push(`목표가 ${up?'상향 '+up:''}${up&&dn?' · ':''}${dn?'하향 '+dn:''}`);
  const tn={}; for(const r of L) if(r.tone) tn[r.tone]=(tn[r.tone]||0)+1;
  const tl=Object.entries(tn).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`${k} ${v}`).join(', '); if(tl) parts.push(`톤: ${tl}`);
  return parts.filter(Boolean).join(' · ');
}
function repLine(r){
  const ch=r.tp_chg>0.001?` <span class="up">↑${(r.tp_chg*100).toFixed(0)}%</span>`:r.tp_chg<-0.001?` <span class="dn">↓${(r.tp_chg*100).toFixed(0)}%</span>`:'';
  const op=r.op_chg>0?' <span class="up">의견↑</span>':r.op_chg<0?' <span class="dn">의견↓</span>':'';
  const TC={'낙관':'up','긍정(유지)':'up','신중한 매수':'am','사실상 중립':'am','중립':'mu','사실상 매도':'dn','매도':'dn','의견 없음':'mu'};
  const tone=r.tone?`<span class="tone ${TC[r.tone]||'mu'}">${esc(r.tone)}${r.tone_why?` <i>${esc(r.tone_why)}</i>`:''}</span>`:'';
  const ev=(r.evidence||[]).map(x=>`<li>${esc(x)}</li>`).join('');
  const showThesis=r.thesis&&r.thesis!==r.title&&!r.view;   // 제목과 같은 '논지'는 정보가 없어 숨김
  const body=(r.view||showThesis||ev||r.risk||r.method)?`<div class="sm">${r.view?`<div><span class="k">핵심</span><b>${esc(r.view)}</b></div>`:''}${showThesis?`<div><span class="k">논지</span>${esc(r.thesis)}</div>`:''}${ev?`<div><span class="k">근거</span><ul>${ev}</ul></div>`:''}${r.risk?`<div><span class="k">변수</span>${esc(r.risk)}</div>`:''}${r.method?`<div><span class="k">밸류</span>${esc(r.method)}</div>`:''}</div>`:(r.summary&&r.summary!=='-'?`<div class="sm">${esc(r.summary)}</div>`:'');
  return `<div class="rp"><div><span class="mu">${r.date}</span> <b>${esc(r.broker)}</b>${anBadge(r)} · ${esc(r.opinion||'—')} · TP ${r.target?num(r.target):'—'}${ch}${op} ${tone}</div><div class="rt">${r.link?`<a href="${esc(r.link)}" target="_blank">${esc(r.title||'원문')}</a>`:esc(r.title||'')}${r.curated?'':' <span class="mu">· 자동 요약</span>'}</div>${body}</div>`;
}
function stockRows(ss,showSec){ if(!ss.length) return '<div class="mu">해당 기간 리포트 없음</div>';
  return `<table><tr><th></th><th class="l">종목</th>${showSec?'<th class="l">섹터</th>':''}<th class="l">핵심 뷰</th><th class="l">최근</th><th>종가</th></tr>${ss.map(s=>`<tr><td class="tg" title="증권사별 요약 펼치기">▸</td><td class="l am sym" data-sym="${esc(s.code)}" data-mk="KR">${esc(s.name)} <span class="mu">${esc(s.code)}</span></td>${showSec?`<td class="l mu">${esc(s.sector)}</td>`:''}<td class="l">${coreView(s)}</td><td class="l mu">${s.last.date}</td><td>${s.close?num(s.close):'—'}</td></tr><tr class="sub"><td></td><td colspan="${showSec?5:4}">${s.rs.map(repLine).join('')}</td></tr>`).join('')}</table>`; }
function repBody(it){
  if(RV.m==='all') return it.length?`<table><tr><th class="l">날짜</th><th class="l">종목</th><th class="l">섹터</th><th class="l">증권사</th><th class="l">의견</th><th>TP</th><th class="l">제목</th></tr>${it.map(r=>`<tr><td class="l mu">${r.date}</td><td class="l am sym" data-sym="${esc(r.code)}" data-mk="KR">${esc(r.name)}</td><td class="l mu">${esc(r.sector||'기타')}</td><td class="l">${esc(r.broker)}</td><td class="l">${esc(r.opinion||'')}</td><td>${r.target?num(r.target):'—'}</td><td class="l">${r.link?`<a href="${esc(r.link)}" target="_blank">${esc(r.title||'리포트')}</a>`:esc(r.title||'')}</td></tr>`).join('')}</table>`:'<div class="mu">해당 기간 리포트 없음</div>';
  const ss=stockAgg(it);
  if(RV.m==='stock') return stockRows(ss,true);
  const gk=RV.m==='theme'?'theme':'sector';
  const g=new Map(); for(const s of ss){ if(!g.has(s[gk])) g.set(s[gk],[]); g.get(s[gk]).push(s); }
  const tot=a=>a.reduce((x,s)=>x+s.n,0);
  return [...g.entries()].sort((a,b)=>tot(b[1])-tot(a[1])).map(([sec,a])=>`<details open class="sec"><summary><b class="am">${esc(sec)}</b> <span class="mu">${tot(a)}건 · ${a.length}종목</span></summary>${stockRows(a,false)}</details>`).join('')||'<div class="mu">해당 기간 리포트 없음</div>'; }
document.addEventListener('click',e=>{const t=e.target.closest('td.tg'); if(!t) return; const sub=t.parentElement.nextElementSibling; if(sub&&sub.classList.contains('sub')){sub.classList.toggle('on'); t.textContent=sub.classList.contains('on')?'▾':'▸';}});
</script>

<!-- tab_quant.html — QUANT 탭 — 공급망·시그널 검증·검증 스터디·전략 연구소·모멘텀·모의 포트폴리오 (chainView·sigView·studyView·labView·momView·pfView).
     apps-script/Index.html 이 include('tab_quant') 템플릿 태그로 끼워 넣는다 (GAS 는 HtmlService include, Pages 는 scripts/build_pages.py 가 인라인).
     전역 도우미($·esc·num·pct·render·setView·openDetail 등)는 Index.html 에 있다. -->
<script>
let PF=null, PFSEL=null;
let STU=null;

  if(!STU||!STU.drop_days) return '<div class="grid"><div class="p c12"><div class="b mu">스터디 결과 없음</div></div></div>';

  const H='<th>평균</th><th>중앙</th><th>상승</th><th>최악</th>';

  const blk=(title,k)=>`<div class="am" style="font-size:12px;margin:10px 0 2px">${title}</div><table><tr><th class="l">조건</th><th>횟수</th>${H}</tr>
     ${row('모든 날 (기준)',{days:(B[k]||{}).n,[k]:B[k]},k)}
     ${Object.entries(STU.drop_days).map(([t,o])=>row(`코스피 ${t} 이하 하락일`,o,k)).join('')}
     ${Object.entries(STU.conditional).map(([t,o])=>row(t.replace('_',' '),o,k)).join('')}
     ${row('5일 안에 두 번째 −5%',STU['cluster_(5일 내 두 번째 −5%)'],k)}</table>`;
  const lv=STU.lev_trade||{};

    <div class="mu" style="font-size:12px;line-height:1.7;white-space:normal">급락일 종가 대비 이후 코스피 수익률. '20일 −15% 이상 하락 중'은 이미 크게 빠진 상태에서 또 −5% 급락한 날(예: 2026-10-15).</div>
    ${blk('다음날','d1')}${blk('5거래일 뒤','d5')}${blk('20거래일 뒤','d20')}
    <div class="am" style="font-size:12px;margin:12px 0 2px">KODEX 레버리지(122630) 급락일 종가 매수 시뮬레이션 · 왕복비용 0.05%</div>
    ${Object.entries(lv).map(([t,o])=>`<div class="mu" style="font-size:12px;margin-top:4px">${esc(t)}</div><table><tr><th class="l">매도</th><th>횟수</th>${H}</tr>${Object.entries(o).map(([k,x])=>`<tr><td class="l">${esc(k)}</td><td class="mu">${x?x.n:''}</td>${f(x)}</tr>`).join('')}</table>`).join('')}
    <div class="mu" style="font-size:11px;margin-top:8px;white-space:normal">해석: 반등 경향은 있지만 레버리지 기준 평균 +2~3%, 최악은 다음날 시가부터 −18%. 다음날 시가 매도가 종가 매도보다 승률이 높았음. 표본의 상당수가 2020·2026년에 몰려 있음.</div>
  </div></div></div>`;
}
let LAB=null;
function labView(){
  if(LAB===null){ LAB=false; google.script.run.withSuccessHandler(t=>{try{LAB=JSON.parse(t);}catch(e){LAB={};} if(view==='lab') render();}).withFailureHandler(()=>{LAB={};if(view==='lab') render();}).getLab(); return '<div class="load">LOADING …</div>'; }
  if(!LAB||!LAB.results) return '<div class="grid"><div class="p c12"><div class="b mu">전략 연구소 결과 없음 — 주간 실행 전</div></div></div>';
  const gc=g=>g==='A'?'var(--up)':g==='B'?'var(--amber)':g==='C'?'var(--muted)':'var(--dn)';
  const T=x=>x==null?'—':x.toFixed(1), N=x=>x==null?'—':x;
  const reg=LAB.registry||[], byId=Object.fromEntries(reg.map(r=>[r.id,r]));
  const SPL=['IS','OOS','HOLDOUT'];
  // 구버전 lab.json (variants 없음) 호환
  const varsOf=r=>r.variants?Object.values(r.variants):[{entry:'open',label:'다음날 시가 진입',grade:r.grade,reasons:r.reasons,splits:Object.fromEntries(SPL.map(k=>[k,{ew:(r.splits||{})[k]||{}}]))}];
  const ex=d=>d&&d.n?`${pct(d.mean_ex,2)}<div class="mu" style="font-size:10px">t ${T(d.t)}</div>`:'<span class="mu">—</span>';
  const cell=sp=>{const e=(sp||{}).ew, k=(sp||{}).kospi, n=(k&&k.n)||(e&&e.n)||0; return `<td>${e?ex(e):'<span class="mu">—</span>'}</td><td>${ex(k)}</td><td class="mu">${n||'—'}</td>`;};
  const rows=Object.entries(LAB.results).map(([id,r])=>{ const g=byId[id]||{}, vs=varsOf(r);
    const isNew=g.registered&&g.registered!==(reg[0]||{}).registered;
    const sig=r.last_signals?`<div style="font-size:11px">신호 ${esc(r.last_signals.date)}: ${r.last_signals.picks.slice(0,12).map(p=>`<span class="am sym" data-sym="${esc(p.s)}" data-mk="KR">${esc(p.n)}</span>`).join(' · ')}</div>`:'';
    const st=r.state?`<div style="font-size:11px">현재 ${esc(r.state.date)} 12개월 ${pct(r.state.k12m,1)} → <b class="am">${r.state.hold?'지수 보유':'현금'}</b></div>`:'';
    const ev=r.n_events!=null?`<div class="mu" style="font-size:10px">이벤트 전체 ${r.n_events}회 · 최근 ${esc((r.events||[]).slice(-3).join(', '))}</div>`:'';
    return vs.map((v,i)=>{ const I=(v.splits.IS||{}).ew||(v.splits.IS||{}).kospi||{}, by=v.grade_by||{};
      const head=i===0?`<td class="l" rowspan="${vs.length}" title="${esc(g.hypothesis||'')}"><b>${esc(g.name||id)}</b>${isNew?' <span class="tag">신규 '+esc(g.registered.slice(5))+'</span>':''}<div class="mu" style="font-size:10px">${esc(id)} · 보유 ${g.hold}일 · 주 기준 ${esc(g.bench||'EW')}</div>${ev}${sig}${st}</td>`:'';
      return `<tr>${head}<td class="l" style="font-size:11px">${esc(v.label||v.entry)}${v.posthoc?' <span class="mu" title="첫 결과를 본 뒤 추가한 변형 — 관문 m 에 포함">(사후)</span>':''}</td>
      <td><b style="color:${gc(v.grade)};font-size:15px">${v.grade}</b><div class="mu" style="font-size:10px">${by.ew?'EW '+by.ew+' · ':''}${by.kospi?'K '+by.kospi:''}</div></td>${SPL.map(k=>cell(v.splits[k])).join('')}
      <td>${I.hit!=null?Math.round(I.hit*100)+'%':'—'}</td><td class="mu">${N(I.payoff)}</td>
      <td class="l mu" style="font-size:11px;white-space:normal;min-width:220px">${(v.reasons||[]).map(esc).join('<br>')}</td></tr>`; }).join(''); }).join('');
  const wait=reg.filter(r=>!(r.id in LAB.results));
  const gate=LAB.gate||{}, bi=LAB.bench_info||{}, kc=bi.kospi_check||{};
  const yr=(kc.yearly||[]);
  const bench=bi.kospi_method?`<div class="p c12"><h2>비교 기준 2개<small>EW = 유동성 유니버스 동일가중 · KOSPI = 코스피 프록시</small></h2><div class="b" style="white-space:normal;font-size:12px;line-height:1.7">

    <div class="mu">${esc(bi.kospi_method)}</div>

    ${yr.length?`<div>연도별 (프록시 / 실제 코스피 연말 종가): ${yr.map(x=>`${x.y} ${pct(x.proxy,0)}/${pct(x.kospi,0)}`).join(' · ')} → 평균 연 <b class="${kc.drift_ann<0?'dn':'up'}">${(kc.drift_ann*100).toFixed(1)}%p</b> 어긋남</div>`:''}
    ${bi.overnight_bp?`<div>하루 평균 (bp): 밤사이(전일 종가→시가) EW ${bi.overnight_bp.ew} · KOSPI ${bi.overnight_bp.kospi} / 장중(시가→종가) EW ${bi.intraday_bp.ew} · KOSPI ${bi.intraday_bp.kospi} — 장중이 음수라 '다음날 시가 진입'은 첫날 장중 손실을 그대로 떠안는다</div>`:''}
    <div class="mu">주의: 원주가 데이터에 ±45% 넘는 갭만 수정 반영 → 유상증자 권리락·작은 무상증자는 하락으로 남아 두 기준 모두 실제보다 낮게 나온다(같은 데이터를 쓰는 전략도 같은 영향을 받음).</div>
  </div></div>`:'';
  const dm=((LAB.results.DUAL_MOMENTUM_INDEX||{}).variants||{}).open;
  const dmp=dm&&dm.path?`<div class="p c12"><h2>지수 절대모멘텀 — 수익·낙폭<small>20거래일 표본 경로 기준 (일중 낙폭 미포함) · 현금 이자 0</small></h2><div class="b"><table><tr><th class="l">구간</th><th>전략 연복리</th><th>지수 보유 연복리</th><th>전략 최대낙폭</th><th>지수 최대낙폭</th><th>보유 비중</th></tr>${['ALL',...SPL].filter(k=>dm.path[k]).map(k=>{const p=dm.path[k];return `<tr><td class="l">${k==='ALL'?'전체':k}</td><td>${pct(p.strat.cagr,1)}</td><td>${pct(p.bh.cagr,1)}</td><td>${pct(p.strat.mdd,1)}</td><td>${pct(p.bh.mdd,1)}</td><td class="mu">${Math.round(p.on*100)}%</td></tr>`;}).join('')}</table></div></div>`:'';
  return `<div class="grid"><div class="p c12"><h2>전략 연구소<small>${esc(LAB.asof||'')} 종가까지 · 사전 등록 ${[...new Set(reg.map(r=>r.registered))].map(esc).join(' / ')} · 관문 IS t ≥ ${gate.req_t??'—'} (m=${gate.m??'—'})</small></h2><div class="b">
    <div class="mu" style="font-size:12px;line-height:1.7;white-space:normal;margin-bottom:6px">${esc(LAB.method||'')}</div>
    <div style="overflow-x:auto"><table><tr><th class="l" rowspan="2">전략</th><th class="l" rowspan="2">진입</th><th rowspan="2">등급</th>${SPL.map(k=>`<th colspan="3">${k} 초과</th>`).join('')}<th rowspan="2">IS 적중</th><th rowspan="2">손익비</th><th class="l" rowspan="2">판정 사유</th></tr>
      <tr>${SPL.map(()=>'<th>vs EW</th><th>vs KOSPI</th><th>n</th>').join('')}</tr>${rows}</table></div>
    <div class="mu" style="font-size:11px;margin-top:6px;white-space:normal">초과 = 리밸런싱(또는 이벤트)당 평균, 비용 차감 후. 등급 = EW·KOSPI 기준 각각 관문을 통과해야 함(낮은 쪽). 등급 A·B 만 최근 신호 표시. 전략 이름에 마우스를 올리면 가설. (사후) = 첫 결과를 본 뒤 추가한 진입 변형 — 다중검정 m 에 포함.</div>
    <div class="am" style="font-size:12px;margin:12px 0 2px">대기 (데이터 부족 — 테스트 안 함)</div>
    <table><tr><th class="l">가설</th><th class="l">계열</th><th class="l">내용</th><th class="l">조건</th></tr>${wait.map(r=>`<tr><td class="l">${esc(r.name)}</td><td class="l mu">${esc(r.family)}</td><td class="l" style="white-space:normal">${esc(r.hypothesis)}</td><td class="l mu" style="white-space:normal;font-size:11px">${esc(r.rule)}</td></tr>`).join('')}</table>
  </div></div>${bench}${dmp}</div>`;
}
let MVH=null;
function sigView(){
  if(MVH===null){ MVH=false; google.script.run.withSuccessHandler(t=>{try{MVH=JSON.parse(t);}catch(e){MVH={};} if(view==='sig') render();}).withFailureHandler(()=>{MVH={};}).getMacroHist(); }

  if(!PF||!PF.strategies) return '<div class="mu" style="padding:16px">모의 포트폴리오 결과가 아직 없습니다 (야간 실행 때 생성)</div>';

   <div class="p c12"><h2>CORRELATION<small>전략 간 월간 수익률 상관 (낮을수록 섞을 때 분산 효과)</small></h2><div class="b" style="overflow:auto">${corr}</div></div></div>`;
}
function drawPf(){ const cv=$('#pfc'); if(!cv||!PF||!PF.strategies) return; const W=cv.width=cv.clientWidth*2,H=cv.height=560,x=cv.getContext('2d'),pl=70,pr=200,pt=14,pb=40;
  const S=PF.strategies.filter(s=>s.curve&&s.curve.length), all=S.flatMap(s=>s.curve.map(r=>Math.log(r[1]))), lo=Math.min(...all), hi=Math.max(...all);
  const n=Math.max(...S.map(s=>s.curve.length)), X=i=>pl+(W-pl-pr)*i/(n-1), Y=v=>pt+(hi-Math.log(v))/((hi-lo)||1)*(H-pt-pb);
  const cols=['#ff9a1f','#4aa3ff','#2fd05a','#c77dff','#35d6e6','#ff4b4b','#e8e8e8','#9a5f14'];
  x.fillStyle='#050505';x.fillRect(0,0,W,H);x.font='20px monospace';
  [0.5,1,2,4,8].forEach(v=>{const lv=Math.log(v); if(lv<lo-0.05||lv>hi+0.05) return; const y=Y(v);x.strokeStyle='#1c1c1c';x.beginPath();x.moveTo(pl,y);x.lineTo(W-pr,y);x.stroke();x.fillStyle='#777';x.fillText('x'+v,6,y+7);});
  S.forEach((s,k)=>{const off=n-s.curve.length, sel=PFSEL===PF.strategies.indexOf(s); x.strokeStyle=cols[k%cols.length]; x.globalAlpha=PFSEL==null||sel?1:0.25; x.lineWidth=sel?5:2.5; x.beginPath(); s.curve.forEach((r,i)=>i?x.lineTo(X(i+off),Y(r[1])):x.moveTo(X(i+off),Y(r[1]))); x.stroke(); x.globalAlpha=1; x.fillStyle=cols[k%cols.length]; x.fillText(s.name,W-pr+10,30+k*26);});
  const c0=S[0].curve; x.fillStyle='#777'; for(let i=0;i<c0.length;i+=24) x.fillText(c0[i][0].slice(0,4),X(i+n-c0.length)-20,H-12); }
let MO={}, MBT=null;
function momView(){

  const tbl=(d,mk)=>{ if(!d) return '<div class="load">LOADING …</div>'; if(!d.top||!d.top.length) return '<div class="mu">다음 스크리너 실행 때 생성</div>';

  const bt=MBT&&MBT.stats?MBT:null;
  const S=(s)=>s?`CAGR <b>${pct(s.cagr,1)}</b> · 변동성 ${(s.vol*100).toFixed(0)}% · 샤프 ${s.sharpe??'—'} · MDD <b class="dn">${(s.mdd*100).toFixed(0)}%</b>`:'—';
  const btHtml=!bt?'<div class="mu">백테스트 결과 없음 (야간 실행 때 생성)</div>':`<div class="mu" style="margin-bottom:6px">${esc(bt.rule)}</div>
    <table><tr><th class="l">전략</th><th class="l">성과 (${bt.stats.momentum.months}개월)</th></tr>

    <div style="margin-top:6px">월별 승률(유니버스 대비) <b>${(bt.hit_vs_bench*100).toFixed(0)}%</b> · 평균 ${bt.avg_names}종목 · 월 교체율 ${(bt.avg_turnover*100).toFixed(0)}%</div>
    <canvas id="mbt" width="960" height="260" style="margin-top:8px"></canvas>

    <div class="mu" style="margin-top:6px">주의: 가격 수익률(배당 미포함) · 유상증자 권리락은 보정 안 됨 · 과거 성과, 미래 보장 아님</div>`;
  setTimeout(()=>drawBt(bt),0);
  return `<div class="grid"><div class="p c12"><h2>MOMENTUM BACKTEST · KR 2010~<small>12-1개월 모멘텀이 한국에서 통했는가</small></h2><div class="b">${btHtml}</div></div>
    <div class="p c6"><h2>MOMENTUM RANK · KR</h2><div class="b">${tbl(MO.KR,'KR')}</div></div>

function drawBt(bt){ const cv=$('#mbt'); if(!cv||!bt||!bt.curve) return; const W=cv.width=cv.clientWidth*2,H=cv.height=520,x=cv.getContext('2d'),c=bt.curve,pl=70,pr=16,pt=14,pb=40;
  const vals=c.flatMap(r=>[r[1],r[2],r[3]]).map(v=>Math.log(v)), lo=Math.min(...vals), hi=Math.max(...vals), Y=v=>pt+(hi-Math.log(v))/((hi-lo)||1)*(H-pt-pb), X=i=>pl+(W-pl-pr)*i/(c.length-1);
  x.fillStyle='#050505';x.fillRect(0,0,W,H);x.font='20px monospace';

  line(2,'#777');line(3,'#4aa3ff');line(1,'#ff9a1f');
  x.fillStyle='#777';for(let i=0;i<c.length;i+=24)x.fillText(c[i][0].slice(0,4),X(i)-20,H-12);

    <div class="mu" style="font-size:11px;margin-top:4px;white-space:normal">변화는 bp(0.01%p). 금리 색 = 채권 가격 기준: 금리↑(가격↓) <span class="dn">빨강</span>, 금리↓(가격↑) <span class="up">초록</span>. 신용 스프레드 확대도 빨강. 마우스를 올리면 설명.</div>`;

  // 수익률 곡선 (만기 축은 √년 간격)

    <div class="mu" style="font-size:11.5px">⏱ 시작 → 풀고 → 선택지 클릭하면 시간이 기록되고 채점된다. 목표 시간을 넘기면 시간이 빨간색.</div></div></div>
   <div class="p c12"><div class="b">${list.map(([x,k])=>aptItem(x,k)).join('')}</div></div></div>`;
}
/* 오늘의 영어 + 오늘의 인적성(시장 데이터) */
function engLoad(date){
  const set=t=>{ let o=null; try{ o=t?JSON.parse(t):null; }catch(e){} ENG.cur=o||{}; if(view==='eng') render(); };
  ENG.cur=false;
  const r=google.script.run.withSuccessHandler(set).withFailureHandler(()=>{ ENG.cur={}; if(view==='eng') render(); });
  date?r.getEnglishAt(date):r.getEnglishLatest();
}
function engBody(E){
  const ph=[]; let s=esc(E.body||'');
  (E.vocab||[]).forEach((v,i)=>{ const w=esc(v.w); const j=s.indexOf(w); if(j<0) return; ph.push(`<span class="am" data-vw="${i}" title="${escA(v.ko)}" style="border-bottom:1px dotted var(--amber);cursor:pointer">${w}</span>`); s=s.slice(0,j)+'\u0001'+(ph.length-1)+'\u0002'+s.slice(j+w.length); });
  s=s.replace(/\u0001(\d+)\u0002/g,(_,n)=>ph[+n]);
  return s.split(/\n\n+/).map(p=>`<p style="margin:0 0 8px">${p}</p>`).join('');
}
function engView(){
  if(ENG.idx===null){ ENG.idx=false; google.script.run.withSuccessHandler(t=>{try{ENG.idx=JSON.parse(t)||{};}catch(e){ENG.idx={};} if(view==='eng') render();}).withFailureHandler(()=>{ENG.idx={};if(view==='eng') render();}).getEnglishIndex(); }

  setTimeout(()=>{ const s=$('#engd'); if(s) s.onchange=()=>{ ENG.sel=s.value||null; ENG.cur=null; render(); };
    document.querySelectorAll('[data-vw]').forEach(sp=>sp.onclick=()=>{ const n=sp.nextElementSibling; if(n&&n.dataset&&n.dataset.vk!=null){ n.remove(); return; } const v=(E.vocab||[])[+sp.dataset.vw]||{}; sp.insertAdjacentHTML('afterend',`<i class="mu" data-vk="1" style="font-style:normal;font-size:12px"> (${esc(v.ko)})</i>`); });
    if(E.aptitude) aptBind(E.aptitude.map((x,i)=>[x,'E'+(E.date||'')+'-'+i])); },0);
  if(!E.body) return pick+'<div class="grid"><div class="p c12"><h2>오늘의 영어</h2><div class="b mu">아직 오늘 자료 없음</div></div></div>';
  return pick+`<div class="grid">
   <div class="p c8"><h2>오늘의 영어<small>${esc(E.date||'')} · ${esc(E.level||'')}</small></h2><div class="b" style="white-space:normal;line-height:1.75;font-size:13.5px">
    <div style="font-size:15px;margin-bottom:6px"><b>${esc(E.title||'')}</b></div>${engBody(E)}
    <div class="mu" style="font-size:11.5px">밑줄 단어를 누르면 뜻 표시</div>
    <details style="margin-top:6px"><summary style="cursor:pointer" class="am">한국어 번역 보기</summary><div style="font-size:13px">${esc(E.ko||'').split(/\n\n+/).map(p=>`<p style="margin:4px 0 8px">${p}</p>`).join('')}</div></details>
    ${(E.sources||[]).length?`<div class="mu" style="font-size:11.5px;margin-top:6px">출처: ${E.sources.map(s=>s.url?`<a href="${escA(s.url)}" target="_blank" rel="noopener">${esc(s.title)}</a>`:esc(s.title)).join(' · ')}</div>`:''}</div></div>
   <div class="p c4"><h2>단어 ${(E.vocab||[]).length}</h2><div class="b" style="white-space:normal;font-size:12.5px;line-height:1.6">${(E.vocab||[]).map(v=>`<div style="margin-bottom:5px"><b class="am">${esc(v.w)}</b> <span class="mu">${esc(v.pos||'')}</span> ${esc(v.ko)}<div class="mu" style="font-size:11.5px">${esc(v.ex||'')}</div></div>`).join('')}</div></div>
   <div class="p c6"><h2>문법 포인트</h2><div class="b" style="white-space:normal;font-size:12.5px;line-height:1.65">${(E.grammar||[]).map(g=>`<div style="margin-bottom:10px"><b>${esc(g.point)}</b><div style="border-left:2px solid var(--amber);padding-left:8px;margin:3px 0" class="am">“${esc(g.quote)}”</div><div>${esc(g.explain_ko)}</div>${(g.examples||[]).length?`<div class="mu" style="font-size:12px">예) ${g.examples.map(esc).join(' / ')}</div>`:''}</div>`).join('')}</div></div>
   <div class="p c6"><h2>시제 읽기</h2><div class="b" style="white-space:normal;font-size:12.5px;line-height:1.65">${(E.tense||[]).map(t=>`<div style="margin-bottom:8px"><span class="am">“${esc(t.sentence)}”</span><div><span class="tag">${esc(t.tense)}</span> ${esc(t.why_ko)}</div></div>`).join('')}</div></div>
   <div class="p c6"><h2>독해 퀴즈</h2><div class="b" style="white-space:normal;font-size:12.5px;line-height:1.65">${(E.quiz||[]).map((q,i)=>`<div style="margin-bottom:8px"><b>Q${i+1}. ${esc(q.q)}</b>${(q.choices||[]).map((c,j)=>`<div>${String.fromCharCode(97+j)}) ${esc(c)}</div>`).join('')}<details><summary class="mu" style="cursor:pointer">정답 보기</summary><b class="am">${String.fromCharCode(97+(q.a||0))}) ${esc((q.choices||[])[q.a]||'')}</b> — ${esc(q.exp_ko||'')}</details></div>`).join('')}</div></div>
   <div class="p c6"><h2>오늘의 인적성 (시장 데이터)<small>${(E.aptitude||[]).length}문항</small></h2><div class="b">${(E.aptitude||[]).map((x,i)=>aptItem({...x,id:'오늘 '+(i+1),sec:x.type},'E'+(E.date||'')+'-'+i)).join('')||'<span class="mu">아직 오늘 자료 없음</span>'}</div></div>
  </div>`;
}
</script>
