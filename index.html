<!doctype html>

<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MARKET TERMINAL</title>
<script>
/* GitHub Pages 용: Apps Script 의 google.script.run 을 같은 저장소 파일 fetch 로 대체 */
(function(){
  const get = p => fetch(p + '?t=' + Date.now(), {cache: 'no-store'}).then(r => {
    if (!r.ok) throw new Error('HTTP ' + r.status + ' (' + p + ')'); return r.text(); });
  const api = {
    getData: () => get('reports/dashboard.json').then(t => JSON.parse(t)),
    getDetail: m => get('reports/detail_' + m + '.json'),
    getMarkdown: n => get('reports/' + n + '.md').catch(() => ''),
    getLive: () => get('reports/live.json').catch(() => ''),
    getResearch: () => get('reports/research.json'),
    getDisclosures: () => get('reports/disclosures.json'),
  };
  function runner(ok, fail) {
    const r = { withSuccessHandler: f => runner(f, fail), withFailureHandler: f => runner(ok, f) };
    for (const k in api) r[k] = (...a) => api[k](...a).then(v => ok && ok(v), e => fail ? fail(e) : console.error(e));
    return r;
  }
  window.google = { script: { run: runner() } };
})();
</script>

<style>
  :root{
    --bg:#000; --panel:#0b0b0b; --line:#2a2a2a; --amber:#ff9a1f; --amber-dim:#9a5f14;
    --txt:#e8e8e8; --muted:#8a8a8a; --up:#2fd05a; --dn:#ff4b4b; --blue:#4aa3ff; --cyan:#35d6e6;
    --mono:"IBM Plex Mono","Consolas","Menlo","Noto Sans Mono CJK KR",monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--txt);font:12.5px/1.45 var(--mono);-webkit-font-smoothing:antialiased}
  a{color:var(--cyan);text-decoration:none}
  .top{display:flex;align-items:center;gap:14px;padding:6px 12px;background:#111;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
  .brand{color:var(--amber);font-weight:700;letter-spacing:.12em}
  .clock{color:var(--muted)}
  .tabs{display:flex;gap:2px;margin-left:auto}
  .tabs button{background:#1a1a1a;color:var(--muted);border:1px solid var(--line);padding:4px 10px;font:inherit;cursor:pointer;letter-spacing:.06em}
  .tabs button.on{background:var(--amber);color:#000;border-color:var(--amber);font-weight:700}
  .tape{white-space:nowrap;overflow:hidden;background:#070707;border-bottom:1px solid var(--line);padding:4px 0}
  .tape span{display:inline-block;padding:0 18px;color:var(--muted)}
  .tape b{color:var(--txt);font-weight:600}
  .grid{display:grid;grid-template-columns:repeat(12,1fr);gap:8px;padding:8px}
  .p{background:var(--panel);border:1px solid var(--line);min-width:0}
  .p h2{margin:0;padding:5px 8px;background:#161616;color:var(--amber);font-size:11.5px;letter-spacing:.14em;font-weight:700;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}
  .p h2 small{color:var(--muted);font-weight:400;letter-spacing:0}
  .p .b{padding:6px 8px;overflow:auto}
  .c12{grid-column:span 12}.c8{grid-column:span 8}.c6{grid-column:span 6}.c4{grid-column:span 4}.c3{grid-column:span 3}
  @media(max-width:1100px){.c3,.c4{grid-column:span 6}.c8{grid-column:span 12}}
  @media(max-width:700px){.c3,.c4,.c6,.c8{grid-column:span 12}.tabs button{padding:4px 7px}}
  table{border-collapse:collapse;width:100%;white-space:nowrap}
  th{color:var(--muted);text-align:right;font-weight:400;padding:2px 6px;border-bottom:1px solid var(--line);letter-spacing:.05em}
  td{padding:2px 6px;text-align:right;border-bottom:1px solid #141414}
  th:first-child,td:first-child,th.l,td.l{text-align:left}
  tr:hover td{background:#141414}
  .up{color:var(--up)}.dn{color:var(--dn)}.mu{color:var(--muted)}.am{color:var(--amber)}
  .kv{display:grid;grid-template-columns:auto 1fr;gap:2px 12px}
  .kv div:nth-child(odd){color:var(--muted)}
  .bar{height:6px;background:#1c1c1c;position:relative;margin:2px 0 6px}
  .bar i{position:absolute;left:0;top:0;bottom:0;background:var(--amber)}
  .tag{display:inline-block;padding:0 5px;border:1px solid var(--amber-dim);color:var(--amber);font-size:10.5px;margin-right:4px}
  .tag.g{border-color:#1f6b33;color:var(--up)}.tag.r{border-color:#7a2020;color:var(--dn)}.tag.b{border-color:#2a4f7a;color:var(--blue)}
  pre{margin:0;white-space:pre-wrap;color:#d0d0d0;font:inherit}
  .err{background:#2a0e0e;color:#ffb3b3;border:1px solid #5a1a1a;padding:6px 8px;margin:8px}
  .spark{display:flex;align-items:flex-end;gap:1px;height:34px}
  .spark i{flex:1;background:var(--amber-dim)}.spark i.last{background:var(--amber)}
  .load{padding:40px;text-align:center;color:var(--muted);letter-spacing:.2em}
  .md{padding:10px 14px;max-width:1200px}
  .md table{white-space:normal}
  .md h1,.md h2{color:var(--amber);letter-spacing:.08em;font-size:13px;margin:14px 0 6px}
  td.sym{cursor:pointer;text-decoration:underline dotted}
  .drawer{position:fixed;top:0;right:0;bottom:0;width:min(980px,100vw);background:#070707;border-left:1px solid var(--amber-dim);z-index:20;overflow:auto;box-shadow:-10px 0 30px #000;display:none}
  .drawer.on{display:block}
  .drawer .hd{position:sticky;top:0;background:#111;border-bottom:1px solid var(--line);padding:8px 12px;display:flex;gap:14px;align-items:baseline}
  .drawer .hd b{color:var(--amber);font-size:15px;letter-spacing:.06em}
  .drawer .hd .x{margin-left:auto;cursor:pointer;color:var(--muted);border:1px solid var(--line);padding:2px 8px}
  .drawer .grid{padding:8px}
  canvas{display:block;width:100%;height:260px;background:#050505}
  .sc{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
  .sc div.k{border:1px solid var(--line);padding:6px 8px}
  .sc .t{letter-spacing:.1em;font-size:11px;margin-bottom:4px}
  .backdrop{position:fixed;inset:0;background:#0008;z-index:19;display:none}.backdrop.on{display:block}
.ctab{margin-left:8px}.ctab button{background:none;border:1px solid var(--line);color:var(--muted);font:inherit;font-size:11px;padding:1px 8px;margin-left:4px;cursor:pointer}.ctab button.on{color:var(--amber);border-color:var(--amber)}
.lvbar{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;margin-bottom:6px}.lvbar i{font-style:normal;color:var(--muted)}
.nvtab{margin:0 0 6px 0}.live .nv{width:100%;max-width:700px;background:#fff;display:block}
.live iframe{width:100%;height:440px;border:0;display:block}.live .lk{margin-top:6px;font-size:12px}.live .lk a{color:var(--blue);margin-right:12px}
.rq{width:100%;max-width:420px;background:#050505;border:1px solid var(--line);color:var(--txt);font:inherit;padding:5px 8px;margin-bottom:8px}
tr.sub{display:none}tr.sub.on{display:table-row}tr.sub td{font-size:12px;line-height:1.7;padding-bottom:8px;text-align:left}td.tg{cursor:pointer;color:var(--amber);width:14px}
details.sec{margin-bottom:10px}details.sec summary{cursor:pointer;padding:4px 0;border-bottom:1px solid var(--line);margin-bottom:4px}
</style>

<div class="top">

    <button class="on" data-v="home">HOME</button>
    <button data-v="kr">KR</button>
    <button data-v="us">US</button>
    <button data-v="rep">RESEARCH</button><button data-v="dart">DART</button>
    <button data-v="brief">BRIEFS</button>
    <button data-v="mdkr">KR FULL</button>

<div class="tape" id="tape"></div>
<div id="root"><div class="load">LOADING …</div></div>

<div class="drawer" id="dr"><div class="hd"><b id="dr-t">—</b><span id="dr-s" class="mu"></span><span class="x" id="dr-x">ESC ✕</span></div><div id="dr-b"></div></div>

<script>
const CLS={TREND_LONG:'추세상승',TREND_OVEREXTENDED:'추세과열',PULLBACK_IN_UPTREND:'눌림',COUNTERTREND_BOUNCE:'역추세반등',TREND_SHORT:'추세하락',NEUTRAL:'중립',OVEREXTENDED:'과열'};
const SEC=[['TREND_LONG','TREND LONG'],['PULLBACK_IN_UPTREND','PULLBACK IN UPTREND'],['COUNTERTREND_BOUNCE','COUNTERTREND BOUNCE'],['OVEREXTENDED','OVEREXTENDED / RISK≥60'],['TREND_SHORT','TREND SHORT']];
let D=null, view='home';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const pct=(x,d=1)=>x==null?'':`<span class="${x>0?'up':x<0?'dn':'mu'}">${(x*100).toFixed(d)>0?'+':''}${(x*100).toFixed(d)}%</span>`;
const num=(x,d=0)=>x==null?'':Number(x).toLocaleString(undefined,{maximumFractionDigits:d,minimumFractionDigits:d});
const n0=x=>x==null?'':Math.round(x);
function tick(){const t=new Date();$('#clock').textContent=t.toLocaleString('ko-KR',{timeZone:'Asia/Seoul',hour12:false});}
setInterval(tick,1000);tick();

function sigTable(rows,market){
  if(!rows||!rows.length) return '<div class="mu">—</div>';
  const kr=market==='KR';
  return `<table><tr><th class="l">SYM</th><th class="l">NAME</th><th>PX</th><th>1D</th><th>20D</th><th>T</th><th>M</th><th>RISK</th><th>ADX</th><th>RSI</th><th>52H</th><th>VOL×</th><th class="l">CLS</th></tr>`+
  rows.map(r=>`<tr><td class="l am sym" data-sym="${esc(r.symbol)}" data-mk="${market}">${esc(r.symbol)}</td><td class="l">${esc(r.name).slice(0,16)}</td><td>${num(r.close,kr?0:2)}</td><td>${pct(r.ret1)}</td><td>${pct(r.ret20)}</td><td class="am">${n0(r.trend_score)}</td><td>${n0(r.momentum_score)}</td><td class="${r.reversal_risk>=60?'dn':''}">${n0(r.reversal_risk)}</td><td>${n0(r.adx14)}</td><td>${n0(r.rsi14)}</td><td>${pct(r.from_high52,0)}</td><td class="${r.vol_ratio>=3?'am':''}">${(r.vol_ratio??0).toFixed(1)}</td><td class="l mu">${CLS[r.class]||r.class||''}</td></tr>`).join('')+'</table>';
}
function breadthPanel(mk){
  const b=(D.breadth||[]).filter(x=>x.market===mk);
  if(!b.length) return `<div class="mu">—</div>`;
  const L=b[b.length-1];
  const sp=b.slice(-30).map((x,i,a)=>`<i class="${i===a.length-1?'last':''}" style="height:${Math.max(2,(x.pct_above200||0)*34)}px" title="${x.date} ${Math.round(x.pct_above200*100)}%"></i>`).join('');
  const bar=(l,v)=>`<div>${l} <b>${Math.round(v*100)}%</b></div><div class="bar"><i style="width:${v*100}%"></i></div>`;
  return `<div class="mu">${L.date} · n=${L.n}</div>${bar('ABOVE 20D',L.pct_above20)}${bar('ABOVE 50D',L.pct_above50)}${bar('ABOVE 200D',L.pct_above200)}
  <div class="kv"><div>ADV/DEC</div><div><span class="up">${L.adv}</span> / <span class="dn">${L.dec}</span></div><div>52W HI/LO</div><div><span class="up">${L.new_high52}</span> / <span class="dn">${L.new_low52}</span></div></div>
  <div class="mu" style="margin-top:6px">% ABOVE 200D · 30 SESSIONS</div><div class="spark">${sp}</div>`;
}
function macroPanel(mk){
  const m=(D.state||{})['macro_'+mk]; if(!m||!m.value||!m.value.length) return '<div class="mu">—</div>';
  const reg=(D.state||{})['regime_'+mk];
  return `<table><tr><th class="l">KEY</th><th>LAST</th><th>1D</th><th>20D</th><th>vs50D</th><th class="l">REG</th></tr>`+m.value.map(d=>`<tr><td class="l am">${d.key}</td><td>${num(d.last,2)}</td><td>${pct(d.chg1)}</td><td>${pct(d.chg20)}</td><td>${pct(d.vs_sma50)}</td><td class="l mu">${d.regime}</td></tr>`).join('')+`</table>`+(reg&&reg.value?`<div class="mu" style="margin-top:4px">${esc(reg.value)}</div>`:'');
}
function pre(key,title){
  const s=(D.state||{})[key]; if(!s||!s.value) return '';
  const txt=String(s.value).replace(/<[^>]+>/g,'');
  return `<div class="p c6"><h2>${title}<small>${s.at}</small></h2><div class="b"><pre>${esc(txt)}</pre></div></div>`;
}
function marketView(mk){
  const S=D[mk.toLowerCase()]||{}; const sec=S.sections||{};
  let h=`<div class="grid">
    <div class="p c4"><h2>BREADTH ${mk}</h2><div class="b">${breadthPanel(mk)}</div></div>
    <div class="p c8"><h2>MACRO CONTEXT<small>score 미반영</small></h2><div class="b">${macroPanel(mk)}</div></div>`;
  const mc=(D.state||{})['market_comment_'+mk];
  if(mc&&mc.value) h+=`<div class="p c12"><h2>READ</h2><div class="b am">${esc(mc.value)}</div></div>`;
  for(const [k,t] of SEC){const s=sec[k]; if(!s) continue; h+=`<div class="p c12"><h2>${t}<small>top ${s.rows.length} / ${s.total}</small></h2><div class="b">${sigTable(s.rows,mk)}</div></div>`;}
  const an=(D.anomalies||{})[mk]||[];
  if(an.length) h+=`<div class="p c12"><h2>ANOMALIES<small>vol≥3× or gap≥5%</small></h2><div class="b"><table><tr><th class="l">SYM</th><th class="l">NAME</th><th>1D</th><th>GAP</th><th>VOL×</th><th class="l">CLS</th></tr>${an.map(r=>`<tr><td class="l am sym" data-sym="${esc(r.symbol)}" data-mk="${mk}">${esc(r.symbol)}</td><td class="l">${esc(r.name)}</td><td>${pct(r.ret1)}</td><td>${pct(r.gap)}</td><td class="am">${(r.vol_ratio??0).toFixed(1)}</td><td class="l mu">${CLS[r.class]||''}</td></tr>`).join('')}</table></div></div>`;
  h+=pre('close_'+mk,'CLOSE COMMENT')+pre('telegram_'+mk,'TELEGRAM SUMMARY')+'</div>';
  return h;
}
function homeView(){
  const kr=D.kr||{},us=D.us||{};
  const cc=o=>{const c=o.class_counts||{};return `<div class="kv">${Object.entries(c).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div>${CLS[k]||k}</div><div>${v}</div>`).join('')}</div>`;};
  const w=D.watchlist||[];
  let h=`<div class="grid">
   <div class="p c3"><h2>KR BREADTH</h2><div class="b">${breadthPanel('KR')}</div></div>
   <div class="p c3"><h2>US BREADTH</h2><div class="b">${breadthPanel('US')}</div></div>
   <div class="p c3"><h2>KR CLASSES<small>${kr.asof||''}</small></h2><div class="b">${cc(kr)}</div></div>
   <div class="p c3"><h2>US CLASSES<small>${us.asof||''}</small></h2><div class="b">${cc(us)}</div></div>
   <div class="p c6"><h2>WATCHLIST KR<small>${w.length} · 장전 선정</small></h2><div class="b">${w.length?`<table><tr><th class="l">SYM</th><th class="l">NAME</th><th class="l">CLS</th><th>T</th><th class="l">WHY</th></tr>${w.map(x=>`<tr><td class="l am sym" data-sym="${x.code}" data-mk="KR">${x.code}</td><td class="l">${esc(x.name)}</td><td class="l mu">${CLS[x.class]||''}</td><td>${n0(x.trend)}</td><td class="l">${esc(x.why)}</td></tr>`).join('')}</table>`:'<div class="mu">—</div>'}</div></div>
   <div class="p c6"><h2>LATEST RESEARCH<small>${(D.reports||[]).length}</small></h2><div class="b">${repTable((D.reports||[]).slice(0,14))}</div></div>`;
  h+=pre('premarket_kr','PREMARKET KR')+pre('close_KR','CLOSE KR')+pre('close_US','CLOSE US')+pre('intraday_kr','INTRADAY KR');
  return h+'</div>';
}
function repTable(rows){
  if(!rows||!rows.length) return '<div class="mu">—</div>';
  return `<table><tr><th class="l">DATE</th><th class="l">NAME</th><th class="l">BROKER</th><th class="l">OP</th><th>TP</th><th class="l">TITLE</th></tr>`+rows.map(r=>`<tr><td class="l mu">${r.date}</td><td class="l am sym" data-sym="${esc(r.code)}" data-mk="KR">${esc(r.name)}</td><td class="l">${esc(r.broker)}</td><td class="l">${esc(r.opinion||'')}</td><td>${num(r.target)}</td><td class="l">${r.link?`<a href="${esc(r.link)}" target="_blank">${esc(r.title).slice(0,50)}</a>`:esc(r.title).slice(0,50)}</td></tr>`).join('')+'</table>';
}
let DS=null, DV={c:'ALL',q:'',d:7};
const FLAGC={'희석':'dn','주의':'dn','정정':'mu'};
function discTable(rows,withName){ return `<table><tr><th class="l">날짜</th>${withName?'<th class="l">종목</th>':''}<th class="l">유형</th><th class="l">공시</th></tr>${rows.map(r=>`<tr><td class="l mu">${r.date}</td>${withName?`<td class="l am sym" data-sym="${esc(r.code)}" data-mk="KR">${esc(r.name)}</td>`:''}<td class="l">${esc(r.category)}${r.flag?` <b class="${FLAGC[r.flag]||'am'}">${esc(r.flag)}</b>`:''}</td><td class="l"><a href="${esc(r.link)}" target="_blank">${esc(r.title)}</a></td></tr>`).join('')}</table>`; }
function dartView(){
  if(!DS){ google.script.run.withSuccessHandler(t=>{try{DS=JSON.parse(t);}catch(e){DS={items:[]};} if(view==='dart') render();}).withFailureHandler(e=>{DS={items:[],err:'공시 데이터가 아직 없습니다 (DART_API_KEY 설정 후 다음 자동 실행 때 생성)'}; if(view==='dart') render();}).getDisclosures(); return '<div class="load">LOADING …</div>'; }
  const cats=['ALL','⚠ 주의·희석',...new Set((DS.items||[]).map(r=>r.category))];
  const b=(k,v,l)=>`<button class="${DV[k]===v?'on':''}" onclick="DV['${k}']=${typeof v==='number'?v:`'${v}'`};render()">${l}</button>`;
  return `<div class="grid"><div class="p c12"><h2>DART 주요 공시<span class="ctab">${[1,3,7,30].map(d=>b('d',d,d+'D')).join('')}</span><small id="dcnt"></small></h2><div class="b">
   <div class="ctab" style="margin:0 0 8px 0;display:flex;flex-wrap:wrap;gap:4px">${cats.map(c=>b('c',c,c==='ALL'?'전체':c)).join('')}</div>
   <input class="rq" placeholder="종목 · 공시 제목 검색" value="${esc(DV.q)}" oninput="DV.q=this.value;dartFill()">${DS.err?`<div class="mu">${esc(DS.err)}</div>`:''}<div id="dbody"></div></div></div></div>`;
}
function dartFill(){ const b=$('#dbody'); if(!b||!DS) return; const cut=new Date(Date.now()-DV.d*864e5+9*36e5).toISOString().slice(0,10), q=DV.q.trim().toLowerCase();
  const it=(DS.items||[]).filter(r=>r.date>=cut&&(DV.c==='ALL'||(DV.c==='⚠ 주의·희석'?(r.flag==='주의'||r.flag==='희석'):r.category===DV.c))&&(!q||[r.name,r.code,r.title,r.category].join(' ').toLowerCase().includes(q)));
  b.innerHTML=it.length?discTable(it.slice(0,500),true):'<div class="mu">해당 공시 없음</div>'; const c=$('#dcnt'); if(c) c.textContent=`${it.length}건 · 기준 ${DS.asof||''}`; }
let R=null, RV={m:'sector',d:30,q:''};
function repView(){
  if(!R){ google.script.run.withSuccessHandler(t=>{try{R=JSON.parse(t);}catch(e){R={items:[],close:{}};} if(view==='rep') render();}).withFailureHandler(e=>{R={items:[],close:{},err:e.message}; if(view==='rep') render();}).getResearch(); return '<div class="load">LOADING …</div>'; }
  const btn=(k,v,l)=>`<button class="${RV[k]===v?'on':''}" onclick="RV['${k}']=${typeof v==='number'?v:`'${v}'`};render()">${l}</button>`;
  return `<div class="grid"><div class="p c12"><h2>RESEARCH<span class="ctab">${btn('m','sector','섹터별')}${btn('m','stock','종목별')}${btn('m','all','전체')}</span><span class="ctab">${[7,30,90,180].map(d=>btn('d',d,d+'D')).join('')}</span><small id="rcnt"></small></h2>
   <div class="b"><input id="rq" class="rq" placeholder="종목 · 증권사 · 섹터 · 제목 검색" value="${esc(RV.q)}" oninput="RV.q=this.value;repFill()">${R.err?`<div class="err">${esc(R.err)}</div>`:''}<div id="rbody"></div></div></div></div>`;
}
function repFill(){ const b=$('#rbody'); if(!b||!R) return; const it=repFilter(); b.innerHTML=repBody(it); const c=$('#rcnt'); if(c) c.textContent=`${it.length}건 · ${new Set(it.map(r=>r.code)).size}종목 · 기준 ${R.asof||''}`; }
function repFilter(){ const cut=new Date(Date.now()-RV.d*864e5+9*36e5).toISOString().slice(0,10), q=RV.q.trim().toLowerCase();

function drawChart(ch,sc,rs,kr){

  hline(rs.consensus_tp,'#35d6e6','TP '+num(rs.consensus_tp)); hline(sc.bull?.target,'#2fd05a','BULL '+num(sc.bull?.target)); hline(sc.bear?.stop,'#ff4b4b','STOP '+num(sc.bear?.stop)); if(sc.bear?.trail) hline(sc.bear.trail,'#ff9a1f','PSAR');
  ch.forEach((c,i)=>{const px=padL+cw*i+cw/2;const up=c.c>=c.o;x.strokeStyle=x.fillStyle=up?'#ff4b4b':'#4aa3ff'; if(!kr){x.strokeStyle=x.fillStyle=up?'#2fd05a':'#ff4b4b';}
    x.lineWidth=2;x.beginPath();x.moveTo(px,Y(c.h));x.lineTo(px,Y(c.l));x.stroke();const yo=Y(c.o),yc=Y(c.c);x.fillRect(px-cw*0.3,Math.min(yo,yc),cw*0.6,Math.max(2,Math.abs(yc-yo)));
    const vb=H-padB-(c.v/vmax)*vh*0.95; x.fillStyle=up?'#5a2020':'#1f3a5a'; x.fillRect(px-cw*0.3,vb,cw*0.6,H-padB-vb);
    if(i%10===0){x.fillStyle='#777';x.fillText(c.d,px-20,H-padB+26);} });
}

document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('on'));b.classList.add('on');view=b.dataset.v;render();});

  google.script.run.withSuccessHandler(d=>{D=d;render();}).withFailureHandler(e=>{$('#root').innerHTML=`<div class="err">LOAD FAILED: ${esc(e.message)}</div>`;}).getData();
}
load(); loadLive(); setInterval(load, 5*60*1000); setInterval(loadLive, 60*1000);
