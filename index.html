<!doctype html>
<!-- 자동 생성: scripts/build_pages.py 로 apps-script/Index.html + tab_*.html 에서 만든다. 직접 고치지 말 것 -->
<html lang="ko">
<head>
<script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MARKET TERMINAL</title>
<script>
/* GitHub Pages 용: Apps Script 의 google.script.run 을 같은 저장소 파일 fetch 로 대체 */
(function(){
  const get = p => fetch(p + '?t=' + Date.now(), {cache: 'no-store'}).then(r => {
    if (!r.ok) throw new Error('HTTP ' + r.status + ' (' + p + ')'); return r.text(); });
  // 자주 바뀌는 시세·운영 파일은 Pages 재배포를 기다리지 않고 raw 에서 직접 (CDN 캐시 최대 5분). pages.yml paths-ignore 와 짝 (감사 10/21 #3)
  const raw = p => fetch('https://raw.githubusercontent.com/hk99915-bot/market-screener/main/' + p + '?t=' + Date.now()).then(r => r.ok ? r.text() : get(p)).catch(() => get(p));
  const api = {
    getData: () => get('reports/dashboard.json').then(t => JSON.parse(t)),
    getStock: (m, s) => get('reports/detail/' + m + '/' + encodeURIComponent(s) + '.json'),
    getMarkdown: n => get('reports/' + n + '.md').catch(() => ''),
    getLive: () => raw('reports/live.json').catch(() => ''),
    getResearch: () => get('reports/research.json'),
    getDisclosures: () => get('reports/disclosures.json'),
    getMacroSeries: () => get('reports/macro_series.json'),
    getAnalysts: () => get('reports/analysts.json'),
    getResearchViews: () => get('reports/research_views.json'),
    getResearchSynthesis: () => get('reports/research_synthesis.json'),
    getMomentum: m => get('reports/momentum_' + m + '.json'),
    getMomentumBt: () => get('reports/momentum_bt.json'),
    getDaily: () => get('reports/daily_brief.json'),
    getDailyIndex: () => get('reports/daily_hist/_index.json'),
    getDailyAt: (d) => get('reports/daily_hist/' + d + '.json'),
    getStockIndex: m => get('reports/detail/' + m + '/_index.json'),
    getPortfolios: () => get('reports/portfolios.json'),
    getSignals: () => get('reports/signal_scores.json'),
    getMacroView: () => get('reports/macro_view.json'),
    getCommodities: () => get('reports/commodities.json'),
    getGeopolitics: () => get('reports/views/geopolitics.json'),
    getAnalystCmdty: () => get('reports/views/analyst_cmdty.json'),
    getMacroCmdty: () => get('reports/views/macro_cmdty.json'),
    getRealEstate: () => get('reports/realestate.json'),
    getRealEstateView: () => get('reports/views/realestate.json'),
    getRealEstateGu: c => /^[0-9]{5}$/.test(String(c)) ? get('reports/realestate_trades/' + c + '.json') : Promise.reject(new Error('bad gu code')),
    getRealEstateGeo: c => /^([0-9]{5}|seoul)$/.test(String(c)) ? raw('assets/realestate_geo/' + c + '.json') : Promise.reject(new Error('bad geo key')),
    getGeoNews: () => get('reports/geo_news.json'),
    getOneliners: () => get('reports/company_oneliner.json'),
    getChainSeries: () => get('reports/chains.json'),
    getEvents: () => raw('reports/events_stats.json'),
    getMacroHist: () => get('reports/macro_hist.json'),
    getStudy: () => get('reports/studies/crash_rebound.json'),
    getLab: () => get('reports/lab.json'),
    getIsaLab: () => get('reports/isa_lab_returns.json'),
    getResearchBoard: () => get('reports/research_board.json'),
    getBoard: () => get('ops/board.json'),
    getTeam: () => raw('ops/team.json'),
    getLocks: () => raw('ops/locks.json'),
    getChangelog: () => get('reports/changelog.json'),
    getOpsDaily: (d) => get('reports/ops/daily/' + d + '.md').catch(() => ''),
    getOpsRuns: () => get('reports/ops/runs.json'),
    getHealth: () => get('reports/health.json'),
    getBonds: () => get('reports/bonds.json'),
    getJapan: () => get('reports/japan.json'),
    getStudyGuide: () => get('content/study.json'),
    getDerivs: () => get('reports/derivs.json'),
    getDerivHist: () => get('data/deriv/daily.csv'),
    getDerivSignals: () => get('reports/studies/derivs_signals.json'),
    getGammaStudy: () => get('reports/studies/gamma_regime.json'),
    getDerivsResearch: () => get('reports/views/derivs_research.json'),
    getHfLsVol: () => get('reports/studies/2026-10-21_hf_ls_vol.json'),
    getMacroReleases: () => get('reports/macro_releases.json'),
    getEnglishLatest: () => get('reports/english/latest.json'),
    getEnglishAt: (d) => get('reports/english/' + d + '.json'),
    getEnglishIndex: () => get('reports/english/index.json'),
    getCalendar: () => get('reports/calendar.json'),
    getPeers: (mk) => get('reports/peers_' + mk + '.json'),
    getDecisions: () => get('reports/decisions.json'),
    getCommittee: () => get('reports/committee.json'),
    getCommitteeUS: () => get('reports/committee_us.json'),
    getArchIndex: (k) => get('reports/archive/' + k + '/_index.json'),
    getArchAt: (k, d) => get('reports/archive/' + k + '/' + d + '.json'),
    getChains: () => get('reports/chains_view.json'),
    getViews: () => get('reports/views.json'),
    getValuation: () => get('reports/valuation.json'),
    getDotplot: () => get('reports/dotplot.json'),
    getFreshness: () => get('reports/freshness.json'),
    getAccum: () => get('reports/accum.json'),
    getUsAccum: () => get('reports/us_accum.json'),
    getCooldown: () => get('ops/cooldown.json'),
    getRenego: () => get('ops/renego.json'),
    // 🔒 비공개 사담방 — 공개 Pages 엔 토큰이 없다. 10/23 겸이 선택: "이 폰에만 토큰 저장" → 이 기기 브라우저 localStorage('pbPrivTok')에만 두고
    //    GitHub contents API 로 직접 읽는다(저장소·채팅·서버로 안 감). 권장 토큰: fine-grained · pb-private 하나 · Contents 읽기 전용 · 만료 있음.
    getPrivate: (name) => {
      let tok = ''; try { tok = localStorage.getItem('pbPrivTok') || ''; } catch (e) {}
      if (name !== 'chat') return Promise.resolve(JSON.stringify({ _err: '허용 안 된 이름' }));
      if (!tok) return Promise.resolve(JSON.stringify({ _need_token: true }));
      return fetch('https://api.github.com/repos/hk99915-bot/pb-private/contents/chat/private_chat.json?ref=main', {
        headers: { Authorization: 'Bearer ' + tok, Accept: 'application/vnd.github.raw', 'X-GitHub-Api-Version': '2022-11-28' }, cache: 'no-store',
      }).then(r => r.ok ? r.text() : JSON.stringify({ _err: 'GitHub ' + r.status + (r.status === 401 || r.status === 404 ? ' — 토큰 만료·권한(pb-private Contents 읽기) 확인' : ''), _need_token: r.status === 401 }))
        .catch(e => JSON.stringify({ _err: String(e).slice(0, 100) }));
    },
  };
  function runner(ok, fail) {
    const r = { withSuccessHandler: f => runner(f, fail), withFailureHandler: f => runner(ok, f) };
    for (const k in api) r[k] = (...a) => api[k](...a).then(v => ok && ok(v), e => fail ? fail(e) : console.error(e));
    return r;
  }
  window.google = { script: { run: runner() } };
})();
</script>

<!-- 웹폰트 (UXUI 10/31 블룸버그식 재설계 §7 1단계): 한글 본문 IBM Plex Sans KR · 숫자 IBM Plex Mono(tabular-nums). 둘 다 OFL. 못 받으면 시스템 글꼴(display=swap) -->

<style>
  :root{
    /* 색 토큰 (UXUI 10/31 docs/uxui/2026-10-31_bloomberg_redesign.md §4 JSON dark, 1단계). 화면은 이름만 쓴다(kb:front#1).
       색 관례 = 한국식(상승 빨강 · 하락 파랑, 겸이 10/31 D1 확정). 경보 = 전폭 빨강 반전 블록 + ⛔(--alarm-bg/--on-alarm) — 하락 파랑과 색, 상승 빨강 글자와 모양으로 구분 */
    --bg:#000; --surface:#0d0d0d; --raised:#171717; --line:#262626; --line-strong:#3a3a3a;
    --text:#f2f2f2; --text-2:#a3a3a3; --text-3:#8f8f8f;      /* text-3 = 최저 글자색(이보다 어두운 글자 금지) */
    --accent:#fb8b1e; --on-accent:#000;                         /* 앰버 1색 — 뜻 정리(선택·초점·확인 필요만)는 2단계 */
    --up:#ff4d4d; --down:#4c8dff;
    --alarm-bg:#c81e1e; --on-alarm:#fff;
    --font-num:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,"IBM Plex Sans KR","Noto Sans KR",monospace;   /* 숫자·티커·시각·표 — 한글 글자는 끝의 산세리프로 */
    --font-text:"IBM Plex Sans KR","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;     /* 한글 본문·라벨, 자간 0 */
    /* 옛 이름 = 새 토큰 별칭(§4 '다리'). 탭 파일은 옛 이름 그대로 써도 된다. 새 코드는 새 이름 */
    --panel:var(--surface); --txt:var(--text); --muted:var(--text-2); --amber:var(--accent); --dn:var(--down); --on-amber:var(--on-accent);
    --amber-dim:#9a5f14; --blue:#4aa3ff; --cyan:#35d6e6;
    /* 겹 배경 (10/24 엑셀 스킨 대비 req-dev-0d1eee58): 하드코딩 #111·#151515·#0a0a0a 대신 — html.xl 이 밝은 값으로 바꾼다 */
    --bg2:var(--raised); --bg3:var(--raised);
    /* 차트 두 계열 색 (10/24 req-dev-06b280d5): 기본 = 주황·파랑, 엑셀 = 엑셀 차트 팔레트(파랑 #4472c4 · 진한 주황 #c55a11) — xl 에서 --amber·--blue 가 둘 다 #000 이라 선 구분 불가 */
    --ch1:var(--amber); --ch2:var(--blue);
    --mono:var(--font-num);
    /* 글자 크기 4단계 (UXUI Top10 #10, 10/24 결재 appr-uxui-top10-next) — 화면 글자는 이 4개만. 픽셀 직접 쓰기 금지(tests/test_font_tokens.py · 고치기 python3 scripts/font_tokens.py --fix)
       1 보조(시각·단위·주석·태그) 11px · 2 본문·표 13px · 3 강조·소제목 16px · 4 제목·큰 숫자 17px(2단계에서 히어로 28px 로) · 아이콘(글자 아님: 💬 ✕ › 등) 24px
       10/31 1단계: 12.5→13 · 14→16 (UXUI §4 font.size) */
    --fs-1:11px; --fs-2:13px; --fs-3:16px; --fs-4:17px; --fs-icon:24px;
  }
  *{box-sizing:border-box}
  small{font-size:var(--fs-1)}   /* 브라우저 기본 smaller(본문의 83% = 10.4px) → 4단계 1 */
  html,body{margin:0;background:var(--bg);color:var(--txt);font:var(--fs-2)/1.45 var(--font-text);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
  table,th,td,.tape,.n,.clock,.asof{font-family:var(--font-num);font-variant-numeric:tabular-nums lining-nums}   /* 숫자 칸 = 고정폭 (UXUI P4) */

function squarify(items,x,y,w,h){ // items: [{v,...}] → [{...,x,y,w,h}]
  const out=[]; let rest=items.filter(o=>o.v>0).sort((a,b)=>b.v-a.v); const tot=rest.reduce((s,o)=>s+o.v,0); if(!tot) return out;
  const scale=w*h/tot; rest=rest.map(o=>({...o,_a:o.v*scale}));
  const worst=(row,len)=>{const s=row.reduce((a,o)=>a+o._a,0),mx=Math.max(...row.map(o=>o._a)),mn=Math.min(...row.map(o=>o._a)); return Math.max(len*len*mx/(s*s),(s*s)/(len*len*mn));};
  while(rest.length){ const len=Math.min(w,h); let row=[rest[0]], i=1;
    while(i<rest.length && worst([...row,rest[i]],len)<=worst(row,len)){ row.push(rest[i]); i++; }
    const s0=row.reduce((a,o)=>a+o._a,0), thick=s0/len; let off=0;
    for(const o of row){ const l=o._a/thick; if(w>=h) out.push({...o,x:x,y:y+off,w:thick,h:l}); else out.push({...o,x:x+off,y:y,w:l,h:thick}); off+=l; }
    if(w>=h){ x+=thick; w-=thick; } else { y+=thick; h-=thick; } rest=rest.slice(i); }
  return out; }

function heatBadge(mk,metric,live,src,ph,now){

  if(ph==='live'){ times=[hm2(Math.ceil((k.getUTCHours()*60+k.getUTCMinutes()+1)/step)*step)]; days=[k.getUTCDay()]; }

   ① 시장 국면 = 200일선 위 비율(BREADTH 판정과 같은 기준 60/40%) + 매크로 바람(macro_view.json) ② 오늘 내 할 일 = 대결 제출 대기(마감 전만)·쿨다운·원장 차이 ③ 늦은 데이터 = 신선도 계약(freshness.json).
   새 판단을 만들지 않고 이미 있는 판정만 모은다. */
/* 대결 제출 마감(epoch ms) — screener/duel.py 와 같은 기준: 국장 = 그날 15:30 KST 까지 받음(apply_issue '>1530' 거부 → 15:31:00 전),
   미장 = 그날 09:30 ET 전(us_open_kst·_apply_issue_us 't >= dl' 거부, 서머타임은 America/New_York 으로 계산). */
function duelDeadlineMs(it){ const [y,m,d]=String(it.date||'').split('-').map(Number); if(!y||!m||!d) return NaN;
  if(it.market==='US'){ const h=+new Date(Date.UTC(y,m-1,d,12)).toLocaleString('en-US',{timeZone:'America/New_York',hour:'numeric',hourCycle:'h23'}); return Date.UTC(y,m-1,d,9+(12-h),30); }
  return Date.UTC(y,m-1,d,15-9,31); }
/* '나' 제출 대기 = 채점 전 진입 판 중 '나' pending 이고 아직 제출 마감 전인 판 수 */
function homePendDuel(items,now){ return (items||[]).filter(it=>it.kind!=='ticket'&&it.kind!=='exit'&&!it.result&&it.picks&&it.picks['나']&&it.picks['나'].pending&&now<duelDeadlineMs(it)).length; }
function homeConc(){
  const bv=mk=>{ const b=(D.breadth||[]).filter(x=>x.market===mk), L=b[b.length-1]; if(!L||L.pct_above200==null) return `<span class="mu">${mk} —</span>`;
    const p=L.pct_above200, l=p>=0.6?'강세':p>=0.4?'중립':'약세'; return `<span>${mk} <b class="${p>=0.6?'up':p>=0.4?'am':'dn'}">${l}</b> <span class="mu">${Math.round(p*100)}%</span></span>`; };
  if(MV===null&&typeof macroPanel==='function') macroPanel('KR');   // 매크로 바람 불러오기(도착하면 render)
  const mw=MV&&MV.score!=null?`<div>매크로 바람 <b style="color:${MV.score>0.15?'var(--up)':MV.score<-0.15?'var(--dn)':'var(--amber)'}">${esc(MV.label||'')} (${MV.score>0?'+':''}${Number(MV.score).toFixed(2)})</b></div>`:'<div class="mu">매크로 바람 불러오는 중</div>';
  if(typeof decLoad==='function') decLoad();
  const pend=DEC&&DEC.items?homePendDuel(DEC.items,Date.now()):null;   // 제출 마감 지난 판은 제외(피어 2026-10-24 U2)
  const CD=typeof decCD==='function'?decCD():null;
  const todo=[pend==null?'<div class="mu">대결 불러오는 중</div>':pend?`<div><a href="#" onclick="setView('score');return false" style="display:inline-flex;align-items:center;min-height:44px"><b class="dn">대결 제출 대기 ${pend}</b>&nbsp;→ 성적표에서 제출</a></div>`:'<div class="mu">대결 제출 대기 없음</div>',
    CD?'<div class="dn">⏳ 쿨다운 중 — 새 모의 베팅 금지</div>':'', homeLedgerLine()].join('');
  const n=FR?(FR.late||[]).length+(FR.regress_today||[]).length+(FR.stale_today||[]).length:null;
  const cell=(t,b)=>`<div style="border:1px solid var(--line);padding:6px 9px;min-width:0;line-height:1.6"><div class="am" style="font-size:var(--fs-2);font-weight:700">${t}</div>${b}</div>`;
  return `<div class="p c12" id="homeconc"><h2>오늘 결론<small>이미 있는 판정만 모음 · 매매 지시 아님</small></h2><div class="b" style="white-space:normal;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:6px">
    ${cell('시장 국면',`<div style="display:flex;gap:12px;flex-wrap:wrap">${bv('KR')}${bv('US')}</div>${mw}<div class="mu" style="font-size:var(--fs-1)">200일선 위 종목 비율 60%↑ 강세 · 40%↓ 약세</div>`)}
    ${cell('오늘 내 할 일',todo)}
    ${cell('늦은 데이터',n==null?'<div class="mu">점검 불러오는 중</div>':`<a href="#" onclick="freshPop();return false" style="display:inline-flex;align-items:center;min-height:44px"><b class="${n?'dn':'up'}">${n?`⚠ ${n}건`:'0건 · 정상'}</b>&nbsp;${n?'→ 무엇이 늦었나':''}</a>`)}
  </div></div>`;
}
function homeView(){
  const kr=D.kr||{},us=D.us||{};
  const cc=o=>{const c=o.class_counts||{};return `<div class="kv">${Object.entries(c).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div>${CLS[k]||k}</div><div>${v}</div>`).join('')}</div>`;};
  const w=D.watchlist||[];
  const kh=+Utilities_kstHour(), usTime=kh>=21||kh<7;
  // 지난 값(어제 마감·지난 세션 — stInfo.old)은 날짜를 붙여 맨 아래로 (10/21 겸이: 장중에 홈 위쪽 'CLOSE KR'이 어제 마감이었음)
  const B=(k,t)=>({h:pre(k,t),old:!!(stInfo(k)||{}).old}), pick=(L,o)=>L.filter(x=>x.old===o).map(x=>x.h).join('');
  const usL=[B('intraday_us','INTRADAY US'),B('premarket_us','PREMARKET US'),{h:`<div class="p c6"><h2>US COMMITTEE<small>미장 운용회의 요약</small></h2><div class="b" id="homecus">${homeCusHtml()}</div></div>`,old:false}].concat(usTime?[]:[B('close_US','CLOSE US')]);
  const krL=[B('premarket_kr','PREMARKET KR'),B('close_KR','CLOSE KR')].concat(usTime?[B('close_US','CLOSE US')]:[]).concat([B('intraday_kr','INTRADAY KR')]);
  const usBlock=pick(usL,false), oldBlk=pick(krL,true)+pick(usL,true);
  let h=`<div class="grid">${homeConc()}${usTime?usBlock:''}${intradayPanel()}
   <div class="p c3"><h2>KR BREADTH</h2><div class="b">${breadthPanel('KR')}</div></div>
   <div class="p c3"><h2>US BREADTH</h2><div class="b">${breadthPanel('US')}</div></div>
   <div class="p c3"><h2>KR CLASSES<small>${kr.asof||''}</small></h2><div class="b">${cc(kr)}</div></div>
   <div class="p c3"><h2>US CLASSES<small>${us.asof||''}</small></h2><div class="b">${cc(us)}</div></div>
   <div class="p c6"><h2>MY PORTFOLIO<small>MY 탭 입력 기준 · 최근 종가</small></h2><div class="b" id="homemy">${homeMyStub()}</div></div>
   <div class="p c6"><h2>EVENTS<small>서킷브레이커·사이드카 · 이후 코스피</small></h2><div class="b" id="homeev">${evPanel()}</div></div>
   <div class="p c12"><h2>CALENDAR<small>실적·FOMC·CPI·만기 · 📌 = 내 보유</small></h2><div class="b" id="homecal">${calPanel()}</div></div>
   <div class="p c6"><h2>LATEST RESEARCH<small>${(D.reports||[]).length}</small></h2><div class="b">${repTable((D.reports||[]).slice(0,14))}</div></div>`;
  setTimeout(homeMyFill,0);
  h+=pick(krL,false)+(usTime?'':usBlock)+(oldBlk?`<div class="p c12 mu" style="font-size:var(--fs-1);padding:4px 8px">지난 값 — 날짜 확인 (오늘 것이 나오면 위로 올라감)</div>${oldBlk}`:'');
  if(CMTU===null) homeCusLoad();
  return h+'</div>';
}

/* 상단 3칸 어댑터 (묶음 B, 10/26) — Index.html TOPF·mkTop·topMount. 기존 문장·수치 재배치만, 근거 없으면 NA(사유). */
if(typeof TOPF==='object'){
TOPF.home=()=>{ const bv=mk=>{ const a=(D.breadth||[]).filter(x=>x.market===mk), L=a[a.length-1]; if(!L||L.pct_above200==null) return mk+' 폭 데이터 없음';
    const p=L.pct_above200; return `${mk} ${p>=0.6?'강세':p>=0.4?'중립':'약세'}(200일선 위 ${Math.round(p*100)}%, ${L.date})`; };
  const what=[bv('KR')+' · '+bv('US')]; if(typeof MV!=='undefined'&&MV&&MV.score!=null) what.push(`매크로 바람 ${MV.label||''} (${MV.score>0?'+':''}${Number(MV.score).toFixed(2)})`);
  const so=[]; [['KR',typeof CMT!=='undefined'?CMT:null],['US',typeof CMTU!=='undefined'?CMTU:null]].forEach(([m,o])=>{ if(o&&isTop(o.top)&&o.top.so_what[0]) so.push(`${m} 운용회의 — ${o.top.so_what[0]}`); });
  if(!so.length) so.push(NA('운용회의 판정 미로드 — DAILY › 운용회의'));
  const now=[], pend=typeof DEC!=='undefined'&&DEC&&DEC.items?homePendDuel(DEC.items,Date.now()):null, CD=typeof decCD==='function'?decCD():null,
    n=FR?(FR.late||[]).length+(FR.regress_today||[]).length+(FR.stale_today||[]).length:null;
  if(pend) now.push(`대결 제출 대기 ${pend}건 → 성적표`); if(CD) now.push('쿨다운 중 — 새 모의 베팅 금지'); if(n) now.push(`늦은 데이터 ${n}건 확인`);
  if(!now.length) now.push('조치 없음(대결 대기·쿨다운·늦은 데이터 없음)');
  return mkTop(what,so,now,['reports/dashboard.json','reports/committee.json','reports/decisions.json','reports/freshness.json'],D.generated_at,{grade:'검증전'}); };
}

<!-- tab_daily.html — DAILY 탭 — 데일리 리포트·VIEWS(관점 레지스트리)·브리핑 기록 (dailyView·viewsView·briefView).
     apps-script/Index.html 이 include('tab_daily') 템플릿 태그로 끼워 넣는다 (GAS 는 HtmlService include, Pages 는 scripts/build_pages.py 가 인라인).
     전역 도우미($·esc·num·pct·render·setView·openDetail 등)는 Index.html 에 있다. -->
<script>
let DB=null;
let DIDX=null, DSEL=null, DLATEST=null;
function dailyPick(){
  if(DIDX===null){ DIDX=false; google.script.run.withSuccessHandler(t=>{try{DIDX=JSON.parse(t);}catch(e){DIDX={days:[]};} if(view==='daily') render();}).withFailureHandler(()=>{DIDX={days:[]};}).getDailyIndex(); }
  const days=(DIDX&&DIDX.days)||[]; if(!days.length) return '';
  setTimeout(()=>{ const sel=$('#dsel'); if(!sel) return; sel.onchange=()=>{ const d=sel.value;
      if(!DLATEST&&DB&&DB.asof) DLATEST=DB;
      if(d==='latest'){ DSEL=null; DB=DLATEST||null; render(); return; }
      DSEL=d; google.script.run.withSuccessHandler(t=>{try{DB=JSON.parse(t);}catch(e){DB={};} render();}).getDailyAt(d); };
    document.querySelectorAll('[data-dstep]').forEach(b=>b.onclick=()=>{ const i=days.findIndex(x=>x.date===(DSEL||days[0].date)); const j=Math.min(days.length-1,Math.max(0,i+(+b.dataset.dstep))); sel.value=j===0&&!DSEL?'latest':days[j].date; if(j===0) sel.value='latest'; sel.onchange(); }); },0);
  return `<div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:6px"><span class="mu" style="font-size:var(--fs-2)">지난 브리프</span>
    <button data-dstep="1" class="sbtn">◀ 이전</button>
    <select id="dsel" style="background:#050505;color:var(--txt);border:1px solid var(--line);font:inherit;padding:4px 6px;max-width:72vw"><option value="latest" ${!DSEL?'selected':''}>최신</option>${days.map(x=>`<option value="${esc(x.date)}" ${DSEL===x.date?'selected':''}>${esc(x.date)} · ${esc(String(x.headline||'').slice(0,40))}</option>`).join('')}</select>
    <button data-dstep="-1" class="sbtn">다음 ▶</button>${DSEL?`<span class="am" style="font-size:var(--fs-2)">${esc(DSEL)} 기록 보는 중</span>`:''}</div>`;
}
function dailyView(){ const _h=dailyView0(); return _h.startsWith('<div class="load"')?_h:`<div class="grid" style="padding-bottom:0"><div class="c12">${dailyPick()}${DSEL?'':decBox()}</div></div>`+_h; }
function dailyView0(){
  if(DB===null){ DB=false; google.script.run.withSuccessHandler(t=>{try{DB=JSON.parse(t);}catch(e){DB={};} if(view==='daily') render();}).withFailureHandler(()=>{DB={}; if(view==='daily') render();}).getDaily(); return '<div class="load">LOADING …</div>'; }
  if(!DB||!DB.asof) return '<div class="mu" style="padding:16px">데일리 브리프가 아직 없습니다 (다음 자동 실행 때 생성)</div>';
  const o=DB;
  const th=o.themes.map(t=>{const tones=Object.entries(t.tones).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`${k} ${v}`).join(', ');
    return `<tr><td class="l am">${esc(t.theme)}</td><td>${t.n}</td><td>${t.stocks}</td><td><b class="${t.pos_share>=0.6?'up':t.pos_share<0.4?'dn':'am'}">${Math.round(t.pos_share*100)}%</b></td><td class="l">${esc((t.topics||[]).join(', '))}</td><td>${t.tp_up||t.tp_down?`<span class="up">↑${t.tp_up}</span> <span class="dn">↓${t.tp_down}</span>`:'—'}</td><td class="l mu">${esc(t.top_stocks.join(', '))}</td></tr><tr class="sub on"><td></td><td colspan="6">${(t.views||[]).map(v=>`<div>· ${esc(v)}</div>`).join('')}<div class="mu">톤: ${esc(tones)}</div></td></tr>`;}).join('');
  return `<div class="grid">
   <div class="p c12"><h2>DAILY RESEARCH BRIEF<small>${esc(o.asof)} · 최근 ${o.days}일 리포트 ${o.n_reports}건 · 규칙 기반</small></h2><div class="b"><div class="bv am" style="font-size:var(--fs-4)">${esc(o.headline)}</div></div></div>
   <div class="p c4"><h2>1. TOP-DOWN</h2><div class="b">${(o.topdown.markets||[]).map(x=>`<div>${tgHtml(x)}</div>`).join('')}<div style="margin-top:6px">${(o.topdown.regime||[]).map(x=>`<div>• ${tgHtml(x)}</div>`).join('')}</div></div></div>
   <div class="p c8"><h2>3. 통합 판단<small>탑다운 × 바텀업</small></h2><div class="b">${(o.links||[]).length?o.links.map(x=>`<div style="margin-bottom:6px">▶ ${esc(x)}</div>`).join(''):'<div class="mu">특이 연결 신호 없음</div>'}
     <div class="mu" style="margin-top:8px">리포트 공통 화두: ${Object.entries(o.topics||{}).map(([k,v])=>`${esc(k)} ${v}`).join(' · ')}</div></div></div>

  </div>`;
}
/* ───── VIEWS: 관점(렌즈) 레지스트리 — views/registry.json → reports/views.json ───── */
let VW=null;
function viewsView(){
  if(VW===null){ VW=false; google.script.run.withSuccessHandler(t=>{try{VW=JSON.parse(t);}catch(e){VW={};} if(view==='views') render();}).withFailureHandler(()=>{VW={}; if(view==='views') render();}).getViews(); return '<div class="load">LOADING …</div>'; }
  if(!VW||!VW.summary) return '<div class="grid"><div class="p c12"><div class="b mu">VIEW 데이터 없음 — 다음 자동 실행(장전·장 마감) 때 생성</div></div></div>';
  const GC={A:'g',B:'',C:'b',F:'r'};
  const gb=g=>`<span class="tag ${g in GC?GC[g]:'b'}" title="근거 등급">${esc(g||'—')}</span>`;
  const gr=r=>r==='pass'?'<b class="up">통과</b>':r==='fail'?'<b class="dn">불통과</b>':`<span class="mu">${esc(r||'—')}</span>`;
  const RL={gate:'게이트',weight:'가중',alert:'주의',reference:'참고',none:'—'};
  const RC={gate:'am',weight:'am',alert:'',reference:'mu',none:'mu'};
  const tl=x=>x==null?'<span class="mu">— (가중 렌즈 신호 없음)</span>':`<b class="${x>0?'up':x<0?'dn':'mu'}">${x>0?'+':''}${x.toFixed(2)}</b>`;
  const col=d=>{ const s=VW.summary[d]||{};
    const gates=(s.gates||[]).map(g=>`<div>${gr(g.result)} ${esc(g.name)} ${gb(g.grade)} <span class="mu">${esc(g.state)}</span></div>`).join('');
    const priv=(s.private_gates||[]).length?`<div class="mu" style="font-size:var(--fs-1)">개인 게이트 ${(s.private_gates||[]).length}개 — 비공개 저장소에서 판정: ${(s.private_gates||[]).map(g=>esc(g.name)).join(' · ')}</div>`:'';
    const wts=(s.weights||[]).map(w=>`<div>${w.sign==null?'<span class="mu">·</span>':w.sign>0?'<b class="up">+1</b>':w.sign<0?'<b class="dn">−1</b>':'<span class="mu">0</span>'} ${esc(w.name)} ${gb(w.grade)} <span class="mu">${esc(w.state)}</span></div>`).join('');
    const al=(s.alerts||[]).map(a=>`<div><b class="am">!</b> ${esc(a.name)}${a.expires?` <span class="mu">(~${esc(a.expires)})</span>`:''}<div class="mu" style="font-size:var(--fs-1);white-space:normal">${esc(a.line||'')}</div></div>`).join('');
    const ov=s.gate==='fail'?'<b class="dn">불통과</b>':s.gate==='pass'?'<b class="up">통과</b>':`<span class="mu">${esc(s.gate||'—')}</span>`;
    return `<div class="p c4"><h2>${esc(s.label||d)}<small>공개 게이트 ${ov}</small></h2><div class="b" style="white-space:normal;font-size:var(--fs-2);line-height:1.7">
      <div class="am" style="font-size:var(--fs-1)">게이트</div>${gates||'<div class="mu">공개 게이트 없음</div>'}${priv}

      <div class="am" style="font-size:var(--fs-1);margin-top:6px">주의 ${(s.alerts||[]).length}</div>${al||'<div class="mu">없음</div>'}
      <div class="mu" style="font-size:var(--fs-1);margin-top:6px">참고 ${(s.reference||[]).length}개 — 근거로 인용 시 '참고' 표시</div></div></div>`; };
  const ls=(VW.lenses||[]).slice().sort((a,b)=>(a.family==='personal')-(b.family==='personal'));
  const rows=ls.map(L=>{ const r=L.roles||{}; const st=String(L.status||'');
    return `<tr><td class="l"><b>${esc(L.name_ko)}</b><div class="mu" style="font-size:var(--fs-1)">${esc(L.id)} · ${esc(L.family)}</div></td>

// PIN 잠금 기억: 토큰을 PIN 으로 암호화(AES-GCM, PBKDF2 25만 회)해 이 브라우저에 저장 → 다음부턴 PIN 만 입력. 복호화한 토큰은 이 창(sessionStorage)에만.
const GHE='mt_gh_enc';
function alertMsg(m){ const e=$('#mysync'); if(e) e.textContent=m; }
const _b64=u=>btoa(String.fromCharCode(...new Uint8Array(u))), _ub64=t=>Uint8Array.from(atob(t),c=>c.charCodeAt(0));
async function _ghKey(pin,salt){ const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pin),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:250000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['encrypt','decrypt']); }
async function ghLock(tok,pin){ const salt=crypto.getRandomValues(new Uint8Array(16)), iv=crypto.getRandomValues(new Uint8Array(12));
  const c=await crypto.subtle.encrypt({name:'AES-GCM',iv},await _ghKey(pin,salt),new TextEncoder().encode(tok));
  localStorage.setItem(GHE,JSON.stringify({s:_b64(salt),i:_b64(iv),c:_b64(c)})); }
async function ghUnlock(pin){ try{ const o=JSON.parse(localStorage.getItem(GHE)||'null'); if(!o) return false;
  const p=await crypto.subtle.decrypt({name:'AES-GCM',iv:_ub64(o.i)},await _ghKey(pin,_ub64(o.s)),_ub64(o.c));
  sessionStorage.setItem(GHK,new TextDecoder().decode(p)); return true; }catch(e){ return false; } }
function ghLocked(){ try{ return !ghTok() && !!localStorage.getItem(GHE); }catch(e){ return false; } }

// 정규화 = pb:scripts/secrets_gen.py gen_holdings()→digest() 와 같은 규칙: 줄 앞뒤 공백 제거·빈 줄 제거·주석(#, '## ISA' 제외) 제거·연속 공백 1칸 → SHA-256 앞 16자
function myNorm(t){ return String(t||'').split(/\r\n|\r|\n/).map(l=>l.trim()).filter(l=>l&&(ISA_HEAD.test(l)||!l.startsWith('#'))).map(l=>l.replace(/\s+/g,' ')).join('\n'); }

const myDiffHtml=(d,la,lb)=>`<div style="font-size:var(--fs-2);line-height:1.6;margin-top:4px">${d.onlyA.map(l=>`<div class="dn">− ${esc(la)}: ${esc(l)}</div>`).join('')}${d.onlyB.map(l=>`<div class="up">+ ${esc(lb)}: ${esc(l)}</div>`).join('')||''}${d.n?'':'<div class="mu">차이 없음</div>'}</div>`;

      else if(myNorm(loc)===myNorm(c)) MYSYNC={st:'원장과 같음',at};

<script>
/* ───── LIFE: pb-private/life/summary.json (가계부·커리어·건강·목표) — 토큰으로 이 브라우저에서만 읽음, 공개 서버 경유 없음 ───── */
let LIFE=null, LIFEERR='', LIFEFM=null;
function lifeView(){
  const tk=ghTok();
  if(tk&&!LIFE&&!LIFEERR) setTimeout(()=>pbGet('life/freeman_calc.json').then(t=>{ LIFEFM=JSON.parse(t); if(view==='life'&&LIFE) lifeFill(); }).catch(()=>{}),0);
  if(tk&&!LIFE&&!LIFEERR) setTimeout(()=>pbGet('life/summary.json').then(t=>{ LIFE=JSON.parse(t); if(view==='life') lifeFill(); }).catch(e=>{ LIFEERR=e.message; const b=$('#lifeb'); if(b) b.innerHTML=`<div class="p c12"><div class="b dn">불러오기 실패(${esc(e.message)}) — 토큰 권한(pb-private Contents: Read) 확인 · <a href="#" onclick="LIFEERR='';render();return false">다시 시도</a></div></div>`; }),0);
  else if(LIFE) setTimeout(lifeFill,0);
  const head=`<div class="p c12"><h2>LIFE<small>가계부 · 커리어 · 건강 · 목표 · 비공개 저장소(pb-private/life)에서 이 브라우저로 직접 읽음</small></h2><div class="b mu" style="font-size:var(--fs-2);white-space:normal">

  if(!tk) return `<div class="grid">${head}<div class="p c12"><div class="b" style="white-space:normal">이 탭은 비공개 저장소 토큰이 있어야 보여요. <a href="#" onclick="setView('my');return false">MY 탭 → 토큰 설정</a>에서 읽기 전용 토큰을 저장한 뒤 돌아오세요.</div></div></div>`;
  return `<div class="grid">${head}<div id="lifeb" style="display:contents"><div class="p c12"><div class="b mu">${LIFEERR?'불러오기 실패('+esc(LIFEERR)+') · <a href="#" onclick="LIFEERR=\'\';render();return false">다시 시도</a>':'불러오는 중…'}</div></div></div></div>`;
}
function lifeFill(){

  const F=LIFEFM, fm=!F?'':`<div class="p c12"><h2>1억까지 몇 달 · 과거 실제 경로<small>${esc(F.data||'')} · ${esc(F.asof||'')}</small></h2><div class="b" style="white-space:normal">

/* LIFE · 건강 체성분 패널 — summary.json.health(body·series·targets·weight_path·pace·workouts_weekly·lifts). 수치는 비공개 저장소에서 런타임에만 읽음 */

  const bar=(p,c)=>`<div class="bar"><i style="width:${Math.max(0,Math.min(100,(p||0)*100))}%;${c?'background:var('+c+')':''}"></i></div>`;
  const keys=[['fat_kg','체지방량','kg','down'],['smm','골격근량','kg','up'],['fat_pct','체지방률','%','down'],['visceral_area','내장지방면적','cm²','down'],['weight','체중','kg','down']];
  const any=keys.some(k=>B[k[0]]);

  const stc=s=>s==='달성'||s==='유지 중'?'up':s==='실패'||s==='목표 아래'?'dn':s==='미달'?'am':'mu';

  const path=WP?`체중 기준 경로 ${f1(WP.from[1])}→${f1(WP.to[1])} (주 ${f1(WP.per_week)}kg) · 오늘 기준 ${f1(WP.ref_today)}kg · 최근 측정은 경로 대비 ${sg(WP.gap,'down')}kg`:'';
  const pace=`<div style="white-space:normal;font-size:var(--fs-2);margin-top:6px"><span class="${PC.flag?'dn':'mu'}">● ${esc(PC.rule||'')}</span> &nbsp; <span class="${PC.smm_per_month!=null&&PC.smm_per_month<-0.5?'dn':'mu'}">● ${esc(PC.smm_rule||'')}</span><br><span class="mu">${path}</span></div>`;
  const mx=Math.max(4,...WW.map(w=>w.count||0)), y3=(38-3/mx*36).toFixed(1);

  const spark=pts=>{ if(!pts||pts.length<2) return ''; const v=pts.map(p=>p[1]), lo=Math.min(...v), hi=Math.max(...v), r=hi-lo||1; return `<svg viewBox="0 0 60 16" style="width:60px;height:16px;vertical-align:middle"><polyline fill="none" style="stroke:var(--amber)" stroke-width="1.2" points="${v.map((x,i)=>(i/(v.length-1)*60).toFixed(1)+','+(15-(x-lo)/r*14).toFixed(1)).join(' ')}"/></svg>`; };

  return `${synSec()}<div class="grid"><div class="p c12"><h2>RESEARCH${kindTabs()}<span class="ctab">${btn('m','theme','테마별')}${btn('m','sector','업종별')}${btn('m','stock','종목별')}${btn('m','all','전체')}</span><span class="ctab">${[7,30,90,180].map(d=>btn('d',d,d+'D')).join('')}</span><span class="ctab"><span class="mu" style="font-size:var(--fs-1)">국면</span>${[['k','코스피'],['s','종목']].map(([b,l])=>`<button class="${RV.rb===b?'on':''}" onclick="repRb('${b}')">${l}</button>`).join('')}${[['all','전체'],['상승','상승'],['조정','조정'],['하락','하락']].map(([f,l])=>`<button class="${RV.rf===f?'on':''}" onclick="RV.rf='${f}';render()">${l}</button>`).join('')}</span><span class="ctab">${[['count','많은순'],['new','최신순'],['old','오래된순']].map(([o,l])=>`<button class="${RV.o===o?'on':''}" onclick="repOrd('${o}')">${l}</button>`).join('')}</span><small id="rcnt"></small></h2>
   <div class="b"><input id="rq" class="rq" placeholder="종목 · 증권사 · 섹터 · 제목 검색" value="${esc(RV.q)}" oninput="RV.q=this.value;repFill()">${R.err?`<div class="err">${esc(R.err)}</div>`:''}<div id="rbody"></div></div></div></div>`;
}
function repFill(){ if(RV.k!=='종목') return rvwFill(); const b=$('#rbody'); if(!b||!R) return; const it=repFilter(); b.innerHTML=repBody(it); const c=$('#rcnt'); if(c) c.textContent=`${it.length}건 · ${new Set(it.map(r=>r.code)).size}종목 · 기준 ${R.asof||''}`; }
function repFilter(){ const cut=new Date(Date.now()-RV.d*864e5+9*36e5).toISOString().slice(0,10), q=RV.q.trim().toLowerCase();
  return (R.items||[]).filter(r=>r.date>=cut&&(RV.rf==='all'||(rgOf(r)||{}).l===RV.rf)&&(!q||[r.name,r.code,r.broker,r.sector,r.theme,r.analyst,r.title].join(' ').toLowerCase().includes(q))); }
function stockAgg(items){ const m=new Map(); for(const r of items){ if(!m.has(r.code)) m.set(r.code,{code:r.code,name:r.name,sector:r.sector||'기타',theme:r.theme||r.sector||'기타',rs:[]}); m.get(r.code).rs.push(r);}
  return [...m.values()].map(s=>{ s.rs.sort((a,b)=>b.date.localeCompare(a.date)); const lb=new Map(); for(const r of s.rs) if(r.target&&!lb.has(r.broker)) lb.set(r.broker,r.target);
    const tp=med([...lb.values()]), c=(R.close||{})[s.code]; return {...s,n:s.rs.length,nb:new Set(s.rs.map(r=>r.broker)).size,last:s.rs[0],tp,close:c,up:(tp&&c)?tp/c-1:null}; })
   .sort((a,b)=>b.n-a.n||b.last.date.localeCompare(a.last.date)); }
const BUYR=/buy|매수|outperform|overweight|비중확대|strong/i, SELLR=/sell|매도|underperform|underweight|비중축소|reduce/i;
function coreView(s){
  const lb=new Map(); for(const r of s.rs) if(!lb.has(r.broker)) lb.set(r.broker,r);
  const L=[...lb.values()], tps=L.map(r=>r.target).filter(Boolean);
  const b=L.filter(r=>BUYR.test(r.opinion||'')).length, se=L.filter(r=>SELLR.test(r.opinion||'')).length, h=L.length-b-se;
  const up=s.rs.filter(r=>r.tp_chg>0.001).length, dn=s.rs.filter(r=>r.tp_chg<-0.001).length;
  const parts=[`${L.length}곳`, [b?`매수 ${b}`:'',h?`중립·기타 ${h}`:'',se?`매도 ${se}`:''].filter(Boolean).join(' / ')];
  if(tps.length) parts.push(`TP ${num(Math.min(...tps))}${tps.length>1?'~'+num(Math.max(...tps)):''}${s.up!=null?` (${(s.up*100>0?'+':'')+(s.up*100).toFixed(0)}%)`:''}`);
  if(up||dn) parts.push(`목표가 ${up?'상향 '+up:''}${up&&dn?' · ':''}${dn?'하향 '+dn:''}`);
  const tn={}; for(const r of L) if(r.tone) tn[r.tone]=(tn[r.tone]||0)+1;
  const tl=Object.entries(tn).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`${k} ${v}`).join(', '); if(tl) parts.push(`톤: ${tl}`);
  return parts.filter(Boolean).join(' · ');
}
function repLine(r){
  const ch=r.tp_chg>0.001?` <span class="up">↑${(r.tp_chg*100).toFixed(0)}%</span>`:r.tp_chg<-0.001?` <span class="dn">↓${(r.tp_chg*100).toFixed(0)}%</span>`:'';
  const op=r.op_chg>0?' <span class="up">의견↑</span>':r.op_chg<0?' <span class="dn">의견↓</span>':'';
  const TC={'낙관':'up','긍정(유지)':'up','신중한 매수':'am','사실상 중립':'am','중립':'mu','사실상 매도':'dn','매도':'dn','의견 없음':'mu'};
  const tone=r.tone?`<span class="tone ${TC[r.tone]||'mu'}">${esc(r.tone)}${r.tone_why?` <i>${esc(r.tone_why)}</i>`:''}</span>`:'';
  const ev=(r.evidence||[]).map(x=>`<li>${esc(x)}</li>`).join('');
  const showThesis=r.thesis&&r.thesis!==r.title&&!r.view;   // 제목과 같은 '논지'는 정보가 없어 숨김
  const body=(r.view||showThesis||ev||r.risk||r.method)?`<div class="sm">${r.view?`<div><span class="k">핵심</span><b>${esc(r.view)}</b></div>`:''}${showThesis?`<div><span class="k">논지</span>${esc(r.thesis)}</div>`:''}${ev?`<div><span class="k">근거</span><ul>${ev}</ul></div>`:''}${r.risk?`<div><span class="k">변수</span>${esc(r.risk)}</div>`:''}${r.method?`<div><span class="k">밸류</span>${esc(r.method)}</div>`:''}</div>`:(r.summary&&r.summary!=='-'?`<div class="sm">${esc(r.summary)}</div>`:'');
  return `<div class="rp"><div><span class="mu">${r.date}</span>${rgBadge(r)} <b>${esc(r.broker)}</b>${anBadge(r)} · ${esc(r.opinion||'—')} · TP ${r.target?num(r.target):'—'}${ch}${op} ${tone}</div><div class="rt">${r.link?`<a href="${esc(r.link)}" target="_blank">${esc(r.title||'원문')}</a>`:esc(r.title||'')}${surpNote(r.title)}${r.curated?'':' <span class="mu">· 자동 요약</span>'}</div>${body}</div>`;
}
function stockRows(ss,showSec){ if(!ss.length) return '<div class="mu">해당 기간 리포트 없음</div>';
  return `<table><tr><th></th><th class="l">종목</th>${showSec?'<th class="l">섹터</th>':''}<th class="l">핵심 뷰</th><th class="l">최근</th><th>종가</th></tr>${ss.map(s=>`<tr><td class="tg" title="증권사별 요약 펼치기">▸</td><td class="l am sym" data-sym="${esc(s.code)}" data-mk="KR">${esc(s.name)} <span class="mu">${esc(s.code)}</span></td>${showSec?`<td class="l mu">${esc(s.sector)}</td>`:''}<td class="l">${coreView(s)}</td><td class="l mu">${s.last.date}</td><td>${s.close?num(s.close):'—'}</td></tr><tr class="sub"><td></td><td colspan="${showSec?5:4}">${s.rs.map(repLine).join('')}</td></tr>`).join('')}</table>`; }
function repBody(it){
  if(RV.m==='all'){ it=[...it].sort((a,b)=>RV.o==='old'?a.date.localeCompare(b.date):b.date.localeCompare(a.date)); }
  if(RV.m==='all') return it.length?`<table><tr><th class="l">날짜</th><th class="l">종목</th><th class="l">섹터</th><th class="l">증권사</th><th class="l">의견</th><th>TP</th><th class="l">제목</th></tr>${it.map(r=>`<tr><td class="l mu">${r.date}${rgBadge(r)}</td><td class="l am sym" data-sym="${esc(r.code)}" data-mk="KR">${esc(r.name)}</td><td class="l mu">${esc(r.sector||'기타')}</td><td class="l">${esc(r.broker)}</td><td class="l">${esc(r.opinion||'')}</td><td>${r.target?num(r.target):'—'}</td><td class="l">${r.link?`<a href="${esc(r.link)}" target="_blank">${esc(r.title||'리포트')}</a>`:esc(r.title||'')}${surpNote(r.title)}</td></tr>`).join('')}</table>`:'<div class="mu">해당 기간 리포트 없음</div>';
  let ss=stockAgg(it);
  if(RV.o!=='count') ss=[...ss].sort((a,b)=>repCmp(a.last.date,b.last.date));
  if(RV.m==='stock') return stockRows(ss,true);
  const gk=RV.m==='theme'?'theme':'sector';
  const g=new Map(); for(const s of ss){ if(!g.has(s[gk])) g.set(s[gk],[]); g.get(s[gk]).push(s); }
  const tot=a=>a.reduce((x,s)=>x+s.n,0);
  const gl=a=>a.reduce((x,s)=>s.last.date>x?s.last.date:x,'');
  return [...g.entries()].sort((a,b)=>RV.o==='count'?tot(b[1])-tot(a[1]):repCmp(gl(a[1]),gl(b[1]))).map(([sec,a])=>`<details open class="sec"><summary><b class="am">${esc(sec)}</b> <span class="mu">${tot(a)}건 · ${a.length}종목</span></summary>${stockRows(a,false)}</details>`).join('')||'<div class="mu">해당 기간 리포트 없음</div>'; }
document.addEventListener('click',e=>{const t=e.target.closest('td.tg'); if(!t) return; const sub=t.parentElement.nextElementSibling; if(sub&&sub.classList.contains('sub')){sub.classList.toggle('on'); t.textContent=sub.classList.contains('on')?'▾':'▸';}});

TOPF.val=()=>{ if(VAL===null||VAL===false) return null; if(VAL&&isTop(VAL.top)) return VAL.top; if(!VAL||!VAL.basket) return mkTop(NA(VAL&&VAL.err||'밸류에이션 데이터 없음'),NA('—'),NA('—'),['reports/valuation.json']);
  const b=VAL.basket, d=b.decomp20||{}, s=b.rate_sens||{}, f=(x,n=1)=>x==null?'—':Number(x).toFixed(n), P=x=>x==null?'—':(x>0?'+':'')+(x*100).toFixed(1)+'%';
  const ev=((VAL.events||{}).next||[])[0];

    [`금리 ±${s.bp||'—'}bp → 중앙 PER ${P(s.up)}/${P(s.down)} (ERP 고정 가정)`,'밸류에이션은 참고(검증전) — 매매 트리거 아님'],ev?`다음 이벤트 ${String(ev.date).slice(5)} ${ev.name} 확인`:'조치 없음(예정 이벤트 없음)',['reports/valuation.json'],VAL.generated_at||VAL.asof,{grade:'검증전'}); };
TOPF.dart=()=>{ if(!DS) return null; const it=DS.items||[], fl=it.filter(r=>r.flag||/주의|희석/.test(r.category||''));
  return mkTop(DS.err?NA(DS.err):`공시 ${it.length}건`+(DS.asof?` (${DS.asof})`:''),fl.length?`주의·희석 분류 ${fl.length}건 — 키워드 분류(검증전)`:NA('주의·희석 공시 없음'),fl.length?'⚠ 주의·희석 필터로 원문 확인(애널)':'조치 없음',['reports/disclosures.json'],DS.asof); };

<!-- tab_quant.html — QUANT 탭 — 공급망·시그널 검증·검증 스터디·전략 연구소·모멘텀·모의 포트폴리오 (chainView·sigView·studyView·labView·momView·pfView).
     apps-script/Index.html 이 include('tab_quant') 템플릿 태그로 끼워 넣는다 (GAS 는 HtmlService include, Pages 는 scripts/build_pages.py 가 인라인).

<script>
let PF=null, PFSEL=null;

function studyView(){

  if(!STU||!STU.drop_days) return '<div class="grid"><div class="p c12"><div class="b mu">스터디 결과 없음</div></div></div>';
  const f=x=>x?`<td>${pct(x.avg,2)}</td><td class="mu">${pct(x.med,2)}</td><td>${Math.round(x.up*100)}%</td><td class="dn">${pct(x.worst,1)}</td>`:'<td colspan="4" class="mu">—</td>';
  const H='<th>평균</th><th>중앙</th><th>상승</th><th>최악</th>';

  const B=STU.base.all_days;
  const blk=(title,k)=>`<div class="am" style="font-size:var(--fs-2);margin:10px 0 2px">${title}</div><table><tr><th class="l">조건</th><th>횟수</th>${H}</tr>
     ${row('모든 날 (기준)',{days:(B[k]||{}).n,[k]:B[k]},k)}

     ${Object.entries(STU.conditional).map(([t,o])=>row(t.replace('_',' '),o,k)).join('')}
     ${row('5일 안에 두 번째 −5%',STU['cluster_(5일 내 두 번째 −5%)'],k)}</table>`;
  const lv=STU.lev_trade||{};

    <div class="mu" style="font-size:var(--fs-2);line-height:1.7;white-space:normal">급락일 종가 대비 이후 코스피 수익률. '20일 −15% 이상 하락 중'은 이미 크게 빠진 상태에서 또 −5% 급락한 날(예: 2026-10-15).</div>
    ${blk('다음날','d1')}${blk('5거래일 뒤','d5')}${blk('20거래일 뒤','d20')}
    <div class="am" style="font-size:var(--fs-2);margin:12px 0 2px">KODEX 레버리지(122630) 급락일 종가 매수 시뮬레이션 · 왕복비용 0.05%</div>
    ${Object.entries(lv).map(([t,o])=>`<div class="mu" style="font-size:var(--fs-2);margin-top:4px">${esc(t)}</div><table><tr><th class="l">매도</th><th>횟수</th>${H}</tr>${Object.entries(o).map(([k,x])=>`<tr><td class="l">${esc(k)}</td><td class="mu">${x?x.n:''}</td>${f(x)}</tr>`).join('')}</table>`).join('')}
    <div class="mu" style="font-size:var(--fs-1);margin-top:8px;white-space:normal">해석: 반등 경향은 있지만 레버리지 기준 평균 +2~3%, 최악은 다음날 시가부터 −18%. 다음날 시가 매도가 종가 매도보다 승률이 높았음. 표본의 상당수가 2020·2026년에 몰려 있음.</div>
  </div></div></div>`;
}
let LAB=null;
function labView(){
  if(LAB===null){ LAB=false; google.script.run.withSuccessHandler(t=>{try{LAB=JSON.parse(t);}catch(e){LAB={};} if(view==='lab') render();}).withFailureHandler(()=>{LAB={};if(view==='lab') render();}).getLab(); return '<div class="load">LOADING …</div>'; }
  if(!LAB||!LAB.results) return '<div class="grid"><div class="p c12"><div class="b mu">전략 연구소 결과 없음 — 주간 실행 전</div></div></div>';
  const gc=g=>g==='A'?'var(--up)':g==='B'?'var(--amber)':g==='C'?'var(--muted)':'var(--dn)';
  const T=x=>x==null?'—':x.toFixed(1), N=x=>x==null?'—':x;
  const reg=LAB.registry||[], byId=Object.fromEntries(reg.map(r=>[r.id,r]));
  const SPL=['IS','OOS','HOLDOUT'];
  // 구버전 lab.json (variants 없음) 호환
  const varsOf=r=>r.variants?Object.values(r.variants):[{entry:'open',label:'다음날 시가 진입',grade:r.grade,reasons:r.reasons,splits:Object.fromEntries(SPL.map(k=>[k,{ew:(r.splits||{})[k]||{}}]))}];
  const ex=d=>d&&d.n?`${pct(d.mean_ex,2)}<div class="mu" style="font-size:var(--fs-1)">t ${T(d.t)}</div>`:'<span class="mu">—</span>';
  const cell=sp=>{const e=(sp||{}).ew, k=(sp||{}).kospi, n=(k&&k.n)||(e&&e.n)||0; return `<td>${e?ex(e):'<span class="mu">—</span>'}</td><td>${ex(k)}</td><td class="mu">${n||'—'}</td>`;};
  const rows=Object.entries(LAB.results).map(([id,r])=>{ const g=byId[id]||{}, vs=varsOf(r);
    const isNew=g.registered&&g.registered!==(reg[0]||{}).registered;
    const sig=r.last_signals?`<div style="font-size:var(--fs-1)">신호 ${esc(r.last_signals.date)}: ${r.last_signals.picks.slice(0,12).map(p=>`<span class="am sym" data-sym="${esc(p.s)}" data-mk="KR">${esc(p.n)}</span>`).join(' · ')}</div>`:'';
    const st=r.state?`<div style="font-size:var(--fs-1)">현재 ${esc(r.state.date)} 12개월 ${pct(r.state.k12m,1)} → <b class="am">${r.state.hold?'지수 보유':'현금'}</b></div>`:'';
    const ev=r.n_events!=null?`<div class="mu" style="font-size:var(--fs-1)">이벤트 전체 ${r.n_events}회 · 최근 ${esc((r.events||[]).slice(-3).join(', '))}</div>`:'';
    return vs.map((v,i)=>{ const I=(v.splits.IS||{}).ew||(v.splits.IS||{}).kospi||{}, by=v.grade_by||{};
      const head=i===0?`<td class="l" rowspan="${vs.length}" title="${esc(g.hypothesis||'')}"><b>${esc(g.name||id)}</b>${isNew?' <span class="tag">신규 '+esc(g.registered.slice(5))+'</span>':''}<div class="mu" style="font-size:var(--fs-1)">${esc(id)} · 보유 ${g.hold}일 · 주 기준 ${esc(g.bench||'EW')}</div>${ev}${sig}${st}</td>`:'';

    <div style="overflow:auto;margin-top:6px"><table><tr><th class="l">연도</th>${bt.years.map(y=>`<th>${y.year}</th>`).join('')}</tr><tr><td class="l am">모멘텀</td>${bt.years.map(y=>`<td>${pct(y.port,0)}</td>`).join('')}</tr><tr><td class="l">+필터</td>${bt.years.map(y=>`<td>${pct(y.filt,0)}</td>`).join('')}</tr><tr><td class="l mu">유니버스</td>${bt.years.map(y=>`<td>${pct(y.bench,0)}</td>`).join('')}</tr></table></div>
    <div class="mu" style="margin-top:6px">주의: 가격 수익률(배당 미포함) · 유상증자 권리락은 보정 안 됨 · 과거 성과, 미래 보장 아님</div>`;
  setTimeout(()=>drawBt(bt),0);
  return `<div class="grid"><div class="p c12"><h2>MOMENTUM BACKTEST · KR 2010~<small>12-1개월 모멘텀이 한국에서 통했는가</small></h2><div class="b">${btHtml}</div></div>
    <div class="p c6"><h2>MOMENTUM RANK · KR</h2><div class="b">${tbl(MO.KR,'KR')}</div></div>
    <div class="p c6"><h2>MOMENTUM RANK · US</h2><div class="b">${tbl(MO.US,'US')}</div></div></div>`;
}
function drawBt(bt){ const cv=$('#mbt'); if(!cv||!bt||!bt.curve) return; const W=cv.width=cv.clientWidth*2,H=cv.height=520,x=cv.getContext('2d'),c=bt.curve,pl=70,pr=16,pt=14,pb=40;
  const vals=c.flatMap(r=>[r[1],r[2],r[3]]).map(v=>Math.log(v)), lo=Math.min(...vals), hi=Math.max(...vals), Y=v=>pt+(hi-Math.log(v))/((hi-lo)||1)*(H-pt-pb), X=i=>pl+(W-pl-pr)*i/(c.length-1);
  x.fillStyle='#050505';x.fillRect(0,0,W,H);x.font='20px monospace';
  [0.25,0.5,1,2,4,8].forEach(v=>{const lv=Math.log(v); if(lv<lo-0.05||lv>hi+0.05) return; const y=Y(v);x.strokeStyle='#1c1c1c';x.beginPath();x.moveTo(pl,y);x.lineTo(W-pr,y);x.stroke();x.fillStyle='#777';x.fillText('x'+v,6,y+7);});
  const line=(k,col)=>{x.strokeStyle=col;x.lineWidth=3;x.beginPath();c.forEach((r,i)=>i?x.lineTo(X(i),Y(r[k])):x.moveTo(X(i),Y(r[k])));x.stroke();};
  line(2,'#777');line(3,'#4aa3ff');line(1,'#ff9a1f');
  x.fillStyle='#777';for(let i=0;i<c.length;i+=24)x.fillText(c[i][0].slice(0,4),X(i)-20,H-12);
  x.fillStyle='#ff9a1f';x.fillText('모멘텀',W-300,30);x.fillStyle='#4aa3ff';x.fillText('+필터',W-200,30);x.fillStyle='#999';x.fillText('유니버스',W-110,30);}

/* 상단 3칸 어댑터 (묶음 B, 10/26) — Index.html TOPF·mkTop·topMount. 기존 문장·수치 재배치만, 근거 없으면 NA(사유). */
if(typeof TOPF==='object'){
TOPF.study=()=>{ if(STU===null||STU===false) return null; const m=(STU&&STU.meta)||{};
  return mkTop(STU&&STU.drop_days?`급락일 반등 스터디 — 급락 기준 ${Array.isArray(STU.drop_days)?STU.drop_days.length+'건':Object.keys(STU.drop_days||{}).join('·')} (코스피·레버리지 이후 수익률 표)`:NA('스터디 결과 없음'),NA('결론 문장은 reports/studies 본문 — 화면은 표'),NA('적용 판단은 퀀트 본문 결론 기준'),['reports/studies/crash_rebound.json'],(m.run_at_utc||'').replace('T',' ').replace('Z',' UTC'),{grade:'검증전'}); };
TOPF.lab=()=>{ if(LAB===null||LAB===false) return null; if(!LAB||!LAB.results) return mkTop(NA('전략 연구소 결과 없음'),NA('—'),NA('—'),['reports/lab.json']);
  const g=LAB.gate||{}; return mkTop(`전략 ${Object.keys(LAB.results).length}종 · 동시 검정 ${g.m||'—'}개 → 통과선 t ≥ ${g.req_t!=null?Number(g.req_t).toFixed(2):'—'}`,'다중검정 보정 후 통과선 미달 전략은 참고(C)·폐기(F) — 표의 등급 열 기준',NA('채택은 연구 보드 관문 기준'),['reports/lab.json'],LAB.asof); };
TOPF.sig=()=>{ if(typeof SG==='undefined'||SG===null||SG===false) return null; if(!SG||!SG.signals) return mkTop(NA('채점 결과 없음'),NA('—'),NA('—'),['reports/signal_scores.json']);
  const v=Object.values(SG.signals).map(r=>r.verdict||'—'), c={}; v.forEach(x=>c[x]=(c[x]||0)+1);
  return mkTop(`신호 ${v.length}개 채점: `+Object.entries(c).map(([k,n])=>`${k} ${n}`).join(' · '),'유효 판정 외 신호는 단독 근거 불가',NA('신호 채택은 퀀트 연구 보드 관문'),['reports/signal_scores.json'],SG.asof,{grade:'검증전'}); };
TOPF.mom=()=>{ const k=MO.KR, u=MO.US; if(!k||!u) return null; const t=x=>(x.top||[]).slice(0,3).map(r=>shortNm(r.name)||r.symbol).join(', ');
  return mkTop([`KR 상위: ${t(k)||'—'}`,`US 상위: ${t(u)||'—'}`],NA('모멘텀 순위 표시 — 해석 문장 없음'),NA('순위는 후보 — 매매 신호 아님'),['reports/momentum_KR.json','reports/momentum_US.json'],k.asof,{grade:'검증전'}); };
TOPF.pf=()=>{ if(PF===null||PF===false) return null; if(!PF||!PF.strategies) return mkTop(NA('모의 포트폴리오 결과 없음'),NA('—'),NA('—'),['reports/portfolios.json']);
  const s=[...PF.strategies].filter(x=>x.stats&&x.stats.sharpe!=null).sort((a,b)=>b.stats.sharpe-a.stats.sharpe);
  return mkTop(`모의 전략 ${PF.strategies.length}종 · 샤프 상위 ${s.slice(0,2).map(x=>`${x.name} ${x.stats.sharpe}`).join(' · ')||'—'}`,'과거 백테스트(비용 반영) — 미래 성과 보장 아님',NA('실계좌 적용 판단은 퀀트·PB'),['reports/portfolios.json'],PF.asof,{grade:'검증전'}); };
TOPF.chain=()=>{ if(typeof CH==='undefined'||CH===null||CH===false) return null; if(!CH||!CH.chains) return mkTop(NA('체인 데이터 없음'),NA('—'),NA('—'),['reports/chains_view.json']);
  const c=Object.values(CH.chains).filter(x=>x.score!=null).sort((a,b)=>b.score-a.score), f=x=>`${x.name} ${(x.score>0?'+':'')+Number(x.score).toFixed(2)}`;
  return mkTop(`공급망 ${c.length}개 점수: 강 ${c.slice(0,2).map(f).join(' · ')||'—'} / 약 ${c.slice(-1).map(f).join('')||'—'}`,'점수는 대리 지표 합성 — 효과 검증전',NA('공급망 점수 단독 매매 규칙 없음'),['reports/chains_view.json'],CH.asof,{grade:'검증전'}); };
}
</script>

<!-- tab_rboard.html — QUANT › 연구 보드 (rbView). UXUI·퀀트 10/21 — 겸이 "퀀트에 많은 게 있는데 관리가 안 되고 도전이 잘 안 되고 직관적이지 않음".

<style>

<script>
let RB=null;
const RB_GH='https://github.com/hk99915-bot/market-screener/blob/main/';
const RB_VC={'통과':'var(--up)','진행':'var(--amber)','보류':'var(--muted)','폐기':'var(--dn)'};
const RB_VIEWN={study:'검증 스터디',lab:'전략 연구소',sig:'시그널 검증',mom:'모멘텀',pf:'모의 포트폴리오',isa:'ISA 실험실',chain:'공급망'};
function rbToday(){ return new Date(Date.now()+9*3600e3).toISOString().slice(0,10); }   // KST
function rbDays(d){ return d?Math.round((Date.parse(d)-Date.parse(rbToday()))/864e5):null; }
function rbDD(d){ const n=rbDays(d); return n==null?'<span class="mu">기한 없음</span>':n<0?`<span class="dn">${-n}일 지남</span>`:n===0?'<span class="am">오늘</span>':`<span>D-${n}</span>`; }
/* 이번 주 할 일: 마감 7일 안(지난 것 포함)인 진행·보류 항목 + 겸이 할 일 + 퀀트 앞 요청 + 미등록 연구 — 순수 함수(테스트용) */
function rbWeek(B,today){ const t=Date.parse(today), out=[];
  for(const it of B.items||[]){ if(it.verdict==='폐기'||!it.due) continue; const n=Math.round((Date.parse(it.due)-t)/864e5); if(n<=7) out.push({n,due:it.due,who:it.owner,txt:it.name,full:`${it.name} — ${it.gate}`,id:it.id}); }
  for(const r of B.quant_requests||[]){ const n=r.due?Math.round((Date.parse(r.due)-t)/864e5):99; if(n<=7) out.push({n,due:r.due,who:'퀀트',txt:`요청(${r.from}) ${r.text}`,full:r.text,id:r.id}); }
  if((B.unregistered||[]).length) out.push({n:0,due:today,who:'퀀트',txt:`미등록 연구 ${B.unregistered.length}건 — 보드에 단계·판정 올리기`,id:'unreg'});
  out.sort((a,b)=>a.n-b.n); return out; }
function rbOwnerTodo(B){ return (B.items||[]).filter(it=>it.action&&!/^없음/.test(it.action)); }
function rbCard(it){ const vc=RB_VC[it.verdict]||'var(--muted)', f=it.files||{}, g=it.grade_counts&&Object.keys(it.grade_counts).length?Object.entries(it.grade_counts).map(([k,v])=>k+v).join(' '):'';
  const L=[]; if(f.study) L.push(`<a href="${RB_GH+esc(f.study)}" target="_blank">보고서 ↗</a>`); if(f.rep) L.push(`<a href="${RB_GH+esc(f.rep)}" target="_blank">재현 ↗</a>`);

  return `<div class="rbc" id="rb_${esc(it.id)}"><div class="hd"><span class="rbvb" style="color:${vc};border-color:${vc}">${esc(it.verdict)}</span><b>${esc(it.name)}</b></div>
    <div class="k">${esc(it.owner)} · 갱신 ${esc(it.updated||'—')}${it.src?' · 출처 '+esc(it.src):''}${f.board?' · 보드 '+esc(f.board):''}${it.lock?' · 🔒 실계좌 잠금':''}</div>
    <div>${esc(it.result)}${g?` <span class="mu">[등급 ${esc(g)}]</span>`:''}</div>
    ${it.rep?`<div class="k">검증: ${esc(it.rep)}</div>`:''}
    <div><span class="am">다음 관문</span> ${esc(it.gate)} · ${rbDD(it.due)}${it.due?` <span class="mu">(${esc(it.due)})</span>`:''}</div>
    ${it.action&&!/^없음/.test(it.action)?`<div><b class="am">겸이</b> ${esc(it.action)}</div>`:''}
    ${L.length?`<div class="lnk">${L.join('')}</div>`:''}</div>`; }
function rbView(){
  if(RB===null){ RB=false; google.script.run.withSuccessHandler(t=>{try{RB=typeof t==='string'?JSON.parse(t):t;}catch(e){RB={};} if(view==='rb') render();}).withFailureHandler(()=>{RB={}; if(view==='rb') render();}).getResearchBoard(); return '<div class="load">LOADING …</div>'; }
  if(!RB||!RB.items) return '<div class="grid"><div class="p c12"><div class="b mu">연구 보드 데이터 없음 — python3 scripts/research_board.py --build (reports/research_board.json)</div></div></div>';
  const S=RB.stages||[], I=RB.items, today=rbToday();
  const cnt={}, vcnt={}; I.forEach(it=>{cnt[it.stage]=(cnt[it.stage]||0)+1; vcnt[it.verdict]=(vcnt[it.verdict]||0)+1;});
  const live=(cnt[S[S.length-1]&&S[S.length-1].id]||0);
  const strip=S.map((s,i)=>{ const act=I.filter(it=>it.stage===s.id&&it.verdict!=='폐기').length, lk=s.id==='live';
    return `<button data-rbs="${esc(s.id)}" class="${lk?'lk':''}" title="관문: ${esc(s.gate)}"><b>${lk&&!live?'🔒':(cnt[s.id]||0)}</b>${esc(s.name)}${!lk&&cnt[s.id]?`<div class="mu" style="font-size:var(--fs-1);white-space:nowrap" title="진행·보류 ${act}">진행 ${act}</div>`:lk?'<div class="mu" style="font-size:var(--fs-1)">해금 전</div>':''}</button>`; }).join('');
  const vd=['통과','진행','보류','폐기'].map(v=>`<span><b style="color:${RB_VC[v]}">${v}</b> ${vcnt[v]||0}</span>`).join('');
  const wk=rbWeek(RB,today), me=rbOwnerTodo(RB);
  const wkHtml=wk.length?`<ul class="rbwk one">${wk.slice(0,5).map(w=>`<li title="${esc(w.full||w.txt)}"><span class="dd">${w.n<0?`<span class="dn">${-w.n}일↑</span>`:w.n===0?'<span class="am">오늘</span>':'D-'+w.n}</span><span class="t">${esc(w.txt)} · ${esc(w.who)}</span></li>`).join('')}</ul>${wk.length>5?`<div class="mu" style="font-size:var(--fs-1)">+${wk.length-5}건 더 — 아래 카드</div>`:''}`:'<div class="mu">이번 주 마감 없음</div>';
  const meHtml=me.length?`<div style="font-size:var(--fs-2);margin:0 0 6px"><b class="am">겸이 할 일 ${me.length}</b> ${me.map(it=>`<a href="#rb_${esc(it.id)}">${esc(it.name)}</a> <span class="mu">${esc(it.action.split(' — ')[0])}</span>`).join(' · ')}</div>`:'<div class="mu" style="font-size:var(--fs-2);margin:0 0 6px">겸이 할 일 없음 — 읽기만</div>';
  const ch=RB.challenge||{};
  const top=`<div class="p c12" id="rbTop"><h2>연구 보드<small>아이디어 → 백테스트 → 독립 검증 → 모의 추적 → 실계좌 후보 · 자료 ${esc(RB.asof||'—')}</small></h2><div class="b">
    <div class="rbst">${strip}</div>
    <div class="rbvd">${vd}<span class="mu">총 ${I.length}건</span></div>
    ${meHtml}<div class="am" style="font-size:var(--fs-2);margin-bottom:2px">이번 주 할 일 ${wk.length} <span class="mu">(${esc(today)}부터 7일 안 마감 · 지난 것 포함)</span></div>${wkHtml}
    <div class="rbch"><b class="am">도전</b> 새 아이디어·다음 실험 → 텔레그램 <code>ask 퀀트 &lt;아이디어&gt;</code> · 한 줄이면 됨(무엇을/어느 시장/왜) · 2영업일 안 답, 퀀트가 사전등록해 1단계에 올림</div>
  </div></div>`;
  const sec=S.map((s,i)=>{ const its=I.filter(it=>it.stage===s.id).sort((a,b)=>['진행','보류','통과','폐기'].indexOf(a.verdict)-['진행','보류','통과','폐기'].indexOf(b.verdict)||String(b.updated||'').localeCompare(String(a.updated||'')));
    const alive=its.filter(it=>it.verdict!=='폐기'), dead=its.filter(it=>it.verdict==='폐기');
    return `<div class="p c12" id="rbs_${esc(s.id)}"><h2>${i+1}. ${esc(s.name)}<small>${its.length}건</small></h2><div class="b">
      <div class="rbgate">관문 → 다음 단계: ${esc(s.gate)} <span class="mu">(${esc(s.kb||'')})</span></div>

    </div></div>`; }).join('');
  const rq=(RB.quant_requests||[]), un=(RB.unregistered||[]);

<!-- tab_isalab.html — QUANT › ISA 실험실 (ilabView). 자산별 비중 슬라이더 → 브라우저 안에서 즉시 백테스트(서버 없음).

     계산 로직은 ILAB_CALC 블록(순수 함수) — tests/test_isa_lab.py 가 node 로 꺼내 screener/isa_lab.py 기준 구현과 숫자 대조.
     월 적립 금액은 '100(단위 자유)' 기본값 · 결과는 배수·% 로만 · 입력값은 저장·전송하지 않는다. -->
<script>
/* ISA 기준일 표시 (UXUI 재진단 Top10 #10, 10/23): isa_lab_returns.json asof 가 마지막 '월'의 말일(2026-10-31)이라 미래 날짜로 보였다.
   오늘(KST)보다 뒤면 날짜 대신 'YYYY-MM (부분 월)' + note 로 표기. 원천 수정은 퀀트(req-quant-14188e23). */
function isaAsof(D){ const a=String(D.asof||''), today=new Date(Date.now()+9*36e5).toISOString().slice(0,10);
  if(a&&a>today) return `${esc(D.note?String(D.note).split('.')[0]:a.slice(0,7)+' 부분 월')} <span class="mu">(원천 asof 가 월말 표기라 미래 날짜 — 표시 안 함)</span>`;
  const age=/^\d{4}-\d{2}-\d{2}$/.test(a)?Math.round((Date.parse(today)-Date.parse(a))/864e5):NaN;   // 유지보수 10/27: 정적 스냅샷 경과일 명시(#2-4 점검)
  return `${esc(a||'—')}${D.note?' ('+esc(String(D.note).split('.')[0])+')':''}${age>7?` <span style="color:var(--amber)">· ${age}일 전 정적 스냅샷(자동 갱신 없음)</span>`:''}`; }
/* ILAB_CALC_BEGIN — DOM 없는 순수 계산 (screener/isa_lab.py 와 같은 정의·같은 순서) */
function ilabNet(D,cost){ const A=D.assets; return D.months.map((_,t)=>A.map(a=>D.r[a][t]-(cost?D.drag[a]/12:0))); }
function ilabW(D,wm){ const w=D.assets.map(a=>+(wm[a]||0)); const s=w.reduce((x,y)=>x+y,0); return s>0?w.map(x=>x/s):w; }
function ilabSim(M,w,rebal,contrib){
  const A=w.length; let H=w.map(x=>x*(contrib===0?1:0)); let paid=contrib===0?1:0; const V=[],twr=[],inv=[];
  for(let t=0;t<M.length;t++){ const r=M[t];
    if(contrib>0){ for(let i=0;i<A;i++) H[i]+=contrib*w[i]; paid+=contrib; }
    if(t>0&&(rebal==='M'||(rebal==='A'&&t%12===0))){ let tot=0; for(let i=0;i<A;i++) tot+=H[i]; H=w.map(x=>tot*x); }
    let st=0; for(let i=0;i<A;i++) st+=H[i];
    H=H.map((h,i)=>h*(1+r[i]));
    let en=0; for(let i=0;i<A;i++) en+=H[i];
    twr.push(st>0?en/st-1:0); V.push(en); inv.push(paid); }
  return {V,twr,inv}; }
function ilabStd(x){ const m=x.reduce((a,b)=>a+b,0)/x.length; let s=0; for(const v of x) s+=(v-m)*(v-m); return Math.sqrt(s/(x.length-1)); }
function ilabTwrStats(twr){ const n=twr.length, idx=[1]; let I=1; for(const r of twr){ I*=1+r; idx.push(I); }
  let pk=idx[0], mdd=0; for(const v of idx){ pk=Math.max(pk,v); mdd=Math.max(mdd,1-v/pk); }
  let w12=NaN; if(n>=12){ w12=Infinity; for(let t=0;t<n-11;t++) w12=Math.min(w12,idx[t+12]/idx[t]-1); }
  return {cagr:Math.pow(idx[n],12/n)-1, vol:ilabStd(twr)*Math.sqrt(12), mdd:-mdd, worst12:w12, mult:idx[n]}; }
function ilabIrr(c,n,fin){ let lo=-0.99,hi=1.0; for(let it=0;it<100;it++){ const mid=(lo+hi)/2; let fv=0; for(let k=0;k<n;k++) fv+=c*Math.pow(1+mid,n-k); if(fv>fin) hi=mid; else lo=mid; } return (lo+hi)/2; }
function ilabDcaStats(sim,c){ const V=sim.V, inv=sim.inv, n=V.length; let under=Infinity, pk=0, mdd=0;
  for(let t=0;t<n;t++){ under=Math.min(under,V[t]/inv[t]-1); pk=Math.max(pk,V[t]); mdd=Math.max(mdd,1-V[t]/pk); }
  return {irr:Math.pow(1+ilabIrr(c,n,V[n-1]),12)-1, mult:V[n-1]/inv[n-1], under, bal_mdd:-mdd}; }
function ilabCrisis(D,twr){ const m=D.months, o={}; for(const [nm,a,b] of D.crises){ const i=m.indexOf(a), j=m.indexOf(b); if(i<0||j<0) continue; let g=1; for(let t=i;t<=j;t++) g*=1+twr[t]; o[nm]=g-1; } return o; }
function ilabEval(D,wm,rebal,cost,contrib){ const M=ilabNet(D,cost), w=ilabW(D,wm), lump=ilabSim(M,w,rebal,0), dca=ilabSim(M,w,rebal,contrib);
  return {lump:ilabTwrStats(lump.twr), dca:ilabDcaStats(dca,contrib), crisis:ilabCrisis(D,lump.twr), curve:lump.V, dcurve:dca.V, inv:dca.inv}; }
function ilabRng(seed){ let a=seed|0; return function(){ a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function ilabQ(xs,q){ const s=xs.slice().sort((a,b)=>a-b), p=(s.length-1)*q, lo=Math.floor(p), hi=Math.min(lo+1,s.length-1); return s[lo]+(s[hi]-s[lo])*(p-lo); }
function ilabBoot(D,wm,rebal,cost,P,T,L,seed){ const M=ilabNet(D,cost), w=ilabW(D,wm), n=M.length, rnd=ilabRng(seed); const cagr=[],mult=[],mdd=[];
  for(let p=0;p<P;p++){ let k=Math.floor(rnd()*n); const path=[];
    for(let t=0;t<T;t++){ if(t>0) k=(rnd()<1/L)?Math.floor(rnd()*n):(k+1)%n; path.push(M[k]); }
    const ls=ilabTwrStats(ilabSim(path,w,rebal,0).twr), d=ilabSim(path,w,rebal,1);
    cagr.push(ls.cagr); mdd.push(ls.mdd); mult.push(d.V[T-1]/d.inv[T-1]); }
  return {cagr_med:ilabQ(cagr,.5),cagr_p10:ilabQ(cagr,.1),mult_med:ilabQ(mult,.5),mult_p10:ilabQ(mult,.1),mdd_med:ilabQ(mdd,.5),mdd_p10:ilabQ(mdd,.1)}; }
/* ILAB_CALC_END */

let ILAB=null, ILABCH=null, ILABBT=null;
const ILAB_ST={w:{SP:40,NDX:10,KS:15,KR3Y:20,KR10Y:0,UST:0,GOLD:15}, rebal:'A', cost:true, contrib:100, log:true};

  const D=ILAB, S=ILAB_ST;

  <div class="p c12"><div class="b" style="font-size:var(--fs-2);color:var(--amber)">⚠ 2004-01~${esc(D.months[D.months.length-1])} 한 구간 백테스트 — 금 강세장 포함·과최적화 주의, 미래 보장 아님. 데이터 기준일 ${isaAsof(D)}. 비용 가정(연, 월 1/12 차감): ${dg}. 세금·매매비용 미반영.</div></div>
  <div class="p c4"><h2>비중<small id="ilsum"></small></h2><div class="b">

      &nbsp; <label>월 적립 <input type="number" min="1" value="${S.contrib}" style="width:70px" onchange="ILAB_ST.contrib=Math.max(1,+this.value||100);ilabRecalc()"></label> <span class="mu" style="font-size:var(--fs-1)">(단위 자유 · 브라우저 안에서만 계산, 저장·전송 안 함)</span></div>
  </div></div>
  <div class="p c8"><h2>현행 ISA vs 선택<small>${esc(D.months[0])}~${esc(D.months[D.months.length-1])} · ${D.months.length}개월 · 원화</small></h2><div class="b" id="ilout"></div></div>
  <div class="p c12"><h2>누적 곡선 (일시금 1 → 배수)<small><label><input type="checkbox" ${S.log?'checked':''} onchange="ILAB_ST.log=this.checked;ilabRecalc()"> 로그</label></small></h2><div class="b"><div id="ilch" style="height:280px"></div><div class="mu" style="font-size:var(--fs-1)"><span style="color:var(--muted)">━ 현행 ISA 40/10/15/20/15</span> &nbsp; <span style="color:var(--amber)">━ 선택</span></div></div></div>
  <div class="p c12"><h2>블록 부트스트랩 10년<small>평균 12개월 블록 · 2,000 경로 · 원형</small></h2><div class="b" id="ilbt">${ILABBT?ilabBootHtml(true):ilabBootIdle()}</div></div>
  </div>`;
}
function ilabSet(el){ ILAB_ST.w[el.dataset.a]=+el.value; const b=$('#ilw_'+el.dataset.a); if(b) b.textContent=el.value+'%'; ILABBT=null; ilabRecalc(); }
function ilabPreset(i){ const p=Object.values(ILAB.presets)[i]; ILAB.assets.forEach(a=>ILAB_ST.w[a]=+(p[a]||0)); ILABBT=null; render(); }
function ilabNorm(){ const s=ILAB.assets.reduce((x,a)=>x+(+ILAB_ST.w[a]||0),0); if(s<=0) return; ILAB.assets.forEach(a=>ILAB_ST.w[a]=Math.round((+ILAB_ST.w[a]||0)*100/s)); render(); }
function ilabBase(){ return Object.values(ILAB.presets)[0]; }
function ilabRecalc(){
  const o=$('#ilout'); if(!o||!ILAB||!ILAB.months) return; const D=ILAB, S=ILAB_ST;
  const s=D.assets.reduce((x,a)=>x+(+S.w[a]||0),0), sm=$('#ilsum');
  if(sm) sm.innerHTML=s===100?`합계 100%`:`<span class="dn">합계 ${s}% → 비율로 정규화</span>`;
  if(s<=0){ o.innerHTML='<span class="dn">비중이 모두 0</span>'; return; }
  const B=ilabEval(D,ilabBase(),S.rebal,S.cost,S.contrib), X=ilabEval(D,S.w,S.rebal,S.cost,S.contrib);
  const p1=v=>v==null||isNaN(v)?'—':(v*100).toFixed(1)+'%', pp=v=>isNaN(v)?'—':`${v>0?'+':''}${(v*100).toFixed(1)}%p`, mx=v=>v.toFixed(2)+'배';

function ilabChart(b,x){

  const c=LightweightCharts.createChart(el,{width:el.clientWidth,height:280,layout:{background:{type:'solid',color:cv('--panel')},textColor:cv('--muted'),fontSize:11},
    grid:{vertLines:{color:cv('--line')},horzLines:{color:cv('--line')}},rightPriceScale:{borderColor:cv('--line'),mode:ILAB_ST.log?1:0},
    timeScale:{borderColor:cv('--line')},crosshair:{mode:0},handleScroll:{vertTouchDrag:false},localization:{locale:'ko-KR',priceFormatter:v=>v.toFixed(2)}});

function ilabCanvas(el,b,x,cv){
  el.innerHTML='<canvas class="tokc" style="width:100%;height:100%"></canvas>'; const c=el.firstChild, W=c.width=el.clientWidth*2, H=c.height=el.clientHeight*2, g=c.getContext('2d'), pl=20, pr=110, pt=16, pb=36;
  const lg=ILAB_ST.log, f=v=>lg?Math.log(v):v, all=b.concat(x), lo=f(Math.min(...all,1)), hi=f(Math.max(...all)), n=b.length;
  const X=i=>pl+(W-pl-pr)*i/(n-1), Y=v=>pt+(H-pt-pb)*(1-(f(v)-lo)/(hi-lo||1));
  g.font='22px monospace'; g.fillStyle=cv('--muted'); g.strokeStyle=cv('--line'); g.lineWidth=1;

    ${sub('한국 <span class="mu">'+esc(o.kr.asof||'')+'</span>')}${yr('국고 3년',K['3Y'])}${yr('국고 10년',K['10Y'])}${yr('CD 91일',K['CD'])}${yr('회사채 AA− 3년',K['AA'])}${yr('회사채 BBB− 3년',K['BBB'])}

    <div class="mu" style="font-size:var(--fs-1);margin-top:4px;white-space:normal">변화는 bp(0.01%p). 금리 색 = 채권 가격 기준: 금리↑(가격↓) <span class="dn">빨강</span>, 금리↓(가격↑) <span class="up">초록</span>. 신용 스프레드 확대도 빨강. 마우스를 올리면 설명.</div>`;

  const curveSvg=(cv,keys,yrs,title)=>{ const n=cv.now||{}; if(!Object.keys(n).length) return '';
    const W=520,H=190,pl=40,pr=10,pt=14,pb=26, ks=keys.filter(k=>n[k]!=null);
    const all=['now','m1','y1'].flatMap(s=>ks.map(k=>(cv[s]||{})[k]).filter(v=>v!=null)); let lo=Math.min(...all), hi=Math.max(...all); const pad=(hi-lo)*0.12||0.2; lo-=pad; hi+=pad;
    const xm=Math.sqrt(yrs[ks[ks.length-1]]), X=k=>pl+(W-pl-pr)*Math.sqrt(yrs[k])/xm, Y=v=>pt+(H-pt-pb)*(1-(v-lo)/(hi-lo));
    const line=(s,c,dash)=>{ const pts=ks.filter(k=>(cv[s]||{})[k]!=null).map(k=>`${X(k).toFixed(1)},${Y(cv[s][k]).toFixed(1)}`); return pts.length>1?`<polyline points="${pts.join(' ')}" fill="none" style="stroke:${c};stroke-width:${s==='now'?2.2:1.4}" ${dash?'stroke-dasharray="4 3"':''}/>`+(s==='now'?ks.map(k=>`<circle cx="${X(k).toFixed(1)}" cy="${Y(n[k]).toFixed(1)}" r="2.6" style="fill:${c}"><title>${k} ${n[k].toFixed(2)}%</title></circle>`).join(''):''):''; };
    let g=''; for(let i=0;i<=4;i++){ const v=lo+(hi-lo)*i/4, y=Y(v); g+=`<line x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}" style="stroke:var(--line)"/><text x="${pl-4}" y="${y+3}" text-anchor="end" font-size="10" style="fill:var(--muted)">${v.toFixed(2)}</text>`; }

  const UY={'1M':1/12,'3M':.25,'6M':.5,'1Y':1,'2Y':2,'3Y':3,'5Y':5,'7Y':7,'10Y':10,'20Y':20,'30Y':30};
  const f2=x=>x==null?'—':x.toFixed(2), sc=x=>x==null?'<td class="mu">—</td>':`<td class="${x>0?'up':x<0?'dn':'mu'}">${x>0?'+':''}${x.toFixed(1)}%</td>`;

  const C=o.corr||{}, cc=x=>x==null?'<td class="mu">—</td>':`<td class="${x>0.2?'dn':x<-0.2?'up':'mu'}"><b>${x>0?'+':''}${x.toFixed(2)}</b></td>`;
  const corr=Object.values(C).map(c=>`<tr><td class="l">${esc(c.a)}</td><td class="l mu">${esc(c.b)}</td>${cc(c.c250)}${cc(c.c60)}<td class="mu">${c.n}</td></tr>`).join('');
  const veh=(o.vehicles||[]).map(v=>`<tr><td class="l">${esc(v.name)}</td><td>${v.y==null?'—':v.y.toFixed(2)+'%'}${v.ylabel?`<div class="mu" style="font-size:var(--fs-1)">${esc(v.ylabel)}</div>`:''}</td><td>${f2(v.dur)}</td><td>${v.up100==null?'<span class="mu">해당 없음</span>':'<span class="up">+'+v.up100.toFixed(1)+'%</span>'}</td><td class="l ${v.fx.startsWith('있음')?'am':'mu'}">${esc(v.fx)}</td><td class="l mu" style="white-space:normal;font-size:var(--fs-1);min-width:150px">${esc(v.tax)}</td><td class="l" style="white-space:normal;font-size:var(--fs-1);min-width:180px">${esc(v.role)}</td></tr>`).join('');
  const cu=o.credit_us;
  setTimeout(drawBondHist,0);
  const _u10=(U['10Y']||{}).v, _u10m=(U['10Y']||{}).m1, _cs=(S.us_10_2||{}).v, _aa=(S.kr_aa||{}).v, _aam=(S.kr_aa||{}).m1, _cr=((o.corr||{}).rows||o.corr||[]);
  const easy=`<div class="p c12"><h2>처음이면 이것만<small>채권 기초 3가지 (현재 상황은 위 3줄)</small></h2><div class="b" style="line-height:1.8;white-space:normal">
   <div>① <b>금리가 오르면 채권값은 내려가</b> (시소). 미국 10년 금리 ${_u10!=null?_u10.toFixed(2)+'%':'—'}${_u10m!=null?` · 한 달 새 ${_u10m>0?'+':''}${_u10m.toFixed(0)}bp(0.01%p 단위) ${_u10m>0?'올랐어 → 채권값↓, 성장주·반도체에도 부담':'내렸어 → 채권값↑'}`:''}.</div>
   <div>② <b>짧은 금리 &lt; 긴 금리면 정상</b>, 뒤집히면(역전) 경기 걱정 신호야. 지금 미국 10년−2년 ${_cs!=null?(_cs*100>0?'+':'')+(_cs*100).toFixed(0)+'bp → '+(_cs>0?'정상':'역전'):'—'}.</div>
   <div>③ <b>회사채 − 국채 금리 차이(신용 스프레드)가 벌어지면</b> 돈 빌려주기 무섭다는 뜻 = 위험 회피. 지금 한국 AA− ${_aa!=null?(_aa*100).toFixed(0)+'bp':'—'}${_aam!=null?` (한 달 ${_aam>0?'+':''}${_aam.toFixed(0)}bp) → ${Math.abs(_aam)<10?'조용해':'움직이는 중'}`:''}.</div>
   <div class="mu" style="font-size:var(--fs-2);margin-top:4px">나머지 표·차트는 이 세 가지를 자세히 본 거야. 모르는 칸은 건너뛰어도 돼 — STUDY 탭 '채권 기초'에서 차근차근.</div></div></div>`;
  const aic=aiCreditPanel(o.ai_credit,o);
  return `<div class="grid">${bondNow(o)}${easy}${aic}
   <div class="p c6"><h2>핵심 숫자<small>데이터 ${esc(o.asof||'—')} · 생성 ${esc(o.generated_at||'')} KST</small></h2><div class="b">${key}</div></div>
   <div class="p c6"><h2>해석<small>규칙 기반 · 숫자 인용</small></h2><div class="b" style="line-height:1.75;white-space:normal">${(o.notes||[]).map(x=>'<div>• '+esc(x)+'</div>').join('')}
     <div class="mu" style="font-size:var(--fs-1);margin-top:8px;line-height:1.5">데이터 소스<br>${src}</div></div></div>

   <div class="p c6"><h2>금리차 추이<small>bp · 0 아래 = 역전</small></h2><div class="b"><div id="bdh" style="height:300px"></div><div id="bdleg" class="mu" style="font-size:var(--fs-1);margin-top:4px"></div>${cu?`<div style="font-size:var(--fs-2);margin-top:6px">미국 신용 프록시 HYG/IEF ${cu.v} · 1개월 ${pct(cu.r20,1)} · 3개월 ${pct(cu.r60,1)} <span class="mu">(내리면 하이일드가 국채보다 약함 = 위험 회피)</span></div>`:''}</div></div>
   <div class="p c12"><h2>듀레이션 · 금리 시나리오<small>금리가 이만큼 바뀌면 가격은? · 액면채는 −D·Δy + ½·C·Δy², ETF는 −D·Δy (근사)</small></h2><div class="b" style="overflow-x:auto">
     <table><tr><th class="l">채권</th><th class="l">계산</th><th>듀레이션 D</th><th>볼록성 C</th><th>금리 −1%p</th><th>−0.5%p</th><th>+0.5%p</th><th>+1%p</th><th>1년 이자</th><th>손익분기 금리 상승</th></tr>${dur}</table>
     <div class="mu" style="font-size:var(--fs-1);margin-top:6px;white-space:normal;line-height:1.6">듀레이션 = 금리 1%p 변화당 가격 변화 %. 액면채는 현재 금리로 계산(반년 이자 지급 가정). ETF 듀레이션은 운용사 공시 실효 듀레이션 근처의 <b>근사 상수</b>(TLT ~16, IEF ~7.5, SHY ~1.9, LQD ~8.5, HYG ~3.5, 국고3년 ETF ~2.8, 국고10년 ETF ~8)이고 ETF '1년 이자'는 해당 만기 국채금리로 대신함. 손익분기 = 1년 이자 ÷ D: 1년 동안 금리가 이만큼 넘게 오르면 이자를 받고도 손해. 하이일드·회사채는 금리 말고 신용 위험(경기)으로도 움직임.</div></div></div>
   <div class="p c12"><h2>포트폴리오 편입<small>장기 자산배분용 후보 비교 · 일반 정보</small></h2><div class="b" style="overflow-x:auto">
     <div style="line-height:1.75;white-space:normal;margin-bottom:8px;border:1px solid var(--amber);padding:6px 10px">${(o.reco||[]).map(x=>'<div>• '+esc(x)+'</div>').join('')||'<span class="mu">판단 근거 부족</span>'}</div>

     <table style="max-width:640px"><tr><th class="l">채권</th><th class="l">주식</th><th>1년</th><th>3개월</th><th>표본(일)</th></tr>${corr}</table>

     <div class="am" style="font-size:var(--fs-2);margin:6px 0 2px">편입 후보</div>

/* 지금 채권 상황 3줄 (10/21 겸이 "채권에도 현 상황 최상단에 요약 영역", 보드 bonds-summary) — 수준·방향·의미. 숫자는 bonds.json 그대로,
   문장 규칙 = 채권 KB docs/desk_kb/bonds.md #7(손익분기 = 1년 이자 ÷ D) #11(ETF 상시 만기) #13(커브 4분면, |Δ기울기| ≥ 10bp 일 때만 분류). */
function bondNow(o){
  const U=o.us.chg||{}, K=o.kr.chg||{}, S=o.spreads||{}, k3=K['3Y']||{}, k10=K['10Y']||{}, u10=U['10Y']||{}, sl=S.kr_10_3||{};
  const f=c=>c&&c.v!=null?c.v.toFixed(2)+'%':'—';
  const bp=x=>x==null?'—':`<span class="${x>0?'dn':x<0?'up':'mu'}">${x>0?'+':''}${Number(x).toFixed(0)}bp</span>`;
  const dir=(a,b,who)=>a==null||b==null?`${who} —`:a<0&&b<0?`${who} 금리↓(채권값↑)`:a>0&&b>0?`${who} 금리↑(채권값↓)`:`${who} 혼조`;
  let curve='';
  if(sl.v!=null){ const d=sl.m1==null?null:Math.round(sl.m1), a3=k3.m1, a10=k10.m1;   // 표시값(정수 bp)으로 판정 — '−10bp: 변화 작음' 같은 어긋남 방지
    const q=d==null||a3==null||a10==null?'':Math.abs(d)<10?'변화 작음(±10bp 안)':d>0?(Math.abs(a3)>Math.abs(a10)?'불 스티프닝(단기 금리가 더 내림)':'베어 스티프닝(장기 금리가 더 오름)'):(Math.abs(a3)>Math.abs(a10)?'베어 플래트닝(단기 금리가 더 오름)':'불 플래트닝(장기 금리가 더 내림)');
    curve=` · 기울기 한 10Y−3Y <b>${sl.v*100>0?'+':''}${(sl.v*100).toFixed(0)}bp</b> (1개월 ${bp(d)}${q?': '+q:''})`; }
  const dk=(o.duration||[]).find(d=>d.n==='국고채 3년');
  let mean='<span class="mu">국고 3년 듀레이션 데이터 없음</span>';
  if(dk&&dk.be_bp!=null&&dk.dur){ const m=k3.m1, px=m==null?null:-dk.dur*m/100;
    mean=`국고 3년 보유 관점: 손익분기 <b>+${dk.be_bp}bp</b> (1년 이자 ${dk.carry.toFixed(2)}% ÷ D ${dk.dur.toFixed(2)}) — 1년 새 금리가 이보다 덜 오르면 이자가 가격 손실을 덮음.${m!=null?` 1개월 변화 ${bp(m)} ≈ 가격 ${px>0?'+':''}${px.toFixed(1)}%(−D×Δ금리, 근사).`:''} 국고채 3년 ETF는 만기 없음(D≈2.8 근사) → 3년 이상 들고 가는 돈.`; }
  const kp=mkPhase('KR'), kt=tzParts('Asia/Seoul');
  const lag=[dataLag('KR',o.kr.asof,(kp.last===kp.today&&kt.hm<22*60)?1:0),dataLag('US',o.us.asof,1)].filter(Boolean).join(' · ');   // 국고 민평 21:00 생성 · 미 국채 하루 늦게 공개
  const tag=staleTag(o.generated_at?String(o.generated_at).slice(5,16):o.asof,['21:00'],[1,2,3,4,5],['bonds','reports/bonds.json'],lag);
  return `<div class="p c12" id="bondNow"><h2>지금 채권 상황 3줄<small>bonds.json${tag}</small></h2><div class="b" style="line-height:1.75;white-space:normal">
    <div><b class="am">수준</b> 국고 3년 <b>${f(k3)}</b> · 국고 10년 <b>${f(k10)}</b> · 미 10년 <b>${f(u10)}</b></div>
    <div><b class="am">방향</b> 1주 ${bp(k3.w1)} · ${bp(k10.w1)} · ${bp(u10.w1)} / 1개월 ${bp(k3.m1)} · ${bp(k10.m1)} · ${bp(u10.m1)} → ${dir(k3.m1,k10.m1,'한국')} · ${dir(u10.m1,u10.m1,'미국')}${curve}</div>
    <div><b class="am">의미</b> ${mean}</div>
    <div class="mu" style="font-size:var(--fs-1)">순서 = 국고3Y · 국고10Y · 미10Y. 한국 KRX 장외 민평 ${esc(mdDay(o.kr.asof))} · 미국 Treasury ${esc(mdDay(o.us.asof))} 기준. 금리↑ <span class="dn">빨강</span>(채권값↓). 해석은 채권 KB 규칙(#7·#11·#13) — 추정 없음.</div></div></div>`;
}
function aiCreditPanel(a,o){ o=o||{};
  if(!a||!a.alert) return '';
  const al=a.alert, lc=al.lv>=2?'dn':al.lv>=1?'am':'mu';
  const fv=c=>c.v==null?'—':c.fmt==='pct'?pct(c.v,1):c.fmt==='n'?`<b>${c.v}</b><span class="mu">/${c.of}</span>${c.names&&c.names.length?' <span class="mu">('+esc(c.names.join(', '))+')</span>':''}`:`<b>${Number(c.v).toFixed(1)}</b>`;
  const chk=(al.checks||[]).map(c=>`<tr><td class="l">${esc(c.name)}<div class="mu" style="font-size:var(--fs-1);white-space:normal">${esc(c.why)}</div></td><td>${fv(c)}</td><td class="l mu" style="font-size:var(--fs-1)">${esc(c.rule)}</td><td class="${c.pt>=2?'dn':c.pt>=1?'am':'mu'}"><b>${c.pt}</b></td></tr>`).join('');
  const vc=x=>x==null?'<td class="mu">—</td>':`<td class="${x>=0.8?'dn':x>=0.5?'am':'mu'}">${(x*100).toFixed(0)}%</td>`;
  const bk=(a.basket||[]).map(r=>`<tr><td class="l sym" data-sym="${esc(r.s)}" data-mk="US"><b>${esc(r.s)}</b> <span class="mu" style="font-size:var(--fs-1)">${typeof r.n==='string'?esc(r.n):''}</span>${r.short?' <span class="mu" style="font-size:var(--fs-1)">(상장 1년 미만)</span>':''}</td><td>${num(r.close,2)}</td><td>${pct(r.r1,1)}</td><td>${pct(r.r20,1)}</td><td>${pct(r.dd,1)}</td>${vc(r.vol20)}</tr>`).join('');
  const ce=(a.etf||[]).map(e=>`<tr><td class="l sym" data-sym="${esc(e.s)}" data-mk="US">${esc(e.n)}</td><td>${num(e.close,2)}</td><td>${pct(e.r1,2)}</td><td>${pct(e.r20,1)}</td><td>${pct(e.dd,1)}</td></tr>`).join('');
  const spark=h=>{ if(!h||h.length<2) return ''; const W=160,H=34,vs=h.map(x=>x[1]),lo=Math.min(...vs),hi=Math.max(...vs),rg=(hi-lo)||1;
    const pts=vs.map((v,i)=>`${(i/(vs.length-1)*W).toFixed(1)},${(H-2-(v-lo)/rg*(H-4)).toFixed(1)}`).join(' ');
    return `<svg viewBox="0 0 ${W} ${H}" style="width:${W}px;height:${H}px;vertical-align:middle"><polyline points="${pts}" fill="none" style="stroke:var(--amber);stroke-width:1.4"/></svg>`; };
  const RT={HYG_IEF:['HYG/IEF','하이일드 ÷ 중기국채 — 내리면 투기등급 회사채가 국채보다 약함'],BKLN_SHY:['BKLN/SHY','레버리지론 ÷ 단기국채 — 내리면 빚 많은 회사 대출 가격이 약함']};
  const rt=Object.entries(RT).map(([k,[n,t]])=>{ const r=(a.ratios||{})[k]; return r?`<tr><td class="l">${n}<div class="mu" style="font-size:var(--fs-1);white-space:normal">${t}</div></td><td>${r.v}</td><td>${pct(r.r20,1)}</td><td>${pct(r.r60,1)}</td><td>${spark(r.hist)}</td></tr>`:''; }).join('');
  const miss=(a.missing||[]).length?` · 데이터 없음: ${esc(a.missing.join(', '))}`:'';
  return `<div class="p c12"><h2>AI 인프라 신용 감시<small>데이터 ${esc(a.asof||'—')}${a.asof&&o.asof&&a.asof<o.asof?` <span class="am" title="이 표는 탭 기준일(${esc(o.asof)})보다 이전 데이터 — 아래 ETF 표·상단 티커와 날짜가 다름">(탭 기준 ${esc(o.asof)}보다 이전)</span>`:''} · 주가로 본 신용 스트레스 · 규칙 기반</small></h2><div class="b" style="overflow-x:auto">
    <div style="line-height:1.75;white-space:normal;border:1px solid var(--${al.lv>=2?'dn':al.lv>=1?'amber':'line'});padding:6px 10px;margin-bottom:8px">
      <div>신용 경보: <b class="${lc}" style="font-size:var(--fs-3)">${esc(al.level)}</b> <span class="mu">(점수 ${al.score} · 0~1 정상 · 2~3 주의 · 4+ 경계)</span></div>
      <div>${esc(al.explain||'')}</div>
      <div class="mu" style="font-size:var(--fs-1)">왜 따로 보나: 하이일드 지수(HYG)는 수백 개 회사를 섞은 평균이라, 한 업종(AI 데이터센터)이 빚 부담으로 흔들려도 지수엔 거의 안 잡힘. 그래서 그 업종 회사들 주가를 직접 봄.</div></div>
    <table style="max-width:820px"><tr><th class="l">경보 항목</th><th>지금</th><th class="l">기준</th><th>점수</th></tr>${chk}</table>

    <div class="mu" style="font-size:var(--fs-1);margin:4px 0 8px;white-space:normal;line-height:1.6">CDS(부도 보험료)·개별 회사채 가격은 무료 데이터가 없어 주가로 대신함: 고점 대비 많이 빠지고, 한 달 새 급락하고, 하루하루 출렁임(20일 변동성, 연율 — 50%↑ <span class="am">주황</span>, 80%↑ <span class="dn">빨강</span>)이 클수록 시장이 그 회사의 빚 상환 능력을 의심한다는 신호.${miss}</div>

    <table style="max-width:640px;margin-top:6px"><tr><th class="l">비율</th><th>현재</th><th>1M</th><th>3M</th><th>1년 추이</th></tr>${rt}</table>

  </div></div>`;
}
function drawBondHist(){
  const el=$('#bdh'); if(!el||!BND||!BND.hist) return;
  if(BDCH){ try{BDCH.remove();}catch(e){} BDCH=null; }
  if(!window.LightweightCharts){ el.innerHTML='<div class="mu">차트 라이브러리 없음</div>'; return; }
  const cs=getComputedStyle(document.documentElement), cv=n=>(cs.getPropertyValue(n)||'').trim()||'#888';
  const c=LightweightCharts.createChart(el,{width:el.clientWidth,height:300,layout:{background:{type:'solid',color:cv('--panel')},textColor:cv('--muted'),fontSize:11},
    grid:{vertLines:{color:cv('--line')},horzLines:{color:cv('--line')}},rightPriceScale:{borderColor:cv('--line')},timeScale:{borderColor:cv('--line')},crosshair:{mode:0},handleScroll:{vertTouchDrag:false},
    localization:{locale:'ko-KR',priceFormatter:v=>v.toFixed(0)+'bp'}});
  BDCH=c;
  const S=[['us_10_2','미 10Y−2Y','--amber'],['us_10_3m','미 10Y−3M','--blue'],['kr_10_3','한 10Y−3Y','--cyan'],['kr_aa','한 AA−−국고3Y','--dn']];
  const leg=[];
  for(const [k,n,col] of S){ const d=(BND.hist[k]||[]).map(([t,v])=>({time:t,value:+(v*100).toFixed(1)})); if(!d.length) continue;
    const s=c.addLineSeries({color:cv(col),lineWidth:k==='us_10_2'?2:1.5,priceLineVisible:false,lastValueVisible:true,title:''}); s.setData(d);
    if(k==='us_10_2') s.createPriceLine({price:0,color:cv('--muted'),lineWidth:1,lineStyle:2,axisLabelVisible:false,title:''});
    leg.push(`<span style="color:var(${col})">━ ${n} ${d[d.length-1].value.toFixed(0)}</span>`); }
  c.timeScale().fitContent();
  const lg=$('#bdleg'); if(lg) lg.innerHTML=leg.join(' &nbsp; ');
}

/* 상단 3칸 어댑터 (묶음 B, 10/26) — Index.html TOPF·mkTop·topMount. 기존 문장·수치 재배치만, 근거 없으면 NA(사유). */

TOPF.bond=()=>{ if(BND===null||BND===false) return null; if(BND&&isTop(BND.top)) return BND.top; if(!BND||!BND.us) return mkTop(NA('채권 데이터 없음'),NA('—'),NA('—'),['reports/bonds.json']);

  return mkTop(b.join(' · ')||NA('금리 데이터 없음'),imp||NA('함의 문장 없음'),(BND.reco||[])[0]||'조치 없음(권고 문장 없음)',['reports/bonds.json'],BND.generated_at||BND.asof); };
