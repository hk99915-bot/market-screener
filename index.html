<script>
let REJ=null, REV=null;
function reLoad(){ if(REJ!==null) return; REJ=false; REV=false;
  google.script.run.withSuccessHandler(t=>{ try{ REJ=JSON.parse(t); }catch(e){ REJ={}; } if(view==='re') render(); }).withFailureHandler(()=>{ REJ={}; if(view==='re') render(); }).getRealEstate();
  google.script.run.withSuccessHandler(t=>{ try{ REV=JSON.parse(t); }catch(e){ REV={}; } if(view==='re') render(); }).withFailureHandler(()=>{ REV={}; if(view==='re') render(); }).getRealEstateView(); }
function rePct(x,d){ return x==null?'—':((x>0?'+':'')+(x*100).toFixed(d==null?1:d)+'%'); }
/* 서울 25개 구 실거래 지도(데이터 10/24 겸이 "표 말고 지도") — 경계 = J.regions.geo(assets/realestate_map.json, geoBoundaries CC BY 3.0, 저장소 정적),
   숫자 = J.seoul_trades(국토부 RTMS 자동, 하루 1회) → 없으면 V.district_takes(데스크 문서 수치). 색 = --ch1 농도(토큰), 범례에 구간 숫자. */
let RE_M='p59', RE_SEL=null, RE_TW=false;
const RE_MET={p59:{nm:'59㎡ 중위(진입 난이도)',cuts:[7,12],lab:['하 · 7억 미만','중 · 7~12억','상 · 12억 이상'],fmt:v=>v.toFixed(1)+'억'},
  jr:{nm:'전세가율(84㎡)',cuts:[50,60,70],lab:['50% 미만','50~60%','60~70%','70% 이상'],fmt:v=>Math.round(v)+'%'},
  old:{nm:'구축 비중(1999년 이전)',cuts:[20,40,60],lab:['20% 미만','20~40%','40~60%','60% 이상'],fmt:v=>Math.round(v)+'%'}};
function reSel(id){ RE_SEL=(RE_SEL===id?null:id); RE_DONG=null; RE_CX=null; RE_DG=null; render(); }
/* ───── 드릴다운: 구 → 법정동 → 단지 → 최근 거래 (10/26). 데이터 = reports/realestate_trades/<구코드>.json(screener/realestate.py summarize_detail, 구 누를 때만 읽음) ───── */
let RE_DONG=null, RE_CX=null, RE_CXS='n', RE_DG=null; const RE_GUD={};
/* 법정동 '가' 묶음 (10/26 겸이 OK): '○○동N가' → '○○동'. 기본 화면은 묶음(색·건수 = 합친 거래), 묶음을 누르면 1가~N가로 한 번 더 확대·분리. 단지 목록은 원래 동 그대로.
   n·중위 = 생성기 dong_groups(합친 거래로 재계산, screener/realestate.py summarize_detail). 옛 파일(dong_groups 없음)은 건수만 합산·중위 '—'. */
const reGrpNm=n=>{ const m=/^(.+동)\d+가$/.exec(String(n||'')); return m?m[1]:String(n||''); };
function reGroups(TD,geo){ const G={}, add=(nm,x)=>{ const g=reGrpNm(nm), o=G[g]||(G[g]={name:g,members:[],n:0,n_cancel:0,n_jeonse:0,n_cx:0,med:null,p59:null,p84:null,n59:0,n84:0,_x:[]});
    if(!o.members.includes(nm)) o.members.push(nm); if(x&&!o._x.includes(x)){ o._x.push(x); ['n','n_cancel','n_jeonse','n_cx','n59','n84'].forEach(k=>o[k]+=x[k]||0); } };
  ((TD&&TD.dongs)||[]).forEach(x=>add(x.name,x)); (geo||[]).forEach(d=>add(d.name,null));
  const pre=(TD&&TD.dong_groups)||{};
  Object.values(G).forEach(o=>{ o.members.sort((a,b)=>a.localeCompare(b,'ko',{numeric:true})); o.multi=o.members.length>1;
    if(!o.multi&&o._x[0]) Object.assign(o,o._x[0],{name:o.name,members:o.members,multi:false});
    else if(pre[o.name]) ['n','n_cancel','n_jeonse','n_cx','med','p59','p84','n59','n84'].forEach(k=>{ if(pre[o.name][k]!==undefined) o[k]=pre[o.name][k]; }); });
  return G; }
function reDGo(g){ RE_DG=(RE_DG===g?null:g); RE_DONG=null; RE_CX=null; render(); const e=document.getElementById('redr'); if(e&&e.scrollIntoView) e.scrollIntoView({block:'nearest'}); }
function reDongP(nm){ const d=reCur(), G=reGroups(d,(reGeoCur()||{}).dongs), g=G[reGrpNm(nm)];
  if(g&&g.multi&&RE_DG!==g.name&&!RE_DONG) return reDGo(g.name); reDongG(nm); }
function reGuLoad(cd){ if(!/^\d{5}$/.test(cd)||RE_GUD[cd]!==undefined) return; RE_GUD[cd]=false;
  google.script.run.withSuccessHandler(t=>{ try{ const o=JSON.parse(t); RE_GUD[cd]=(o&&Array.isArray(o.dongs))?o:'err'; }catch(e){ RE_GUD[cd]='err'; } if(view==='re') render(); })
    .withFailureHandler(()=>{ RE_GUD[cd]='err'; if(view==='re') render(); }).getRealEstateGu(cd); }
function reGo(lv){ if(lv==='seoul'){ RE_SEL=null; RE_DONG=null; RE_CX=null; RE_DG=null; } else if(lv==='gu'){ RE_DONG=null; RE_CX=null; RE_DG=null; } else if(lv==='grp'){ RE_DONG=null; RE_CX=null; } else if(lv==='dong'){ RE_CX=null; }
  render(); const e=document.getElementById('redr'); if(e&&e.scrollIntoView) e.scrollIntoView({block:'nearest'}); }
function reDong(i){ const d=reCur(); if(!d||!d.dongs[i]) return; RE_DONG=d.dongs[i].name; RE_CX=null; render(); const e=document.getElementById('redr'); if(e&&e.scrollIntoView) e.scrollIntoView({block:'start'}); }
function reCx(i){ const L=reCxList(); if(!L[i]) return; RE_CX=(RE_CX===L[i].name?null:L[i].name); render(); }
function reCxSort(k){ RE_CXS=k; render(); }
function reCur(){ const T=(REJ||{}).seoul_trades||{}, g=RE_SEL&&(T.districts||{})[RE_SEL], d=g&&g.code&&RE_GUD[g.code]; return (d&&typeof d==='object')?d:null; }
function reCxList(){ const d=reCur(); if(!d||!RE_DONG) return [];
  const L=(d.complexes||[]).filter(c=>c.dong===RE_DONG);
  return L.sort(RE_CXS==='p'?((a,b)=>(b.med??-1)-(a.med??-1)||b.n-a.n):((a,b)=>b.n-a.n||(b.n_jeonse||0)-(a.n_jeonse||0)||String(a.name).localeCompare(b.name))); }
function reEok(v,d){ return v==null?'—':(Math.abs(v)<1?v.toFixed(2):v.toFixed(d==null?1:d))+'억'; }   // 10/27 가독성: 집계(중위)는 소수 1자리 통일 · 개별 거래가는 reEok(v,2)
function reDongLines(x){   // 동 카드 2줄: ① 59·84㎡ 중위(비교 단위) ② 전체 중위·전세·단지 — 표본 수·취소는 title
  const tip=`59㎡ ${x.n59||0}건 · 84㎡ ${x.n84||0}건 · 취소 ${x.n_cancel||0}건`;
  return `<small title="${esc(tip)}"><span class="renum">59㎡ ${reEok(x.p59)}</span> · <span class="renum">84㎡ ${reEok(x.p84)}</span></small><small><span class="renum">전체 중위 ${reEok(x.med)}</span> · <span class="renum">전세 ${x.n_jeonse||0}</span> · <span class="renum">단지 ${x.n_cx||0}</span></small>`; }
function reDrill(J){
  const T=J.seoul_trades||{}, g=RE_SEL&&(T.districts||{})[RE_SEL];
  if(!g) return '';
  const grp=((J.regions||{}).groups||[]).filter(x=>x.id!=='seoul'&&(x.members||[]).includes(RE_SEL)).map(x=>`<span class="rebadge">${esc(x.name)}</span>`).join('');
  const gb=RE_DG?`<button type="button" onclick="reGo('grp')">${esc(RE_DG)}</button>›`:'';
  const crumb=`<nav class="recrumb" aria-label="부동산 위치"><button type="button" onclick="reGo('seoul')">서울</button>›${(RE_DONG||RE_DG)?`<button type="button" onclick="reGo('gu')">${esc(RE_SEL)}</button>›`+(RE_DONG?gb+(RE_CX?`<button type="button" onclick="reGo('dong')">${esc(RE_DONG)}</button>›<b>${esc(RE_CX)}</b>`:`<b>${esc(RE_DONG)}</b>`):`<b>${esc(RE_DG)}</b>`):`<b>${esc(RE_SEL)}</b>`}${grp}</nav>`;
  const wrap=b=>`<div class="redr" id="redr">${crumb}${b}<div class="mu" style="font-size:var(--fs-1);margin-top:6px">국토부 실거래 ${esc(rePer(T.period))} · 매매 = 취소 제외 · 전세 = 월세 0 · 억 원 · 표시 전용, 매매 신호 아님</div></div>`;
  if(!g.detail||!g.code) return wrap(`<div class="mu" style="font-size:var(--fs-2)">동·단지 세부는 다음 실거래 수집(국토부 RTMS, 하루 1회) 뒤에 열려요.</div>`);
  reGuLoad(g.code);
  const D=RE_GUD[g.code];
  if(D===false||D===undefined) return wrap('<div class="mu">불러오는 중…</div>');
  if(D==='err') return wrap(`<div class="am" style="font-size:var(--fs-2)">${esc(RE_SEL)} 세부 파일을 못 읽었어요. <a href="#" onclick="delete RE_GUD['${esc(g.code)}'];render();return false">다시 시도</a></div>`);
  if(!RE_DONG){
    const G=reGroups(D,null), dsAll=D.dongs||[], gi=nm=>dsAll.findIndex(x=>x.name===nm);
    const ds=RE_DG&&G[RE_DG]?dsAll.filter(x=>reGrpNm(x.name)===RE_DG):Object.values(G).filter(g=>g.n||g.n_jeonse||g.n_cancel).sort((a,b)=>b.n-a.n||a.name.localeCompare(b.name,'ko'));
    const gbtn=x=>`<button type="button" class="redit regrp" data-grp="${esc(x.name)}" onclick="reDGo('${esc(x.name)}')" aria-label="${esc(x.name)} 묶음 ${x.members.length}곳 매매 ${x.n}건 중위 ${esc(reEok(x.med))}"><span class="v">${esc(x.name)}</span> <span class="mu">${x.n}건 · ${esc(x.members[0].replace(x.name,''))}~${esc(x.members[x.members.length-1].replace(x.name,''))} 나눠 보기 ›</span>
        ${reDongLines(x)}</button>`;
    if(!RE_DG) return wrap(`<div style="font-size:var(--fs-2);margin-bottom:4px"><b>${esc(RE_SEL)}</b> 동 ${ds.length}곳 <span class="mu">· 거래 많은 순 · 누르면 단지</span></div>
      <div class="redgrid">${ds.map(x=>x.multi?gbtn(x):`<button type="button" class="redit" onclick="reDong(${gi(x.name)})" aria-label="${esc(x.name)} 매매 ${x.n}건 중위 ${esc(reEok(x.med))}"><span class="v">${esc(x.name)}</span> <span class="mu">${x.n}건</span>
        ${reDongLines(x)}</button>`).join('')}</div>`);
    return wrap(`<div style="font-size:var(--fs-2);margin-bottom:4px"><b>${esc(RE_DG)}</b> 묶음 ${ds.length}곳 <span class="mu">· 합계 매매 ${G[RE_DG].n}건 · 중위 ${reEok(G[RE_DG].med)} · 눌러서 단지 보기</span></div>
      <div class="redgrid">${ds.map(x=>`<button type="button" class="redit" onclick="reDong(${gi(x.name)})" aria-label="${esc(x.name)} 매매 ${x.n}건 중위 ${esc(reEok(x.med))}"><span class="v">${esc(x.name)}</span> <span class="mu">${x.n}건</span>
        ${reDongLines(x)}</button>`).join('')}</div>`);
  }
  const L=reCxList(), dn=(D.dongs||[]).find(x=>x.name===RE_DONG)||{};
  const tog=[['n','거래 수'],['p','가격(중위)']].map(([k,t])=>`<button type="button" class="retog${RE_CXS===k?' on':''}" aria-pressed="${RE_CXS===k}" onclick="reCxSort('${k}')">${t}</button>`).join('');
  const det=c=>`<div class="recxd"><div class="mu" style="font-size:var(--fs-1)">${c.by?esc(String(c.by))+'년 준공 · ':''}매매 ${c.n} · 전세 ${c.n_jeonse||0} · 취소 ${c.n_cancel||0}</div>
      ${(c.areas||[]).length?`<div class="retw"><table class="regt"><tr><th>전용</th><th>건수</th><th>중위</th><th>최근가</th><th>최근일</th></tr>${c.areas.map(a=>`<tr><td>${a.a}㎡</td><td>${a.n}</td><td>${reEok(a.med,2)}</td><td>${reEok(a.last,2)}</td><td>${esc(a.last_d||'—')}</td></tr>`).join('')}</table></div>`:''}
      <div style="font-size:var(--fs-2);margin-top:4px"><b>최근 거래 ${(c.recent||[]).length}건</b></div>${(c.recent||[]).length?`<div class="retw"><table class="regt"><tr><th>날짜</th><th>층</th><th>전용</th><th>가격</th></tr>${c.recent.map(r=>`<tr><td>${esc(r.d||'—')}</td><td>${r.fl==null?'—':esc(String(r.fl))+'층'}</td><td>${r.a==null?'—':r.a+'㎡'}</td><td>${reEok(r.p,2)}</td></tr>`).join('')}</table></div>`:'<div class="mu" style="font-size:var(--fs-2)">이 기간 매매 없음(전세만)</div>'}</div>`;
  return wrap(`<div style="font-size:var(--fs-2);margin-bottom:4px"><b>${esc(RE_DONG)}</b> 단지 ${L.length}곳 <span class="mu">· 매매 ${dn.n??'—'}건 · 중위 ${reEok(dn.med)}</span></div>

/* 📤 학습 기록 보내기 (10/23 겸이 "폰으로 맨날 했는데 ㅠㅠ") — STUDY 기록은 이 폰 localStorage 에만 쌓여 평가 데스크가 0 으로 봤다.
   MY 탭 회고와 같은 길: pb-private 이슈 '학습기록 YYYY-MM-DD' 작성 창을 열고(겸이가 제출) 기록 데스크가 다음 슬롯에 걷어 평가 데스크에 넘긴다. 토큰·서버 경유 없음, 비율·횟수만. */
function eduSyncPayload(){
  const day=eduKst();
  const apt=Object.entries(APTS||{}).map(([k,v])=>[k,v&&v.ok?1:0,v&&v.t!=null?v.t:null,v&&v.at||null,v&&v.tz==='KST'?'K':'U',v&&v.c!=null?v.c:null]);   // 5번째: 날짜 기준 K=한국·U=옛 UTC · 6번째: 고른 보기 번호 c
  const eng=(ENGS||[]).map(r=>[r.date,r.kind==='review'?'r':r.kind==='quiz'?'q':String(r.kind||''),r.idx,r.ok?1:0,r.ts?eduKst(r.ts):null]);   // 5번째: 푼 날(한국)
  const op=(OPS||[]).map(r=>[r.date,r.idx,r.result,r.ts?eduKst(r.ts):null]);
  const quiz=(EDQ||[]).map(r=>[r.date,r.mod,r.qi,r.ok?1:0,r.choice,r.self?1:0]), qok=quiz.filter(x=>x[3]).length;   // 모듈 확인문제 (mt_quiz_log, req-dev-29f439ce) — date 는 한국 기준
  const sumE=k=>{ const a=(ENGS||[]).filter(r=>!k||r.kind===k), ok=a.filter(r=>r.ok).length; return `${ok}/${a.length}`; };
  const aok=apt.filter(x=>x[1]).length;
  const head=`학습 기록 (터미널 STUDY · ${day} 보냄)\n- 커리큘럼 완료 모듈 ${Object.keys(EDONE||{}).length}개\n- 영어 단어 복습 ${sumE('review')} · 독해 퀴즈 ${sumE('quiz')} · 응답 날짜 ${new Set((ENGS||[]).map(r=>r.date)).size}일\n- 인적성 ${aok}/${apt.length}\n- 모듈 확인문제 ${qok}/${quiz.length}\n- OPIc 자기평가 ${op.length}회\n\n`;
  const raw=JSON.stringify({v:2,tz:'KST',sent:day,done:EDONE||{},apt,eng,op,quiz});
  return {day,head,body:head+'```json\n'+raw+'\n```\n\n(기록 데스크 → reports/study_progress 반영·평가 데스크 채점용. 금액·건강 정보 없음)'};
}
function eduSync(){ const P=eduSyncPayload(), base='https://github.com/hk99915-bot/pb-private/issues/new?title='+encodeURIComponent('학습기록 '+P.day);
  const u=base+'&body='+encodeURIComponent(P.body), m=document.getElementById('edusyncm');
  if(u.length<7500){ window.open(u,'_blank'); if(m) m.textContent='깃허브 이슈 작성 창을 열었어 — [Submit] 누르면 끝 (기록 데스크가 걷어 감)'; return; }
  const go=()=>{ window.open(base+'&body='+encodeURIComponent(P.head+'(아래에 붙여넣기)\n\n'),'_blank'); if(m) m.textContent='기록이 길어서 클립보드에 복사했어 — 열린 창 본문에 길게 눌러 붙여넣고 [Submit]'; };
  try{ navigator.clipboard.writeText(P.body).then(go,()=>{ prompt('아래 전체를 복사해서 이슈 본문에 붙여넣어',P.body); go(); }); }catch(e){ prompt('아래 전체를 복사해서 이슈 본문에 붙여넣어',P.body); go(); } }
function eduSyncBar(){ setTimeout(()=>{ const b=document.getElementById('edusync'); if(b) b.onclick=eduSync; },0);
  const n=Object.keys(EDONE||{}).length+(ENGS||[]).length+Object.keys(APTS||{}).length+(OPS||[]).length+(EDQ||[]).length;
  return `<div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 8px;font-size:var(--fs-2)"><button id="edusync" type="button" style="min-height:40px;background:var(--amber);color:var(--on-amber);border:0;padding:0 14px;font:inherit;cursor:pointer">📤 학습 기록 보내기</button><span id="edusyncm" class="mu">이 폰에만 쌓인 기록 ${n}건 → 평가 데스크 채점용(비공개 저장소 이슈, 제출은 겸이가)</span></div>`; }
{ const _e=eduView, _a=aptView, _g=engView; eduView=function(){ return eduSyncBar()+_e.apply(this,arguments); }; aptView=function(){ return eduSyncBar()+_a.apply(this,arguments); }; engView=function(){ const h=_g.apply(this,arguments); return /class="load"/.test(h)?h:eduSyncBar()+h; }; }

<script>

const RENEGO_WARN_AT=2, RENEGO_WINDOW_DAYS=30, RENEGO_REASON_MIN=10;
// 관련 주문표만 ⛔ (screener/defs.py RENEGO_SCOPE · renego.relates): POS_BACKSTOP = 반도체 종목 또는 −20% 백스톱 아래 보유 종목. 표에 없는 규칙은 전 주문표.
const RENEGO_SCOPE={POS_BACKSTOP:'backstop'};
const SEMI_TICKERS=new Set(['MU','SNDK','NVDA','AMD','AVGO','TSM','INTC','QCOM','ARM','MRVL','LRCX','AMAT','KLAC','ASML','WDC','STX','PSI','SOXX','SMH','SOXL','SOXQ','XSD','SMHX','139260','091160','396500','395160','449450','000660','005930','042700','000990','058470','240810','403870','357780','036930','095340','039030','319660','140860']);
function tkSemi(code,name){ return SEMI_TICKERS.has(String(code||'').toUpperCase())||/반도체|semiconductor/i.test(String(name||'')); }
function renegoFor(code,name,below){ const ctx={semi:tkSemi(code,name),below:!!below}; return renegoActive().filter(x=>RENEGO_SCOPE[x.rule]!=='backstop'||ctx.semi||ctx.below); }
// 결재 #14: 레버리지·인버스 베팅은 1일 상한 라벨 (duel.lev_cap 이 못 붙인 공격 PB 문구·픽 포함 — 감사 화면 중-4)
const LEV_RE=/레버리지|인버스|곱버스|[23]\s*배|\b[23]X\b|\b(SOXL|SOXS|TQQQ|SQQQ|UPRO|SPXU|TNA|TZA|NVDL|TSLL|QLD|SSO)\b|122630|233740|252670|114800|251340/i;

function renegoActive(){ const today=new Date(Date.now()+9*36e5).toISOString().slice(0,10), lo=new Date(Date.parse(today+'T00:00:00Z')-(RENEGO_WINDOW_DAYS-1)*864e5).toISOString().slice(0,10), c={};
  for(const e of ((RENEGO&&RENEGO.events)||[])){ const r=String(e.rule||''), d=String(e.date||'').slice(0,10); if(!/^[A-Z0-9_]+$/.test(r)||d<lo||d>today) continue; const x=c[r]||(c[r]={rule:r,count:0,last:''}); x.count++; if(d>x.last) x.last=d; }
  return Object.values(c).filter(x=>x.count>=RENEGO_WARN_AT).sort((a,b)=>b.count-a.count); }
// 결재 #14 ③ (10/17): 매도(exit '매도')·포상(ops/cooldown.json) 후 30분 — 새 모의 베팅 금지, 카운트다운. 주문표 판정은 제외. 값 = screener/defs.py COOLDOWN_MIN
const COOLDOWN_MIN=30;
function coolUntil(D){ const ev=[]; const at=s=>{ const t=Date.parse(String(s).replace(' ','T')+':00+09:00'); return isFinite(t)?t:null; };
  for(const it of (D.items||[])){ if(it.kind!=='exit') continue; const me=(it.picks||{})['나']||{}; if(!me.cash) continue; const t=at(me.submitted?it.date+' '+me.submitted:(it.basis||{}).at); if(t) ev.push([t,'매도 '+(it.title||'').replace('매도 타점 대결 · ','')]); }

function livePx(sym,mk,cb){
  const fb=()=>google.script.run.withSuccessHandler(t=>{ try{ const d=JSON.parse(t); cb(d.close, `종가 ${esc(String(d.asof||''))} 기준 (실시간 아님)`);}catch(e){ cb(null,'가격 없음'); } }).withFailureHandler(()=>cb(null,'가격 없음')).getStock(mk,sym);
  if(mk!=='KR') return fb();
  const ac=new AbortController(), to=setTimeout(()=>ac.abort(),3000);
  fetch('https://polling.finance.naver.com/api/realtime/domestic/stock/'+encodeURIComponent(sym),{signal:ac.signal}).then(r=>r.json()).then(j=>{ clearTimeout(to);
    const d=(j.datas||[])[0]||{}, px=+String(d.closePrice||d.closePriceRaw||'').replace(/,/g,''); if(!(px>0)) throw 0;
    cb(px, `현재가 네이버 실시간${String(d.localTradedAt||'').slice(11,16)?' '+String(d.localTradedAt).slice(11,16):''}`); }).catch(()=>{ clearTimeout(to); fb(); }); }
// 내 보유 (MY 탭에 입력한 텍스트, 이 브라우저 localStorage) → [{s,m,n,qty,avg}]
function myHoldList(){ let t=''; try{ t=(typeof myLoad==='function'?myLoad():localStorage.getItem('mt_holdings_v1'))||''; }catch(e){}

  return myParse(t).filter(h=>h.key).map(h=>{ const r=myResolve(h.key); return r?{s:r.s,m:r.m,n:r.n,qty:h.qty,avg:h.avg,book:h.book}:null; }).filter(Boolean); }

/* 누적 곡선 미니 차트 (참가자별 확정 판 수익률 단순 합) — 폭 100%, 높이 90px */
const DUEL_COL={'나':'var(--up)','PB':'#c77dff','나🔥':'#ffb703','PB🔥':'#4cc9f0','규칙':'var(--muted)'};
function duelCurve(curve){
  const ws=Object.keys(curve||{}).filter(w=>(curve[w]||[]).length); if(!ws.length) return '<div class="mu" style="font-size:var(--fs-1)">확정된 판이 쌓이면 누적 곡선이 그려집니다</div>';
  const W=320,H=90,pad=4, all=ws.flatMap(w=>curve[w].map(p=>p[1])).concat([0]), lo=Math.min(...all), hi=Math.max(...all), rg=(hi-lo)||0.01;
  const n=Math.max(...ws.map(w=>curve[w].length)), X=i=>pad+(W-2*pad)*(n<=1?0.5:i/(n-1)), Y=v=>H-pad-(H-2*pad)*(v-lo)/rg;
  const lines=ws.map(w=>{ const pts=[[0,0],...curve[w].map((p,i)=>[i+1,p[1]])]; const nn=pts.length-1;
    const xs=i=>pad+(W-2*pad)*(nn?i/nn:0.5); return `<polyline points="${pts.map(([i,v])=>xs(i).toFixed(1)+','+Y(v).toFixed(1)).join(' ')}" fill="none" style="stroke:${DUEL_COL[w]||'var(--amber)'};stroke-width:1.6"/>`; }).join('');
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="width:100%;height:${H}px;display:block"><line x1="0" x2="${W}" y1="${Y(0).toFixed(1)}" y2="${Y(0).toFixed(1)}" style="stroke:var(--line);stroke-dasharray:3 3"/>${lines}</svg>
    <div style="font-size:var(--fs-1);display:flex;gap:10px;flex-wrap:wrap">${ws.map(w=>`<span><b style="color:${DUEL_COL[w]||'var(--amber)'}">━</b> ${esc(w)} ${duelPc(curve[w][curve[w].length-1][1])}</span>`).join('')}<span class="mu">${lo<0?'최저 '+duelPc(lo):''} · 점선 0%</span></div>`;
}

  const oc=d.origin_counts||{}, tot=Object.values(oc).reduce((a,b)=>a+(b||0),0), rc=tot?Math.round((oc.recompute||0)/tot*100):0;
  return `<table><tr><th class="l">원천</th><th>신호</th><th class="l">5일 초과</th><th class="l">20일 초과</th><th class="l">60일 초과</th></tr>${rows}</table>

<!-- tab_mkt_deriv.html — MARKET › 파생 — derivs.json·deriv/daily.csv·파생 시그널 스터디 (derivView·drawDerivHist).

     전역 도우미($·esc·num·pct·render·setView·openDetail 등)는 Index.html 에 있다. -->
<script>
// 베이시스 팝업 (10/17 겸이: 티커·카드의 베이시스/콘탱고 누르면) — data/deriv/daily.csv 의 basis·basis_theo 이력
let BSH=null;
function openBasis(){
  $('#dr').classList.add('on');$('#bd').classList.add('on');$('#dr-t').textContent='베이시스 (선물 − 현물)';$('#dr-s').textContent='';$('#dr-b').innerHTML='<div class="load">LOADING …</div>';
  const show=()=>{ const R=(BSH||[]).filter(r=>r.basis!=null); if(!R.length){ $('#dr-b').innerHTML='<div class="err">베이시스 이력 없음</div>'; return; }
    const last=R[R.length-1], y1=R.slice(-250), srt=y1.map(r=>r.basis).sort((a,b)=>a-b), pctl=srt.filter(v=>v<=last.basis).length/srt.length, back20=R.slice(-20).filter(r=>r.basis<0).length;
    const lab=b=>b<-1?'<b class="dn">백워데이션</b>':b>1?'<b class="up">콘탱고</b>':'<b>중립</b>';
    const n=Math.min(R.length,250), b=R.slice(-n), W=900, H=260, lo=Math.min(...b.map(r=>Math.min(r.basis,r.theo??r.basis)),0), hi=Math.max(...b.map(r=>Math.max(r.basis,r.theo??r.basis)),0), pad=(hi-lo)*0.08||1;
    const Y=v=>12+(hi+pad-v)/((hi+pad)-(lo-pad))*(H-34), X=i=>48+(W-60)*i/(n-1||1);
    const path=k=>b.map((r,i)=>r[k]==null?'':`${i&&b[i-1][k]!=null?'L':'M'}${X(i).toFixed(1)},${Y(r[k]).toFixed(1)}`).join('');
    $('#dr-s').innerHTML=`${last.basis>0?'+':''}${last.basis.toFixed(2)}p · ${lab(last.basis)} · ${esc(last.date)}`;
    $('#dr-b').innerHTML=`<div class="grid"><div class="p c12"><h2>지금<small>${esc(last.date)} 종가 기준 · data/deriv/daily.csv</small></h2><div class="b" style="line-height:1.8;white-space:normal">
      실제 <b>${last.basis>0?'+':''}${last.basis.toFixed(2)}</b>p ${lab(last.basis)}${last.theo!=null?` · 이론값 ${last.theo.toFixed(2)}p (금리·배당으로 계산) · 실제−이론 <b class="${last.basis-last.theo<0?'dn':'up'}">${(last.basis-last.theo).toFixed(2)}p</b>`:''}<br>
      최근 1년 중 위치 <b>${Math.round(pctl*100)}%</b> (0%=가장 낮음) · 최근 20거래일 중 백워데이션(0 아래) <b>${back20}</b>일</div></div>
     <div class="p c12"><h2>최근 1년<small>━ 실제 · ┅ 이론 · 0선</small></h2><div class="b"><svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;background:#050505">
      <line x1="48" x2="${W-12}" y1="${Y(0)}" y2="${Y(0)}" stroke="#444" stroke-dasharray="4 4"/>
      ${[hi,0,lo].map(v=>`<text x="4" y="${Y(v)+4}" fill="#777" font-size="12" font-family="monospace">${v.toFixed(1)}</text>`).join('')}
      <path d="${path('theo')}" fill="none" stroke="#777" stroke-width="1.2" stroke-dasharray="3 3"/><path d="${path('basis')}" fill="none" stroke="#fc3" stroke-width="2"/>
      ${[0,Math.floor(n/2),n-1].map(i=>`<text x="${X(i)-30}" y="${H-6}" fill="#777" font-size="12" font-family="monospace">${esc(b[i].date)}</text>`).join('')}</svg></div></div>
     <div class="p c12"><h2>읽는 법<small>비유 → 용어 → 공식</small></h2><div class="b" style="line-height:1.8;white-space:normal;font-size:var(--fs-2)">
      <b>비유</b> — 다음 달 받을 물건을 오늘 미리 사면 보통 웃돈(보관비·이자)을 얹어 준다. 웃돈이 붙으면 <b>콘탱고</b>, 오히려 할인되면 <b>백워데이션</b>.<br>
      <b>용어</b> — 베이시스 = 코스피200 선물 − 현물(포인트). 이론값 = 현물 × (금리 − 배당수익률) × 남은 기간. 실제가 이론보다 많이 낮으면 선물을 급히 파는 쪽(헤지·공포)이 많다는 뜻.<br>
      <b>공식</b> — 이론 베이시스 ≈ S × (r − d) × t/365. 예: S 878, r 3.0%, d 1.5%, t 30일 → 878 × 0.015 × 30/365 ≈ 1.08p.<br>
      <span class="mu">주의: 백워데이션 자체는 매매 신호가 아님(등급은 파생 데스크 연구 참조). 만기 주(둘째 목요일) 근처엔 0으로 수렴.</span>
      <div style="margin-top:6px"><button class="sbtn" onclick="$('#dr').classList.remove('on');$('#bd').classList.remove('on');setView('deriv')">파생 탭 전체 차트 →</button></div></div></div></div>`; };
  if(BSH) return show();
  google.script.run.withSuccessHandler(t=>{ try{ const L=String(t).trim().split(/\r?\n/), h=L[0].split(','), ix=k=>h.indexOf(k), f=(a,k)=>{const v=parseFloat(a[ix(k)]); return isFinite(v)?v:null;};
      BSH=L.slice(1).map(l=>{const a=l.split(','); return {date:a[ix('date')], basis:f(a,'basis'), theo:f(a,'basis_theo')};}); }catch(e){ BSH=[]; } show(); }).withFailureHandler(()=>{ BSH=[]; show(); }).getDerivHist(); }
document.addEventListener('click',e=>{ const c=e.target.closest('[data-basis]'); if(c&&!c.closest('.tape')) openBasis(); });

/* ───── 파생(DERIV) 화면: 흩어진 파생 정보 모음 — reports/derivs.json · data/deriv/daily.csv · reports/studies/derivs_signals.json · live.json K200F (새 수집 없음) ───── */
const DVX={d:null,h:null,s:null,g:null,r:null,v:null}; let DVCH=[];

  const P=R&&R.probe;

    `<div style="font-size:var(--fs-1)">${esc(P.rule||'')}</div>${tb(P.cols,P.rows)}<ul style="margin:4px 0 0 16px;padding:0;font-size:var(--fs-1)">${(P.gaps||[]).map(g=>`<li>${esc(g)}</li>`).join('')}</ul><div class="mu" style="font-size:var(--fs-1)">${esc(P.how||'')}</div>`);
  const Q=R&&R.prereg;
  if(Q) out+=sec('dvResPre',esc(Q.title),`<span class="tag" style="color:var(--muted);border-color:var(--line)">설계만 · 결과 없음</span> ${esc(Q.by||'')}`,
    `<div style="font-size:var(--fs-1)"><b>상태</b> ${esc(Q.status||'')}</div><div style="font-size:var(--fs-1)"><b>사전 기대</b> ${esc(Q.prior||'')}</div>${tb(Q.cols,Q.rows)}<div style="font-size:var(--fs-1);margin-top:4px"><b>결론</b> ${esc(Q.conclusion||'')}</div><div class="mu" style="font-size:var(--fs-1)">${esc(Q.src||'')}</div>`);
  if(!out) return '<div class="p c12" id="dvRes"><h2>파생 리서치 산출물</h2><div class="b mu">데이터 없음 (reports/views/derivs_research.json · reports/studies/2026-10-21_hf_ls_vol.json)</div></div>';
  return `<div class="p c12" id="dvRes"><h2>파생 리서치 산출물<small>${esc((R&&R.meta&&R.meta.asof)||'')} · 방향 신호 아님</small></h2><div class="b" style="white-space:normal">
    <div class="mu" style="font-size:var(--fs-1)">${esc((R&&R.meta&&R.meta.note)||'')}</div>${out}</div></div>`;
}

/* 상단 3칸 어댑터 (묶음 B, 10/26) — Index.html TOPF·mkTop·topMount. 기존 문장·수치 재배치만, 근거 없으면 NA(사유). */
if(typeof TOPF==='object'){
TOPF.deriv=()=>{ const d=DVX.d; if(d===null||d===false) return null; if(d&&isTop(d.top)) return d.top; if(!d||d.pcr_oi==null&&!d.insight) return mkTop(NA('파생 데이터 없음'),NA('—'),NA('—'),['reports/derivs.json']);
  const i=d.insight||{}; return mkTop(`PCR(미결제) ${d.pcr_oi??'—'} · 맥스페인 ${d.max_pain??'—'} · 현물 ${d.spot??'—'} (만기 ${d.expiry||'—'})`,[i.one_line||NA('인사이트 없음'),'PCR·맥스페인 방향 효과는 검증전'],i.so_what||'조치 없음(인사이트 없음)',['reports/derivs.json'],d.asof||d.date,{grade:'검증전'}); };
}
</script>

<!-- tab_mkt_macro.html — MARKET › MACRO — macroView (10/21 겸이 "리서치나 마켓에 매크로가 없는 듯", 보드 macro-tab).
     흩어져 있던 매크로 산출물을 한 화면 결론으로: macro_view.json(바람·환율·유가·금·코스피 vs S&P) · bonds.json(한·미 금리) · calendar.json(일정·발표 결과).
     10/23 매크로: 원자재(commodities.json · getCommodities)·지정학 축(views/geopolitics.json · getGeopolitics) 패널 추가 — 첫 화면(macTop) 아래, 표시 전용. 문구 근거 = docs/desk_kb/macro.md #3(바람 점수) #5(20일 격차 ±8%p) #15(읽는 순서) #16(USDKRW).
     10/24 프론트: 애널리스트 원자재 뷰(views/analyst_cmdty.json · getAnalystCmdty) + 원자재 현상황·관계성·지정학 시나리오(views/macro_cmdty.json · getMacroCmdty, md 원본) — 원자재 패널 아래.
     전역 도우미($·esc·num·pct·render·setView·asofTag·staleTag·dataLag·mkPhase)는 Index.html, 지표 해설 표 macroPanel 은 tab_market.html. -->
<script>
let MCX=null;
function mcLoad(){ MCX={};
  const g=(k,fn)=>google.script.run.withSuccessHandler(t=>{ try{ MCX[k]=typeof t==='string'?JSON.parse(t):(t||{}); }catch(e){ MCX[k]={}; } if(view==='macro') render(); })
    .withFailureHandler(()=>{ MCX[k]={}; if(view==='macro') render(); })[fn]();
  g('mv','getMacroView'); g('bd','getBonds'); g('cal','getCalendar'); g('cm','getCommodities'); g('geo','getGeopolitics'); g('gn','getGeoNews'); g('ac','getAnalystCmdty'); g('mc','getMacroCmdty'); }
const mcBp=x=>x==null?'—':`<span class="${x>0?'dn':x<0?'up':'mu'}">${x>0?'+':''}${Number(x).toFixed(0)}bp</span>`;   // 금리↑ = 채권값↓ → 빨강 (채권 탭과 같은 색 규칙)
const mcMd=ds=>ds?(+String(ds).slice(5,7))+'/'+(+String(ds).slice(8,10)):'—';
function mcDday(ds){ const t=tzParts('Asia/Seoul').ds, d=Math.round((Date.parse(ds+'T00:00:00Z')-Date.parse(t+'T00:00:00Z'))/864e5); return d===0?'오늘':d>0?'D-'+d:'D+'+(-d); }
function macroView(){
  if(MCX===null){ mcLoad(); return '<div class="load">LOADING …</div>'; }
  const MV=MCX.mv, BD=MCX.bd, CAL=MCX.cal;
  if(!MV||!BD||!CAL) return '<div class="load">LOADING …</div>';
  const R={}; (MV.rows||[]).forEach(r=>R[r.key]=r);
  const tile=(t,body,foot)=>`<div class="mct" style="border:1px solid var(--line);padding:6px 8px;line-height:1.55;min-width:0"><div class="am" style="font-size:var(--fs-2);font-weight:700">${t}</div>${body}${foot?`<div class="mu" style="font-size:var(--fs-1);white-space:normal">${foot}</div>`:''}</div>`;
  const mvTag=staleTag(MV.asof,['08:50','10:30','11:35','13:30','14:15','15:45','19:10'],[1,2,3,4,5],['reports/macro_view.json'],dataLag('KR',MV.asof,0));
  // ① 결론: 바람(macroview 문장) + 한국만 하락 격차 (KB #5)
  let wind='<div class="mu">매크로 바람 데이터 없음 (reports/macro_view.json)</div>';
  if(MV.score!=null){ const col=MV.score>0.15?'var(--up)':MV.score<-0.15?'var(--dn)':'var(--amber)', s1=String(MV.summary||'').split(' · ')[0];
    wind=`<div style="font-size:var(--fs-3)"><b style="color:${col}">${esc(s1||('매크로 바람 '+(MV.label||'')+' ('+MV.score+')'))}</b></div>
      <div class="mu" style="font-size:var(--fs-1)">점수 −1~+1 = Σ(가중치 × 지표 영향) · 한국 지수는 결과라 제외 · <b>검증전</b>(가중치 사후 설정 — 참고만)</div>`; }
  const K=R.KOSPI, S=R.SPX; let gap='';
  if(K&&S&&K.chg20!=null&&S.chg20!=null){ const g=(K.chg20-S.chg20)*100;
    const why=g<-8?'한국 고유 요인 쪽(규칙: 격차 < −8%p) — 매크로 반전만으론 회복 근거 부족':g>8?'한국이 강함(규칙: 격차 > +8%p)':'격차 작음(±8%p 안) — 매크로와 같이 움직임';
    gap=`<div id="macGap" style="margin-top:4px;font-size:var(--fs-2);white-space:normal">한국만 하락 격차: 20일 코스피 ${pct(K.chg20,1)} vs S&amp;P ${pct(S.chg20,1)} = <b class="${g<0?'dn':'up'}">${g>0?'+':''}${g.toFixed(1)}%p</b> → ${why}</div>`; }
  // 코스피200 ATM IV 칩 (파생 요청 req-macro-e0ef2a13) — 표시 전용 · 바람 점수 제외 · 검증전
  const IVc=(MV.chips||[]).find(c=>c.key==='K200_ATM_IV');
  if(IVc&&IVc.iv!=null) gap+=`<div id="macIV" style="margin-top:4px;font-size:var(--fs-2);white-space:normal">코스피200 ATM IV <b>${(IVc.iv*100).toFixed(1)}%</b> → 하루 1σ ≈ <b>±${(IVc.day_1s*100).toFixed(1)}%</b> <span class="mu" style="font-size:var(--fs-1)">(연율 ÷ √252 · 흔들림 크기, 방향 아님 · 점수 제외 · <b>검증전</b> · derivs.json ${mcMd(IVc.date)})</span></div>`;
  const top=`<div class="p c12" id="macTop"><h2>MACRO 한눈에<small>reports/macro_view.json${mvTag}</small></h2><div class="b" style="white-space:normal">
    <div id="macWind" style="border:1px solid var(--line);border-left:4px solid ${MV.score==null?'var(--line)':MV.score>0.15?'var(--up)':MV.score<-0.15?'var(--dn)':'var(--amber)'};padding:6px 9px;line-height:1.6">${wind}${gap}</div>${mcGlance(MV.glance)}`;
  // ② 금리 (bonds.json — 미 Treasury·한 KRX 장외 민평)
  const U=(BD.us||{}).chg||{}, KR=(BD.kr||{}).chg||{};
  const rr=(lab,c)=>c&&c.v!=null?`<div style="display:flex;justify-content:space-between;gap:6px"><span>${lab}</span><span><b>${c.v.toFixed(2)}%</b> <span style="font-size:var(--fs-1)">1M ${mcBp(c.m1)}</span></span></div>`:`<div class="mu">${lab} —</div>`;
  const ua=(BD.us||{}).asof, ka=(BD.kr||{}).asof;
  const bdTag=staleTag(BD.generated_at?String(BD.generated_at).slice(5,16):BD.asof,['21:00'],[1,2,3,4,5],['bonds'],dataLag('US',ua,1)||'');
  const kLag=(()=>{ const p=mkPhase('KR'), t=tzParts('Asia/Seoul'); return dataLag('KR',ka,(p.last===p.today&&t.hm<22*60)?1:0); })();   // 국고채 민평은 장 마감 뒤 21:00 생성분부터
  const rates=tile('금리 · 10년 · 2년',rr('미 10Y',U['10Y'])+rr('미 2Y',U['2Y'])+rr('한 10Y',KR['10Y'])+rr('한 2Y',KR['2Y']),
    `미 Treasury ${mcMd(ua)} · 한 KRX 장외(민평) ${mcMd(ka)}${kLag?' <b class="dn">⚠ STALE 한국</b>':''} · bonds.json${bdTag}`);
  // ③ 기준금리 · 다음 회의 (calendar.json) — 정책금리 시리즈는 산출물에 없음 → 단기금리를 '대용'으로만
  const today=tzParts('Asia/Seoul').ds, EV=(CAL.events||[]).filter(e=>e.type==='매크로');
  const nx=re=>EV.filter(e=>e.date>=today&&re.test(e.name)).sort((a,b)=>a.date<b.date?-1:1)[0];
  const fomc=nx(/FOMC/), bok=nx(/금통위|한은|한국은행/), boj=nx(/BOJ/);
  const calTag=staleTag(CAL.asof,['08:50'],[1,2,3,4,5],['calendar'],dataLag('KR',CAL.asof,0));
  const pol=tile('기준금리 · 다음 회의',
    `<div>정책금리 값: <span class="mu">데이터 없음</span> <span class="mu" style="font-size:var(--fs-1)">(산출물에 시리즈 없음 — 데이터 데스크 요청)</span></div>
     <div style="font-size:var(--fs-2)">대용(기준금리 아님): 미 3M ${U['3M']&&U['3M'].v!=null?U['3M'].v.toFixed(2)+'%':'—'} · 한 CD91 ${KR.CD&&KR.CD.v!=null?KR.CD.v.toFixed(2)+'%':'—'}</div>
     <div>FOMC ${fomc?`<b>${mcMd(fomc.date)}</b> (${mcDday(fomc.date)}) <span class="mu" style="font-size:var(--fs-1)">${esc(fomc.note||'')}</span>`:'<span class="mu">일정 없음</span>'}</div>
     <div>금통위 ${bok?`<b>${mcMd(bok.date)}</b> (${mcDday(bok.date)})`:'<span class="mu">calendar.json 미등록</span>'}${boj?` · BOJ <b>${mcMd(boj.date)}</b> (${mcDday(boj.date)})`:''}</div>`,
    `calendar.json (연준·BOJ 공식 일정)${calTag}`);
  // ④ 환율 · ⑤ 유가·금 (macro_view rows — 일봉)
  const mr=(k,lab,dg,unit)=>{ const r=R[k]; return r&&r.last!=null?`<div style="display:flex;justify-content:space-between;gap:6px"><span>${lab}</span><span><b>${unit==='$'?'$':''}${num(r.last,dg)}</b> <span style="font-size:var(--fs-1)">20일 ${pct(r.chg20,1)}</span></span></div>`:`<div class="mu">${lab} —</div>`; };
  const rd=ks=>{ const ds=[...new Set(ks.map(k=>R[k]&&R[k].date).filter(Boolean))]; return ds.map(mcMd).join('·')||'—'; };
  const fx=tile('환율',mr('USDKRW','원/달러',1)+mr('DXY','달러지수',2)+mr('USDJPY','엔/달러',2),
    `원/달러 ↑ = 원화 약세 = 외국인 환차손(매크로 KB #16) · 일봉 ${rd(['USDKRW','DXY','USDJPY'])} · macro_view.json`);
  const cmd=tile('유가 · 금',mr('WTI','WTI',2,'$')+mr('GOLD','금',0,'$'),`달러 기준 · 일봉 ${rd(['WTI','GOLD'])} · macro_view.json`);
  // ⑥ 다음 주요 일정 (중요도 ★2 이상)
  const up=EV.filter(e=>e.date>=today&&(e.imp||0)>=2).sort((a,b)=>a.date<b.date?-1:1).slice(0,4);
  const sch=tile('다음 주요 일정',up.length?up.map(e=>`<div style="display:flex;gap:6px"><b style="min-width:38px">${mcMd(e.date)}</b><span class="mu" style="min-width:34px">${mcDday(e.date)}</span><span style="white-space:normal">${esc(e.name)}${(e.imp||0)>=3?' <span class="am">★</span>':''}</span></div>`).join(''):'<div class="mu">예정된 ★2 이상 매크로 일정 없음</div>',
    `★ = 중요도 3 (결과 전 레버리지·방향 베팅 금지 대상, 매크로 KB #12) · calendar.json`);
  const grid=`<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:6px;margin-top:8px">${rates}${pol}${fx}${cmd}${sch}</div>
    <div class="mu" style="font-size:var(--fs-1);margin-top:6px">금리 색 = 채권 가격 기준(금리↑ <span class="dn">빨강</span>) · 지수·환율 색 = 값의 방향. 숫자는 산출물 그대로이고 해석 문장은 규칙(매크로 KB) 기반 — 추정 없음. <button class="sbtn" onclick="setView('bond')" style="min-height:32px">채권 탭 →</button></div></div></div>`;
  // 최근 발표 (calendar result = calendar_ev.release_line — 직전 대비 · 개정 전, 컨센서스 없음)
  const done=(CAL.events||[]).filter(e=>e.type==='매크로'&&e.date<=today&&(e.result||[]).length).sort((a,b)=>a.date<b.date?1:-1).slice(0,3);
  const rel=done.length?`<div class="p c12"><h2>최근 발표<small>직전 대비 · 개정 전 잠정치 · 컨센서스 없음 (매크로 KB #2)</small></h2><div class="b" style="white-space:normal;line-height:1.65">${done.map(e=>`<div><b>${mcMd(e.date)}</b> ${esc(e.name)} — ${e.result.map(esc).join(' · ')}</div>`).join('')}</div></div>`:'';
  const tbl=typeof macroPanel==='function'?`<div class="p c12"><h2>지표 전체 · 해설<small>매크로 바람 구성 지표 · ▸ 누르면 해설 · 지표명 누르면 차트</small></h2><div class="b">${macroPanel('KR')}</div></div>`:'';
  return `<div class="grid">${top}${grid}${mcCmdPanel(MCX.cm,R)}${mcAnaPanel(MCX.ac)}${mcCmdViews(MCX.mc)}${mcGeoPanel(MCX.geo,MCX.cm,R,MCX.gn)}${rel}${tbl}</div>`;
}
// 한눈에 층별 줄 (10/24 겸이 "추가된 데이터 기반으로 더 자세해야") — macro_view.json glance(macroview.glance: 숫자 자동) + desk(reports/views/macro_glance.json 데스크 해석).
// 표시 전용 · 바람 점수·격차 규칙 불변. 숫자 줄 = 산출물 그대로(출처·기준일), 앰버 '데스크 해석' = 매크로 작성(누르면 뒤집힘 조건·등급).
function mcGlance(GL){
  if(!GL||!GL.length) return '<div id="macGlance" class="mu" style="font-size:var(--fs-1);margin-top:4px">층별 요약 없음 (macro_view.json glance — 다음 생성분부터)</div>';
  const N=['①','②','③','④','⑤','⑥'];
  // 첫 화면(390×844) 한 장 = 줄마다 숫자 요약(short) + 출처 꼬리 + 데스크 해석 1줄. 누르면 전체 숫자(line)·뒤집힘 조건·등급.
  const fsrc=s=>String(s||'').split(' · ')[0].replace(/\(.*?\)/g,'').replace(/\.json$/,'').replace(/^views\//,'');
  const clamp=n=>`display:-webkit-box;-webkit-line-clamp:${n};-webkit-box-orient:vertical;overflow:hidden`;
  return `<div id="macGlance" style="margin-top:4px;overflow-wrap:anywhere">${GL.map((g,i)=>{ const d=g.desk;
    return `<details class="mgl" style="border-top:1px solid var(--line);padding:2px 0;line-height:1.4"><summary style="cursor:pointer;list-style:none;white-space:normal">
      <div style="font-size:var(--fs-2);${clamp(2)}"><b class="am">${N[i]||''} ${esc(g.title||'')}</b> <span class="mu" style="font-size:var(--fs-1)">[${esc(fsrc(g.src))} ${esc(String(g.asof||'').split(' · ')[0])}·${esc(String(g.label||'').split('(')[0])}]</span> ${esc(g.short||g.line||'')}</div>
      ${d&&d.take?`<div style="font-size:var(--fs-1);${clamp(1)}"><span class="am" style="font-size:var(--fs-1);padding:0 2px;border:1px solid var(--amber)">데스크 해석</span> ${esc(d.take)}</div>`:''}</summary>
      <div style="font-size:var(--fs-1);white-space:normal;padding:2px 0 3px 8px;line-height:1.5"><div>${esc(g.line||'')}</div><div class="mu" style="font-size:var(--fs-1)">출처 ${esc(g.src||'')} · 기준 ${esc(g.asof||'')} · <b>${esc(g.label||'')}</b></div>
      ${d&&d.take?`<div style="border-left:2px solid var(--amber);padding-left:6px;margin-top:2px"><div><b class="am">데스크 해석</b> ${esc(d.take)}</div><div><b>뒤집힘</b> ${esc(d.flip||'—')}</div><div class="mu" style="font-size:var(--fs-1)">${esc(d.grade||'')} · 매크로 작성 ${esc(d.asof||'')} · reports/views/macro_glance.json</div></div>`:'<div class="mu" style="font-size:var(--fs-1)">데스크 해석 없음 (reports/views/macro_glance.json)</div>'}</div></details>`; }).join('')}
    <div class="mu" style="font-size:var(--fs-1);margin-top:1px">줄 누르면 전체 숫자·뒤집힘 조건 · 숫자=산출물 자동 · 앰버=매크로 해석 · 바람 점수엔 안 들어감</div></div>`;
}

function sysOpsView(){

  const fl=W.flatMap(w=>(w.failures||[]).map(f=>({...f,name:w.name}))).sort((a,b)=>b.at.localeCompare(a.at)).slice(0,10);

  const iss=H.issues||[], ok=H.ok||[], f7=Object.entries(H.fails7d||{});
  return `<div class="grid"><div class="p c12"><h2>워크플로 실행 (최근 ${R.window_h||24}시간)<small>${esc(R.asof||'수집 전')} · 실행 ${tot.runs??'—'} · 성공 ${tot.success??'—'} · 실패 ${tot.failure??'—'} · 예약 ${tot.schedule??'—'} / 수동 ${tot.dispatch??'—'}</small></h2><div class="b">
    ${W.length?`<table><tr><th class="l">워크플로</th><th>실행</th><th>성공</th><th>실패</th><th>취소</th><th>예약/예정</th><th>수동</th><th>누락 추정</th><th>최대 지연</th><th>평균 지연</th><th class="l">마지막</th></tr>${wrows}</table>`:'<span class="mu">runs.json 없음 — ops 워크플로 실행 전</span>'}
    ${fl.length?`<div style="margin-top:8px"><b class="dn">최근 실패</b>${fl.map(f=>`<div style="font-size:var(--fs-1)"><a href="${esc(f.url||'#')}" target="_blank" class="dn">${esc(f.at)}</a> ${esc(f.name)} <span class="mu">${esc(f.event)} · ${esc(f.title||'')}</span></div>`).join('')}</div>`:''}
    <div class="mu" style="font-size:var(--fs-1);margin-top:6px;white-space:normal">${esc(R.note||'')}</div></div></div>
  <div class="p c6"><h2>백업 예약기 (GAS) 도착<small>${gs.slots?`${gs.arrived}/${gs.slots} 도착 · 최대 지연 ${gs.max_delay_min??'—'}분`:''}</small></h2><div class="b">
    ${G.length?`<table><tr><th class="l">슬롯 (KST)</th><th class="l">워크플로</th><th>dispatch</th><th>지연</th></tr>${grows}</table><div class="mu" style="font-size:var(--fs-1);margin-top:4px;white-space:normal">슬롯 후 30분 안에 같은 워크플로의 수동 실행이 생겼는지로 판정 (사람이 누른 수동 실행도 도착으로 셈).</div>`:'<span class="mu">최근 24시간 슬롯 없음</span>'}</div></div>
  <div class="p c6"><h2>자가점검<small>${esc(H.asof||'reports/health.json 없음')}</small></h2><div class="b">
    ${iss.length?iss.map(x=>`<div class="dn">✗ ${esc(typeof x==='string'?x:JSON.stringify(x))}</div>`).join(''):'<div class="up">이상 없음</div>'}
    ${ok.map(x=>`<div class="mu">✓ ${esc(x)}</div>`).join('')}

</style>
<script>
let MG=null, MGS='live', MGD='all', MGP=null, MGPOP=false;

  if(!open||view==='msg'){ if(w) w.remove(); MGPOP=false; const f=document.getElementById('mgfab'); if(f) f.classList.remove('on'); return; }

    w.innerHTML='<div class="mgph"><b>💬 사내톡</b><span class="mu" style="font-size:var(--fs-1)">끌어서 옮기기</span><button type="button" aria-label="닫기">×</button></div><div class="mgpb"></div>';
    document.body.appendChild(w); w.querySelector('.mgph button').onclick=()=>mgPop(false);
    const h=w.querySelector('.mgph'); h.onpointerdown=e=>{ if(e.target.closest('button')||innerWidth<=600) return; const r=w.getBoundingClientRect(), dx=e.clientX-r.left, dy=e.clientY-r.top;
      const mv=ev=>{ w.style.left=Math.max(0,Math.min(innerWidth-r.width,ev.clientX-dx))+'px'; w.style.top=Math.max(0,Math.min(innerHeight-60,ev.clientY-dy))+'px'; w.style.right='auto'; w.style.bottom='auto'; };
      const up=()=>{ removeEventListener('pointermove',mv); removeEventListener('pointerup',up); }; addEventListener('pointermove',mv); addEventListener('pointerup',up); }; }
  MGPOP=true; mgPopFill(); }
setTimeout(()=>{ if(document.getElementById('mgfab')) return; const b=document.createElement('button'); b.id='mgfab'; b.type='button'; b.title='사내톡'; b.setAttribute('aria-label','사내톡 열기'); b.textContent='💬';

const MG_NM={pb:'PB',quant:'퀀트',dev:'개발',data:'데이터',audit:'감사',hf:'HF',frm:'리스크',verify:'검증',macro:'매크로',bonds:'채권',derivs:'파생',uxui:'UXUI',edu:'교육',peer:'피어리뷰',ops:'운영',behavior:'행동',maint:'유지보수',cio:'CIO',pm:'PM',analyst:'애널',alloc:'자산배분',life:'LIFE',eval:'평가',backtest:'백테스트',health:'헬스',realestate:'부동산',scribe:'기록',household:'내무',compliance:'컴플라이언스',posrisk:'포지션리스크',front:'프론트','겸이':'겸이'};

/* 원본 보기(10/23 겸이 "한 번씩 더 누르면 원본, 크기 조절 가능하게") — 휠·핀치·두 번 탭(1x↔2.5x)·끌기·＋/－ */
function mgZoom(src){ if(!src) return; const o=document.createElement('div'); o.style.cssText='position:fixed;inset:0;background:#000;z-index:120;overflow:hidden;touch-action:none';
  o.innerHTML=`<img src="${src}" alt="" draggable="false" style="position:absolute;left:50%;top:50%;max-width:100vw;max-height:100vh;transform-origin:center;user-select:none;will-change:transform">
    <div style="position:absolute;right:8px;top:8px;display:flex;gap:6px">${['－','＋','×'].map(t=>`<button type="button" data-z="${t}" style="min-width:44px;min-height:44px;border:0;border-radius:50%;background:#0009;color:#fff;font-size:var(--fs-icon);cursor:pointer">${t}</button>`).join('')}</div>`;
  const im=o.querySelector('img'); let s=1,x=0,y=0; const P=new Map(); let d0=0,s0=1,lt=0;
  const ap=()=>{ im.style.transform=`translate(calc(-50% + ${x}px),calc(-50% + ${y}px)) scale(${s})`; }; ap();
  const zs=v=>{ s=Math.max(1,Math.min(6,v)); if(s===1){ x=0; y=0; } ap(); };
  o.querySelectorAll('[data-z]').forEach(b=>b.onclick=e=>{ e.stopPropagation(); const t=b.dataset.z; if(t==='×') o.remove(); else zs(s*(t==='＋'?1.5:1/1.5)); });
  o.addEventListener('wheel',e=>{ e.preventDefault(); zs(s*(e.deltaY<0?1.15:1/1.15)); },{passive:false});
  o.onpointerdown=e=>{ if(e.target.closest('[data-z]')) return; o.setPointerCapture(e.pointerId); P.set(e.pointerId,{x:e.clientX,y:e.clientY}); if(P.size===2){ const [a,b]=[...P.values()]; d0=Math.hypot(a.x-b.x,a.y-b.y); s0=s; }
    const now=Date.now(); if(P.size===1&&now-lt<300) zs(s>1?1:2.5); lt=now; };
  o.onpointermove=e=>{ const q=P.get(e.pointerId); if(!q) return; if(P.size===2){ P.set(e.pointerId,{x:e.clientX,y:e.clientY}); const [a,b]=[...P.values()]; zs(s0*Math.hypot(a.x-b.x,a.y-b.y)/(d0||1)); return; }
    if(s>1){ x+=e.clientX-q.x; y+=e.clientY-q.y; ap(); } P.set(e.pointerId,{x:e.clientX,y:e.clientY}); };
  o.onpointerup=o.onpointercancel=e=>{ P.delete(e.pointerId); };
  document.body.appendChild(o); }

function mgProfClose(o){ if(o._key) document.removeEventListener('keydown',o._key); o.remove(); }
function mgProfGo(o,k,d){ const L=((MG&&MG.profiles)||[]); if(L.length<2) return; const i=L.findIndex(p=>p.key===k), n=L[(i+d+L.length)%L.length]; mgProfClose(o); mgProf(n.key); }
/* 🏢 조직도(10/24 겸이 "조직도도 그려줘") — docs/desk_kb/ORG.md(10/17 본부 구조) 그대로. 본부 대표는 소집·취합만, 지시권 없음. 노드 누르면 프로필(문서 위임 클릭). */

/* 👥 프로필 — 카톡처럼 세로 전체 배경 + 아래쪽 프사·이름·상태메시지. 배경·프사를 한 번 더 누르면 원본(mgZoom).

function mgProf(k){ const P=((MG&&MG.profiles)||[]).find(p=>p.key===k); if(!P) return;
  const av=`${MG_IMG}${encodeURIComponent(k)}.png`, o=document.createElement('div'); let bgSrc='';

  /* 옆으로 넘기기(10/23 겸이 "프로필 창에서 옆으로 넘겨서 다른 누나들 볼 수 있게") — 폰: 좌우 스와이프 · PC: 양옆 ‹ › 버튼·←/→ 키 · 순서 = 프로필 목록(부서별) */

  setTimeout(()=>{ document.querySelectorAll('[data-mgs]').forEach(b=>b.onclick=()=>{ MGS=b.dataset.mgs; mgRe(); });

const PEERS={};
function peersLoad(mk,cb){ if(PEERS[mk]) return cb(PEERS[mk]); google.script.run.withSuccessHandler(t=>{try{PEERS[mk]=JSON.parse(t);}catch(e){PEERS[mk]={rows:[]};} cb(PEERS[mk]);}).withFailureHandler(()=>{PEERS[mk]={rows:[]};cb(PEERS[mk]);}).getPeers(mk); }
function rvFill(sym,mk){

function psarJS(ch,af0=0.02,afMax=0.2){ // 데이터에 PSAR 이 없을 때 화면에서 계산 (Wilder)
  const n=ch.length; if(n<3) return; let up=ch[1].c>=ch[0].c, af=af0, ep=up?ch[0].h:ch[0].l, ps=up?ch[0].l:ch[0].h;
  for(let i=1;i<n;i++){ ps=ps+af*(ep-ps);
    if(up){ ps=Math.min(ps,ch[i-1].l,i>1?ch[i-2].l:ch[i-1].l); if(ch[i].l<ps){ up=false; ps=ep; ep=ch[i].l; af=af0; } else if(ch[i].h>ep){ ep=ch[i].h; af=Math.min(af+af0,afMax); } }
    else { ps=Math.max(ps,ch[i-1].h,i>1?ch[i-2].h:ch[i-1].h); if(ch[i].h>ps){ up=true; ps=ep; ep=ch[i].h; af=af0; } else if(ch[i].l<ep){ ep=ch[i].l; af=Math.min(af+af0,afMax); } }
    if(ch[i].p==null) ch[i].p=Math.round(ps*100)/100; }

  study:[['edu','커리큘럼'],['apt','인적성'],['eng','오늘의 영어']]};
GROUPS.sys=[['sysb','작업 보드'],['msg','사내톡'],['sysc','변경 이력'],['syso','운영 상태']];   // SYSTEM 탭 (ops)
// QUANT 하위 화면 두 번째 줄 (UXUI·퀀트 10/21 연구 보드): 옛 화면 키 그대로 → setView('lab') 같은 기존 링크·사용 기록 유지
const SUBV={rb:[['rb','보드'],['study','검증 스터디'],['lab','전략 연구소']],sig:[['sig','시그널 검증'],['mom','모멘텀']],pf:[['pf','모의 포트폴리오'],['isa','ISA 실험실']]};

function groupOf(v){ v=SUBP[v]||v; for(const [g,a] of Object.entries(GROUPS)) if(a.some(x=>x[0]===v)) return g; return 'home'; }
function setView(v){ GRP=groupOf(v); LASTV[GRP]=v; view=v;
  document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x.dataset.g===GRP));

  st.innerHTML=sub.length>1?sub.map(([k,n])=>`<button data-v="${k}" class="${k===pv?'on':''}">${n}</button>`).join('')+(SUBV[pv]?`<div class="subt2">${SUBV[pv].map(([k,n])=>`<button data-v="${k}" class="${k===v?'on':''}">${n}</button>`).join('')}</div>`:''):'';

    if(!e.clientWidth||e.scrollWidth<=e.clientWidth+8||!/(auto|scroll)/.test(getComputedStyle(e).overflowX)) return;
    e.dataset.hm='1'; e.classList.add('hscr'); const m=document.createElement('div'); m.className='hmore'; m.textContent='→ 오른쪽에 열 더 있음 · 옆으로 밀기'; e.before(m);
    e.addEventListener('scroll',()=>m.classList.toggle('end',e.scrollLeft+e.clientWidth>=e.scrollWidth-4),{passive:true}); }); }
{ let hmT=null; const q=()=>{ clearTimeout(hmT); hmT=setTimeout(hMore,250); }; new MutationObserver(q).observe($('#root'),{childList:true,subtree:true}); addEventListener('resize',q); }

(function(){ const T=document.querySelector('.top'), B=$('#sqb'), tb=document.querySelector('.tabs'); if(!T||!B||!tb) return;

  const te=()=>T.classList.toggle('tend',tb.scrollLeft+tb.clientWidth>=tb.scrollWidth-2); tb.addEventListener('scroll',te,{passive:true}); addEventListener('resize',te); setTimeout(te,0); })();
/* 문장 속 링크·이모지 표시 (10/24 UXUI 재검수 req-dev-3d26f6e6·06b280d5) — 화면 파일 30개를 고치지 않고 그려진 DOM 에 붙인다(새 화면도 자동).
   ① 부모가 자기 글자를 가진 a(문장 속 링크) → class il(점선 밑줄). 칩·버튼형(.tag·.sbtn·inline-flex·block)은 제외.
   ② 보이는 글자 속 컬러 이모지 → <span class="xe">(엑셀 스킨에서만 회색; 기본 스킨은 모양 그대로). 머리(.top)는 UXUI 가 버튼째 회색 처리.
   새로 그려진 노드만 처리(MutationObserver) — 화면 전환당 수 ms. */
const DECO_EMO=/(\p{Extended_Pictographic}(?:\uFE0F|\u200D\p{Extended_Pictographic}|[\u{1F3FB}-\u{1F3FF}])*)/u;
function decoInline(root){ if(!root||root.nodeType!==1) return;
  root.querySelectorAll('a:not(.il)').forEach(a=>{ const p=a.parentElement; if(!p||a.closest('.top,.tabs,#xlrib')) return; const cs=getComputedStyle(a);
    if(a.classList.contains('tag')||a.classList.contains('sbtn')||/flex|block|grid/.test(cs.display)) return;
    if([...p.childNodes].some(n=>n.nodeType===3&&n.textContent.trim())) a.classList.add('il'); });
  const tw=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:n=>{ const e=n.parentElement; if(!e||e.closest('script,style,textarea,.xe,.top,canvas,svg')) return NodeFilter.FILTER_REJECT;
    return DECO_EMO.test(n.textContent)?NodeFilter.FILTER_ACCEPT:NodeFilter.FILTER_SKIP; }});
  const ns=[]; while(tw.nextNode()) ns.push(tw.currentNode);
  ns.forEach(n=>{ const f=document.createDocumentFragment(); n.textContent.split(DECO_EMO).forEach((t,i)=>{ if(!t) return; if(i%2){ const sp=document.createElement('span'); sp.className='xe'; sp.textContent=t; f.appendChild(sp); } else f.appendChild(document.createTextNode(t)); }); n.replaceWith(f); });
}
(function(){ let q=new Set(), on=false; const run=()=>{ on=false; const L=[...q]; q.clear(); L.forEach(n=>{ if(n.isConnected) decoInline(n); }); };
  new MutationObserver(ms=>{ for(const m of ms) for(const n of m.addedNodes){ if(n.nodeType===1) q.add(n); else if(n.nodeType===3&&n.parentElement) q.add(n.parentElement); }
    if(q.size&&!on){ on=true; requestAnimationFrame(run); } }).observe(document.body,{childList:true,subtree:true});
  decoInline(document.body); })();
load(); loadLive(); loadFresh(); setInterval(load, 5*60*1000); setInterval(loadLive, 60*1000); setInterval(loadFresh, 5*60*1000);

<script>
/* ───── 사용 기록 (나만 보는 로컬 집계) ─────
   이 브라우저 localStorage 에만 '일별 횟수'를 쌓는다. 외부 전송·분석 도구 없음.
   내보내기 = 비공개 저장소 이슈 폼을 미리 채워 여는 링크(쓰기 토큰 불필요) → 워크플로가 usage/*.csv 에 반영. */
(function(){
  const K='mt_usage_v1', KEEP=180, REPO='hk99915-bot/pb-private';
  const GRPS=['home','my','life','mkt','daily','res','quant','study','sys'];
  const EVS=['detail','panel','duel','study_chk','quiz','quiz_ok','export','eng_review','eng_review_ok','eng_quiz','eng_quiz_ok'];
  const ENGE=['eng_review','eng_review_ok','eng_quiz','eng_quiz_ok'];   // 영어 복습(단어)·독해(내용) 퀴즈 — quiz/quiz_ok 에도 합산, 첫 응답만(english-v2-ui)
  const kst=()=>new Date(Date.now()+9*3600e3);              // KST 기준 날짜·시각
  const dkey=()=>kst().toISOString().slice(0,10);
  const hr=()=>kst().getUTCHours()+kst().getUTCMinutes()/60;
  let S; try{ S=JSON.parse(localStorage.getItem(K)||'null'); }catch(e){ S=null; }
  if(!S||typeof S!=='object'||!S.d) S={v:1,d:{},x:null};
  if(!S.dev) S.dev=Math.random().toString(36).slice(2,6);   // 기기 구분용 임의 4자 (폰·PC 기록을 합칠 때 덮어쓰기 방지)
  const save=()=>{ const ks=Object.keys(S.d).sort(); ks.slice(0,Math.max(0,ks.length-KEEP)).forEach(k=>delete S.d[k]);
    try{ localStorage.setItem(K,JSON.stringify(S)); }catch(e){} };
  const day=()=>{ const k=dkey(); return S.d[k]||(S.d[k]={s:0,g:{},sv:{},e:{},mh:0,nt:0,t0:null,t1:null}); };
  const hm=()=>kst().toISOString().slice(11,16);
  function bump(kind,name){ try{ const D=day(), h=hr(); D.t0=D.t0||hm(); D.t1=hm();
      try{ D.st=Object.keys(JSON.parse(localStorage.getItem('mt_study_done')||'{}')).length; }catch(_){}   // 스터디 완료 모듈 수 스냅샷
      if(kind==='g'){ D.g[name]=(D.g[name]||0)+1; if(document.documentElement.classList.contains('xl')) D.xl=(D.xl||0)+1;   // 엑셀 스킨(사무실 모드) 상태에서 연 화면
        if(name==='mkt'||name==='home'){ if(h>=9&&h<15.5) D.mh++; if(h>=21||h<7) D.nt++; } }   // 장중(09–15:30)·미장 시간(21–07) 시세 화면 확인
      else if(kind==='sv') D.sv[name]=(D.sv[name]||0)+1;
      else D.e[name]=(D.e[name]||0)+1;
      save(); }catch(e){} }
  // 세션: 탭을 연 뒤 30분 넘게 비활성이었다가 돌아오면 새 세션
  let last=0; const touch=()=>{ const n=Date.now(); if(n-last>30*60e3){ try{ day().s++; save(); }catch(e){} } last=n; };
  touch(); document.addEventListener('visibilitychange',()=>{ if(!document.hidden) touch(); });
  // 화면 전환: 전역 setView 를 감싼다 (탭·하위 탭·코드에서 이동 모두 이 함수를 거침)
  const gOf=v=>{ let g=v; try{ if(typeof groupOf==='function') g=groupOf(v); }catch(e){} return g==='system'?'sys':g; };
  if(typeof window.setView==='function'){ const o=window.setView; let pg=null;
    window.setView=function(v){ const g=gOf(v); touch(); if(g!==pg) bump('g',GRPS.includes(g)?g:'other'); pg=g; bump('sv',v); return o.apply(this,arguments); };
    bump('g','home'); pg='home'; }
  // 행동 이벤트(위임): 종목 상세·패널 펼침·대결 제출·스터디 체크·퀴즈
  let lastSum=null;
  document.addEventListener('click',e=>{ const t=e.target; if(!t||!t.closest) return; touch(); const sm=t.closest('summary'); lastSum=sm?sm.parentElement:null;
    if(t.closest('.sym,[data-sym]')) bump('e','detail');
    const a=t.closest('a[href*="/issues/new"]'); if(a&&/title=(pick|exit|ticket)/i.test(a.href)) bump('e','duel');
    if(t.closest('#exgo')) bump('e','duel');
    const ch=t.closest('[data-ch]'); if(ch&&!ch.disabled){ const k=ch.dataset.ch, kd=ch.dataset.kind; bump('e','quiz'); if(kd) bump('e','eng_'+kd);
      setTimeout(()=>{ const r=document.querySelector(`[data-res="${CSS.escape(k)}"]`); if(r&&/정답/.test(r.textContent)){ bump('e','quiz_ok'); if(kd) bump('e','eng_'+kd+'_ok'); } },0); }
  },true);
  document.addEventListener('toggle',e=>{ const d=e.target; if(d&&d.tagName==='DETAILS'&&d.open&&d===lastSum&&d.id!=='usagebox') bump('e','panel'); },true);
  document.addEventListener('change',e=>{ const c=e.target; if(c&&c.matches&&c.matches('[data-mchk]')&&c.checked) bump('e','study_chk'); },true);

  // ── 내보내기: 최근 7일(또는 마지막 내보내기 이후) 일별 CSV → 비공개 이슈 폼 ──
  const HDR=['date','dev','sessions','first','last',...GRPS,'other','mkt_open_hours','night','detail','panel','duel','study_chk','quiz','quiz_ok','study_total','xl','top_sub',...ENGE];
  function rows(n){ const ks=Object.keys(S.d).sort().slice(-n);
    return ks.map(k=>{ const D=S.d[k], top=Object.entries(D.sv||{}).sort((a,b)=>b[1]-a[1]).slice(0,4).map(([a,b])=>a+':'+b).join(';');
      return [k,S.dev,D.s||0,D.t0||'',D.t1||'',...GRPS.map(g=>(D.g||{})[g]||0),(D.g||{}).other||0,D.mh||0,D.nt||0,
        ...['detail','panel','duel','study_chk','quiz','quiz_ok'].map(x=>(D.e||{})[x]||0),D.st||0,D.xl||0,top,...ENGE.map(x=>(D.e||{})[x]||0)].join(','); }); }
  function exportUrl(n){ const isoW=(()=>{ const d=kst(); d.setUTCHours(0,0,0,0); const w=(d.getUTCDay()+6)%7; d.setUTCDate(d.getUTCDate()-w+3);
      const y=d.getUTCFullYear(), f=new Date(Date.UTC(y,0,4)); return y+'-W'+String(1+Math.round(((d-f)/864e5-3+((f.getUTCDay()+6)%7))/7)).padStart(2,'0'); })();
    const csv=[HDR.join(','),...rows(n)].join('\n');
    return `https://github.com/${REPO}/issues/new?template=usage.yml&title=${encodeURIComponent('usage '+isoW)}&data=${encodeURIComponent(csv)}`; }
  function summary(){ const ks=Object.keys(S.d).sort(), last7=ks.filter(k=>k>=new Date(Date.now()+9*3600e3-6*864e5).toISOString().slice(0,10));
    const sum=(f)=>last7.reduce((a,k)=>a+f(S.d[k]),0);
    const g=GRPS.map(x=>[x,sum(D=>(D.g||{})[x]||0)]).filter(x=>x[1]).sort((a,b)=>b[1]-a[1]);
    return {days:last7.length, all:ks.length, ses:sum(D=>D.s||0), g, mh:sum(D=>D.mh||0), duel:sum(D=>(D.e||{}).duel||0), chk:sum(D=>(D.e||{}).study_chk||0), quiz:sum(D=>(D.e||{}).quiz||0), eng:ENGE.map(x=>sum(D=>(D.e||{})[x]||0)), x:S.x}; }
  function box(){ const s=summary();
    return `<details class="p c12" id="usagebox" style="margin-top:10px"><summary style="cursor:pointer;padding:6px 10px"><b>사용 기록</b> <span class="mu" style="font-size:var(--fs-1)">최근 7일 ${s.days}일 접속 · 세션 ${s.ses} · 이 브라우저에만 저장</span></summary>
     <div class="b" style="font-size:var(--fs-2);line-height:1.7;white-space:normal">
      <div>탭별 열람(7일): ${s.g.map(([k,v])=>`<span style="margin-right:8px">${k.toUpperCase()} <b>${v}</b></span>`).join('')||'<span class="mu">아직 없음</span>'}</div>
      <div>장중 시세 확인 <b>${s.mh}</b> · 대결 제출 클릭 <b>${s.duel}</b> · 스터디 체크 <b>${s.chk}</b> · 퀴즈 <b>${s.quiz}</b> <span class="mu">(영어 단어 ${s.eng[1]}/${s.eng[0]} · 내용 ${s.eng[3]}/${s.eng[2]})</span></div>
      <div class="mu">기록 일수 ${s.all}일 · 마지막 내보내기 ${s.x||'없음'}</div>
      <div style="margin-top:6px"><button class="sbtn" id="usgexp">사용 기록 내보내기 (최근 7일 → 비공개 이슈)</button> <button class="sbtn" id="usgexp28">28일</button> <button class="sbtn" id="usgclr" style="margin-left:8px">기록 지우기</button></div>
      <div class="mu" style="font-size:var(--fs-1)">버튼을 누르면 비공개 저장소 이슈 폼이 채워진 채 열린다 → '제출'하면 usage/daily.csv·weekly.csv 에 반영. 주 1회(일요일 주간 리뷰 때) 권장.</div>
     </div></details>`; }
  function inject(){ try{ if(typeof view==='undefined'||(view!=='my'&&view!=='syso')) return; const r=document.getElementById('root'); if(!r||document.getElementById('usagebox')) return;
      r.insertAdjacentHTML('beforeend',box());
      const go=n=>{ S.x=dkey(); bump('e','export'); window.open(exportUrl(n),'_blank'); };
      document.getElementById('usgexp').onclick=()=>go(7); document.getElementById('usgexp28').onclick=()=>go(28);
      document.getElementById('usgclr').onclick=()=>{ if(confirm('이 브라우저의 사용 기록을 지울까요?')){ S={v:1,d:{},x:null,dev:S.dev}; save(); const b=document.getElementById('usagebox'); if(b) b.remove(); inject(); } };
    }catch(e){} }
  const root=document.getElementById('root'); if(root) new MutationObserver(()=>{ if(!document.getElementById('usagebox')) inject(); }).observe(root,{childList:true});
  window.mtUsage={dump:()=>JSON.parse(JSON.stringify(S)), csv:n=>[HDR.join(','),...rows(n||7)].join('\n')};
})();
</script>
