}
/* 예전 형식(v1) 운용회의 — 지난 회의 기록(bottom_line 없음)을 열 때 */
function cmtLegacyHtml(o){
  const col=x=>x==null?'var(--muted)':x>0.15?'var(--up)':x<-0.15?'var(--dn)':'var(--amber)', sg=x=>x==null?'—':(x>0?'+':'')+x.toFixed(2);
  const sc=o.scenarios.map(s=>`<div style="flex:1;min-width:220px;border:1px solid var(--line);padding:8px 10px;line-height:1.6;white-space:normal">
     <div style="display:flex;justify-content:space-between"><b>${esc(s.name)}</b><b class="am" style="font-size:16px">${Math.round((s.prob||0)*100)}%</b></div>
     <div class="mu" style="font-size:11px">${esc(s.def)}</div><div style="font-size:12px;margin-top:4px"><span class="am">전환 신호</span> ${esc(s.trigger)}</div><div style="font-size:12px"><span class="am">행동</span> ${esc(s.action)}</div></div>`).join('');
  const idea=(a,t)=>a.length?`<table><tr><th class="l">${t}</th><th class="l">테마</th><th>드라이버</th><th>정상화 괴리</th><th>20D</th><th>PBR</th></tr>${a.map(x=>`<tr><td class="l am sym" data-sym="${esc(x.s)}" data-mk="KR">${esc(x.n)}${x.semi?' <span class="tag">반도체</span>':''}</td><td class="l mu">${esc(x.g)}</td><td style="color:${col(x.drv)}">${sg(x.drv)}</td><td>${pct(x.nor,0)}</td><td>${pct(x.r20,0)}</td><td class="mu">${x.pbr??'—'}</td></tr>`).join('')}</table>`:'<div class="mu">해당 없음</div>';
  const tr=(o.track||{}).summary||{};
  return `<div class="grid">
   <div class="p c12"><h2>운용회의 · 국장${o.session?' · '+esc(o.session):''}<small>${esc(o.asof)} · 규칙 기반 · 검증 중</small></h2><div class="b" style="line-height:1.8;white-space:normal">${(o.head||[]).map(x=>'<div>• '+esc(x)+'</div>').join('')}<div style="margin-top:6px;border:1px solid var(--amber);padding:6px 10px"><b class="am">결론</b> ${esc(o.verdict)}</div></div></div>
   <div class="p c12"><h2>운용 시나리오<small>확률 = 1999~ 코스피 비슷한 상황 이후 20거래일 결과 분포 (${esc((o.scenario_basis||{}).basis||'')}, ${(o.scenario_basis||{}).n||0}회)</small></h2><div class="b"><div style="display:flex;gap:8px;flex-wrap:wrap">${sc}</div></div></div>
   ${o.stance?`<div class="p c12"><h2>PB 판단 · ${esc(o.stance.stance)}<small>확률 = 방향, 신호 = 타이밍 — 왜 이렇게 결정했나</small></h2><div class="b" style="line-height:1.7;white-space:normal"><div style="border:1px solid ${o.stance.stance==='관망'?'var(--amber)':o.stance.stance==='방어'?'var(--dn)':'var(--up)'};padding:6px 10px;margin-bottom:8px"><b class="am">${esc(o.stance.stance)}</b> ${esc(o.stance.plan)}</div>${o.stance.basis?`<div style="font-size:12px;border-left:2px solid var(--amber);padding-left:8px;margin-bottom:8px"><b class="am">판단 시점 ${esc(String(o.stance.basis.at).slice(5))}</b> <span class="mu">${esc(o.stance.basis.src)} — 이 숫자를 보고 결정했어요. 아래 근거 숫자는 회의 생성 시각(${esc(o.asof)}) 기준</span>${o.stance.basis.lines.map(x=>'<div>· '+esc(x)+'</div>').join('')}</div>`:''}${o.stance.reasons.map((r,i)=>`<div style="margin:4px 0"><b>${i+1}. ${esc(r.t)}</b><div class="mu" style="font-size:12px">${esc(r.d)}</div></div>`).join('')}</div></div>${o.stance.exec?execHtml(o.stance.exec):''}`:''}
   ${o.derivs?derivPanel(o.derivs):''}
   <div class="p c6"><h2>업종 의견<small>공급망 체인 점수</small></h2><div class="b"><table>${(o.sectors||[]).map(r=>`<tr><td class="l">${esc(r.chain)}</td><td style="color:${col(r.score)}">${sg(r.score)}</td><td class="l ${r.stance==='비중 확대'?'up':r.stance==='비중 축소'?'dn':'mu'}">${r.stance}</td></tr>`).join('')}</table></div></div>
   <div class="p c6"><h2>테마 온도<small>드라이버 평균 상·하위 · 시총 가중 수익률</small></h2><div class="b"><table><tr><th class="l">테마</th><th>드라이버</th><th>5D</th><th>20D</th></tr>${(o.themes||[]).map(t=>`<tr><td class="l">${esc(t.theme)}</td><td style="color:${col(t.drv)}">${sg(t.drv)}</td><td>${pct(t.r5,1)}</td><td>${pct(t.r20,1)}</td></tr>`).join('')}</table></div></div>
   <div class="p c6"><h2>매수 후보<small>검증 전 후보 · 이익 신호 강함 + 평균 이익 기준 저평가 + 20일 −10% 이상 하락</small></h2><div class="b">${idea((o.ideas||{}).long||[],'종목')}</div></div>
   <div class="p c6"><h2>회피<small>검증 전 후보 · 이익 신호 꺾임 + 평균 이익 기준 고평가</small></h2><div class="b">${idea((o.ideas||{}).avoid||[],'종목')}</div></div>
   ${(o.squeeze||[]).length?`<div class="p c12"><h2>숏스퀴즈 후보<small>공매도 잔고 1% 이상 + 이익 드라이버 양호 · 반등 시 되사기 압력</small></h2><div class="b"><table><tr><th class="l">종목</th><th class="l">테마</th><th>잔고 비중</th><th>20일 변화</th><th>드라이버</th><th>20D</th></tr>${o.squeeze.map(x=>`<tr><td class="l am sym" data-sym="${esc(x.s)}" data-mk="KR">${esc(x.n)}</td><td class="l mu">${esc(x.g)}</td><td>${x.ratio.toFixed(2)}%</td><td>${x.chg20!=null?(x.chg20>0?'+':'')+x.chg20.toFixed(2)+'%p':'—'}</td><td style="color:${col(x.drv)}">${sg(x.drv)}</td><td>${pct(x.r20,0)}</td></tr>`).join('')}</table><div class="mu" style="font-size:11px;margin-top:4px">숏스퀴즈는 반등의 방아쇠가 있어야 일어남. 잔고가 많다는 건 하락 베팅이 강하다는 뜻이기도 함.</div></div></div>`:''}
   <div class="p c12"><h2>이번 주 이벤트 · 검증 현황</h2><div class="b" style="line-height:1.8;white-space:normal">
     ${(o.events||[]).map(e=>`<div>${esc(e.date.slice(5))} ${e.imp>=3?'⭐':''} ${esc(e.name)} <span class="mu" style="font-size:11px">${esc(e.note||'')}</span></div>`).join('')||'<div class="mu">7일 내 주요 이벤트 없음</div>'}
     <div style="margin-top:6px" class="mu">시그널 판정: ${Object.entries(o.validation||{}).map(([k,v])=>`${esc(k)} ${esc(v||'')}`).join(' · ')||'—'}</div>
     <div class="mu">회의 성적: ${tr.h5?`매수 후보 5일 초과수익 평균 ${pct(tr.h5.long_avg,1)} (적중 ${Math.round(tr.h5.long_hit*100)}%, ${tr.h5.n}회)`:'기록 시작 — 5거래일 뒤부터 채점'}${tr.brier?` · 시나리오 브라이어 ${tr.brier.avg} (무작위 0.667, 낮을수록 좋음)`:''}</div></div></div>
  </div>`;
}
/* ───── 운용회의 v2 — 멀티매니저 모닝 미팅: 결론 → 탑다운 → 포지셔닝 → 섹터 → 종목 → 아이디어 → 헤지 → 프리모템 → 성적 ───── */
function cmtSec(no,title,sub,body,open){

function cmtList(a,cls){ return (a||[]).length?(a||[]).map(x=>`<div class="${cls||''}">• ${esc(x)}</div>`).join(''):''; }
function cmtTbl(head,rows){ return `<div style="overflow-x:auto"><table><tr>${head.map((h,i)=>`<th class="${i===0?'l':''}">${h}</th>`).join('')}</tr>${rows.join('')}</table></div>`; }
function cmtSrcHtml(a){ const g=x=>x==='검증전'?'검증 전':x;

    <div class="b" style="line-height:1.75;white-space:normal;font-size:13px">${(bl.lines||[]).map((x,i)=>`<div style="margin:2px 0"><b style="color:${c}">${'①②③'[i]||'·'}</b> ${esc(x)}</div>`).join('')}</div></div>`; }

/* 기명 점도표 띠 — reports/dotplot.json: 자산마다 데스크 머리글자를 판정 색(매수 초록·중립 회색·매도 빨강)으로. 지수·업종 수준 판단만 */
function dotStripHtml(){
  if(DOT===null){ DOT=false; google.script.run.withSuccessHandler(t=>{try{DOT=JSON.parse(t);}catch(e){DOT={};} if(view==='cmt') render();}).withFailureHandler(()=>{DOT={}; if(view==='cmt') render();}).getDotplot(); return ''; }
  const d=DOT; if(!d||!d.assets) return '';

   <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px">${who.map(w=>{const t=T[w]||{win:0,n:0,pnl:0}; return `<div style="flex:1;min-width:140px;border:1px solid var(--line);padding:6px 10px"><div class="mu" style="font-size:11px">${esc(w)}</div><b>${t.win}승 / ${t.n}전</b> · 누적 <span class="${t.pnl>=0?'up':'dn'}">${t.pnl>=0?'+':''}${K(t.pnl)}원</span>${statLine(t)}</div>`;}).join('')}</div>
   ${DEC.tally_by_market?['KR','US'].map(m=>{const TM=DEC.tally_by_market[m]||{}; return `<div style="font-size:11.5px;margin-bottom:2px"><span class="mu" style="display:inline-block;width:34px">${m==='US'?'미장':'국장'}</span>${who.map(w=>{const t=TM[w]||{win:0,n:0,pnl:0}; return `<span style="margin-right:12px"><span class="mu">${esc(w)}</span> ${t.win}/${t.n} <span class="${t.pnl>=0?'up':'dn'}">${t.pnl>=0?'+':''}${K(t.pnl)}</span></span>`;}).join('')}</div>`;}).join(''):''}
   ${ticketBox(DEC,IU)}
   ${[...DEC.items].filter(it=>it.kind!=='ticket').reverse().map(it=>{const r=it.result; return `<div style="border-top:1px solid var(--line);padding:8px 0;line-height:1.6;white-space:normal">

      <div class="mu" style="font-size:11.5px">${esc(it.note||'')}</div>

      ${it.pb_view?`<div style="font-size:12px;border-left:2px solid #c77dff;padding-left:6px;margin-top:3px"><b style="color:#c77dff">PB 판단 ${esc(it.pb_view.at||'')}</b>${it.pb_view.conviction?` <span class="mu">확신 ${esc(it.pb_view.conviction)}</span>`:''}<div>${esc(it.pb_view.why||'')}</div>${planHtml(it.pb_view.plan)}${it.pb_view.real?`<div style="font-size:12px">💼 실전 적용: <b>${it.pb_view.real.ok?'가능':'규칙상 비추천'}</b>${it.pb_view.real.size_pct!=null?` · 총자산의 ${(it.pb_view.real.size_pct*100).toFixed(0)}% 이내`:''}${it.pb_view.real.note?' — '+esc(it.pb_view.real.note):''}</div>`:''}${it.pb_view.bold?`<div style="font-size:12px">🔥 <b>공격 PB</b> <span class="mu">(모의 전용)</span> ${esc(it.pb_view.bold.why||'')}</div>${planHtml(it.pb_view.bold.plan)}`:''}${(it.pb_view.lines||[]).map(x=>'<div class="mu">· '+esc(x)+'</div>').join('')}</div>`:''}
      <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:4px">${Object.keys(it.picks).map(w=>`<div style="flex:1;min-width:140px;border:1px solid #1e1e1e;padding:4px 8px"><span class="mu" style="font-size:11px">${esc(w)}</span><div style="font-size:12.5px">${pk(it.picks[w],it)}</div>${r&&r[w]?`<div class="${r[w].pnl>=0?'up':'dn'}" style="font-size:12px">${r[w].pnl>=0?'+':''}${K(r[w].pnl)}원 (${pct(r[w].ret,1)})</div><div class="mu" style="font-size:10.5px">${esc(r[w].detail||'')}</div>`:''}</div>`).join('')}</div></div>`;}).join('')}
   <div style="border-top:1px solid var(--line);margin-top:8px;padding-top:8px;font-size:12.5px;line-height:1.8;white-space:normal"><b class="am">매도 타점 대결 열기</b> <span class="mu" style="font-size:11px">팔까(손절·익절) 말까 — PB가 규칙으로 판정, 5거래일 뒤 종가로 채점</span><br>
     <input id="excode" placeholder="종목코드 (예: 000660)" style="width:150px;background:#050505;color:var(--txt);border:1px solid var(--line);font:inherit;padding:3px 6px">

     <button id="exgo" class="sbtn">제출 (깃허브 이슈)</button>

   <div class="mu" style="font-size:11px;margin-top:4px">모의 기록 포함 · 한 판은 운, 20판 이상 쌓여야 실력</div></div></div>`;

<!-- tab_mkt_deriv.html — MARKET › 파생 — derivs.json·deriv/daily.csv·파생 시그널 스터디 (derivView·drawDerivHist).
     apps-script/Index.html 이 include('tab_mkt_deriv') 템플릿 태그로 끼워 넣는다 (GAS 는 HtmlService include, Pages 는 scripts/build_pages.py 가 인라인).
     전역 도우미($·esc·num·pct·render·setView·openDetail 등)는 Index.html 에 있다. -->
<script>
/* ───── 파생(DERIV) 화면: 흩어진 파생 정보 모음 — reports/derivs.json · data/deriv/daily.csv · reports/studies/derivs_signals.json · live.json K200F (새 수집 없음) ───── */
const DVX={d:null,h:null,s:null,g:null}; let DVCH=[];
function dvLoad(k,fn,parse){ if(DVX[k]!==null) return; DVX[k]=false; const r=google.script.run;
  if(typeof r[fn]!=='function'){ DVX[k]={}; return; }
  r.withSuccessHandler(t=>{ try{ DVX[k]=parse?parse(t):(typeof t==='string'?JSON.parse(t):(t||{})); }catch(e){ DVX[k]={}; } if(view==='deriv') render(); })
   .withFailureHandler(()=>{ DVX[k]={}; if(view==='deriv') render(); })[fn](); }
function dvCsv(t){ const L=String(t||'').trim().split(/\r?\n/); if(L.length<2) return {rows:[]}; const H=L[0].split(',');
  const rows=L.slice(1).map(l=>{ const a=l.split(','), o={}; H.forEach((h,i)=>{ const v=a[i]; o[h]=(v===''||v==null)?null:(h==='date'||h==='fut_name'||h==='night_src'||h==='opt_front'?v:(isNaN(+v)?v:+v)); }); return o; });
  return {rows}; }
// 검증 등급 배지: A/B 초록 · C 노랑 · F 빨강 · 검증전/참고 회색
function dvB(g){ g=g||'참고'; const c=(g==='A'||g==='B')?'tag g':g==='F'?'tag r':g==='C'?'tag':'tag mu';
  return `<span class="${c}" style="${c==='tag mu'?'color:var(--muted);border-color:var(--line)':''}" title="검증 등급 (reports/studies/derivs_signals.json)">${g==='참고'?'참고':'등급 '+esc(g)}</span>`; }
function dvGrade(lens){ const S=(DVX.s&&DVX.s.signals)||[]; const a=S.filter(x=>x.lens_id===lens).map(x=>x.grade); if(!a.length) return '참고';
  const rk=['A','B','C','F','검증전']; return a.sort((x,y)=>rk.indexOf(x)-rk.indexOf(y))[0]; }
function derivView(){
  dvLoad('d','getDerivs'); dvLoad('s','getDerivSignals'); dvLoad('h','getDerivHist',dvCsv); dvLoad('g','getGammaStudy');
  if(DVX.d===false&&DVX.h===false) return '<div class="load">LOADING …</div>';
  const d=DVX.d||{}, R=(DVX.h&&DVX.h.rows)||[], S=DVX.s||{};
  const lv=((L&&L.items)||[]).find(x=>x.key==='K200F')||null;
  const last=k=>{ for(let i=R.length-1;i>=0;i--) if(R[i][k]!=null) return R[i]; return null; };
  const f=(v,dg=2)=>v==null||isNaN(v)?'—':Number(v).toLocaleString('ko-KR',{minimumFractionDigits:dg,maximumFractionDigits:dg});
  const sg=(v,dg=2)=>v==null?'—':(v>0?'+':'')+f(v,dg);
  const fu=d.fut||{}, ff=last('fut_frgn'), nt=last('night_vwap'), bt=last('basis_theo');
  const card=(t,v,sub,g)=>`<div style="flex:1;min-width:150px;border:1px solid var(--line);padding:6px 10px;line-height:1.5"><div class="mu" style="font-size:11px">${t} ${dvB(g)}</div><div style="font-size:18px"><b>${v}</b></div><div class="mu" style="font-size:11px;white-space:normal">${sub||''}</div></div>`;
  const lb=lv&&lv.basis!=null?lv.basis:fu.basis;
  const cards=[
    card('코스피200 현물',f(lv&&lv.spot!=null?lv.spot:(fu.spot??d.spot)),lv?`실시간(${esc(lv.src||'')}) · ${esc(lv.status||'')}`:`KRX ${esc(d.date||'')} 종가`,'참고'),
    card('코스피200 선물',f(lv?lv.last:fu.close),lv?`${pct(lv.chg,2)} · ${esc(fu.name||'')}`:esc(fu.name||''),'참고'),
    card('베이시스 (선물−현물)',sg(lb),`${lb==null?'':lb>=0?'선물이 비쌈(콘탱고)':'선물이 쌈(백워데이션)'}${bt&&bt.basis_theo!=null?` · 이론값 ${f(bt.basis_theo)}`:''}`,dvGrade('fut_basis')),
    card('최근월 옵션 만기',d.expiry?esc(d.expiry.slice(5))+` <span class="am">D-${d.dte??'?'}</span>`:'—',`${esc(d.front||'')} 물 · 만기일엔 흔들림이 커질 수 있음`,'참고'),
    card('외국인 선물 순매수',ff?sg(ff.fut_frgn,0)+'<span class="mu" style="font-size:11px"> 계약</span>':'—',ff?`${esc(ff.date)} · 기관 ${sg(ff.fut_inst,0)} · 개인 ${sg(ff.fut_indiv,0)}`:'적재 전',dvGrade('fut_foreign_flow')),
    card('야간선물 (KRX 평균가)',nt?f(nt.night_vwap):'—',nt?`${esc(nt.date)} 세션 · 거래 ${num(nt.night_vol)}계약 · 다음날 시가 갭 예상용`:'데이터 없음',dvGrade('night_futures'))
  ].join('');
  const sum=`<div class="p c12"><h2>파생 · 오늘 요약<small>코스피200 선물·옵션 · ${esc(d.asof||d.date||'')}</small></h2><div class="b" style="white-space:normal">
    <div class="mu" style="font-size:12px;margin-bottom:6px">선물·옵션은 '시장이 어디에 돈을 걸었나'를 보여주는 위치 정보야. 아래 숫자는 모두 <b>방향 신호로 검증되지 않았어</b> — 흔들림·위치 참고만.</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">${cards}</div>
    <div style="margin-top:8px"><button class="sbtn" id="dvA8">📘 A8 선물·옵션 읽는 법 (스터디)</button> <span class="mu" style="font-size:11px">처음이면 이것부터 — 베이시스·PCR·벽·감마·야간선물·만기일</span></div></div></div>`;
  // 2) 옵션 포지션 — 운용회의 패널 재사용(derivPanel), 제목에 등급 배지 + 한 줄 해설만 덧붙임
  let op='';
  if(d&&d.oi_profile){ op=derivPanel(d)
    .replace('<h2>',`<h2>${dvB(dvGrade('options_pcr'))} `)
    .replace('<div class="b" style="white-space:normal">',`<div class="b" style="white-space:normal"><div class="mu" style="font-size:12px;margin-bottom:6px">풋/콜 비율(PCR)·벽·최대고통·감마·IV는 옵션 시장의 '쏠림'이야. PCR ${dvB(dvGrade('options_pcr'))} · 감마 ${dvB(dvGrade('options_gamma'))} · 벽·최대고통·IV ${dvB('참고')} — 방향 예측용이 아님.</div>`); }
  else op='<div class="p c12"><div class="b mu">옵션 포지션(reports/derivs.json) 불러오기 전</div></div>';
  // 3) 일별 이력 차트
  const ser=(k)=>R.filter(r=>r[k]!=null).length;
  const hc=(id,t,g,desc)=>`<div class="p c6"><h2>${t} ${dvB(g)}<small id="${id}l"></small></h2><div class="b" style="white-space:normal"><div class="mu" style="font-size:11px;margin-bottom:4px">${desc}</div><div id="${id}" style="height:200px"></div></div></div>`;
  const nff=ser('fut_frgn');
  const hist=R.length?`<div class="p c12"><h2>일별 이력<small>data/deriv/daily.csv · ${esc(R[0].date)}~${esc(R[R.length-1].date)} · 옵션·선물 열은 2025-08-29~</small></h2><div class="b mu" style="font-size:12px;white-space:normal">하루 한 번 쌓이는 기록. 선이 한쪽으로 쏠린 정도를 보는 용도 — 꺾였다고 사고팔 근거가 되진 않아(아래 검증 현황 참고).</div></div>
    ${hc('dvc1','베이시스',dvGrade('fut_basis'),'선물−현물(포인트). 0 아래 = 선물이 쌈 → 헤지·공포가 많을 때 자주 나옴. 점선 = 금리·배당으로 계산한 이론값.')}
    ${hc('dvc2','풋/콜 비율 (PCR)',dvGrade('options_pcr'),'1보다 크면 풋(하락 대비 보험)이 콜보다 많음. OI = 쌓인 계약, 거래량 = 그날 거래.')}
    ${hc('dvc3','감마 노출 · 억원/1%',dvGrade('options_gamma'),'음수 = 시장이 흔들릴 때 헤지 매매가 흔들림을 키우는 쪽(근사·가정 있음). 방향이 아니라 흔들림 크기 참고.'+((DVX.g&&DVX.g.ui_line)?`<br><span title="${esc(DVX.g.summary_ko||'')}">${esc(DVX.g.ui_line)} · reports/studies/gamma_regime.json</span>`:''))}
    ${hc('dvc4','외국인 선물 순매수 · 계약',dvGrade('fut_foreign_flow'),nff>=2?'막대 위 = 순매수, 아래 = 순매도.':`적재 시작 직후라 ${nff}일치뿐 — 쌓이면 막대로 표시. 과거 조회 소스 없음.`)}`:'<div class="p c12"><div class="b mu">일별 이력(data/deriv/daily.csv) 불러오기 전</div></div>';

    <div style="border:1px solid var(--dn);padding:6px 10px;margin-bottom:8px;font-size:12px">⚠ <b>방향 신호로 쓰지 말 것.</b> 아래 가설은 대부분 '검증 전'(표본 부족) 또는 'F'(효과 없음)야. A 등급인 야간선물도 '다음날 시초가 예상' 산수 확인일 뿐 매매 신호가 아니야.</div>
    <div style="overflow-x:auto"><table><tr><th class="l">ID</th><th class="l">가설</th><th>등급</th><th>표본</th><th>p(IS)</th><th>p(OOS)</th><th class="l">메모</th></tr>

  return `<div class="grid">${sum}${op}${hist}${vt}</div>`;
}
function dvGoA8(){ setView('edu'); let n=0; const t=setInterval(()=>{ const m=document.getElementById('mod-A8'); if(m){ clearInterval(t); m.open=true; m.scrollIntoView({behavior:'smooth',block:'start'}); } else if(++n>50) clearInterval(t); },100); }
function drawDerivHist(){
  DVCH.forEach(c=>{try{c.remove();}catch(e){}}); DVCH=[];
  const R=(DVX.h&&DVX.h.rows)||[]; if(!R.length||!$('#dvc1')) return;
  if(!window.LightweightCharts){ ['dvc1','dvc2','dvc3','dvc4'].forEach(i=>{const e=$('#'+i); if(e) e.innerHTML='<div class="mu">차트 라이브러리 없음</div>';}); return; }
  const cs=getComputedStyle(document.documentElement), cv=n=>(cs.getPropertyValue(n)||'').trim()||'#888';
  const mk=(id,fmt)=>{ const el=$('#'+id); if(!el) return null; const c=LightweightCharts.createChart(el,{width:el.clientWidth,height:200,layout:{background:{type:'solid',color:cv('--panel')},textColor:cv('--muted'),fontSize:11},
    grid:{vertLines:{color:cv('--line')},horzLines:{color:cv('--line')}},rightPriceScale:{borderColor:cv('--line')},timeScale:{borderColor:cv('--line')},crosshair:{mode:0},handleScroll:{vertTouchDrag:false},
    localization:{locale:'ko-KR',priceFormatter:fmt}}); DVCH.push(c); return c; };
  const from='2025-08-29', Rr=R.filter(r=>r.date>=from);
  const pts=(k,rows)=>(rows||Rr).filter(r=>r[k]!=null&&!isNaN(r[k])).map(r=>({time:r.date,value:+r[k]}));
  const line=(c,k,col,w,st)=>{ const d=pts(k); if(!d.length) return null; const s=c.addLineSeries({color:cv(col),lineWidth:w||2,lineStyle:st||0,priceLineVisible:false,lastValueVisible:true}); s.setData(d); return d; };
  const zero=(s)=>s&&s.createPriceLine({price:0,color:cv('--muted'),lineWidth:1,lineStyle:2,axisLabelVisible:false,title:''});
  const leg=(id,a)=>{ const e=$('#'+id+'l'); if(e) e.innerHTML=a.filter(Boolean).join(' &nbsp; '); };
  const lastv=(d,dg)=>d&&d.length?d[d.length-1].value.toFixed(dg):'—';
  // 1 베이시스
  const c1=mk('dvc1',v=>v.toFixed(1)); if(c1){ const b=line(c1,'basis','--amber',2), t=line(c1,'basis_theo','--muted',1,2);
    const s0=c1.addLineSeries({color:'rgba(0,0,0,0)',lineWidth:1,priceLineVisible:false,lastValueVisible:false}); if(b) { s0.setData(b.map(x=>({time:x.time,value:0}))); zero(s0); }
    leg('dvc1',[`<span style="color:var(--amber)">━ 실제 ${lastv(b,2)}</span>`,`<span class="mu">┅ 이론 ${lastv(t,2)}</span>`]); c1.timeScale().fitContent(); }
  // 2 PCR
  const c2=mk('dvc2',v=>v.toFixed(2)); if(c2){ const a=line(c2,'pcr_oi','--amber',2), v=line(c2,'pcr_vol','--blue',1.5);
    leg('dvc2',[`<span style="color:var(--amber)">━ OI ${lastv(a,2)}</span>`,`<span style="color:var(--blue)">━ 거래량 ${lastv(v,2)}</span>`]); c2.timeScale().fitContent(); }
  // 3 감마 (0 기준 위/아래 색)
  const c3=mk('dvc3',v=>v.toFixed(0)); if(c3){ const d=pts('gex_bn'); if(d.length){
    const s=c3.addBaselineSeries({baseValue:{type:'price',price:0},topLineColor:cv('--up'),bottomLineColor:cv('--dn'),topFillColor1:'rgba(0,0,0,0)',topFillColor2:'rgba(0,0,0,0)',bottomFillColor1:'rgba(0,0,0,0)',bottomFillColor2:'rgba(0,0,0,0)',lineWidth:2,priceLineVisible:false}); s.setData(d); zero(s); }
    leg('dvc3',[`최근 ${lastv(d,0)}`]); c3.timeScale().fitContent(); }
  // 4 외국인 선물 순매수 (막대)
  const fd=pts('fut_frgn'); if(fd.length>=2){ const c4=mk('dvc4',v=>v.toFixed(0)); if(c4){
    const s=c4.addHistogramSeries({priceLineVisible:false}); s.setData(fd.map(x=>({time:x.time,value:x.value,color:x.value>=0?cv('--up'):cv('--dn')}))); c4.timeScale().fitContent(); leg('dvc4',[`최근 ${lastv(fd,0)}`]); } }
  else { const e=$('#dvc4'); if(e){ e.style.height='auto'; e.innerHTML=fd.length?`<div style="padding:12px 0">${esc(fd[0].time)} · <b class="${fd[0].value>=0?'up':'dn'}">${fd[0].value>0?'+':''}${num(fd[0].value)}</b> 계약</div>`:'<div class="mu">데이터 없음</div>'; } }
}
</script>

<!-- tab_system.html — SYSTEM 탭 — 작업 보드·변경 이력·운영 상태 (sysBoardView·sysChgView·sysOpsView·SYSV).
     apps-script/Index.html 이 include('tab_system') 템플릿 태그로 끼워 넣는다 (GAS 는 HtmlService include, Pages 는 scripts/build_pages.py 가 인라인).
     전역 도우미($·esc·num·pct·render·setView·openDetail 등)는 Index.html 에 있다. -->
<script>
/* ───── SYSTEM: 작업 보드 · 변경 이력 · 운영 상태 (ops/board.json · ops/locks.json · reports/changelog.json · reports/ops/runs.json · reports/health.json) ───── */
const SYS={team:null,board:null,locks:null,chg:null,runs:null,health:null}; const SYSDAY={}; let SYSD='', SYSA='', SYSDR=false;
function sysLoad(k,fn){ if(SYS[k]!==null) return; SYS[k]=false;
  google.script.run.withSuccessHandler(t=>{ try{ SYS[k]=typeof t==='string'?JSON.parse(t):(t||{}); }catch(e){ SYS[k]={}; } if(SYSV[view]) render(); })
    .withFailureHandler(()=>{ SYS[k]={}; if(SYSV[view]) render(); })[fn](); }
const sysKst=()=>new Date(Date.now()+9*3600e3).toISOString().slice(0,10);
const sysPr=p=>p==='P0'?`<span class="tag r">P0</span>`:p==='P1'?`<span class="tag">P1</span>`:p==='P2'?`<span class="tag b">P2</span>`:`<span class="mu">${esc(p||'')}</span>`;
const sysNm=x=>String(x||'').replace(/\s*누나$/,'').replace('팀장(PB)','PB');   // 화면 표시용 담당 이름 (데이터는 그대로)
function sysTeamHtml(T){   // 팀원별 업무량 — ops/team.json(완료 작업 실측) + 보드 상태
  const M=SYS.team||{}, R=M.runs||[], E=M.earlier||{}, nm=x=>String(x||'').replace(/\s*누나$/,'').replace('팀장(PB)','PB');
  const by={}; const g=k=>by[k]=by[k]||{n:0,tools:0,sec:0,tok:0,open:0,done:0,early:0};
  R.forEach(r=>{ const o=g(nm(r.owner)); o.n++; o.tools+=r.tools||0; o.sec+=r.sec||0; o.tok+=r.tokens||0; });
  Object.entries(E).forEach(([k,v])=>{ g(nm(k)).early+=v; });
  (T||[]).forEach(t=>{ const o=g(nm(t.owner)); if(t.status==='완료') o.done++; else o.open++; });
  const rows=Object.entries(by).sort((a,b)=>(b[1].tools-a[1].tools)||((b[1].n+b[1].early)-(a[1].n+a[1].early)));
  if(!rows.length) return '';
  const mx=Math.max(1,...rows.map(([,o])=>o.tools));
  return `<div class="p c12"><h2>팀 업무량<small>ops/team.json · 도구 호출 수 순 · ${esc(M.updated||'')}</small></h2><div class="b"><table><tr><th class="l">담당</th><th>완료 작업</th><th>도구 호출</th><th class="l"></th><th>소요</th><th>토큰</th><th>보드 진행·대기</th></tr>${rows.map(([k,o])=>`<tr><td class="l am">${esc(k)}</td><td>${o.n}${o.early?` <span class="mu">+${o.early}</span>`:''}</td><td>${o.tools||'—'}</td><td class="l" style="min-width:90px"><div style="height:6px;background:var(--amber);opacity:.8;width:${Math.round(o.tools/mx*100)}%"></div></td><td class="mu">${o.sec?Math.round(o.sec/60)+'분':'—'}</td><td class="mu">${o.tok?(o.tok/1000).toFixed(0)+'k':'—'}</td><td>${o.open||'—'}</td></tr>`).join('')}</table><div class="mu" style="font-size:11px;margin-top:4px">+N = 수치 기록 전 초기 작업 건수</div></div></div>`;
}
function sysBoardView(){
  sysLoad('board','getBoard'); sysLoad('locks','getLocks'); sysLoad('team','getTeam');
  if(SYS.board===false) return '<div class="load">LOADING …</div>';
  const B=SYS.board||{}, T=B.tasks||[], td=sysKst();

  const ids=new Set(T.map(t=>t.id)), st=Object.fromEntries(T.map(t=>[t.id,t.status]));
  const row=t=>{ const late=t.due&&t.due<td&&t.status!=='완료', soon=!late&&t.due&&t.due<=td&&t.status!=='완료';
    const dep=(t.depends_on||[]).map(d=>`<span class="${ids.has(d)&&st[d]!=='완료'?'am':'mu'}">${esc(d)}</span>`).join(', ');
    return `<tr><td class="l">${sysPr(t.priority)}</td><td class="l" style="white-space:normal;min-width:180px"><b>${esc(t.title)}</b><div class="mu" style="font-size:11px">${esc(t.id)}${dep?' · 선행 '+dep:''}</div></td><td class="l am">${esc(sysNm(t.owner))}</td><td class="mu">${esc(t.started||'—')}</td><td class="${late?'dn':soon?'am':''}">${esc(t.due||'—')}${late?' 지남':soon?' 오늘':''}</td><td class="l mu" style="white-space:normal;font-size:11px;min-width:140px">${t.repo==='private'?'private 전용':(t.files||[]).map(esc).join('<br>')||'—'}</td><td class="l" style="white-space:normal;font-size:11px;min-width:200px">${esc(t.notes||'')}</td></tr>`; };

  for(const s of ST){ const g=T.filter(t=>t.status===s).sort((a,b)=>pk(a)-pk(b)||String(a.due||'9').localeCompare(String(b.due||'9'))); if(!g.length) continue;

  const share={}; T.filter(t=>t.status==='진행'||t.status==='검수').forEach(t=>(t.files||[]).forEach(f=>(share[f]=share[f]||[]).push(t.id)));
  const hot=Object.entries(share).filter(([,a])=>a.length>1);
  if(hot.length) h+=`<div class="mu" style="font-size:11.5px;margin-top:8px;white-space:normal">충돌 주의 — ${hot.map(([f,a])=>`<span class="am">${esc(f)}</span> ← ${a.map(esc).join(', ')}`).join(' · ')} (편집 전 잠금 필수)</div>`;
  h+=`</div></div>`;
  const L=(SYS.locks&&SYS.locks.locks)||[];
  const age=s=>{ const t=Date.parse(s); return isNaN(t)?null:(Date.now()-t)/3600e3; };
  h+=`<div class="p c12"><h2>파일 잠금<small>ops/locks.json · 규칙 ops/LOCKS.md</small></h2><div class="b">${SYS.locks===false?'<span class="mu">LOADING …</span>':L.length?`<table><tr><th class="l">파일</th><th class="l">담당</th><th class="l">작업</th><th>시작</th></tr>${L.map(x=>{ const a=age(x.since); return `<tr><td class="l">${esc(x.file)}</td><td class="l am">${esc(sysNm(x.owner))}</td><td class="l">${esc(x.task||'')}</td><td class="${a>6?'dn':'mu'}">${esc(x.since||'')}${a>6?` · ${Math.round(a)}시간 방치`:''}</td></tr>`; }).join('')}</table>`:'<span class="mu">잠금 없음</span>'}</div></div></div>`;
  return h;
}
function sysSetD(d){ SYSD=d; SYSDR=false; render(); }

function sysOpsView(){

<!-- tab_detail.html — 종목 상세 서랍(모든 탭 공용) — 가치평가·드라이버·피어·매크로 팝업·차트 (openDetail·renderDetail·drawChart).

<script>

  const rows=Object.entries(v.models).map(([k,m])=>`<tr><td class="l"><span style="color:${(GN[m.group]||['','#aaa'])[1]}">■</span> ${esc(k)}</td><td>${num(m.value,0)}</td><td>${pct(m.upside,0)}</td></tr><tr><td colspan="3" class="l mu" style="white-space:normal;font-size:11px;padding:0 6px 6px 22px;border-bottom:1px solid #1c1c1c">${esc(m.note)}</td></tr>`).join('');
  const f=v.fscore, d=v.dupont, a=v.assumptions||{}, sh=v.shares||{}, P=x=>x==null?'—':(x*100).toFixed(1)+'%';

   <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px">${cards}${v.signal_fv?`<div style="flex:1;min-width:150px;border-left:3px solid #fc3;padding:4px 10px"><div class="mu" style="font-size:11px">신호 가중 (현재이익 ${Math.round(v.signal_fv.w_current*100)}%)</div><div style="font-size:16px"><b>${num(v.signal_fv.value,0)}</b> ${pct(v.signal_fv.upside,0)}</div></div>`:''}</div>
   <div class="mu" style="font-size:11px">현재가 <b style="color:#fc3">${num(close,0)}</b> · 전체 범위 ${num(r.low,0)} ~ ${num(r.high,0)} · PER ${v.per??'—'}${v.per_reported&&v.per_reported!==v.per?` (보고이익 기준 ${v.per_reported})`:''} · PBR ${v.pbr??'—'}${v.implied_g!=null?` · 역DCF 내재 영구성장 ${(v.implied_g*100).toFixed(1)}%`:''}</div>${bar}

   RIM 민감도 (COE): ${Object.entries(v.rim_sens||{}).map(([k,x])=>`${k} ${num(x,0)}`).join(' / ')||'—'}<br>

   가정: COE ${(a.coe*100).toFixed(0)}% · 영구성장 ${(a.g*100).toFixed(0)}% · 기준 ${esc(a.period||'')} TTM · 업종 ${esc(v.sector||'—')}${v.peer?` (PER ${v.peer.per?.toFixed?.(1)??'—'} / PBR ${v.peer.pbr?.toFixed?.(2)??'—'}, n=${v.peer.n})`:''}${a.financial_sector?' · 금융업: 현금흐름 모델 제외':''}</div>`;

function drvPanel(d,v){

    ${sf?`<div class="mu" style="font-size:11px">참고용 계산: '현재 이익' 가중 ${Math.round(sf.w_current*100)}% → 가중 적정가 ${num(sf.value,0)} (${pct(sf.upside,0)}) — 가중치 식(50%+40%×점수)은 임의로 정한 것이라 목표가로 쓰지 말 것</div>`:''}</div>

  const m=d.macro;
  if(m&&m.rows&&m.rows.length){ h+=`<div class="am" style="font-size:12px;margin:10px 0 2px">매크로 바람 <span style="color:${col(m.score)}">${sg(m.score)}</span> <span class="mu">(시장 베타 ${m.beta_mkt??'—'}, 시장 영향 제외한 민감도 · |t|≥3만 '실측', 나머지는 업종 가정 절반)</span></div>
    <table style="max-width:760px"><tr><th class="l">변수</th><th>1개월</th><th>민감도(t)</th><th>영향</th></tr>${m.rows.map(r=>`<tr><td class="l">${esc(r.name)}<div class="mu" style="font-size:11px">${esc(r.why)}</div></td><td>${pct(r.r1m,1)}</td><td class="mu">${r.beta!=null?r.beta.toFixed(2):'—'}${r.t!=null?` (${r.t})`:''}</td><td style="color:${col(r.effect)}">${sg(r.effect)}</td></tr>`).join('')}</table>`; }
  const a=d.analyst;
  if(a){ const dr=Object.entries(a.drivers||{}).sort((x,y)=>(y[1].up+y[1].dn)-(x[1].up+x[1].dn));
    h+=`<div class="am" style="font-size:12px;margin:10px 0 2px">애널리스트 (90일 ${a.n}건) <span style="color:${col(a.score)}">${sg(a.score)}</span> <span class="mu">전 종목 평균 ${sg(a.base)} 대비</span></div>
    <div class="mu" style="font-size:12px;line-height:1.7">목표가 ↑${a.tp_up} ↓${a.tp_dn} · 이익 추정 ↑${a.op_up} ↓${a.op_dn} · 컨센 상회 언급 ${a.beat} / 하회 ${a.miss} · 톤 ${Object.entries(a.tones).map(([k,n])=>`${esc(k)} ${n}`).join(', ')}</div>
    ${dr.length?`<div style="font-size:12px;line-height:1.8;margin-top:2px">리포트가 말하는 이익 드라이버 <span class="mu" style="font-size:11px">(▲▼ = 문장 속 증가·감소 방향. 원가·재고는 ▼가 이익에 좋음, 환율은 업종마다 다름)</span>: ${dr.map(([k,x])=>{const inv=k==='원자재·원가'||k==='재고', neu=k==='환율', c=neu?'var(--amber)':(x.up>x.dn)!==inv&&x.up!==x.dn?'var(--up)':x.up!==x.dn?'var(--dn)':'var(--amber)'; return `<span title="${esc((x.ex||[]).join(' / '))}" style="margin-right:8px;color:${c}">${esc(k)} ${x.up>x.dn?'▲':x.dn>x.up?'▼':'◆'}${x.up}/${x.dn}</span>`;}).join('')}</div>
    ${dr.slice(0,3).map(([k,x])=>(x.ex||[]).slice(0,1).map(e=>`<div class="mu" style="font-size:11px;margin-left:10px;white-space:normal">· [${esc(k)}] ${esc(e)}</div>`).join('')).join('')}`:''}`; }

    ${n.events.slice(0,8).map(e=>`<div style="font-size:12px;line-height:1.6;white-space:normal"><span style="color:${e.dir>0?'var(--up)':e.dir<0?'var(--dn)':'var(--muted)'}">${e.dir>0?'▲':e.dir<0?'▼':'◆'} ${esc(e.event)}</span> <span class="mu">${esc(e.date||'')}</span> ${e.link?`<a href="${esc(e.link)}" target="_blank" rel="noopener">${esc(e.title)}</a>`:esc(e.title)}</div>`).join('')}`; }

const PEERS={};
function peersLoad(mk,cb){ if(PEERS[mk]) return cb(PEERS[mk]); google.script.run.withSuccessHandler(t=>{try{PEERS[mk]=JSON.parse(t);}catch(e){PEERS[mk]={rows:[]};} cb(PEERS[mk]);}).withFailureHandler(()=>{PEERS[mk]={rows:[]};cb(PEERS[mk]);}).getPeers(mk); }
function rvFill(sym,mk){
  peersLoad(mk,P=>{ const box=$('#rvbox'); if(!box) return; const rows=P.rows||[], me=rows.find(r=>r.s===sym);
    if(!me){ box.innerHTML='<div class="mu">비교 데이터 없음</div>'; return; }
    const grp=rows.filter(r=>r.g===me.g); const list=[...grp].sort((a,b)=>(b.mc||0)-(a.mc||0)).slice(0,14); if(!list.includes(me)) list.push(me);
    const med=k=>{const v=grp.map(r=>r[k]).filter(x=>x!=null&&isFinite(x)).sort((a,b)=>a-b); return v.length?v[Math.floor(v.length/2)]:null;};
    const rk=k=>{const v=grp.filter(r=>r[k]!=null); if(me[k]==null||!v.length) return ''; const n=v.filter(r=>r[k]>me[k]).length+1; return `${n}/${v.length}`;};
    const F=(x,d=1)=>x==null||!isFinite(x)?'—':x.toFixed(d), P_=x=>x==null?'—':pct(x,0), col=x=>x==null?'var(--muted)':x>0.15?'var(--up)':x<-0.15?'var(--dn)':'var(--amber)';

     <table><tr><th class="l">종목</th><th>1D</th><th>20D</th><th>PER</th><th>PBR</th><th>ROE</th><th>평균ROE</th><th>드라이버</th><th>정상화</th><th>신호가중</th></tr>
     ${list.map(r=>`<tr style="${r===me?'background:#1a1408':''}"><td class="l ${r===me?'am':''}"><span class="sym" data-sym="${esc(r.s)}" data-mk="${mk}" style="cursor:pointer">${esc(shortNm(r.n)||r.s)}</span></td><td>${pct(r.r1,1)}</td><td>${pct(r.r20,0)}</td><td>${F(r.per)}</td><td>${F(r.pbr,2)}</td><td>${r.roe!=null?(r.roe*100).toFixed(0)+'%':'—'}</td><td class="mu">${r.roen!=null?(r.roen*100).toFixed(0)+'%':'—'}</td><td style="color:${col(r.drv)}">${r.drv!=null?(r.drv>0?'+':'')+r.drv.toFixed(2):'—'}</td><td>${P_(r.nor)}</td><td>${P_(r.sig)}</td></tr>`).join('')}
     <tr class="mu"><td class="l">그룹 중앙값</td><td>${pct(med('r1'),1)}</td><td>${pct(med('r20'),0)}</td><td>${F(med('per'))}</td><td>${F(med('pbr'),2)}</td><td>${med('roe')!=null?(med('roe')*100).toFixed(0)+'%':'—'}</td><td>${med('roen')!=null?(med('roen')*100).toFixed(0)+'%':'—'}</td><td>${med('drv')!=null?med('drv').toFixed(2):'—'}</td><td>${P_(med('nor'))}</td><td>${P_(med('sig'))}</td></tr></table>`; });
}

function drawCanvas(ch,sc,rs,kr){
  const cvb=$('#chb'); if(cvb&&!$('#cv')) cvb.innerHTML='<canvas id="cv" width="960" height="260"></canvas>';
  if(ch&&ch.length>90) ch=ch.slice(-60);
  const cv=$('#cv'); if(!cv||!ch.length) return; const W=cv.width=cv.clientWidth*2,H=cv.height=520; const x=cv.getContext('2d'); x.scale(1,1);
  const padL=70,padR=16,padT=12,padB=70,vh=90; const n=ch.length; const cw=(W-padL-padR)/n;
  const bx=sc.base&&sc.base.range;
  const lv=[ovOn('bull')&&sc.bull?.target,ovOn('stop')&&sc.bear?.stop,ovOn('tp')&&rs.consensus_tp,ovOn('next')&&sc.bear?.next,ovOn('psar')&&sc.bear?.trail,...(ovOn('box')&&bx?bx:[]),...(ovOn('psar')?ch.map(c=>c.p):[])].filter(v=>v);
  let lo=Math.min(...ch.map(c=>c.l),...lv),hi=Math.max(...ch.map(c=>c.h),...lv); const pad=(hi-lo)*0.06; lo-=pad;hi+=pad;
  const Y=v=>padT+(hi-v)/(hi-lo)*(H-padT-padB-vh); const vmax=Math.max(...ch.map(c=>c.v))||1;
  x.fillStyle='#050505';x.fillRect(0,0,W,H);
  x.strokeStyle='#1c1c1c';x.lineWidth=1;x.font='20px monospace';x.fillStyle='#777';
  for(let i=0;i<=4;i++){const v=lo+(hi-lo)*i/4,y=Y(v);x.beginPath();x.moveTo(padL,y);x.lineTo(W-padR,y);x.stroke();x.fillText(v.toLocaleString(undefined,{maximumFractionDigits:kr?0:2}),4,y+7);}
  const line=(key,col)=>{x.strokeStyle=col;x.lineWidth=2;x.beginPath();let s=false;ch.forEach((c,i)=>{if(c[key]==null)return;const px=padL+cw*i+cw/2,py=Y(c[key]);s?x.lineTo(px,py):x.moveTo(px,py);s=true;});x.stroke();};
  if(ovOn('box')&&bx&&bx[0]&&bx[1]){ const y1=Y(bx[1]),y2=Y(bx[0]); x.fillStyle='rgba(255,255,255,0.05)'; x.fillRect(padL,y1,W-padL-padR,y2-y1); x.strokeStyle='#444'; x.lineWidth=1; x.strokeRect(padL,y1,W-padL-padR,y2-y1); x.fillStyle='#888'; x.fillText('BOX',padL+6,y1+20); }
  if(ovOn('s20')) line('s20','#4aa3ff'); if(ovOn('s50')) line('s50','#c77dff');
  const hline=(v,col,lab)=>{if(!v)return;const y=Y(v);x.setLineDash([8,6]);x.strokeStyle=col;x.lineWidth=2;x.beginPath();x.moveTo(padL,y);x.lineTo(W-padR,y);x.stroke();x.setLineDash([]);x.fillStyle=col;x.fillText(lab,W-padR-x.measureText(lab).width,y-6);};
  const fm=v=>num(v,kr?0:2);
  if(ovOn('tp')) hline(rs.consensus_tp,'#35d6e6','TP '+fm(rs.consensus_tp));
  if(ovOn('bull')) hline(sc.bull?.target,'#2fd05a','BULL '+fm(sc.bull?.target));
  if(ovOn('stop')) hline(sc.bear?.stop,'#ff4b4b','STOP '+fm(sc.bear?.stop));
  if(ovOn('next')) hline(sc.bear?.next,'#ff6b9a','다음 지지 '+fm(sc.bear?.next));
  if(ovOn('psar')){ const pts=ch.filter(c=>c.p!=null);
    if(pts.length){ ch.forEach((c,i)=>{ if(c.p==null||c.p<lo||c.p>hi) return; const px=padL+cw*i+cw/2; x.fillStyle=c.p<c.c?'#ff9a1f':'#c070ff'; x.beginPath(); x.arc(px,Y(c.p),Math.max(2.5,cw*0.12),0,Math.PI*2); x.fill(); });
      const lp=pts[pts.length-1]; x.fillStyle='#ff9a1f'; x.fillText('PSAR '+fm(lp.p)+(lp.p<lp.c?' (상승추세)':' (하락추세)'),padL+6,padT+22); }
    else if(sc.bear?.trail) hline(sc.bear.trail,'#ff9a1f','PSAR '+fm(sc.bear.trail)); }
  ch.forEach((c,i)=>{const px=padL+cw*i+cw/2;const up=c.c>=c.o;x.strokeStyle=x.fillStyle=up?'#ff4b4b':'#4aa3ff'; if(!kr){x.strokeStyle=x.fillStyle=up?'#2fd05a':'#ff4b4b';}
    x.lineWidth=2;x.beginPath();x.moveTo(px,Y(c.h));x.lineTo(px,Y(c.l));x.stroke();const yo=Y(c.o),yc=Y(c.c);x.fillRect(px-cw*0.3,Math.min(yo,yc),cw*0.6,Math.max(2,Math.abs(yc-yo)));
    const vb=H-padB-(c.v/vmax)*vh*0.95; x.fillStyle=up?'#5a2020':'#1f3a5a'; x.fillRect(px-cw*0.3,vb,cw*0.6,H-padB-vb);
    if(i%10===0){x.fillStyle='#777';x.fillText(c.d,px-20,H-padB+26);} });
}

<script>

(function(){

    try{ localStorage.setItem(K,JSON.stringify(S)); }catch(e){} };
  const day=()=>{ const k=dkey(); return S.d[k]||(S.d[k]={s:0,g:{},sv:{},e:{},mh:0,nt:0,t0:null,t1:null}); };

  function bump(kind,name){ try{ const D=day(), h=hr(); D.t0=D.t0||hm(); D.t1=hm();
      try{ D.st=Object.keys(JSON.parse(localStorage.getItem('mt_study_done')||'{}')).length; }catch(_){}   // 스터디 완료 모듈 수 스냅샷
      if(kind==='g'){ D.g[name]=(D.g[name]||0)+1; if(document.documentElement.classList.contains('xl')) D.xl=(D.xl||0)+1;   // 엑셀 스킨(사무실 모드) 상태에서 연 화면
        if(name==='mkt'||name==='home'){ if(h>=9&&h<15.5) D.mh++; if(h>=21||h<7) D.nt++; } }   // 장중(09–15:30)·미장 시간(21–07) 시세 화면 확인
      else if(kind==='sv') D.sv[name]=(D.sv[name]||0)+1;
      else D.e[name]=(D.e[name]||0)+1;
      save(); }catch(e){} }
  // 세션: 탭을 연 뒤 30분 넘게 비활성이었다가 돌아오면 새 세션
  let last=0; const touch=()=>{ const n=Date.now(); if(n-last>30*60e3){ try{ day().s++; save(); }catch(e){} } last=n; };
  touch(); document.addEventListener('visibilitychange',()=>{ if(!document.hidden) touch(); });
  // 화면 전환: 전역 setView 를 감싼다 (탭·하위 탭·코드에서 이동 모두 이 함수를 거침)
  const gOf=v=>{ let g=v; try{ if(typeof groupOf==='function') g=groupOf(v); }catch(e){} return g==='system'?'sys':g; };
  if(typeof window.setView==='function'){ const o=window.setView; let pg=null;
    window.setView=function(v){ const g=gOf(v); touch(); if(g!==pg) bump('g',GRPS.includes(g)?g:'other'); pg=g; bump('sv',v); return o.apply(this,arguments); };
    bump('g','home'); pg='home'; }
  // 행동 이벤트(위임): 종목 상세·패널 펼침·대결 제출·스터디 체크·퀴즈
  let lastSum=null;
  document.addEventListener('click',e=>{ const t=e.target; if(!t||!t.closest) return; touch(); const sm=t.closest('summary'); lastSum=sm?sm.parentElement:null;
    if(t.closest('.sym,[data-sym]')) bump('e','detail');
    const a=t.closest('a[href*="/issues/new"]'); if(a&&/title=(pick|exit|ticket)/i.test(a.href)) bump('e','duel');
    if(t.closest('#exgo')) bump('e','duel');
    const ch=t.closest('[data-ch]'); if(ch){ const k=ch.dataset.ch; bump('e','quiz');
      setTimeout(()=>{ const r=document.querySelector(`[data-res="${CSS.escape(k)}"]`); if(r&&/정답/.test(r.textContent)) bump('e','quiz_ok'); },0); }
  },true);
  document.addEventListener('toggle',e=>{ const d=e.target; if(d&&d.tagName==='DETAILS'&&d.open&&d===lastSum&&d.id!=='usagebox') bump('e','panel'); },true);
  document.addEventListener('change',e=>{ const c=e.target; if(c&&c.matches&&c.matches('[data-mchk]')&&c.checked) bump('e','study_chk'); },true);

  // ── 내보내기: 최근 7일(또는 마지막 내보내기 이후) 일별 CSV → 비공개 이슈 폼 ──
  const HDR=['date','dev','sessions','first','last',...GRPS,'other','mkt_open_hours','night','detail','panel','duel','study_chk','quiz','quiz_ok','study_total','xl','top_sub'];
  function rows(n){ const ks=Object.keys(S.d).sort().slice(-n);
    return ks.map(k=>{ const D=S.d[k], top=Object.entries(D.sv||{}).sort((a,b)=>b[1]-a[1]).slice(0,4).map(([a,b])=>a+':'+b).join(';');
      return [k,S.dev,D.s||0,D.t0||'',D.t1||'',...GRPS.map(g=>(D.g||{})[g]||0),(D.g||{}).other||0,D.mh||0,D.nt||0,
        ...['detail','panel','duel','study_chk','quiz','quiz_ok'].map(x=>(D.e||{})[x]||0),D.st||0,D.xl||0,top].join(','); }); }
  function exportUrl(n){ const isoW=(()=>{ const d=kst(); d.setUTCHours(0,0,0,0); const w=(d.getUTCDay()+6)%7; d.setUTCDate(d.getUTCDate()-w+3);
      const y=d.getUTCFullYear(), f=new Date(Date.UTC(y,0,4)); return y+'-W'+String(1+Math.round(((d-f)/864e5-3+((f.getUTCDay()+6)%7))/7)).padStart(2,'0'); })();
    const csv=[HDR.join(','),...rows(n)].join('\n');
    return `https://github.com/${REPO}/issues/new?template=usage.yml&title=${encodeURIComponent('usage '+isoW)}&data=${encodeURIComponent(csv)}`; }
  function summary(){ const ks=Object.keys(S.d).sort(), last7=ks.filter(k=>k>=new Date(Date.now()+9*3600e3-6*864e5).toISOString().slice(0,10));
    const sum=(f)=>last7.reduce((a,k)=>a+f(S.d[k]),0);
    const g=GRPS.map(x=>[x,sum(D=>(D.g||{})[x]||0)]).filter(x=>x[1]).sort((a,b)=>b[1]-a[1]);
    return {days:last7.length, all:ks.length, ses:sum(D=>D.s||0), g, mh:sum(D=>D.mh||0), duel:sum(D=>(D.e||{}).duel||0), chk:sum(D=>(D.e||{}).study_chk||0), quiz:sum(D=>(D.e||{}).quiz||0), x:S.x}; }
  function box(){ const s=summary();
    return `<details class="p c12" id="usagebox" style="margin-top:10px"><summary style="cursor:pointer;padding:6px 10px"><b>사용 기록</b> <span class="mu" style="font-size:11.5px">최근 7일 ${s.days}일 접속 · 세션 ${s.ses} · 이 브라우저에만 저장</span></summary>
     <div class="b" style="font-size:12px;line-height:1.7;white-space:normal">
      <div>탭별 열람(7일): ${s.g.map(([k,v])=>`<span style="margin-right:8px">${k.toUpperCase()} <b>${v}</b></span>`).join('')||'<span class="mu">아직 없음</span>'}</div>
      <div>장중 시세 확인 <b>${s.mh}</b> · 대결 제출 클릭 <b>${s.duel}</b> · 스터디 체크 <b>${s.chk}</b> · 퀴즈 <b>${s.quiz}</b></div>
      <div class="mu">기록 일수 ${s.all}일 · 마지막 내보내기 ${s.x||'없음'}</div>
      <div style="margin-top:6px"><button class="sbtn" id="usgexp">사용 기록 내보내기 (최근 7일 → 비공개 이슈)</button> <button class="sbtn" id="usgexp28">28일</button> <button class="sbtn" id="usgclr" style="margin-left:8px">기록 지우기</button></div>
      <div class="mu" style="font-size:11px">버튼을 누르면 비공개 저장소 이슈 폼이 채워진 채 열린다 → '제출'하면 usage/daily.csv·weekly.csv 에 반영. 주 1회(일요일 주간 리뷰 때) 권장.</div>
     </div></details>`; }
  function inject(){ try{ if(typeof view==='undefined'||(view!=='my'&&view!=='syso')) return; const r=document.getElementById('root'); if(!r||document.getElementById('usagebox')) return;
      r.insertAdjacentHTML('beforeend',box());
      const go=n=>{ S.x=dkey(); bump('e','export'); window.open(exportUrl(n),'_blank'); };
      document.getElementById('usgexp').onclick=()=>go(7); document.getElementById('usgexp28').onclick=()=>go(28);
      document.getElementById('usgclr').onclick=()=>{ if(confirm('이 브라우저의 사용 기록을 지울까요?')){ S={v:1,d:{},x:null,dev:S.dev}; save(); const b=document.getElementById('usagebox'); if(b) b.remove(); inject(); } };
    }catch(e){} }
  const root=document.getElementById('root'); if(root) new MutationObserver(()=>{ if(!document.getElementById('usagebox')) inject(); }).observe(root,{childList:true});
  window.mtUsage={dump:()=>JSON.parse(JSON.stringify(S)), csv:n=>[HDR.join(','),...rows(n||7)].join('\n')};
})();
</script>
</body>
</html>
