name: scorecard

# 주간 성적표 (공개 층) — 매주 일요일 08:30 KST (= 토 23:30 UTC). 비율·건수만. 금액·보유는 pb-private/scorecard/build_week.py.
on:
  schedule:
    - cron: "30 23 * * 6"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scorecard
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 성적표
        env:
          PYTHONUNBUFFERED: "1"
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/scorecard_week.py
      - name: 저장
        if: always()
        run: |
          git config user.name "screener-bot"
          git config user.email "screener-bot@users.noreply.github.com"
          git add reports/scorecard_week.json reports/scorecard_week.md 2>/dev/null || true
          git diff --cached --quiet || git commit -m "scorecard: $(date -u +%FT%H:%M)"
          git stash -q -u 2>/dev/null || true
          ok=0
          for i in 1 2 3 4; do git pull --rebase -X theirs origin main && git push && { ok=1; break; }; git rebase --abort 2>/dev/null || true; sleep $((i*5)); done
          [ $ok = 1 ] || echo "::warning::푸시 실패 — 결과가 저장되지 않음"; true
