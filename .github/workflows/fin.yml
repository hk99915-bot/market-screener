name: financials

# DART 재무제표 수집 (주요계정: 전 종목 / 전체 재무제표: 우선 300종목, 실행당 1,200콜·45분 예산 — 매일 조금씩 이어받음)
on:
  schedule:
    - cron: "30 18 * * *"   # 03:30 KST 매일 (백필이 끝나면 새 분기 보고서만 받음)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fin
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 수집
        env:
          PYTHONUNBUFFERED: "1"
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          FIN_BUDGET_MIN: "45"   # DART 수집 벽시계 예산(분) — 나눠서 천천히, 매일 이어받음
        run: |
          # 빨리 끝나는 것부터 — DART 재무 백필이 3시간 제한을 다 써서 뒤 작업이 못 돌던 문제 (10/16)
          python -m screener.main --mode portfolios --no-send || true
          python -m screener.main --mode momentum --no-send || true
          python -m screener.main --mode analysts --no-send || true
          python -m screener.main --mode fin --no-send || true
      - name: 저장
        if: always()
        run: |
          git config user.name "screener-bot"
          git config user.email "screener-bot@users.noreply.github.com"
          for p in data/fin universe/dart_corp.csv universe/kr_shares.csv universe/sec_tickers.json data/research.parquet reports; do [ -e "$p" ] && git add -A "$p"; done; true
          git diff --cached --quiet && exit 0
          git commit -m "fin: $(date -u +%FT%H:%M)"
          for i in 1 2 3; do git pull --rebase origin main && git push && break; sleep 5; done
