name: financials
# 실행 이름 — scripts/slot_guard.py 가 display_title 로 같은 슬롯의 GAS 실행을 찾는다 (결정 C, docs/schedule_table.md)
run-name: "financials ${{ github.event_name == 'workflow_dispatch' && format('수동 commit={0}', inputs.commit) || format('예약 {0}', github.event.schedule) }}"

# DART 재무제표 수집 (주요계정: 전 종목 / 전체 재무제표: 우선 300종목, 실행당 1,200콜·45분 예산 — 매일 조금씩 이어받음)
on:
  schedule:
    - cron: "30 18 * * *"   # 03:30 KST 매일 (백필이 끝나면 새 분기 보고서만 받음)
  workflow_dispatch:
    inputs:
      commit:
        description: "true 일 때만 결과 커밋. auto(기본) = GAS 예약 슬롯 시각이면 커밋, 그 밖의 수동 실행은 읽기 전용 (결정 C)"
        required: false
        default: "auto"

permissions:
  contents: write
  actions: read

concurrency:
  group: fin
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 실행 주체 확인 (결정 C — GAS 슬롯이면 cron 은 +12분 대기 후 GAS 실행 시 건너뜀 · 수동은 commit 입력)
        id: g
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SCHEDULE: ${{ github.event.schedule }}
          COMMIT_INPUT: ${{ inputs.commit }}
        run: python scripts/slot_guard.py --wf fin.yml || { echo "::warning::slot_guard 실패 — 실행(fail-open)"; echo "go=true" >> $GITHUB_OUTPUT; [ "${{ github.event_name }}" != "workflow_dispatch" ] || [ "${{ inputs.commit }}" = "true" ] && echo "commit=true" >> $GITHUB_OUTPUT || echo "commit=false" >> $GITHUB_OUTPUT; }
      - name: 큰 데이터 받기 (릴리스 data-latest → data/ — scripts/data_store.py, repo-size-stage1)
        if: steps.g.outputs.go == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/data_store.py pull --record-stale
      - name: 수집
        if: steps.g.outputs.go == 'true'
        env:
          PYTHONUNBUFFERED: "1"
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          FIN_BUDGET_MIN: "45"   # DART 수집 벽시계 예산(분) — 나눠서 천천히, 매일 이어받음
        run: |
          # 빨리 끝나는 것부터 — DART 재무 백필이 3시간 제한을 다 써서 뒤 작업이 못 돌던 문제 (10/16)
          python -m screener.main --mode portfolios --no-send || true
          python -m screener.main --mode momentum --no-send || true
          python -m screener.main --mode analysts --no-send || echo "::warning::analysts 실패 — reports/logs/analysts.log"
          # 비종목 리포트 — 실패해도 다음 단계는 진행하되 묻히지 않게 경고 + reports/research_views.json status
          python -m screener.main --mode research_views --no-send || echo "::warning::비종목 리포트 수집 실패/부분 — reports/research_views.json status 참조"
          python -m screener.public_reports || echo "::warning::공공 리포트·지정학 피드 수집 실패/부분 — reports/public_reports.json sources 참조 (애널 public-reports)"
          python -m screener.research_synthesis || echo "::warning::리서치 종합 실패 — reports/research_synthesis.json 은 전날 것 유지 (애널 research-synthesis)"
          python -m screener.main --mode fin --no-send || true
      - name: 저장
        if: always() && steps.g.outputs.commit == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "screener-bot"
          git config user.email "screener-bot@users.noreply.github.com"
          python scripts/data_store.py push --groups fin || echo "::error::data_store push 실패 — fin 큰 데이터가 릴리스에 저장되지 않음(data/data_store_status.json)"
          for p in data/fin universe/dart_corp.csv universe/kr_shares.csv universe/sec_tickers.json data/research.parquet data/research_views.parquet data/data_store_manifest.json reports; do [ -e "$p" ] && git add -A "$p"; done; true
          git diff --cached --quiet && exit 0
          git commit -m "fin: $(date -u +%FT%H:%M)"
          # 10/19 18:33 UTC 실행: rebase 충돌(daily_brief·research.json 등) → 'rebase 진행 중'으로 재시도 3회 모두 실패했는데
          # 마지막 sleep 의 종료코드 0 으로 단계가 '성공' 표시, 결과(애널리스트·재무)가 저장 안 됨 → briefing.yml 과 같은 방식으로
          git stash -q -u 2>/dev/null || true
          ok=0
          for i in 1 2 3 4; do git pull --rebase -X theirs origin main && python -m screener.regress_git && git push && { ok=1; break; }; git rebase --abort 2>/dev/null || true; sleep $((i*5)); done
          [ $ok = 1 ] || { echo "::error::푸시 실패 — fin 결과가 저장되지 않음"; exit 1; }
