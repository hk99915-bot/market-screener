name: deriv-hist
# 실행 이름 — scripts/slot_guard.py 가 display_title 로 같은 슬롯의 GAS 실행을 찾는다 (결정 C, docs/schedule_table.md)
run-name: "deriv-hist ${{ github.event_name == 'workflow_dispatch' && format('[{0}] commit={1}', inputs.task, inputs.commit) || format('예약 {0}', github.event.schedule) }}"

# 수급·파생 일별 이력 적재 — 평일 16:40 KST (KRX 확정치 반영 후). 텔레그램 없음.
# 결과: data/deriv/daily.csv (하루 1행). GitHub 예약은 자주 늦거나 건너뜀 → GAS 백업 예약기에서도 workflow_dispatch 로 부를 것.
# 수동: task=backfill (days=과거 영업일 수) · task=probe (소스 탐침 → reports/logs/deriv_probe.txt, days 칸에 탐침 이름을 넣으면 그것만)
#   KRX OPEN API 파생 서비스 승인 확인: task=probe days=krx_openapi commit=false (읽기 전용 — 결과는 실행 로그 SUMMARY 줄, 키는 *** 처리)
on:
  schedule:
    - cron: "40 7 * * 1-5"
  workflow_dispatch:
    inputs:
      task:
        description: "run | backfill | probe"
        default: "run"
      days:
        description: "backfill 영업일 수 (옵션 보드 하루 1회 조회)"
        default: "0"
      redo:
        description: "YYYY-MM-DD 이후 옵션·선물 보드 재계산 (계산식 수정 뒤)"
        default: ""
      commit:
        description: "true 일 때만 결과 커밋. auto(기본) = GAS 예약 슬롯 시각이면 커밋, 그 밖의 수동 실행은 읽기 전용 (결정 C)"
        required: false
        default: "auto"

permissions:
  contents: write
  actions: read

concurrency:
  group: deriv-hist
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 실행 주체 확인 (결정 C — GAS 슬롯이면 cron 은 +12분 대기 후 GAS 실행 시 건너뜀 · 수동은 commit 입력)
        id: g
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SCHEDULE: ${{ github.event.schedule }}
          COMMIT_INPUT: ${{ inputs.commit }}
          KEY_INPUT: ${{ inputs.task }}
        run: python scripts/slot_guard.py --wf deriv_hist.yml || { echo "::warning::slot_guard 실패 — 실행(fail-open)"; echo "go=true" >> $GITHUB_OUTPUT; [ "${{ github.event_name }}" != "workflow_dispatch" ] || [ "${{ inputs.commit }}" = "true" ] && echo "commit=true" >> $GITHUB_OUTPUT || echo "commit=false" >> $GITHUB_OUTPUT; }
      - name: 실행
        if: steps.g.outputs.go == 'true'
        env:
          PYTHONUNBUFFERED: "1"
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
          KRX_API_KEY: ${{ secrets.KRX_API_KEY }}
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: |
          T="${{ github.event.inputs.task || 'run' }}"
          if [ "$T" = "probe" ]; then
            mkdir -p reports/logs; python scripts/probe_deriv_sources.py ${{ github.event.inputs.days != '0' && github.event.inputs.days || '' }} 2>&1 | sed -E 's/(로그인 ID:).*/\1 ***/' | tee reports/logs/deriv_probe.txt
          else
            mkdir -p reports/logs; python -m screener.deriv_hist --task "$T" --days "${{ github.event.inputs.days || '0' }}" ${{ github.event.inputs.redo && format('--redo {0}', github.event.inputs.redo) || '' }} 2>&1 | sed -E 's/(로그인 ID:).*/\1 ***/' | tee reports/logs/deriv_hist.txt
          fi
      - name: 금융위 V2 원자료 캐시 (공공누리 4유형 — 저장소 대신 Actions cache, req-data-cb6315c2)
        if: steps.g.outputs.go == 'true'
        uses: actions/cache@v4
        with:
          path: data/fsc
          key: fsc-raw-${{ github.run_id }}
          restore-keys: fsc-raw-
      - name: 금융위 V2 T+1 일일 수집 (req-data-784ffc43 — 원자료 비공개, 공개는 상태만 · 백필 범위는 task=probe days=fsc_range)
        if: steps.g.outputs.go == 'true' && github.event.inputs.task != 'probe'
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: python -m screener.fsc_daily --days 3 2>&1 | tail -3 || echo "::warning::fsc_daily 실패"
      - name: 우리 일봉(kr_prices 릴리스 자산) 받기 — 종가 대조용 (req-data-310435f3 ①, 실패해도 계속 · 없으면 reports/detail 차선)
        if: steps.g.outputs.go == 'true' && github.event.inputs.task != 'probe'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/data_store.py pull --groups prices 2>&1 | tail -3 || echo "::warning::kr_prices 받기 실패"
      - name: 금융위 종가 ↔ 우리 일봉 대조 (req-data-23bdae79 ② — 읽기·표본 대조, 실패해도 계속)
        if: steps.g.outputs.go == 'true' && github.event.inputs.task != 'probe'
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: python -m screener.fsc_close 2>&1 | tail -3 || echo "::warning::fsc_close 실패"
      - name: 금융위 채권시세 국고 3Y ↔ KRX [14017] 대조 (req-bonds-d3eab49e — 읽기·대조군, 실패해도 계속)
        if: steps.g.outputs.go == 'true' && github.event.inputs.task != 'probe'
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: python -m screener.fsc_bond 2>&1 | tail -3 || echo "::warning::fsc_bond 실패"
      - name: 감마 레짐 검증 재계산 (scripts/study_gamma.py — 사전등록 기준, 표본 차면 자동 판정)
        if: steps.g.outputs.go == 'true' && github.event.inputs.task != 'probe'
        run: python scripts/study_gamma.py || echo "::warning::study_gamma 실패 — 이전 결과 유지"
      - name: 저장
        if: always() && steps.g.outputs.commit == 'true'
        run: |
          git config user.name "screener-bot"
          git config user.email "screener-bot@users.noreply.github.com"
          for p in data/deriv reports/deriv_hist_status.json reports/vkospi.json reports/fsc_close_check.json reports/fsc_bond_check.json reports/fsc_daily_status.json reports/studies/gamma_regime.json views/registry.json reports/logs/deriv_probe.txt reports/logs/deriv_hist.txt; do [ -e "$p" ] && git add -A "$p"; done; true
          git diff --cached --quiet || git commit -m "deriv: $(date -u +%FT%H:%M)"
          git stash -q -u 2>/dev/null || true
          ok=0
          for i in 1 2 3 4; do git pull --rebase -X theirs origin main && git push && { ok=1; break; }; git rebase --abort 2>/dev/null || true; sleep $((i*5)); done
          [ $ok = 1 ] || echo "::warning::푸시 실패 — 결과가 저장되지 않음"; true
