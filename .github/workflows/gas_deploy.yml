# GAS 자동 배포 — 10/23 겸이 "폰으로 gas 업데이트하기가 너무 빡세네, 전체선택이 안 됨" → "너가 해줄 수 있나?"
# apps-script/*.gs 가 main 에 바뀌면 clasp 로 Apps Script 프로젝트에 밀어 넣고, 기존 웹앱 배포(같은 URL)를 새 버전으로 올린다.
# 화면 HTML(Index·tab_*)은 Code.gs 가 GitHub 에서 직접 읽으므로 여기 대상이 아님(.gs 만).
#
# 한 번만 설정(오너, PC 필요 · 약 10분) — 토큰·코드는 채팅에 붙이지 말고 GitHub Secrets 에만:
#  ① https://script.google.com/home/usersettings → "Google Apps Script API" 켜기
#  ② PC 터미널: npm i -g @google/clasp@2.4.2 → clasp login (브라우저 로그인) → 홈 폴더의 .clasprc.json 내용 전체 복사
#  ③ GitHub 저장소 Settings → Secrets and variables → Actions → New repository secret:
#       CLASPRC_JSON      = ②의 .clasprc.json 내용
#       GAS_SCRIPT_ID     = Apps Script 편집기 → 프로젝트 설정 → 스크립트 ID
#       GAS_DEPLOYMENT_ID = 배포 → 배포 관리 → 웹 앱의 배포 ID (AKfy… 로 시작)
#  ④ Actions → gas_deploy → Run workflow 로 첫 실행 확인. 이후 Code.gs 변경은 push 만으로 반영.
# 시크릿이 없으면 아무것도 하지 않고 성공으로 끝난다(안내만).
#
# 프로젝트별 대상 (감사 10/24 M3, req-dev-218c8448) — 전엔 apps-script/*.gs 전부를 웹앱 프로젝트에 밀어 doPost·tick 이 섞였다.
#   웹앱 프로젝트(GAS_SCRIPT_ID)     ← Code.gs 만 (+ 웹앱 새 버전 배포)
#   예약 실행기 프로젝트(GAS_SCHED_SCRIPT_ID, 선택) ← Scheduler.gs·TelegramHook.gs (배포 없음 — tick·tgPoll 은 시간 트리거라 저장된 코드로 돈다)
#     GAS_SCHED_SCRIPT_ID 가 없으면 = GAS_SCRIPT_ID 로 본다(한 프로젝트에 셋 다 — 첫 clasp pull(10/23 12:57 UTC)에 이미
#     Code.gs·Scheduler.gs·TelegramHook.gs 가 같이 있었음). 그때는 세 파일을 한 번에 push(전과 같음) + 분리 안내.
#     예약 실행기가 따로 있으면 그 스크립트 ID 를 GAS_SCHED_SCRIPT_ID 시크릿으로 넣는다 → 웹앱엔 Code.gs 만.
#   어느 프로젝트가 예약 실행기인지: 그 프로젝트 편집기 왼쪽 ⏰ 트리거 화면에 tick·tgPoll 이 걸려 있는 쪽.
#   두 프로젝트 모두 clasp pull 로 현재 파일을 받은 뒤 해당 파일만 덮어쓰므로, 대상 밖 파일은 지우지도 바꾸지도 않는다.
name: gas_deploy

on:
  push:
    branches: [main]
    paths: ["apps-script/*.gs"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gas-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: 설정 확인
        id: cfg
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          GAS_SCRIPT_ID: ${{ secrets.GAS_SCRIPT_ID }}
          GAS_DEPLOYMENT_ID: ${{ secrets.GAS_DEPLOYMENT_ID }}
          GAS_SCHED_SCRIPT_ID: ${{ secrets.GAS_SCHED_SCRIPT_ID }}
        run: |
          if [ -z "$GAS_SCHED_SCRIPT_ID" ]; then
            echo "::notice::GAS_SCHED_SCRIPT_ID 미설정 — 웹앱 프로젝트(GAS_SCRIPT_ID)를 예약 실행기로 보고 Code.gs·Scheduler.gs·TelegramHook.gs 를 함께 push. 예약 실행기(tick·tgPoll 트리거)가 다른 프로젝트면 그 스크립트 ID 를 GAS_SCHED_SCRIPT_ID 로."
          fi
          if [ -z "$CLASPRC_JSON" ] || [ -z "$GAS_SCRIPT_ID" ] || [ -z "$GAS_DEPLOYMENT_ID" ]; then
            echo "::notice::GAS 자동 배포 미설정 — 워크플로 상단 ①~④ 를 한 번 하면 켜진다."
            echo "ok=0" >> "$GITHUB_OUTPUT"
          else
            echo "ok=1" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.cfg.outputs.ok == '1'
        with:
          node-version: "20"
      - name: clasp 로 밀어 넣기·웹앱 새 버전
        if: steps.cfg.outputs.ok == '1'
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          GAS_SCRIPT_ID: ${{ secrets.GAS_SCRIPT_ID }}
          GAS_DEPLOYMENT_ID: ${{ secrets.GAS_DEPLOYMENT_ID }}
          GAS_SCHED_SCRIPT_ID: ${{ secrets.GAS_SCHED_SCRIPT_ID }}
        run: |
          set -e
          npm i -g @google/clasp@2.4.2 >/dev/null
          printf '%s' "$CLASPRC_JSON" > ~/.clasprc.json
          SRC="$GITHUB_WORKSPACE/apps-script"
          GAS_SCHED_SCRIPT_ID="${GAS_SCHED_SCRIPT_ID:-$GAS_SCRIPT_ID}"   # 미설정 = 한 프로젝트
          WEB_FILES="Code.gs"
          SCHED_FILES="Scheduler.gs TelegramHook.gs"
          [ "$GAS_SCHED_SCRIPT_ID" = "$GAS_SCRIPT_ID" ] && WEB_FILES="$WEB_FILES $SCHED_FILES"   # 한 프로젝트에 다 있는 경우
          push_to() {   # $1 = 스크립트 ID, $2 = 작업 폴더, 나머지 = 덮어쓸 .gs (대상 밖 파일은 pull 한 그대로)
            id="$1"; dir="$2"; shift 2
            mkdir -p "$dir" && cd "$dir"
            printf '{"scriptId":"%s","rootDir":".","fileExtension":"gs"}' "$id" > .clasp.json
            clasp pull                     # 매니페스트(appsscript.json)·대체용 HTML·다른 .gs 는 프로젝트에 있는 그대로 유지
            for f in "$@"; do cp "$SRC/$f" .; done
            clasp push -f
          }
          push_to "$GAS_SCRIPT_ID" /tmp/gas_web $WEB_FILES
          clasp deploy -i "$GAS_DEPLOYMENT_ID" -d "auto ${GITHUB_SHA::7}"
          echo "웹앱 배포 완료: ${GITHUB_SHA::7} ($WEB_FILES) → 같은 URL 새 버전"
          if [ -n "$GAS_SCHED_SCRIPT_ID" ] && [ "$GAS_SCHED_SCRIPT_ID" != "$GAS_SCRIPT_ID" ]; then
            push_to "$GAS_SCHED_SCRIPT_ID" /tmp/gas_sched $SCHED_FILES
            echo "예약 실행기 반영 완료: ${GITHUB_SHA::7} ($SCHED_FILES) — 배포 불필요(시간 트리거)"
          fi
