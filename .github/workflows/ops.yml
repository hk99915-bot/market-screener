name: ops

# 운영 기록 — 매일 23:47 KST. 변경 이력(changelog.json)·작업내역 보고(reports/ops/daily)·최근 24h 워크플로 실행 통계(runs.json)·작업 보드(BOARD.md).
# + 팀 업무량 auto(ops/team.json, PM 소관) — 23:47 에 한 번, 날짜가 바뀐 00:07 KST 에 한 번 더(그 슬롯은 팀 업무량 + watchdog).
on:
  schedule:
    - cron: "47 14 * * *"   # 23:47 KST (정각은 GitHub 가 자주 건너뜀 → 비정각)
    - cron: "7 15 * * *"    # 00:07 KST — 팀 업무량만 (화면 '갱신 안 됨' 판정이 날짜 기준이라 자정 직후 갱신)
  workflow_dispatch:
    inputs:
      commit:
        description: "true 일 때만 결과 커밋 (기본 false = 읽기 전용 — 결정 C: 수동 실행이 예약 산출물을 덮어쓰지 않게)"
        required: false
        default: "false"

permissions:
  contents: write
  actions: read

concurrency:
  group: ops
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # changelog 는 전체 git 이력이 필요
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 워크플로 실행 통계 (최근 24h)
        if: github.event.schedule != '7 15 * * *'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/ops_runs.py --hours 24 || echo "::warning::runs.json 수집 실패"

      - name: 작업 보드 · 변경 이력 · 작업내역 보고
        if: github.event.schedule != '7 15 * * *'
        run: |
          python scripts/board.py || echo "::warning::board.json 검증 실패 — BOARD.md 미갱신"
          python scripts/changelog.py --days 3

      - name: 팀 업무량 (PM — ops/team.json auto)
        run: python scripts/team_stats.py || echo "::warning::team_stats 실패 — 팀 업무량 미갱신(화면에 ⚠ 갱신 안 됨)"

      - name: 연구 보드 (QUANT › 연구 보드 — 연구 파일 날짜·미등록 연구·퀀트 앞 요청, UXUI·퀀트 10/21)
        run: python scripts/research_board.py --build || echo "::warning::research_board 실패 — 연구 보드 미갱신(ops/research_pipeline.json 확인)"

      - name: 감시 (watchdog — 데이터0·신선도·마감·대기·토스·요청 2영업일, 보드 escalated + 텔레그램 하루 1통 · 10/21 PM 안 B·E)
        if: github.event.schedule == '7 15 * * *' || github.event_name == 'workflow_dispatch'
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN || secrets.TELE }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || secrets.TELE_CHAT }}
        run: |
          pip install -q polars requests   # send_telegram(screener.report) 의존 — pick.yml 과 같게
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.commit }}" != "true" ]; then
            python scripts/watchdog.py || echo "::warning::watchdog 드라이런 실패"
          else
            python scripts/watchdog.py --apply --send || echo "::warning::watchdog 실패 — reports/watchdog.json 미갱신"
            python scripts/board.py || true
          fi

      - name: 저장
        if: always() && (github.event_name != 'workflow_dispatch' || inputs.commit == 'true')
        env:
          WD: ${{ github.event.schedule == '7 15 * * *' || github.event_name == 'workflow_dispatch' }}
          NIGHT: ${{ github.event.schedule != '7 15 * * *' }}
        run: |
          git config user.name "screener-bot"
          git config user.email "screener-bot@users.noreply.github.com"
          files="reports/changelog.json reports/ops ops/BOARD.md ops/team.json reports/watchdog.json ops/board.json docs/desk_kb/rounds/_requests.json reports/research_board.json"
          git add -A $files 2>/dev/null; true
          git diff --cached --quiet || git commit -m "ops: $(date -u +%FT%H:%M)"
          mine=$(git rev-parse HEAD)
          git stash -q -u 2>/dev/null || true
          # -X theirs 금지(포니테일 검수 10/21 #3): board.json·_requests.json 은 사람(데스크·ask.py)도 쓰는 파일이라 rebase 로 덮으면 그새 들어온 수정이 사라짐.
          # push 가 거부되면 원격 최신으로 reset → 로컬 생성기를 그 위에서 다시 돌려 커밋. runs.json(API 수집)·watchdog.json(sent·first_seen)만 이번 판을 가져옴.
          ok=0
          for i in 1 2 3 4; do
            git push origin HEAD:main && { ok=1; break; }
            sleep $((i*5))
            git fetch -q origin main && git reset -q --hard origin/main || continue
            for f in reports/ops/runs.json reports/watchdog.json; do git checkout "$mine" -- "$f" 2>/dev/null || true; done
            python scripts/team_stats.py >/dev/null || true
            if [ "$WD" = true ]; then python scripts/watchdog.py --apply >/dev/null || true; fi   # --send 없음 = 텔레그램 재전송 없음
            if [ "$NIGHT" = true ]; then python scripts/changelog.py --days 3 >/dev/null || true; fi
            python scripts/board.py >/dev/null || true
            python scripts/research_board.py --build >/dev/null || true
            git add -A $files 2>/dev/null; true
            git diff --cached --quiet && { ok=1; break; }
            git commit -qm "ops: $(date -u +%FT%H:%M) (원격 최신 위 재생성)" || true
          done
          [ $ok = 1 ] || echo "::warning::푸시 실패 — 결과가 저장되지 않음"; true
