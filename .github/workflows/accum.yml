name: accum

# 국장 외인·기관 매집 스캔 (퀀트) — 평일 18:37 KST = 09:37 UTC (KRX 투자자별 종목 확정치는 장 마감 뒤 18시 전후).
# daily: 최근 결측 거래일 채움(하루 10콜) → reports/accum.json + reports/archive/accum/. 빈 결과는 status=fail + 잡 실패.
# backfill(수동): data/flows/kr_inv_YYYY.parquet 를 since 까지 거꾸로 채움 — 재개 가능, 시간 예산 안에서 멈춤.
on:
  schedule:
    - cron: "37 9 * * 1-5"
  workflow_dispatch:
    inputs:
      mode:
        description: "daily | backfill | scan"
        required: false
        default: "daily"
      since:
        description: "backfill 시작일 (YYYY-MM-DD)"
        required: false
        default: "2022-01-01"
      budget:
        description: "수집 시간 예산(분)"
        required: false
        default: "50"

permissions:
  contents: write

concurrency:
  group: accum
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 수집·스캔
        env:
          PYTHONUNBUFFERED: "1"
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
          MODE: ${{ inputs.mode || 'daily' }}
          SINCE: ${{ inputs.since || '2022-01-01' }}
          BUDGET: ${{ inputs.budget || '12' }}
        run: python -m screener.accum "$MODE" --since "$SINCE" --budget-min "$BUDGET" 2>&1 | tee reports/logs/accum.log; exit ${PIPESTATUS[0]}
      - name: 저장
        if: always()
        run: |
          git config user.name "screener-bot"
          git config user.email "screener-bot@users.noreply.github.com"
          git add data/flows/ reports/accum.json reports/archive/accum/ reports/logs/accum.log 2>/dev/null; true
          git diff --cached --quiet || git commit -m "accum: ${MODE:-daily} $(date -u +%F)"
          ok=0
          for i in 1 2 3 4; do git pull --rebase -X theirs origin main && git push && { ok=1; break; }; git rebase --abort 2>/dev/null || true; sleep $((i*5)); done
          [ $ok = 1 ] || echo "::warning::푸시 실패 — 결과가 저장되지 않음"; true
        env:
          MODE: ${{ inputs.mode || 'daily' }}
