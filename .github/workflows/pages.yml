# A1 시범 (docs/refactor_plan_2026-10-18.md 결정 A·단계 3): Pages 를 'Actions 배포'로 — main + data 고아 브랜치(US 상세)를 합쳐 게시.
# 기본 꺼짐. 켜는 순서(오너): ① Settings → Pages → Source = "GitHub Actions"  ② Settings → Secrets and variables → Actions → Variables 에
#   PAGES_ACTIONS=1 (이 워크플로가 main 푸시마다 배포)  ③ (선택) DATA_BRANCH_US=1 (main 의 US 상세를 data 브랜치에도 써 둠 — 2단계 준비)
# 끄기/롤백: Source 를 "Deploy from a branch (main / root)" 로 되돌리고 PAGES_ACTIONS 삭제 → 예전 브랜치 배포 그대로.
# 수동 실행(workflow_dispatch)은 기본 '빌드만'(산출물 크기·시간 확인, 배포 안 함) — deploy=true 일 때만 배포.
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: "true 면 실제 배포 (Source 가 GitHub Actions 일 때만 의미 있음)"
        default: "false"

permissions:
  contents: write     # data 브랜치 강제 갱신
  pages: write
  id-token: write

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || vars.PAGES_ACTIONS == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:   # 작업 단위 — 꺼져 있을 때(건너뛴 푸시 실행)가 수동 빌드를 취소하지 않게
      group: pages-build
      cancel-in-progress: true   # 봇 커밋이 몰리면 마지막 것만 (브랜치 배포도 같은 방식)
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: data 브랜치 갱신 (DATA_BRANCH_US=1 이고 main 에 US 상세가 있을 때)
        if: vars.DATA_BRANCH_US == '1' && hashFiles('reports/detail/US/_index.json') != ''
        run: python3 scripts/data_branch.py push reports/detail/US || echo "::warning::data 브랜치 갱신 실패 — main 판으로 게시"
      - name: 사이트 합치기 (main + data/US 상세, 역행이면 main 판 유지)
        run: python3 scripts/data_branch.py site --out _site reports/detail/US
      - name: US 상세 경로 확인
        run: |
          test -s _site/index.html
          test -s _site/reports/detail/US/_index.json
          test -s _site/reports/dashboard.json
          python3 -c "import json;d=json.load(open('_site/reports/detail/US/_index.json'));s=d['symbols'];import os;miss=[x for x in s if not os.path.exists(f'_site/reports/detail/US/{x}.json')];print('US 색인',d.get('asof'),len(s),'종목, 파일 없음',len(miss));assert len(miss)<=len(s)//20"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    if: (github.event_name == 'push' && vars.PAGES_ACTIONS == '1') || github.event.inputs.deploy == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: pages-deploy
      cancel-in-progress: false   # 배포 도중 취소 금지
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - id: d
        uses: actions/deploy-pages@v4
