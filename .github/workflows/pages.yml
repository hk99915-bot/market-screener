# A1 시범 (docs/refactor_plan_2026-10-18.md 결정 A·단계 3): Pages 를 'Actions 배포'로 — main + data 고아 브랜치(US 상세)를 합쳐 게시.
# 기본 꺼짐. 켜는 순서(오너): ① Settings → Pages → Source = "GitHub Actions"  ② Settings → Secrets and variables → Actions → Variables 에
#   PAGES_ACTIONS=1 (이 워크플로가 main 푸시마다 배포)  ③ (선택) DATA_BRANCH_US=1 (main 의 US 상세를 data 브랜치에도 써 둠 — 2단계 준비)
#   ④ (선택) DATA_BRANCH_KR=1 (KR 상세도 같은 방식, 감사 10/21 #6 — 1단계 이중 기록. main 에서 KR 제거는 2단계: 읽는 워크플로 pull·Code.gs raw_ 경로·GAS 재배포 뒤)
# 끄기/롤백: Source 를 "Deploy from a branch (main / root)" 로 되돌리고 PAGES_ACTIONS 삭제 → 예전 브랜치 배포 그대로.
# 수동 실행(workflow_dispatch)은 기본 '빌드만'(산출물 크기·시간 확인, 배포 안 함) — deploy=true 일 때만 배포.
name: pages

on:
  push:
    branches: [main]
    # 시세·운영 파일만 바뀐 push 는 사이트 재빌드 안 함 — 화면이 raw 에서 직접 읽음 (build_pages.py raw(), 감사 10/21 #3)
    paths-ignore: ["reports/live.json", "reports/events.json", "reports/events_stats.json", "reports/event_state.json", "ops/team.json", "ops/locks.json"]
  workflow_dispatch:
    inputs:
      deploy:
        description: "true 면 실제 배포 (Source 가 GitHub Actions 일 때만 의미 있음)"
        default: "false"

permissions:
  contents: write     # data 브랜치 강제 갱신
  pages: write
  id-token: write

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || vars.PAGES_ACTIONS == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:   # 작업 단위 — 꺼져 있을 때(건너뛴 푸시 실행)가 수동 빌드를 취소하지 않게
      group: pages-build
      cancel-in-progress: true   # 봇 커밋이 몰리면 마지막 것만 (브랜치 배포도 같은 방식)
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: data 브랜치 갱신 (DATA_BRANCH_US·KR=1 이고 main 에 그 상세가 있을 때 — 한 번에 같이 써야 다른 쪽이 안 지워짐)
        if: vars.DATA_BRANCH_US == '1' || vars.DATA_BRANCH_KR == '1'
        run: |
          P=""; MISS=""
          for m in US KR; do
            on="${{ vars.DATA_BRANCH_US }}"; [ $m = KR ] && on="${{ vars.DATA_BRANCH_KR }}"
            [ "$on" = "1" ] || continue
            if [ -s reports/detail/$m/_index.json ]; then P="$P reports/detail/$m"; else MISS="$MISS $m"; fi
          done
          # 고아 커밋은 넘긴 폴더만 담음 → 켜 둔 폴더가 하나라도 비면 push 자체를 건너뜀 (한쪽만 올리면 다른 쪽이 data 에서 지워짐 — 포니테일 검수 10/21 #5)
          if [ -n "$MISS" ]; then echo "::warning::data 브랜치 갱신 건너뜀 — main 에 상세 색인 없음:$MISS (기존 data 판 유지)"
          elif [ -n "$P" ]; then python3 scripts/data_branch.py push $P || echo "::warning::data 브랜치 갱신 실패 — main 판으로 게시"; fi
      - name: 사이트 합치기 (main + data/US·KR 상세, 역행이면 main 판 유지)
        run: python3 scripts/data_branch.py site --out _site reports/detail/US reports/detail/KR
      - name: US 상세 경로 확인
        run: |
          test -s _site/index.html
          test -s _site/reports/detail/US/_index.json
          test -s _site/reports/detail/KR/_index.json
          test -s _site/reports/dashboard.json
          python3 -c "import json;d=json.load(open('_site/reports/detail/US/_index.json'));s=d['symbols'];import os;miss=[x for x in s if not os.path.exists(f'_site/reports/detail/US/{x}.json')];print('US 색인',d.get('asof'),len(s),'종목, 파일 없음',len(miss));assert len(miss)<=len(s)//20"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    if: (github.event_name == 'push' && vars.PAGES_ACTIONS == '1') || github.event.inputs.deploy == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: pages-deploy
      cancel-in-progress: false   # 배포 도중 취소 금지
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - id: d
        uses: actions/deploy-pages@v4
