name: lab

# 전략 연구소 — 매주 일요일 23:00 KST. 사전 등록 가설을 같은 하네스로 백테스트하고 통계 관문으로 등급을 매긴다.
# 데이터: data/hist/kr_YYYY.parquet(상폐 포함, 저장소에 커밋됨) + data/kr_prices.parquet(올해) → checkout 만으로 충분.
on:
  schedule:
    - cron: "0 14 * * 0"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lab
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 실행
        env:
          PYTHONUNBUFFERED: "1"
        run: python -m screener.main --mode lab
      - name: 저장
        if: always()
        run: |
          git config user.name "screener-bot"
          git config user.email "screener-bot@users.noreply.github.com"
          [ -e reports/lab.json ] && git add reports/lab.json; true
          git diff --cached --quiet || git commit -m "lab: $(date -u +%FT%H:%M)"
          git stash -q -u 2>/dev/null || true
          ok=0
          for i in 1 2 3 4; do git pull --rebase -X theirs origin main && git push && { ok=1; break; }; git rebase --abort 2>/dev/null || true; sleep $((i*5)); done
          [ $ok = 1 ] || echo "::warning::푸시 실패 — 결과가 저장되지 않음"; true
