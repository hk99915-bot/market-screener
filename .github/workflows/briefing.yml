name: briefing

# KST → UTC (-9h). 월~금 기준. 미장 세션은 KST 기준 화~토 새벽에 걸리므로 요일 범위를 따로 둔다.
on:
  schedule:
    - cron: "50 23 * * 0-4"   # 08:50 KST 장전 코멘트 (KR)
    - cron: "30 1 * * 1-5"    # 10:30 KST 장중 수급 (KR)
    - cron: "35 2 * * 1-5"    # 11:35 KST 점심 운용회의 (겸이 점심 11:30~12:50에 맞춤)
    - cron: "30 4 * * 1-5"    # 13:30 KST 장중 수급 (KR)
    - cron: "15 5 * * 1-5"    # 14:15 KST '판정 전' 운용회의 (장중 세션, 텔레그램 짧은 판)
    - cron: "25 5 * * 1-5"    # 14:25 KST 반등일 판정 알림 (코스피 vs 전일 종가 +0.5%, 비율만)
    - cron: "5 6 * * 1-5"     # 15:05 KST 급락일 종가 매수 신호 점검 (코스피 장중 ≤ −4.5% → 15:20 동시호가 안내, 비율만)
    - cron: "45 6 * * 1-5"    # 15:45 KST 장 마감 확정치로 지수·데일리·운용회의 갱신
    - cron: "52 11 * * 1-5"   # 20:52 KST 미장 프리장 (정각은 GitHub 가 자주 건너뜀 → 비정각)
    - cron: "52 12 * * 1-5"   # 21:52 KST 미장 장전
    - cron: "52 13 * * 1-5"   # 22:52 KST 미장 장중
    - cron: "52 18 * * 1-5"   # 03:52 KST 미장 후반 (마감 직전)
    - cron: "10 10 * * 1-5"   # 19:10 KST 신규 리포트 (하루 1회, 당일 발간분 모음)
    - cron: "52 21 * * 1-5"   # 06:52 KST 미장 마감 스크리너 + 매크로 (S&P500 ∪ NDX)
    - cron: "10 22 * * 1-5"   # 07:10 KST 반도체 밸류에이션 바스켓 (06:52 미장 마감 스크리너가 detail/US 종가를 갱신한 뒤에 돌아야 함 — 06:40은 전일 종가로 계산되던 순서 버그) · 비율만 · 참고 등급 — KR 종가분은 16:20 스크리너 안에서 갱신
  workflow_dispatch:
    inputs:
      mode:
        description: "premarket_kr | intraday_kr | premarket_us | intraday_us | reports | screen_us | dashboard | dart | detail_kr | detail_us | shares | etf | themes | pb | quotes | bonds | lab | committee | close_kr | rebound | valuation | crash_check | derivs"
        required: true
        default: "reports"

permissions:
  contents: write
  actions: read

# 모드별로 대기열을 나눈다. 같은 그룹은 '대기 1개'만 허용돼 새 요청이 기존 대기(예: 장중 브리핑)를 취소하기 때문.
concurrency:
  group: briefing-${{ github.event.inputs.mode || github.event.schedule || 'x' }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: 모드 결정
        id: m
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ github.event.inputs.mode }}" >> $GITHUB_OUTPUT; exit 0
          fi
          # 모드는 '어느 예약이 울렸나'(cron 문자열)로 정한다 — 실행 시각 기준이면 GitHub 지연(수십 분) 때 엉뚱한 모드가 됨
          CR="${{ github.event.schedule }}"
          case "$CR" in
            "50 23 * * 0-4") MODE=premarket_kr ;;
            "30 1 * * 1-5"|"30 4 * * 1-5") MODE=intraday_kr ;;
            "45 6 * * 1-5") MODE=close_kr ;;
            "35 2 * * 1-5"|"15 5 * * 1-5") MODE=committee ;;
            "25 5 * * 1-5") MODE=rebound ;;
            "5 6 * * 1-5") MODE=crash_check ;;
            "52 11 * * 1-5"|"52 12 * * 1-5") MODE=premarket_us ;;
            "52 13 * * 1-5"|"52 18 * * 1-5") MODE=intraday_us ;;
            "10 10 * * 1-5") MODE=reports ;;
            "52 21 * * 1-5") MODE=screen_us ;;
            "10 22 * * 1-5") MODE=valuation ;;
            *) MODE=skip ;;
          esac
          # 예약 시각보다 150분 넘게 밀렸으면 낡은 브리핑이 되므로 건너뜀
          set -- $CR; SM=$((10#$1 + 10#$2 * 60)); NM=$((10#$(date -u +%M) + 10#$(date -u +%H) * 60))
          LATE=$(( (NM - SM + 1440) % 1440 ))
          if [ $LATE -gt 150 ]; then echo "예약 $CR 이 ${LATE}분 지연 — 건너뜀"; MODE=skip; fi
          # 백업 예약기(Apps Script)가 이미 수동 실행을 보냈으면 늦게 울린 GitHub 예약은 건너뜀 (중복 텔레그램 방지)
          if [ "$MODE" != "skip" ]; then
            SINCE=$(date -u -d "-$((LATE + 10)) min" +%FT%TZ)
            N=$(curl -s -H "Authorization: Bearer ${{ github.token }}" "https://api.github.com/repos/${{ github.repository }}/actions/workflows/briefing.yml/runs?event=workflow_dispatch&created=%3E%3D$SINCE&per_page=5" | python3 -c "import sys,json;print(json.load(sys.stdin).get('total_count',0))" 2>/dev/null || echo 0)
            if [ "${N:-0}" -gt 0 ]; then echo "백업 예약기가 이미 실행 — 건너뜀"; MODE=skip; fi
          fi
          echo "mode=$MODE" >> $GITHUB_OUTPUT

      - name: 실행
        env:
          PYTHONUNBUFFERED: "1"
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN || secrets.TELE }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || secrets.TELE_CHAT }}
          MY_HOLDINGS: ${{ secrets.MY_HOLDINGS }}
          MY_RULES: ${{ secrets.MY_RULES }}
          RULE_STOP_LEVEL: ${{ secrets.RULE_STOP_LEVEL }}
          RULE_DEADLINE: ${{ secrets.RULE_DEADLINE }}
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          KRX_BACKEND: ${{ vars.KRX_BACKEND || 'pykrx' }}
        run: |
          if [ "${{ steps.m.outputs.mode }}" = "skip" ]; then
            echo "예약 시각과 맞지 않는 실행 — 건너뜀"
          elif [ "${{ steps.m.outputs.mode }}" = "screen_us" ]; then
            python -m screener.main --market US
          elif [ "${{ steps.m.outputs.mode }}" = "detail_us" ]; then
            python -m screener.main --market US --no-send   # 미장 상세만 재생성 (텔레그램 없음)
          else
            python -m screener.main --mode ${{ steps.m.outputs.mode }}
          fi

      - name: 신선도 점검
        if: always()
        # 모든 모드 끝에 ops/freshness.json 계약 점검 → reports/freshness.json (텔레그램 없음, 아래 저장 단계가 커밋). 실패해도 저장은 진행
        run: python -m screener.main --mode freshness || echo "::warning::신선도 점검 실패"

      - name: 저장
        if: always()
        run: |
          git config user.name "screener-bot"
          git config user.email "screener-bot@users.noreply.github.com"
          for p in reports universe data/research.parquet data/dart.parquet data/signals.parquet data/short_hist.parquet; do [ -e "$p" ] && git add -A "$p"; done; true
          git diff --cached --quiet || git commit -m "briefing: ${{ steps.m.outputs.mode }} $(date -u +%FT%H:%M)"
          # 커밋 대상이 아닌 변경(예: 실행 중 교정된 data/kr_prices.parquet)이 남아 있으면 pull --rebase 가 거부돼 푸시가 조용히 실패함 → 치워둔다
          git stash -q -u 2>/dev/null || true
          # 역행 검사: rebase 뒤 HEAD 의 산출물 날짜가 원격 main 보다 과거면 그 파일은 원격 판으로 되돌림 (10/17 detail_us 역행 — 수동·주말 실행 포함)
          ok=0
          for i in 1 2 3 4; do git pull --rebase -X theirs origin main && python -m screener.regress_git && git push && { ok=1; break; }; git rebase --abort 2>/dev/null || true; sleep $((i*5)); done
          [ $ok = 1 ] || echo "::warning::푸시 실패 — 결과가 저장되지 않음"; true
