name: briefing

# KST → UTC (-9h). 월~금 기준. 미장 세션은 KST 기준 화~토 새벽에 걸리므로 요일 범위를 따로 둔다.
on:
  schedule:
    - cron: "50 23 * * 0-4"   # 08:50 KST 장전 코멘트 (KR)
    - cron: "30 1 * * 1-5"    # 10:30 KST 장중 수급 (KR)
    - cron: "30 4 * * 1-5"    # 13:30 KST 장중 수급 (KR)
    - cron: "0 12 * * 1-5"    # 21:00 KST 미장 프리장
    - cron: "0 13 * * 1-5"    # 22:00 KST 미장 장전
    - cron: "0 14 * * 1-5"    # 23:00 KST 미장 장중
    - cron: "0 19 * * 1-5"    # 04:00 KST 미장 후반 (마감 직전)
    - cron: "10 10 * * 1-5"   # 19:10 KST 신규 리포트 (하루 1회, 당일 발간분 모음)
    - cron: "0 22 * * 1-5"    # 07:00 KST 미장 마감 스크리너 + 매크로 (S&P500 ∪ NDX)
  workflow_dispatch:
    inputs:
      mode:
        description: "premarket_kr | intraday_kr | premarket_us | intraday_us | reports | screen_us"
        required: true
        default: "reports"

permissions:
  contents: write

concurrency:
  group: screener
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: 모드 결정
        id: m
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ github.event.inputs.mode }}" >> $GITHUB_OUTPUT; exit 0
          fi
          H=$(date -u +%H); M=$(date -u +%M)
          case "$H" in
            23) echo "mode=premarket_kr" ;;
            01|04) echo "mode=intraday_kr" ;;
            12|13) echo "mode=premarket_us" ;;
            14|19) echo "mode=intraday_us" ;;
            10) echo "mode=reports" ;;
            22) echo "mode=screen_us" ;;
            *) echo "mode=reports" ;;
          esac >> $GITHUB_OUTPUT

      - name: 실행
        env:
          PYTHONUNBUFFERED: "1"
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN || secrets.TELE }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || secrets.TELE_CHAT }}
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          KRX_BACKEND: ${{ vars.KRX_BACKEND || 'pykrx' }}
        run: |
          if [ "${{ steps.m.outputs.mode }}" = "screen_us" ]; then
            python -m screener.main --market US
          else
            python -m screener.main --mode ${{ steps.m.outputs.mode }}
          fi

      - name: 저장
        if: always()
        run: |
          git config user.name "screener-bot"
          git config user.email "screener-bot@users.noreply.github.com"
          git add -A reports universe data/research.parquet data/dart.parquet 2>/dev/null || true
          git diff --cached --quiet || git commit -m "briefing: ${{ steps.m.outputs.mode }} $(date -u +%FT%H:%M)"
          git pull --rebase origin main || true
          git push || true
