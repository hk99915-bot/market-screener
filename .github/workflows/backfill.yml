name: backfill
# 실행 이름 — scripts/slot_guard.py 가 display_title 로 같은 슬롯의 GAS 실행을 찾는다 (결정 C, docs/schedule_table.md)
run-name: "backfill ${{ github.event_name == 'workflow_dispatch' && format('[{0}] commit={1}', inputs.market, inputs.commit) || format('예약 {0}', github.event.schedule) }}"

# 장기 히스토리 백필. 매일 02:00 KST 에 돌고, 다 받았으면 바로 끝난다(완료된 연도는 건너뜀).
on:
  schedule:
    - cron: "0 17 * * *"
  workflow_dispatch:
    inputs:
      market:
        description: "ALL | KR | US"
        default: "ALL"
      commit:
        description: "true 일 때만 결과 커밋. auto(기본) = GAS 예약 슬롯 시각이면 커밋, 그 밖의 수동 실행은 읽기 전용 (결정 C)"
        required: false
        default: "auto"

permissions:
  contents: write
  actions: read

concurrency:
  group: backfill
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 실행 주체 확인 (결정 C — GAS 슬롯이면 cron 은 +12분 대기 후 GAS 실행 시 건너뜀 · 수동은 commit 입력)
        id: g
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SCHEDULE: ${{ github.event.schedule }}
          COMMIT_INPUT: ${{ inputs.commit }}
          KEY_INPUT: ${{ inputs.market }}
        run: python scripts/slot_guard.py --wf backfill.yml || { echo "::warning::slot_guard 실패 — 실행(fail-open)"; echo "go=true" >> $GITHUB_OUTPUT; [ "${{ github.event_name }}" != "workflow_dispatch" ] || [ "${{ inputs.commit }}" = "true" ] && echo "commit=true" >> $GITHUB_OUTPUT || echo "commit=false" >> $GITHUB_OUTPUT; }
      - name: 백필
        if: steps.g.outputs.go == 'true'
        env:
          PYTHONUNBUFFERED: "1"
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
        run: python -m screener.backfill --market ${{ github.event.inputs.market || 'ALL' }} --budget-min 300
      - name: 저장
        if: always() && steps.g.outputs.commit == 'true'
        run: |
          git config user.name "screener-bot"
          git config user.email "screener-bot@users.noreply.github.com"
          git add -A data/hist 2>/dev/null || true
          git diff --cached --quiet || git commit -m "backfill: $(date -u +%FT%H:%M)"
          for i in 1 2 3; do git pull --rebase origin main && git push && break; sleep 10; done
