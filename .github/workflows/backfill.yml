name: backfill

# 장기 히스토리 백필. 매일 02:00 KST 에 돌고, 다 받았으면 바로 끝난다(완료된 연도는 건너뜀).
on:
  schedule:
    - cron: "0 17 * * *"
  workflow_dispatch:
    inputs:
      market:
        description: "ALL | KR | US"
        default: "ALL"

permissions:
  contents: write

concurrency:
  group: backfill
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 백필
        env:
          PYTHONUNBUFFERED: "1"
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
        run: python -m screener.backfill --market ${{ github.event.inputs.market || 'ALL' }} --budget-min 300
      - name: 저장
        if: always()
        run: |
          git config user.name "screener-bot"
          git config user.email "screener-bot@users.noreply.github.com"
          git add -A data/hist 2>/dev/null || true
          git diff --cached --quiet || git commit -m "backfill: $(date -u +%FT%H:%M)"
          for i in 1 2 3; do git pull --rebase origin main && git push && break; sleep 10; done
