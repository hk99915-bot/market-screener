name: health

# 주간 자가점검 — 일요일 22:00 KST. 정합성·신선도·결측·만료·예약 실패를 보고, 이상 있을 때만 텔레그램.
on:
  schedule:
    - cron: "0 13 * * 0"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 점검
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN || secrets.TELE }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || secrets.TELE_CHAT }}
        run: python -m screener.main --mode health
      - name: 저장
        if: always()
        run: |
          git config user.name "screener-bot"; git config user.email "screener-bot@users.noreply.github.com"
          cp reports/health.json /tmp/h.json 2>/dev/null || exit 0
          for i in 1 2 3; do
            git fetch -q origin main && git reset -q --hard origin/main && cp /tmp/h.json reports/health.json
            git add reports/health.json; git diff --cached --quiet && break
            git commit -qm "health $(date -u +%FT%H:%M)" && git push -q origin HEAD:main && break
            sleep 5
          done
