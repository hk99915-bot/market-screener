name: pick

# 진입 타점 대결 — 저장소 주인이 'pick YYYY-MM-DD' 이슈를 열면 그날 '나' 판단으로 기록하고 이슈를 닫는다.
# 'pick🔥 YYYY-MM-DD' = '나🔥' 공격 픽(모의 전용, 별도 채점). 'pick-us YYYY-MM-DD' = 미장 대결(id '<date>-entry-us', 마감 09:30 ET) — apply_issue 가 내부에서 미장 경로로 넘김.
# 'ticket <코드>' = 주문표(규정 [4], screener/ticket.py) — 매수가·손절가·목표가·근거·보유기간을 규칙 검사 후 kind 'ticket' 으로 기록, 답글에 판정표.
on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: pick
  cancel-in-progress: false

jobs:
  record:
    if: (startsWith(github.event.issue.title, 'pick') || startsWith(github.event.issue.title, 'exit') || startsWith(github.event.issue.title, 'ticket')) && github.event.issue.user.login == github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install polars requests
      - name: 큰 데이터 받기 (릴리스 data-latest → data/ — scripts/data_store.py, repo-size-stage1)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/data_store.py pull
      - name: 기록
        id: r
        env:
          TITLE: ${{ github.event.issue.title }}
          BODY: ${{ github.event.issue.body }}
          CREATED: ${{ github.event.issue.created_at }}
          SAT_BOOK_KRW: ${{ secrets.SAT_BOOK_KRW }}
          RISK_PCT: ${{ secrets.RISK_PCT }}
          MY_HOLDINGS: ${{ secrets.MY_HOLDINGS }}   # 주문표 VaR·백스톱 판정용(런타임만, 기록 안 함 — 결재 #3 · 감사 10/17 #12)
          MY_RULES: ${{ secrets.MY_RULES }}
        run: |
          python - <<'PY'
          import os
          from screener.duel import apply_exit_issue, apply_issue
          from screener.ticket import apply_ticket_issue
          tl = os.environ["TITLE"].lower()
          f = apply_ticket_issue if tl.startswith("ticket") else apply_exit_issue if tl.startswith("exit") else apply_issue   # pick / pick-us 모두 apply_issue
          msg = f(os.environ["TITLE"], os.environ.get("BODY") or "", os.environ["CREATED"])
          print(msg)
          open(os.environ["GITHUB_OUTPUT"], "a").write("msg<<EOF\n" + msg + "\nEOF\n")
          PY
      - name: 저장
        run: |
          git config user.name "screener-bot"; git config user.email "screener-bot@users.noreply.github.com"
          cp reports/decisions.json /tmp/dec.json
          cp ops/isa_buys.json /tmp/isa.json 2>/dev/null || true   # 결재 #15 ISA 카운터(날짜·종류만) — ISA 주문표 통과 시 갱신
          for i in 1 2 3; do
            git fetch -q origin main && git reset -q --hard origin/main
            [ -f /tmp/isa.json ] && cp /tmp/isa.json ops/isa_buys.json
            python - <<'PY'
          import json
          new = json.load(open("/tmp/dec.json", encoding="utf-8"))
          cur = json.load(open("reports/decisions.json", encoding="utf-8"))
          mine = {x["id"]: x for x in new["items"]}
          ids = [x["id"] for x in cur["items"]]
          for k, v in mine.items():   # '-entry' · '-entry-us' · '-exit-*' 모두 같은 규칙으로 병합, '-ticket-*' 는 통째로 교체
              if k in ids:
                  for x in cur["items"]:
                      if x["id"] == k:
                          if v.get("kind") == "ticket":
                              x.clear(); x.update(v); continue
                          x["picks"] = {**x["picks"], **{s: v["picks"][s] for s in ("나", "나🔥") if s in v["picks"]}} if (v.get("kind") != "exit" or "PB" in x["picks"] and x["picks"]["PB"].get("by")) else v["picks"]
              else:
                  cur["items"].append(v)
          open("reports/decisions.json", "w", encoding="utf-8").write(json.dumps(cur, ensure_ascii=False, indent=1))
          PY
            git add reports/decisions.json; [ -f ops/isa_buys.json ] && git add ops/isa_buys.json; git diff --cached --quiet && break
            git commit -qm "pick: ${{ github.event.issue.title }}" && git push -q origin HEAD:main && break
            sleep 5
          done
      - name: 답글·닫기
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment ${{ github.event.issue.number }} --repo ${{ github.repository }} --body-file - <<'MSG'
          ${{ steps.r.outputs.msg }}
          MSG
          gh issue close ${{ github.event.issue.number }} --repo ${{ github.repository }}
      - name: 텔레그램 결과 (pick·pick-us 만 — 버튼으로 낸 선택이 반영됐는지 폰에서 바로 보이게, tg-pick-buttons)
        if: startsWith(github.event.issue.title, 'pick')
        continue-on-error: true
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN || secrets.TELE }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || secrets.TELE_CHAT }}
          MSG: ${{ steps.r.outputs.msg }}
          TITLE: ${{ github.event.issue.title }}
        run: |
          python - <<'PY'
          import os
          from screener.report import send_telegram
          send_telegram("🎯 " + os.environ["TITLE"] + "\n" + os.environ.get("MSG", ""))
          PY
