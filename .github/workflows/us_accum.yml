name: us_accum

# 미국 매집 흔적 스캔 (퀀트, 2026-10-17) — 평일 07:37 KST = 22:37 UTC (월~금 = 미장 월~금 마감분).
# briefing.yml 의 06:52 KST screen_us 가 reports/detail/US/*.json 종가를 갱신한 뒤에 돈다(07:10 valuation 다음).
# 네트워크 없음 · 텔레그램 없음 · reports/us_accum.json 만 커밋. 다른 워크플로를 건드리지 않는다.
# 롤백: 이 파일 삭제(산출물만 멈춤). 연구 재실행은 수동: python3 scripts/study_us_accum.py
on:
  schedule:
    - cron: "37 22 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: us_accum
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install numpy pandas
      - name: 스캔
        env:
          PYTHONUNBUFFERED: "1"
        run: python -m screener.us_accum
      - name: 저장
        if: always()
        run: |
          git config user.name "screener-bot"
          git config user.email "screener-bot@users.noreply.github.com"
          [ -e reports/us_accum.json ] && git add reports/us_accum.json; true
          git diff --cached --quiet || git commit -m "us_accum: $(date -u +%F)"
          ok=0
          for i in 1 2 3 4; do git pull --rebase -X theirs origin main && git push && { ok=1; break; }; git rebase --abort 2>/dev/null || true; sleep $((i*5)); done
          [ $ok = 1 ] || echo "::warning::푸시 실패 — 결과가 저장되지 않음"; true
