name: live-quotes
# 실행 이름 — scripts/slot_guard.py 가 display_title 로 같은 슬롯의 GAS 실행을 찾는다 (결정 C, docs/schedule_table.md)
run-name: "live-quotes ${{ github.event_name == 'workflow_dispatch' && format('수동 commit={0}', inputs.commit) || format('예약 {0}', github.event.schedule) }}"

# 지수·매크로 준실시간 → reports/live.json. 짧은 주기 스케줄은 GitHub 가 자주 건너뛰므로,
# 장 시작 무렵 한 번 켜지면 장이 끝날 때까지 한 작업 안에서 5분마다 갱신하는 루프로 돈다.
# 루프 시작 스케줄이 빠질 때를 대비해 매시 백업 트리거도 둔다 (이미 돌고 있으면 대기 후 이어받음).
# 결정 C: 08:40·22:20 은 GAS 가 주 실행 주체, 같은 시각 cron 은 대기(slot_guard). 매시 백업은 '루프 재개' — concurrency 로 동시 1개,
# 루프가 끝난 뒤 대기열에서 깨어난 실행은 장 시간 밖이면 아무것도 안 하고 끝난다(예전엔 1회 시세 커밋).
on:
  schedule:
    - cron: "40 23 * * 0-4"     # 08:40 KST 국장 루프 시작
    - cron: "7 0-6 * * 1-5"     # 국장 시간 매시 백업
    - cron: "20 14 * * 1-5"     # 23:20 KST 미장 루프 시작 (겨울 EST: 09:20 ET = 14:20 UTC, 11/02~. 여름(EDT, 3월 둘째 일요일~)엔 20 13 = 22:20 KST 로 되돌릴 것 — 보드 live-us-dst-march)
    - cron: "7 14-20 * * 1-5"   # 미장 시간 매시 백업 (겨울 23:07–05:07 KST. 여름엔 14-19)
  workflow_dispatch:
    inputs:
      commit:
        description: "true 일 때만 live.json 커밋. auto(기본) = GAS 예약 슬롯(08:40·22:20) 시각이면 커밋, 그 밖의 수동 실행은 읽기 전용"
        required: false
        default: "auto"

permissions:
  contents: write
  actions: read

concurrency:
  group: live
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 실행 주체 확인 (결정 C — GAS 슬롯이면 cron 은 +12분 대기 후 GAS 실행 시 건너뜀 · 수동은 commit 입력)
        id: g
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SCHEDULE: ${{ github.event.schedule }}
          COMMIT_INPUT: ${{ inputs.commit }}
        run: python scripts/slot_guard.py --wf live.yml || { echo "::warning::slot_guard 실패 — 실행(fail-open)"; echo "go=true" >> $GITHUB_OUTPUT; [ "${{ github.event_name }}" != "workflow_dispatch" ] || [ "${{ inputs.commit }}" = "true" ] && echo "commit=true" >> $GITHUB_OUTPUT || echo "commit=false" >> $GITHUB_OUTPUT; }
      - name: 큰 데이터 받기 (릴리스 data-latest → data/ — scripts/data_store.py, repo-size-stage1)
        if: steps.g.outputs.go == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/data_store.py pull
      - name: 루프
        if: steps.g.outputs.go == 'true'
        env:
          PYTHONUNBUFFERED: "1"
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN || secrets.TELE }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || secrets.TELE_CHAT }}
          MY_RULES: ${{ secrets.MY_RULES }}           # 이벤트 감시(touch·손절선)만 읽음 — 값은 로그·파일에 안 씀
          MY_HOLDINGS: ${{ secrets.MY_HOLDINGS }}
          EVENT_STATE: /tmp/ev/event_state.json       # 작업 중 상태는 /tmp — 커밋 단계의 reset --hard 가 덮지 않게
        run: |
          git config user.name "screener-bot"
          git config user.email "screener-bot@users.noreply.github.com"
          in_window() {   # KST 08:40–15:50 (국장) 또는 미장 09:15–16:15 ET (= 여름 22:15–05:15 · 겨울 23:15–06:15 KST, 서머타임은 tz 가 처리), 주말 제외 대략
            hm=$(TZ=Asia/Seoul date +%H%M); hm=$((10#$hm))
            [ $hm -ge 840 ] && [ $hm -le 1550 ] && return 0
            et=$(TZ=America/New_York date +%H%M); et=$((10#$et))
            [ $et -ge 915 ] && [ $et -le 1615 ] && return 0
            return 1
          }
          COMMIT="${{ steps.g.outputs.commit }}"
          # 대기열에서 늦게 깨어난 예약·백업 실행이 장 시간 밖이면 끝 (수동 실행만 1회 허용)
          if ! in_window && [ "${{ github.event_name }}" != "workflow_dispatch" ]; then echo "장 시간 밖 예약 실행 — 건너뜀"; exit 0; fi
          # 장중 이벤트 감시 (오너 10/17 "사건이 터지면 바로") — 약 60초마다 백그라운드. 장 시간 밖이면 event_watch 가 바로 끝남
          mkdir -p /tmp/ev; if [ -e reports/event_state.json ]; then cp reports/event_state.json /tmp/ev/; fi
          ( while true; do t0=$SECONDS; timeout 50 python -m screener.event_watch || true; d=$((60 - (SECONDS - t0))); [ $d -lt 5 ] && d=5; sleep $d; done ) &
          EW_PID=$!; trap 'kill $EW_PID 2>/dev/null || true' EXIT
          end=$((SECONDS + 340*60))
          first=1
          hm_i=0
          while [ $SECONDS -lt $end ]; do
            if ! in_window && [ $first -eq 0 ]; then echo "장 시간 종료"; break; fi
            first=0
            python -m screener.main --mode quotes --no-send || true
            # 히트맵 1D 장중 갱신 (보드 maint-heatmap 10/21 유지보수): KR 매 회차(약 5분, 10/24부터 토스 우선·네이버 폴백) · US 3회차마다(약 15분, heatmap.yml cron 누락 대비 편승).
            # 창 밖이면 각 모듈이 바로 끝남(KR 09:00~15:50 · US 정규장+30분). 실패해도 루프는 계속 — 화면 기준 시각·STALE·신선도 계약이 잡는다.
            # 같은 시세로 reports/intraday_last.json(종목 상세 차트 '오늘 잠정 봉', screener/intraday_last.py)도 갱신 — 상세 2천 파일 재작성 대신(10/24)
            timeout 170 python -m screener.heatmap_kr || true
            if [ $((hm_i % 3)) -eq 0 ]; then timeout 240 python -m screener.heatmap || true; fi
            hm_i=$((hm_i + 1))
            hm=$(TZ=Asia/Seoul date +%H%M); hm=$((10#$hm)); dow=$(TZ=Asia/Seoul date +%u)
            rm -f /tmp/duel_ran
            if [ $dow -le 5 ] && [ $hm -ge 1450 ] && [ $hm -le 1515 ]; then python -m screener.main --mode duel && touch /tmp/duel_ran || true; fi
            if [ "$COMMIT" != "true" ]; then echo "읽기 전용 — 커밋 안 함 (commit=true 로 다시 실행)"; in_window || break; sleep 300; continue; fi
            # 다른 작업이 같은 파일을 커밋하면 rebase 가 충돌로 멈춰 이후 갱신이 전부 막힘 → 매번 원격 최신 위에 파일만 다시 얹는다
            rm -rf /tmp/hm; mkdir -p /tmp/hm; for p in reports/heatmap_KR.json reports/heatmap_US.json reports/intraday_last.json; do if [ -e "$p" ]; then cp "$p" /tmp/hm/; fi; done   # 히트맵은 asof 가 새로울 때만 얹음(heatmap.yml 이 먼저 쓴 더 새 값 보존)
            rm -rf /tmp/lv; mkdir -p /tmp/lv; for p in reports/live.json reports/events.json reports/events_stats.json; do if [ -e "$p" ]; then cp "$p" /tmp/lv/; fi; done
            if [ -e /tmp/duel_ran ]; then cp reports/decisions.json /tmp/dec_live.json; fi   # 통째로 덮지 않고 병합 (감사 10/21 #1)
            if [ -e /tmp/ev/event_state.json ]; then cp /tmp/ev/event_state.json /tmp/lv/; fi   # 이벤트 중복 방지 상태(금액 0·보유 코드 해시)   # 판정한 회차에만 (다른 때 덮으면 제출된 겸이 판단이 지워짐)
            for i in 1 2 3; do
              git rebase --abort 2>/dev/null || true   # 진행 중인 rebase 없으면 실패 → bash -e 가 루프를 죽였음
              git fetch -q origin main && git reset -q --hard origin/main || { sleep 5; continue; }
              for f in /tmp/lv/*; do if [ -e "$f" ]; then cp "$f" reports/; fi; done   # 시세 실패로 비면 cp 실패 → bash -e 가 루프를 죽였음
              for f in /tmp/hm/*; do if [ -e "$f" ]; then python -m screener.heatmap_kr --put "$f" "reports/$(basename "$f")" || true; fi; done
              if [ -e /tmp/duel_ran ]; then python scripts/merge_decisions.py live /tmp/dec_live.json; fi   # 직전에 push 된 pick 보존
              for p in reports/live.json reports/events.json reports/events_stats.json reports/decisions.json reports/event_state.json reports/heatmap_KR.json reports/heatmap_US.json reports/intraday_last.json; do if [ -e "$p" ]; then git add "$p"; fi; done
              git diff --cached --quiet && break
              git commit -qm "live: $(date -u +%FT%H:%M)" && git push -q origin HEAD:main && break || true
              sleep 5
            done
            in_window || break
            sleep 300   # 5분 간격 (10/16 겸이 요청, 기존 10분)
          done
