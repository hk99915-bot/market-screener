name: live-quotes

# 지수·매크로 준실시간 스냅샷 → reports/live.json (웹 터미널 상단 티커가 1분마다 읽음)
# GitHub 스케줄은 수 분~수십 분 밀릴 수 있다.
on:
  schedule:
    - cron: "*/15 0-6 * * 1-5"    # 09:00–15:59 KST 국장 시간
    - cron: "*/30 13-20 * * 1-5"  # 22:00–05:59 KST 미장 시간
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: live
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 스냅샷
        env:
          PYTHONUNBUFFERED: "1"
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
        run: python -m screener.main --mode quotes --no-send
      - name: 저장
        run: |
          git config user.name "screener-bot"
          git config user.email "screener-bot@users.noreply.github.com"
          git add reports/live.json
          git diff --cached --quiet && exit 0
          git commit -m "live: $(date -u +%FT%H:%M)"
          for i in 1 2 3; do git pull --rebase origin main && git push && break; sleep 5; done
