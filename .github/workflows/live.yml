name: live-quotes

# 지수·매크로 준실시간 → reports/live.json. 짧은 주기 스케줄은 GitHub 가 자주 건너뛰므로,
# 장 시작 무렵 한 번 켜지면 장이 끝날 때까지 한 작업 안에서 10분마다 갱신하는 루프로 돈다.
# 루프 시작 스케줄이 빠질 때를 대비해 매시 백업 트리거도 둔다 (이미 돌고 있으면 대기 후 이어받음).
on:
  schedule:
    - cron: "40 23 * * 0-4"     # 08:40 KST 국장 루프 시작
    - cron: "7 0-6 * * 1-5"     # 국장 시간 매시 백업
    - cron: "20 13 * * 1-5"     # 22:20 KST 미장 루프 시작
    - cron: "7 14-19 * * 1-5"   # 미장 시간 매시 백업
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: live
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 루프
        env:
          PYTHONUNBUFFERED: "1"
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN || secrets.TELE }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || secrets.TELE_CHAT }}
        run: |
          git config user.name "screener-bot"
          git config user.email "screener-bot@users.noreply.github.com"
          in_window() {   # KST 08:40–15:50 (국장) 또는 22:15–05:15 (미장), 주말 제외 대략
            hm=$(TZ=Asia/Seoul date +%H%M); hm=$((10#$hm))
            [ $hm -ge 840 ] && [ $hm -le 1550 ] && return 0
            [ $hm -ge 2215 ] || [ $hm -le 515 ] && return 0
            return 1
          }
          end=$((SECONDS + 340*60))
          first=1
          while [ $SECONDS -lt $end ]; do
            if ! in_window && [ $first -eq 0 ]; then echo "장 시간 종료"; break; fi
            first=0
            python -m screener.main --mode quotes --no-send || true
            # 다른 작업이 같은 파일을 커밋하면 rebase 가 충돌로 멈춰 이후 갱신이 전부 막힘 → 매번 원격 최신 위에 파일만 다시 얹는다
            mkdir -p /tmp/lv; for p in reports/live.json reports/events.json reports/events_stats.json; do [ -e "$p" ] && cp "$p" /tmp/lv/; done
            for i in 1 2 3; do
              git rebase --abort 2>/dev/null; git fetch -q origin main && git reset -q --hard origin/main
              for f in /tmp/lv/*; do cp "$f" reports/; done
              git add reports/live.json; for p in reports/events.json reports/events_stats.json; do [ -e "$p" ] && git add "$p"; done
              git diff --cached --quiet && break
              git commit -qm "live: $(date -u +%FT%H:%M)" && git push -q origin HEAD:main && break
              sleep 5
            done
            in_window || break
            sleep 600
          done
