name: qld_dca_data

# 일회성 연구 데이터 수집 (퀀트, 10/21 겸이 'QLD 매일 1만원 적립 백테스트'). workflow_dispatch 전용 · 텔레그램 없음.
# 컨테이너가 야후·FRED 차단 → 여기서 받아 study-data/qld-dca 브랜치에만 CSV 커밋(main 미변경). 끝나면 이 파일 삭제 가능.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 수집
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python scripts/fetch_qld_dca.py | tee fetch.txt
          python - <<'PY'
          t = open("fetch.txt", encoding="utf-8").read()
          print("::notice title=fetch::" + t.replace("%", "%25").replace("\r", "").replace("\n", "%0A")[:3500])
          PY
      - name: 브랜치에 올리기
        run: |
          git config user.name "screener-bot"; git config user.email "screener-bot@users.noreply.github.com"
          git checkout -B study-data/qld-dca
          git add -f data/study/qld_dca_px.csv
          git commit -qm "data: qld_dca 원자료 (일회성)"
          git push origin study-data/qld-dca
