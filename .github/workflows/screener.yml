name: market-screener
# 실행 이름 — scripts/slot_guard.py 가 display_title 로 같은 슬롯의 GAS 실행을 찾는다 (결정 C, docs/schedule_table.md)
run-name: "market-screener ${{ github.event_name == 'workflow_dispatch' && format('[{0}] commit={1}', inputs.market, inputs.commit) || format('예약 {0}', github.event.schedule) }}"

on:
  schedule:
    # KR 마감(15:30 KST) 후 — 16:20 KST = 07:20 UTC, 월~금
    # (KR 경로는 main.py 안에서 규정 알림 → 반도체 밸류에이션 바스켓(reports/valuation.json, 텔레그램 없음)까지 이어서 돈다)
    - cron: "20 7 * * 1-5"
    # US 스크리너(07:00 KST)는 스케줄이 안정적인 briefing.yml 로 이동. 여기서는 수동 실행만.
  workflow_dispatch:
    inputs:
      market:
        description: "KR 또는 US"
        required: true
        default: "KR"
      no_send:
        description: "텔레그램 생략 (검증용 재실행)"
        required: false
        default: "false"
      commit:
        description: "true 일 때만 결과 커밋. auto(기본) = GAS 예약 슬롯(16:20 KR) 시각이면 커밋, 그 밖의 수동 실행은 읽기 전용"
        required: false
        default: "auto"

permissions:
  contents: write
  actions: read

concurrency:
  group: screener
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 시장 결정 · 실행 주체 확인 (결정 C — 16:20 cron 은 GAS 슬롯의 대기, +12분 뒤 GAS 실행 있으면 건너뜀)
        id: m
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SCHEDULE: ${{ github.event.schedule }}
          COMMIT_INPUT: ${{ inputs.commit }}
          KEY_INPUT: ${{ inputs.market }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then M="${{ inputs.market }}"; else M=KR; fi
          python scripts/slot_guard.py --wf screener.yml --key "$M" || { echo "::warning::slot_guard 실패 — 실행(fail-open)"; echo "go=true" >> $GITHUB_OUTPUT; [ "${{ github.event_name }}" != "workflow_dispatch" ] || [ "${{ inputs.commit }}" = "true" ] && echo "commit=true" >> $GITHUB_OUTPUT || echo "commit=false" >> $GITHUB_OUTPUT; }
          if grep -q '^go=false' "$GITHUB_OUTPUT"; then echo "market=skip" >> $GITHUB_OUTPUT; else echo "market=$M" >> $GITHUB_OUTPUT; fi

      - name: 스크리너 실행
        if: steps.m.outputs.market != 'skip'
        env:
          PYTHONUNBUFFERED: "1"
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN || secrets.TELE }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || secrets.TELE_CHAT }}
          MY_HOLDINGS: ${{ secrets.MY_HOLDINGS }}
          MY_RULES: ${{ secrets.MY_RULES }}
          RULE_STOP_LEVEL: ${{ secrets.RULE_STOP_LEVEL }}
          RULE_DEADLINE: ${{ secrets.RULE_DEADLINE }}
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          KRX_BACKEND: ${{ vars.KRX_BACKEND || 'pykrx' }}
          KRX_API_KEY: ${{ secrets.KRX_API_KEY }}
          GSHEET_ID: ${{ secrets.GSHEET_ID }}
          GCP_SA_JSON: ${{ secrets.GCP_SA_JSON }}
        run: python -m screener.main --market ${{ steps.m.outputs.market }} ${{ github.event.inputs.no_send == 'true' && '--no-send' || '' }}

      - name: 읽기 전용 (수동 실행 commit≠true — 결과는 커밋하지 않음)
        if: always() && steps.m.outputs.market != 'skip' && steps.m.outputs.commit != 'true'
        run: git status --short | head -50; echo "읽기 전용 실행 — 커밋하려면 commit=true 로 다시 실행"

      - name: 리포트·유니버스 커밋
        if: always() && steps.m.outputs.commit == 'true'
        run: |
          git config user.name "screener-bot"
          git config user.email "screener-bot@users.noreply.github.com"
          for p in reports universe data/kr_prices.parquet data/research.parquet data/dart.parquet data/signals.parquet data/short_hist.parquet; do [ -e "$p" ] && git add -A "$p"; done; true
          git diff --cached --quiet || git commit -m "report: ${{ steps.m.outputs.market }} $(date -u +%F)"
          # 커밋 대상이 아닌 변경(교정된 parquet 등)이 남으면 rebase 가 거부돼 푸시가 조용히 실패 → 치워둔다
          git stash -q -u 2>/dev/null || true
          # 역행 검사: rebase 뒤 HEAD 의 산출물 날짜가 원격 main 보다 과거면 그 파일은 원격 판으로 되돌림 (10/17 detail_us 역행 — 수동·주말 실행 포함)
          ok=0
          for i in 1 2 3 4; do git pull --rebase -X theirs origin main && python -m screener.regress_git && git push && { ok=1; break; }; git rebase --abort 2>/dev/null || true; sleep $((i*5)); done
          [ $ok = 1 ] || echo "::warning::푸시 실패 — 결과가 저장되지 않음"; true
