name: tests

# 순수 로직 회귀 검사 — main 푸시·PR 마다 pytest (네트워크 없이 도는 tests/ 만, 수 초).
# 대결 이슈 파싱(pick·pick🔥)·trail 청산 무장·이벤트 '발동' 필터·운용회의 Δ 한 줄.
on:
  push:
    branches: [main]
    paths: ["screener/**", "scripts/**", "tests/**", "docs/**", "requirements.txt", ".github/workflows/**", "apps-script/**", "index.html"]   # apps-script 화면·index.html 도 (req-dev-7406791f — 10/29 재생성 커밋이 CI 안 돌림)
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pytest pyyaml   # pyyaml: tests/test_schedule_single.py (워크플로·예약 파싱)
      - run: python -m pytest -q

  # slop 감사(자동 항목만) — 경고 주석만 남기고 워크플로는 실패시키지 않는다 (치명은 ::error 주석 + 보드 P0 로 사람이 처리).
  slop-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 40
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/slop_audit.py --ci
