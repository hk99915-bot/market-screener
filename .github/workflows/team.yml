name: team
# 팀 업무량(PM 소관) 자동 갱신 — 사람·에이전트가 main 에 push 할 때마다 (10/17 오너: "모든 작업이 활성화될 때 PM 은 자동으로")
# 봇(GITHUB_TOKEN) push 는 워크플로를 다시 깨우지 않으므로 무한 반복 없음. 데이터·보고서만 바뀐 push 는 건너뜀.
on:
  push:
    branches: [main]
    paths-ignore: ["reports/**", "data/**", "ops/team.json", "index.html"]
  workflow_dispatch:
concurrency:
  group: team-stats
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # 7일 커밋 집계에 이력 필요
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 팀 업무량 갱신
        run: python scripts/team_stats.py || echo "::warning::team_stats 실패"
      - name: 저장
        run: |
          git config user.name "screener-bot"
          git config user.email "screener-bot@users.noreply.github.com"
          git add ops/team.json
          git diff --cached --quiet && exit 0
          git commit -m "team: $(date -u +%FT%H:%M) (push 트리거)"
          for i in 1 2 3 4; do git pull --rebase -X theirs origin main && git push && break; git rebase --abort 2>/dev/null || true; sleep $((i*5)); done
