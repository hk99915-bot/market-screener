name: team
# 팀 업무량(PM 소관) 자동 갱신 — 매시 (10/17 오너 "PM 자동 갱신"을 매시로 충족). push 트리거는 push 마다 봇 커밋이 생겨 뺐음 (감사 10/21 #5).
# 7일 집계라 8일치만 얕게 받는다. ops.yml 23:47·00:07 은 하루 마감용으로 그대로.
on:
  schedule:
    - cron: "17 * * * *"   # 매시 17분 (정각 혼잡 회피)
  workflow_dispatch:
    inputs:
      commit:
        description: "true 일 때만 결과 커밋 (기본 false = 읽기 전용 — 결정 C: 수동 실행이 예약 산출물을 덮어쓰지 않게)"
        required: false
        default: "false"
concurrency:
  group: team-stats
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: 8일치 이력만 (7일 커밋 집계)
        run: git fetch -q --shallow-since="$(date -u -d '8 days ago' +%F)" origin main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 팀 업무량 갱신
        run: python scripts/team_stats.py || echo "::warning::team_stats 실패"
      - name: 사내톡 피드 갱신 (SYSTEM › 사내톡, 10/23 겸이 "자동갱신되게")
        run: python scripts/msgr_feed.py || echo "::warning::msgr_feed 실패"
      - name: 저장
        if: (github.event_name != 'workflow_dispatch' || inputs.commit == 'true')
        run: |
          git config user.name "screener-bot"
          git config user.email "screener-bot@users.noreply.github.com"
          git add ops/team.json reports/msgr_feed.md
          git diff --cached --quiet && exit 0
          git commit -m "team: $(date -u +%FT%H:%M) (매시)"
          # -X theirs 금지(포니테일 #1, req-dev-cc84f898): ops/team.json 의 runs 는 PB team_run 이 쓰는 행이라 rebase 로 이번 판이 덮으면 그새 들어온 행이 사라짐.
          # push 가 거부되면 원격 최신으로 reset → team_stats(auto 블록만 씀, runs·earlier 는 건드리지 않음)를 그 위에서 다시 돌려 커밋.
          ok=0
          for i in 1 2 3 4; do
            git push origin HEAD:main && { ok=1; break; }
            sleep $((i*5))
            git fetch -q --shallow-since="$(date -u -d '8 days ago' +%F)" origin main && git reset -q --hard origin/main || continue
            python scripts/team_stats.py >/dev/null || true
            python scripts/msgr_feed.py >/dev/null || true
            git add ops/team.json reports/msgr_feed.md
            git diff --cached --quiet && { ok=1; break; }
            git commit -qm "team: $(date -u +%FT%H:%M) (원격 최신 위 재생성)" || true
          done
          [ $ok = 1 ] || echo "::warning::푸시 실패 — 결과가 저장되지 않음"; true
