name: paper_ingest

on:
  schedule:
    - cron: "0 18 * * 6"
  workflow_dispatch:
    inputs:
      commit:
        description: "true 일 때만 결과 커밋 (기본 false = 읽기 전용)"
        required: false
        default: "false"

permissions:
  contents: write

concurrency:
  group: papers
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 수집 (7소스 → content/papers/index.json)
        run: python3 scripts/papers_ingest.py
      - name: 가드 (장부·lit 서지·철회·길이)
        run: python3 scripts/paper_lit_check.py --ci
      - name: 저장
        if: success() && (github.event_name != 'workflow_dispatch' || inputs.commit == 'true')
        run: |
          git config user.name "screener-bot"
          git config user.email "screener-bot@users.noreply.github.com"
          git add content/papers/index.json
          git diff --cached --quiet && { echo "변경 없음"; exit 0; }
          git commit -m "papers: 주간 수집 $(date -u +%F) [운영] index.json"
          ok=0
          for i in 1 2 3 4; do git pull --rebase -X theirs origin main && git push && { ok=1; break; }; git rebase --abort 2>/dev/null || true; sleep $((i*5)); done
          [ $ok = 1 ] || { echo "::warning::푸시 실패 — 이번 주 색인이 저장되지 않음"; exit 1; }
