<script>
let MG=null, MGS='live', MGD='all', MGP=null, MGPOP=false;
/* 프사·이름 누르면 프로필 — 문서 전체 위임이라 사내톡 탭·🔒 비공개 사담·💬 팝업 어디서든 (10/23 겸이 "비공개 사내톡에서도 클릭하면 프로필") */
document.addEventListener('click',e=>{ const t=e.target.closest&&e.target.closest('[data-mgp]'); if(t&&MG&&MG.profiles) mgProf(t.dataset.mgp); });
/* 💬 팝업 채팅방(10/23 겸이 "사내톡이 팝업 채팅방처럼 열리게") — 모든 탭 오른쪽 아래 버튼 → 떠 있는 창에 같은 사내톡(msgView). 사내톡 탭 안에선 탭 그대로. */
function mgRe(load){ if(MGPOP) mgPopFill(); else if(!load||view==='msg') render(); }
function mgPopFill(){ const w=document.getElementById('mgpop'); if(w) w.querySelector('.mgpb').innerHTML=msgView(); }
/* 💬 팝업은 최신(맨 아래)부터 (UXUI 재진단 Top10 #2, 10/23): 팝업에선 스크롤 박스가 #mgbox 가 아니라 바깥 .mgpb → 대화 목록이 있을 때 .mgpb 도 맨 아래로 */
function mgPbEnd(box){ const pb=box&&box.closest('.mgpb'); if(pb) pb.scrollTop=pb.scrollHeight; }
function mgPop(open){ let w=document.getElementById('mgpop');
  if(!open||view==='msg'){ if(w) w.remove(); MGPOP=false; const f=document.getElementById('mgfab'); if(f) f.classList.remove('on'); return; }
  if(!w){ w=document.createElement('div'); w.id='mgpop'; w.setAttribute('role','dialog'); w.setAttribute('aria-label','사내톡');
    w.innerHTML='<div class="mgph"><b>💬 사내톡</b><span class="mu" style="font-size:var(--fs-1)">끌어서 옮기기</span><button type="button" aria-label="닫기">×</button></div><div class="mgpb"></div>';
    document.body.appendChild(w); w.querySelector('.mgph button').onclick=()=>mgPop(false);
    const h=w.querySelector('.mgph'); h.onpointerdown=e=>{ if(e.target.closest('button')||innerWidth<=600) return; const r=w.getBoundingClientRect(), dx=e.clientX-r.left, dy=e.clientY-r.top;
      const mv=ev=>{ w.style.left=Math.max(0,Math.min(innerWidth-r.width,ev.clientX-dx))+'px'; w.style.top=Math.max(0,Math.min(innerHeight-60,ev.clientY-dy))+'px'; w.style.right='auto'; w.style.bottom='auto'; };
      const up=()=>{ removeEventListener('pointermove',mv); removeEventListener('pointerup',up); }; addEventListener('pointermove',mv); addEventListener('pointerup',up); }; }
  MGPOP=true; mgPopFill(); }
setTimeout(()=>{ if(document.getElementById('mgfab')) return; const b=document.createElement('button'); b.id='mgfab'; b.type='button'; b.title='사내톡'; b.setAttribute('aria-label','사내톡 열기'); b.textContent='💬';
  b.onclick=()=>{ if(view==='msg') return; mgPop(!MGPOP); b.classList.toggle('on',MGPOP); };
  const T=document.querySelector('.top'), q=document.getElementById('sqb'); if(q&&q.parentNode===T) T.insertBefore(b,q); else if(T) T.appendChild(b); else document.body.appendChild(b); },0);
const MG_NM={pb:'PB',quant:'퀀트',dev:'개발',data:'데이터',audit:'감사',hf:'HF',frm:'리스크',verify:'검증',macro:'매크로',bonds:'채권',derivs:'파생',uxui:'UXUI',edu:'교육',peer:'피어리뷰',ops:'운영',behavior:'행동',maint:'유지보수',cio:'CIO',pm:'PM',analyst:'애널',alloc:'자산배분',life:'LIFE',eval:'평가',backtest:'백테스트',health:'헬스',realestate:'부동산',scribe:'기록',household:'내무',compliance:'컴플라이언스',posrisk:'포지션리스크',front:'프론트','겸이':'겸이'};
const MG_DOT={open:'var(--amber)',promoted:'var(--dn)',done:'var(--up)'};
const MG_ST={open:'진행 중',promoted:'마감 지남',done:'완료'};
function mgNm(k){ return MG_NM[k]||k||'?'; }
function mgHue(k){ let h=0; for(const c of String(k)) h=(h*31+c.charCodeAt(0))%360; return h; }
const MG_IMG='https://raw.githubusercontent.com/hk99915-bot/market-screener/main/assets/avatars/';   // 프로필 사진(겸이가 GPT 로 만들어 올림, assets/avatars/<키>.png) — 없으면 이니셜 원
function mgAv(k){ const ini=esc(mgNm(k).slice(0,2)), bg=k==='겸이'?'#ff9a1f':`hsl(${mgHue(k)} 45% 62%)`;
  return `<div class="mgav" role="button" tabindex="0" title="프로필" data-mgp="${esc(k)}" style="background:${bg};overflow:hidden;cursor:pointer"><span>${ini}</span><img src="${MG_IMG}${encodeURIComponent(k==='겸이'?'owner':k)}.png" alt="" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover" loading="lazy" onerror="this.remove()"></div>`; }
/* 원본 보기(10/23 겸이 "한 번씩 더 누르면 원본, 크기 조절 가능하게") — 휠·핀치·두 번 탭(1x↔2.5x)·끌기·＋/－ */
function mgZoom(src){ if(!src) return; const o=document.createElement('div'); o.style.cssText='position:fixed;inset:0;background:#000;z-index:120;overflow:hidden;touch-action:none';
  o.innerHTML=`<img src="${src}" alt="" draggable="false" style="position:absolute;left:50%;top:50%;max-width:100vw;max-height:100vh;transform-origin:center;user-select:none;will-change:transform">
    <div style="position:absolute;right:8px;top:8px;display:flex;gap:6px">${['－','＋','×'].map(t=>`<button type="button" data-z="${t}" style="min-width:44px;min-height:44px;border:0;border-radius:50%;background:#0009;color:#fff;font-size:var(--fs-icon);cursor:pointer">${t}</button>`).join('')}</div>`;
  const im=o.querySelector('img'); let s=1,x=0,y=0; const P=new Map(); let d0=0,s0=1,lt=0;
  const ap=()=>{ im.style.transform=`translate(calc(-50% + ${x}px),calc(-50% + ${y}px)) scale(${s})`; }; ap();
  const zs=v=>{ s=Math.max(1,Math.min(6,v)); if(s===1){ x=0; y=0; } ap(); };
  o.querySelectorAll('[data-z]').forEach(b=>b.onclick=e=>{ e.stopPropagation(); const t=b.dataset.z; if(t==='×') o.remove(); else zs(s*(t==='＋'?1.5:1/1.5)); });
  o.addEventListener('wheel',e=>{ e.preventDefault(); zs(s*(e.deltaY<0?1.15:1/1.15)); },{passive:false});
  o.onpointerdown=e=>{ if(e.target.closest('[data-z]')) return; o.setPointerCapture(e.pointerId); P.set(e.pointerId,{x:e.clientX,y:e.clientY}); if(P.size===2){ const [a,b]=[...P.values()]; d0=Math.hypot(a.x-b.x,a.y-b.y); s0=s; }
    const now=Date.now(); if(P.size===1&&now-lt<300) zs(s>1?1:2.5); lt=now; };
  o.onpointermove=e=>{ const q=P.get(e.pointerId); if(!q) return; if(P.size===2){ P.set(e.pointerId,{x:e.clientX,y:e.clientY}); const [a,b]=[...P.values()]; zs(s0*Math.hypot(a.x-b.x,a.y-b.y)/(d0||1)); return; }
    if(s>1){ x+=e.clientX-q.x; y+=e.clientY-q.y; ap(); } P.set(e.pointerId,{x:e.clientX,y:e.clientY}); };
  o.onpointerup=o.onpointercancel=e=>{ P.delete(e.pointerId); };
  document.body.appendChild(o); }

function mgProfClose(o){ if(o._key) document.removeEventListener('keydown',o._key); o.remove(); }
function mgProfGo(o,k,d){ const L=((MG&&MG.profiles)||[]); if(L.length<2) return; const i=L.findIndex(p=>p.key===k), n=L[(i+d+L.length)%L.length]; mgProfClose(o); mgProf(n.key); }
/* 🏢 조직도(10/24 겸이 "조직도도 그려줘") — docs/desk_kb/ORG.md(10/17 본부 구조) 그대로. 본부 대표는 소집·취합만, 지시권 없음. 노드 누르면 프로필(문서 위임 클릭). */
const MG_ORG=[
  ['투자전략본부','대표 CIO',['cio','alloc','macro','bonds','realestate','hf']],
  ['리서치본부','대표 퀀트',['quant','analyst','derivs','data']],
  ['리스크본부','대표 리스크',['frm','behavior','compliance','posrisk']],
  ['운영본부','대표 PM',['pm','ops','dev','front','scribe','uxui','maint']],
  ['교육본부','대표 교육',['edu','eval']],
  ['생활본부','대표 내무',['household','life']]];
function mgOrgNode(k,big){ const P=((MG&&MG.profiles)||[]).find(p=>p.key===k)||{name:mgNm(k)}; const sz=big?64:48;
  return `<div data-mgp="${esc(k)}" role="button" tabindex="0" style="display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;min-width:0;width:${big?84:68}px">
    <img src="${MG_IMG}${encodeURIComponent(k)}.png" alt="" loading="lazy" style="width:${sz}px;height:${sz}px;border-radius:38%;object-fit:cover;object-position:50% 22%;background:#222;border:1px solid var(--line)" onerror="this.style.visibility='hidden'">
    <div style="font-size:var(--fs-1);text-align:center;line-height:1.25;overflow-wrap:anywhere"><b>${esc(P.name||k)}</b>${P.age?`<span class="mu"> ${P.age}</span>`:''}</div></div>`; }
function mgOrg(){
  const box=(t,sub,ks)=>`<div style="border:1px solid var(--line);padding:8px;min-width:0"><div style="font-size:var(--fs-2);color:var(--amber)"><b>${esc(t)}</b> <span class="mu" style="font-size:var(--fs-1)">${esc(sub)}</span></div><div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:6px">${ks.map(k=>mgOrgNode(k)).join('')}</div></div>`;
  return `<div style="display:flex;flex-direction:column;align-items:center;gap:4px;margin:6px 0 10px">
      <div style="border:1px solid var(--amber);padding:6px 14px;font-size:var(--fs-2)"><b>겸이</b> <span class="mu" style="font-size:var(--fs-1)">결재권자</span></div>
      <div style="width:1px;height:12px;background:var(--line)"></div>
      ${mgOrgNode('pb',true)}<div class="mu" style="font-size:var(--fs-1)">창구·종합·추천</div>
      <div style="width:1px;height:12px;background:var(--line)"></div></div>
    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(min(300px,100%),1fr));gap:8px">${MG_ORG.map(([t,s,ks])=>box(t,s,ks)).join('')}</div>
    <div style="margin-top:8px">${box('독립 검증실','겸이 직속 · 어느 본부에도 안 속함 · 무편집 발행권',['verify','peer','audit'])}</div>
    <details style="margin-top:8px"><summary class="mu" style="cursor:pointer;min-height:40px;display:flex;align-items:center;font-size:var(--fs-2)">프론트 · 미들 · 백 (기관 대응표)</summary>
      <div style="font-size:var(--fs-2);line-height:1.7;white-space:normal"><b>프론트</b>(판단·운용) PB·CIO·자산배분·매크로·채권·부동산·애널·퀀트·파생·HF<br><b>미들</b>(통제·측정 = 2선) 리스크·행동·컴플라이언스·포지션리스크·PM·검증<br><b>백</b>(처리·기록·인프라) 운영·데이터·개발·프론트 개발(화면)·기록·내무·유지보수·UXUI<br><b>3선 방어</b>(독립) 감사·피어리뷰 (+검증)<br><b>지원</b> 교육·평가·LIFE</div></details>`;
}
/* 👥 프로필 — 카톡처럼 세로 전체 배경 + 아래쪽 프사·이름·상태메시지. 배경·프사를 한 번 더 누르면 원본(mgZoom).
   배경: assets/avatars/bg/<key>.jpg|png (없으면 profiles.json bg 그라디언트) · 데이터 msgr_feed.profiles */
function mgProf(k){ const P=((MG&&MG.profiles)||[]).find(p=>p.key===k); if(!P) return;
  const av=`${MG_IMG}${encodeURIComponent(k)}.png`, o=document.createElement('div'); let bgSrc='';
  /* PC(10/23 겸이 "pc버전 최적화가 아쉽다 배경사진"): 세로 9:16 배경을 화면 전체로 늘리지 않고 가운데 폰 비율 카드 + 양옆은 같은 사진 흐림 처리. 폰은 그대로 전체 화면. */
  const g=P.bg||'linear-gradient(160deg,#333,#111)';
  o.style.cssText='position:fixed;inset:0;z-index:99;background:#000;display:grid;place-items:center;overflow:hidden;cursor:zoom-out;white-space:normal';
  o.innerHTML=`<div data-blur style="position:absolute;inset:-60px;background:${g};background-size:cover;background-position:center;filter:blur(28px) brightness(.45)"></div>
    <div data-ph class="mgpfc" style="position:relative;height:min(100dvh,940px);aspect-ratio:9/16;max-width:100vw;background:${g};background-size:cover;background-position:center;display:flex;flex-direction:column;overflow:hidden;cursor:zoom-in;box-shadow:0 10px 60px #000">
    <div style="position:absolute;inset:0;background:linear-gradient(180deg,#0006 0,#0000 22%,#0000 48%,#000c 100%);pointer-events:none"></div>
    <button type="button" data-x style="position:absolute;left:8px;top:8px;z-index:2;min-height:44px;min-width:44px;background:none;border:0;color:#fff;font-size:var(--fs-icon);cursor:pointer;text-shadow:0 1px 4px #000" aria-label="닫기">×</button>
    <div data-card style="margin-top:auto;position:relative;z-index:1;text-align:center;color:#fff;padding:0 16px 18px;cursor:default;text-shadow:0 1px 3px #000a">
      <img data-av src="${av}" alt="" style="width:104px;height:104px;border-radius:38%;object-fit:cover;object-position:50% 22%;cursor:zoom-in;background:#333;box-shadow:0 2px 10px #0008" onerror="this.style.visibility='hidden'">
      <div style="margin-top:8px;font-size:var(--fs-4);font-weight:700">${esc(P.name)}</div>
      ${P.msg?`<div style="margin-top:3px;font-size:var(--fs-3);opacity:.95">${esc(P.msg)}</div>`:''}
      ${P.bgm?`<div style="display:inline-block;margin-top:8px;font-size:var(--fs-2);background:#ffffff26;border-radius:14px;padding:4px 10px">🎵 ${esc(P.bgm)}</div>`:''}
      <details style="margin:12px auto 0;max-width:460px;text-align:left;background:#000a;border-radius:10px;padding:0 12px;font-size:var(--fs-2);line-height:1.6;text-shadow:none">
        <summary style="min-height:40px;display:flex;align-items:center;cursor:pointer;color:#ddd">${esc(P.dept)} · ${P.age}세 · 더보기</summary>
        <div style="padding-bottom:10px">${esc(P.line)}
        ${P.hobby?`<div style="margin-top:4px"><span class="am">취미</span> ${esc(P.hobby)}</div>`:''}
        ${P.role?`<div style="margin-top:4px"><span class="am">담당</span> ${esc(P.role)}</div>`:''}
        <div style="margin-top:6px;color:#bbb;font-size:var(--fs-2)">받은 요청(진행 중) ${P.open_in} · 보낸 요청 ${P.sent} · 직접 답장 ${P.replies}</div>
        ${P.last_chat?`<div style="margin-top:6px;border-left:2px solid var(--amber);padding-left:8px">최근 사담: ${esc(P.last_chat)}</div>`:''}</div></details>
    </div></div>`;
  const tryBg=ex=>{ const u=`${MG_IMG}bg/${encodeURIComponent(k)}.${ex}`, i=new Image(); i.onload=()=>{ bgSrc=u; o.querySelectorAll('[data-ph],[data-blur]').forEach(el=>el.style.backgroundImage=`url('${u}')`); }; i.onerror=()=>{ if(ex==='jpg') tryBg('png'); }; i.src=u; }; tryBg('jpg');
  o.onclick=e=>{ if(o._sw){ o._sw=0; return; } if(e.target.closest('[data-nav]')) return mgProfGo(o,k,+e.target.closest('[data-nav]').dataset.nav); if(e.target.closest('[data-x]')) return mgProfClose(o); if(e.target.closest('[data-av]')) return mgZoom(av); if(e.target.closest('[data-card]')) return; if(!e.target.closest('[data-ph]')) return mgProfClose(o); if(bgSrc) mgZoom(bgSrc); };
  /* 옆으로 넘기기(10/23 겸이 "프로필 창에서 옆으로 넘겨서 다른 누나들 볼 수 있게") — 폰: 좌우 스와이프 · PC: 양옆 ‹ › 버튼·←/→ 키 · 순서 = 프로필 목록(부서별) */
  const L=((MG&&MG.profiles)||[]), idx=L.findIndex(p=>p.key===k), ph=o.querySelector('[data-ph]');
  if(L.length>1){ ['-1','1'].forEach(d=>{ const b=document.createElement('button'); b.type='button'; b.dataset.nav=d; b.className='mgnav'; b.setAttribute('aria-label',d==='1'?'다음 누나':'이전 누나'); b.textContent=d==='1'?'›':'‹'; b.style.cssText=`position:absolute;top:50%;${d==='1'?'right':'left'}:8px;transform:translateY(-50%);z-index:3;width:44px;height:64px;border:0;border-radius:12px;background:#0006;color:#fff;font-size:var(--fs-icon);cursor:pointer`; o.appendChild(b); });
    const cnt=document.createElement('div'); cnt.style.cssText='position:absolute;right:12px;top:14px;z-index:2;color:#fff;font-size:var(--fs-2);text-shadow:0 1px 3px #000'; cnt.textContent=`${idx+1} / ${L.length}`; ph.appendChild(cnt); }
  let sx=null, sy=0; ph.addEventListener('pointerdown',e=>{ if(e.pointerType==='mouse') return; sx=e.clientX; sy=e.clientY; });
  ph.addEventListener('pointerup',e=>{ if(sx==null) return; const dx=e.clientX-sx, dy=e.clientY-sy; sx=null; if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)*1.5){ o._sw=1; mgProfGo(o,k,dx<0?1:-1); } });
  o._key=ev=>{ if(ev.key==='ArrowRight') mgProfGo(o,k,1); else if(ev.key==='ArrowLeft') mgProfGo(o,k,-1); else if(ev.key==='Escape') mgProfClose(o); }; document.addEventListener('keydown',o._key);
  document.body.appendChild(o); }
function mgProfGrid(){ const L=(MG&&MG.profiles)||[]; if(!L.length) return '<div class="mgempty">프로필 데이터 없음 — scripts/msgr_feed.py</div>';
  const by={}; L.forEach(p=>(by[p.dept]=by[p.dept]||[]).push(p));
  return Object.entries(by).map(([d,ps])=>`<div class="mgday">${esc(d)}</div><div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(min(200px,44vw),1fr));gap:8px">${ps.map(p=>`<button type="button" data-mgp="${esc(p.key)}" style="text-align:left;background:var(--panel);border:1px solid var(--line);color:var(--txt);font:inherit;padding:8px;cursor:pointer;min-width:0;white-space:normal">
    <img src="${MG_IMG}${encodeURIComponent(p.key)}.png" alt="" loading="lazy" style="width:100%;aspect-ratio:4/5;object-fit:cover;object-position:50% 20%" onerror="this.style.display='none'">
    <div style="margin-top:4px"><b>${esc(p.name)}</b> <span class="mu" style="font-size:var(--fs-1)">${p.age}</span></div>
    <div class="mu" style="font-size:var(--fs-1);line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden">${esc(p.msg||p.line)}</div></button>`).join('')}</div>`).join(''); }
function mgT(s){ return String(s||'').replace('T',' ').slice(0,16); }
/* 필터 — 순수 함수. st: live(진행 중+마감 지남)·voc(VOC 회신 있는 것)·done·all */
function mgFilter(items,st,desk){ return (items||[]).filter(x=>(st==='all'||(st==='live'&&x.status!=='done')||(st==='voc'&&(x.replies||[]).some(p=>p.voc))||x.status===st)&&(desk==='all'||x.from===desk||x.to===desk)); }
/* 대화 흐름(10/23 겸이 "대화가 이어진다는 느낌이 안 드네"): 요청·답장·완료를 시각순 한 줄 타임라인으로 — 오래된 것 위, 최신 아래(톡방처럼 맨 아래로 스크롤).
   답장 말풍선엔 원 요청 한 줄 인용. 같은 문장 반복(대행 기록이 요청을 되풀이)은 접어서 시스템 줄 1개로. — 순수 함수(테스트용) */
function mgEvents(items,chat){ const ev=(chat||[]).map(c=>({t:c.at||'',k:'chat',c}));
  for(const x of items||[]){ const t0=x.opened_at||x.opened||'';
    ev.push({t:t0,k:'req',x});
    const seen=new Set([String(x.text||'').slice(0,40)]);
    for(const p of x.replies||[]){ const key=String(p.text||'').slice(0,40); if(seen.has(key)) continue; seen.add(key);
      ev.push({t:p.at||t0,k:p.voc?'voc':'px',x,p}); }
    if(x.status==='done'&&x.done_at) ev.push({t:x.done_at,k:'done',x});
  }
  ev.sort((a,b)=>String(a.t).localeCompare(String(b.t))); return ev; }
function mgBub(who,to,txt,t,quote,mine){ return `<div class="mgb2${mine?' me':''}">${mgAv(who)}<div class="mgln"><div class="mgwho"><b>${esc(mgNm(who))}</b>${to?`<span class="ar">→</span>${esc(mgNm(to))}`:''}<span class="mgt">${esc(mgT(t).slice(11))}</span></div>${quote?`<div class="mgq">↳ ${esc(quote)}</div>`:''}<div class="mgbub">${esc(txt)}</div></div></div>`; }
function seg0(S){ return [['live',`진행 중 ${(S.open||0)+(S.promoted||0)}`],['voc',`답장 온 것 ${MG.items.filter(x=>(x.replies||[]).some(p=>p.voc)).length}`],['done',`완료 ${S.done||0}`],['all','전체'],['priv','🔒 비공개 사담'],['prof','👥 프로필'],['org','🏢 조직도']]
    .map(([k,l])=>`<button class="${MGS===k?'on':''}" data-mgs="${k}">${esc(l)}</button>`).join(''); }
function sel0(desks){ return `<select class="mgsel" id="mgsel" aria-label="누나 고르기"><option value="all">모든 누나</option>${desks.map(k=>`<option value="${esc(k)}"${MGD===k?' selected':''}>${esc(mgNm(k))}</option>`).join('')}</select>`; }
/* 🔒 비공개 사담방 — pb-private chat/private_chat.json. 10/23 겸이 "아티팩트를 터미널에 이식, 터미널 버전 하나로만" → 유일한 보는 곳. GAS = Code.gs getPrivate(PRIVATE_TOKEN), 공개 Pages = 이 기기 localStorage 토큰. */
function mgPrivView(seg,sel){
  if(MGP===null){ MGP=false; google.script.run.withSuccessHandler(t=>{ try{ MGP=t?JSON.parse(t):{_err:/github\.io$/.test(location.hostname)?'지금 공개 Pages 주소로 보고 있어 — 비공개 사담은 GAS 웹앱 주소(script.google.com/macros/…/exec)로 열어야 보여':'빈 응답 — GAS 배포가 옛 버전일 수 있음'}; }catch(e){ MGP={_err:'응답이 JSON 아님: '+String(t).slice(0,60)}; } mgRe(1); }).withFailureHandler(e=>{ MGP={_err:'GAS 호출 실패 — '+String((e&&e.message)||e).slice(0,100)+' (웹앱 URL 이 자동 배포 ID 와 같은지 확인)'}; mgRe(1); }).getPrivate('chat'); }
  const C=(MGP&&MGP.chat)||[], by=k=>{ const x=Object.keys(MG_NM).find(q=>MG_NM[q]===k); return x||k; };
  let last='', feed='';
  for(const c of C.filter(c=>MGD==='all'||by(c.by)===MGD||by(c.to)===MGD)){ const d=String(c.at||'').slice(0,10); if(d!==last){ feed+=`<div class="mgday">${esc(d.slice(5).replace('-','/'))}</div>`; last=d; }
    feed+=`<div class="mgb2 chat">${mgAv(by(c.by))}<div class="mgln"><div class="mgwho"><b data-mgp="${esc(by(c.by))}" style="cursor:pointer">${esc(c.by)}</b>${c.to?`<span class="ar">→</span>${esc(c.to)}`:''}<span class="mgt">${esc(mgT(c.at).slice(11))}${c.src==='panel'?' · 패널 대필(본인 아님)':''}</span></div>${c.re?`<div class="mgq">↳ ${esc(c.re.by||'')}: ${esc(String(c.re.text||'').slice(0,60))}</div>`:''}<div class="mgbub">${esc(c.text)}</div></div></div>`; }
  setTimeout(()=>{ document.querySelectorAll('[data-mgs]').forEach(b=>b.onclick=()=>{ MGS=b.dataset.mgs; mgRe(); }); const s=document.getElementById('mgsel'); if(s) s.onchange=()=>{ MGD=s.value; mgRe(); }; const box=document.getElementById('mgbox'); if(box) box.scrollTop=box.scrollHeight; mgPbEnd(box); },0);
  if(MGP&&MGP._need_token){ setTimeout(()=>{ const sv=document.getElementById('mgtksv'); if(sv) sv.onclick=()=>{ const v=(document.getElementById('mgtk').value||'').trim(); if(!v) return; try{ localStorage.setItem('pbPrivTok',v); }catch(e){} MGP=null; mgRe(); }; },0);
    feed=`<div class="mgempty" style="white-space:normal;line-height:1.7">🔒 이 기기에서 처음 한 번만 — GitHub 읽기 전용 토큰을 넣으면 여기서 바로 보여${MGP._err?`<br><span class="dn">${esc(MGP._err)}</span>`:''}<br>
      <span class="mu" style="font-size:var(--fs-2)">토큰은 이 브라우저에만 저장돼(저장소·채팅·서버로 안 감). 만들기: <a href="https://github.com/settings/personal-access-tokens/new" target="_blank">GitHub → Fine-grained token ↗</a> → Repository access: <b>Only select → pb-private</b> → Permissions: <b>Contents = Read-only</b> → 만료 90일</span><br>
      <input id="mgtk" type="password" autocomplete="off" placeholder="github_pat_…" style="min-height:40px;width:min(100%,360px);background:var(--bg2);color:var(--txt);border:1px solid var(--line);padding:0 8px;font:inherit">
      <button id="mgtksv" type="button" style="min-height:40px;background:var(--amber);color:var(--on-amber);border:0;padding:0 14px;font:inherit;cursor:pointer">저장하고 열기</button></div>`; }
  const forget=(()=>{ try{ return !!localStorage.getItem('pbPrivTok'); }catch(e){ return false; } })()?` · <a href="#" onclick="try{localStorage.removeItem('pbPrivTok')}catch(e){};MGP=null;mgRe();return false">이 기기 토큰 지우기</a>`:'';
  const empty=(MGP&&MGP._err)?`<div class="mgempty">🔒 사담방 연결 안 됨 — ${esc(MGP._err)}</div>`:MGP===false?'<div class="load">LOADING …</div>':(MGP&&MGP.chat)?'<div class="mgempty">아직 조용해 — 누나들이 루프·라운드 끝에 한마디씩 남겨</div>':'<div class="mgempty">🔒 사담을 못 불러왔어 — 새로고침해 봐 (공개 Pages 면 이 기기 토큰, GAS 면 PRIVATE_TOKEN)</div>';
  return `<div class="grid"><div class="p c12"><h2>사내톡 · 🔒 비공개 사담<small>pb-private · 겸이만</small></h2><div class="b">
    <div class="mgtop"><div class="mgseg">${seg}</div>${sel}</div>
    <p class="mgsum">비공개라 금액·보유 얘기도 해 · 건강·연애는 여기서도 금지 · 잡담이라 업무 근거 아님${forget}</p>
    <div class="mgbox" id="mgbox">${feed||empty}</div></div></div></div>`;
}
function msgView(){
  if(view==='msg'&&MGPOP) mgPop(false);
  if(MG===null){ MG=false; google.script.run.withSuccessHandler(t=>{ try{ MG=t?JSON.parse(t):{}; }catch(e){ MG={}; } mgRe(1); }).withFailureHandler(()=>{ MG={}; mgRe(1); }).getMarkdown('msgr_feed'); return '<div class="load">LOADING …</div>'; }
  if(!MG||!MG.items) return '<div class="grid"><div class="p c12"><div class="b mu">사내톡 데이터 없음 — python3 scripts/msgr_feed.py (reports/msgr_feed.md, 매시 team.yml 이 갱신)</div></div></div>';
  const S=MG.status||{}, items=mgFilter(MG.items,MGS,MGD);
  const desks=[...new Set(MG.items.flatMap(x=>[x.from,x.to]))].sort((a,b)=>mgNm(a).localeCompare(mgNm(b),'ko'));
  const seg=seg0(S);
  if(MGS==='priv') return mgPrivView(seg,sel0(desks));
  if(MGS==='org'){ setTimeout(()=>{ document.querySelectorAll('[data-mgs]').forEach(b=>b.onclick=()=>{ MGS=b.dataset.mgs; mgRe(); }); },0);
    return `<div class="grid"><div class="p c12"><h2>사내톡 · 🏢 조직도<small>docs/desk_kb/ORG.md · 본부는 묶음(상하 아님) · 얼굴 누르면 프로필</small></h2><div class="b"><div class="mgtop"><div class="mgseg">${seg}</div></div>${mgOrg()}</div></div></div>`; }
  if(MGS==='prof'){ setTimeout(()=>{ document.querySelectorAll('[data-mgs]').forEach(b=>b.onclick=()=>{ MGS=b.dataset.mgs; mgRe(); }); },0);
    return `<div class="grid"><div class="p c12"><h2>사내톡 · 👥 프로필<small>${(MG.profiles||[]).length}명 · 사진 탭하면 크게</small></h2><div class="b"><div class="mgtop"><div class="mgseg">${seg}</div></div>${mgProfGrid()}</div></div></div>`; }
  const sel=sel0(desks);
  let last='', feed='';
  for(const e of mgEvents(items,(MG.chat||[]).filter(c=>MGS!=='done'&&(MGD==='all'||c.by===MGD||c.to===MGD)))){ const d=String(e.t).slice(0,10); if(d!==last){ feed+=`<div class="mgday">${esc(d.slice(5).replace('-','/'))}</div>`; last=d; }
    if(e.k==='chat'){ feed+=`<div class="mgb2 chat">${mgAv(e.c.by)}<div class="mgln"><div class="mgwho"><b>${esc(mgNm(e.c.by))}</b>${e.c.to?`<span class="ar">→</span>${esc(mgNm(e.c.to))}`:''}<span class="mgt">${esc(mgT(e.t).slice(11))} · 사담</span></div><div class="mgbub">${esc(e.c.text)}</div></div></div>`; continue; }
    const q=String(e.x.text||'').slice(0,46)+(String(e.x.text||'').length>46?'…':'');
    if(e.k==='req') feed+=mgBub(e.x.from,e.x.to,e.x.text,e.t,'',e.x.from==='겸이');
    else if(e.k==='voc') feed+=mgBub(e.p.by,e.x.from,e.p.text,e.t,`${mgNm(e.x.from)}: ${q}`,false);
    else if(e.k==='px') feed+=`<div class="mgsys" title="${esc(e.p.text)}">📝 진행자 기록(${esc(mgNm(e.x.to))} 건) · ${esc(String(e.p.text).slice(0,60))}${String(e.p.text).length>60?'…':''}</div>`;
    else feed+=`<div class="mgsys">✅ ${esc(mgNm(e.x.done_by||e.x.to))} 완료 — ${esc(q)}</div>`;
  }
  setTimeout(()=>{ document.querySelectorAll('[data-mgs]').forEach(b=>b.onclick=()=>{ MGS=b.dataset.mgs; mgRe(); });
    const s=document.getElementById('mgsel'); if(s) s.onchange=()=>{ MGD=s.value; mgRe(); };
   
    const box=document.getElementById('mgbox'); if(box) box.scrollTop=box.scrollHeight; mgPbEnd(box); },0);
  return `<div class="grid"><div class="p c12"><h2>사내톡<small>${esc(MG.asof||'—')} · 매시 갱신</small></h2><div class="b">
    <div class="mgtop"><div class="mgseg">${seg}</div>${sel}</div>
    <p class="mgsum">오래된 대화가 위, 최신이 아래 · ↳ = 어떤 요청에 대한 답장인지 · 📝 진행자 기록은 누나 본인 말 아님 · 점선 = 사담(잡담, 업무 근거 아님)</p>
    <div class="mgbox" id="mgbox">${feed||'<div class="mgempty">여기엔 아직 없어</div>'}</div>
  </div></div></div>`;
}
</script>
