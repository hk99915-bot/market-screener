<!-- tab_detail.html — 종목 상세 서랍(모든 탭 공용) — 가치평가·드라이버·피어·매크로 팝업·차트 (openDetail·renderDetail·drawChart).
     apps-script/Index.html 이 include('tab_detail') 템플릿 태그로 끼워 넣는다 (GAS 는 HtmlService include, Pages 는 scripts/build_pages.py 가 인라인).
     전역 도우미($·esc·num·pct·render·setView·openDetail 등)는 Index.html 에 있다. -->
<script>
function valPanel(v,close){
  if(!v||!v.models||!Object.keys(v.models).length) return '<div class="mu">가치평가 불가 (재무 4분기 미만·적자·주식 수 정보 없음)</div>';
  const r=v.range||{}, lo=Math.min(r.low,close), hi=Math.max(r.high,close), x=p=>((p-lo)/(hi-lo||1)*100).toFixed(1);
  const GN={current:['현재 이익 지속','#e9a'],normal:['사이클 평균 회귀','#8cf'],asset:['자산·배당','#9b9']};
  const gu=v.group_upside||{}, gv=v.groups||{};
  const cards=Object.entries(GN).filter(([k])=>gv[k]).map(([k,[n,c]])=>`<div style="flex:1;min-width:150px;border-left:3px solid ${c};padding:4px 10px">
     <div class="mu" style="font-size:11px">${n}</div><div style="font-size:16px"><b>${num(gv[k],0)}</b> ${pct(gu[k],0)}</div></div>`).join('');
  const bar=`<div style="position:relative;height:26px;margin:6px 0 14px;background:rgba(255,255,255,.04);border-radius:3px">
     ${Object.entries(v.models).map(([k,m])=>`<div title="${esc(k)} ${num(m.value,0)}" style="position:absolute;left:${x(m.value)}%;top:5px;width:3px;height:16px;background:${(GN[m.group]||['','#aaa'])[1]}"></div>`).join('')}
     <div title="현재가" style="position:absolute;left:${x(close)}%;top:0;width:2px;height:26px;background:#fc3"></div></div>`;
  const rows=Object.entries(v.models).map(([k,m])=>`<tr><td class="l"><span style="color:${(GN[m.group]||['','#aaa'])[1]}">■</span> ${esc(k)}</td><td>${num(m.value,0)}</td><td>${pct(m.upside,0)}</td></tr><tr><td colspan="3" class="l mu" style="white-space:normal;font-size:11px;padding:0 6px 6px 22px;border-bottom:1px solid #1c1c1c">${esc(m.note)}</td></tr>`).join('');
  const f=v.fscore, d=v.dupont, a=v.assumptions||{}, sh=v.shares||{}, P=x=>x==null?'—':(x*100).toFixed(1)+'%';
  return `${v.verdict?`<div style="border:1px solid #fc3;padding:8px 10px;margin-bottom:8px;line-height:1.6"><b style="color:#fc3">결론</b> ${esc(v.verdict)}</div>`:''}
   <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px">${cards}${v.signal_fv?`<div style="flex:1;min-width:150px;border-left:3px solid #fc3;padding:4px 10px"><div class="mu" style="font-size:11px">신호 가중 (현재이익 ${Math.round(v.signal_fv.w_current*100)}%)</div><div style="font-size:16px"><b>${num(v.signal_fv.value,0)}</b> ${pct(v.signal_fv.upside,0)}</div></div>`:''}</div>
   <div class="mu" style="font-size:11px">현재가 <b style="color:#fc3">${num(close,0)}</b> · 전체 범위 ${num(r.low,0)} ~ ${num(r.high,0)} · PER ${v.per??'—'}${v.per_reported&&v.per_reported!==v.per?` (보고이익 기준 ${v.per_reported})`:''} · PBR ${v.pbr??'—'}${v.implied_g!=null?` · 역DCF 내재 영구성장 ${(v.implied_g*100).toFixed(1)}%`:''}</div>${bar}
   <table style="max-width:640px"><tr><th class="l">모델</th><th>적정가</th><th>괴리</th></tr>${rows}</table>
   ${(v.flags||[]).map(t=>`<div style="color:#fb6;font-size:11px;margin-top:4px">⚠ ${esc(t)}</div>`).join('')}
   <div class="mu" style="font-size:11px;margin-top:8px;line-height:1.6">
   ROE 현재 ${P(v.roe)}${v.roe_reported!=null&&v.roe_reported!==v.roe?` (보고 ${P(v.roe_reported)})`:''} · ${a.roe_years||''}년 평균 ${P(v.roe_norm)} · 최저 ${P(v.roe_min)} · 최고 ${P(v.roe_max)} · 시장 반영 ${P(v.implied_roe)}
   ${d?`<br>듀폰: 순이익률 ${(d.margin*100).toFixed(1)}% × 회전율 ${d.turnover}회 × 레버리지 ${d.leverage}배`:''}<br>
   ${f?`F-score ${f.score}/${f.max} (Piotroski 변형) — ${Object.entries(f.tests).map(([k,ok])=>`<span style="color:${ok?'#4e9':'#e66'}">${ok?'✓':'✗'} ${esc(k)}</span>`).join(' · ')}<br>`:''}
   RIM 민감도 (COE): ${Object.entries(v.rim_sens||{}).map(([k,x])=>`${k} ${num(x,0)}`).join(' / ')||'—'}<br>
   주식 수 ${num(sh.shares,0)}주 — ${esc(sh.src||'')}${sh.treasury_pct?` · 자사주 ${(sh.treasury_pct*100).toFixed(1)}%`:''}${sh.pref_pct?` · 우선주 ${(sh.pref_pct*100).toFixed(1)}%`:''}<br>
   가정: COE ${(a.coe*100).toFixed(0)}% · 영구성장 ${(a.g*100).toFixed(0)}% · 기준 ${esc(a.period||'')} TTM · 업종 ${esc(v.sector||'—')}${v.peer?` (PER ${v.peer.per?.toFixed?.(1)??'—'} / PBR ${v.peer.pbr?.toFixed?.(2)??'—'}, n=${v.peer.n})`:''}${a.financial_sector?' · 금융업: 현금흐름 모델 제외':''}</div>`;
}
function drvPanel(d,v){
  if(!d||!Object.keys(d).length) return '<div class="mu">드라이버 데이터 없음</div>';
  const col=x=>x==null?'var(--muted)':x>0.15?'var(--up)':x<-0.15?'var(--dn)':'var(--amber)';
  const sg=x=>x==null?'—':(x>0?'+':'')+x.toFixed(2);
  const lab=x=>x==null?'판단 보류':x>0.3?'이익 지속 쪽':x>0.1?'약하게 지속 쪽':x<-0.3?'평균 회귀 쪽':x<-0.1?'약하게 회귀 쪽':'중립';
  const NM=d.market==='US'?{eps:'EPS 추정 변화',chain:'공급망 체인',rev:'매출 성장',macro:'매크로'}:{chain:'공급망 체인(업종)',analyst:'애널리스트',news:'뉴스',macro:'매크로',dart:'공시'};
  const own=d.market==='US'?['eps','rev']:['analyst','news','dart'], ownN=own.filter(k=>(d.parts||{})[k]!=null).length;
  const parts=Object.entries(NM).map(([k,n])=>{const x=(d.parts||{})[k]; return `<div style="flex:1;min-width:92px;border:1px solid var(--line);padding:4px 8px"><div class="mu" style="font-size:11px">${n}${d.weights&&d.weights[k]?` · ${Math.round(d.weights[k]*100)}%`:''}</div><b style="color:${col(x)}">${sg(x)}</b></div>`;}).join('');
  const sf=v&&v.signal_fv;
  let h=`<div style="border:1px solid ${col(d.score)};padding:8px 10px;margin-bottom:8px;line-height:1.6"><b style="color:${col(d.score)}">${lab(d.score)}</b> 종합 ${sg(d.score)} <span class="mu" style="font-size:11px">(성과 검증 전)</span>
    ${d.score!=null&&!ownN?`<div style="font-size:12px;color:var(--amber)">⚠ 이 종목 고유 정보(애널리스트·뉴스·공시)가 없음 — 업종 체인·매크로 가정만으로 낸 점수. 같은 업종이면 거의 같은 값.</div>`:d.score!=null?`<div class="mu" style="font-size:11px">종목 고유 근거 ${ownN}/${own.length}개</div>`:''}
    ${sf?`<div class="mu" style="font-size:11px">참고용 계산: '현재 이익' 가중 ${Math.round(sf.w_current*100)}% → 가중 적정가 ${num(sf.value,0)} (${pct(sf.upside,0)}) — 가중치 식(50%+40%×점수)은 임의로 정한 것이라 목표가로 쓰지 말 것</div>`:''}</div>
    <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px">${parts}</div>`;
  const ev=d.eps;
  if(ev){ h+=`<div class="am" style="font-size:12px;margin:6px 0 2px">애널리스트 EPS 추정 <span style="color:${col((d.parts||{}).eps)}">${sg((d.parts||{}).eps)}</span></div>
    <div style="font-size:12.5px;line-height:1.7">${(ev.why||[]).map(w=>'· '+esc(w)).join('<br>')||'<span class="mu">추정치 데이터 없음</span>'}${ev.rev_yoy!=null?`<br>· 최근 분기 매출 YoY ${pct(ev.rev_yoy,0)} (${esc(ev.rev_q||'')})`:''}</div>`; }
  const ch=d.chain;
  if(ch&&ch.proxies&&ch.proxies.length){ h+=`<div class="am" style="font-size:12px;margin:6px 0 2px">공급망 · ${esc(ch.name)} <span style="color:${col(ch.score)}">${sg(ch.score)}</span></div>
    <table style="max-width:760px">${ch.proxies.map(p=>`<tr><td class="l"><span class="px" data-t="${esc(p.ticker)}">${esc(p.name)} <span class="mu">${esc(p.ticker)}</span></span><div class="mu" style="font-size:11px;white-space:normal">${esc(p.role)}${p.relation<0?' (반대로 작용)':p.relation===0?' (참고·점수 미반영)':''}</div></td><td style="color:${col(p.effect)}">${sg(p.effect)}</td></tr><tr><td colspan="2" class="l mu" style="white-space:normal;font-size:11px;padding:0 6px 6px 14px">${esc(p.why||'')}</td></tr>`).join('')}</table>`; }
  const m=d.macro;
  if(m&&m.rows&&m.rows.length){ h+=`<div class="am" style="font-size:12px;margin:10px 0 2px">매크로 바람 <span style="color:${col(m.score)}">${sg(m.score)}</span> <span class="mu">(시장 베타 ${m.beta_mkt??'—'}, 시장 영향 제외한 민감도 · |t|≥3만 '실측', 나머지는 업종 가정 절반)</span></div>
    <table style="max-width:760px"><tr><th class="l">변수</th><th>1개월</th><th>민감도(t)</th><th>영향</th></tr>${m.rows.map(r=>`<tr><td class="l">${esc(r.name)}<div class="mu" style="font-size:11px">${esc(r.why)}</div></td><td>${pct(r.r1m,1)}</td><td class="mu">${r.beta!=null?r.beta.toFixed(2):'—'}${r.t!=null?` (${r.t})`:''}</td><td style="color:${col(r.effect)}">${sg(r.effect)}</td></tr>`).join('')}</table>`; }
  const a=d.analyst;
  if(a){ const dr=Object.entries(a.drivers||{}).sort((x,y)=>(y[1].up+y[1].dn)-(x[1].up+x[1].dn));
    h+=`<div class="am" style="font-size:12px;margin:10px 0 2px">애널리스트 (90일 ${a.n}건) <span style="color:${col(a.score)}">${sg(a.score)}</span> <span class="mu">전 종목 평균 ${sg(a.base)} 대비</span></div>
    <div class="mu" style="font-size:12px;line-height:1.7">목표가 ↑${a.tp_up} ↓${a.tp_dn} · 이익 추정 ↑${a.op_up} ↓${a.op_dn} · 컨센 상회 언급 ${a.beat} / 하회 ${a.miss} · 톤 ${Object.entries(a.tones).map(([k,n])=>`${esc(k)} ${n}`).join(', ')}</div>
    ${dr.length?`<div style="font-size:12px;line-height:1.8;margin-top:2px">리포트가 말하는 이익 드라이버 <span class="mu" style="font-size:11px">(▲▼ = 문장 속 증가·감소 방향. 원가·재고는 ▼가 이익에 좋음, 환율은 업종마다 다름)</span>: ${dr.map(([k,x])=>{const inv=k==='원자재·원가'||k==='재고', neu=k==='환율', c=neu?'var(--amber)':(x.up>x.dn)!==inv&&x.up!==x.dn?'var(--up)':x.up!==x.dn?'var(--dn)':'var(--amber)'; return `<span title="${esc((x.ex||[]).join(' / '))}" style="margin-right:8px;color:${c}">${esc(k)} ${x.up>x.dn?'▲':x.dn>x.up?'▼':'◆'}${x.up}/${x.dn}</span>`;}).join('')}</div>
    ${dr.slice(0,3).map(([k,x])=>(x.ex||[]).slice(0,1).map(e=>`<div class="mu" style="font-size:11px;margin-left:10px;white-space:normal">· [${esc(k)}] ${esc(e)}</div>`).join('')).join('')}`:''}`; }
  const n=d.news;
  if(n&&n.events&&n.events.length){ h+=`<div class="am" style="font-size:12px;margin:10px 0 2px">뉴스 이벤트 (7일 헤드라인 ${n.n}건 중 ${n.events.length}건) <span style="color:${col(n.score)}">${sg(n.score)}</span></div>
    ${n.events.slice(0,8).map(e=>`<div style="font-size:12px;line-height:1.6;white-space:normal"><span style="color:${e.dir>0?'var(--up)':e.dir<0?'var(--dn)':'var(--muted)'}">${e.dir>0?'▲':e.dir<0?'▼':'◆'} ${esc(e.event)}</span> <span class="mu">${esc(e.date||'')}</span> ${e.link?`<a href="${esc(e.link)}" target="_blank" rel="noopener">${esc(e.title)}</a>`:esc(e.title)}</div>`).join('')}`; }
  else if(n) h+=`<div class="mu" style="font-size:12px;margin-top:8px">뉴스: 7일 헤드라인 ${n.n}건, 이익 이벤트로 분류된 것 없음</div>`;
  if(n&&n.recent&&n.recent.length) h+=`<details style="margin-top:4px"><summary class="mu" style="font-size:12px;cursor:pointer">최근 헤드라인 ${n.recent.length}건</summary>${n.recent.map(e=>`<div style="font-size:12px;line-height:1.6;white-space:normal"><span class="mu">${esc(e.date||'')}</span> ${e.link?`<a href="${esc(e.link)}" target="_blank" rel="noopener">${esc(e.title)}</a>`:esc(e.title)}</div>`).join('')}</details>`;
  const dv=d.dart;
  if(dv&&dv.events&&dv.events.length) h+=`<div class="am" style="font-size:12px;margin:10px 0 2px">공시 이벤트</div>${dv.events.map(e=>`<div style="font-size:12px"><span style="color:${e.dir>0?'var(--up)':e.dir<0?'var(--dn)':'var(--muted)'}">${esc(e.event)}</span> <span class="mu">${esc(e.date||'')}</span> ${esc(e.title||'')}</div>`).join('')}`;
  return h+`<div class="mu" style="font-size:11px;margin-top:10px">규칙 기반 점수(−1~+1), <b>성과 검증 전</b>. 체인 35% · 애널리스트 25% · 뉴스 15% · 매크로 15% · 공시 10%, 없는 항목은 빼고 재가중. 체인 점수는 미국·일본 동종 종목의 이익 추정 변화 <b>+ 3개월 주가</b>를 섞어 일부는 주가 모멘텀이고, 이익 추정은 주가보다 늦게 움직여 급락 초입에도 한동안 + 로 남을 수 있음. 뉴스는 3건 미만이면 줄여서 반영.</div>`;
}
const PEERS={};
function peersLoad(mk,cb){ if(PEERS[mk]) return cb(PEERS[mk]); google.script.run.withSuccessHandler(t=>{try{PEERS[mk]=JSON.parse(t);}catch(e){PEERS[mk]={rows:[]};} cb(PEERS[mk]);}).withFailureHandler(()=>{PEERS[mk]={rows:[]};cb(PEERS[mk]);}).getPeers(mk); }
function rvFill(sym,mk){
  peersLoad(mk,P=>{ const box=$('#rvbox'); if(!box) return; const rows=P.rows||[], me=rows.find(r=>r.s===sym);
    if(!me){ box.innerHTML='<div class="mu">비교 데이터 없음</div>'; return; }
    const grp=rows.filter(r=>r.g===me.g); const list=[...grp].sort((a,b)=>(b.mc||0)-(a.mc||0)).slice(0,14); if(!list.includes(me)) list.push(me);
    const med=k=>{const v=grp.map(r=>r[k]).filter(x=>x!=null&&isFinite(x)).sort((a,b)=>a-b); return v.length?v[Math.floor(v.length/2)]:null;};
    const rk=k=>{const v=grp.filter(r=>r[k]!=null); if(me[k]==null||!v.length) return ''; const n=v.filter(r=>r[k]>me[k]).length+1; return `${n}/${v.length}`;};
    const F=(x,d=1)=>x==null||!isFinite(x)?'—':x.toFixed(d), P_=x=>x==null?'—':pct(x,0), col=x=>x==null?'var(--muted)':x>0.15?'var(--up)':x<-0.15?'var(--dn)':'var(--amber)';
    $('#rvsub').textContent=`${me.g} · ${grp.length}종목`;
    box.innerHTML=`<div class="mu" style="font-size:12px;margin-bottom:6px;line-height:1.7;white-space:normal">그룹 안 순위 — 20일 수익률 ${rk('r20')} · 드라이버 ${rk('drv')} · 정상화 적정가 괴리 ${rk('nor')} (1위 = 가장 큼)</div>
     <table><tr><th class="l">종목</th><th>1D</th><th>20D</th><th>PER</th><th>PBR</th><th>ROE</th><th>평균ROE</th><th>드라이버</th><th>정상화</th><th>신호가중</th></tr>
     ${list.map(r=>`<tr style="${r===me?'background:#1a1408':''}"><td class="l ${r===me?'am':''}"><span class="sym" data-sym="${esc(r.s)}" data-mk="${mk}" style="cursor:pointer">${esc(shortNm(r.n)||r.s)}</span></td><td>${pct(r.r1,1)}</td><td>${pct(r.r20,0)}</td><td>${F(r.per)}</td><td>${F(r.pbr,2)}</td><td>${r.roe!=null?(r.roe*100).toFixed(0)+'%':'—'}</td><td class="mu">${r.roen!=null?(r.roen*100).toFixed(0)+'%':'—'}</td><td style="color:${col(r.drv)}">${r.drv!=null?(r.drv>0?'+':'')+r.drv.toFixed(2):'—'}</td><td>${P_(r.nor)}</td><td>${P_(r.sig)}</td></tr>`).join('')}
     <tr class="mu"><td class="l">그룹 중앙값</td><td>${pct(med('r1'),1)}</td><td>${pct(med('r20'),0)}</td><td>${F(med('per'))}</td><td>${F(med('pbr'),2)}</td><td>${med('roe')!=null?(med('roe')*100).toFixed(0)+'%':'—'}</td><td>${med('roen')!=null?(med('roen')*100).toFixed(0)+'%':'—'}</td><td>${med('drv')!=null?med('drv').toFixed(2):'—'}</td><td>${P_(med('nor'))}</td><td>${P_(med('sig'))}</td></tr></table>`; });
}
/* ───── 종목 상세 ───── */
const DET={};
function openDetail(sym,mk){
  if(!AN) loadAnalysts();
  $('#dr').classList.add('on');$('#bd').classList.add('on');$('#dr-t').textContent=sym;$('#dr-s').textContent='';$('#dr-b').innerHTML='<div class="load">LOADING …</div>';
  const k=mk+':'+sym;
  if(DET[k]) return renderDetail(sym,mk,DET[k]);
  const fail=e=>{
    const kr=mk==='KR', lk=kr?`https://finance.naver.com/item/main.naver?code=${encodeURIComponent(sym)}`:`https://finance.yahoo.com/quote/${encodeURIComponent(sym)}`;
    $('#dr-b').innerHTML=/404/.test(e.message)?`<div class="err">이 종목의 상세 데이터가 없습니다. 다음 자동 실행 때 생성되거나, 스크리너 대상 밖 종목입니다 (${kr?'시총 1,000억 미만·우선주·ETF 등':'S&P500·나스닥100 밖'}). <a href="${lk}" target="_blank">${kr?'네이버':'야후'}에서 보기</a></div>`:`<div class="err">${esc(e.message)}</div>`;};
  // 무한 LOADING 방지: 렌더 중 오류는 화면에 표시, 12초 넘게 응답 없으면 다시 시도 버튼

  const fd=ovOn('fibdn')?fibDown(ch,120):null; if(fd) fd.forEach(([t,v],i)=>cs.createPriceLine({price:v,color:i===0?'#ff6b6b':'rgba(255,107,107,.6)',lineWidth:1,lineStyle:2,axisLabelVisible:true,title:'↓'+t}));
  const rsi=rsiJS(ch,14); let rc=null;
  if(ovOn('rsi')){ const rb=document.createElement('div'); rb.id='lwrsi'; rb.style.cssText='height:90px;position:relative'; el.parentNode.appendChild(rb);
    rc=LC.createChart(rb,{width:el.clientWidth,height:90,layout:{background:{type:'solid',color:'#050505'},textColor:'#777',fontSize:10},grid:{vertLines:{color:'#101010'},horzLines:{color:'#101010'}},
      rightPriceScale:{borderColor:'#2a2a2a',scaleMargins:{top:0.08,bottom:0.08}},timeScale:{visible:false,rightOffset:3,barSpacing:mob?6:8},crosshair:{mode:0},handleScroll:{vertTouchDrag:false},localization:{locale:'ko-KR',priceFormatter:v=>v.toFixed(0)}});
    const rl=rc.addLineSeries({color:'#b0b0b0',lineWidth:1.5,lastValueVisible:true,priceLineVisible:false,crosshairMarkerVisible:false});
    rl.setData(ch.map((b,i)=>rsi[i]!=null?{time:b.t,value:rsi[i]}:{time:b.t}));  // 빈 값도 시간축에 넣어 메인 차트와 인덱스 정렬
    rl.createPriceLine({price:70,color:'#ff4b4b',lineWidth:1,lineStyle:2,axisLabelVisible:false,title:'70'}); rl.createPriceLine({price:30,color:'#2fd05a',lineWidth:1,lineStyle:2,axisLabelVisible:false,title:'30'});
    const lab=document.createElement('div'); lab.style.cssText='position:absolute;left:6px;top:2px;z-index:3;font-size:10px;color:#999;pointer-events:none'; lab.textContent='RSI(14) '+(rsi[ch.length-1]!=null?rsi[ch.length-1].toFixed(0):''); rb.appendChild(lab);
    let sy=false; c.timeScale().subscribeVisibleLogicalRangeChange(r=>{ if(sy||!r) return; sy=true; rc.timeScale().setVisibleLogicalRange(r); sy=false; });
    rc.timeScale().subscribeVisibleLogicalRangeChange(r=>{ if(sy||!r) return; sy=true; c.timeScale().setVisibleLogicalRange(r); sy=false; });
    new ResizeObserver(()=>{ try{ rc.applyOptions({width:el.clientWidth}); }catch(_){} }).observe(rb); }
  const n=ch.length; c.timeScale().setVisibleLogicalRange({from:Math.max(0,n-(mob?60:90)),to:n+2});
  const leg=$('#lwleg'), map={}; ch.forEach((b,i)=>map[b.t]={...b,prev:i?ch[i-1].c:null});
  ch.forEach((b,i)=>{ map[b.t].rsi=rsi[i]; });
  const show=b=>{ if(!b) return; const chg=b.prev?b.c/b.prev-1:null; leg.innerHTML=`${esc(b.t)} 시 ${num(b.o,kr?0:2)} 고 ${num(b.h,kr?0:2)} 저 ${num(b.l,kr?0:2)} 종 <b>${num(b.c,kr?0:2)}</b> ${chg!=null?pct(chg,2):''}${b.p!=null&&ovOn('psar')?` · PSAR ${num(b.p,kr?0:2)}`:''}${b.rsi!=null&&ovOn('rsi')?` · RSI ${b.rsi.toFixed(0)}`:''}${ovOn('fib')&&fb?`<br><span style="color:#e8c547">Fib ${fb.up?'상승분 되돌림':'하락분 반등'} ${num(fb.lo,kr?0:2)}~${num(fb.hi,kr?0:2)} (120일) · 검증 F (참고용)</span>`:''}${fd&&fd.length?`<br><span style="color:#ff6b6b">하방 Fib ${fd.map(([t,v])=>`${t} ${num(v,kr?0:2)}`).join(' · ')} · 검증 F (참고용)</span>`:''}`; };
  show(map[ch[n-1].t]);
  c.subscribeCrosshairMove(p=>{ if(!p||!p.time){ show(map[ch[n-1].t]); return; } const t=typeof p.time==='string'?p.time:`${p.time.year}-${String(p.time.month).padStart(2,'0')}-${String(p.time.day).padStart(2,'0')}`; show(map[t]); });
  el.addEventListener('dblclick',()=>c.timeScale().setVisibleLogicalRange({from:Math.max(0,n-(mob?60:90)),to:n+2}));
  new ResizeObserver(()=>{ if(LWCH===c) c.applyOptions({width:el.clientWidth}); }).observe(el);
}
function drawCanvas(ch,sc,rs,kr){
  const cvb=$('#chb'); if(cvb&&!$('#cv')) cvb.innerHTML='<canvas id="cv" width="960" height="260"></canvas>';
  if(ch&&ch.length>90) ch=ch.slice(-60);
  const cv=$('#cv'); if(!cv||!ch.length) return; const W=cv.width=cv.clientWidth*2,H=cv.height=520; const x=cv.getContext('2d'); x.scale(1,1);
  const padL=70,padR=16,padT=12,padB=70,vh=90; const n=ch.length; const cw=(W-padL-padR)/n;
  const bx=sc.base&&sc.base.range;
  const lv=[ovOn('bull')&&sc.bull?.target,ovOn('stop')&&sc.bear?.stop,ovOn('tp')&&rs.consensus_tp,ovOn('next')&&sc.bear?.next,ovOn('psar')&&sc.bear?.trail,...(ovOn('box')&&bx?bx:[]),...(ovOn('psar')?ch.map(c=>c.p):[])].filter(v=>v);
  let lo=Math.min(...ch.map(c=>c.l),...lv),hi=Math.max(...ch.map(c=>c.h),...lv); const pad=(hi-lo)*0.06; lo-=pad;hi+=pad;
  const Y=v=>padT+(hi-v)/(hi-lo)*(H-padT-padB-vh); const vmax=Math.max(...ch.map(c=>c.v))||1;
  x.fillStyle='#050505';x.fillRect(0,0,W,H);
  x.strokeStyle='#1c1c1c';x.lineWidth=1;x.font='20px monospace';x.fillStyle='#777';
  for(let i=0;i<=4;i++){const v=lo+(hi-lo)*i/4,y=Y(v);x.beginPath();x.moveTo(padL,y);x.lineTo(W-padR,y);x.stroke();x.fillText(v.toLocaleString(undefined,{maximumFractionDigits:kr?0:2}),4,y+7);}
  const line=(key,col)=>{x.strokeStyle=col;x.lineWidth=2;x.beginPath();let s=false;ch.forEach((c,i)=>{if(c[key]==null)return;const px=padL+cw*i+cw/2,py=Y(c[key]);s?x.lineTo(px,py):x.moveTo(px,py);s=true;});x.stroke();};
  if(ovOn('box')&&bx&&bx[0]&&bx[1]){ const y1=Y(bx[1]),y2=Y(bx[0]); x.fillStyle='rgba(255,255,255,0.05)'; x.fillRect(padL,y1,W-padL-padR,y2-y1); x.strokeStyle='#444'; x.lineWidth=1; x.strokeRect(padL,y1,W-padL-padR,y2-y1); x.fillStyle='#888'; x.fillText('BOX',padL+6,y1+20); }
  if(ovOn('s20')) line('s20','#4aa3ff'); if(ovOn('s50')) line('s50','#c77dff');
  const hline=(v,col,lab)=>{if(!v)return;const y=Y(v);x.setLineDash([8,6]);x.strokeStyle=col;x.lineWidth=2;x.beginPath();x.moveTo(padL,y);x.lineTo(W-padR,y);x.stroke();x.setLineDash([]);x.fillStyle=col;x.fillText(lab,W-padR-x.measureText(lab).width,y-6);};
  const fm=v=>num(v,kr?0:2);
  if(ovOn('tp')) hline(rs.consensus_tp,'#35d6e6','TP '+fm(rs.consensus_tp));
  if(ovOn('bull')) hline(sc.bull?.target,'#2fd05a','BULL '+fm(sc.bull?.target));
  if(ovOn('stop')) hline(sc.bear?.stop,'#ff4b4b','STOP '+fm(sc.bear?.stop));
  if(ovOn('next')) hline(sc.bear?.next,'#ff6b9a','다음 지지 '+fm(sc.bear?.next));
  if(ovOn('psar')){ const pts=ch.filter(c=>c.p!=null);
    if(pts.length){ ch.forEach((c,i)=>{ if(c.p==null||c.p<lo||c.p>hi) return; const px=padL+cw*i+cw/2; x.fillStyle=c.p<c.c?'#ff9a1f':'#c070ff'; x.beginPath(); x.arc(px,Y(c.p),Math.max(2.5,cw*0.12),0,Math.PI*2); x.fill(); });
      const lp=pts[pts.length-1]; x.fillStyle='#ff9a1f'; x.fillText('PSAR '+fm(lp.p)+(lp.p<lp.c?' (상승추세)':' (하락추세)'),padL+6,padT+22); }
    else if(sc.bear?.trail) hline(sc.bear.trail,'#ff9a1f','PSAR '+fm(sc.bear.trail)); }
  ch.forEach((c,i)=>{const px=padL+cw*i+cw/2;const up=c.c>=c.o;x.strokeStyle=x.fillStyle=up?'#ff4b4b':'#4aa3ff'; if(!kr){x.strokeStyle=x.fillStyle=up?'#2fd05a':'#ff4b4b';}
    x.lineWidth=2;x.beginPath();x.moveTo(px,Y(c.h));x.lineTo(px,Y(c.l));x.stroke();const yo=Y(c.o),yc=Y(c.c);x.fillRect(px-cw*0.3,Math.min(yo,yc),cw*0.6,Math.max(2,Math.abs(yc-yo)));
    const vb=H-padB-(c.v/vmax)*vh*0.95; x.fillStyle=up?'#5a2020':'#1f3a5a'; x.fillRect(px-cw*0.3,vb,cw*0.6,H-padB-vb);
    if(i%10===0){x.fillStyle='#777';x.fillText(c.d,px-20,H-padB+26);} });
}
