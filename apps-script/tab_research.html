<!-- tab_research.html — RESEARCH 탭 — 리서치 리포트·애널리스트·밸류에이션 바스켓·공시 (repView·valView·dartView).
     apps-script/Index.html 이 include('tab_research') 템플릿 태그로 끼워 넣는다 (GAS 는 HtmlService include, Pages 는 scripts/build_pages.py 가 인라인).
     전역 도우미($·esc·num·pct·render·setView·openDetail 등)는 Index.html 에 있다. -->
<script>
let DS=null, DV={c:'ALL',q:'',d:7};
const FLAGC={'희석':'dn','주의':'dn','정정':'mu'};
function discTable(rows,withName){ return `<table><tr><th class="l">날짜</th>${withName?'<th class="l">종목</th>':''}<th class="l">유형</th><th class="l">공시</th></tr>${rows.map(r=>`<tr><td class="l mu">${r.date}</td>${withName?`<td class="l am sym" data-sym="${esc(r.code)}" data-mk="KR">${esc(r.name)}</td>`:''}<td class="l">${esc(r.category)}${r.flag?` <b class="${FLAGC[r.flag]||'am'}">${esc(r.flag)}</b>`:''}</td><td class="l"><a href="${esc(r.link)}" target="_blank">${esc(r.title)}</a></td></tr>`).join('')}</table>`; }
function dartView(){
  if(!DS){ google.script.run.withSuccessHandler(t=>{try{DS=JSON.parse(t);}catch(e){DS={items:[]};} if(view==='dart') render();}).withFailureHandler(e=>{DS={items:[],err:'공시 데이터가 아직 없습니다 (DART_API_KEY 설정 후 다음 자동 실행 때 생성)'}; if(view==='dart') render();}).getDisclosures(); return '<div class="load">LOADING …</div>'; }
  const cats=['ALL','⚠ 주의·희석',...new Set((DS.items||[]).map(r=>r.category))];
  const b=(k,v,l)=>`<button class="${DV[k]===v?'on':''}" onclick="DV['${k}']=${typeof v==='number'?v:`'${v}'`};render()">${l}</button>`;
  return `<div class="grid"><div class="p c12"><h2>DART 주요 공시<span class="ctab">${[1,3,7,30].map(d=>b('d',d,d+'D')).join('')}</span><small id="dcnt"></small></h2><div class="b">
   <div class="ctab" style="margin:0 0 8px 0;display:flex;flex-wrap:wrap;gap:4px">${cats.map(c=>b('c',c,c==='ALL'?'전체':c)).join('')}</div>
   <input class="rq" placeholder="종목 · 공시 제목 검색" value="${esc(DV.q)}" oninput="DV.q=this.value;dartFill()">${DS.err?`<div class="mu">${esc(DS.err)}</div>`:''}<div id="dbody"></div></div></div></div>`;
}
function dartFill(){ const b=$('#dbody'); if(!b||!DS) return; const cut=new Date(Date.now()-DV.d*864e5+9*36e5).toISOString().slice(0,10), q=DV.q.trim().toLowerCase();
  const it=(DS.items||[]).filter(r=>r.date>=cut&&(DV.c==='ALL'||(DV.c==='⚠ 주의·희석'?(r.flag==='주의'||r.flag==='희석'):r.category===DV.c))&&(!q||[r.name,r.code,r.title,r.category].join(' ').toLowerCase().includes(q)));
  b.innerHTML=it.length?discTable(it.slice(0,500),true):'<div class="mu">해당 공시 없음</div>'; const c=$('#dcnt'); if(c) c.textContent=`${it.length}건 · 기준 ${DS.asof||''}`; }
let AN=null;
function loadAnalysts(cb){ if(AN) return cb&&cb(); google.script.run.withSuccessHandler(t=>{try{AN=JSON.parse(t);}catch(e){AN={analysts:{}};} cb&&cb();}).withFailureHandler(()=>{AN={analysts:{}}; cb&&cb();}).getAnalysts(); }
const normB=b=>String(b||'').replace(/\s|\(주\)|증권|투자|금융|주식회사/g,'');   // research._norm_broker 와 동일
function anBadge(r){
  if(!r.analyst) return '';
  const a=AN&&AN.analysts&&(AN.analysts[normB(r.broker)+'|'+r.analyst]);
  if(!a) return ` <span class="mu">${esc(r.analyst)}</span>`;
  const st=[]; if(a.n60>=((AN.meta||{}).min_n||8)) st.push(`매수 적중 ${(a.hit60_buy*100).toFixed(0)}% (n=${a.n60}, 60일 초과수익 ${(a.exc60_buy>0?'+':'')+(a.exc60_buy*100).toFixed(1)}%)`); else st.push(`표본 부족 (n=${a.n})`);
  if(a.tp_hit!=null&&a.n_tp>=5) st.push(`목표가 도달 ${(a.tp_hit*100).toFixed(0)}%`);
  if(a.upside_med!=null) st.push(`평균 여력 ${(a.upside_med*100).toFixed(0)}%`);
  return ` <span class="an" title="${esc((a.style||[]).join(' · '))}">${esc(r.analyst)}<i>${esc(st.join(' · '))}${(a.style||[]).length?' · '+esc(a.style.join(' · ')):''}</i></span>`;
}
let VAL=null;
function valView(){   // 반도체 밸류에이션 바스켓 (reports/valuation.json) — 비율만, 참고 등급, 매매 트리거 아님
  if(VAL===null){ VAL=false; google.script.run.withSuccessHandler(t=>{try{VAL=JSON.parse(t);}catch(e){VAL={};} if(view==='val') render();}).withFailureHandler(e=>{VAL={err:/404/.test(e.message)?'밸류에이션 데이터가 아직 없습니다 (다음 자동 실행 때 생성)':e.message}; if(view==='val') render();}).getValuation(); return '<div class="load">LOADING …</div>'; }
  if(!VAL||!VAL.rows) return `<div class="grid"><div class="p c12"><h2>밸류에이션</h2><div class="b">${VAL&&VAL.err?`<div class="err">${esc(VAL.err)}</div>`:'<div class="mu">—</div>'}</div></div></div>`;
  const B=VAL.basket||{}, RT=VAL.rates||{}, D=B.decomp20||{}, S=B.rate_sens||{};
  const f=(x,d=1,s='')=>x==null?'—':Number(x).toFixed(d)+s;
  const trend=r=>{ if(!r.n_quarters) return '<span class="mu">재무 없음</span>'; const om=(r.op_margin_4q||[]).filter(x=>x!=null); const ar=om.length>=2?(om[om.length-1]>om[0]+0.01?'↑':om[om.length-1]<om[0]-0.01?'↓':'→'):'';
    return `${r.rev_yoy!=null?'매출 '+pct(r.rev_yoy,0):'<span class="mu">매출 —</span>'} · OPM ${ar}${om.length?(om[om.length-1]*100).toFixed(0)+'%':''}${r.ocf_ni!=null?' · OCF/NI '+f(r.ocf_ni,1):''}`; };
  const rows=VAL.rows.map(r=>`<tr><td class="l"><span class="sym am" data-sym="${esc(r.sym)}" data-mk="${r.mk}" style="cursor:pointer">${esc(r.name)}</span>${r.verified?'':' <span class="mu" title="분기 4개 미만 또는 데이터 없음">⚠검증전</span>'}</td><td>${r.loss?'적자':f(r.per,1)} / ${f(r.pbr,2)}</td><td class="l mu">${trend(r)}</td><td>${pct(r.rate_adj)}</td></tr>`).join('');
  const top=a=>(a||[]).map(x=>`${esc(x.name)} ${pct(x.rate_adj)}`).join(' / ')||'—';
  return `<div class="grid">
   <div class="p c12"><h2>반도체 밸류에이션 바스켓<small>가격 ${esc(VAL.asof)}${VAL.generated_at?` · 생성 ${esc(VAL.generated_at)} KST`:''} · 검증 ${B.n_verified||0}/${B.n||0} · ${esc(VAL.grade||'')}</small></h2><div class="b">
    <div class="mu" style="margin-bottom:6px">중앙 PER ${f(B.median_per,1)} · PBR ${f(B.median_pbr,2)} · 미 10Y ${f(RT.us10y,2,'%')}${RT.us10y_live?'(실시간)':''} (5일 ${f(RT.us10y_w1_bp,0,'bp')}${RT.us10y_date?' · '+esc(RT.us10y_date.slice(5))+' 기준':''}) · 국고 3Y ${f(RT.kr3y,2,'%')} (5일 ${f(RT.kr3y_w1_bp,0,'bp')}${RT.kr3y_date?' · '+esc(RT.kr3y_date.slice(5))+' 기준':''})</div>
    <table><tr><th class="l">종목</th><th title="${esc((VAL.definitions||{}).per||'')}">PER/PBR<br><span class="mu" style="font-weight:normal">보고이익 TTM</span></th><th class="l">이익추세</th><th>금리조정 매력</th></tr>${rows}</table>
    <div class="mu" style="margin-top:6px">금리조정 매력 상위: ${top(B.cheapest)} · 하위: ${top(B.richest)}</div>
    <div class="mu">20일 분해(중앙): 가격 ${pct(D.d_price)} = 멀티플 ${pct(D.d_multiple)} + EPS ${pct(D.d_eps)} · ${esc(D.basis||'')}</div>
    <div class="mu">금리 ±${S.bp||25}bp → 중앙 PER ${pct(S.up)} / ${pct(S.down)} · ${esc(S.formula||'')}</div>
    <div class="mu">다음 이벤트: ${((VAL.events||{}).next||[]).slice(0,4).map(e=>`${esc(e.date.slice(5))} ${esc(e.name)}`).join(' · ')||'—'} · 발동선: ${((VAL.events||{}).tripwires||[]).filter(t=>t.date).slice(0,3).map(t=>`${esc(t.date.slice(5))} ${esc(t.name)}`).join(' · ')}</div>
    <div class="mu" style="margin-top:4px">📎 비율만 · 금리조정 매력 = E/P − 무위험(US 미10Y, KR 국고3Y) · 매매 트리거 아님</div>
   </div></div></div>`;
}
let R=null, RV={m:'theme',d:30,q:'',o:(()=>{try{return localStorage.getItem('mt_rep_order')||'count';}catch(e){return 'count';}})()};
// 정렬 토글(10/17 겸이): count=리포트 많은 순 · new=최신순 · old=오래된순 (선택은 이 브라우저에 기억)
// 발간일 국면(10/17 겸이): rb = 'k' 코스피 기준 · 's' 해당 종목 주가 기준, rf = 전체/상승/조정/하락
RV.rb=(()=>{try{return localStorage.getItem('mt_rep_rb')||'k';}catch(e){return 'k';}})(); RV.rf='all';
function repRb(b){ RV.rb=b; try{localStorage.setItem('mt_rep_rb',b);}catch(e){} render(); }
const RGC={'상승':'up','조정':'am','하락':'dn'};
// 국면 용어 = screener/regime_tag.py 그대로 '상승/조정/하락' ('~장' 붙이지 않음 — 결재 #3 레짐 '상승장/회복확인/하락장'과 다른 체계, 감사 경-6)
// '서프라이즈'는 같은 줄에 컨센서스(예상치) 기준이 있을 때만 — 없으면 인용 표시 (screener/calendar_ev.surprise_guard 와 같은 규칙, 감사 경-7)
function surpNote(t){ t=String(t||''); return /서프라이즈|깜짝\s*실적/.test(t)&&!/컨센|예상치|기대치|시장\s*예상/.test(t)&&!/컨센서스 수치 없음/.test(t)?' <span class="mu" style="font-size:var(--fs-1)">(증권사 표현 인용 · 컨센서스 수치 없음)</span>':''; }
function rgOf(r){ return RV.rb==='s'?r.rg_s:r.rg_k; }
function rgBadge(r){ const g=rgOf(r); if(!g) return ''; return ` <span class="tag ${RGC[g.l]||''}" style="font-size:var(--fs-1);padding:0 4px" title="발간일 국면(regime_tag: 상승/조정/하락) · ${RV.rb==='s'?'종목':'코스피'} 기준 · 고점 대비 ${(g.dd*100).toFixed(0)}%${g.r20!=null?' · 20일 '+(g.r20*100).toFixed(0)+'%':''}${g.n<200?' · 관측 '+g.n+'일(고점 과소 가능)':''}">국면 ${g.l}</span>`; }
function repOrd(o){ RV.o=o; try{localStorage.setItem('mt_rep_order',o);}catch(e){} render(); }
const repCmp=(a,b)=>RV.o==='old'?a.localeCompare(b):b.localeCompare(a);
// 리포트 종류(kind) 필터 (10/20 겸이: 섹터·채권·매크로·외환·파생·전략·인뎁스도) — 종목 = 기존 research.json, 나머지 = research_views.json (screener/report_kind.py 분류)
const RKINDS=['종목','섹터','전략','매크로','채권','외환','파생','인뎁스','비종목 전체'];
RV.k=(()=>{try{return localStorage.getItem('mt_rep_kind')||'종목';}catch(e){return '종목';}})();
let RVW=null;
function repKind(k){ RV.k=k; try{localStorage.setItem('mt_rep_kind',k);}catch(e){} render(); }
function kindTabs(){ return `<span class="ctab">${RKINDS.map(k=>`<button class="${RV.k===k?'on':''}" onclick="repKind('${k}')">${k}${RVW&&RVW.kinds&&RVW.kinds[k]?` <span class="mu">${RVW.kinds[k].n}</span>`:''}</button>`).join('')}</span>`; }
// 리서치 종합 (애널 research-synthesis 10/21, 겸이 "달랑 리포트들만 있지 말궁") — reports/research_synthesis.json. 전부 '증권가 집계', 우리 판단 아님
let SYN=null;
let SYN_OPEN=(()=>{try{return localStorage.getItem('mt_syn_open')!=='0';}catch(e){return true;}})();
function synToggle(o){ SYN_OPEN=o; try{localStorage.setItem('mt_syn_open',o?'1':'0');}catch(e){} }
const synL=(rs)=>(rs||[]).filter(r=>r&&r.link).slice(0,2).map(r=>`<a href="${esc(r.link)}" target="_blank" title="${esc((r.date||'')+' '+(r.broker||'')+' '+(r.title||''))}">${esc((r.broker||'').replace(/투자증권|증권/,''))||'원문'}</a>`).join(' ');
const synTone=x=>x==null?'—':`<b class="${x>0.05?'up':x<-0.05?'dn':'mu'}">${x>0?'+':''}${x.toFixed(2)}</b>`;
function synSec(){
  if(!SYN){ google.script.run.withSuccessHandler(t=>{try{SYN=JSON.parse(t);}catch(e){SYN={err:'리서치 종합 파싱 실패'};} if(view==='rep') render();}).withFailureHandler(e=>{SYN={err:/404/.test(e.message)?'리서치 종합이 아직 없습니다 (매일 03:30 수집 뒤 생성)':(/getResearchSynthesis/.test(e.message)?'Code.gs 붙여넣기 필요 (getResearchSynthesis)':e.message)}; if(view==='rep') render();}).getResearchSynthesis();
    return '<div class="grid" id="syn"><div class="p c12"><h2>리서치 종합</h2><div class="b mu">LOADING …</div></div></div>'; }
  if(SYN.err) return `<div class="grid" id="syn"><div class="p c12"><h2>리서치 종합</h2><div class="b mu">${esc(SYN.err)}</div></div></div>`;
  const h=SYN.headline||{}, r=SYN.revisions||{}, d5=r.d5||{}, d20=r.d20||{}, c=r.consensus||{}, inp=SYN.inputs||{};
  const tw=(h.tone_weekly||[]).map(w=>`<span title="${esc(w.week)} 주 · ${w.n_docs}건">${w.index==null?'·':synTone(w.index)}</span>`).join(' ');
  const card=(t,sub,body,cls='c4')=>`<div class="p ${cls} syn"><h2>${t}<small>${sub}</small></h2><div class="b" style="font-size:var(--fs-2)">${body}</div></div>`;
  const tbl=(hd,rows)=>rows.length?`<table style="font-size:var(--fs-2)"><tr>${hd.map((x,i)=>`<th class="${i?'':'l'}">${x}</th>`).join('')}</tr>${rows.join('')}</table>`:'<div class="mu">해당 없음</div>';
  const nm=x=>x.code?`<span class="am sym" data-sym="${esc(x.code)}" data-mk="KR">${esc(x.name||x.code)}</span>`:esc(x.name||'');
  const nx=(()=>{const k=new Date(Date.now()+9*36e5), hm=k.toISOString().slice(11,16), wd=k.getUTCDay(), sl=SYN.collect_slots||['08:50','19:10'];
    if(wd>=1&&wd<=5){const n=sl.find(t=>t>hm); if(n) return '오늘 '+n;} for(let i=1;i<8;i++){const d=new Date(k.getTime()+i*864e5), w=d.getUTCDay(); if(w>=1&&w<=5) return `${d.toISOString().slice(5,10)} ${sl[0]}`;} return '—';})();
  const badge=`<span class="tag" style="font-size:var(--fs-1)">기준 ${esc(SYN.asof||'')} · 수집 ${esc((SYN.collected_at||'—').slice(5,16))} · 다음 수집 ${esc(nx)}</span>${SYN.today_n?` <b class="up" style="font-size:var(--fs-2)">오늘 ${SYN.today_n}건</b>`:` <span class="mu" style="font-size:var(--fs-1)">오늘 발간분 아직 없음</span>`}`;
  const c1=card('오늘의 증권가 한 줄',`생성 ${esc(SYN.generated_at||'')}`,
    `<div class="am" style="font-size:var(--fs-3);line-height:1.5">${esc(h.text||'')}</div>
     <div style="margin-top:6px">전략·매크로 톤 5일 ${synTone((h.tone5||{}).index)} <span class="mu">(강 ${(h.tone5||{}).bull||0}·약 ${(h.tone5||{}).bear||0}·${(h.tone5||{}).n_docs||0}건)</span> · 20일 ${synTone((h.tone20||{}).index)} · 주별 ${tw}</div>
     <div class="mu" style="font-size:var(--fs-1);margin-top:4px">${esc(SYN.label||'')} · 톤 = 어휘 사전 (강−약)/(강+약), 문맥 미반영 <b>검증전</b> · 신규(${esc(SYN.asof)} 발간·백필 제외) ${h.new_on_asof||0}건 ${synL(h.reports)} · 저장 종목 ${inp.stock_n||0}건(백필 ${inp.backfill_n||0}) ${Object.entries(inp.stock_by_source||{}).map(([k,v])=>esc(k)+' '+v).join('·')}</div>`,'c12');
  const rv=(x,dir)=>`<tr><td class="l">${nm(x)} <span class="mu">${esc(x.theme||'')}</span></td><td>${x.up}/${x.down}</td><td>${pct(x.med_tp_chg,0)}</td><td>${synL(x.reports)}</td></tr>`;
  const c2=card('목표가·의견 변화 맵',`5일 상향 ${d5.up||0}·하향 ${d5.down||0} / 20일 ${d20.up||0}·${d20.down||0}`,
    `<div>의견 상향 ${d20.op_up||0} · 하향 ${d20.op_down||0} (20일) · 컨센 목표가 20일 중앙 ${pct(c.median_chg_20d,1)||'—'} <span class="mu">(${c.n_codes||0}종목)</span></div>
     <div class="mu" style="margin-top:4px">5일 하향 상위</div>${tbl(['종목','상/하','중앙','원문'],(d5.top_down||[]).slice(0,4).map(x=>rv(x)))}
     <div class="mu" style="margin-top:4px">5일 상향 상위</div>${tbl(['종목','상/하','중앙','원문'],(d5.top_up||[]).slice(0,4).map(x=>rv(x)))}
     <div class="mu" style="margin-top:4px">컨센 변화 ↑ ${(c.top_up||[]).slice(0,3).map(x=>`${nm(x)} ${pct(x.chg,0)}`).join(' · ')||'—'}<br>컨센 변화 ↓ ${(c.top_down||[]).slice(0,3).map(x=>`${nm(x)} ${pct(x.chg,0)}`).join(' · ')||'—'}</div>`);
  const sr=(SYN.sectors||{}).rows||[];
  const c3=card('섹터 온도',`20일 · 섹터 리포트 ${(SYN.sectors||{}).sector_reports_20d||0}건`,
    tbl(['테마','건수','상향비율','20일 등락'],sr.slice(0,8).map(x=>`<tr><td class="l">${esc(x.theme)}</td><td>${x.n}</td><td>${x.up_ratio==null?'—':`<span class="${x.up_ratio>=0.6?'up':x.up_ratio<=0.4?'dn':'mu'}">${Math.round(x.up_ratio*100)}%</span> <span class="mu">${x.up}/${x.down}</span>`}</td><td>${x.r20==null?'<span class="mu">—</span>':pct(x.r20,1)}</td></tr>`))+`<div class="mu" style="font-size:var(--fs-1)">등락 = 위원회 테마 시세(이름이 같은 테마만) · 섹터 리포트 ${synL((SYN.sectors||{}).sector_links)}</div>`);

  const showThesis=r.thesis&&r.thesis!==r.title&&!r.view;   // 제목과 같은 '논지'는 정보가 없어 숨김
  const body=(r.view||showThesis||ev||r.risk||r.method)?`<div class="sm">${r.view?`<div><span class="k">핵심</span><b>${esc(r.view)}</b></div>`:''}${showThesis?`<div><span class="k">논지</span>${esc(r.thesis)}</div>`:''}${ev?`<div><span class="k">근거</span><ul>${ev}</ul></div>`:''}${r.risk?`<div><span class="k">변수</span>${esc(r.risk)}</div>`:''}${r.method?`<div><span class="k">밸류</span>${esc(r.method)}</div>`:''}</div>`:(r.summary&&r.summary!=='-'?`<div class="sm">${esc(r.summary)}</div>`:'');
  return `<div class="rp"><div><span class="mu">${r.date}</span>${rgBadge(r)} <b>${esc(r.broker)}</b>${anBadge(r)} · ${esc(r.opinion||'—')} · TP ${r.target?num(r.target):'—'}${ch}${op} ${tone}</div><div class="rt">${r.link?`<a href="${esc(r.link)}" target="_blank">${esc(r.title||'원문')}</a>`:esc(r.title||'')}${surpNote(r.title)}${r.curated?'':' <span class="mu">· 자동 요약</span>'}</div>${body}</div>`;
}
function stockRows(ss,showSec){ if(!ss.length) return '<div class="mu">해당 기간 리포트 없음</div>';
  return `<table><tr><th></th><th class="l">종목</th>${showSec?'<th class="l">섹터</th>':''}<th class="l">핵심 뷰</th><th class="l">최근</th><th>종가</th></tr>${ss.map(s=>`<tr><td class="tg" title="증권사별 요약 펼치기">▸</td><td class="l am sym" data-sym="${esc(s.code)}" data-mk="KR">${esc(s.name)} <span class="mu">${esc(s.code)}</span></td>${showSec?`<td class="l mu">${esc(s.sector)}</td>`:''}<td class="l">${coreView(s)}</td><td class="l mu">${s.last.date}</td><td>${s.close?num(s.close):'—'}</td></tr><tr class="sub"><td></td><td colspan="${showSec?5:4}">${s.rs.map(repLine).join('')}</td></tr>`).join('')}</table>`; }
function repBody(it){
  if(RV.m==='all'){ it=[...it].sort((a,b)=>RV.o==='old'?a.date.localeCompare(b.date):b.date.localeCompare(a.date)); }
  if(RV.m==='all') return it.length?`<table><tr><th class="l">날짜</th><th class="l">종목</th><th class="l">섹터</th><th class="l">증권사</th><th class="l">의견</th><th>TP</th><th class="l">제목</th></tr>${it.map(r=>`<tr><td class="l mu">${r.date}${rgBadge(r)}</td><td class="l am sym" data-sym="${esc(r.code)}" data-mk="KR">${esc(r.name)}</td><td class="l mu">${esc(r.sector||'기타')}</td><td class="l">${esc(r.broker)}</td><td class="l">${esc(r.opinion||'')}</td><td>${r.target?num(r.target):'—'}</td><td class="l">${r.link?`<a href="${esc(r.link)}" target="_blank">${esc(r.title||'리포트')}</a>`:esc(r.title||'')}${surpNote(r.title)}</td></tr>`).join('')}</table>`:'<div class="mu">해당 기간 리포트 없음</div>';
  let ss=stockAgg(it);
  if(RV.o!=='count') ss=[...ss].sort((a,b)=>repCmp(a.last.date,b.last.date));
  if(RV.m==='stock') return stockRows(ss,true);
  const gk=RV.m==='theme'?'theme':'sector';
  const g=new Map(); for(const s of ss){ if(!g.has(s[gk])) g.set(s[gk],[]); g.get(s[gk]).push(s); }
  const tot=a=>a.reduce((x,s)=>x+s.n,0);
  const gl=a=>a.reduce((x,s)=>s.last.date>x?s.last.date:x,'');
  return [...g.entries()].sort((a,b)=>RV.o==='count'?tot(b[1])-tot(a[1]):repCmp(gl(a[1]),gl(b[1]))).map(([sec,a])=>`<details open class="sec"><summary><b class="am">${esc(sec)}</b> <span class="mu">${tot(a)}건 · ${a.length}종목</span></summary>${stockRows(a,false)}</details>`).join('')||'<div class="mu">해당 기간 리포트 없음</div>'; }
document.addEventListener('click',e=>{const t=e.target.closest('td.tg'); if(!t) return; const sub=t.parentElement.nextElementSibling; if(sub&&sub.classList.contains('sub')){sub.classList.toggle('on'); t.textContent=sub.classList.contains('on')?'▾':'▸';}});

/* 상단 3칸 어댑터 (묶음 B, 10/26) — Index.html TOPF·mkTop·topMount. 기존 문장·수치 재배치만, 근거 없으면 NA(사유). */
if(typeof TOPF==='object'){
TOPF.rep=()=>{ if(typeof SYN!=='undefined'&&SYN&&isTop(SYN.top)) return SYN.top; if(!SYN) return null;
  const h=(SYN.headline||{}).text; return mkTop(h||NA('헤드라인 없음'),SYN.label||'증권가 집계 — 우리 판단·매매 신호 아님',NA('괴리 데이터 없음'),['reports/research_synthesis.json'],SYN.generated_at||SYN.asof); };
TOPF.val=()=>{ if(VAL===null||VAL===false) return null; if(VAL&&isTop(VAL.top)) return VAL.top; if(!VAL||!VAL.basket) return mkTop(NA(VAL&&VAL.err||'밸류에이션 데이터 없음'),NA('—'),NA('—'),['reports/valuation.json']);
  const b=VAL.basket, d=b.decomp20||{}, s=b.rate_sens||{}, f=(x,n=1)=>x==null?'—':Number(x).toFixed(n), P=x=>x==null?'—':(x>0?'+':'')+(x*100).toFixed(1)+'%';
  const ev=((VAL.events||{}).next||[])[0];
  return mkTop([`반도체 바스켓 중앙 PER ${f(b.median_per)}(런레이트 ${f(b.median_per_run_rate)}) · PBR ${f(b.median_pbr,2)} (검증 ${b.n_verified}/${b.n})`,`20일 분해: 가격 ${P(d.d_price)} = 멀티플 ${P(d.d_multiple)} + EPS ${P(d.d_eps)}`],
    [`금리 ±${s.bp||'—'}bp → 중앙 PER ${P(s.up)}/${P(s.down)} (ERP 고정 가정)`,'밸류에이션은 참고(검증전) — 매매 트리거 아님'],ev?`다음 이벤트 ${String(ev.date).slice(5)} ${ev.name} 확인`:'조치 없음(예정 이벤트 없음)',['reports/valuation.json'],VAL.generated_at||VAL.asof,{grade:'검증전'}); };
TOPF.dart=()=>{ if(!DS) return null; const it=DS.items||[], fl=it.filter(r=>r.flag||/주의|희석/.test(r.category||''));
  return mkTop(DS.err?NA(DS.err):`공시 ${it.length}건`+(DS.asof?` (${DS.asof})`:''),fl.length?`주의·희석 분류 ${fl.length}건 — 키워드 분류(검증전)`:NA('주의·희석 공시 없음'),fl.length?'⚠ 주의·희석 필터로 원문 확인(애널)':'조치 없음',['reports/disclosures.json'],DS.asof); };
}
