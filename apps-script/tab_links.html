<script>
/* ── RESEARCH › 관계도 — 데이터 = reports/company_links.json(애널 수작업) + reports/company_links_auto.json(애널 DART 원문 자동 추출, tier 1/2/3·체인별 groups).
   병합: 같은 엣지(from·to·유형, customer=supply 같은 방향)면 수작업 우선 — 자동 쪽은 tier·groups 만 보탬. 출처 배지 '1차(자동)'.
   공급: Pages getCompanyLinks·getCompanyLinksAuto(build_pages.py) · GAS Code.gs 짝은 개발 ask(없으면 화면이 안내만). 실제 파일이 없으면(404) 로컬 개발용 tests/fixtures/*_sample.json(예시 배지).
   보기: ① 그룹 전체(간이 force, 상위 N + 더 보기) ② 회사 중심(가운데 회사 · 1단계 거래처 · 2단계 = 공급사의 공급사/고객의 고객, 왼쪽 반원 = 공급·투자, 오른쪽 = 고객)
         ③ 공급망 계단(체인 하나 · 3차→2차→1차→앵커→고객 칸, 왼쪽→오른쪽 = 제품이 가는 방향). 그림 = 순수 SVG, 확대/이동 = <g> transform 만 바꿈(다시 그리지 않음).
   규모: 인접 목록 1회 색인(O(E)) · 그림에 올리는 회사는 상한(그룹 300·고리 1단계 24/2단계 60·계단 칸당 30, '더 보기'로 늘림) — 노드 1,000·엣지 3,000 표본에서 ui_smoke 가 그리기 시간을 잰다. */
/*LK-PURE-BEGIN — DOM 없는 순수 함수(tests/test_company_links_view.py 가 node 로 직접 돌린다) */
function lkFlowT(t){ return t==='customer'?'supply':String(t||''); }
function lkEKey(e){ return e.from+'|'+e.to+'|'+lkFlowT(e.type); }
function lkMerge(man,auto){
  man=man||{};
  const D={asof:man.asof||(auto&&auto.asof)||'', basis:man.basis, note:man.note, _example:man._example||null, groups:[], nodes:[], edges:[], _stat:{man:0,auto:0,dup:0,autoN:0}, _auto:null};
  const gb={}, nb={}, keys=new Map();
  const addG=(g,a)=>{ if(!g||!g.key) return; const o=gb[g.key]; if(o){ for(const k in g) if(o[k]==null) o[k]=g[k]; return; } gb[g.key]=Object.assign({},g,a?{_auto:true}:{}); D.groups.push(gb[g.key]); };
  const addN=(n,a)=>{ if(!n||n.id==null) return; const o=nb[n.id];
    if(o){ for(const k in n) if(o[k]==null) o[k]=n[k]; if(n.groups) o.groups=[...new Set([...(o.groups||[]),...n.groups])]; return; }
    nb[n.id]=Object.assign({},n,a?{_auto:true}:{}); D.nodes.push(nb[n.id]); if(a) D._stat.autoN++; };
  (man.groups||[]).forEach(g=>addG(g,false)); (man.nodes||[]).forEach(n=>addN(n,false));
  (man.edges||[]).forEach(e=>{ const x=Object.assign({},e); D.edges.push(x); D._stat.man++; const k=lkEKey(x); if(!keys.has(k)) keys.set(k,x); });
  if(auto){ const ex=auto._example||null; D._auto={asof:auto.asof||'', example:ex, n:(auto.edges||[]).length};
    (auto.groups||[]).forEach(g=>addG(g,true)); (auto.nodes||[]).forEach(n=>addN(n,true));
    (auto.edges||[]).forEach(e=>{ const k=lkEKey(e), o=keys.get(k);
      if(o){ D._stat.dup++; if(o.tier==null&&e.tier!=null) o.tier=e.tier; if(e.groups) o.groups=[...new Set([...(o.groups||[]),...e.groups])]; return; }   // 같은 엣지 = 수작업 우선
      const x=Object.assign({},e,{_auto:true}); if(ex) x._ex=true; keys.set(k,x); D.edges.push(x); D._stat.auto++; }); }
  D.edges=D.edges.filter(e=>nb[e.from]&&nb[e.to]&&e.from!==e.to);   // 끝 회사가 없는 관계는 버림(건수도 버린 뒤로 셈)
  D._stat.auto=D.edges.filter(e=>e._auto).length; D._stat.man=D.edges.length-D._stat.auto;
  return D;
}
function lkIndex(D){ D._by={}; D._in={}; D._out={}; D._deg={};
  D.nodes.forEach(n=>{ D._by[n.id]=n; D._in[n.id]=[]; D._out[n.id]=[]; D._deg[n.id]=0; });
  D.edges.forEach(e=>{ if(!D._by[e.from]||!D._by[e.to]) return; D._out[e.from].push(e); D._in[e.to].push(e); D._deg[e.from]++; D._deg[e.to]++; });
  return D; }
function lkRank(D){ return (a,b)=>(D._deg[b]||0)-(D._deg[a]||0)||((+(D._by[b]||{}).mc_usd||0)-(+(D._by[a]||{}).mc_usd||0))||String(a).localeCompare(String(b)); }
function lkSubG(D,gk){   // 그룹의 회사·관계 (엣지 groups 우선, 없으면 양 끝 회사가 그룹에 속하면)
  const inG=n=>!!n&&(n.groups||[]).includes(gk);
  const E=D.edges.filter(e=>e.groups?e.groups.includes(gk):(inG(D._by[e.from])&&inG(D._by[e.to])));
  const ids=new Set(D.nodes.filter(inG).map(n=>n.id)); E.forEach(e=>{ ids.add(e.from); ids.add(e.to); });
  return {ids:[...ids], E}; }
function lkTopN(D,ids,E,cap){   // 그룹 안 관계 수(동률 = 전체 관계 수·기업가치) 상위 cap 개
  const dg={}; E.forEach(e=>{ dg[e.from]=(dg[e.from]||0)+1; dg[e.to]=(dg[e.to]||0)+1; }); const r=lkRank(D);
  const ord=[...ids].sort((a,b)=>(dg[b]||0)-(dg[a]||0)||r(a,b)), keep=new Set(ord.slice(0,cap));
  return {ids:ord.filter(i=>keep.has(i)), E:E.filter(e=>keep.has(e.from)&&keep.has(e.to)), total:ord.length}; }
function lkEgo(D,c,cap1,cap2,keep){   // 회사 중심: 1단계 = 직접 거래처, 2단계 = 공급사의 공급사(위쪽 흐름)·고객의 고객(아래쪽 흐름). keep(id)=false 인 회사는 그림 대신 출구(ex)로
  if(!D._by[c]) return null; const r=lkRank(D), side={}, K=keep||(()=>true);
  D._in[c].forEach(e=>{ side[e.from]=(side[e.from]||0)|1; });   // 1 = 공급·투자 쪽(나에게 들어옴)
  D._out[c].forEach(e=>{ side[e.to]=(side[e.to]||0)|2; });      // 2 = 고객·피투자 쪽(나에게서 나감)
  const allN=Object.keys(side).sort(r), all1=allN.filter(K), ex=allN.filter(i=>!K(i)).map(id=>({id, side:side[id]})), r1=all1.slice(0,cap1), in1=new Set(allN), s2={}, via={};
  const add2=(x,s,p)=>{ if(x===c||in1.has(x)||!K(x)) return; s2[x]=(s2[x]||0)|s; (via[x]||(via[x]=new Set())).add(p); };
  r1.forEach(id=>{ if(side[id]&1) D._in[id].forEach(e=>add2(e.from,1,id)); if(side[id]&2) D._out[id].forEach(e=>add2(e.to,2,id)); });
  const all2=Object.keys(s2).sort(r), r2=all2.slice(0,cap2), ring={}; ring[c]=0; r1.forEach(i=>ring[i]=1); r2.forEach(i=>ring[i]=2);
  const E=D.edges.filter(e=>ring[e.from]!=null&&ring[e.to]!=null&&!(ring[e.from]===2&&ring[e.to]===2));
  return {c, r1:r1.map(id=>({id, side:side[id]})), r2:r2.map(id=>({id, side:s2[id], via:[...via[id]]})), n1:all1.length, n2:all2.length, E, ex}; }
function lkTiers(D,gk,anchor){   // 공급망 계단: 0 = 완성·대형(앵커), 1·2·3 = 1차·2차·3차+ 협력, -1 = 앵커 고객(앵커 1개일 때만).
  // 자동 추출 노드 tier(1=완성·대형 2=1차 협력 3=2차 협력, holding=지주→0)를 먼저 쓰고, 없으면 앵커에서 공급 방향 거꾸로 BFS
  const S=lkSubG(D,gk), ids=S.ids, E=S.E, inS=new Set(ids), g=D.groups.find(x=>x.key===gk)||{};
  const nt=i=>{ const v=(D._by[i]||{}).tier; return v==='holding'?1:(+v>=1?+v:null); };
  let anc=anchor&&inS.has(anchor)?[anchor]:g.anchor&&inS.has(g.anchor)?[g.anchor]:ids.filter(i=>nt(i)===1);
  if(!anc.length){ const ind={}; E.forEach(e=>{ if(e.type!=='investment') ind[e.to]=(ind[e.to]||0)+1; }); const r=lkRank(D), a=ids.slice().sort((x,y)=>(ind[y]||0)-(ind[x]||0)||r(x,y))[0]; if(a!=null) anc=[a]; }
  const t={}; if(!anc.length) return {anchor:null, anchors:[], tier:t, E:[], out:0};
  anc.forEach(i=>t[i]=0);
  ids.forEach(i=>{ if(t[i]==null){ const v=nt(i); if(v>=2) t[i]=v-1; } });
  const inb={}, outb={}; E.forEach(e=>{ (inb[e.to]||(inb[e.to]=[])).push(e); (outb[e.from]||(outb[e.from]=[])).push(e); });
  const d={}; anc.forEach(i=>d[i]=0); let q=anc.slice();
  while(q.length){ const nq=[]; for(const x of q) for(const e of (inb[x]||[])) if(e.type!=='investment'&&d[e.from]==null){ d[e.from]=d[x]+1; nq.push(e.from); } q=nq; }
  ids.forEach(i=>{ if(t[i]==null&&d[i]!=null) t[i]=d[i]; });
  if(anc.length===1) (outb[anc[0]]||[]).forEach(e=>{ if(t[e.to]==null) t[e.to]=-1; });
  Object.keys(t).forEach(i=>{ if(t[i]>3) t[i]=3; });
  return {anchor:anc.length===1?anc[0]:null, anchors:anc, tier:t, E:E.filter(e=>t[e.from]!=null&&t[e.to]!=null&&e.from!==e.to), out:ids.filter(i=>t[i]==null).length}; }
/* 위계(11/1 겸이 「그 체인도 부동산처럼 클릭하면 커지고 이런 식으로 위계」): L0 섹터 → L1 세그먼트(체인·층) → L2 회사 → L3 회사 중심 */

    if(k==='grp') LKV.cap.grp=Math.min(300,LKV.cap.grp+20); else if(k==='ego'){ LKV.cap.r1+=12; LKV.cap.r2+=8; } else if(k==='l2') LKV.cap.l2+=16; else if(k==='agg') LKV.cap.agg+=14; else if(k==='stair') LKV.cap.stair+=30; else if(k==='rows') LKV.rows+=60; render(); return; }
  const g=e.target.closest('[data-lkg]'); if(g){ LKV.g=g.dataset.lkg; LKV.sel=null; LKV.cap.grp=20; lkSave(); render(); return; }
  const sg=e.target.closest('[data-lksg]'); if(sg){ LKV.sg=sg.dataset.lksg; LKV.sel=null; LKV.cap.stair=30; lkSave(); render(); return; }
  const t=e.target.closest('[data-lk]'); if(!t) return; const id=t.dataset.lk; LKV.sel=id&&id!==LKV.sel?id:null; LKV.rows=40; render(); });
document.addEventListener('keydown',e=>{ if(view!=='links'||(e.key!=='Enter'&&e.key!==' ')) return;
  if(e.target.classList&&e.target.classList.contains('lk-q')){ if(e.key==='Enter'){ const h=lkSearch(e.target.value)[0]; if(h){ e.preventDefault(); lkGoEgo(h.id); } } return; }
  const t=e.target.closest&&e.target.closest('[data-lk],[data-lkh],[data-lkmore]'); if(!t||/^(BUTTON|A)$/.test(t.tagName)) return; e.preventDefault(); t.dispatchEvent(new MouseEvent('click',{bubbles:true})); });
if(typeof TOPF==='object') TOPF.links=()=>{ if(!LK||LK._loading) return null; if(LK.err) return mkTop(NA(LK.err),NA('—'),NA('—'),['reports/company_links.json']);
  const st={}; LK.edges.forEach(e=>{ const s0=e.status||'검증전', k=e._auto&&!/자동/.test(s0)?s0+'(자동)':s0; st[k]=(st[k]||0)+1; });
  return mkTop(`기업 관계도 ${LK.groups.length}그룹 · 회사 ${LK.nodes.length} · 관계 ${LK.edges.length}건${LK._example?' (예시 데이터)':''}`,
    `출처 1차 ${st['1차']||0} · 1차(자동) ${st['1차(자동)']||0} · 2차 ${st['2차']||0} · 검증전 ${(st['검증전']||0)+(st['검증전(자동)']||0)} — 애널 데스크 수집, 우리 새 판정 아님`,'섹터 → 체인·층 → 회사 → 회사 중심(검색으로 바로)',['reports/company_links.json','reports/company_links_auto.json'],LK.asof); };
</script>
