<!-- tab_bond.html — MARKET › 채권 — bondView·AI 인프라 신용 감시·금리 히스토리.
     apps-script/Index.html 이 include('tab_bond') 템플릿 태그로 끼워 넣는다 (GAS 는 HtmlService include, Pages 는 scripts/build_pages.py 가 인라인).
     전역 도우미($·esc·num·pct·render·setView·openDetail 등)는 Index.html 에 있다. -->
<script>
let BND=null, BDCH=null;
function bondView(){
  if(BND===null){ BND=false; google.script.run.withSuccessHandler(t=>{try{BND=JSON.parse(t);}catch(e){BND={};} if(view==='bond') render();}).withFailureHandler(()=>{BND={};if(view==='bond') render();}).getBonds(); return '<div class="load">LOADING …</div>'; }
  const o=BND; if(!o||!o.us) return '<div class="grid"><div class="p c12"><div class="b mu">채권 데이터 생성 전</div></div></div>';
  const U=o.us.chg||{}, K=o.kr.chg||{}, S=o.spreads||{};
  const bp=(x,inv)=>x==null?'<td class="mu">—</td>':`<td class="${inv===0||x===0?'mu':x>0?'dn':'up'}">${x>0?'+':''}${x.toFixed(0)}</td>`;
  // 금리 행: 금리↑ = 채권 가격↓ → 빨강(dn)
  const yr=(lab,c,tip)=>c&&c.v!=null?`<tr title="${esc(tip||'')}"><td class="l">${lab}</td><td><b>${c.v.toFixed(2)}%</b></td>${bp(c.d1)}${bp(c.w1)}${bp(c.m1)}${bp(c.y1)}</tr>`:'';
  const sr=(lab,c,cred,tip)=>c&&c.v!=null?`<tr title="${esc(tip||'')}"><td class="l">${lab}</td><td><b>${c.v*100>0?'+':''}${(c.v*100).toFixed(0)}bp</b></td>${bp(c.d1,cred?undefined:0)}${bp(c.w1,cred?undefined:0)}${bp(c.m1,cred?undefined:0)}${bp(c.y1,cred?undefined:0)}</tr>`:'';
  const hdr='<tr><th class="l">항목</th><th>현재</th><th>1D</th><th>1W</th><th>1M</th><th>1Y</th></tr>';
  const sub=t=>`<tr><td class="l am" colspan="6" style="padding-top:6px">${t}</td></tr>`;
  const key=`<table>${hdr}${sub('미국채 <span class="mu">'+esc(o.us.asof||'')+'</span>')}${yr('3개월',U['3M'])}${yr('2년',U['2Y'])}${yr('10년',U['10Y'])}${yr('30년',U['30Y'])}
    ${sub('한국 <span class="mu">'+esc(o.kr.asof||'')+'</span>')}${yr('국고 3년',K['3Y'])}${yr('국고 10년',K['10Y'])}${yr('CD 91일',K['CD'])}${yr('회사채 AA− 3년',K['AA'])}${yr('회사채 BBB− 3년',K['BBB'])}
    ${sub('금리차 · 스프레드')}${sr('미 10Y−2Y',S.us_10_2,0,'마이너스 = 역전')}${sr('미 10Y−3M',S.us_10_3m,0,'연준이 중시한다고 알려진 역전 지표')}${sr('한 10Y−3Y',S.kr_10_3,0)}${sr('AA− − 국고3Y',S.kr_aa,1,'신용 스프레드: 벌어지면 위험 회피')}${sr('BBB− − 국고3Y',S.kr_bbb,1)}${sr('한 10Y − 미 10Y',S.krus_10,0,'마이너스 = 한국 금리가 더 낮음')}</table>
    <div class="mu" style="font-size:var(--fs-1);margin-top:4px;white-space:normal">변화는 bp(0.01%p). 금리 색 = 채권 가격 기준: 금리↑(가격↓) <span class="dn">빨강</span>, 금리↓(가격↑) <span class="up">초록</span>. 신용 스프레드 확대도 빨강. 마우스를 올리면 설명.</div>`;
  const src=Object.entries(o.sources||{}).map(([k,v])=>`<span class="${String(v).startsWith('ok')?'mu':'dn'}">${esc(k)}: ${esc(v)}</span>`).join('<br>');
  // 수익률 곡선 (만기 축은 √년 간격)
  const curveSvg=(cv,keys,yrs,title)=>{ const n=cv.now||{}; if(!Object.keys(n).length) return '';
    const W=520,H=190,pl=40,pr=10,pt=14,pb=26, ks=keys.filter(k=>n[k]!=null);
    const all=['now','m1','y1'].flatMap(s=>ks.map(k=>(cv[s]||{})[k]).filter(v=>v!=null)); let lo=Math.min(...all), hi=Math.max(...all); const pad=(hi-lo)*0.12||0.2; lo-=pad; hi+=pad;
    const xm=Math.sqrt(yrs[ks[ks.length-1]]), X=k=>pl+(W-pl-pr)*Math.sqrt(yrs[k])/xm, Y=v=>pt+(H-pt-pb)*(1-(v-lo)/(hi-lo));
    const line=(s,c,dash)=>{ const pts=ks.filter(k=>(cv[s]||{})[k]!=null).map(k=>`${X(k).toFixed(1)},${Y(cv[s][k]).toFixed(1)}`); return pts.length>1?`<polyline points="${pts.join(' ')}" fill="none" style="stroke:${c};stroke-width:${s==='now'?2.2:1.4}" ${dash?'stroke-dasharray="4 3"':''}/>`+(s==='now'?ks.map(k=>`<circle cx="${X(k).toFixed(1)}" cy="${Y(n[k]).toFixed(1)}" r="2.6" style="fill:${c}"><title>${k} ${n[k].toFixed(2)}%</title></circle>`).join(''):''):''; };
    let g=''; for(let i=0;i<=4;i++){ const v=lo+(hi-lo)*i/4, y=Y(v); g+=`<line x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}" style="stroke:var(--line)"/><text x="${pl-4}" y="${y+3}" text-anchor="end" font-size="10" style="fill:var(--muted)">${v.toFixed(2)}</text>`; }
    g+=ks.map(k=>`<text x="${X(k)}" y="${H-8}" text-anchor="middle" font-size="10" style="fill:var(--muted)">${k}</text>`).join('');
    return `<div class="mu" style="font-size:var(--fs-2);margin:4px 0 0">${title} <span style="color:var(--amber)">━ 현재</span> <span style="color:var(--cyan)">╍ 1개월 전</span> <span>╍ 1년 전</span></div>
      <svg viewBox="0 0 ${W} ${H}" style="display:block;width:100%;max-width:${W}px;height:auto;font-family:inherit">${g}${line('y1','var(--muted)',1)}${line('m1','var(--cyan)',1)}${line('now','var(--amber)')}</svg>`; };
  const UY={'1M':1/12,'3M':.25,'6M':.5,'1Y':1,'2Y':2,'3Y':3,'5Y':5,'7Y':7,'10Y':10,'20Y':20,'30Y':30};
  const f2=x=>x==null?'—':x.toFixed(2), sc=x=>x==null?'<td class="mu">—</td>':`<td class="${x>0?'up':x<0?'dn':'mu'}">${x>0?'+':''}${x.toFixed(1)}%</td>`;
  const dur=(o.duration||[]).map(d=>`<tr><td class="l">${esc(d.n)}</td><td class="l mu">${esc(d.kind)}</td><td>${f2(d.dur)}</td><td class="mu">${d.conv==null?'—':d.conv.toFixed(0)}</td>${sc(d.scen['-100'])}${sc(d.scen['-50'])}${sc(d.scen['50'])}${sc(d.scen['100'])}<td>${d.carry==null?'—':d.carry.toFixed(2)+'%'}</td><td>${d.be_bp==null?'—':'+'+d.be_bp+'bp'}</td></tr>`).join('');
  const etf=(o.etf||[]).map(e=>`<tr><td class="l">${esc(e.n)}</td><td>${e.close==null?'—':num(e.close,e.mk==='KR'?0:2)}</td><td>${pct(e.r1,2)}</td><td>${pct(e.r20,1)}</td><td>${pct(e.r250,1)}</td><td class="mu">${f2(e.dur)}</td><td class="l mu" style="white-space:normal;font-size:var(--fs-1)">${esc(e.role)}</td></tr>`).join('');
  const C=o.corr||{}, cc=x=>x==null?'<td class="mu">—</td>':`<td class="${x>0.2?'dn':x<-0.2?'up':'mu'}"><b>${x>0?'+':''}${x.toFixed(2)}</b></td>`;
  const corr=Object.values(C).map(c=>`<tr><td class="l">${esc(c.a)}</td><td class="l mu">${esc(c.b)}</td>${cc(c.c250)}${cc(c.c60)}<td class="mu">${c.n}</td></tr>`).join('');
  const veh=(o.vehicles||[]).map(v=>`<tr><td class="l">${esc(v.name)}</td><td>${v.y==null?'—':v.y.toFixed(2)+'%'}${v.ylabel?`<div class="mu" style="font-size:var(--fs-1)">${esc(v.ylabel)}</div>`:''}</td><td>${f2(v.dur)}</td><td>${v.up100==null?'<span class="mu">해당 없음</span>':'<span class="up">+'+v.up100.toFixed(1)+'%</span>'}</td><td class="l ${v.fx.startsWith('있음')?'am':'mu'}">${esc(v.fx)}</td><td class="l mu" style="white-space:normal;font-size:var(--fs-1);min-width:150px">${esc(v.tax)}</td><td class="l" style="white-space:normal;font-size:var(--fs-1);min-width:180px">${esc(v.role)}</td></tr>`).join('');
  const cu=o.credit_us;
  setTimeout(drawBondHist,0);
  const _u10=(U['10Y']||{}).v, _u10m=(U['10Y']||{}).m1, _cs=(S.us_10_2||{}).v, _aa=(S.kr_aa||{}).v, _aam=(S.kr_aa||{}).m1, _cr=((o.corr||{}).rows||o.corr||[]);
  const easy=`<div class="p c12"><h2>처음이면 이것만<small>채권 기초 3가지 (현재 상황은 위 3줄)</small></h2><div class="b" style="line-height:1.8;white-space:normal">
   <div>① <b>금리가 오르면 채권값은 내려가</b> (시소). 미국 10년 금리 ${_u10!=null?_u10.toFixed(2)+'%':'—'}${_u10m!=null?` · 한 달 새 ${_u10m>0?'+':''}${_u10m.toFixed(0)}bp(0.01%p 단위) ${_u10m>0?'올랐어 → 채권값↓, 성장주·반도체에도 부담':'내렸어 → 채권값↑'}`:''}.</div>
   <div>② <b>짧은 금리 &lt; 긴 금리면 정상</b>, 뒤집히면(역전) 경기 걱정 신호야. 지금 미국 10년−2년 ${_cs!=null?(_cs*100>0?'+':'')+(_cs*100).toFixed(0)+'bp → '+(_cs>0?'정상':'역전'):'—'}.</div>
   <div>③ <b>회사채 − 국채 금리 차이(신용 스프레드)가 벌어지면</b> 돈 빌려주기 무섭다는 뜻 = 위험 회피. 지금 한국 AA− ${_aa!=null?(_aa*100).toFixed(0)+'bp':'—'}${_aam!=null?` (한 달 ${_aam>0?'+':''}${_aam.toFixed(0)}bp) → ${Math.abs(_aam)<10?'조용해':'움직이는 중'}`:''}.</div>
   <div class="mu" style="font-size:var(--fs-2);margin-top:4px">나머지 표·차트는 이 세 가지를 자세히 본 거야. 모르는 칸은 건너뛰어도 돼 — STUDY 탭 '채권 기초'에서 차근차근.</div></div></div>`;
  const aic=aiCreditPanel(o.ai_credit,o);
  return `<div class="grid">${bondNow(o)}${easy}${aic}
   <div class="p c6"><h2>핵심 숫자<small>데이터 ${esc(o.asof||'—')} · 생성 ${esc(o.generated_at||'')} KST</small></h2><div class="b">${key}</div></div>
   <div class="p c6"><h2>해석<small>규칙 기반 · 숫자 인용</small></h2><div class="b" style="line-height:1.75;white-space:normal">${(o.notes||[]).map(x=>'<div>• '+esc(x)+'</div>').join('')}
     <div class="mu" style="font-size:var(--fs-1);margin-top:8px;line-height:1.5">데이터 소스<br>${src}</div></div></div>
   <div class="p c6"><h2>수익률 곡선<small>만기별 금리 · 가로축 √만기</small></h2><div class="b">${curveSvg(o.us.curve||{},Object.keys(UY),UY,'미국채')}${curveSvg(o.kr.curve||{},['1Y','2Y','3Y','5Y','10Y','20Y','30Y'],UY,'한국 국고채')}</div></div>
   <div class="p c6"><h2>금리차 추이<small>bp · 0 아래 = 역전</small></h2><div class="b"><div id="bdh" style="height:300px"></div><div id="bdleg" class="mu" style="font-size:var(--fs-1);margin-top:4px"></div>${cu?`<div style="font-size:var(--fs-2);margin-top:6px">미국 신용 프록시 HYG/IEF ${cu.v} · 1개월 ${pct(cu.r20,1)} · 3개월 ${pct(cu.r60,1)} <span class="mu">(내리면 하이일드가 국채보다 약함 = 위험 회피)</span></div>`:''}</div></div>
   <div class="p c12"><h2>듀레이션 · 금리 시나리오<small>금리가 이만큼 바뀌면 가격은? · 액면채는 −D·Δy + ½·C·Δy², ETF는 −D·Δy (근사)</small></h2><div class="b" style="overflow-x:auto">
     <table><tr><th class="l">채권</th><th class="l">계산</th><th>듀레이션 D</th><th>볼록성 C</th><th>금리 −1%p</th><th>−0.5%p</th><th>+0.5%p</th><th>+1%p</th><th>1년 이자</th><th>손익분기 금리 상승</th></tr>${dur}</table>
     <div class="mu" style="font-size:var(--fs-1);margin-top:6px;white-space:normal;line-height:1.6">듀레이션 = 금리 1%p 변화당 가격 변화 %. 액면채는 현재 금리로 계산(반년 이자 지급 가정). ETF 듀레이션은 운용사 공시 실효 듀레이션 근처의 <b>근사 상수</b>(TLT ~16, IEF ~7.5, SHY ~1.9, LQD ~8.5, HYG ~3.5, 국고3년 ETF ~2.8, 국고10년 ETF ~8)이고 ETF '1년 이자'는 해당 만기 국채금리로 대신함. 손익분기 = 1년 이자 ÷ D: 1년 동안 금리가 이만큼 넘게 오르면 이자를 받고도 손해. 하이일드·회사채는 금리 말고 신용 위험(경기)으로도 움직임.</div></div></div>
   <div class="p c12"><h2>포트폴리오 편입<small>장기 자산배분용 후보 비교 · 일반 정보</small></h2><div class="b" style="overflow-x:auto">
     <div style="line-height:1.75;white-space:normal;margin-bottom:8px;border:1px solid var(--amber);padding:6px 10px">${(o.reco||[]).map(x=>'<div>• '+esc(x)+'</div>').join('')||'<span class="mu">판단 근거 부족</span>'}</div>
     <div class="am" style="font-size:var(--fs-2);margin:6px 0 2px">채권이 지금 주식을 헤지하나? — 일간 수익률 상관</div>
     <table style="max-width:640px"><tr><th class="l">채권</th><th class="l">주식</th><th>1년</th><th>3개월</th><th>표본(일)</th></tr>${corr}</table>
     <div class="mu" style="font-size:var(--fs-1);margin:4px 0 8px;white-space:normal">음수(<span class="up">초록</span>) = 주식이 빠질 때 채권이 오르는 경향 → 분산 효과. 양수(<span class="dn">빨강</span>) = 같이 움직임(2022년처럼 물가·금리 충격 국면) → 채권이 방어가 안 됨. 하이일드는 원래 양수.</div>
     <div class="am" style="font-size:var(--fs-2);margin:6px 0 2px">편입 후보</div>
     <table><tr><th class="l">수단</th><th>금리(근사)</th><th>듀레이션</th><th>금리 −1%p 시 가격</th><th class="l">환율 위험</th><th class="l">세금(일반)</th><th class="l">역할</th></tr>${veh}</table>
     <div class="mu" style="font-size:var(--fs-1);margin-top:6px;white-space:normal;line-height:1.6">환헤지형 금리 ≈ 미국채 금리 − 헤지 비용(미국 3M − 한국 CD${o.hedge_cost!=null?' = '+o.hedge_cost.toFixed(2)+'%p':''}); 실제 비용은 선물환 시장에서 정해져 조금 다름. 비헤지 미국채의 원화 수익 ≈ 채권 수익 + 원/달러 변화. 세금은 일반적 구조만 적었고 계좌(ISA·연금)·금액에 따라 달라짐. 개인투자용 국채 금리는 '국고채 + 가산금리'로 매달 공고됨.</div></div></div>
   <div class="p c12"><h2>채권 ETF<small>데이터 ${esc(o.asof||'—')} · 가격 · 수익률 (분배금 포함 수정주가)</small></h2><div class="b" style="overflow-x:auto"><table><tr><th class="l">ETF</th><th>종가</th><th>1D</th><th>1M</th><th>1Y</th><th>D(근사)</th><th class="l">역할</th></tr>${etf}</table></div></div>
   <div class="p c12"><h2>채권 읽는 법<small>현재 숫자 대입</small></h2><div class="b" style="line-height:1.75;white-space:normal">${(o.guide||[]).map((g,i)=>`<details class="sec"${i<2?' open':''}><summary><b>${esc(g.t)}</b></summary><div style="padding:2px 4px 6px">${esc(g.b)}</div></details>`).join('')}</div></div>
  </div>`;
}
/* 지금 채권 상황 3줄 (10/21 겸이 "채권에도 현 상황 최상단에 요약 영역", 보드 bonds-summary) — 수준·방향·의미. 숫자는 bonds.json 그대로,
   문장 규칙 = 채권 KB docs/desk_kb/bonds.md #7(손익분기 = 1년 이자 ÷ D) #11(ETF 상시 만기) #13(커브 4분면, |Δ기울기| ≥ 10bp 일 때만 분류). */
function bondNow(o){
  const U=o.us.chg||{}, K=o.kr.chg||{}, S=o.spreads||{}, k3=K['3Y']||{}, k10=K['10Y']||{}, u10=U['10Y']||{}, sl=S.kr_10_3||{};
  const f=c=>c&&c.v!=null?c.v.toFixed(2)+'%':'—';
  const bp=x=>x==null?'—':`<span class="${x>0?'dn':x<0?'up':'mu'}">${x>0?'+':''}${Number(x).toFixed(0)}bp</span>`;
  const dir=(a,b,who)=>a==null||b==null?`${who} —`:a<0&&b<0?`${who} 금리↓(채권값↑)`:a>0&&b>0?`${who} 금리↑(채권값↓)`:`${who} 혼조`;
  let curve='';
  if(sl.v!=null){ const d=sl.m1==null?null:Math.round(sl.m1), a3=k3.m1, a10=k10.m1;   // 표시값(정수 bp)으로 판정 — '−10bp: 변화 작음' 같은 어긋남 방지
    const q=d==null||a3==null||a10==null?'':Math.abs(d)<10?'변화 작음(±10bp 안)':d>0?(Math.abs(a3)>Math.abs(a10)?'불 스티프닝(단기 금리가 더 내림)':'베어 스티프닝(장기 금리가 더 오름)'):(Math.abs(a3)>Math.abs(a10)?'베어 플래트닝(단기 금리가 더 오름)':'불 플래트닝(장기 금리가 더 내림)');
    curve=` · 기울기 한 10Y−3Y <b>${sl.v*100>0?'+':''}${(sl.v*100).toFixed(0)}bp</b> (1개월 ${bp(d)}${q?': '+q:''})`; }
  const dk=(o.duration||[]).find(d=>d.n==='국고채 3년');
  let mean='<span class="mu">국고 3년 듀레이션 데이터 없음</span>';
  if(dk&&dk.be_bp!=null&&dk.dur){ const m=k3.m1, px=m==null?null:-dk.dur*m/100;
    mean=`국고 3년 보유 관점: 손익분기 <b>+${dk.be_bp}bp</b> (1년 이자 ${dk.carry.toFixed(2)}% ÷ D ${dk.dur.toFixed(2)}) — 1년 새 금리가 이보다 덜 오르면 이자가 가격 손실을 덮음.${m!=null?` 1개월 변화 ${bp(m)} ≈ 가격 ${px>0?'+':''}${px.toFixed(1)}%(−D×Δ금리, 근사).`:''} 국고채 3년 ETF는 만기 없음(D≈2.8 근사) → 3년 이상 들고 가는 돈.`; }
  const kp=mkPhase('KR'), kt=tzParts('Asia/Seoul');
  const lag=[dataLag('KR',o.kr.asof,(kp.last===kp.today&&kt.hm<22*60)?1:0),dataLag('US',o.us.asof,1)].filter(Boolean).join(' · ');   // 국고 민평 21:00 생성 · 미 국채 하루 늦게 공개
  const tag=staleTag(o.generated_at?String(o.generated_at).slice(5,16):o.asof,['21:00'],[1,2,3,4,5],['bonds','reports/bonds.json'],lag);
  return `<div class="p c12" id="bondNow"><h2>지금 채권 상황 3줄<small>bonds.json${tag}</small></h2><div class="b" style="line-height:1.75;white-space:normal">
    <div><b class="am">수준</b> 국고 3년 <b>${f(k3)}</b> · 국고 10년 <b>${f(k10)}</b> · 미 10년 <b>${f(u10)}</b></div>
    <div><b class="am">방향</b> 1주 ${bp(k3.w1)} · ${bp(k10.w1)} · ${bp(u10.w1)} / 1개월 ${bp(k3.m1)} · ${bp(k10.m1)} · ${bp(u10.m1)} → ${dir(k3.m1,k10.m1,'한국')} · ${dir(u10.m1,u10.m1,'미국')}${curve}</div>
    <div><b class="am">의미</b> ${mean}</div>
    <div class="mu" style="font-size:var(--fs-1)">순서 = 국고3Y · 국고10Y · 미10Y. 한국 KRX 장외 민평 ${esc(mdDay(o.kr.asof))} · 미국 Treasury ${esc(mdDay(o.us.asof))} 기준. 금리↑ <span class="dn">빨강</span>(채권값↓). 해석은 채권 KB 규칙(#7·#11·#13) — 추정 없음.</div></div></div>`;
}
function aiCreditPanel(a,o){ o=o||{};
  if(!a||!a.alert) return '';
  const al=a.alert, lc=al.lv>=2?'dn':al.lv>=1?'am':'mu';
  const fv=c=>c.v==null?'—':c.fmt==='pct'?pct(c.v,1):c.fmt==='n'?`<b>${c.v}</b><span class="mu">/${c.of}</span>${c.names&&c.names.length?' <span class="mu">('+esc(c.names.join(', '))+')</span>':''}`:`<b>${Number(c.v).toFixed(1)}</b>`;
  const chk=(al.checks||[]).map(c=>`<tr><td class="l">${esc(c.name)}<div class="mu" style="font-size:var(--fs-1);white-space:normal">${esc(c.why)}</div></td><td>${fv(c)}</td><td class="l mu" style="font-size:var(--fs-1)">${esc(c.rule)}</td><td class="${c.pt>=2?'dn':c.pt>=1?'am':'mu'}"><b>${c.pt}</b></td></tr>`).join('');
  const vc=x=>x==null?'<td class="mu">—</td>':`<td class="${x>=0.8?'dn':x>=0.5?'am':'mu'}">${(x*100).toFixed(0)}%</td>`;
  const bk=(a.basket||[]).map(r=>`<tr><td class="l sym" data-sym="${esc(r.s)}" data-mk="US"><b>${esc(r.s)}</b> <span class="mu" style="font-size:var(--fs-1)">${typeof r.n==='string'?esc(r.n):''}</span>${r.short?' <span class="mu" style="font-size:var(--fs-1)">(상장 1년 미만)</span>':''}</td><td>${num(r.close,2)}</td><td>${pct(r.r1,1)}</td><td>${pct(r.r20,1)}</td><td>${pct(r.dd,1)}</td>${vc(r.vol20)}</tr>`).join('');
  const ce=(a.etf||[]).map(e=>`<tr><td class="l sym" data-sym="${esc(e.s)}" data-mk="US">${esc(e.n)}</td><td>${num(e.close,2)}</td><td>${pct(e.r1,2)}</td><td>${pct(e.r20,1)}</td><td>${pct(e.dd,1)}</td></tr>`).join('');
  const spark=h=>{ if(!h||h.length<2) return ''; const W=160,H=34,vs=h.map(x=>x[1]),lo=Math.min(...vs),hi=Math.max(...vs),rg=(hi-lo)||1;
    const pts=vs.map((v,i)=>`${(i/(vs.length-1)*W).toFixed(1)},${(H-2-(v-lo)/rg*(H-4)).toFixed(1)}`).join(' ');
    return `<svg viewBox="0 0 ${W} ${H}" style="width:${W}px;height:${H}px;vertical-align:middle"><polyline points="${pts}" fill="none" style="stroke:var(--amber);stroke-width:1.4"/></svg>`; };
  const RT={HYG_IEF:['HYG/IEF','하이일드 ÷ 중기국채 — 내리면 투기등급 회사채가 국채보다 약함'],BKLN_SHY:['BKLN/SHY','레버리지론 ÷ 단기국채 — 내리면 빚 많은 회사 대출 가격이 약함']};
  const rt=Object.entries(RT).map(([k,[n,t]])=>{ const r=(a.ratios||{})[k]; return r?`<tr><td class="l">${n}<div class="mu" style="font-size:var(--fs-1);white-space:normal">${t}</div></td><td>${r.v}</td><td>${pct(r.r20,1)}</td><td>${pct(r.r60,1)}</td><td>${spark(r.hist)}</td></tr>`:''; }).join('');
  const miss=(a.missing||[]).length?` · 데이터 없음: ${esc(a.missing.join(', '))}`:'';
  return `<div class="p c12"><h2>AI 인프라 신용 감시<small>데이터 ${esc(a.asof||'—')}${a.asof&&o.asof&&a.asof<o.asof?` <span class="am" title="이 표는 탭 기준일(${esc(o.asof)})보다 이전 데이터 — 아래 ETF 표·상단 티커와 날짜가 다름">(탭 기준 ${esc(o.asof)}보다 이전)</span>`:''} · 주가로 본 신용 스트레스 · 규칙 기반</small></h2><div class="b" style="overflow-x:auto">
    <div style="line-height:1.75;white-space:normal;border:1px solid var(--${al.lv>=2?'dn':al.lv>=1?'amber':'line'});padding:6px 10px;margin-bottom:8px">
      <div>신용 경보: <b class="${lc}" style="font-size:var(--fs-3)">${esc(al.level)}</b> <span class="mu">(점수 ${al.score} · 0~1 정상 · 2~3 주의 · 4+ 경계)</span></div>
      <div>${esc(al.explain||'')}</div>
      <div class="mu" style="font-size:var(--fs-1)">왜 따로 보나: 하이일드 지수(HYG)는 수백 개 회사를 섞은 평균이라, 한 업종(AI 데이터센터)이 빚 부담으로 흔들려도 지수엔 거의 안 잡힘. 그래서 그 업종 회사들 주가를 직접 봄.</div></div>
    <table style="max-width:820px"><tr><th class="l">경보 항목</th><th>지금</th><th class="l">기준</th><th>점수</th></tr>${chk}</table>
    <div class="am" style="font-size:var(--fs-2);margin:10px 0 2px">바스켓 — 빚으로 데이터센터를 짓는 회사들 (낙폭 큰 순 · 종목 누르면 상세)</div>
    <table><tr><th class="l">종목</th><th>종가</th><th>1D</th><th>20일</th><th>52주 고점 대비</th><th>20일 변동성</th></tr>${bk}</table>
    <div class="mu" style="font-size:var(--fs-1);margin:4px 0 8px;white-space:normal;line-height:1.6">CDS(부도 보험료)·개별 회사채 가격은 무료 데이터가 없어 주가로 대신함: 고점 대비 많이 빠지고, 한 달 새 급락하고, 하루하루 출렁임(20일 변동성, 연율 — 50%↑ <span class="am">주황</span>, 80%↑ <span class="dn">빨강</span>)이 클수록 시장이 그 회사의 빚 상환 능력을 의심한다는 신호.${miss}</div>
    <div class="am" style="font-size:var(--fs-2);margin:6px 0 2px">신용 ETF · 비율</div>
    <table style="max-width:640px"><tr><th class="l">ETF</th><th>종가</th><th>1D</th><th>20일</th><th>52주 고점 대비</th></tr>${ce}</table>
    <table style="max-width:640px;margin-top:6px"><tr><th class="l">비율</th><th>현재</th><th>1M</th><th>3M</th><th>1년 추이</th></tr>${rt}</table>
    <div class="mu" style="font-size:var(--fs-1);margin-top:4px;white-space:normal">VIX ${a.vix==null?'—':Number(a.vix).toFixed(1)} <span class="mu">(${esc(a.vix_src||'')})</span> · 경보가 '주의' 이상이면 운용회의 맨 위 요약에도 한 줄 들어감.</div>
  </div></div>`;
}
function drawBondHist(){
  const el=$('#bdh'); if(!el||!BND||!BND.hist) return;
  if(BDCH){ try{BDCH.remove();}catch(e){} BDCH=null; }
  if(!window.LightweightCharts){ el.innerHTML='<div class="mu">차트 라이브러리 없음</div>'; return; }
  const cs=getComputedStyle(document.documentElement), cv=n=>(cs.getPropertyValue(n)||'').trim()||'#888';
  const c=LightweightCharts.createChart(el,{width:el.clientWidth,height:300,layout:{background:{type:'solid',color:cv('--panel')},textColor:cv('--muted'),fontSize:11},
    grid:{vertLines:{color:cv('--line')},horzLines:{color:cv('--line')}},rightPriceScale:{borderColor:cv('--line')},timeScale:{borderColor:cv('--line')},crosshair:{mode:0},handleScroll:{vertTouchDrag:false},
    localization:{locale:'ko-KR',priceFormatter:v=>v.toFixed(0)+'bp'}});
  BDCH=c;
  const S=[['us_10_2','미 10Y−2Y','--amber'],['us_10_3m','미 10Y−3M','--blue'],['kr_10_3','한 10Y−3Y','--cyan'],['kr_aa','한 AA−−국고3Y','--dn']];
  const leg=[];
  for(const [k,n,col] of S){ const d=(BND.hist[k]||[]).map(([t,v])=>({time:t,value:+(v*100).toFixed(1)})); if(!d.length) continue;
    const s=c.addLineSeries({color:cv(col),lineWidth:k==='us_10_2'?2:1.5,priceLineVisible:false,lastValueVisible:true,title:''}); s.setData(d);
    if(k==='us_10_2') s.createPriceLine({price:0,color:cv('--muted'),lineWidth:1,lineStyle:2,axisLabelVisible:false,title:''});
    leg.push(`<span style="color:var(${col})">━ ${n} ${d[d.length-1].value.toFixed(0)}</span>`); }
  c.timeScale().fitContent();
  const lg=$('#bdleg'); if(lg) lg.innerHTML=leg.join(' &nbsp; ');
}
