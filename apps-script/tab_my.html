// '## ISA' 줄 아래는 ISA 코어 북(book:'isa'), 그 위는 위성 북(book:'sat'). 분모(순자산)는 두 북 + 현금 전부.
const ISA_HEAD=/^#{1,3}\s*ISA\b/i;
function myParse(txt){ const out=[]; let book='sat'; for(const ln of txt.split(/\n/)){ const t=ln.trim(); if(ISA_HEAD.test(t)){ book='isa'; continue; } if(t.startsWith('#')) continue; const p=t.split(/[\s,]+/).filter(Boolean); if(!p.length) continue;
    const n=x=>{const v=parseFloat(String(x||'').replace(/,/g,'')); return isFinite(v)?v:null;};
    const k=p[0].toUpperCase();
    if(['현금','KRW','CMA','원화','예수금','RP'].includes(k)||/^CMA/.test(k)) out.push({cash:'KRW', amt:n(p[1])||0, book});
    else if(['USD','달러','미국달러'].includes(k)) out.push({cash:'USD', amt:n(p[1])||0, book});
    else { // 끝의 숫자 최대 2개 = 수량·평단, 나머지 = 종목 (이름에 공백·숫자 허용: "TIGER 200 IT 5 30000")
      let k2=p.length; const nums=[]; while(k2>1&&nums.length<2&&n(p[k2-1])!=null){ nums.unshift(n(p[k2-1])); k2--; }
      out.push({key:p.slice(0,k2).join(' '), qty:nums.length?nums[0]:0, avg:nums.length>1?nums[1]:null, book}); } } return out; }
// ISA 코어 목표 (안건 8): S&P500 40 · NDX 10 · K200 15 · 국고채 20 · 금 15, 밴드 ±5%p
const ISA_TARGET=[['S&P500',0.40],['NDX',0.10],['K200',0.15],['KTB',0.20],['Gold',0.15]], ISA_BAND=0.05;
function isaBucket(s,nm){ const n=String(nm||'').toUpperCase();
  if(s==='360750'||n.includes('S&P')||['SPY','IVV','VOO','SPLG'].includes(s)) return 'S&P500';
  if(s==='133690'||n.includes('나스닥')||n.includes('NDX')||['QQQ','QQQM'].includes(s)) return 'NDX';
  if(['148070','305080','152380'].includes(s)||/국고채|국채|KTB/.test(n)) return 'KTB';
  if(s==='132030'||/골드|금선물|GOLD/.test(n)||['GLD','IAU'].includes(s)) return 'Gold';
  if(s==='069500'||(/(^|\s)200(\s|$)|코스피/.test(n)&&!/IT|반도체|인버스|레버리지/.test(n))) return 'K200';
  return null; }
// 반도체 분류 (pb.py semi_class 와 동일): 'semi' = 한도 산입(반도체 체인·미국 반도체·반도체/IT 섹터 ETF 전액), 'elec' = 전기·IT 하드웨어(상관 테마, 보조 수치),
// 지수 ETF(KODEX 200·S&P500 …)는 한도 밖 — 속의 반도체 룩스루는 lookW 로 돌려 '참고 경보' 로만 보인다 (합의 1-④)
const SEMI_ETFS=['139260','091160','PSI','SOXX','SMH','SOXL','SOXQ','XSD','SMHX','396500','395160','449450'];
const US_SEMIS=['MU','SNDK','NVDA','AMD','AVGO','TSM','INTC','QCOM','ARM','MRVL','LRCX','AMAT','KLAC','ASML','WDC','STX'];
function semiClass(a){ const s=a.h.r.s, n=String(a.d.name||'').toUpperCase();
  if(a.etf){ if(SEMI_ETFS.includes(s)||/반도체|SEMI|SOX|IT$|\bIT\b|테크/.test(n)) return {kind:'semi',lookW:0};
    const lc=(a.d.etf.look||{}).chains||{}; let lw=0; for(const [k,w] of Object.entries(lc)) if(/반도체|IT 하드웨어/.test(k)) lw+=w; return {kind:null,lookW:lw}; }
  const ch=((a.d.drivers||{}).chain||{}).name||'';
  if(US_SEMIS.includes(s)||/반도체/.test(ch)) return {kind:'semi',lookW:0};
  if(/IT 하드웨어/.test(ch)) return {kind:'elec',lookW:0};
  return {kind:null,lookW:0}; }
function myResolve(k){ const x=k.toLowerCase().trim();
  const ex=SIX.find(s=>s.s.toLowerCase()===x)||SIX.find(s=>String(s.n).toLowerCase()===x); if(ex) return ex;
  if(/^[a-z][a-z.\-]{0,5}$/.test(x)||/^\d{6}$/.test(x)) return null;   // 티커·코드는 정확히 일치할 때만 (PSI → PepsiCo 오인 방지)
  return SIX.find(s=>String(s.n).toLowerCase().startsWith(x))||SIX.find(s=>String(s.n).toLowerCase().replace(/\s/g,'').includes(x.replace(/\s/g,'')))||null; }
// 비공개 저장소(pb-private/holdings.txt) 동기화 — 읽기 전용 토큰은 이 브라우저 localStorage 에만 보관
const GHK='mt_gh_tok', PBSRC='https://api.github.com/repos/hk99915-bot/pb-private/contents/holdings.txt';
function ghTok(){ try{ return sessionStorage.getItem(GHK)||localStorage.getItem(GHK)||''; }catch(e){ return ''; } }
// PIN 잠금 기억: 토큰을 PIN 으로 암호화(AES-GCM, PBKDF2 25만 회)해 이 브라우저에 저장 → 다음부턴 PIN 만 입력. 복호화한 토큰은 이 창(sessionStorage)에만.
const GHE='mt_gh_enc';
function alertMsg(m){ const e=$('#mysync'); if(e) e.textContent=m; }
const _b64=u=>btoa(String.fromCharCode(...new Uint8Array(u))), _ub64=t=>Uint8Array.from(atob(t),c=>c.charCodeAt(0));
async function _ghKey(pin,salt){ const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pin),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:250000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['encrypt','decrypt']); }
async function ghLock(tok,pin){ const salt=crypto.getRandomValues(new Uint8Array(16)), iv=crypto.getRandomValues(new Uint8Array(12));
  const c=await crypto.subtle.encrypt({name:'AES-GCM',iv},await _ghKey(pin,salt),new TextEncoder().encode(tok));
  localStorage.setItem(GHE,JSON.stringify({s:_b64(salt),i:_b64(iv),c:_b64(c)})); }
async function ghUnlock(pin){ try{ const o=JSON.parse(localStorage.getItem(GHE)||'null'); if(!o) return false;
  const p=await crypto.subtle.decrypt({name:'AES-GCM',iv:_ub64(o.i)},await _ghKey(pin,_ub64(o.s)),_ub64(o.c));
  sessionStorage.setItem(GHK,new TextDecoder().decode(p)); return true; }catch(e){ return false; } }
function ghLocked(){ try{ return !ghTok() && !!localStorage.getItem(GHE); }catch(e){ return false; } }
function myClean(t){ return String(t||'').split('\n').filter(l=>l.trim()&&(ISA_HEAD.test(l.trim())||!l.trim().startsWith('#'))).join('\n'); }
let MYSYNC={st:'',at:''};
function mySync(cb){ const tk=ghTok(); if(!tk){ MYSYNC={st:'토큰 없음'}; cb&&cb(false); return; }
  MYSYNC={st:'불러오는 중…'};
  fetch(PBSRC+'?t='+Date.now(),{headers:{Authorization:'Bearer '+tk,Accept:'application/vnd.github.raw'},cache:'no-store'})
    .then(r=>{ if(!r.ok) throw new Error(r.status); return r.text(); })
    .then(t=>{ const c=myClean(t); if(c){ mySave(c); const ta=$('#myta'); if(ta) ta.value=c; } MYSYNC={st:'동기화됨',at:new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'})}; cb&&cb(true); })
    .catch(e=>{ MYSYNC={st:'실패('+e.message+') — 토큰 권한·만료 확인'}; cb&&cb(false); }); }
let MYSYNCED=false;
function myOpen(){ try{ return localStorage.getItem('mt_myopen')==='1'; }catch(e){ return false; } }
function myView(){
  const txt=myLoad();
  setTimeout(()=>{ const ta=$('#myta'); if(!ta) return; $('#mygo').onclick=()=>{ mySave(ta.value); $('#myin').open=false; myRun(); };
    const st=()=>{ const e=$('#mysync'); if(e) e.textContent=MYSYNC.st+(MYSYNC.at?' · '+MYSYNC.at:''); };
    $('#mysyncb').onclick=()=>{ mySync(ok=>{ st(); if(ok) myRun(); }); st(); };
    $('#mytokb').onclick=async()=>{ const v=($('#mytok').value||'').trim(); const ses=$('#mytokses')&&$('#mytokses').checked; const pin=(($('#mytokpin')||{}).value||'').trim();
      try{ localStorage.removeItem(GHK); sessionStorage.removeItem(GHK); if(v){ if(pin){ if(pin.length<6){ alertMsg('PIN 은 6자 이상'); return; } await ghLock(v,pin); localStorage.removeItem(GHK); sessionStorage.setItem(GHK,v); } else { localStorage.removeItem(GHE); (ses?sessionStorage:localStorage).setItem(GHK,v); } } }catch(_){}
      $('#mytok').value=''; if($('#mytokpin')) $('#mytokpin').value=''; mySync(ok=>{ st(); if(ok) myRun(); }); st(); render(); };
    const pu=$('#mypinb'); if(pu) pu.onclick=async()=>{ const ok=await ghUnlock(($('#mypin').value||'').trim()); $('#mypin').value=''; if(ok){ mySync(k=>{ st(); if(k) myRun(); }); render(); } else { const e=$('#mypinmsg'); if(e) e.textContent='PIN 이 틀렸어요'; } };
    const pi=$('#mypin'); if(pi) pi.onkeydown=e=>{ if(e.key==='Enter') $('#mypinb').click(); };
    const fg=$('#mypinforget'); if(fg) fg.onclick=()=>{ try{ localStorage.removeItem(GHE); }catch(_){} render(); };
    if(ghTok()&&!MYSYNCED){ MYSYNCED=true; mySync(ok=>{ st(); if(ok) myRun(); }); st(); }
    const mc=$('#mycorr'); if(mc) mc.addEventListener('toggle',e=>{ if(e.target.open) myCorr(); });
    $('#myin').addEventListener('toggle',e=>{ try{ localStorage.setItem('mt_myopen',e.target.open?'1':'0'); }catch(_){} }); if(txt) myRun(); },0);
  return `<div class="grid"><div class="p c12"><h2>MY PB<small>보유 자산 분석 · 비공개 저장소(pb-private)에서 자동 동기화 · 공개 서버로 전송 없음</small></h2><div class="b">
    <div style="font-size:12px;margin-bottom:6px;display:flex;gap:6px;align-items:center;flex-wrap:wrap"><span class="am">비공개 저장소 연동</span> <span id="mysync" class="mu">${ghTok()?esc(MYSYNC.st||'대기'):ghLocked()?'🔒 PIN 으로 잠김':'토큰 미설정'}</span>${ghLocked()?`<input id="mypin" type="password" inputmode="text" autocomplete="off" placeholder="PIN" style="width:90px;background:#050505;color:var(--txt);border:1px solid var(--line);font:inherit;padding:3px 6px"> <button id="mypinb" class="sbtn">열기</button> <span id="mypinmsg" class="dn" style="font-size:11px"></span> <a href="#" id="mypinforget" class="mu" style="font-size:11px">PIN 기억 지우기</a>`:''}
      <button id="mysyncb" class="sbtn">지금 불러오기</button>
      <details style="display:inline"><summary class="mu" style="cursor:pointer;font-size:11px">토큰 설정</summary>
        <div class="mu" style="font-size:11px;line-height:1.6;max-width:560px">깃허브 → Settings → Developer settings → Fine-grained tokens → Repository access: <b>pb-private만</b> · Permissions: <b>Contents: Read-only</b>. 토큰은 이 브라우저에만 저장돼요(회사 PC엔 저장 금지). 비우고 저장하면 삭제.</div>
        <input id="mytok" type="password" placeholder="github_pat_…" style="width:240px;background:#050505;color:var(--txt);border:1px solid var(--line);font:inherit;padding:3px 6px"> <label class="mu" style="font-size:11px;margin-left:6px"><input id="mytokses" type="checkbox"> 이 창에서만 (탭 닫으면 삭제 · 회사 PC용)</label> <span class="mu" style="font-size:11px;margin-left:6px">또는 PIN 잠금 기억:</span> <input id="mytokpin" type="password" autocomplete="new-password" placeholder="PIN 6자+" style="width:100px;background:#050505;color:var(--txt);border:1px solid var(--line);font:inherit;padding:3px 6px"> <span class="mu" style="font-size:11px">(PIN 을 넣고 저장하면 다음부턴 PIN 만 입력 — 회사 PC 추천)</span> <button id="mytokb" class="sbtn">저장</button></details></div>
    <details id="myin" ${txt&&!myOpen()?'':'open'} style="margin-bottom:6px"><summary style="cursor:pointer;color:var(--amber);font-size:13px;padding:4px 0">보유 입력 (눌러서 열기/닫기)</summary>
    <div class="mu" style="font-size:12px;margin-bottom:6px;line-height:1.7">한 줄에 하나 — <b>종목코드·티커·이름 수량 평균단가</b>, 현금은 <b>현금 금액</b> / <b>USD 달러금액</b><br>예: <code>005930 10 70000</code> · <code>TIGER 200 IT 5 30000</code> · <code>MU 2 100.0</code> · <code>현금 1000000</code> · <code>USD 1000</code><br>ISA 코어는 <code>## ISA</code> 한 줄 아래에 같은 형식으로 (예: <code>360750 100 20000</code>) — 분모는 순자산(위성+ISA+현금)</div>
    <textarea id="myta" rows="9" style="width:100%;max-width:640px;background:#050505;color:var(--txt);border:1px solid var(--line);font:inherit;font-size:14px;padding:8px">${esc(txt)}</textarea>
    <div><button id="mygo" style="margin-top:6px;background:var(--amber);color:#000;border:0;padding:8px 16px;font:inherit;font-weight:700;cursor:pointer">분석</button></div></details>
    <div id="myout" style="margin-top:12px"></div>
    <details id="mycorr" style="margin-top:14px"><summary style="cursor:pointer;color:var(--amber);font-size:13px;padding:4px 0">교정 리포트 (비공개 · 눌러서 열기)</summary><div id="mycorrb" class="mu" style="font-size:12px">${ghTok()?'여는 중…':'토큰을 먼저 설정해야 볼 수 있어요'}</div></details>
    </div></div></div>`;

// 교정 리포트: pb-private/analysis/latest.json → 이미지·보고서를 토큰으로 직접 받아 이 브라우저에서만 표시 (공개 서버 경유 없음)
const PBAPI='https://api.github.com/repos/hk99915-bot/pb-private/contents/';
function pbGet(path,as){ const tk=ghTok(); return fetch(PBAPI+path+'?t='+Date.now(),{headers:{Authorization:'Bearer '+tk,Accept:'application/vnd.github.raw'},cache:'no-store'}).then(r=>{ if(!r.ok) throw new Error(r.status); return as==='blob'?r.blob():r.text(); }); }
function mdLite(t){ const L=String(t||'').split('\n'), out=[]; let tb=null;
  const cell=c=>esc(c.trim()).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
  const flush=()=>{ if(!tb) return; const rows=tb.filter(r=>!/^\s*\|?\s*:?-{2,}/.test(r)).map(r=>r.replace(/^\s*\|/,'').replace(/\|\s*$/,'').split('|'));
    if(rows.length){ const [h,...b]=rows; out.push('<div style="overflow-x:auto"><table style="margin:4px 0 10px"><tr>'+h.map((c,k)=>`<th class="${k?'':'l'}">${cell(c)}</th>`).join('')+'</tr>'+b.map(r=>'<tr>'+r.map((c,k)=>{ const v=c.trim(); const cl=/^[-−]/.test(v)&&/\d/.test(v)?'dn':/^\+/.test(v)?'up':''; return `<td class="${k?cl:'l'}">${cell(c)}</td>`; }).join('')+'</tr>').join('')+'</table></div>'); }
    tb=null; };
  for(const l of L){ if(/^\s*\|/.test(l)){ (tb=tb||[]).push(l); continue; } flush();
    if(/^\s*!\[/.test(l)||!l.trim()) continue;
    if(/^#{1,3} /.test(l)||/^\d+\. \S/.test(l)&&l.length<40) out.push('<div style="color:var(--amber);font-weight:700;margin-top:12px">'+cell(l.replace(/^#+ /,''))+'</div>');
    else if(/^\s*[-*·] /.test(l)) out.push('<div style="margin-left:4px">· '+cell(l.replace(/^\s*[-*·] /,''))+'</div>');
    else out.push('<div>'+cell(l)+'</div>'); }
  flush(); return out.join(''); }
let CORR=null, CORRCH=[];

  const f=v=>v==null?'—':(v/1e6).toFixed(2)+'M', pc=v=>v==null?'—':(v>0?'+':'')+(v*100).toFixed(1)+'%', col=v=>v>0?'up':v<0?'dn':'mu';
  const mrow=W.monthly.map(([m,a,k,u])=>{ const bar=(v,c)=>`<div style="height:8px;width:${Math.min(100,Math.abs(v)*150)}%;background:var(${c});margin:1px 0"></div>`;

  const hrow=W.hold.map(([b,n,w,p])=>`<tr><td class="l">${esc(b)}</td><td>${n}</td><td>${(w*100).toFixed(0)}%</td><td class="${col(p)}">${f(p)}</td></tr>`).join('');
  const crow=W.cls.map(([b,n,w,p])=>`<tr><td class="l">${esc(b)}</td><td>${n}</td><td>${(w*100).toFixed(0)}%</td><td class="${col(p)}">${f(p)}</td></tr>`).join('');
  box.innerHTML=`<div class="am" style="font-size:12px">계좌 평가액 vs 넣은 돈 vs 지수 반사실 <span class="mu">(드래그·확대 가능, 아래 손익 차트와 연동)</span></div>

   <div class="am" style="font-size:12px">돈 손익 (평가액 − 순입금)</div><div id="cq2" style="height:160px;margin-top:4px"></div>
   <div class="am" style="font-size:12px;margin-top:12px">코스피 위 매매 <span class="mu">▲매수 ▼매도 · 주황=레버리지·인버스 · 날짜를 누르면 그날 매매 목록</span>
     <label style="margin-left:8px"><input type="checkbox" id="cqus"> 미국 매매도 표시</label></div>

  op.push(`<b>반도체</b>: 반도체(전기 제외) 순자산의 <b>${W(semi/NAV)}</b> (상한 ${W(SEMI_CAP)} · 발동선 ${W(SEMI_BAND)}) → ${semiTag}. 반도체+전기(상관 테마) ${W(semiElec/NAV)}. <span class="mu">참고 경보: 지수 ETF 속 반도체 ≈ ${W(look/NAV)} 추가 (한도 제외)</span>${semi/tot>0.6?` — 종목 수는 ${A.length}개지만 실제로는 베팅 하나, 이 사이클이 꺾이면 전부 같이 꺾입니다.`:''}`);
  const top=chainL[0]; if(semi/tot<=0.6&&top&&top[1]/tot>0.5) op.push(`<b>쏠림</b>: 주식의 ${W(top[1]/tot)}가 '${esc(top[0])}' 한 체인입니다. 순자산 기준 ${W(top[1]/NAV)}. 이 체인 하나가 꺾이면 포트 전체가 꺾입니다.`);
  if(dup.length) op.push(`<b>중복</b>: ${dup.slice(0,4).map(x=>`${esc(x.name)}(직접+${esc(x.src.filter(z=>z!=='직접').join(','))})`).join(', ')} — 같은 종목을 ETF로 한 번 더 들고 있습니다. 실질 비중은 아래 '실질 보유'로 보세요. 줄일 땐 섹터 ETF(TIGER 200 IT·PSI 등)부터 — 지수 ETF(KODEX 200·S&P500 등 ISA 코어 적립분)는 줄이지 않습니다.`);
  op.push(`<b>위험 대비 성과</b>: 최근 1년 이 구성 그대로였다면 샤프 ${F(Pm.sh)} (주식만 ${F(Em.sh)}), 최대낙폭 ${pct(Pm.mdd,0)}. ${Pm.sh>2?'<b>이 숫자를 기대값으로 쓰면 안 됩니다.</b> 지난 1년 메모리 대랠리가 그대로 들어간 이례적 값이고, 같은 베팅이 맞았던 결과일 뿐입니다. 볼 것은 샤프가 아니라 변동성·낙폭.':Pm.sh<0.5?'위험에 비해 보상이 낮았습니다.':'보통 수준.'}`);
  op.push(`<b>비중</b>: 주식 변동성 ${W(Em.vol)} 기준으로 포트 변동성을 연 20%(주식시장 평균 수준)에 맞추려면 주식 비중 ${W(eqTarget)} (현재 ${W(eqW)}). ${eqW>eqTarget+0.05?`→ 약 ${K((eqW-eqTarget)*NAV)}원 줄이거나 아래 헷지로 같은 효과.`:eqW<eqTarget-0.05?'→ 위험 여력이 남아 있습니다. 다만 같은 체인에 더 넣으면 쏠림만 커집니다.':'→ 적정 범위.'}`);
  if(Pm.cFX<-0.2) op.push(`<b>달러 현금</b>: 포트와 원/달러 상관 ${F(Pm.cFX)} — 주가가 빠질 때 달러가 올라 이미 자연 헷지로 작동하고 있습니다. 달러를 원화로 바꾸면 이 헷지가 사라집니다.`);
  const hb=hedge.filter(h=>h.ty==='inv'&&h.amt>0).sort((a,b)=>b.red-a.red)[0];
  if(hb) op.push(`<b>단기 보험(인버스)</b>: 가장 효율적인 건 ${esc(hb.nm)}. 현실적인 25% 헷지 = <b>${K(hb.amt/4)}원</b>으로 변동성 ${W(hb.red25)} 감소 (100% 헷지는 ${K(hb.amt)}원이 필요해 비현실적). 인버스·레버리지 ETF는 매일 재조정돼 횡보장에서 녹으니 수주~수개월 이벤트 보험으로만. <b>⚠ 규정 [2]: 인버스·레버리지는 2027-04-15까지 실계좌 금지 — 참고용 수치(모델 북 전용).</b>`);
  const hd=hedge.filter(h=>h.ty==='div').sort((a,b)=>b.red-a.red).slice(0,2);
  if(hd.length) op.push(`<b>구조적 분산</b>: 주식 10%p를 옮긴다면 ${hd.map(h=>`${esc(h.nm)} (변동성 ${W(h.red)} 감소, 포트 상관 ${F(h.rho)})`).join(', ')}가 가장 효과적이었습니다. 인버스와 달리 들고 있어도 녹지 않습니다.`);
  const pf=(typeof PF!=='undefined'&&PF&&PF.strategies)||null;
  const isaW={}; let isaEtc=0; for(const a of A){ if(a.book!=='isa') continue; const b=isaBucket(a.h.r.s,a.d.name); if(b) isaW[b]=(isaW[b]||0)+a.val; else isaEtc+=a.val; }
  const isaPanel=hasIsa?`<div class="p" style="margin-bottom:8px"><h2>ISA 코어<small>순자산의 ${W(isaTot/NAV)} · 목표 S&P40/NDX10/K200 15/국고채20/금15 · 밴드 ±${(ISA_BAND*100).toFixed(0)}%p · 적립으로 맞춤(매도 아님)</small></h2><div class="b"><table><tr><th class="l">바구니</th><th>지금</th><th>목표</th><th>차이</th><th>상태</th></tr>
     ${ISA_TARGET.map(([k,t])=>{ const w=(isaW[k]||0)/isaTot, d=w-t; const st=Math.abs(d)<=ISA_BAND?'<span class="up">밴드 안 ✅</span>':d>0?'<span class="dn">▲ 초과 — 적립 멈춤</span>':'<span class="am">▼ 부족 — 적립 우선</span>'; return `<tr><td class="l">${k}</td><td>${W(w)}</td><td class="mu">${W(t)}</td><td>${(d*100).toFixed(1)>0?'+':''}${(d*100).toFixed(1)}%p</td><td>${st}</td></tr>`; }).join('')}
     ${cIsa?`<tr><td class="l mu">ISA 현금</td><td>${W(cIsa/isaTot)}</td><td colspan="3" class="mu l">${K(cIsa)}원 — 부족 바구니부터 적립</td></tr>`:''}${isaEtc?`<tr><td class="l mu">기타(목표 밖)</td><td>${W(isaEtc/isaTot)}</td><td colspan="3" class="mu l">목표 바구니로 분류되지 않은 종목</td></tr>`:''}</table>
     <div class="mu" style="font-size:11px;margin-top:4px;white-space:normal">ISA 코어 ${K(isaTot)}원. 지수 ETF 속 반도체(KODEX 200 등)는 한도 계산에서 빼고 위 '참고 경보' 로만 봅니다.</div></div></div>`:'';
  $('#myout').innerHTML=`
   <div class="mu" style="font-size:12px;margin-bottom:6px">분모: 순자산(위성+ISA+현금) ${hasIsa?`· 위성 ${W(totSat/NAV)} · ISA ${W(isaTot/NAV)}`:`· ISA 블록 없음(<code>## ISA</code> 줄 아래에 ISA 보유를 적으면 분리 표시)`} · 반도체 한도 ${W(SEMI_CAP)} · 발동선 ${W(SEMI_BAND)}</div>
   <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px">
     ${[['순자산',K(NAV)+'원'],['주식 / 현금',`${W(tot/NAV)} / ${W((cK+cU)/NAV)}`],['반도체(전기 제외) / +전기',`${W(semi/NAV)} / ${W(semiElec/NAV)}`],['주식 손익',cost?`${pct(tot/cost-1,1)} (${K(tot-cost)}원)`:'—'],['샤프 (1년)',F(Pm.sh)],['변동성',W(Pm.vol)],['최대낙폭',pct(Pm.mdd,0)],['하루 VaR 95%',`${K(Pm.var*NAV)}원`],['베타 KOSPI / SOX',`${F(Pm.bK)} / ${F(Pm.bX)}`]].map(([k,x])=>`<div style="flex:1;min-width:140px;border:1px solid var(--line);padding:6px 10px"><div class="mu" style="font-size:11px">${k}</div><b>${x}</b></div>`).join('')}
   </div>
   <div class="p" style="margin-bottom:8px"><h2>PB 의견<small>규칙 기반 · 지난 1년 데이터 · 성과 검증 전</small></h2><div class="b" style="line-height:1.8;font-size:13px;white-space:normal">${op.map(x=>'· '+x).join('<br>')}</div></div>
   ${isaPanel}
   <div class="p" style="margin-bottom:8px"><h2>보유<small>위험기여 = 포트 변동 중 이 종목 몫</small></h2><div class="b"><table><tr><th class="l">종목</th><th>비중</th><th>손익</th><th>위험기여</th><th>β KOSPI</th><th>β SOX</th><th>1년 변동성</th><th>드라이버</th></tr>
    ${A.sort((a,b)=>b.val-a.val).map(a=>{const dv=(a.etf?((a.d.etf||{}).look||{}).drv:(a.d.drivers||{}).score); return `<tr><td class="l am sym" data-sym="${esc(a.h.r.s)}" data-mk="${a.mk}">${esc(a.name)}${a.etf?' <span class="tag">ETF</span>':''}${a.book==='isa'?' <span class="tag">ISA</span>':''}</td><td>${W(a.w)}</td><td>${a.cb?pct(a.val/a.cb-1,1):'—'}</td><td class="${a.rc>a.w*1.3?'dn':''}">${W(a.rc)}</td><td>${F(a.bK)}</td><td>${F(a.bX)}</td><td class="mu">${W(a.vol)}</td><td style="color:${col(dv)}">${dv!=null?(dv>0?'+':'')+dv.toFixed(2):'—'}</td></tr>`;}).join('')}
    ${cK?`<tr><td class="l mu">원화 현금</td><td>${W(cK/NAV)}</td><td colspan="6" class="mu l">연 3% 가정</td></tr>`:''}${cU?`<tr><td class="l mu">달러 현금</td><td>${W(cU/NAV)}</td><td colspan="6" class="mu l">원/달러 변동이 수익 · 포트와 상관 ${F(Pm.cFX)}</td></tr>`:''}</table></div></div>
   <div class="grid" style="padding:0;margin-bottom:8px">
    <div class="p c6"><h2>실질 보유<small>ETF를 구성종목으로 풀어서</small></h2><div class="b"><table>${realL.slice(0,12).map(x=>`<tr><td class="l">${esc(x.name)} <span class="mu" style="font-size:11px">${esc(x.src.join('+'))}</span></td><td>${K(x.val)}</td><td>${W(x.val/NAV)}</td></tr>`).join('')}</table></div></div>
    <div class="p c6"><h2>체인 노출<small>주식 대비</small></h2><div class="b">${chainL.map(([k,v])=>`<div class="bg"><span class="bl" style="width:130px">${esc(k)}</span><span class="bt"><i class="am" style="width:${Math.min(v/tot*100,100)}%"></i></span><b>${W(v/tot)}</b></div>`).join('')}</div></div>
   </div>
   <div class="grid" style="padding:0;margin-bottom:8px">
    <div class="p c6"><h2>스트레스 테스트<small>종목별 1년 베타로 추정</small></h2><div class="b" style="line-height:1.9">
      <div>코스피 −10% → <b class="dn">${K(stK)}원</b> (${pct(stK/NAV,1)})</div>
      <div>미 반도체(SOXX) −15% → <b class="dn">${K(stX)}원</b> (${pct(stX/NAV,1)})</div>
      <div>원/달러 +5%(원화 약세) → 달러 자산 <b class="up">+${K(stF)}원</b> (${pct(stF/NAV,1)})</div>
      <div>하루 손실이 이보다 클 확률 5%: <b>${K(Pm.var*NAV)}원</b> · 그런 날 평균 ${K(Pm.cvar*NAV)}원</div></div></div>
    <div class="p c6"><h2>헷지안<small>5거래일 수익률 · 최근 1년</small></h2><div class="b">
      <div class="am" style="font-size:12px">① 인버스 (단기 보험)</div><table><tr><th class="l">수단</th><th>상관</th><th>25% 헷지</th><th>감소</th><th>100% 헷지</th><th>감소</th></tr>
      ${hedge.filter(h=>h.ty==='inv').map(h=>`<tr><td class="l"><span class="am sym" data-sym="${esc(h.sy)}" data-mk="${h.m}" style="cursor:pointer">${esc(h.nm)}</span></td><td>${F(h.rho)}</td><td>${h.amt>0?K(h.amt/4)+'원':'—'}</td><td>${h.amt>0?W(h.red25):'—'}</td><td class="mu">${h.amt>0?K(h.amt)+'원':'—'}</td><td class="mu">${h.amt>0?W(h.red):'—'}</td></tr>`).join('')}</table>
      <div class="am" style="font-size:12px;margin-top:8px">② 분산 (주식 10%p를 옮기면)</div><table><tr><th class="l">수단</th><th>상관</th><th>변동성 감소</th><th>1년 수익</th></tr>
      ${hedge.filter(h=>h.ty==='div').sort((a,b)=>b.red-a.red).map(h=>`<tr><td class="l"><span class="am sym" data-sym="${esc(h.sy)}" data-mk="${h.m}" style="cursor:pointer">${esc(h.nm)}</span></td><td>${F(h.rho)}</td><td class="${h.red>0?'up':'dn'}">${W(h.red)}</td><td>${pct(h.ret1y,0)}</td></tr>`).join('')}</table>
      <div class="mu" style="font-size:11px;margin-top:4px;white-space:normal">① 필요 금액 = 변동성을 가장 많이 줄이는 매수 금액(100% 헷지). 인버스·레버리지는 일간 재조정으로 오래 들면 손실이 쌓임. ② 상관이 낮거나 음수일수록 분산 효과. 과거 1년 상관이라 위기 때는 바뀔 수 있음(물가 충격엔 채권도 같이 빠짐).</div></div></div>
   </div>
   ${pf?`<div class="p" style="margin-bottom:8px"><h2>모의 전략과 비교<small>2011~ 월간 · 원화</small></h2><div class="b"><table><tr><th class="l">전략</th><th>연수익</th><th>변동성</th><th>샤프</th><th>최대낙폭</th><th class="l">지금 배분</th></tr>
      <tr><td class="l am">내 포트 (최근 1년)</td><td>${pct(Pm.ret,1)}</td><td>${W(Pm.vol)}</td><td>${F(Pm.sh)}</td><td>${pct(Pm.mdd,0)}</td><td class="l mu">반도체 중심</td></tr>
      ${pf.filter(x=>!/스트래들/.test(x.name)).map(x=>`<tr><td class="l">${esc(x.name)}</td><td>${pct(x.stats.cagr,1)}</td><td>${W(x.stats.vol)}</td><td>${F(x.stats.sharpe)}</td><td>${pct(x.stats.mdd,0)}</td><td class="l mu" style="white-space:normal;font-size:11px">${Object.entries(x.now||{}).filter(([k,w])=>Math.abs(w)>0.005).map(([k,w])=>`${esc(k)} ${W(w)}`).join(' · ')}</td></tr>`).join('')}</table>
      <div class="mu" style="font-size:11px;margin-top:4px">내 포트는 1년, 전략은 15년 성과라 직접 비교는 거칠다. 핵심은 변동성·낙폭 대비 수익 구조.</div></div></div>`:''}
   ${miss.length?`<div class="mu" style="margin-top:6px">인식 못 한 종목: ${esc(miss.join(', '))}</div>`:''}
   <div class="mu" style="font-size:11px;margin-top:8px;white-space:normal">현재가는 최근 종가. 수익·위험은 지금 비중을 지난 1년(${esc(days[0]||'')}~)에 그대로 적용한 가상 수익률로 계산. 미장은 원화 환산, 한국 날짜 기준 전일 미국 종가. 무위험 3%.</div>`;
}
</script>
