// '## ISA' 줄 아래는 ISA 코어 북(book:'isa'), 그 위는 위성 북(book:'sat'). 분모 (a) 투자자산 = 두 북 + 현금 전부, (b) = (a) + 예적금.
const ISA_HEAD=/^#{1,3}\s*ISA\b/i;
function myParse(txt){ const out=[]; let book='sat'; for(const ln of txt.split(/\n/)){ const t=ln.trim(); if(ISA_HEAD.test(t)){ book='isa'; continue; } if(t.startsWith('#')) continue; const p=t.split(/[\s,]+/).filter(Boolean); if(!p.length) continue;
    const n=x=>{const v=parseFloat(String(x||'').replace(/,/g,'')); return isFinite(v)?v:null;};
    const k=p[0].toUpperCase();
    if(['현금','KRW','CMA','원화','예수금','RP'].includes(k)||/^CMA/.test(k)) out.push({cash:'KRW', amt:n(p[1])||0, book});
    else if(['USD','달러','미국달러'].includes(k)) out.push({cash:'USD', amt:n(p[1])||0, book});
    else if(['예적금','적금','예금','SAVINGS'].includes(k)) out.push({sav:n(p[1])||0});   // 결재 #1 분모 (b): 불가침 예적금 — 반도체 비중 분모에만 더함
    else if(['ISA적립','ISA_MONTHLY','적립'].includes(k)) out.push({isam:n(p[1])||0, isad:Math.max(1,Math.min(28,Math.round(n(p[2])||1)))});   // 결재 #3 글라이드: 'ISA적립 <월 금액> [적립일]' (pb.py isa_monthly_in 과 동일)
    else { // 끝의 숫자 최대 2개 = 수량·평단, 나머지 = 종목 (이름에 공백·숫자 허용: "TIGER 200 IT 5 30000")
      let k2=p.length; const nums=[]; while(k2>1&&nums.length<2&&n(p[k2-1])!=null){ nums.unshift(n(p[k2-1])); k2--; }
      out.push({key:p.slice(0,k2).join(' '), qty:nums.length?nums[0]:0, avg:nums.length>1?nums[1]:null, book}); } } return out; }
// ISA 코어 목표 (안건 8 → 10/21 C안 오너 예외): S&P500 40 · NDX 15(상한) · K200 15 · 국고채 20 · 금 10(상한), 밴드 ±5%p — screener/defs.py ISA_TARGET 과 같게
const ISA_TARGET=[['S&P500',0.40],['NDX',0.15],['K200',0.15],['KTB',0.20],['Gold',0.10]], ISA_BAND=0.05;
function isaBucket(s,nm){ const n=String(nm||'').toUpperCase();
  if(s==='360750'||n.includes('S&P')||['SPY','IVV','VOO','SPLG'].includes(s)) return 'S&P500';
  if(['133690','379810'].includes(s)||n.includes('나스닥')||n.includes('NDX')||['QQQ','QQQM'].includes(s)) return 'NDX';
  if(['148070','305080','152380'].includes(s)||/국고채|국채|KTB/.test(n)) return 'KTB';
  if(['132030','411060'].includes(s)||/골드|금선물|금현물|GOLD/.test(n)||['GLD','IAU'].includes(s)) return 'Gold';
  if(s==='069500'||(/(^|\s)200(\s|$)|코스피/.test(n)&&!/IT|반도체|인버스|레버리지/.test(n))) return 'K200';
  return null; }

// 반도체 분류 (pb.py semi_class 와 동일): 'semi' = 한도 산입(반도체 체인·미국 반도체·반도체/IT 섹터 ETF 전액), 'elec' = 전기·IT 하드웨어(상관 테마, 보조 수치),

const SEMI_ETFS=['139260','091160','PSI','SOXX','SMH','SOXL','SOXQ','XSD','SMHX','396500','395160','449450'];
const US_SEMIS=['MU','SNDK','NVDA','AMD','AVGO','TSM','INTC','QCOM','ARM','MRVL','LRCX','AMAT','KLAC','ASML','WDC','STX'];
function semiClass(a){ const s=a.h.r.s, n=String(a.d.name||'').toUpperCase();
  if(a.etf){ if(SEMI_ETFS.includes(s)||/반도체|SEMI|SOX|IT$|\bIT\b|테크/.test(n)) return {kind:'semi',lookW:0};
    const lc=(a.d.etf.look||{}).chains||{}; let lw=0; for(const [k,w] of Object.entries(lc)) if(/반도체|IT 하드웨어/.test(k)) lw+=w; return {kind:null,lookW:lw}; }
  const ch=((a.d.drivers||{}).chain||{}).name||'';
  if(US_SEMIS.includes(s)||/반도체/.test(ch)) return {kind:'semi',lookW:0};
  if(/IT 하드웨어/.test(ch)) return {kind:'elec',lookW:0};
  return {kind:null,lookW:0}; }
function myResolve(k){ const x=k.toLowerCase().trim();
  const ex=SIX.find(s=>s.s.toLowerCase()===x)||SIX.find(s=>String(s.n).toLowerCase()===x); if(ex) return ex;
  if(/^[a-z][a-z.\-]{0,5}$/.test(x)||/^\d{6}$/.test(x)) return null;   // 티커·코드는 정확히 일치할 때만 (PSI → PepsiCo 오인 방지)
  return SIX.find(s=>String(s.n).toLowerCase().startsWith(x))||SIX.find(s=>String(s.n).toLowerCase().replace(/\s/g,'').includes(x.replace(/\s/g,'')))||null; }
// 비공개 저장소(pb-private/holdings.txt) 동기화 — 읽기 전용 토큰은 이 브라우저 localStorage 에만 보관
const GHK='mt_gh_tok', PBSRC='https://api.github.com/repos/hk99915-bot/pb-private/contents/holdings.txt';
function ghTok(){ try{ return sessionStorage.getItem(GHK)||localStorage.getItem(GHK)||''; }catch(e){ return ''; } }
// PIN 잠금 기억: 토큰을 PIN 으로 암호화(AES-GCM, PBKDF2 25만 회)해 이 브라우저에 저장 → 다음부턴 PIN 만 입력. 복호화한 토큰은 이 창(sessionStorage)에만.
const GHE='mt_gh_enc';
function alertMsg(m){ const e=$('#mysync'); if(e) e.textContent=m; }
const _b64=u=>btoa(String.fromCharCode(...new Uint8Array(u))), _ub64=t=>Uint8Array.from(atob(t),c=>c.charCodeAt(0));
async function _ghKey(pin,salt){ const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pin),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:250000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['encrypt','decrypt']); }
async function ghLock(tok,pin){ const salt=crypto.getRandomValues(new Uint8Array(16)), iv=crypto.getRandomValues(new Uint8Array(12));
  const c=await crypto.subtle.encrypt({name:'AES-GCM',iv},await _ghKey(pin,salt),new TextEncoder().encode(tok));
  localStorage.setItem(GHE,JSON.stringify({s:_b64(salt),i:_b64(iv),c:_b64(c)})); }
async function ghUnlock(pin){ try{ const o=JSON.parse(localStorage.getItem(GHE)||'null'); if(!o) return false;
  const p=await crypto.subtle.decrypt({name:'AES-GCM',iv:_ub64(o.i)},await _ghKey(pin,_ub64(o.s)),_ub64(o.c));
  sessionStorage.setItem(GHK,new TextDecoder().decode(p)); return true; }catch(e){ return false; } }
function ghLocked(){ try{ return !ghTok() && !!localStorage.getItem(GHE); }catch(e){ return false; } }
function myClean(t){ return String(t||'').split('\n').filter(l=>l.trim()&&(ISA_HEAD.test(l.trim())||!l.trim().startsWith('#'))).join('\n'); }
let MYSYNC={st:'',at:''};
// ── 브라우저 주 + 원장 대조 (docs/my_tab_holdings_plan.md 추천 (a)+(b), 10/17 겸이 승인) — 원장(holdings.txt)은 읽기·대조만, 쓰기 없음.
// 메타 mt_holdings_meta = {savedAt,source,digest,ledgerDigest,ledgerAt,exportedAt} — 시각·해시만(수량·금액 없음). 이 브라우저에만 두고 공개 저장소·서버로 안 보냄.
const MYMK='mt_holdings_meta';
function myMeta(){ try{ return JSON.parse(localStorage.getItem(MYMK)||'{}')||{}; }catch(e){ return window._myMeta||{}; } }
function mySetMeta(p){ const m=Object.assign(myMeta(),p); window._myMeta=m; try{ localStorage.setItem(MYMK,JSON.stringify(m)); }catch(e){} return m; }
// 정규화 = pb:scripts/secrets_gen.py gen_holdings()→digest() 와 같은 규칙: 줄 앞뒤 공백 제거·빈 줄 제거·주석(#, '## ISA' 제외) 제거·연속 공백 1칸 → SHA-256 앞 16자
function myNorm(t){ return String(t||'').split(/\r\n|\r|\n/).map(l=>l.trim()).filter(l=>l&&(ISA_HEAD.test(l)||!l.startsWith('#'))).map(l=>l.replace(/\s+/g,' ')).join('\n'); }
async function myDigest(t){ try{ const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(myNorm(t))); return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('').slice(0,16); }catch(e){ return ''; } }
// 줄 단위 차이(같은 줄 여러 개도 셈): onlyA = a 에만, onlyB = b 에만
function myDiff(a,b){ const ca={}; myNorm(a).split('\n').filter(Boolean).forEach(l=>ca[l]=(ca[l]||0)+1);
  const onlyB=[]; myNorm(b).split('\n').filter(Boolean).forEach(l=>{ if(ca[l]) ca[l]--; else onlyB.push(l); });
  const onlyA=[]; for(const [l,n] of Object.entries(ca)) for(let i=0;i<n;i++) onlyA.push(l); return {onlyA,onlyB,n:onlyA.length+onlyB.length}; }
const myDiffHtml=(d,la,lb)=>`<div style="font-size:var(--fs-2);line-height:1.6;margin-top:4px">${d.onlyA.map(l=>`<div class="dn">− ${esc(la)}: ${esc(l)}</div>`).join('')}${d.onlyB.map(l=>`<div class="up">+ ${esc(lb)}: ${esc(l)}</div>`).join('')||''}${d.n?'':'<div class="mu">차이 없음</div>'}</div>`;
let MYLEDGER=null, MYPEND=null;   // 원장 텍스트는 이 창 메모리에만 (저장하지 않음)
const _hm=()=>new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'});
// 원장 받기: 예전엔 받은 값으로 확인 없이 덮어씀 → 이제 브라우저 값이 비어 있을 때만 채우고, 다르면 확인창(기본 = 내 것 유지)
function mySync(cb){ const tk=ghTok(); if(!tk){ MYSYNC={st:'토큰 없음'}; cb&&cb(false); return; }
  MYSYNC={st:'불러오는 중…'};
  fetch(PBSRC+'?t='+Date.now(),{headers:{Authorization:'Bearer '+tk,Accept:'application/vnd.github.raw'},cache:'no-store'})
    .then(r=>{ if(!r.ok) throw new Error(r.status); return r.text(); })
    .then(t=>{ const c=myClean(t), loc=myLoad(), at=_hm(); MYLEDGER=c; MYPEND=null;
      myDigest(c).then(d=>{ if(d) mySetMeta({ledgerDigest:d,ledgerAt:Date.now()}); myBadges(); });
      if(!myNorm(c)) MYSYNC={st:'원장 비어 있음 — 브라우저 값 유지',at};
      else if(!myNorm(loc)){ mySave(c,'sync'); const ta=$('#myta'); if(ta) ta.value=c; MYSYNC={st:'원장에서 불러옴(브라우저 비어 있었음)',at}; }
      else if(myNorm(loc)===myNorm(c)) MYSYNC={st:'원장과 같음',at};
      else { MYPEND=c; MYSYNC={st:'원장과 다름 — 확인 필요(지금은 내 것 유지)',at}; }
      myBadges(); myAsk(); cb&&cb(true); })
    .catch(e=>{ MYSYNC={st:'실패('+e.message+') — 토큰 권한·만료 확인'}; cb&&cb(false); }); }
// 확인창: 원장 값으로 바꿀지 / 유지할지 / 차이 보기. 아무것도 안 누르면 유지
function myAsk(){ const e=$('#myask'); if(!e) return; if(!MYPEND){ e.innerHTML=''; return; } const d=myDiff(myLoad(),MYPEND);
  e.innerHTML=`<div style="border:1px solid var(--amber);padding:6px 8px;margin:6px 0;font-size:var(--fs-2);max-width:640px"><b class="am">원장(holdings.txt)과 이 브라우저 보유가 달라요 — ${d.n}줄.</b> <span class="mu">고르기 전까진 브라우저 값 그대로 써요.</span><br>
    <button id="myaskkeep" class="sbtn" style="margin-top:4px">내 것 유지</button> <button id="myasktake" class="sbtn">원장 값으로 바꾸기</button> <button id="myaskdiff" class="sbtn">차이 보기</button>
    <div id="myaskd" style="display:none">${myDiffHtml(d,'브라우저에만','원장에만')}</div>
    <div class="mu" style="font-size:var(--fs-1);margin-top:4px">원장이 낡았으면 '백업 → 복사' 해서 PB 에게 대화로 전달 → PB 가 체결 확인 후 holdings.txt 반영 (화면은 원장에 쓰지 않음)</div></div>`;
  $('#myaskdiff').onclick=()=>{ const x=$('#myaskd'); x.style.display=x.style.display==='none'?'':'none'; };
  $('#myaskkeep').onclick=()=>{ MYPEND=null; MYSYNC.st='내 것 유지 — 원장과 다름 '+d.n+'줄'; alertMsg(MYSYNC.st+(MYSYNC.at?' · '+MYSYNC.at:'')); myAsk(); myBadges(); };
  $('#myasktake').onclick=()=>{ const c=MYPEND; MYPEND=null; mySave(c,'sync'); const ta=$('#myta'); if(ta) ta.value=c; MYSYNC.st='원장 값으로 바꿈'; alertMsg(MYSYNC.st+(MYSYNC.at?' · '+MYSYNC.at:'')); myAsk(); myBadges(); myRun(); }; }
// 배지 2개: 원장 같음/다름(토큰 있을 때만, 이 브라우저 안에서 비교) · 마지막 백업 N일 전(7일 넘거나 백업 뒤 수정 있으면 주황)
function myBadgeHtml(){ const m=myMeta(), loc=myLoad(); let a, ac='var(--muted)';
  if(!ghTok()) a='원장: 미확인(토큰 없음)'; else if(MYLEDGER===null) a='원장: 확인 전'; else { const n=myDiff(loc,MYLEDGER).n; a=n?`원장과 다름 ${n}줄`:'원장과 같음'; ac=n?'var(--amber)':'var(--up)'; }
  let b, warn=false; if(!m.exportedAt){ b='백업: 없음'; warn=!!myNorm(loc); }
  else { const dd=Math.floor((Date.now()-m.exportedAt)/864e5), mod=(m.savedAt||0)>m.exportedAt; b='마지막 백업 '+(dd?dd+'일 전':'오늘')+(mod?' · 백업 후 수정 있음':''); warn=dd>7||mod; }
  return `<span id="myledb" class="tag" style="color:${ac};border-color:${ac}" title="브라우저 해시 ${esc(m.digest||'—')} · 원장 해시 ${esc(m.ledgerDigest||'—')} (secrets_gen 과 같은 규칙, 이 브라우저에만)">${a}</span><span id="mybakb" class="tag" style="color:${warn?'var(--amber)':'var(--muted)'};border-color:${warn?'var(--amber)':'var(--line)'}">${b}</span>`; }
function myBadges(){ const e=$('#mybadge'); if(e) e.innerHTML=myBadgeHtml(); }
// 내보내기(holdings.txt 형식 텍스트) · 가져오기(미리보기·차이 → 적용). 파일·클립보드는 겸이 기기로만 — 서버 전송 없음
const _ymd=()=>new Date(Date.now()+9*36e5).toISOString().slice(0,10);
function myExportText(){ return `# MY 탭 내보내기 ${_ymd()} (브라우저 작업본 · holdings.txt 형식 · 개인 값 — 공개 저장소·텔레그램 금지)\n`+myLoad().replace(/\s*$/,'\n'); }
function myBakMsg(m){ const e=$('#mybakmsg'); if(e) e.innerHTML=m; }
function myCopy(){ const t=myExportText(), done=()=>{ mySetMeta({exportedAt:Date.now()}); myBadges(); myBakMsg('<span class="up">복사됨</span> — PB 에게는 대화로'); };
