<!doctype html>
<html lang="ko">
<head>
<script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MARKET TERMINAL</title>
<style>
  :root{
    --bg:#000; --panel:#0b0b0b; --line:#2a2a2a; --amber:#ff9a1f; --amber-dim:#9a5f14;
    --txt:#e8e8e8; --muted:#8a8a8a; --up:#2fd05a; --dn:#ff4b4b; --blue:#4aa3ff; --cyan:#35d6e6;
    --mono:"IBM Plex Mono","Consolas","Menlo","Noto Sans Mono CJK KR",monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--txt);font:12.5px/1.45 var(--mono);-webkit-font-smoothing:antialiased}
  a{color:var(--cyan);text-decoration:none}
  .top{display:flex;align-items:center;gap:14px;padding:6px 12px;background:#111;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
  .brand{color:var(--amber);font-weight:700;letter-spacing:.12em}
  .clock{color:var(--muted)}
  .tabs{display:flex;gap:2px;margin-left:auto}
  .tabs button{background:#1a1a1a;color:var(--muted);border:1px solid var(--line);padding:4px 10px;font:inherit;cursor:pointer;letter-spacing:.06em}
  .tabs button.on{background:var(--amber);color:#000;border-color:var(--amber);font-weight:700}
  .tape{white-space:nowrap;overflow:hidden;background:#070707;border-bottom:1px solid var(--line);padding:4px 0}
  .tape .tk{display:inline-block;white-space:nowrap;animation:tk 60s linear infinite;will-change:transform}
  .tape:hover .tk{animation-play-state:paused}
  @keyframes tk{from{transform:translateX(0)}to{transform:translateX(-50%)}}
  @media (prefers-reduced-motion:reduce){.tape .tk{animation:none}}
  .tape .ti{cursor:pointer;display:inline-block;padding:0 16px;color:var(--txt);border-right:1px solid #1a1a1a}
  .tape .ti b{color:var(--amber);font-weight:600;margin-right:6px}
  .tape .ti .v{color:var(--txt)}
  .tape .ti .c{margin-left:6px;font-weight:600}
  .tape .ti.u .c{color:var(--up)} .tape .ti.d .c{color:var(--dn)} .tape .ti.f .c{color:var(--muted)}
  .tape .ti.u{background:linear-gradient(0deg,rgba(47,208,90,.07),transparent)} .tape .ti.d{background:linear-gradient(0deg,rgba(255,75,75,.08),transparent)}
  .tape .ti.lv b{color:#000;background:var(--amber);padding:0 6px;border-radius:2px}
  .grid{display:grid;grid-template-columns:repeat(12,1fr);gap:8px;padding:8px}
  .p{background:var(--panel);border:1px solid var(--line);min-width:0}
  .p h2{margin:0;padding:5px 8px;background:#161616;color:var(--amber);font-size:11.5px;letter-spacing:.14em;font-weight:700;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}
  .p h2 small{color:var(--muted);font-weight:400;letter-spacing:0}
  .p .b{padding:6px 8px;overflow:auto}
  .c12{grid-column:span 12}.c8{grid-column:span 8}.c6{grid-column:span 6}.c4{grid-column:span 4}.c3{grid-column:span 3}
  @media(max-width:1100px){.c3,.c4{grid-column:span 6}.c8{grid-column:span 12}}
  @media(max-width:700px){.c3,.c4,.c6,.c8{grid-column:span 12}.tabs button{padding:4px 7px}}
  table{border-collapse:collapse;width:100%;white-space:nowrap}
  th{color:var(--muted);text-align:right;font-weight:400;padding:2px 6px;border-bottom:1px solid var(--line);letter-spacing:.05em}
  td{padding:2px 6px;text-align:right;border-bottom:1px solid #141414}
  th:first-child,td:first-child,th.l,td.l{text-align:left}
  tr:hover td{background:#141414}
  .up{color:var(--up)}.dn{color:var(--dn)}.mu{color:var(--muted)}.am{color:var(--amber)}
  .kv{display:grid;grid-template-columns:auto 1fr;gap:2px 12px}
  .kv div:nth-child(odd){color:var(--muted)}
  .bar{height:6px;background:#1c1c1c;position:relative;margin:2px 0 6px}
  .bar i{position:absolute;left:0;top:0;bottom:0;background:var(--amber)}
  .tag{display:inline-block;padding:0 5px;border:1px solid var(--amber-dim);color:var(--amber);font-size:10.5px;margin-right:4px}
  .tag.g{border-color:#1f6b33;color:var(--up)}.tag.r{border-color:#7a2020;color:var(--dn)}.tag.b{border-color:#2a4f7a;color:var(--blue)}
  pre{margin:0;white-space:pre-wrap;color:#d0d0d0;font:inherit}
  .err{background:#2a0e0e;color:#ffb3b3;border:1px solid #5a1a1a;padding:6px 8px;margin:8px}
  .spark{display:flex;align-items:flex-end;gap:1px;height:34px}
  .spark i{flex:1;background:var(--amber-dim)}.spark i.last{background:var(--amber)}
  .load{padding:40px;text-align:center;color:var(--muted);letter-spacing:.2em}
  .md{padding:10px 14px;max-width:1200px}
  .md table{white-space:normal}
  .md h1,.md h2{color:var(--amber);letter-spacing:.08em;font-size:13px;margin:14px 0 6px}
  td.sym{cursor:pointer;text-decoration:underline dotted}
  .px{cursor:pointer;text-decoration:underline dotted;color:var(--amber)}
  .drawer{position:fixed;top:0;right:0;bottom:0;width:min(980px,100vw);background:#070707;border-left:1px solid var(--amber-dim);z-index:20;overflow:auto;box-shadow:-10px 0 30px #000;display:none}
  .drawer.on{display:block}
  .drawer .hd{position:sticky;top:0;z-index:3;background:#111;border-bottom:1px solid var(--line);padding:8px 12px;display:flex;gap:14px;align-items:baseline}
  .drawer .hd b{color:var(--amber);font-size:15px;letter-spacing:.06em}
  .drawer .hd .x{margin-left:auto;cursor:pointer;color:var(--muted);border:1px solid var(--line);padding:2px 8px}
  .drawer .grid{padding:8px}
  #cv,#mcv,#mbt,#pfc{display:block;width:100%;height:260px;background:#050505}
  .sc{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
  .sc div.k{border:1px solid var(--line);padding:6px 8px}
  .sc .t{letter-spacing:.1em;font-size:11px;margin-bottom:4px}
  .backdrop{position:fixed;inset:0;background:#0008;z-index:19;display:none}.backdrop.on{display:block}
.ctab{margin-left:8px}.ctab button{background:none;border:1px solid var(--line);color:var(--muted);font:inherit;font-size:11px;padding:1px 8px;margin-left:4px;cursor:pointer}.ctab button.on{color:var(--amber);border-color:var(--amber)}
.lvbar{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;margin-bottom:6px}.lvbar i{font-style:normal;color:var(--muted)}
.nvtab{margin:0 0 6px 0}.live .nv{width:100%;max-width:700px;background:#fff;display:block}
.live iframe{width:100%;height:440px;border:0;display:block}.live .lk{margin-top:6px;font-size:12px}.live .lk a{color:var(--blue);margin-right:12px}
.rq{width:100%;max-width:420px;background:#050505;border:1px solid var(--line);color:var(--txt);font:inherit;padding:5px 8px;margin-bottom:8px}
tr.sub{display:none}tr.sub.on{display:table-row}tr.sub td{font-size:12px;line-height:1.7;padding-bottom:8px;text-align:left}td.tg{cursor:pointer;color:var(--amber);width:14px}
details.cmts>summary{list-style:none;cursor:pointer}details.cmts>summary::-webkit-details-marker{display:none}details.cmts>summary h2 span::before{content:"▸ "}details.cmts[open]>summary h2 span::before{content:"▾ "}details.cmts:not([open])>summary h2{border-bottom:0}
details.sec{margin-bottom:10px}details.sec summary{cursor:pointer;padding:4px 0;border-bottom:1px solid var(--line);margin-bottom:4px}
.rp{padding:4px 0;border-bottom:1px dashed #1c1c1c}.rp .sm{color:#bdbdbd;font-size:12px;line-height:1.6;margin:2px 0 2px 12px}
tr.sub td,.rp,.rp *,.sm,.sm *{white-space:normal!important;word-break:keep-all;overflow-wrap:anywhere}.rp{max-width:1100px}
.an{margin-left:6px;color:#ddd}.an i{font-style:normal;color:var(--muted);font-size:11px;margin-left:6px}
.tone{font-size:11px;border:1px solid currentColor;padding:0 5px;margin-left:4px;border-radius:2px}.tone i{font-style:normal;opacity:.8}
.rp .sm .k{display:inline-block;min-width:34px;color:var(--amber);font-size:11px;margin-right:6px}.rp .sm ul{margin:2px 0 2px 40px;padding:0}.rp .sm li{margin:0}
td.mac{cursor:pointer;text-decoration:underline dotted}
.simt td,.simt th{padding:3px 8px}
.bv{font-size:14px;margin-bottom:2px}.bv b{font-size:16px;margin-right:4px}
.bg{display:flex;align-items:center;gap:6px;margin:4px 0}.bg .bl{width:84px;color:var(--muted);font-size:12px}.bg b{width:64px;text-align:right;font-size:12px}
.bg .bt{position:relative;flex:1;height:8px;background:#151515}.bg .bt i{position:absolute;left:0;top:0;bottom:0}.bg .bt u{position:absolute;top:-2px;bottom:-2px;width:1px;background:#555}
.bg .bt i.up,.bg .bs i.up{background:var(--up)}.bg .bt i.dn,.bg .bs i.dn{background:var(--dn)}.bg .bt i.am{background:var(--amber)}
.bg .bs{flex:1;height:8px;display:flex;background:#151515}.bg .bs i{display:block;height:100%}
.bsv{width:100%;height:46px;display:block}.bsv .pl{fill:none;stroke:var(--amber);stroke-width:1.5}.bsv .g60{stroke:var(--up);stroke-dasharray:3 3;opacity:.6}.bsv .g40{stroke:var(--dn);stroke-dasharray:3 3;opacity:.6}.bsv .pd{fill:var(--amber)}
.tg{font-size:13px;line-height:1.6}
.rp .rt{margin:2px 0 2px 12px;font-size:12px}
.srch{position:relative;margin-left:16px}.srch input{width:260px;background:#050505;border:1px solid var(--line);color:var(--txt);font:inherit;font-size:12px;padding:4px 8px}
.srch input:focus{outline:none;border-color:var(--amber)}#sres{position:absolute;top:100%;left:0;right:0;background:#0b0b0b;border:1px solid var(--line);z-index:50;display:none;max-height:360px;overflow:auto}
#sres div{padding:4px 8px;cursor:pointer;font-size:12px}#sres div.on,#sres div:hover{background:#1a1a1a;color:var(--amber)}#sres i{font-style:normal;color:var(--muted);margin-left:6px}
@media (max-width:760px){.srch input{width:150px}}
.mvt td.mac{white-space:normal;min-width:84px;max-width:120px;line-height:1.3}.mvt tr.mvr{cursor:pointer}
@media (max-width:700px){.mvt .hm{display:none}.mvt td,.mvt th{padding:4px 4px;font-size:12px}}
.ovl{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:6px}.ovl button{background:none;border:1px solid var(--line);color:var(--muted);font:inherit;font-size:11px;padding:2px 8px;cursor:pointer;border-radius:2px}
.ovl button.on{color:var(--c,var(--amber));border-color:var(--c,var(--amber))}
.subtabs{display:none;gap:4px;padding:6px 8px 0;overflow-x:auto;scrollbar-width:none}.subtabs.on{display:flex}.subtabs::-webkit-scrollbar{display:none}
.subtabs button{flex:0 0 auto;background:none;border:0;border-bottom:2px solid transparent;color:var(--muted);font:inherit;font-size:12.5px;padding:4px 10px;cursor:pointer;letter-spacing:.04em}
.subtabs button.on{color:var(--amber);border-bottom-color:var(--amber)}
/* ── 모바일 ── */
html,body{overflow-x:hidden}
.clock,#gen{white-space:nowrap}
@media (max-width:700px){
  html,body{font-size:13.5px;line-height:1.55}
  .top{flex-wrap:wrap;gap:6px 10px;padding:6px 10px}
  .brand{font-size:13px;letter-spacing:.06em}
  .clock{font-size:11.5px}
  #gen{display:none}
  .srch{order:3;margin-left:0;flex:1 1 100%}.srch input{width:100%;font-size:15px;padding:7px 10px}
  .tabs{order:4;flex:1 1 100%;margin-left:0;overflow-x:auto;flex-wrap:nowrap;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding-bottom:2px}
  .tabs::-webkit-scrollbar{display:none}
  .tabs button{flex:0 0 auto;padding:7px 11px;font-size:12.5px}
  .tape .ti{padding:0 12px;font-size:13px}
  .grid{gap:8px;padding:6px}
  .p h2{font-size:12px;padding:7px 9px;flex-wrap:wrap;gap:2px 8px}
  .p .b{padding:8px 9px}
  th,td{padding:4px 7px;font-size:12.5px}
  .drawer{width:100vw;border-left:0}
  .drawer .hd{flex-wrap:wrap;gap:4px 10px;padding:8px 10px}
  .drawer .hd b{font-size:15px}
  .drawer .hd #dr-s{font-size:12px;flex:1 1 100%;order:3}
  .drawer .grid{padding:6px}
  .drawer .p{grid-column:span 12!important}
  #cv{height:220px}
  .sc{grid-template-columns:1fr}
  .kv{gap:3px 10px}
  td.l.mu{white-space:normal;min-width:180px}
  .md{padding:8px 10px}
  .bg .bl{width:72px}
  .live iframe{height:360px}
}
/* 스텔스: 흑백 + 밝은 바탕(반전) — 색 신호 없이 숫자 부호(+/−)로만 읽음 */
/* 엑셀 스킨 (사무실 모드): 흰 바탕·회색 격자·맑은고딕, 음수만 빨강(엑셀 기본 서식처럼), 차트는 밝게 반전 */
html.xl{--bg:#fff;--panel:#fff;--line:#d4d4d4;--amber:#000;--amber-dim:#444;--txt:#000;--muted:#595959;--up:#000;--dn:#c00000;--blue:#000;--cyan:#000;
  --mono:"Malgun Gothic","맑은 고딕","Apple SD Gothic Neo","Noto Sans KR",sans-serif}
html.xl body{font-size:13px;background-color:#fff;background-image:linear-gradient(#e6e6e6 1px,transparent 1px),linear-gradient(90deg,#e6e6e6 1px,transparent 1px);background-size:72px 21px;padding-bottom:30px}

html.xl [style*="background:#0"],html.xl [style*="background:#1"],html.xl [style*="background: #0"]{background:#fff!important}

<body>
<div class="top">
  <span class="brand" id="brand">MARKET TERMINAL</span><button id="stb" title="흑백 모드 (단축키 \\)">◐</button>
  <span class="clock" id="clock">—</span>
  <span class="mu" id="gen"></span>
  <div class="srch"><input id="sq" placeholder="종목·티커 검색 (예: 삼성전자, 005930, NVDA)" autocomplete="off"><div id="sres"></div></div>
  <div class="tabs">
    <button class="on" data-g="home">HOME</button><button data-g="my">MY</button><button data-g="life">LIFE</button><button data-g="mkt">MARKET</button>
    <button data-g="daily">DAILY</button><button data-g="res">RESEARCH</button><button data-g="quant">QUANT</button><button data-g="study">STUDY</button><button data-g="sys">SYSTEM</button>
  </div>
</div>
<div id="xlrib"><span>파일</span><b>홈</b><span>삽입</span><span>그리기</span><span>페이지 레이아웃</span><span>수식</span><span>데이터</span><span>검토</span><span>보기</span><span>도움말</span></div>
<div id="xlfx"><span id="xlcell">A1</span><i>fx</i><span id="xlfxv">=SUMIFS(실적!D:D,실적!A:A,">="&amp;TODAY()-7)</span></div>
<div class="tape" id="tape"></div>
<div class="subtabs" id="subt"></div>
<div id="root"><div class="load">LOADING …</div></div>
<div class="backdrop" id="bd"></div>
<div class="drawer" id="dr"><div class="hd"><b id="dr-t">—</b><span id="dr-s" class="mu"></span><span class="x" id="dr-x">ESC ✕</span></div><div id="dr-b"></div></div>

<script>
/* ───── 공용: 상수·도우미·검색·수치 도구 (탭 파일들이 쓴다) ───── */
const CLS={TREND_LONG:'추세상승',TREND_OVEREXTENDED:'추세과열',PULLBACK_IN_UPTREND:'눌림',COUNTERTREND_BOUNCE:'역추세반등',TREND_SHORT:'추세하락',NEUTRAL:'중립',OVEREXTENDED:'과열'};
const SEC=[['TREND_LONG','TREND LONG'],['PULLBACK_IN_UPTREND','PULLBACK IN UPTREND'],['COUNTERTREND_BOUNCE','COUNTERTREND BOUNCE'],['OVEREXTENDED','OVEREXTENDED / RISK≥60'],['TREND_SHORT','TREND SHORT']];
let D=null, view='home';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const pct=(x,d=1)=>x==null?'':`<span class="${x>0?'up':x<0?'dn':'mu'}">${(x*100).toFixed(d)>0?'+':''}${(x*100).toFixed(d)}%</span>`;
const num=(x,d=0)=>x==null?'':Number(x).toLocaleString(undefined,{maximumFractionDigits:d,minimumFractionDigits:d});

/* 수치 도구 */
const mean=a=>a.reduce((x,y)=>x+y,0)/a.length;
const cov=(a,b)=>{const ma=mean(a),mb=mean(b);let s=0;for(let i=0;i<a.length;i++)s+=(a[i]-ma)*(b[i]-mb);return s/(a.length-1);};
const sd=a=>Math.sqrt(cov(a,a));
const corr=(a,b)=>cov(a,b)/(sd(a)*sd(b)||1);
const quant=(a,q)=>{const s=[...a].sort((x,y)=>x-y);return s[Math.floor(q*(s.length-1))];};
function cl(series){ const m={}; for(const r of series||[]) m[r[0]]=r.length>=6?r[4]:r[1]; return m; }
let SG=null, CH=null;
function med(a){const s=[...a].sort((x,y)=>x-y),n=s.length;return n?(n%2?s[(n-1)/2]:(s[n/2-1]+s[n/2])/2):null;}

<script>
/* ───── 공용: 라이브 시세 띠·헤더 시각·render·탭 전환·부트스트랩 ───── */
let L=null;
function loadLive(){google.script.run.withSuccessHandler(t=>{try{L=t?JSON.parse(t):null;}catch(e){L=null;} if(D){ tape(); genHdr(); }}).withFailureHandler(()=>{}).getLive();}
let TAPE_HTML='';
function tkItem(k,v,c,dg){ const cls=c==null?'f':c>0.0005?'u':c<-0.0005?'d':'f', ar=cls==='u'?'▲':cls==='d'?'▼':'■';
  return `<span class="ti ${cls}" data-key="${esc(k)}" title="${esc(k)} 차트 보기"><b>${esc(k)}</b><span class="v">${num(v,dg??2)}</span><span class="c">${c==null?'':ar+' '+Math.abs(c*100).toFixed(2)+'%'}</span></span>`; }
function tape(){
  const items=[], seen=new Set();
  if(L&&L.items&&L.items.length){ items.push(`<span class="ti lv"><b>LIVE</b><span class="v mu">${esc(L.updated_at||'')}</span></span>`); for(const d of L.items){seen.add(d.key); items.push(tkItem(d.key,d.last,d.chg,2)); if(d.key==='K200F'&&d.basis!=null) items.push(`<span class="ti ${d.basis<-1?'d':d.basis>1?'u':'f'}" data-basis="1" title="선물−현물. 크게 마이너스면 선물 투매(공포) · 누르면 설명·이력"><b>베이시스</b><span class="v">${d.basis>0?'+':''}${d.basis.toFixed(2)}</span><span class="c">${d.basis<-1?'백워데이션':d.basis>1?'콘탱고':'중립'}</span></span>`);} }
  for(const mk of ['KR','US']){const m=(D.state||{})['macro_'+mk]; if(m&&m.value) for(const d of m.value){ if(seen.has(d.key)) continue; seen.add(d.key); items.push(tkItem(d.key,d.last,d.chg1));}}
  const b=(D.breadth||[]); for(const mk of ['KR','US']){const x=b.filter(r=>r.market===mk).pop(); if(x){ const p=x.pct_above200, cls=p>=0.6?'u':p<0.4?'d':'f'; items.push(`<span class="ti ${cls}" data-view="${mk.toLowerCase()}" title="${mk} 화면으로"><b>${mk} BREADTH</b><span class="v">200D↑ ${Math.round(p*100)}%</span><span class="c">A/D ${x.adv}/${x.dec}</span></span>`);} }
  if(!items.length){ $('#tape').innerHTML='<span class="mu" style="padding:0 16px">no data</span>'; TAPE_HTML=''; return; }
  const h=items.join('');
  if(h===TAPE_HTML) return;            // 내용이 같으면 애니메이션을 재시작하지 않음
  TAPE_HTML=h;
  $('#tape').innerHTML=`<div class="tk" style="animation-duration:${Math.max(30,items.length*5)}s">${h}${h}</div>`;
}
/* 헤더 시각: DATA = dashboard.json 생성(장중 브리핑 때만) · LIVE = live.json(60초마다 다시 읽음). 장중 LIVE 20분 넘게 묵으면 ⚠️ */
function genHdr(){ const g=$('#gen'); if(!g) return; const hm=x=>{ const m=String(x||'').match(/(\d{1,2}):(\d{2})/); return m?m[1].padStart(2,'0')+':'+m[2]:''; };
  let t='DATA '+(hm(D&&D.generated_at)||((D&&D.generated_at)||'—'));
  const lu=L&&L.updated_at; if(lu){ let warn=false;
    try{ const k=new Date(Date.now()+9*3600e3), m=String(lu).match(/(?:(\d{4})-)?(\d{1,2})-(\d{1,2})[ T](\d{1,2}):(\d{2})/);
      const wd=k.getUTCDay(), mins=k.getUTCHours()*60+k.getUTCMinutes();
      if(m&&wd>=1&&wd<=5&&mins>=540&&mins<=930){ const lt=Date.UTC(m[1]?+m[1]:k.getUTCFullYear(),+m[2]-1,+m[3],+m[4],+m[5]); warn=(k.getTime()-lt)>20*60e3; } }catch(e){}
    t+=' · '+(warn?'⚠️ ':'')+'LIVE '+(hm(lu)||lu); }
  g.textContent=t; }
function render(){
  if(!D) return;
  $('#gen').textContent='DATA '+(D.generated_at||''); genHdr();

  $('#root').innerHTML = v==='home'?homeView():v==='kr'?marketView('KR'):v==='us'?marketView('US'):v==='rep'?repView():v==='val'?valView():v==='daily'?dailyView():v==='dart'?dartView():v==='mom'?momView():v==='pf'?pfView():v==='cmt'?cmtView():v==='views'?viewsView():v==='heat'?heatView():v==='my'?myView():v==='life'?lifeView():v==='study'?studyView():v==='lab'?labView():v==='bond'?bondView():v==='deriv'?derivView():v==='edu'?eduView():v==='apt'?aptView():v==='eng'?engView():v==='sig'?sigView():v==='chain'?chainView():v==='brief'?briefView():v==='mdkr'?mdView('latest_KR'):mdView('latest_US');
  if(v==='rep') repFill();
  if(v==='dart') dartFill();
}
const GROUPS={home:[['home','HOME']],my:[['my','MY']],life:[['life','LIFE']],
  mkt:[['kr','KR'],['us','US'],['heat','히트맵'],['mdkr','KR 전종목'],['mdus','US 전종목'],['bond','채권'],['deriv','파생']],
  daily:[['daily','데일리 리포트'],['cmt','운용회의'],['views','VIEWS'],['brief','브리핑 기록']],
  res:[['rep','리서치'],['val','밸류에이션'],['dart','공시']],
  quant:[['chain','공급망'],['sig','시그널 검증'],['study','검증 스터디'],['lab','전략 연구소'],['mom','모멘텀'],['pf','모의 포트폴리오']],
  study:[['edu','커리큘럼'],['apt','인적성'],['eng','오늘의 영어']]};
GROUPS.sys=[['sysb','작업 보드'],['sysc','변경 이력'],['syso','운영 상태']];   // SYSTEM 탭 (ops)
const LASTV={}; let GRP='home';
function groupOf(v){ for(const [g,a] of Object.entries(GROUPS)) if(a.some(x=>x[0]===v)) return g; return 'home'; }
function setView(v){ GRP=groupOf(v); LASTV[GRP]=v; view=v;
  document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x.dataset.g===GRP));
  const sub=GROUPS[GRP], st=$('#subt');
  st.classList.toggle('on',sub.length>1);
  st.innerHTML=sub.length>1?sub.map(([k,n])=>`<button data-v="${k}" class="${k===v?'on':''}">${n}</button>`).join(''):'';
  st.querySelectorAll('button').forEach(b=>b.onclick=()=>setView(b.dataset.v));
  render(); }
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{const g=b.dataset.g; setView(LASTV[g]||GROUPS[g][0][0]);});
function load(){
  google.script.run.withSuccessHandler(d=>{D=d;render();}).withFailureHandler(e=>{$('#root').innerHTML=`<div class="err">LOAD FAILED: ${esc(e.message)}</div>`;}).getData();

<script>
/* ───── 사용 기록 (나만 보는 로컬 집계) ─────
   이 브라우저 localStorage 에만 '일별 횟수'를 쌓는다. 외부 전송·분석 도구 없음.
   내보내기 = 비공개 저장소 이슈 폼을 미리 채워 여는 링크(쓰기 토큰 불필요) → 워크플로가 usage/*.csv 에 반영. */
(function(){
  const K='mt_usage_v1', KEEP=180, REPO='hk99915-bot/pb-private';
  const GRPS=['home','my','life','mkt','daily','res','quant','study','sys'];
  const EVS=['detail','panel','duel','study_chk','quiz','quiz_ok','export'];
  const kst=()=>new Date(Date.now()+9*3600e3);              // KST 기준 날짜·시각
  const dkey=()=>kst().toISOString().slice(0,10);
  const hr=()=>kst().getUTCHours()+kst().getUTCMinutes()/60;
  let S; try{ S=JSON.parse(localStorage.getItem(K)||'null'); }catch(e){ S=null; }
  if(!S||typeof S!=='object'||!S.d) S={v:1,d:{},x:null};
  if(!S.dev) S.dev=Math.random().toString(36).slice(2,6);   // 기기 구분용 임의 4자 (폰·PC 기록을 합칠 때 덮어쓰기 방지)
  const save=()=>{ const ks=Object.keys(S.d).sort(); ks.slice(0,Math.max(0,ks.length-KEEP)).forEach(k=>delete S.d[k]);
    try{ localStorage.setItem(K,JSON.stringify(S)); }catch(e){} };
  const day=()=>{ const k=dkey(); return S.d[k]||(S.d[k]={s:0,g:{},sv:{},e:{},mh:0,nt:0,t0:null,t1:null}); };
  const hm=()=>kst().toISOString().slice(11,16);
  function bump(kind,name){ try{ const D=day(), h=hr(); D.t0=D.t0||hm(); D.t1=hm();
      try{ D.st=Object.keys(JSON.parse(localStorage.getItem('mt_study_done')||'{}')).length; }catch(_){}   // 스터디 완료 모듈 수 스냅샷
      if(kind==='g'){ D.g[name]=(D.g[name]||0)+1; if(document.documentElement.classList.contains('xl')) D.xl=(D.xl||0)+1;   // 엑셀 스킨(사무실 모드) 상태에서 연 화면
        if(name==='mkt'||name==='home'){ if(h>=9&&h<15.5) D.mh++; if(h>=21||h<7) D.nt++; } }   // 장중(09–15:30)·미장 시간(21–07) 시세 화면 확인
      else if(kind==='sv') D.sv[name]=(D.sv[name]||0)+1;
      else D.e[name]=(D.e[name]||0)+1;
      save(); }catch(e){} }
  // 세션: 탭을 연 뒤 30분 넘게 비활성이었다가 돌아오면 새 세션
  let last=0; const touch=()=>{ const n=Date.now(); if(n-last>30*60e3){ try{ day().s++; save(); }catch(e){} } last=n; };
  touch(); document.addEventListener('visibilitychange',()=>{ if(!document.hidden) touch(); });
  // 화면 전환: 전역 setView 를 감싼다 (탭·하위 탭·코드에서 이동 모두 이 함수를 거침)
  const gOf=v=>{ let g=v; try{ if(typeof groupOf==='function') g=groupOf(v); }catch(e){} return g==='system'?'sys':g; };
  if(typeof window.setView==='function'){ const o=window.setView; let pg=null;
    window.setView=function(v){ const g=gOf(v); touch(); if(g!==pg) bump('g',GRPS.includes(g)?g:'other'); pg=g; bump('sv',v); return o.apply(this,arguments); };
    bump('g','home'); pg='home'; }
  // 행동 이벤트(위임): 종목 상세·패널 펼침·대결 제출·스터디 체크·퀴즈
  let lastSum=null;
  document.addEventListener('click',e=>{ const t=e.target; if(!t||!t.closest) return; touch(); const sm=t.closest('summary'); lastSum=sm?sm.parentElement:null;
    if(t.closest('.sym,[data-sym]')) bump('e','detail');
    const a=t.closest('a[href*="/issues/new"]'); if(a&&/title=(pick|exit|ticket)/i.test(a.href)) bump('e','duel');
    if(t.closest('#exgo')) bump('e','duel');
    const ch=t.closest('[data-ch]'); if(ch){ const k=ch.dataset.ch; bump('e','quiz');
      setTimeout(()=>{ const r=document.querySelector(`[data-res="${CSS.escape(k)}"]`); if(r&&/정답/.test(r.textContent)) bump('e','quiz_ok'); },0); }
  },true);
  document.addEventListener('toggle',e=>{ const d=e.target; if(d&&d.tagName==='DETAILS'&&d.open&&d===lastSum&&d.id!=='usagebox') bump('e','panel'); },true);
  document.addEventListener('change',e=>{ const c=e.target; if(c&&c.matches&&c.matches('[data-mchk]')&&c.checked) bump('e','study_chk'); },true);

  // ── 내보내기: 최근 7일(또는 마지막 내보내기 이후) 일별 CSV → 비공개 이슈 폼 ──
  const HDR=['date','dev','sessions','first','last',...GRPS,'other','mkt_open_hours','night','detail','panel','duel','study_chk','quiz','quiz_ok','study_total','xl','top_sub'];
  function rows(n){ const ks=Object.keys(S.d).sort().slice(-n);
    return ks.map(k=>{ const D=S.d[k], top=Object.entries(D.sv||{}).sort((a,b)=>b[1]-a[1]).slice(0,4).map(([a,b])=>a+':'+b).join(';');
      return [k,S.dev,D.s||0,D.t0||'',D.t1||'',...GRPS.map(g=>(D.g||{})[g]||0),(D.g||{}).other||0,D.mh||0,D.nt||0,
        ...['detail','panel','duel','study_chk','quiz','quiz_ok'].map(x=>(D.e||{})[x]||0),D.st||0,D.xl||0,top].join(','); }); }
  function exportUrl(n){ const isoW=(()=>{ const d=kst(); d.setUTCHours(0,0,0,0); const w=(d.getUTCDay()+6)%7; d.setUTCDate(d.getUTCDate()-w+3);
      const y=d.getUTCFullYear(), f=new Date(Date.UTC(y,0,4)); return y+'-W'+String(1+Math.round(((d-f)/864e5-3+((f.getUTCDay()+6)%7))/7)).padStart(2,'0'); })();
    const csv=[HDR.join(','),...rows(n)].join('\n');
    return `https://github.com/${REPO}/issues/new?template=usage.yml&title=${encodeURIComponent('usage '+isoW)}&data=${encodeURIComponent(csv)}`; }
  function summary(){ const ks=Object.keys(S.d).sort(), last7=ks.filter(k=>k>=new Date(Date.now()+9*3600e3-6*864e5).toISOString().slice(0,10));
    const sum=(f)=>last7.reduce((a,k)=>a+f(S.d[k]),0);
    const g=GRPS.map(x=>[x,sum(D=>(D.g||{})[x]||0)]).filter(x=>x[1]).sort((a,b)=>b[1]-a[1]);
    return {days:last7.length, all:ks.length, ses:sum(D=>D.s||0), g, mh:sum(D=>D.mh||0), duel:sum(D=>(D.e||{}).duel||0), chk:sum(D=>(D.e||{}).study_chk||0), quiz:sum(D=>(D.e||{}).quiz||0), x:S.x}; }
  function box(){ const s=summary();
    return `<details class="p c12" id="usagebox" style="margin-top:10px"><summary style="cursor:pointer;padding:6px 10px"><b>사용 기록</b> <span class="mu" style="font-size:11.5px">최근 7일 ${s.days}일 접속 · 세션 ${s.ses} · 이 브라우저에만 저장</span></summary>
     <div class="b" style="font-size:12px;line-height:1.7;white-space:normal">
      <div>탭별 열람(7일): ${s.g.map(([k,v])=>`<span style="margin-right:8px">${k.toUpperCase()} <b>${v}</b></span>`).join('')||'<span class="mu">아직 없음</span>'}</div>
      <div>장중 시세 확인 <b>${s.mh}</b> · 대결 제출 클릭 <b>${s.duel}</b> · 스터디 체크 <b>${s.chk}</b> · 퀴즈 <b>${s.quiz}</b></div>
      <div class="mu">기록 일수 ${s.all}일 · 마지막 내보내기 ${s.x||'없음'}</div>
      <div style="margin-top:6px"><button class="sbtn" id="usgexp">사용 기록 내보내기 (최근 7일 → 비공개 이슈)</button> <button class="sbtn" id="usgexp28">28일</button> <button class="sbtn" id="usgclr" style="margin-left:8px">기록 지우기</button></div>
      <div class="mu" style="font-size:11px">버튼을 누르면 비공개 저장소 이슈 폼이 채워진 채 열린다 → '제출'하면 usage/daily.csv·weekly.csv 에 반영. 주 1회(일요일 주간 리뷰 때) 권장.</div>
     </div></details>`; }
  function inject(){ try{ if(typeof view==='undefined'||(view!=='my'&&view!=='syso')) return; const r=document.getElementById('root'); if(!r||document.getElementById('usagebox')) return;
      r.insertAdjacentHTML('beforeend',box());
      const go=n=>{ S.x=dkey(); bump('e','export'); window.open(exportUrl(n),'_blank'); };
      document.getElementById('usgexp').onclick=()=>go(7); document.getElementById('usgexp28').onclick=()=>go(28);
      document.getElementById('usgclr').onclick=()=>{ if(confirm('이 브라우저의 사용 기록을 지울까요?')){ S={v:1,d:{},x:null,dev:S.dev}; save(); const b=document.getElementById('usagebox'); if(b) b.remove(); inject(); } };
    }catch(e){} }
  const root=document.getElementById('root'); if(root) new MutationObserver(()=>{ if(!document.getElementById('usagebox')) inject(); }).observe(root,{childList:true});
  window.mtUsage={dump:()=>JSON.parse(JSON.stringify(S)), csv:n=>[HDR.join(','),...rows(n||7)].join('\n')};
})();
</script>
</body>
</html>
