<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MARKET TERMINAL</title>
<style>
  :root{
    --bg:#000; --panel:#0b0b0b; --line:#2a2a2a; --amber:#ff9a1f; --amber-dim:#9a5f14;
    --txt:#e8e8e8; --muted:#8a8a8a; --up:#2fd05a; --dn:#ff4b4b; --blue:#4aa3ff; --cyan:#35d6e6;
    --mono:"IBM Plex Mono","Consolas","Menlo","Noto Sans Mono CJK KR",monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--txt);font:12.5px/1.45 var(--mono);-webkit-font-smoothing:antialiased}
  a{color:var(--cyan);text-decoration:none}
  .top{display:flex;align-items:center;gap:14px;padding:6px 12px;background:#111;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
  .brand{color:var(--amber);font-weight:700;letter-spacing:.12em}
  .clock{color:var(--muted)}
  .tabs{display:flex;gap:2px;margin-left:auto}
  .tabs button{background:#1a1a1a;color:var(--muted);border:1px solid var(--line);padding:4px 10px;font:inherit;cursor:pointer;letter-spacing:.06em}
  .tabs button.on{background:var(--amber);color:#000;border-color:var(--amber);font-weight:700}
  .tape{white-space:nowrap;overflow:hidden;background:#070707;border-bottom:1px solid var(--line);padding:4px 0}
  .tape .tk{display:inline-block;white-space:nowrap;animation:tk 60s linear infinite;will-change:transform}
  .tape:hover .tk{animation-play-state:paused}
  @keyframes tk{from{transform:translateX(0)}to{transform:translateX(-50%)}}
  @media (prefers-reduced-motion:reduce){.tape .tk{animation:none}}
  .tape .ti{cursor:pointer;display:inline-block;padding:0 16px;color:var(--txt);border-right:1px solid #1a1a1a}
  .tape .ti b{color:var(--amber);font-weight:600;margin-right:6px}
  .tape .ti .v{color:var(--txt)}
  .tape .ti .c{margin-left:6px;font-weight:600}
  .tape .ti.u .c{color:var(--up)} .tape .ti.d .c{color:var(--dn)} .tape .ti.f .c{color:var(--muted)}
  .tape .ti.u{background:linear-gradient(0deg,rgba(47,208,90,.07),transparent)} .tape .ti.d{background:linear-gradient(0deg,rgba(255,75,75,.08),transparent)}
  .tape .ti.lv b{color:#000;background:var(--amber);padding:0 6px;border-radius:2px}
  .grid{display:grid;grid-template-columns:repeat(12,1fr);gap:8px;padding:8px}
  .p{background:var(--panel);border:1px solid var(--line);min-width:0}
  .p h2{margin:0;padding:5px 8px;background:#161616;color:var(--amber);font-size:11.5px;letter-spacing:.14em;font-weight:700;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}
  .p h2 small{color:var(--muted);font-weight:400;letter-spacing:0}
  .p .b{padding:6px 8px;overflow:auto}
  .c12{grid-column:span 12}.c8{grid-column:span 8}.c6{grid-column:span 6}.c4{grid-column:span 4}.c3{grid-column:span 3}
  @media(max-width:1100px){.c3,.c4{grid-column:span 6}.c8{grid-column:span 12}}
  @media(max-width:700px){.c3,.c4,.c6,.c8{grid-column:span 12}.tabs button{padding:4px 7px}}
  table{border-collapse:collapse;width:100%;white-space:nowrap}
  th{color:var(--muted);text-align:right;font-weight:400;padding:2px 6px;border-bottom:1px solid var(--line);letter-spacing:.05em}
  td{padding:2px 6px;text-align:right;border-bottom:1px solid #141414}
  th:first-child,td:first-child,th.l,td.l{text-align:left}
  tr:hover td{background:#141414}
  .up{color:var(--up)}.dn{color:var(--dn)}.mu{color:var(--muted)}.am{color:var(--amber)}
  .kv{display:grid;grid-template-columns:auto 1fr;gap:2px 12px}
  .kv div:nth-child(odd){color:var(--muted)}
  .bar{height:6px;background:#1c1c1c;position:relative;margin:2px 0 6px}
  .bar i{position:absolute;left:0;top:0;bottom:0;background:var(--amber)}
  .tag{display:inline-block;padding:0 5px;border:1px solid var(--amber-dim);color:var(--amber);font-size:10.5px;margin-right:4px}
  .tag.g{border-color:#1f6b33;color:var(--up)}.tag.r{border-color:#7a2020;color:var(--dn)}.tag.b{border-color:#2a4f7a;color:var(--blue)}
  pre{margin:0;white-space:pre-wrap;color:#d0d0d0;font:inherit}
  .err{background:#2a0e0e;color:#ffb3b3;border:1px solid #5a1a1a;padding:6px 8px;margin:8px}
  .spark{display:flex;align-items:flex-end;gap:1px;height:34px}
  .spark i{flex:1;background:var(--amber-dim)}.spark i.last{background:var(--amber)}
  .load{padding:40px;text-align:center;color:var(--muted);letter-spacing:.2em}
  .md{padding:10px 14px;max-width:1200px}
  .md table{white-space:normal}
  .md h1,.md h2{color:var(--amber);letter-spacing:.08em;font-size:13px;margin:14px 0 6px}
  td.sym{cursor:pointer;text-decoration:underline dotted}
  .drawer{position:fixed;top:0;right:0;bottom:0;width:min(980px,100vw);background:#070707;border-left:1px solid var(--amber-dim);z-index:20;overflow:auto;box-shadow:-10px 0 30px #000;display:none}
  .drawer.on{display:block}
  .drawer .hd{position:sticky;top:0;z-index:3;background:#111;border-bottom:1px solid var(--line);padding:8px 12px;display:flex;gap:14px;align-items:baseline}
  .drawer .hd b{color:var(--amber);font-size:15px;letter-spacing:.06em}
  .drawer .hd .x{margin-left:auto;cursor:pointer;color:var(--muted);border:1px solid var(--line);padding:2px 8px}
  .drawer .grid{padding:8px}
  canvas{display:block;width:100%;height:260px;background:#050505}
  .sc{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
  .sc div.k{border:1px solid var(--line);padding:6px 8px}
  .sc .t{letter-spacing:.1em;font-size:11px;margin-bottom:4px}
  .backdrop{position:fixed;inset:0;background:#0008;z-index:19;display:none}.backdrop.on{display:block}
.ctab{margin-left:8px}.ctab button{background:none;border:1px solid var(--line);color:var(--muted);font:inherit;font-size:11px;padding:1px 8px;margin-left:4px;cursor:pointer}.ctab button.on{color:var(--amber);border-color:var(--amber)}
.lvbar{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;margin-bottom:6px}.lvbar i{font-style:normal;color:var(--muted)}
.nvtab{margin:0 0 6px 0}.live .nv{width:100%;max-width:700px;background:#fff;display:block}
.live iframe{width:100%;height:440px;border:0;display:block}.live .lk{margin-top:6px;font-size:12px}.live .lk a{color:var(--blue);margin-right:12px}
.rq{width:100%;max-width:420px;background:#050505;border:1px solid var(--line);color:var(--txt);font:inherit;padding:5px 8px;margin-bottom:8px}
tr.sub{display:none}tr.sub.on{display:table-row}tr.sub td{font-size:12px;line-height:1.7;padding-bottom:8px;text-align:left}td.tg{cursor:pointer;color:var(--amber);width:14px}
details.sec{margin-bottom:10px}details.sec summary{cursor:pointer;padding:4px 0;border-bottom:1px solid var(--line);margin-bottom:4px}
.rp{padding:4px 0;border-bottom:1px dashed #1c1c1c}.rp .sm{color:#bdbdbd;font-size:12px;line-height:1.6;margin:2px 0 2px 12px}
tr.sub td,.rp,.rp *,.sm,.sm *{white-space:normal!important;word-break:keep-all;overflow-wrap:anywhere}.rp{max-width:1100px}
.an{margin-left:6px;color:#ddd}.an i{font-style:normal;color:var(--muted);font-size:11px;margin-left:6px}
.tone{font-size:11px;border:1px solid currentColor;padding:0 5px;margin-left:4px;border-radius:2px}.tone i{font-style:normal;opacity:.8}
.rp .sm .k{display:inline-block;min-width:34px;color:var(--amber);font-size:11px;margin-right:6px}.rp .sm ul{margin:2px 0 2px 40px;padding:0}.rp .sm li{margin:0}
td.mac{cursor:pointer;text-decoration:underline dotted}
.simt td,.simt th{padding:3px 8px}
.bv{font-size:14px;margin-bottom:2px}.bv b{font-size:16px;margin-right:4px}
.bg{display:flex;align-items:center;gap:6px;margin:4px 0}.bg .bl{width:84px;color:var(--muted);font-size:12px}.bg b{width:64px;text-align:right;font-size:12px}
.bg .bt{position:relative;flex:1;height:8px;background:#151515}.bg .bt i{position:absolute;left:0;top:0;bottom:0}.bg .bt u{position:absolute;top:-2px;bottom:-2px;width:1px;background:#555}
.bg .bt i.up,.bg .bs i.up{background:var(--up)}.bg .bt i.dn,.bg .bs i.dn{background:var(--dn)}.bg .bt i.am{background:var(--amber)}
.bg .bs{flex:1;height:8px;display:flex;background:#151515}.bg .bs i{display:block;height:100%}
.bsv{width:100%;height:46px;display:block}.bsv .pl{fill:none;stroke:var(--amber);stroke-width:1.5}.bsv .g60{stroke:var(--up);stroke-dasharray:3 3;opacity:.6}.bsv .g40{stroke:var(--dn);stroke-dasharray:3 3;opacity:.6}.bsv .pd{fill:var(--amber)}
.tg{font-size:13px;line-height:1.6}
.rp .rt{margin:2px 0 2px 12px;font-size:12px}
.srch{position:relative;margin-left:16px}.srch input{width:260px;background:#050505;border:1px solid var(--line);color:var(--txt);font:inherit;font-size:12px;padding:4px 8px}
.srch input:focus{outline:none;border-color:var(--amber)}#sres{position:absolute;top:100%;left:0;right:0;background:#0b0b0b;border:1px solid var(--line);z-index:50;display:none;max-height:360px;overflow:auto}
#sres div{padding:4px 8px;cursor:pointer;font-size:12px}#sres div.on,#sres div:hover{background:#1a1a1a;color:var(--amber)}#sres i{font-style:normal;color:var(--muted);margin-left:6px}
@media (max-width:760px){.srch input{width:150px}}
/* ── 모바일 ── */
html,body{overflow-x:hidden}
.clock,#gen{white-space:nowrap}
@media (max-width:700px){
  html,body{font-size:13.5px;line-height:1.55}
  .top{flex-wrap:wrap;gap:6px 10px;padding:6px 10px}
  .brand{font-size:13px;letter-spacing:.06em}
  .clock{font-size:11.5px}
  #gen{display:none}
  .srch{order:3;margin-left:0;flex:1 1 100%}.srch input{width:100%;font-size:15px;padding:7px 10px}
  .tabs{order:4;flex:1 1 100%;margin-left:0;overflow-x:auto;flex-wrap:nowrap;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding-bottom:2px}
  .tabs::-webkit-scrollbar{display:none}
  .tabs button{flex:0 0 auto;padding:7px 11px;font-size:12.5px}
  .tape .ti{padding:0 12px;font-size:13px}
  .grid{gap:8px;padding:6px}
  .p h2{font-size:12px;padding:7px 9px;flex-wrap:wrap;gap:2px 8px}
  .p .b{padding:8px 9px}
  th,td{padding:4px 7px;font-size:12.5px}
  .drawer{width:100vw;border-left:0}
  .drawer .hd{flex-wrap:wrap;gap:4px 10px;padding:8px 10px}
  .drawer .hd b{font-size:15px}
  .drawer .hd #dr-s{font-size:12px;flex:1 1 100%;order:3}
  .drawer .grid{padding:6px}
  .drawer .p{grid-column:span 12!important}
  canvas{height:220px}
  .sc{grid-template-columns:1fr}
  .kv{gap:3px 10px}
  td.l.mu{white-space:normal;min-width:180px}
  .md{padding:8px 10px}
  .bg .bl{width:72px}
  .live iframe{height:360px}
}
</style>
</head>
<body>
<div class="top">
  <span class="brand">MARKET TERMINAL</span>
  <span class="clock" id="clock">—</span>
  <span class="mu" id="gen"></span>
  <div class="srch"><input id="sq" placeholder="종목·티커 검색 (예: 삼성전자, 005930, NVDA)" autocomplete="off"><div id="sres"></div></div>
  <div class="tabs">
    <button class="on" data-v="home">HOME</button>
    <button data-v="kr">KR</button>
    <button data-v="us">US</button>
    <button data-v="daily">DAILY</button><button data-v="rep">RESEARCH</button><button data-v="dart">DART</button><button data-v="mom">MOMENTUM</button><button data-v="pf">PORTFOLIO</button>
    <button data-v="brief">BRIEFS</button>
    <button data-v="mdkr">KR FULL</button>
    <button data-v="mdus">US FULL</button>
  </div>
</div>
<div class="tape" id="tape"></div>
<div id="root"><div class="load">LOADING …</div></div>
<div class="backdrop" id="bd"></div>
<div class="drawer" id="dr"><div class="hd"><b id="dr-t">—</b><span id="dr-s" class="mu"></span><span class="x" id="dr-x">ESC ✕</span></div><div id="dr-b"></div></div>

<script>
const CLS={TREND_LONG:'추세상승',TREND_OVEREXTENDED:'추세과열',PULLBACK_IN_UPTREND:'눌림',COUNTERTREND_BOUNCE:'역추세반등',TREND_SHORT:'추세하락',NEUTRAL:'중립',OVEREXTENDED:'과열'};
const SEC=[['TREND_LONG','TREND LONG'],['PULLBACK_IN_UPTREND','PULLBACK IN UPTREND'],['COUNTERTREND_BOUNCE','COUNTERTREND BOUNCE'],['OVEREXTENDED','OVEREXTENDED / RISK≥60'],['TREND_SHORT','TREND SHORT']];
let D=null, view='home';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const pct=(x,d=1)=>x==null?'':`<span class="${x>0?'up':x<0?'dn':'mu'}">${(x*100).toFixed(d)>0?'+':''}${(x*100).toFixed(d)}%</span>`;
const num=(x,d=0)=>x==null?'':Number(x).toLocaleString(undefined,{maximumFractionDigits:d,minimumFractionDigits:d});
const n0=x=>x==null?'':Math.round(x);
function tick(){const t=new Date();$('#clock').textContent=t.toLocaleString('ko-KR',{timeZone:'Asia/Seoul',hour12:false});}
setInterval(tick,1000);tick();

function sigTable(rows,market){
  if(!rows||!rows.length) return '<div class="mu">—</div>';
  const kr=market==='KR';
  return `<table><tr><th class="l">SYM</th><th class="l">NAME</th><th>PX</th><th>1D</th><th>20D</th><th>T</th><th>M</th><th>RISK</th><th>ADX</th><th>RSI</th><th>52H</th><th>VOL×</th><th class="l">CLS</th></tr>`+
  rows.map(r=>`<tr><td class="l am sym" data-sym="${esc(r.symbol)}" data-mk="${market}">${esc(r.symbol)}</td><td class="l">${esc(r.name).slice(0,16)}</td><td>${num(r.close,kr?0:2)}</td><td>${pct(r.ret1)}</td><td>${pct(r.ret20)}</td><td class="am">${n0(r.trend_score)}</td><td>${n0(r.momentum_score)}</td><td class="${r.reversal_risk>=60?'dn':''}">${n0(r.reversal_risk)}</td><td>${n0(r.adx14)}</td><td>${n0(r.rsi14)}</td><td>${pct(r.from_high52,0)}</td><td class="${r.vol_ratio>=3?'am':''}">${(r.vol_ratio??0).toFixed(1)}</td><td class="l mu">${CLS[r.class]||r.class||''}</td></tr>`).join('')+'</table>';
}
function breadthPanel(mk){
  const b=(D.breadth||[]).filter(x=>x.market===mk);
  if(!b.length) return `<div class="mu">—</div>`;
  const L=b[b.length-1], P=b.length>20?b[b.length-21]:b[0];
  const p200=L.pct_above200??0, p50=L.pct_above50??0, p20=L.pct_above20??0, d200=(p200-(P.pct_above200??p200))*100;
  // 판정: 200일선 위 비율(장기 체력) × 20일선 위 비율(단기 흐름)
  const lvl=p200>=0.6?'강세':p200>=0.4?'중립':'약세', cls=p200>=0.6?'up':p200>=0.4?'am':'dn';
  const shortv=p20>=0.6?'단기 매수세 우위':p20<=0.3?'단기 투매 구간':'단기 혼조';
  const trend=b.length<6?'추이 데이터 쌓는 중':Math.abs(d200)<3?'20일 전과 비슷':d200>0?`20일 전보다 +${d200.toFixed(0)}%p 개선`:`20일 전보다 ${d200.toFixed(0)}%p 악화`;
  const verdict=`<div class="bv ${cls}"><b>${lvl}</b> 체력 · ${shortv}</div><div class="mu" style="margin-bottom:6px">200일선 위 ${Math.round(p200*100)}% (${trend}) · ${L.date} · ${L.n}종목</div>`;
  const gauge=(l,v)=>{const c=v>=0.6?'up':v>=0.4?'am':'dn'; return `<div class="bg"><span class="bl">${l}</span><span class="bt"><i class="${c}" style="width:${(v*100).toFixed(0)}%"></i><u style="left:40%"></u><u style="left:60%"></u></span><b class="${c}">${Math.round(v*100)}%</b></div>`;};
  const split=(l,a,d)=>{const t=(a+d)||1, pa=a/t*100; return `<div class="bg"><span class="bl">${l}</span><span class="bs"><i class="up" style="width:${pa.toFixed(0)}%"></i><i class="dn" style="width:${(100-pa).toFixed(0)}%"></i></span><b><span class="up">${a}</span>/<span class="dn">${d}</span></b></div>`;};
  // 30일 추이: 200일선 위 비율 선 + 40/60 기준선
  const s=b.slice(-30), w=220, h=46, X=i=>i*(w-4)/Math.max(s.length-1,1)+2, Y=v=>h-2-(v||0)*(h-4);
  const pts=s.map((x,i)=>`${X(i).toFixed(1)},${Y(x.pct_above200).toFixed(1)}`).join(' ');
  const svg=`<svg viewBox="0 0 ${w} ${h}" class="bsv" preserveAspectRatio="none"><line x1="0" x2="${w}" y1="${Y(.6)}" y2="${Y(.6)}" class="g60"/><line x1="0" x2="${w}" y1="${Y(.4)}" y2="${Y(.4)}" class="g40"/><polyline points="${pts}" class="pl"/><circle cx="${X(s.length-1)}" cy="${Y(p200)}" r="2.5" class="pd"/></svg>`;
  return `${verdict}${gauge('20일선 위',p20)}${gauge('50일선 위',p50)}${gauge('200일선 위',p200)}${split('상승/하락',L.adv,L.dec)}${split('신고가/신저가',L.new_high52,L.new_low52)}
   ${s.length>=5?`<div class="mu" style="margin-top:6px">200일선 위 비율 · 최근 ${s.length}거래일 (점선 40% / 60%)</div>${svg}`:`<div class="mu" style="margin-top:6px">추이 그래프는 5거래일 이상 쌓이면 표시</div>`}`;
}
function macroPanel(mk){
  const m=(D.state||{})['macro_'+mk]; if(!m||!m.value||!m.value.length) return '<div class="mu">—</div>';
  const reg=(D.state||{})['regime_'+mk];
  return `<table><tr><th class="l">KEY</th><th>LAST</th><th>1D</th><th>20D</th><th>vs50D</th><th class="l">REG</th></tr>`+m.value.map(d=>`<tr><td class="l am mac" data-key="${esc(d.key)}">${d.key}</td><td>${num(d.last,2)}</td><td>${pct(d.chg1)}</td><td>${pct(d.chg20)}</td><td>${pct(d.vs_sma50)}</td><td class="l mu">${d.regime}</td></tr>`).join('')+`</table>`+(reg&&reg.value?`<div class="mu" style="margin-top:4px">${esc(reg.value)}</div>`:'');
}
function tgHtml(v){  // 텔레그램 HTML(b·i·a)만 살리고 나머지는 이스케이프
  let t=esc(String(v));
  t=t.replace(/&lt;(\/?)(b|i)&gt;/g,'<$1$2>').replace(/&lt;a href=&quot;(https?:[^&]*?)&quot;&gt;([\s\S]*?)&lt;\/a&gt;/g,'<a href="$1" target="_blank">$2</a>');
  return t.replace(/([+-]\d[\d,]*\.?\d*(?:%|억|조))/g,m=>`<span class="${m[0]==='+'?'up':'dn'}">${m}</span>`).replace(/\n/g,'<br>');
}
function intradayPanel(){
  const s=(D.state||{})['intraday_snapshot']; if(!s||!s.value) return '';
  const v=s.value, f=v.flows||{}, sn=v.snap||{};
  const row=m=>{const x=f[m]||{}, q=sn[m]||{}; if(!Object.keys(x).length&&!Object.keys(q).length) return '';
    const tot=(q.up||0)+(q.down||0);
    return `<tr><td class="l am">${m}</td><td>${sgn(x['외국인'])}</td><td>${sgn(x['기관'])}</td><td>${sgn(x['개인'])}</td><td>${sgn(q.prog_total)}</td><td>${q.up!=null?`<span class="up">${q.up}</span>/<span class="dn">${q.down}</span>`:'—'}</td><td>${tot?`<span class="${q.down/tot>0.6?'dn':q.up/tot>0.6?'up':'am'}">${Math.round(q.down/tot*100)}%</span>`:'—'}</td></tr>`;};
  const top=(sn.KOSPI&&sn.KOSPI.top)||[];
  return `<div class="p c12"><h2>INTRADAY KR<small>${s.at} · 잠정 · 억원</small></h2><div class="b">
   <table><tr><th class="l">시장</th><th>외국인</th><th>기관</th><th>개인</th><th>프로그램</th><th>상승/하락</th><th>하락비율</th></tr>${row('KOSPI')}${row('KOSDAQ')}</table>

   <div class="p c4"><h2>TECHNICALS</h2><div class="b">${kv({'TREND / MOM':`<span class="am">${n0(st.trend_score)}</span> / ${n0(st.momentum_score)}`,'REV RISK':`<span class="${st.reversal_risk>=60?'dn':''}">${n0(st.reversal_risk)}</span>`,'ADX / RSI':`${n0(st.adx14)} / ${n0(st.rsi14)}`,'CCI / STOCH':`${n0(st.cci20)} / ${n0(st.stoch_k)}`,'MACD':`${num(st.macd,2)} vs ${num(st.macd_sig,2)}`,'5D / 20D / 60D':`${pct(st.ret5)} ${pct(st.ret20)} ${pct(st.ret60)}`,'SMA 20/50/200':`${lvl(st.sma20)} / ${lvl(st.sma50)} / ${lvl(st.sma200)}`,'52W HI / LO':`${lvl(st.high52)} / ${lvl(st.low52)} (${pct(st.from_high52,0)})`,'VOL×20D':`${(st.vol_ratio??0).toFixed(1)}`,'DIST SMA20':`${(st.dist_sma20_atr??0).toFixed(1)} ATR`,'ATR14':lvl(st.atr14),'PSAR':lvl(st.psar)})}</div></div>
   <div class="p c4"><h2>RESEARCH<small>${rs.n30||0}건 · ${rs.brokers30||0}사 / 30D</small></h2><div class="b">${kv({'CONSENSUS TP':rs.consensus_tp?`${lvl(rs.consensus_tp)} (${pct(rs.tp_upside,0)})`:'—'})}${(rs.items||[]).length?`<div style="margin-top:6px;max-height:340px;overflow:auto">${rs.items.map(repLine).join('')}</div>`:'<div class="mu" style="margin-top:6px">최근 6개월 리포트 없음</div>'}</div></div>
   <div class="p c4"><h2>FLOWS 10D<small>억원 · 확정치</small></h2><div class="b">${(s.flows||[]).length?`<table><tr><th class="l">D</th><th>외국인</th><th>기관</th><th>개인</th></tr>${[...s.flows].reverse().map(f=>`<tr><td class="l mu">${f.date}</td><td>${sgn(f['외국인'])}</td><td>${sgn(f['기관'])}</td><td>${sgn(f['개인'])}</td></tr>`).join('')}</table><div class="am" style="margin-top:4px">${esc(s.flow_note)}</div>`:'<div class="mu">'+(kr?'수급 데이터 없음':'미국은 주체별 수급 미공개')+'</div>'}</div></div>
   <div class="p c12"><h2>TREND SIMULATION<small>${s.sim&&s.sim.days?`최근 ${s.sim.days}거래일(${s.sim.from}~) · 종가 체결 · 왕복비용 ${(s.sim.cost*100).toFixed(2)}% 가정 · 과거 성과, 예측 아님`:''}</small></h2><div class="b">${simTable(s.sim)}</div></div>
   ${kr?`<div class="p c12"><h2>EARNINGS DRIVERS<small>이익이 유지될까 · 공급망·매크로·애널리스트·뉴스·공시</small></h2><div class="b">${drvPanel(s.drivers,s.valuation)}</div></div>`:''}
   ${kr?`<div class="p c12"><h2>VALUATION<small>3개 시나리오 · 범위로 볼 것, 점 추정 아님</small></h2><div class="b">${valPanel(s.valuation,s.close)}</div></div>`:''}
   <div class="p c12"><h2>FINANCIALS<small>${kr?'DART':'SEC EDGAR'} · 단독 분기 · ${s.financials?.unit||(kr?'억원':'$M')}</small></h2><div class="b">${finTable(s.financials,kr)}</div></div>
   <div class="p c12"><h2>DISCLOSURES<small>DART · 최근 180일 주요 공시</small></h2><div class="b">${(s.disclosures||[]).length?discTable(s.disclosures,false):'<div class="mu">'+(kr?'최근 주요 공시 없음 (또는 DART 키 미설정)':'미국 종목은 DART 대상 아님')+'</div>'}</div></div>
   <div class="p c12"><h2>SCENARIOS<small>규칙 기반 · 예측 아님</small></h2><div class="b"><div class="sc">
     <div class="k"><div class="t up">▲ BULL</div><div>${esc(sc.bull?.trigger||'')}</div><div>목표 <b class="am">${lvl(sc.bull?.target)}</b> (${sc.bull?.upside!=null?(sc.bull.upside>0?'+':'')+sc.bull.upside.toFixed(1)+'%':'—'}) <span class="mu">${esc(sc.bull?.note||'')}</span></div></div>
     <div class="k"><div class="t">■ BASE</div><div>${esc(sc.base?.note||'')}</div></div>
     <div class="k"><div class="t dn">▼ BEAR</div><div>${esc(sc.bear?.trigger||'')}</div><div>손절 <b class="am">${lvl(sc.bear?.stop)}</b> (${sc.bear?.loss!=null?sc.bear.loss.toFixed(1)+'%':'—'}) → 다음 ${lvl(sc.bear?.next)} <span class="mu">${esc(sc.bear?.note||'')}</span></div>${sc.bear?.trail?`<div>추적손절(PSAR) <b class="am">${lvl(sc.bear.trail)}</b> (${sc.bear.trail_loss?.toFixed(1)}%)</div>`:''}</div>
   </div><div style="margin-top:6px">손익비 20일저점 기준 <b class="${sc.rr>=2?'up':sc.rr<1?'dn':'am'}">${sc.rr??'—'}</b>${sc.rr_trail!=null?` · PSAR 기준 <b class="${sc.rr_trail>=2?'up':sc.rr_trail<1?'dn':'am'}">${sc.rr_trail}</b>`:''} <span class="mu">— ${esc(sc.rr_note||'')}</span></div></div></div>
   <div class="p c6"><h2>STOCK VIEW</h2><div class="b">${esc(s.comment?.stock||'—')}</div></div>
   <div class="p c6"><h2>MACRO VIEW</h2><div class="b">${esc(s.comment?.macro||'—')}</div></div>
  </div>`;
  $('#dr-b').innerHTML=h; drawChart(s.chart||[],sc,rs,kr);
  document.querySelectorAll('.ctab button').forEach(bt=>bt.onclick=()=>{
    document.querySelectorAll('.ctab button').forEach(z=>z.classList.toggle('on',z===bt));
    if(bt.dataset.c==='live'){ $('#chb').innerHTML=liveChart(sym,s.market,kr,sc,rs,s.close); $('#ch-note').textContent=kr?'네이버 금융 · 일봉 캔들(오늘 봉 포함) / 장중 흐름 · 1분 갱신':'TradingView · 5분봉 · 왼쪽 도구로 수평선 그리기 가능'; }
    else { $('#chb').innerHTML='<canvas id="cv" width="960" height="260"></canvas>'; $('#ch-note').textContent='SMA20 · SMA50 · 20D box · TP'; drawChart(s.chart||[],sc,rs,kr); }
  });
}
function tvSym(sym,market,kr){ if(kr) return 'KRX:'+sym; const m=String(market||'').toUpperCase(); return ['NASDAQ','NYSE','AMEX'].includes(m)?m+':'+sym:sym; }
function liveChart(sym,market,kr,sc,rs,close){
  const t=tvSym(sym,market,kr);
  const src='https://s.tradingview.com/widgetembed/?symbol='+encodeURIComponent(t)+'&interval=5&theme=dark&style=1&locale=kr&timezone=Asia%2FSeoul&hidesidetoolbar=0&symboledit=0&saveimage=0&withdateranges=1';
  const links=[`<a href="https://www.tradingview.com/chart/?symbol=${encodeURIComponent(t)}" target="_blank">TradingView에서 열기</a>`];
  if(kr) links.push(`<a href="https://finance.naver.com/item/main.naver?code=${encodeURIComponent(sym)}" target="_blank">네이버 실시간 시세</a>`);
  else links.push(`<a href="https://finance.yahoo.com/quote/${encodeURIComponent(sym)}" target="_blank">Yahoo 시세</a>`);
  const lv=[['TP',rs?.consensus_tp,'#35d6e6'],['BULL',sc?.bull?.target,'#2fd05a'],['STOP',sc?.bear?.stop,'#ff4b4b'],['PSAR',sc?.bear?.trail,'#ff9a1f']].filter(x=>x[1]);
  const bar=lv.length?`<div class="lvbar">${lv.map(([k,v,c])=>`<span style="color:${c}">${k} <b>${num(v,kr?0:2)}</b>${close?` <i>${((v/close-1)*100>0?'+':'')}${((v/close-1)*100).toFixed(1)}%</i>`:''}</span>`).join('')}<span class="mu">· 종가 ${num(close,kr?0:2)} 기준</span></div>`:'';
  if(kr){
    window._nvType=window._nvType||'candle/day';
    const img=()=>`https://ssl.pstatic.net/imgfinance/chart/item/${window._nvType}/${encodeURIComponent(sym)}.png?t=${Date.now()}`;
    window._nvImg=img;
    clearInterval(window._liveT);
    window._liveT=setInterval(()=>{const el=document.getElementById('nvimg'); if(!el){clearInterval(window._liveT);return;} el.src=img();},60000);
    const tb=[['candle/day','일봉 캔들'],['area/day','장중 흐름']].map(([t,l])=>`<button data-nv="${t}" class="${window._nvType===t?'on':''}" onclick="window._nvType=this.dataset.nv;document.querySelectorAll('[data-nv]').forEach(z=>z.classList.toggle('on',z===this));const el=document.getElementById('nvimg');if(el)el.src=window._nvImg()">${l}</button>`).join('');
    return `${bar}<div class="live"><div class="ctab nvtab">${tb}</div><img id="nvimg" class="nv" src="${img()}" alt="네이버 장중 차트" onerror="this.outerHTML='<div class=&quot;mu&quot;>네이버 차트를 불러오지 못했습니다. 아래 링크로 보세요.</div>'"><div class="lk">${links.join('')}<span class="mu">네이버 금융 차트 · 1분마다 갱신</span></div></div>`;
  }
  return `${bar}<div class="live"><iframe src="${src}" loading="lazy" allowfullscreen></iframe><div class="lk">${links.join('')}<span class="mu">차트가 비어 있으면 위 링크로 보세요</span></div></div>`;
}
function sgn(v){return v==null?'—':`<span class="${v>0?'up':v<0?'dn':'mu'}">${v>0?'+':''}${v.toFixed(0)}</span>`;}
function drawChart(ch,sc,rs,kr){
  const cv=$('#cv'); if(!cv||!ch.length) return; const W=cv.width=cv.clientWidth*2,H=cv.height=520; const x=cv.getContext('2d'); x.scale(1,1);
  const padL=70,padR=16,padT=12,padB=70,vh=90; const n=ch.length; const cw=(W-padL-padR)/n;
  const lv=[sc.bull?.target,sc.bear?.stop,rs.consensus_tp].filter(v=>v);
  let lo=Math.min(...ch.map(c=>c.l),...lv),hi=Math.max(...ch.map(c=>c.h),...lv); const pad=(hi-lo)*0.06; lo-=pad;hi+=pad;
  const Y=v=>padT+(hi-v)/(hi-lo)*(H-padT-padB-vh); const vmax=Math.max(...ch.map(c=>c.v))||1;
  x.fillStyle='#050505';x.fillRect(0,0,W,H);
  x.strokeStyle='#1c1c1c';x.lineWidth=1;x.font='20px monospace';x.fillStyle='#777';
  for(let i=0;i<=4;i++){const v=lo+(hi-lo)*i/4,y=Y(v);x.beginPath();x.moveTo(padL,y);x.lineTo(W-padR,y);x.stroke();x.fillText(v.toLocaleString(undefined,{maximumFractionDigits:kr?0:2}),4,y+7);}
  const line=(key,col)=>{x.strokeStyle=col;x.lineWidth=2;x.beginPath();let s=false;ch.forEach((c,i)=>{if(c[key]==null)return;const px=padL+cw*i+cw/2,py=Y(c[key]);s?x.lineTo(px,py):x.moveTo(px,py);s=true;});x.stroke();};
  line('s20','#4aa3ff');line('s50','#c77dff');
  const hline=(v,col,lab)=>{if(!v)return;const y=Y(v);x.setLineDash([8,6]);x.strokeStyle=col;x.lineWidth=2;x.beginPath();x.moveTo(padL,y);x.lineTo(W-padR,y);x.stroke();x.setLineDash([]);x.fillStyle=col;x.fillText(lab,W-padR-x.measureText(lab).width,y-6);};
  hline(rs.consensus_tp,'#35d6e6','TP '+num(rs.consensus_tp)); hline(sc.bull?.target,'#2fd05a','BULL '+num(sc.bull?.target)); hline(sc.bear?.stop,'#ff4b4b','STOP '+num(sc.bear?.stop)); if(sc.bear?.trail) hline(sc.bear.trail,'#ff9a1f','PSAR');
  ch.forEach((c,i)=>{const px=padL+cw*i+cw/2;const up=c.c>=c.o;x.strokeStyle=x.fillStyle=up?'#ff4b4b':'#4aa3ff'; if(!kr){x.strokeStyle=x.fillStyle=up?'#2fd05a':'#ff4b4b';}
    x.lineWidth=2;x.beginPath();x.moveTo(px,Y(c.h));x.lineTo(px,Y(c.l));x.stroke();const yo=Y(c.o),yc=Y(c.c);x.fillRect(px-cw*0.3,Math.min(yo,yc),cw*0.6,Math.max(2,Math.abs(yc-yo)));
    const vb=H-padB-(c.v/vmax)*vh*0.95; x.fillStyle=up?'#5a2020':'#1f3a5a'; x.fillRect(px-cw*0.3,vb,cw*0.6,H-padB-vb);
    if(i%10===0){x.fillStyle='#777';x.fillText(c.d,px-20,H-padB+26);} });
}

document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('on'));b.classList.add('on');view=b.dataset.v;render();});
function load(){
  google.script.run.withSuccessHandler(d=>{D=d;render();}).withFailureHandler(e=>{$('#root').innerHTML=`<div class="err">LOAD FAILED: ${esc(e.message)}</div>`;}).getData();
}
load(); loadLive(); setInterval(load, 5*60*1000); setInterval(loadLive, 60*1000);
</script>
