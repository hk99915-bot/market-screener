<!-- tab_home.html — HOME 탭 — 캘린더·이벤트·미장 운용회의 요약·MY 요약 (homeView).
     apps-script/Index.html 이 include('tab_home') 템플릿 태그로 끼워 넣는다 (GAS 는 HtmlService include, Pages 는 scripts/build_pages.py 가 인라인).
     전역 도우미($·esc·num·pct·render·setView·openDetail 등)는 Index.html 에 있다. -->
<script>
function homeMyStub(){ return myLoad()?'<div class="mu">불러오는 중…</div>':'<div class="mu">MY 탭에 보유 종목을 입력하면 여기에 요약이 나옵니다.</div>'; }
// 원장 대조 한 줄 (MY 탭 '브라우저 주 + 원장 대조'): 토큰으로 받은 holdings.txt 와 브라우저 값이 다르면 알림 — 값은 덮지 않음
function homeLedgerLine(){ if(typeof MYLEDGER==='undefined'||MYLEDGER===null) return ''; const n=myDiff(myLoad(),MYLEDGER).n;
  return n?`<div class="am" style="font-size:var(--fs-1);margin-top:4px;cursor:pointer" onclick="setView('my')">⚠ 원장(holdings.txt)과 다름 ${n}줄 — MY 탭에서 확인 (자동으로 덮지 않음)</div>`:''; }
function homeMyFill(){
  if(ghTok()&&!MYSYNCED){ MYSYNCED=true; mySync(ok=>{ if(ok) homeMyFill(); }); }
  const box=$('#homemy'); if(!box||!myLoad()) return;
  loadIndex(()=>{ const all=myParse(myLoad()), hs=all.filter(h=>h.key).map(h=>({...h,r:myResolve(h.key)})).filter(h=>h.r), cash=all.filter(h=>h.cash);
    const fin=()=>{ const FXs=cl((MYX||{}).USDKRW), ks=Object.keys(FXs).sort(), FX=FXs[ks[ks.length-1]]||1400;
      let tot=0,cost=0,day=0; const rows=[];
      for(const h of hs){ const d=MYD[h.r.m+':'+h.r.s]; if(!d) continue; const fx=h.r.m==='US'?FX:1, v=d.close*h.qty*fx, c=h.avg?h.avg*h.qty*fx:null, r1=(d.stats||{}).ret1;
        tot+=v; if(c) cost+=c; if(r1!=null) day+=v-v/(1+r1); rows.push({h,d,v,c,r1,drv:d.etf?((d.etf.look||{}).drv):(d.drivers||{}).score,stop:(d.scenarios&&d.scenarios.bear||{}).stop}); }
      let cK=0,cU=0; for(const c of cash){ if(c.cash==='KRW') cK+=c.amt; else cU+=c.amt*FX; } const NAV=tot+cK+cU;
      // 순자산 0 이면 비중이 NaN% 로 나오던 문제(10/18 겸이 화면) — 무엇을 못 읽었는지 알려 준다
      if(!(NAV>0)){ const keys=all.filter(h=>h.key).length; box.innerHTML=`<div class="am" style="font-size:var(--fs-2)">MY 입력에서 평가액을 계산하지 못했어요 — 종목 줄 ${keys}개 중 인식 ${hs.length}개 · 시세 확인 ${rows.length}개 · 현금 줄 ${cash.length}개. MY 탭에서 입력칸을 확인해 주세요.</div>${homeLedgerLine()}`; return; }
      const W=x=>(x*100).toFixed(0)+'%', K=x=>num(Math.round(x),0), col=x=>x==null?'var(--muted)':x>0.15?'var(--up)':x<-0.15?'var(--dn)':'var(--amber)';
      box.innerHTML=`<div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:6px;font-size:var(--fs-2)"><span>순자산 <b>${K(NAV)}</b></span><span>주식 ${W(tot/NAV)}</span><span>손익 ${cost?pct(tot/cost-1,1):'—'}</span><span>최근일 ${pct(day/(tot-day||1),1)} (${K(day)})</span></div>
       <table><tr><th class="l">종목</th><th>비중</th><th>1D</th><th>손익</th><th>드라이버</th><th>손절선</th></tr>${rows.sort((a,b)=>b.v-a.v).map(r=>`<tr><td class="l am sym" data-sym="${esc(r.h.r.s)}" data-mk="${r.h.r.m}">${esc(shortNm(r.d.name)||r.h.r.s)}${r.d.etf?' <span class="tag">ETF</span>':''}</td><td>${W(r.v/NAV)}</td><td>${pct(r.r1,1)}</td><td>${r.c?pct(r.v/r.c-1,1):'—'}</td><td style="color:${col(r.drv)}">${r.drv!=null?(r.drv>0?'+':'')+r.drv.toFixed(2):'—'}</td><td class="${r.stop&&r.d.close<r.stop?'dn':'mu'}">${r.stop?num(r.stop,r.h.r.m==='KR'?0:2):'—'}</td></tr>`).join('')}</table>
       <div class="mu" style="font-size:var(--fs-1);margin-top:4px">전체 분석(샤프·베타·헷지)은 MY 탭</div>${homeLedgerLine()}`; };
    const go=()=>myFetch(hs.map(h=>[h.r.m,h.r.s]),fin);
    if(MYX===null) google.script.run.withSuccessHandler(t=>{try{MYX=JSON.parse(t).series;}catch(e){MYX={};} go();}).withFailureHandler(()=>{MYX={};go();}).getMacroSeries(); else go(); });
}
let CAL=null;
let CALM=null, CALSEL=null;
function calPanel(){
  if(CAL===null){ CAL=false; google.script.run.withSuccessHandler(t=>{try{CAL=JSON.parse(t);}catch(e){CAL={};} const b=$('#homecal'); if(b) b.innerHTML=calPanel();}).withFailureHandler(()=>{CAL={};}).getCalendar(); return '<div class="load">LOADING …</div>'; }
  if(!CAL||!CAL.events||!CAL.events.length) return '<div class="mu">캘린더 생성 전</div>';
  let mine=new Set(); try{ myParse(myLoad()).filter(h=>h.key).forEach(h=>{const r=SIX&&SIX.length?myResolve(h.key):null; mine.add(r?r.s:h.key.toUpperCase());}); }catch(e){}
  const today=new Date(Date.now()+9*3600e3).toISOString().slice(0,10);
  if(!CALM) CALM=today.slice(0,7);
  const [Y,M]=CALM.split('-').map(Number), first=new Date(Date.UTC(Y,M-1,1)), dim=new Date(Date.UTC(Y,M,0)).getUTCDate(), off=first.getUTCDay();
  const by={}; CAL.events.forEach(e=>{(by[e.date]=by[e.date]||[]).push(e);});
  const mob=window.innerWidth<700;
  const chip=e=>{const my=e.ticker&&mine.has(e.ticker); const col=e.type==='매크로'?'#c77dff':e.type==='만기'?'#ff9a1f':my?'#ffcc33':e.imp>=3?'#35d6e6':'#666';
    return mob?`<span style="display:inline-block;width:6px;height:6px;border-radius:3px;background:${col};margin:1px"></span>`
      :`<div style="font-size:var(--fs-1);line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-left:2px solid ${col};padding-left:3px;margin-top:2px;color:${my?'#ffcc33':'#ccc'}">${my?'📌':''}${esc(e.name.replace(/ 실적$/,''))}${e.type==='실적'?'':''}</div>`;};
  let cells=''; for(let k=0;k<off;k++) cells+='<div></div>';
  const MV=CAL.moves||{}, mc=v=>v==null?'':`<span style="color:${v>0?'var(--up)':v<0?'var(--dn)':'#888'}">${v>0?'+':''}${(v*100).toFixed(mob&&Math.abs(v)>=.1?0:1)}</span>`;
  for(let d=1;d<=dim;d++){ const ds=`${CALM}-${String(d).padStart(2,'0')}`, ev=by[ds]||[], dow=(off+d-1)%7, mv=MV[ds];
    // 폰(칸 폭 ≈41px): 'K+1.9 S+0.2' 한 줄은 11px 에서 S&P 값이 통째로 잘림(UXUI 10/24 R2) → 글자는 그대로, 내용을 두 줄로 나눈다(|등락| ≥10% 는 정수)
    const mvl=mv?(mob?`<div style="font-size:var(--fs-1);letter-spacing:-.02em;line-height:1.2;white-space:nowrap">${mv.KOSPI!=null?'<div>K'+mc(mv.KOSPI)+'</div>':''}${mv.SPX!=null?'<div>S'+mc(mv.SPX)+'</div>':''}</div>`
      :`<div style="font-size:var(--fs-1);letter-spacing:-.02em;line-height:1.2;white-space:nowrap;overflow:hidden">${mv.KOSPI!=null?'코'+mc(mv.KOSPI):''}${mv.SPX!=null?' S&P'+mc(mv.SPX):''}</div>`):'';
    cells+=`<div class="calc" data-d="${ds}" style="min-height:${mob?50:92}px;border:1px solid ${ds===today?'var(--amber)':'var(--line)'};background:${ds===CALSEL?'var(--bg3)':'var(--panel)'};${ds===CALSEL?'outline:2px solid var(--amber);outline-offset:-2px;':''}padding:${mob?'3px 1px':'3px'};cursor:${ev.length||mv?'pointer':'default'};overflow:hidden">
      <div style="font-size:var(--fs-1);color:${dow===0?'#ff6b6b':dow===6?'#6ba8ff':'#999'}">${d}${ev.some(e=>e.imp>=3)?' ⭐':''}${ev.some(e=>e.result)?' ✓':''}</div>${mvl}${ev.slice(0,mob?8:4).map(chip).join('')}${!mob&&ev.length>4?`<div class="mu" style="font-size:var(--fs-1)">+${ev.length-4}</div>`:''}</div>`; }
  const sel=CALSEL&&(by[CALSEL]||MV[CALSEL])?(by[CALSEL]||[]):null, smv=CALSEL?MV[CALSEL]:null;
  setTimeout(()=>{ document.querySelectorAll('.calc').forEach(c=>c.onclick=()=>{ if(!by[c.dataset.d]&&!MV[c.dataset.d]) return; CALSEL=c.dataset.d; $('#homecal').innerHTML=calPanel(); });
    document.querySelectorAll('[data-calm]').forEach(b=>b.onclick=()=>{ const [y,m]=CALM.split('-').map(Number); const n=new Date(Date.UTC(y,m-1+(+b.dataset.calm),1)); CALM=n.toISOString().slice(0,7); CALSEL=null; $('#homecal').innerHTML=calPanel(); }); },0);
  const lst=(sel||CAL.events.filter(e=>e.date>=today).slice(0,6));
  return `<div style="display:flex;align-items:center;gap:8px;margin-bottom:6px"><button class="tag" data-calm="-1">◀</button><b>${Y}년 ${M}월</b><button class="tag" data-calm="1">▶</button>
     <span class="mu" style="font-size:var(--fs-1);margin-left:auto"><span style="color:#35d6e6">■</span>핵심 실적 <span style="color:#ffcc33">■</span>내 보유 <span style="color:#c77dff">■</span>매크로 <span style="color:#ff9a1f">■</span>만기</span></div>
   <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:2px;font-size:var(--fs-1);text-align:left">${['일','월','화','수','목','금','토'].map((w,i)=>`<div class="mu" style="text-align:center;color:${i===0?'#ff6b6b':i===6?'#6ba8ff':''}">${w}</div>`).join('')}${cells}</div>
   <div style="margin-top:8px"><div class="am" style="font-size:var(--fs-2)">${sel?esc(CALSEL)+' 일정':'다가오는 일정'}</div>
   ${smv?`<div style="font-size:var(--fs-2);line-height:1.7">지수: ${[['KOSPI','코스피'],['KOSDAQ','코스닥'],['SPX','S&P500'],['NASDAQ','나스닥']].filter(([k])=>smv[k]!=null).map(([k,n])=>n+' '+mc(smv[k])+'%').join(' · ')}</div>`:''}
   ${lst.map(e=>{const my=e.ticker&&mine.has(e.ticker); return `<div style="font-size:var(--fs-2);line-height:1.6;white-space:normal">${sel?'':`<span class="mu">${esc(e.date.slice(5))}</span> `}${e.imp>=3?'⭐ ':''}${my?'📌 ':''}${e.ticker?`<span class="am sym" data-sym="${esc(e.ticker)}" data-mk="${e.market}">${esc(e.name)}</span>`:esc(e.name)} <span class="mu" style="font-size:var(--fs-1)">${esc(e.note||'')}</span>${(e.result||[]).map(r=>`<div style="font-size:var(--fs-2);padding-left:10px;color:#e8e8e8">→ <b>${esc(r)}</b></div>`).join('')}</div>`;}).join('')}
   ${sel&&!sel.length?'<div class="mu" style="font-size:var(--fs-2)">일정 없음</div>':''}</div>
   <div class="mu" style="font-size:var(--fs-1);margin-top:4px">${esc(CAL.note||'')} · 날짜를 누르면 그날 일정</div>`;
}
let EVS=null;
function evPanel(){
  if(EVS===null){ EVS=false; google.script.run.withSuccessHandler(t=>{try{EVS=JSON.parse(t);}catch(e){EVS={};} const b=$('#homeev'); if(b) b.innerHTML=evPanel();}).withFailureHandler(()=>{EVS={};}).getEvents(); return '<div class="load">LOADING …</div>'; }
  if(!EVS||!EVS.cb) return '<div class="mu">이벤트 통계 생성 전</div>';
  const today=new Date(Date.now()+9*3600e3).toISOString().slice(0,10);
  const recent=(EVS.events||[]).filter(e=>e.date>=new Date(Date.now()+9*3600e3-7*864e5).toISOString().slice(0,10));
  const S=EVS.cb_summary||{}, B=EVS.big_summary||{};
  const sm=(o,lab)=>o.d1?`<div style="font-size:var(--fs-2);margin:2px 0">${lab}: 다음날 평균 ${pct(o.d1.avg,1)} (상승 ${Math.round(o.d1.up*100)}%, ${o.d1.n}회)${o.d5?` · 5일 ${pct(o.d5.avg,1)} (${Math.round(o.d5.up*100)}%)`:''}${o.d20?` · 20일 ${pct(o.d20.avg,1)} (${Math.round(o.d20.up*100)}%)`:''}</div>`:'';
  const tn=(EVS.events||[]).filter(e=>e.date===today).length, ck=(L&&L.events_checked_at)||EVS.checked_at||'';
  const todayLine=ck.slice(0,10)===today
    ?`<div style="font-size:var(--fs-2);margin-bottom:6px"><b>오늘(${esc(today.slice(5))})</b> ${tn?`<span style="color:var(--dn)">이벤트 ${tn}건</span>`:'주요 이벤트 없음 (서킷·사이드카·금리·정책·지정학 등)'} <span class="mu" style="font-size:var(--fs-1)">· ${esc(ck.slice(11))} 확인</span></div>`
    :`<div style="font-size:var(--fs-2);margin-bottom:6px"><b>오늘(${esc(today.slice(5))})</b> <span class="mu">아직 확인 전${ck?` (마지막 확인 ${esc(ck.slice(5))})`:''}</span></div>`;
  return `${todayLine}<details style="margin-bottom:4px"><summary class="mu" style="cursor:pointer;font-size:var(--fs-2)">기록 · 최근 7일 (${recent.length}건)</summary>${recent.length?`<div style="margin-bottom:6px">${recent.slice(0,6).map(e=>`<div style="font-size:var(--fs-2);${e.date===today?'color:var(--dn)':''}">● ${esc(e.date.slice(5))} ${esc(e.time||'')} <b>${esc(e.market)} ${esc(e.type)}</b> ${e.link?`<a href="${esc(e.link)}" target="_blank" rel="noopener">${esc(e.title||'')}</a>`:esc(e.title||'')}</div>`).join('')}</div>`:'<div class="mu" style="margin-bottom:6px">최근 7일 기록된 이벤트 없음</div>'}</details>
   ${sm(S,'서킷브레이커 이후')}${sm(B,'코스피 −5% 이상 급락일 이후')}
   <details style="margin-top:4px"><summary class="mu" style="cursor:pointer;font-size:var(--fs-2)">역대 서킷브레이커 ${EVS.cb.length}회</summary><table><tr><th class="l">날짜</th><th>당일</th><th>다음날</th><th>5일</th><th>20일</th><th>20일내 저점</th><th class="l">메모</th></tr>
   ${[...EVS.cb].reverse().map(r=>`<tr><td class="l">${esc(r.date)}</td><td>${r.day!=null?pct(r.day,1):'—'}</td><td>${r.d1!=null?pct(r.d1,1):'—'}</td><td>${r.d5!=null?pct(r.d5,1):'—'}</td><td>${r.d20!=null?pct(r.d20,1):'—'}</td><td>${r.low20!=null?pct(r.low20,1):'—'}</td><td class="l mu" style="white-space:normal;font-size:var(--fs-1)">${esc(r.note||'')}</td></tr>`).join('')}</table>
   <div class="mu" style="font-size:var(--fs-1)">${esc(EVS.note||'')}</div></details>`;
}
function Utilities_kstHour(){ return new Date(Date.now()+9*3600e3).getUTCHours(); }
function homeCusHtml(){ const o=CMTU; if(!o) return '<div class="mu">불러오는 중…</div>'; if(!o.head) return '<div class="mu">미장 운용회의 없음</div>';
  return `${(o.head||[]).map(x=>`<div>• ${esc(x)}</div>`).join('')}<div style="margin-top:6px" class="am">${esc(o.verdict||'')}</div>`+
    ((o.scenarios||[]).length?`<table style="margin-top:6px">${o.scenarios.map(sc=>`<tr><td class="l">${esc(sc.name)}</td><td>${sc.prob!=null?(sc.prob*100).toFixed(0)+'%':'—'}</td></tr>`).join('')}</table>`:'')+
    `<div class="mu" style="font-size:var(--fs-1);margin-top:4px">${esc(o.asof||'')} · 자세히는 운용회의 탭 US</div>`; }
function homeCusLoad(){ CMTU=false; google.script.run.withSuccessHandler(t=>{try{CMTU=JSON.parse(t);}catch(e){CMTU={};} const e=$('#homecus'); if(e) e.innerHTML=homeCusHtml(); if(view==='cmt') render();}).withFailureHandler(()=>{CMTU={}; if(view==='cmt') render();}).getCommitteeUS(); }
/* HOME 오늘 결론 3칸 (UXUI 재진단 Top10 #7, 10/23 겸이 승인): 첫 화면이 지수 등락·문장 덩어리라 9.5장을 내려야 결론이 보였다.
   ① 시장 국면 = 200일선 위 비율(BREADTH 판정과 같은 기준 60/40%) + 매크로 바람(macro_view.json) ② 오늘 내 할 일 = 대결 제출 대기(마감 전만)·쿨다운·원장 차이 ③ 늦은 데이터 = 신선도 계약(freshness.json).
   새 판단을 만들지 않고 이미 있는 판정만 모은다. */
/* 대결 제출 마감(epoch ms) — screener/duel.py 와 같은 기준: 국장 = 그날 15:30 KST 까지 받음(apply_issue '>1530' 거부 → 15:31:00 전),
   미장 = 그날 09:30 ET 전(us_open_kst·_apply_issue_us 't >= dl' 거부, 서머타임은 America/New_York 으로 계산). */
function duelDeadlineMs(it){ const [y,m,d]=String(it.date||'').split('-').map(Number); if(!y||!m||!d) return NaN;
  if(it.market==='US'){ const h=+new Date(Date.UTC(y,m-1,d,12)).toLocaleString('en-US',{timeZone:'America/New_York',hour:'numeric',hourCycle:'h23'}); return Date.UTC(y,m-1,d,9+(12-h),30); }
  return Date.UTC(y,m-1,d,15-9,31); }
/* '나' 제출 대기 = 채점 전 진입 판 중 '나' pending 이고 아직 제출 마감 전인 판 수 */
function homePendDuel(items,now){ return (items||[]).filter(it=>it.kind!=='ticket'&&it.kind!=='exit'&&!it.result&&it.picks&&it.picks['나']&&it.picks['나'].pending&&now<duelDeadlineMs(it)).length; }
function homeConc(){
  const bv=mk=>{ const b=(D.breadth||[]).filter(x=>x.market===mk), L=b[b.length-1]; if(!L||L.pct_above200==null) return `<span class="mu">${mk} —</span>`;
    const p=L.pct_above200, l=p>=0.6?'강세':p>=0.4?'중립':'약세'; return `<span>${mk} <b class="${p>=0.6?'up':p>=0.4?'am':'dn'}">${l}</b> <span class="mu">${Math.round(p*100)}%</span></span>`; };
  if(MV===null&&typeof macroPanel==='function') macroPanel('KR');   // 매크로 바람 불러오기(도착하면 render)
  const mw=MV&&MV.score!=null?`<div>매크로 바람 <b style="color:${MV.score>0.15?'var(--up)':MV.score<-0.15?'var(--dn)':'var(--amber)'}">${esc(MV.label||'')} (${MV.score>0?'+':''}${Number(MV.score).toFixed(2)})</b></div>`:'<div class="mu">매크로 바람 불러오는 중</div>';
  if(typeof decLoad==='function') decLoad();
  const pend=DEC&&DEC.items?homePendDuel(DEC.items,Date.now()):null;   // 제출 마감 지난 판은 제외(피어 2026-10-24 U2)
  const CD=typeof decCD==='function'?decCD():null;
  const todo=[pend==null?'<div class="mu">대결 불러오는 중</div>':pend?`<div><a href="#" onclick="setView('score');return false" style="display:inline-flex;align-items:center;min-height:44px"><b class="dn">대결 제출 대기 ${pend}</b>&nbsp;→ 성적표에서 제출</a></div>`:'<div class="mu">대결 제출 대기 없음</div>',
    CD?'<div class="dn">⏳ 쿨다운 중 — 새 모의 베팅 금지</div>':'', homeLedgerLine()].join('');
  const n=FR?(FR.late||[]).length+(FR.regress_today||[]).length+(FR.stale_today||[]).length:null;
  const cell=(t,b)=>`<div style="border:1px solid var(--line);padding:6px 9px;min-width:0;line-height:1.6"><div class="am" style="font-size:var(--fs-2);font-weight:700">${t}</div>${b}</div>`;
  return `<div class="p c12" id="homeconc"><h2>오늘 결론<small>이미 있는 판정만 모음 · 매매 지시 아님</small></h2><div class="b" style="white-space:normal;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:6px">
    ${cell('시장 국면',`<div style="display:flex;gap:12px;flex-wrap:wrap">${bv('KR')}${bv('US')}</div>${mw}<div class="mu" style="font-size:var(--fs-1)">200일선 위 종목 비율 60%↑ 강세 · 40%↓ 약세</div>`)}
    ${cell('오늘 내 할 일',todo)}
    ${cell('늦은 데이터',n==null?'<div class="mu">점검 불러오는 중</div>':`<a href="#" onclick="freshPop();return false" style="display:inline-flex;align-items:center;min-height:44px"><b class="${n?'v-bad':'v-ok'}">${n?`⚠ ${n}건`:'0건 · 정상'}</b>&nbsp;${n?'→ 무엇이 늦었나':''}</a>`)}
  </div></div>`;
}
function homeView(){
  const kr=D.kr||{},us=D.us||{};
  const cc=o=>{const c=o.class_counts||{};return `<div class="kv">${Object.entries(c).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div>${CLS[k]||k}</div><div>${v}</div>`).join('')}</div>`;};
  const w=D.watchlist||[];
  const kh=+Utilities_kstHour(), usTime=kh>=21||kh<7;
  // 지난 값(어제 마감·지난 세션 — stInfo.old)은 날짜를 붙여 맨 아래로 (10/21 겸이: 장중에 홈 위쪽 'CLOSE KR'이 어제 마감이었음)
  const B=(k,t)=>({h:pre(k,t),old:!!(stInfo(k)||{}).old}), pick=(L,o)=>L.filter(x=>x.old===o).map(x=>x.h).join('');
  const usL=[B('intraday_us','INTRADAY US'),B('premarket_us','PREMARKET US'),{h:`<div class="p c6"><h2>US COMMITTEE<small>미장 운용회의 요약</small></h2><div class="b" id="homecus">${homeCusHtml()}</div></div>`,old:false}].concat(usTime?[]:[B('close_US','CLOSE US')]);
  const krL=[B('premarket_kr','PREMARKET KR'),B('close_KR','CLOSE KR')].concat(usTime?[B('close_US','CLOSE US')]:[]).concat([B('intraday_kr','INTRADAY KR')]);
  const usBlock=pick(usL,false), oldBlk=pick(krL,true)+pick(usL,true);
  let h=`<div class="grid">${homeConc()}${usTime?usBlock:''}${intradayPanel()}
   <div class="p c3"><h2>KR BREADTH</h2><div class="b">${breadthPanel('KR')}</div></div>
   <div class="p c3"><h2>US BREADTH</h2><div class="b">${breadthPanel('US')}</div></div>
   <div class="p c3"><h2>KR CLASSES<small>${kr.asof||''}</small></h2><div class="b">${cc(kr)}</div></div>
   <div class="p c3"><h2>US CLASSES<small>${us.asof||''}</small></h2><div class="b">${cc(us)}</div></div>
   <div class="p c6"><h2>MY PORTFOLIO<small>MY 탭 입력 기준 · 최근 종가</small></h2><div class="b" id="homemy">${homeMyStub()}</div></div>
   <div class="p c6"><h2>EVENTS<small>서킷브레이커·사이드카 · 이후 코스피</small></h2><div class="b" id="homeev">${evPanel()}</div></div>
   <div class="p c12"><h2>CALENDAR<small>실적·FOMC·CPI·만기 · 📌 = 내 보유</small></h2><div class="b" id="homecal">${calPanel()}</div></div>
   <div class="p c6"><h2>LATEST RESEARCH<small>${(D.reports||[]).length}</small></h2><div class="b">${repTable((D.reports||[]).slice(0,14))}</div></div>`;
  setTimeout(homeMyFill,0);
  h+=pick(krL,false)+(usTime?'':usBlock)+(oldBlk?`<div class="p c12 mu" style="font-size:var(--fs-1);padding:4px 8px">지난 값 — 날짜 확인 (오늘 것이 나오면 위로 올라감)</div>${oldBlk}`:'');
  if(CMTU===null) homeCusLoad();
  return h+'</div>';
}

/* 상단 3칸 어댑터 (묶음 B, 10/26) — Index.html TOPF·mkTop·topMount. 기존 문장·수치 재배치만, 근거 없으면 NA(사유). */
if(typeof TOPF==='object'){
TOPF.home=()=>{ const bv=mk=>{ const a=(D.breadth||[]).filter(x=>x.market===mk), L=a[a.length-1]; if(!L||L.pct_above200==null) return mk+' 폭 데이터 없음';
    const p=L.pct_above200; return `${mk} ${p>=0.6?'강세':p>=0.4?'중립':'약세'}(200일선 위 ${Math.round(p*100)}%, ${L.date})`; };
  const what=[bv('KR')+' · '+bv('US')]; if(typeof MV!=='undefined'&&MV&&MV.score!=null) what.push(`매크로 바람 ${MV.label||''} (${MV.score>0?'+':''}${Number(MV.score).toFixed(2)})`);
  const so=[]; [['KR',typeof CMT!=='undefined'?CMT:null],['US',typeof CMTU!=='undefined'?CMTU:null]].forEach(([m,o])=>{ if(o&&isTop(o.top)&&o.top.so_what[0]) so.push(`${m} 운용회의 — ${o.top.so_what[0]}`); });
  if(!so.length) so.push(NA('운용회의 판정 미로드 — DAILY › 운용회의'));
  const now=[], pend=typeof DEC!=='undefined'&&DEC&&DEC.items?homePendDuel(DEC.items,Date.now()):null, CD=typeof decCD==='function'?decCD():null,
    n=FR?(FR.late||[]).length+(FR.regress_today||[]).length+(FR.stale_today||[]).length:null;
  if(pend) now.push(`대결 제출 대기 ${pend}건 → 성적표`); if(CD) now.push('쿨다운 중 — 새 모의 베팅 금지'); if(n) now.push(`늦은 데이터 ${n}건 확인`);
  if(!now.length) now.push('조치 없음(대결 대기·쿨다운·늦은 데이터 없음)');
  return mkTop(what,so,now,['reports/dashboard.json','reports/committee.json','reports/decisions.json','reports/freshness.json'],D.generated_at,{grade:'검증전'}); };
