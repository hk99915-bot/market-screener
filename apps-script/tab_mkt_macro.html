<!-- tab_mkt_macro.html — MARKET › MACRO — macroView (10/21 겸이 "리서치나 마켓에 매크로가 없는 듯", 보드 macro-tab).
     흩어져 있던 매크로 산출물을 한 화면 결론으로: macro_view.json(바람·환율·유가·금·코스피 vs S&P) · bonds.json(한·미 금리) · calendar.json(일정·발표 결과).
     10/23 매크로: 원자재(commodities.json · getCommodities)·지정학 축(views/geopolitics.json · getGeopolitics) 패널 추가 — 첫 화면(macTop) 아래, 표시 전용. 문구 근거 = docs/desk_kb/macro.md #3(바람 점수) #5(20일 격차 ±8%p) #15(읽는 순서) #16(USDKRW).
     전역 도우미($·esc·num·pct·render·setView·asofTag·staleTag·dataLag·mkPhase)는 Index.html, 지표 해설 표 macroPanel 은 tab_market.html. -->
<script>
let MCX=null;
function mcLoad(){ MCX={};
  const g=(k,fn)=>google.script.run.withSuccessHandler(t=>{ try{ MCX[k]=typeof t==='string'?JSON.parse(t):(t||{}); }catch(e){ MCX[k]={}; } if(view==='macro') render(); })
    .withFailureHandler(()=>{ MCX[k]={}; if(view==='macro') render(); })[fn]();
  g('mv','getMacroView'); g('bd','getBonds'); g('cal','getCalendar'); g('cm','getCommodities'); g('geo','getGeopolitics'); g('gn','getGeoNews'); }
const mcBp=x=>x==null?'—':`<span class="${x>0?'dn':x<0?'up':'mu'}">${x>0?'+':''}${Number(x).toFixed(0)}bp</span>`;   // 금리↑ = 채권값↓ → 빨강 (채권 탭과 같은 색 규칙)
const mcMd=ds=>ds?(+String(ds).slice(5,7))+'/'+(+String(ds).slice(8,10)):'—';
function mcDday(ds){ const t=tzParts('Asia/Seoul').ds, d=Math.round((Date.parse(ds+'T00:00:00Z')-Date.parse(t+'T00:00:00Z'))/864e5); return d===0?'오늘':d>0?'D-'+d:'D+'+(-d); }
function macroView(){
  if(MCX===null){ mcLoad(); return '<div class="load">LOADING …</div>'; }
  const MV=MCX.mv, BD=MCX.bd, CAL=MCX.cal;
  if(!MV||!BD||!CAL) return '<div class="load">LOADING …</div>';
  const R={}; (MV.rows||[]).forEach(r=>R[r.key]=r);
  const tile=(t,body,foot)=>`<div class="mct" style="border:1px solid var(--line);padding:6px 8px;line-height:1.55;min-width:0"><div class="am" style="font-size:12px;font-weight:700">${t}</div>${body}${foot?`<div class="mu" style="font-size:10.5px;white-space:normal">${foot}</div>`:''}</div>`;
  const mvTag=staleTag(MV.asof,['08:50','10:30','11:35','13:30','14:15','15:45','19:10'],[1,2,3,4,5],['reports/macro_view.json'],dataLag('KR',MV.asof,0));
  // ① 결론: 바람(macroview 문장) + 한국만 하락 격차 (KB #5)
  let wind='<div class="mu">매크로 바람 데이터 없음 (reports/macro_view.json)</div>';
  if(MV.score!=null){ const col=MV.score>0.15?'var(--up)':MV.score<-0.15?'var(--dn)':'var(--amber)', s1=String(MV.summary||'').split(' · ')[0];
    wind=`<div style="font-size:13.5px"><b style="color:${col}">${esc(s1||('매크로 바람 '+(MV.label||'')+' ('+MV.score+')'))}</b></div>
      <div class="mu" style="font-size:11px">점수 −1~+1 = Σ(가중치 × 지표 영향) · 한국 지수는 결과라 제외 · <b>검증전</b>(가중치 사후 설정 — 참고만)</div>`; }
  const K=R.KOSPI, S=R.SPX; let gap='';
  if(K&&S&&K.chg20!=null&&S.chg20!=null){ const g=(K.chg20-S.chg20)*100;
    const why=g<-8?'한국 고유 요인 쪽(규칙: 격차 < −8%p) — 매크로 반전만으론 회복 근거 부족':g>8?'한국이 강함(규칙: 격차 > +8%p)':'격차 작음(±8%p 안) — 매크로와 같이 움직임';
    gap=`<div id="macGap" style="margin-top:4px;font-size:13px;white-space:normal">한국만 하락 격차: 20일 코스피 ${pct(K.chg20,1)} vs S&amp;P ${pct(S.chg20,1)} = <b class="${g<0?'dn':'up'}">${g>0?'+':''}${g.toFixed(1)}%p</b> → ${why}</div>`; }
  // 코스피200 ATM IV 칩 (파생 요청 req-macro-e0ef2a13) — 표시 전용 · 바람 점수 제외 · 검증전
  const IVc=(MV.chips||[]).find(c=>c.key==='K200_ATM_IV');
  if(IVc&&IVc.iv!=null) gap+=`<div id="macIV" style="margin-top:4px;font-size:12px;white-space:normal">코스피200 ATM IV <b>${(IVc.iv*100).toFixed(1)}%</b> → 하루 1σ ≈ <b>±${(IVc.day_1s*100).toFixed(1)}%</b> <span class="mu" style="font-size:11px">(연율 ÷ √252 · 흔들림 크기, 방향 아님 · 점수 제외 · <b>검증전</b> · derivs.json ${mcMd(IVc.date)})</span></div>`;
  const top=`<div class="p c12" id="macTop"><h2>MACRO 한눈에<small>reports/macro_view.json${mvTag}</small></h2><div class="b" style="white-space:normal">
    <div id="macWind" style="border:1px solid var(--line);border-left:4px solid ${MV.score==null?'var(--line)':MV.score>0.15?'var(--up)':MV.score<-0.15?'var(--dn)':'var(--amber)'};padding:6px 9px;line-height:1.6">${wind}${gap}</div>`;
  // ② 금리 (bonds.json — 미 Treasury·한 KRX 장외 민평)
  const U=(BD.us||{}).chg||{}, KR=(BD.kr||{}).chg||{};
  const rr=(lab,c)=>c&&c.v!=null?`<div style="display:flex;justify-content:space-between;gap:6px"><span>${lab}</span><span><b>${c.v.toFixed(2)}%</b> <span style="font-size:11px">1M ${mcBp(c.m1)}</span></span></div>`:`<div class="mu">${lab} —</div>`;
  const ua=(BD.us||{}).asof, ka=(BD.kr||{}).asof;
  const bdTag=staleTag(BD.generated_at?String(BD.generated_at).slice(5,16):BD.asof,['21:00'],[1,2,3,4,5],['bonds'],dataLag('US',ua,1)||'');
  const kLag=(()=>{ const p=mkPhase('KR'), t=tzParts('Asia/Seoul'); return dataLag('KR',ka,(p.last===p.today&&t.hm<22*60)?1:0); })();   // 국고채 민평은 장 마감 뒤 21:00 생성분부터
  const rates=tile('금리 · 10년 · 2년',rr('미 10Y',U['10Y'])+rr('미 2Y',U['2Y'])+rr('한 10Y',KR['10Y'])+rr('한 2Y',KR['2Y']),
    `미 Treasury ${mcMd(ua)} · 한 KRX 장외(민평) ${mcMd(ka)}${kLag?' <b class="dn">⚠ STALE 한국</b>':''} · bonds.json${bdTag}`);
  // ③ 기준금리 · 다음 회의 (calendar.json) — 정책금리 시리즈는 산출물에 없음 → 단기금리를 '대용'으로만
  const today=tzParts('Asia/Seoul').ds, EV=(CAL.events||[]).filter(e=>e.type==='매크로');
  const nx=re=>EV.filter(e=>e.date>=today&&re.test(e.name)).sort((a,b)=>a.date<b.date?-1:1)[0];
  const fomc=nx(/FOMC/), bok=nx(/금통위|한은|한국은행/), boj=nx(/BOJ/);
  const calTag=staleTag(CAL.asof,['08:50'],[1,2,3,4,5],['calendar'],dataLag('KR',CAL.asof,0));
  const pol=tile('기준금리 · 다음 회의',
    `<div>정책금리 값: <span class="mu">데이터 없음</span> <span class="mu" style="font-size:11px">(산출물에 시리즈 없음 — 데이터 데스크 요청)</span></div>
     <div style="font-size:12px">대용(기준금리 아님): 미 3M ${U['3M']&&U['3M'].v!=null?U['3M'].v.toFixed(2)+'%':'—'} · 한 CD91 ${KR.CD&&KR.CD.v!=null?KR.CD.v.toFixed(2)+'%':'—'}</div>
     <div>FOMC ${fomc?`<b>${mcMd(fomc.date)}</b> (${mcDday(fomc.date)}) <span class="mu" style="font-size:11px">${esc(fomc.note||'')}</span>`:'<span class="mu">일정 없음</span>'}</div>
     <div>금통위 ${bok?`<b>${mcMd(bok.date)}</b> (${mcDday(bok.date)})`:'<span class="mu">calendar.json 미등록</span>'}${boj?` · BOJ <b>${mcMd(boj.date)}</b> (${mcDday(boj.date)})`:''}</div>`,
    `calendar.json (연준·BOJ 공식 일정)${calTag}`);
  // ④ 환율 · ⑤ 유가·금 (macro_view rows — 일봉)
  const mr=(k,lab,dg,unit)=>{ const r=R[k]; return r&&r.last!=null?`<div style="display:flex;justify-content:space-between;gap:6px"><span>${lab}</span><span><b>${unit==='$'?'$':''}${num(r.last,dg)}</b> <span style="font-size:11px">20일 ${pct(r.chg20,1)}</span></span></div>`:`<div class="mu">${lab} —</div>`; };
  const rd=ks=>{ const ds=[...new Set(ks.map(k=>R[k]&&R[k].date).filter(Boolean))]; return ds.map(mcMd).join('·')||'—'; };
  const fx=tile('환율',mr('USDKRW','원/달러',1)+mr('DXY','달러지수',2)+mr('USDJPY','엔/달러',2),
    `원/달러 ↑ = 원화 약세 = 외국인 환차손(매크로 KB #16) · 일봉 ${rd(['USDKRW','DXY','USDJPY'])} · macro_view.json`);
  const cmd=tile('유가 · 금',mr('WTI','WTI',2,'$')+mr('GOLD','금',0,'$'),`달러 기준 · 일봉 ${rd(['WTI','GOLD'])} · macro_view.json`);
  // ⑥ 다음 주요 일정 (중요도 ★2 이상)
  const up=EV.filter(e=>e.date>=today&&(e.imp||0)>=2).sort((a,b)=>a.date<b.date?-1:1).slice(0,4);
  const sch=tile('다음 주요 일정',up.length?up.map(e=>`<div style="display:flex;gap:6px"><b style="min-width:38px">${mcMd(e.date)}</b><span class="mu" style="min-width:34px">${mcDday(e.date)}</span><span style="white-space:normal">${esc(e.name)}${(e.imp||0)>=3?' <span class="am">★</span>':''}</span></div>`).join(''):'<div class="mu">예정된 ★2 이상 매크로 일정 없음</div>',
    `★ = 중요도 3 (결과 전 레버리지·방향 베팅 금지 대상, 매크로 KB #12) · calendar.json`);
  const grid=`<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:6px;margin-top:8px">${rates}${pol}${fx}${cmd}${sch}</div>
    <div class="mu" style="font-size:11px;margin-top:6px">금리 색 = 채권 가격 기준(금리↑ <span class="dn">빨강</span>) · 지수·환율 색 = 값의 방향. 숫자는 산출물 그대로이고 해석 문장은 규칙(매크로 KB) 기반 — 추정 없음. <button class="sbtn" onclick="setView('bond')" style="min-height:32px">채권 탭 →</button></div></div></div>`;
  // 최근 발표 (calendar result = calendar_ev.release_line — 직전 대비 · 개정 전, 컨센서스 없음)
  const done=(CAL.events||[]).filter(e=>e.type==='매크로'&&e.date<=today&&(e.result||[]).length).sort((a,b)=>a.date<b.date?1:-1).slice(0,3);
  const rel=done.length?`<div class="p c12"><h2>최근 발표<small>직전 대비 · 개정 전 잠정치 · 컨센서스 없음 (매크로 KB #2)</small></h2><div class="b" style="white-space:normal;line-height:1.65">${done.map(e=>`<div><b>${mcMd(e.date)}</b> ${esc(e.name)} — ${e.result.map(esc).join(' · ')}</div>`).join('')}</div></div>`:'';
  const tbl=typeof macroPanel==='function'?`<div class="p c12"><h2>지표 전체 · 해설<small>매크로 바람 구성 지표 · ▸ 누르면 해설 · 지표명 누르면 차트</small></h2><div class="b">${macroPanel('KR')}</div></div>`:'';
  return `<div class="grid">${top}${grid}${mcCmdPanel(MCX.cm,R)}${mcGeoPanel(MCX.geo,MCX.cm,R,MCX.gn)}${rel}${tbl}</div>`;
}
// 원자재 (10/23 겸이 "원자재 트래킹 더 강화, 정유 구리 알루미늄 등, 비철금속, 희토류") — reports/commodities.json (screener/commodities.py)
// 표시 전용 · 바람 점수 제외. 업종 연결 = 설명(매수 권유 아님). 못 받는 지표는 '미확인' + 이유 그대로.
const mcSg=(x,dg)=>x==null?'—':`<span class="${x>0?'up':x<0?'dn':'mu'}">${x>0?'+':''}${(x*100).toFixed(dg==null?1:dg)}%</span>`;
const mcDf=(x,u)=>x==null?'—':`<span class="${x>0?'up':x<0?'dn':'mu'}">${x>0?'+':''}${Number(x).toFixed(2)}${u||''}</span>`;
function mcPos(p){ if(p==null) return '<span class="mu">—</span>'; const w=Math.round(p*100);
  return `<span title="52주 위치 ${w}% (0=저점 100=고점)" style="display:inline-block;width:46px;height:7px;border:1px solid var(--line);position:relative;vertical-align:middle"><span style="position:absolute;left:calc(${w}% - 2px);top:-2px;width:4px;height:9px;background:${p>=0.8?'var(--up)':p<=0.2?'var(--dn)':'var(--amber)'}"></span></span> <span style="font-size:10.5px">${w}%</span>`; }
function mcCmdPanel(CM){
  if(!CM) return '<div class="p c12" id="macCmd"><h2>원자재</h2><div class="b"><div class="load">LOADING …</div></div></div>';
  const rows=CM.rows||[]; if(!rows.length) return `<div class="p c12" id="macCmd"><h2>원자재</h2><div class="b mu">데이터 없음 (reports/commodities.json${(CM.errors||[]).length?' — '+esc(CM.errors[0]):''})</div></div>`;
  const cmTag=staleTag(CM.asof,['15:45','16:20','06:52'],[1,2,3,4,5],['reports/commodities.json'],dataLag('US',CM.asof,1));
  const fmt=r=>r.last==null?'—':(r.unit&&r.unit.startsWith('$/')||r.unit==='$'?'$':'')+num(r.last,r.last>=1000?0:r.last>=20?1:2)+(r.unit&&!/^\$$/.test(r.unit)?` <span class="mu" style="font-size:10px">${esc(r.unit.replace(/^\$/,''))}</span>`:'');
  const line=r=>{ const d=r.group==='파생', bad=r.status!=='ok', mo=r.freq==='월간';   // 월간 = FRED IMF 월평균(데이터 10/23) — 1주 칸 대신 기준월·전월·12개월
    if(mo&&!bad) return `<details class="mcc" style="border-top:1px solid var(--line);padding:3px 0"><summary style="display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;cursor:pointer;list-style:none">
      <b style="flex:1 1 150px;min-width:0;white-space:normal;font-size:12.5px">${esc(r.name)} <span class="mu" style="font-size:10px;border:1px solid var(--line);padding:0 3px">월간 ${+String(r.date||'').slice(5,7)}월</span></b>
      <span style="min-width:72px;text-align:right">${fmt(r)}</span><span style="font-size:11px">전월 ${mcSg(r.chg1m)}</span><span style="font-size:11px">12개월 ${mcSg(r.chg12m,0)}</span>${mcPos(r.pos52)}</summary>
      <div style="font-size:11.5px;white-space:normal;line-height:1.55;padding:2px 0 4px 8px"><div><b>한국 업종 연결</b> ${esc(r.kr||'')}</div><div class="mu">${esc(r.note||'')} · ${esc(r.sym||'')} · 막대 = 12개월 위치</div></div></details>`;
    return `<details class="mcc" style="border-top:1px solid var(--line);padding:3px 0"><summary style="display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;cursor:pointer;list-style:none">
      <b style="flex:1 1 150px;min-width:0;white-space:normal;font-size:12.5px">${esc(r.name)}</b>
      ${bad?`<span class="mu" style="font-size:11px">미확인</span>`:`<span style="min-width:72px;text-align:right">${fmt(r)}</span>
      <span style="font-size:11px">1주 ${d?mcDf(r.d1w):mcSg(r.chg1w)}</span><span style="font-size:11px">1개월 ${d?mcDf(r.d1m):mcSg(r.chg1m)}</span>${mcPos(r.pos52)}`}</summary>
      <div style="font-size:11.5px;white-space:normal;line-height:1.55;padding:2px 0 4px 8px">${r.what?`<div>${esc(r.what)}</div>`:''}<div><b>한국 업종 연결</b> ${esc(r.kr||'')}</div><div class="mu">${esc(r.note||'')}${r.sym?' · '+esc(r.sym):''}${r.date?' · '+mcMd(r.date):''}</div></div></details>`; };
  // 기본 = 요약 + '오늘 움직인 3개'만 (UXUI 재진단 Top10 #9, 10/23 겸이 승인 · 패널 1,614px) — 1주 변동 절댓값 큰 3개(파생·월간·미확인 제외), 나머지는 아래 접힘. 기준은 매크로 회신(req-macro-997b29e5) 오면 교체
  const mv3=rows.filter(r=>r.status==='ok'&&r.group!=='파생'&&r.freq!=='월간'&&r.chg1w!=null).sort((a,b)=>Math.abs(b.chg1w)-Math.abs(a.chg1w)).slice(0,3);
  const top3=mv3.length?`<div style="margin-top:6px"><div class="am" style="font-size:12px;font-weight:700">이번 주 가장 많이 움직인 3개 <span class="mu" style="font-weight:400">(1주 변동 절댓값)</span></div>${mv3.map(line).join('')}</div>`:'';
  const nRest=rows.length+(CM.unavailable||[]).length;
  const grp=(CM.groups||[]).map(g=>{ const rs=rows.filter(r=>r.group===g), un=(CM.unavailable||[]).filter(u=>u.group===g);
    if(!rs.length&&!un.length) return '';
    return `<div style="margin-top:6px"><div class="am" style="font-size:12px;font-weight:700">${esc(g)}</div>${rs.map(line).join('')}${un.map(u=>`<div style="border-top:1px solid var(--line);padding:3px 0;font-size:11.5px;white-space:normal"><b>${esc(u.name)}</b> <span class="mu">미확인 — ${esc(u.why)}</span></div>`).join('')}</div>`; }).join('');
  return `<div class="p c12" id="macCmd"><h2>원자재 · 에너지 · 비철 · 희토류 · 귀금속<small>reports/commodities.json${cmTag}</small></h2><div class="b" style="white-space:normal">
    <div style="font-size:12.5px"><b>${esc(CM.summary||'')}</b></div>
    <div class="mu" style="font-size:10.5px">${esc(CM.label||'')} · ${esc(CM.src||'')} · 파생(스프레드·마진·비율)은 % 대신 단위 차이 · 줄 누르면 업종 연결</div>${top3}
    <details id="macCmdAll" style="margin-top:6px"><summary style="cursor:pointer;min-height:44px;display:flex;align-items:center" class="am">전체 ${nRest}개 보기 (그룹별 · 미확인 포함)</summary>${grp}</details>
    ${(CM.source_notes||[]).length?`<details style="margin-top:6px;font-size:11px"><summary class="mu" style="cursor:pointer">조사했지만 안 쓰는 소스 ${CM.source_notes.length}개 (데이터 데스크 10/23)</summary><ul style="margin:2px 0 2px 16px;padding:0;white-space:normal">${CM.source_notes.map(t=>`<li>${esc(t)}</li>`).join('')}</ul></details>`:''}</div></div>`;
}
// 지정학 축 (10/23 겸이 "지정학 뷰 다른거 추가할거있으면 더 추가") — reports/views/geopolitics.json(매크로 데스크 작성) + 관찰 지표 현재값(commodities·macro_view)
// 자동 뉴스(geo_news.json, 데이터 10/23) — 점선 테두리·'자동' 칩. 데스크 해석(상태·경로·트리거·외부자료)은 실선 앰버 테두리로 구분.
const mcNt=t=>t?(+String(t).slice(5,7))+'/'+(+String(t).slice(8,10))+' '+String(t).slice(11,16):'';
const mcAuto='<span style="font-size:9.5px;padding:0 3px;border:1px dashed var(--muted)" class="mu">자동</span>';
function mcNews(a,GN){ const it=a&&a.items||[];
  if(!GN) return ''; if(!it.length) return `<div class="mu" style="font-size:11px">${mcAuto} 최근 ${GN.window_days||7}일 매칭 헤드라인 없음</div>`;
  return `<div style="border:1px dashed var(--line);padding:3px 6px;margin:3px 0 4px;overflow-wrap:anywhere"><div class="mu" style="font-size:10.5px">${mcAuto} 최근 뉴스 · 공개 RSS 제목 키워드 매칭 · 해석 아님 · ${esc(GN.generated_at||'')}</div>
    ${it.map(n=>`<div style="line-height:1.45;margin-top:2px"><span style="font-size:12px">${esc(n.title)}</span> <span class="mu" style="font-size:10.5px">— ${esc(n.src||'')} · ${mcNt(n.time)}</span>${n.link?` <a href="${esc(n.link)}" target="_blank" rel="noopener noreferrer" class="mu" style="font-size:9.5px">링크</a>`:''}</div>`).join('')}</div>`; }
function mcGeoPanel(G,CM,R,GN){
  if(!G) return '<div class="p c12" id="macGeo"><h2>지정학 축</h2><div class="b"><div class="load">LOADING …</div></div></div>';
  const ax=G.axes||[]; if(!ax.length) return '<div class="p c12" id="macGeo"><h2>지정학 축</h2><div class="b mu">데이터 없음 (reports/views/geopolitics.json)</div></div>';
  const C={}; ((CM&&CM.rows)||[]).forEach(r=>C[r.key]=r);
  const wv=k=>{ const c=C[k]; if(c&&c.status==='ok') return `${esc(c.name.replace(/\(.*?\)/g,''))} ${num(c.last,c.last>=1000?0:2)} <span style="font-size:10.5px">1개월 ${c.group==='파생'?mcDf(c.d1m):mcSg(c.chg1m,0)}</span>`;
    const m=R[k]; if(m&&m.last!=null) return `${esc((m.name||k).replace(/\(.*?\)/g,''))} ${num(m.last,m.last>=1000?0:2)} <span style="font-size:10.5px">20일 ${pct(m.chg20,1)}</span>`; return `${esc(k)} <span class="mu">미확인</span>`; };
  const lv=l=>`<span style="font-size:10.5px;padding:0 4px;border:1px solid ${l==='높음'?'var(--dn)':'var(--amber)'};color:${l==='높음'?'var(--dn)':'var(--amber)'}">${esc(l||'')}</span>`;
  const src=s=>`<div style="border-left:2px solid var(--line);padding-left:6px;margin-top:4px"><div><b>${esc(s.title)}</b> <span class="mu">${esc(s.date||'')}</span> ${s.url?`<a href="${esc(s.url)}" target="_blank" rel="noopener" class="mu">원문</a>`:''}</div>
    <div>① 내용 ${esc(s.summary||'')}</div><div>② 그 기관의 뷰 ${esc(s.view||'')}</div><div>③ 우리 해석 ${esc(s.our_take||'')}</div></div>`;
  const NA={}; ((GN&&GN.axes)||[]).forEach(x=>NA[x.id]=x);
  const top1=a=>{ const n=(NA[a.id]&&NA[a.id].items||[])[0]; return n?`<div style="font-size:11.5px;white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere">${mcAuto} ${esc(n.title)} <span class="mu" style="font-size:10.5px">— ${esc(n.src||'')} · ${mcNt(n.time)}</span></div>`:''; };
  const body=ax.map(a=>`<details class="mcg" style="border-top:1px solid var(--line);padding:4px 0"><summary style="cursor:pointer;white-space:normal;line-height:1.55"><b>${esc(a.name)}</b> ${lv(a.level)}
      <div style="font-size:11.5px">${(a.watch||[]).map(wv).join(' · ')}</div>${top1(a)}</summary>
    <div style="font-size:11.5px;white-space:normal;line-height:1.6;padding:2px 0 4px 8px">${mcNews(NA[a.id],GN)}
      <div style="border-left:2px solid var(--amber);padding-left:6px"><div class="am" style="font-size:10.5px;font-weight:700">데스크 해석 · 매크로 작성 (${esc(G.updated||'')})</div>
      <div><b>현재</b> ${esc(a.status||'')}</div><div><b>전달 경로</b> ${esc(a.path||'')}</div>
      <div><b>트리거</b><ul style="margin:2px 0 2px 16px;padding:0">${(a.triggers||[]).map(t=>`<li>${esc(t)}</li>`).join('')}</ul></div>
      ${(a.sources||[]).map(src).join('')}</div></div></details>`).join('');
  // 기본 = 축 이름·수준 1줄만 (UXUI 재진단 Top10 #9 · 패널 607px) — 축별 지표·뉴스·해석은 펼치면. 항상 펼칠 축은 매크로 회신(req-macro-997b29e5) 오면 반영
  const brief=ax.map(a=>`<span style="display:inline-flex;align-items:center;gap:4px;margin:0 10px 2px 0">${esc(a.name)} ${lv(a.level)}</span>`).join('');
  return `<div class="p c12" id="macGeo"><h2>지정학 축 · 시장 전달 경로<small>reports/views/geopolitics.json · ${esc(G.updated||'')}</small></h2><div class="b" style="white-space:normal">
    <div style="font-size:12.5px;line-height:1.7">${brief}</div>
    <details id="macGeoAll"><summary style="cursor:pointer;min-height:44px;display:flex;align-items:center" class="am">축 ${ax.length}개 자세히 (지표·뉴스·데스크 해석)</summary>
    <div class="mu" style="font-size:10.5px">${esc(G.grade||'')} · 축 누르면 상태·경로·트리거·외부자료 3칸(STANDARD §4)</div>
    <div class="mu" style="font-size:10.5px">${mcAuto} 줄(점선) = 공개 RSS 헤드라인 자동 수집(reports/geo_news.json${GN&&GN.feeds?` · 피드 ${GN.feeds.filter(f=>f.ok).length}/${GN.feeds.length} 성공`:''}) — 키워드 매칭일 뿐 데스크 판단 아님 · 앰버 실선 = 매크로 데스크가 쓴 해석</div>${body}</details></div></div>`;
}
</script>
