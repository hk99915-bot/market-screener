<!-- tab_mkt_macro.html — MARKET › MACRO — macroView (10/21 겸이 "리서치나 마켓에 매크로가 없는 듯", 보드 macro-tab).
     흩어져 있던 매크로 산출물을 한 화면 결론으로: macro_view.json(바람·환율·유가·금·코스피 vs S&P) · bonds.json(한·미 금리) · calendar.json(일정·발표 결과).
     새 데이터·getter 없음(Code.gs 그대로). 문구 근거 = docs/desk_kb/macro.md #3(바람 점수) #5(20일 격차 ±8%p) #15(읽는 순서) #16(USDKRW).
     전역 도우미($·esc·num·pct·render·setView·asofTag·staleTag·dataLag·mkPhase)는 Index.html, 지표 해설 표 macroPanel 은 tab_market.html. -->
<script>
let MCX=null;
function mcLoad(){ MCX={};
  const g=(k,fn)=>google.script.run.withSuccessHandler(t=>{ try{ MCX[k]=typeof t==='string'?JSON.parse(t):(t||{}); }catch(e){ MCX[k]={}; } if(view==='macro') render(); })
    .withFailureHandler(()=>{ MCX[k]={}; if(view==='macro') render(); })[fn]();
  g('mv','getMacroView'); g('bd','getBonds'); g('cal','getCalendar'); }
const mcBp=x=>x==null?'—':`<span class="${x>0?'dn':x<0?'up':'mu'}">${x>0?'+':''}${Number(x).toFixed(0)}bp</span>`;   // 금리↑ = 채권값↓ → 빨강 (채권 탭과 같은 색 규칙)
const mcMd=ds=>ds?(+String(ds).slice(5,7))+'/'+(+String(ds).slice(8,10)):'—';
function mcDday(ds){ const t=tzParts('Asia/Seoul').ds, d=Math.round((Date.parse(ds+'T00:00:00Z')-Date.parse(t+'T00:00:00Z'))/864e5); return d===0?'오늘':d>0?'D-'+d:'D+'+(-d); }
function macroView(){
  if(MCX===null){ mcLoad(); return '<div class="load">LOADING …</div>'; }
  const MV=MCX.mv, BD=MCX.bd, CAL=MCX.cal;
  if(!MV||!BD||!CAL) return '<div class="load">LOADING …</div>';
  const R={}; (MV.rows||[]).forEach(r=>R[r.key]=r);
  const tile=(t,body,foot)=>`<div class="mct" style="border:1px solid var(--line);padding:6px 8px;line-height:1.55;min-width:0"><div class="am" style="font-size:12px;font-weight:700">${t}</div>${body}${foot?`<div class="mu" style="font-size:10.5px;white-space:normal">${foot}</div>`:''}</div>`;
  const mvTag=staleTag(MV.asof,['08:50','10:30','11:35','13:30','14:15','15:45','19:10'],[1,2,3,4,5],['reports/macro_view.json'],dataLag('KR',MV.asof,0));
  // ① 결론: 바람(macroview 문장) + 한국만 하락 격차 (KB #5)
  let wind='<div class="mu">매크로 바람 데이터 없음 (reports/macro_view.json)</div>';
  if(MV.score!=null){ const col=MV.score>0.15?'var(--up)':MV.score<-0.15?'var(--dn)':'var(--amber)', s1=String(MV.summary||'').split(' · ')[0];
    wind=`<div style="font-size:13.5px"><b style="color:${col}">${esc(s1||('매크로 바람 '+(MV.label||'')+' ('+MV.score+')'))}</b></div>
      <div class="mu" style="font-size:11px">점수 −1~+1 = Σ(가중치 × 지표 영향) · 한국 지수는 결과라 제외 · <b>검증전</b>(가중치 사후 설정 — 참고만)</div>`; }
  const K=R.KOSPI, S=R.SPX; let gap='';
  if(K&&S&&K.chg20!=null&&S.chg20!=null){ const g=(K.chg20-S.chg20)*100;
    const why=g<-8?'한국 고유 요인 쪽(규칙: 격차 < −8%p) — 매크로 반전만으론 회복 근거 부족':g>8?'한국이 강함(규칙: 격차 > +8%p)':'격차 작음(±8%p 안) — 매크로와 같이 움직임';
    gap=`<div id="macGap" style="margin-top:4px;font-size:13px;white-space:normal">한국만 하락 격차: 20일 코스피 ${pct(K.chg20,1)} vs S&amp;P ${pct(S.chg20,1)} = <b class="${g<0?'dn':'up'}">${g>0?'+':''}${g.toFixed(1)}%p</b> → ${why}</div>`; }
  // 코스피200 ATM IV 칩 (파생 요청 req-macro-e0ef2a13) — 표시 전용 · 바람 점수 제외 · 검증전
  const IVc=(MV.chips||[]).find(c=>c.key==='K200_ATM_IV');
  if(IVc&&IVc.iv!=null) gap+=`<div id="macIV" style="margin-top:4px;font-size:12px;white-space:normal">코스피200 ATM IV <b>${(IVc.iv*100).toFixed(1)}%</b> → 하루 1σ ≈ <b>±${(IVc.day_1s*100).toFixed(1)}%</b> <span class="mu" style="font-size:11px">(연율 ÷ √252 · 흔들림 크기, 방향 아님 · 점수 제외 · <b>검증전</b> · derivs.json ${mcMd(IVc.date)})</span></div>`;
  const top=`<div class="p c12" id="macTop"><h2>MACRO 한눈에<small>reports/macro_view.json${mvTag}</small></h2><div class="b" style="white-space:normal">
    <div id="macWind" style="border:1px solid var(--line);border-left:4px solid ${MV.score==null?'var(--line)':MV.score>0.15?'var(--up)':MV.score<-0.15?'var(--dn)':'var(--amber)'};padding:6px 9px;line-height:1.6">${wind}${gap}</div>`;
  // ② 금리 (bonds.json — 미 Treasury·한 KRX 장외 민평)
  const U=(BD.us||{}).chg||{}, KR=(BD.kr||{}).chg||{};
  const rr=(lab,c)=>c&&c.v!=null?`<div style="display:flex;justify-content:space-between;gap:6px"><span>${lab}</span><span><b>${c.v.toFixed(2)}%</b> <span style="font-size:11px">1M ${mcBp(c.m1)}</span></span></div>`:`<div class="mu">${lab} —</div>`;
  const ua=(BD.us||{}).asof, ka=(BD.kr||{}).asof;
  const bdTag=staleTag(BD.generated_at?String(BD.generated_at).slice(5,16):BD.asof,['21:00'],[1,2,3,4,5],['bonds'],dataLag('US',ua,1)||'');
  const kLag=(()=>{ const p=mkPhase('KR'), t=tzParts('Asia/Seoul'); return dataLag('KR',ka,(p.last===p.today&&t.hm<22*60)?1:0); })();   // 국고채 민평은 장 마감 뒤 21:00 생성분부터
  const rates=tile('금리 · 10년 · 2년',rr('미 10Y',U['10Y'])+rr('미 2Y',U['2Y'])+rr('한 10Y',KR['10Y'])+rr('한 2Y',KR['2Y']),
    `미 Treasury ${mcMd(ua)} · 한 KRX 장외(민평) ${mcMd(ka)}${kLag?' <b class="dn">⚠ STALE 한국</b>':''} · bonds.json${bdTag}`);
  // ③ 기준금리 · 다음 회의 (calendar.json) — 정책금리 시리즈는 산출물에 없음 → 단기금리를 '대용'으로만
  const today=tzParts('Asia/Seoul').ds, EV=(CAL.events||[]).filter(e=>e.type==='매크로');
  const nx=re=>EV.filter(e=>e.date>=today&&re.test(e.name)).sort((a,b)=>a.date<b.date?-1:1)[0];
  const fomc=nx(/FOMC/), bok=nx(/금통위|한은|한국은행/), boj=nx(/BOJ/);
  const calTag=staleTag(CAL.asof,['08:50'],[1,2,3,4,5],['calendar'],dataLag('KR',CAL.asof,0));
  const pol=tile('기준금리 · 다음 회의',
    `<div>정책금리 값: <span class="mu">데이터 없음</span> <span class="mu" style="font-size:11px">(산출물에 시리즈 없음 — 데이터 데스크 요청)</span></div>
     <div style="font-size:12px">대용(기준금리 아님): 미 3M ${U['3M']&&U['3M'].v!=null?U['3M'].v.toFixed(2)+'%':'—'} · 한 CD91 ${KR.CD&&KR.CD.v!=null?KR.CD.v.toFixed(2)+'%':'—'}</div>
     <div>FOMC ${fomc?`<b>${mcMd(fomc.date)}</b> (${mcDday(fomc.date)}) <span class="mu" style="font-size:11px">${esc(fomc.note||'')}</span>`:'<span class="mu">일정 없음</span>'}</div>
     <div>금통위 ${bok?`<b>${mcMd(bok.date)}</b> (${mcDday(bok.date)})`:'<span class="mu">calendar.json 미등록</span>'}${boj?` · BOJ <b>${mcMd(boj.date)}</b> (${mcDday(boj.date)})`:''}</div>`,
    `calendar.json (연준·BOJ 공식 일정)${calTag}`);
  // ④ 환율 · ⑤ 유가·금 (macro_view rows — 일봉)
  const mr=(k,lab,dg,unit)=>{ const r=R[k]; return r&&r.last!=null?`<div style="display:flex;justify-content:space-between;gap:6px"><span>${lab}</span><span><b>${unit==='$'?'$':''}${num(r.last,dg)}</b> <span style="font-size:11px">20일 ${pct(r.chg20,1)}</span></span></div>`:`<div class="mu">${lab} —</div>`; };
  const rd=ks=>{ const ds=[...new Set(ks.map(k=>R[k]&&R[k].date).filter(Boolean))]; return ds.map(mcMd).join('·')||'—'; };
  const fx=tile('환율',mr('USDKRW','원/달러',1)+mr('DXY','달러지수',2)+mr('USDJPY','엔/달러',2),
    `원/달러 ↑ = 원화 약세 = 외국인 환차손(매크로 KB #16) · 일봉 ${rd(['USDKRW','DXY','USDJPY'])} · macro_view.json`);
  const cmd=tile('유가 · 금',mr('WTI','WTI',2,'$')+mr('GOLD','금',0,'$'),`달러 기준 · 일봉 ${rd(['WTI','GOLD'])} · macro_view.json`);
  // ⑥ 다음 주요 일정 (중요도 ★2 이상)
  const up=EV.filter(e=>e.date>=today&&(e.imp||0)>=2).sort((a,b)=>a.date<b.date?-1:1).slice(0,4);
  const sch=tile('다음 주요 일정',up.length?up.map(e=>`<div style="display:flex;gap:6px"><b style="min-width:38px">${mcMd(e.date)}</b><span class="mu" style="min-width:34px">${mcDday(e.date)}</span><span style="white-space:normal">${esc(e.name)}${(e.imp||0)>=3?' <span class="am">★</span>':''}</span></div>`).join(''):'<div class="mu">예정된 ★2 이상 매크로 일정 없음</div>',
    `★ = 중요도 3 (결과 전 레버리지·방향 베팅 금지 대상, 매크로 KB #12) · calendar.json`);
  const grid=`<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:6px;margin-top:8px">${rates}${pol}${fx}${cmd}${sch}</div>
    <div class="mu" style="font-size:11px;margin-top:6px">금리 색 = 채권 가격 기준(금리↑ <span class="dn">빨강</span>) · 지수·환율 색 = 값의 방향. 숫자는 산출물 그대로이고 해석 문장은 규칙(매크로 KB) 기반 — 추정 없음. <button class="sbtn" onclick="setView('bond')" style="min-height:32px">채권 탭 →</button></div></div></div>`;
  // 최근 발표 (calendar result = calendar_ev.release_line — 직전 대비 · 개정 전, 컨센서스 없음)
  const done=(CAL.events||[]).filter(e=>e.type==='매크로'&&e.date<=today&&(e.result||[]).length).sort((a,b)=>a.date<b.date?1:-1).slice(0,3);
  const rel=done.length?`<div class="p c12"><h2>최근 발표<small>직전 대비 · 개정 전 잠정치 · 컨센서스 없음 (매크로 KB #2)</small></h2><div class="b" style="white-space:normal;line-height:1.65">${done.map(e=>`<div><b>${mcMd(e.date)}</b> ${esc(e.name)} — ${e.result.map(esc).join(' · ')}</div>`).join('')}</div></div>`:'';
  const tbl=typeof macroPanel==='function'?`<div class="p c12"><h2>지표 전체 · 해설<small>매크로 바람 구성 지표 · ▸ 누르면 해설 · 지표명 누르면 차트</small></h2><div class="b">${macroPanel('KR')}</div></div>`:'';
  return `<div class="grid">${top}${grid}${rel}${tbl}</div>`;
}
</script>
