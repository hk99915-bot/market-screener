<!-- tab_committee.html — DAILY › 운용회의 — v1/v2 회의록·기명 점도표 띠·파생 패널·미장 회의·지난 회의 (cmtView·dotStripHtml·cmtUSView).
     apps-script/Index.html 이 include('tab_committee') 템플릿 태그로 끼워 넣는다 (GAS 는 HtmlService include, Pages 는 scripts/build_pages.py 가 인라인).
     전역 도우미($·esc·num·pct·render·setView·openDetail 등)는 Index.html 에 있다. -->
<script>
let CMT=null, CMTU=null, CMK='KR', DOT=null;
function cmtView(){
  if(CMK==='US') return cmtUSView();
  if(CMT===null){ CMT=false; google.script.run.withSuccessHandler(t=>{try{CMT=JSON.parse(t);}catch(e){CMT={};} if(view==='cmt') render();}).withFailureHandler(()=>{CMT={};if(view==='cmt') render();}).getCommittee(); return '<div class="load">LOADING …</div>'; }
  const o=CMT; if(!o||!o.scenarios) return cmtTabs()+'<div class="grid"><div class="p c12"><div class="b mu">운용회의 자료 생성 전</div></div></div>';
  if(o.bottom_line) return cmtTabs()+cmtV2Html(o);
  return cmtTabs()+cmtLegacyHtml(o);
}
/* 예전 형식(v1) 운용회의 — 지난 회의 기록(bottom_line 없음)을 열 때 */
function cmtLegacyHtml(o){
  const col=x=>x==null?'var(--muted)':x>0.15?'var(--up)':x<-0.15?'var(--dn)':'var(--amber)', sg=x=>x==null?'—':(x>0?'+':'')+x.toFixed(2);
  const sc=o.scenarios.map(s=>`<div style="flex:1;min-width:220px;border:1px solid var(--line);padding:8px 10px;line-height:1.6;white-space:normal">
     <div style="display:flex;justify-content:space-between"><b>${esc(s.name)}</b><b class="am" style="font-size:16px">${Math.round((s.prob||0)*100)}%</b></div>
     <div class="mu" style="font-size:11px">${esc(s.def)}</div><div style="font-size:12px;margin-top:4px"><span class="am">전환 신호</span> ${esc(s.trigger)}</div><div style="font-size:12px"><span class="am">행동</span> ${esc(s.action)}</div></div>`).join('');
  const idea=(a,t)=>a.length?`<table><tr><th class="l">${t}</th><th class="l">테마</th><th>드라이버</th><th>정상화 괴리</th><th>20D</th><th>PBR</th></tr>${a.map(x=>`<tr><td class="l am sym" data-sym="${esc(x.s)}" data-mk="KR">${esc(x.n)}${x.semi?' <span class="tag">반도체</span>':''}</td><td class="l mu">${esc(x.g)}</td><td style="color:${col(x.drv)}">${sg(x.drv)}</td><td>${pct(x.nor,0)}</td><td>${pct(x.r20,0)}</td><td class="mu">${x.pbr??'—'}</td></tr>`).join('')}</table>`:'<div class="mu">해당 없음</div>';
  const tr=(o.track||{}).summary||{};
  return `<div class="grid">
   <div class="p c12"><h2>운용회의 · 국장${o.session?' · '+esc(o.session):''}<small>${esc(o.asof)} · 규칙 기반 · 검증 중</small></h2><div class="b" style="line-height:1.8;white-space:normal">${(o.head||[]).map(x=>'<div>• '+esc(x)+'</div>').join('')}<div style="margin-top:6px;border:1px solid var(--amber);padding:6px 10px"><b class="am">결론</b> ${esc(o.verdict)}</div></div></div>
   <div class="p c12"><h2>운용 시나리오<small>확률 = 1999~ 코스피 비슷한 상황 이후 20거래일 결과 분포 (${esc((o.scenario_basis||{}).basis||'')}, ${(o.scenario_basis||{}).n||0}회)</small></h2><div class="b"><div style="display:flex;gap:8px;flex-wrap:wrap">${sc}</div></div></div>
   ${o.stance?`<div class="p c12"><h2>PB 판단 · ${esc(o.stance.stance)}<small>확률 = 방향, 신호 = 타이밍 — 왜 이렇게 결정했나</small></h2><div class="b" style="line-height:1.7;white-space:normal"><div style="border:1px solid ${o.stance.stance==='관망'?'var(--amber)':o.stance.stance==='방어'?'var(--dn)':'var(--up)'};padding:6px 10px;margin-bottom:8px"><b class="am">${esc(o.stance.stance)}</b> ${esc(o.stance.plan)}</div>${o.stance.basis?`<div style="font-size:12px;border-left:2px solid var(--amber);padding-left:8px;margin-bottom:8px"><b class="am">판단 시점 ${esc(String(o.stance.basis.at).slice(5))}</b> <span class="mu">${esc(o.stance.basis.src)} — 이 숫자를 보고 결정했어요. 아래 근거 숫자는 회의 생성 시각(${esc(o.asof)}) 기준</span>${o.stance.basis.lines.map(x=>'<div>· '+esc(x)+'</div>').join('')}</div>`:''}${o.stance.reasons.map((r,i)=>`<div style="margin:4px 0"><b>${i+1}. ${esc(r.t)}</b><div class="mu" style="font-size:12px">${esc(r.d)}</div></div>`).join('')}</div></div>${o.stance.exec?execHtml(o.stance.exec):''}`:''}
   ${o.derivs?derivPanel(o.derivs):''}
   <div class="p c6"><h2>업종 의견<small>공급망 체인 점수</small></h2><div class="b"><table>${(o.sectors||[]).map(r=>`<tr><td class="l">${esc(r.chain)}</td><td style="color:${col(r.score)}">${sg(r.score)}</td><td class="l ${r.stance==='비중 확대'?'up':r.stance==='비중 축소'?'dn':'mu'}">${r.stance}</td></tr>`).join('')}</table></div></div>
   <div class="p c6"><h2>테마 온도<small>드라이버 평균 상·하위 · 시총 가중 수익률</small></h2><div class="b"><table><tr><th class="l">테마</th><th>드라이버</th><th>5D</th><th>20D</th></tr>${(o.themes||[]).map(t=>`<tr><td class="l">${esc(t.theme)}</td><td style="color:${col(t.drv)}">${sg(t.drv)}</td><td>${pct(t.r5,1)}</td><td>${pct(t.r20,1)}</td></tr>`).join('')}</table></div></div>
   <div class="p c6"><h2>매수 후보<small>검증 전 후보 · 이익 신호 강함 + 평균 이익 기준 저평가 + 20일 −10% 이상 하락</small></h2><div class="b">${idea((o.ideas||{}).long||[],'종목')}</div></div>
   <div class="p c6"><h2>회피<small>검증 전 후보 · 이익 신호 꺾임 + 평균 이익 기준 고평가</small></h2><div class="b">${idea((o.ideas||{}).avoid||[],'종목')}</div></div>
   ${(o.squeeze||[]).length?`<div class="p c12"><h2>숏스퀴즈 후보<small>공매도 잔고 1% 이상 + 이익 드라이버 양호 · 반등 시 되사기 압력</small></h2><div class="b"><table><tr><th class="l">종목</th><th class="l">테마</th><th>잔고 비중</th><th>20일 변화</th><th>드라이버</th><th>20D</th></tr>${o.squeeze.map(x=>`<tr><td class="l am sym" data-sym="${esc(x.s)}" data-mk="KR">${esc(x.n)}</td><td class="l mu">${esc(x.g)}</td><td>${x.ratio.toFixed(2)}%</td><td>${x.chg20!=null?(x.chg20>0?'+':'')+x.chg20.toFixed(2)+'%p':'—'}</td><td style="color:${col(x.drv)}">${sg(x.drv)}</td><td>${pct(x.r20,0)}</td></tr>`).join('')}</table><div class="mu" style="font-size:11px;margin-top:4px">숏스퀴즈는 반등의 방아쇠가 있어야 일어남. 잔고가 많다는 건 하락 베팅이 강하다는 뜻이기도 함.</div></div></div>`:''}
   <div class="p c12"><h2>이번 주 이벤트 · 검증 현황</h2><div class="b" style="line-height:1.8;white-space:normal">
     ${(o.events||[]).map(e=>`<div>${esc(e.date.slice(5))} ${e.imp>=3?'⭐':''} ${esc(e.name)} <span class="mu" style="font-size:11px">${esc(e.note||'')}</span></div>`).join('')||'<div class="mu">7일 내 주요 이벤트 없음</div>'}
     <div style="margin-top:6px" class="mu">시그널 판정: ${Object.entries(o.validation||{}).map(([k,v])=>`${esc(k)} ${esc(v||'')}`).join(' · ')||'—'}</div>
     <div class="mu">회의 성적: ${tr.h5?`매수 후보 5일 초과수익 평균 ${pct(tr.h5.long_avg,1)} (적중 ${Math.round(tr.h5.long_hit*100)}%, ${tr.h5.n}회)`:'기록 시작 — 5거래일 뒤부터 채점'}${tr.brier?` · 시나리오 브라이어 ${tr.brier.avg} (무작위 0.667, 낮을수록 좋음)`:''}</div></div></div>
  </div>`;
}
/* ───── 운용회의 v2 — 멀티매니저 모닝 미팅: 결론 → 탑다운 → 포지셔닝 → 섹터 → 종목 → 아이디어 → 헤지 → 프리모템 → 성적 ───── */
function cmtSec(no,title,sub,body,open){
  return `<details class="p c12 cmts"${open?' open':''}><summary><h2><span>${no}. ${esc(title)}</span><small>${sub||''}</small></h2></summary><div class="b" style="line-height:1.7;white-space:normal;font-size:12.5px">${body}</div></details>`; }
function cmtList(a,cls){ return (a||[]).length?(a||[]).map(x=>`<div class="${cls||''}">• ${esc(x)}</div>`).join(''):''; }
function cmtTbl(head,rows){ return `<div style="overflow-x:auto"><table><tr>${head.map((h,i)=>`<th class="${i===0?'l':''}">${h}</th>`).join('')}</tr>${rows.join('')}</table></div>`; }
function cmtSrcHtml(a){ const g=x=>x==='검증전'?'검증 전':x;
  return (a||[]).map(z=>`<div><b class="${z.side==='agree'?'up':'dn'}">${z.side==='agree'?'＋':'－'}</b> ${esc(z.label)} <span class="tag${z.grade==='F'?' r':z.grade==='검증전'?' b':''}">${esc(g(z.grade))}</span><span class="mu" style="font-size:10.5px">${z.w!=null?' w '+(z.w>0?'+':'')+z.w:''}${z.perf?' · '+esc(z.perf):''}</span></div>`).join('')||'<span class="mu">원천 없음</span>'; }
function cmtBLCard(o){
  const bl=o.bottom_line||{}, c=({red:'var(--dn)',yellow:'var(--amber)',green:'var(--up)'})[bl.light]||'var(--amber)';
  return `<div class="p c12" style="border:2px solid ${c}"><h2 style="color:${c}"><span>${esc(bl.label||'')} · 운용회의 국장${o.session?' · '+esc(o.session):''}</span><small>${esc(o.asof||'')}${bl.prev_stance&&bl.prev_stance!==bl.stance?' · 판정 '+esc(bl.prev_stance)+'→'+esc(bl.stance):bl.stance?' · 판정 '+esc(bl.stance):''}</small></h2>
    <div class="b" style="line-height:1.75;white-space:normal;font-size:13px">${(bl.lines||[]).map((x,i)=>`<div style="margin:2px 0"><b style="color:${c}">${'①②③'[i]||'·'}</b> ${esc(x)}</div>`).join('')}</div></div>`; }
function cmtScenCards(o){
  return `<div style="display:flex;gap:8px;flex-wrap:wrap">${(o.scenarios||[]).map(s=>`<div style="flex:1;min-width:200px;border:1px solid var(--line);padding:8px 10px;line-height:1.6;white-space:normal">
     <div style="display:flex;justify-content:space-between;gap:6px"><b>${esc(s.name)}</b><b class="am" style="font-size:16px">${Math.round((s.prob||0)*100)}%</b></div>
     <div class="mu" style="font-size:11px">${esc(s.def)}</div><div style="font-size:12px;margin-top:4px"><span class="am">전환 신호</span> ${esc(s.trigger)}</div><div style="font-size:12px"><span class="am">행동</span> ${esc(s.action)}</div></div>`).join('')}</div>`; }
/* 기명 점도표 띠 — reports/dotplot.json: 자산마다 데스크 머리글자를 판정 색(매수 초록·중립 회색·매도 빨강)으로. 지수·업종 수준 판단만 */
function dotStripHtml(){
  if(DOT===null){ DOT=false; google.script.run.withSuccessHandler(t=>{try{DOT=JSON.parse(t);}catch(e){DOT={};} if(view==='cmt') render();}).withFailureHandler(()=>{DOT={}; if(view==='cmt') render();}).getDotplot(); return ''; }
  const d=DOT; if(!d||!d.assets) return '';
  const KO={KOSPI:'코스피',SEMI_KR:'반도체(KR)',SPX:'S&P500',US10Y:'미10년(금리↑=매수)'}, INI={'퀀트':'Q','파생':'D','매크로':'M','리스크':'R','애널':'A','CIO':'C','PB':'P','겸이':'G'};
  const col=s=>s==='매수'?'var(--up)':s==='매도'?'var(--dn)':'var(--muted)';
  const rows=Object.keys(KO).filter(a=>d.assets[a]).map(a=>{ const seen={}, dots=[];
    (d.assets[a]||[]).forEach(x=>{ if(seen[x.desk]) return; seen[x.desk]=1;
      dots.push(`<span title="${esc(x.desk+' '+x.stance+x.conv+' · '+(x.reason||''))}" style="display:inline-block;min-width:18px;text-align:center;margin-right:3px;border:1px solid ${col(x.stance)};color:${col(x.stance)};font-weight:${x.conv>=2?'700':'400'};font-size:11px;line-height:16px">${INI[x.desk]||x.desk[0]}</span>`); });
    const c=((d.summary||{})[a]||{}).counts||{}, tg=((d.summary||{})[a]||{}).tags||{}, TK={rates:'금리',regime:'레짐',signal:'신호',valuation:'밸류',risk:'리스크',flows:'수급'};
    const ov=Object.keys(tg).filter(k=>tg[k]>=2).map(k=>(TK[k]||k)+' '+tg[k]).join(' · ');
    return `<tr><td class="l" style="white-space:nowrap">${KO[a]}</td><td class="l">${dots.join('')}</td><td class="l mu" style="font-size:11px;white-space:nowrap"><span class="up">${c['매수']||0}</span>/<span class="mu">${c['중립']||0}</span>/<span class="dn">${c['매도']||0}</span>${ov?' · 겹침 '+esc(ov):''}</td></tr>`; });
  return `<div class="p c12"><h2><span>기명 점도표</span><small>${esc(d.date||'')} · 데스크 머리글자 = 판정 색 (굵게 = 확신 2+) · 매수/중립/매도 · 규칙 기반, 채점은 docs/desk_kb/_scoreboard.md</small></h2><div class="b" style="white-space:normal">${cmtTbl(['자산','Q퀀트 D파생 M매크로 R리스크 A애널 C CIO P PB G겸이','집계'],rows)}</div></div>`; }
function cmtV2Html(o){
  const bl=o.bottom_line||{}, M=o.macro||{}, P=o.positioning||{}, R=o.rotation||{}, B=o.bottom_up||{}, I=o.ideas_top||{}, H=o.hedges||{}, PM=o.premortem||{}, T=o.track||{};
  const col=x=>x==null?'var(--muted)':x>0.15?'var(--up)':x<-0.15?'var(--dn)':'var(--amber)', sg=x=>x==null?'—':(x>0?'+':'')+x.toFixed(2);
  const f0=v=>v==null?'—':Number(v).toLocaleString('ko-KR',{maximumFractionDigits:0});
  const sec=[];
  // 0. 결론 · 오늘의 시계
  const clk=(bl.clock||[]).map(c=>`<tr><td class="l ${c.kind==='이벤트'?'am':'mu'}" style="white-space:nowrap">${esc(c.t)}</td><td class="l" style="white-space:normal">${esc(c.what)}</td></tr>`);
  sec.push(cmtSec(0,'결론 · 오늘의 시계','신호등 = 오늘 행동 필요 / 지켜보기 / 할 일 없음',
    (clk.length?cmtTbl(['시각','무엇'],clk):'<div class="mu">시계 항목 없음</div>')
    +`<div style="margin-top:8px">${(o.head||[]).map(x=>'<div class="mu">• '+esc(x)+'</div>').join('')}</div>`
    +`<div style="margin-top:6px;border:1px solid var(--amber);padding:6px 10px"><b class="am">시나리오</b> ${esc(o.verdict||'')}</div>`,true));
  // 1. 탑다운
  const gl=(M.global||[]).map(g=>`<div${g.big?' class="am"':''}>• ${esc(g.t)}${g.z!=null?` <span class="mu" style="font-size:11px">(${g.z>0?'+':''}${g.z}σ)</span>`:''}</div>`).join('');
  const st=o.stance;
  sec.push(cmtSec(1,'탑다운 · 거시','밤사이 글로벌 → 국내 → 지표 → 레짐 · 시나리오 · 판정',
    `${(M.regime||{}).line?`<div style="margin-bottom:6px"><b class="am">${esc(M.regime.line)}</b></div>`:''}
    <div class="am" style="font-size:11px">무엇이 바뀌었나</div>${cmtList(M.changed)}
    <div class="am" style="font-size:11px;margin-top:6px">밤사이 글로벌 <span class="mu">(σ = 하루 변화 ÷ 60일 평균 변동)</span></div>${gl||'<div class="mu">데이터 없음</div>'}
    <div class="am" style="font-size:11px;margin-top:6px">국내</div>${cmtList(M.domestic)||'<div class="mu">데이터 없음</div>'}
    ${(M.releases||[]).length?`<div class="am" style="font-size:11px;margin-top:6px">지표 발표 (최근 7일)</div>${cmtList(M.releases)}`:''}
    ${(M.upcoming||[]).length?`<div class="am" style="font-size:11px;margin-top:6px">7일 안 매크로 일정</div>${cmtList(M.upcoming)}`:''}
    ${M.summary?`<div class="mu" style="margin-top:6px">${esc(M.summary)}</div>`:''}<div class="mu" style="font-size:11px">${esc(M.note||'')}</div>
    <div class="am" style="font-size:11px;margin-top:10px">운용 시나리오 <span class="mu">확률 = 1999~ 코스피 비슷한 상황 이후 20거래일 (${esc((o.scenario_basis||{}).basis||'')}, ${(o.scenario_basis||{}).n||0}회)</span></div>${cmtScenCards(o)}
    ${st?`<div style="margin-top:10px;border:1px solid ${st.stance==='관망'?'var(--amber)':st.stance==='방어'?'var(--dn)':'var(--up)'};padding:6px 10px"><b class="am">PB 판단 · ${esc(st.stance)}</b> ${esc(st.plan)}</div>${st.basis?`<div style="font-size:12px;border-left:2px solid var(--amber);padding-left:8px;margin:6px 0"><b class="am">판단 시점 ${esc(String(st.basis.at).slice(5))}</b> <span class="mu">${esc(st.basis.src)}</span>${(st.basis.lines||[]).map(x=>'<div>· '+esc(x)+'</div>').join('')}</div>`:''}${(st.reasons||[]).map((r,i)=>`<div style="margin:4px 0"><b>${i+1}. ${esc(r.t)}</b><div class="mu" style="font-size:12px">${esc(r.d)}</div></div>`).join('')}`:''}`,false));
  // 2. 크로스에셋 · 포지셔닝
  const sh=(P.shorts||[]).map(x=>`<tr><td class="l am sym" data-sym="${esc(x.s)}" data-mk="KR">${esc(x.n)}</td><td class="l mu">${esc(x.g||'')}</td><td>${x.ratio.toFixed(2)}%</td><td>${x.chg20!=null?(x.chg20>0?'+':'')+x.chg20.toFixed(2)+'%p':'—'}</td></tr>`);
  sec.push(cmtSec(2,'크로스에셋 · 포지셔닝','현물 수급 · 프로그램 · 선물 · 옵션 내재 변동 · 공매도',
    `${P.worry?`<div style="border:1px solid var(--amber);padding:6px 10px;margin-bottom:6px"><b class="am">${esc(P.worry)}</b></div>`:''}${cmtList(P.lines)}
    ${sh.length?`<div class="am" style="font-size:11px;margin-top:8px">공매도 잔고 상위 (시총 1조+, ${esc((P.shorts[0]||{}).asof||'')})</div>${cmtTbl(['종목','테마','잔고 비중','20일 변화'],sh)}`:''}
    <div class="mu" style="font-size:11px;margin-top:4px">${esc(P.note||'')}</div>${o.derivs?derivPanel(o.derivs):''}`,false));
  // 3. 섹터 로테이션
  const tl=a=>(a||[]).map(t=>`${esc(t.theme)} ${pct(t.r5,1)}`).join(' · ')||'—';

  return `<div class="ovl" style="padding:8px 8px 0;display:flex;gap:6px;align-items:center;flex-wrap:wrap">${['KR','US'].map(k=>`<button data-cmk="${k}" class="${CMK===k?'on':''}">${k==='KR'?'국장':'미장'}</button>`).join('')}
    ${days.length?`<span class="mu" style="font-size:12px;margin-left:8px">지난 회의</span><button data-cstep="1" class="sbtn">◀</button><select id="csel" style="background:#050505;color:var(--txt);border:1px solid var(--line);font:inherit;padding:4px 6px;max-width:60vw"><option value="latest" ${!sel?'selected':''}>최신</option>${days.map(x=>`<option value="${esc(x.id||x.date)}" ${sel===(x.id||x.date)?'selected':''}>${esc(x.date)}${x.session?' '+esc(x.session):''} · ${esc(String(x.headline||'').slice(0,32))}</option>`).join('')}</select><button data-cstep="-1" class="sbtn">▶</button>${sel?`<span class="am" style="font-size:12px">${esc(sel)} 기록</span>`:''}`:''}</div>`; }
function execHtml(e){const f=(v,d=0)=>v==null?'—':Number(v).toLocaleString('ko-KR',{maximumFractionDigits:d});return `<div class="p c12"><h2>실행 대본<small>${esc(e.book||'')}</small></h2><div class="b" style="line-height:1.7;white-space:normal"><div style="margin-bottom:6px">${(e.signals||[]).map(g=>`<div>${g.ok?'<b class="up">■ 충족</b>':'<span class="mu">□ 미충족</span>'} ${esc(g.t)} <span class="mu">— 현재 ${esc(g.now)}</span></div>`).join('')}</div><table><tr><th class="l">언제</th><th class="l">무엇을</th><th class="l">왜</th></tr>${(e.steps||[]).map((s,i)=>`<tr><td class="l"><b>${i+1}.</b> ${esc(s.when)}</td><td class="l">${esc(s.do)}</td><td class="l mu" style="font-size:12px">${esc(s.why)}</td></tr>`).join('')}</table>${(e.cands||[]).length?`<h3 style="margin:8px 0 4px;font-size:13px">1차 후보 (비반도체)</h3><table><tr><th class="l">종목</th><th>종가</th><th>손절</th><th>손절폭</th><th>목표(2R)</th><th>1차 비중</th><th>ATR</th></tr>${e.cands.map(c=>`<tr><td class="l">${esc(c.n)}</td><td>${f(c.close)}</td><td class="dn">${f(c.stop)}</td><td>${(-c.stop_pct*100).toFixed(1)}%</td><td class="up">${f(c.target)}</td><td><b>${(c.size_1st*100).toFixed(1)}%</b></td><td class="mu">${(c.atr_pct*100).toFixed(1)}%</td></tr>`).join('')}</table>`:''}<div style="margin-top:6px" class="dn">✖ ${(e.dont||[]).map(esc).join(' · ')}</div><div class="mu" style="font-size:11px;margin-top:4px">${esc(e.note||'')}</div></div></div>`}
function cmtUSView(){
  if(CMTU===null){ CMTU=false; google.script.run.withSuccessHandler(t=>{try{CMTU=JSON.parse(t);}catch(e){CMTU={};} if(view==='cmt') render();}).withFailureHandler(()=>{CMTU={};if(view==='cmt') render();}).getCommitteeUS(); return '<div class="load">LOADING …</div>'; }
  const o=CMTU; if(!o||!o.scenarios) return cmtTabs()+'<div class="grid"><div class="p c12"><div class="b mu">미장 운용회의 자료 생성 전</div></div></div>';
  const col=x=>x==null?'var(--muted)':x>0.15?'var(--up)':x<-0.15?'var(--dn)':'var(--amber)', sg=x=>x==null?'—':(x>0?'+':'')+x.toFixed(2);
  const sc=o.scenarios.map(s=>`<div style="flex:1;min-width:220px;border:1px solid var(--line);padding:8px 10px;line-height:1.6;white-space:normal"><div style="display:flex;justify-content:space-between"><b>${esc(s.name)}</b><b class="am" style="font-size:16px">${Math.round((s.prob||0)*100)}%</b></div><div class="mu" style="font-size:11px">${esc(s.def)}</div><div style="font-size:12px;margin-top:4px"><span class="am">전환 신호</span> ${esc(s.trigger)}</div><div style="font-size:12px"><span class="am">행동</span> ${esc(s.action)}</div></div>`).join('');
  const idea=a=>a.length?`<table><tr><th class="l">종목</th><th class="l">섹터</th><th>드라이버</th><th>5D</th><th>20D</th></tr>${a.map(x=>`<tr><td class="l am sym" data-sym="${esc(x.s)}" data-mk="US">${esc(x.s)} <span class="mu">${esc(shortNm(x.n))}</span></td><td class="l mu">${esc(x.g)}</td><td style="color:${col(x.drv)}">${sg(x.drv)}</td><td>${pct(x.r5,1)}</td><td>${pct(x.r20,0)}</td></tr>`).join('')}</table>`:'<div class="mu">해당 없음</div>';
  return cmtTabs()+`<div class="grid">
   <div class="p c12"><h2>운용회의 · 미장<small>${esc(o.asof)} · 규칙 기반 · 검증 중</small></h2><div class="b" style="line-height:1.8;white-space:normal">${(o.head||[]).map(x=>'<div>• '+esc(x)+'</div>').join('')}<div style="margin-top:6px;border:1px solid var(--amber);padding:6px 10px"><b class="am">결론</b> ${esc(o.verdict)}</div><div class="mu" style="font-size:12px;margin-top:4px">🔗 ${esc(o.kr_link||'')}</div></div></div>
   <div class="p c12"><h2>운용 시나리오<small>S&P500 1999~ 비슷한 상황 이후 20거래일 · 기준 ±3%</small></h2><div class="b"><div style="display:flex;gap:8px;flex-wrap:wrap">${sc}</div></div></div>
   <div class="p c6"><h2>섹터 의견<small>이익 드라이버 평균 · 시총 가중 수익률</small></h2><div class="b"><table><tr><th class="l">섹터</th><th>드라이버</th><th>5D</th><th>20D</th><th class="l">의견</th></tr>${(o.sectors||[]).map(x=>`<tr><td class="l">${esc(x.sector)}</td><td style="color:${col(x.drv)}">${sg(x.drv)}</td><td>${pct(x.r5,1)}</td><td>${pct(x.r20,1)}</td><td class="l ${x.stance==='비중 확대'?'up':x.stance==='비중 축소'?'dn':'mu'}">${x.stance}</td></tr>`).join('')}</table></div></div>
   <div class="p c6"><h2>매수 후보<small>검증 전 후보 · EPS 추정 상향 강함 + 최근 눌림</small></h2><div class="b">${idea((o.ideas||{}).long||[])}</div><h2>회피<small>검증 전 후보 · 추정 하향 + 최근 급등</small></h2><div class="b">${idea((o.ideas||{}).avoid||[])}</div></div>
   <div class="p c12"><h2>10일 이벤트</h2><div class="b" style="line-height:1.8;white-space:normal">${(o.events||[]).map(e=>`<div>${esc(e.date.slice(5))} ${e.imp>=3?'⭐':''} ${esc(e.name)} <span class="mu" style="font-size:11px">${esc(e.note||'')}</span></div>`).join('')||'<div class="mu">없음</div>'}</div></div></div>`;
}
</script>
