<!-- tab_committee.html — DAILY › 운용회의 — v1/v2 회의록·기명 점도표 띠·파생 패널·미장 회의·지난 회의 (cmtView·dotStripHtml·cmtUSView).
     apps-script/Index.html 이 include('tab_committee') 템플릿 태그로 끼워 넣는다 (GAS 는 HtmlService include, Pages 는 scripts/build_pages.py 가 인라인).
     전역 도우미($·esc·num·pct·render·setView·openDetail 등)는 Index.html 에 있다. -->
<script>

let IDEA_TRACKING=null;
function ideaTrackingBox(mk){
  if(IDEA_TRACKING===null){
    IDEA_TRACKING={loading:true};
    fetch('https://hk99915-bot.github.io/market-screener/reports/idea_tracking.json',{cache:'no-store'})
      .then(r=>{if(!r.ok) throw Error('tracking'); return r.json();})
      .then(d=>{IDEA_TRACKING=d; render();})
      .catch(()=>{IDEA_TRACKING={error:true}; render();});
  }
  if(IDEA_TRACKING.loading) return '<div class="mu">아이디어 추적 불러오는 중…</div>';
  if(IDEA_TRACKING.error) return '<div class="am">아이디어 추적 자료 확인 필요 — 새로고침 후 확인</div>';
  return ideaTrackingHtml(IDEA_TRACKING,mk||'KR');
}
function ideaTrackingHtml(d,mk){
  mk=mk||'KR'; const rowsM=(d.rows||[]).filter(r=>(r.market||'KR')===mk), us=mk==='US';
  const labels={waiting:'진입 대기',not_entered:'미진입',open:'보유 중',target:'목표 종료',stop:'종가 손절',timeout:'시간 손절',expired:'미진입 만료',ambiguous:'동일일 목표·손절 — 판정 보류',review:'검증 보류'};
  const f=v=>Number.isFinite(v)?num(v,us?2:0):'—';
  const pctv=v=>Number.isFinite(v)?(v>0?'+':'')+(v*100).toFixed(2)+'%':'—';
  const stats=(d.summary_by_market||{})[mk]||(mk==='KR'?d.summary||{}:{});
  return '<div style="border-top:1px solid var(--line);margin-top:12px;padding-top:8px"><b>'+(us?'미장 ':'')+'아이디어 일별 추적 · 모의</b>'+
    '<div class="mu" style="font-size:var(--fs-1)">갱신 '+esc(d.asof||'')+' KST · 종료 '+f(stats.closed)+'건 · 종료 적중률 '+pctv(stats.hit_rate)+' · 종료 평균손익 '+pctv(stats.avg_return)+' · 미진입률 '+pctv(stats.no_entry_rate)+' (진입 여부 확인 '+f(stats.resolved)+'건 기준)</div>'+
    '<div style="overflow-x:auto"><table><tr><th>제안일 · 종목</th><th>원래 진입 구간</th><th>원래 손절 / 목표</th><th>상태</th><th>모의 진입 / 평가</th><th>가격 기준일</th><th>비용 후 손익</th></tr>'+
    (rowsM.length?'':'<tr><td colspan="7" class="mu">아직 기록 없음 — 다음 회의부터 진입 규칙대로 추적</td></tr>')+
    [...rowsM].reverse().slice(0,us?20:60).map(r=>{const p=r.original||{},s=r.state||{};return '<tr><td>'+esc(r.date)+' · '+esc(r.name)+'</td><td>'+f(p.entry)+'~'+f(p.entry_max)+'</td><td>'+f(p.stop)+' / '+f(p.target)+'</td><td>'+esc(labels[s.status]||'검증 보류')+'</td><td>'+f(s.entry_price)+' / '+f(s.mark_price)+'</td><td>'+esc(s.price_date||'—')+'</td><td class="'+(s.ret>=0?'up':'dn')+'">'+pctv(s.ret)+'</td></tr>'+
      '<tr><td colspan="7" class="l mu" style="font-size:var(--fs-1);white-space:normal">'+esc(s.reason||s.source_check||p.status||'')+
      ' · 최초 기록 '+esc(r.proposed_at||'')+' · '+esc((p.catalyst||[]).map(x=>x.what).join(' / ')||'촉매 미기록')+
      (p.kill?' · '+esc(p.kill.join(' / ')):'')+'</td></tr>';}).join('')+'</table></div>'+
    '<div class="mu" style="font-size:var(--fs-1);white-space:normal">'+esc(d.policy||'')+' · 진행 중·판정 보류는 종료 적중률에서 제외. 과거 원천별 성적표와 별도 집계.</div></div>';
}

/* 매수 후보 '연속 N일째'·신규 배지 (표시만, req-dev-42019d08 — screener/streak.py) */
function stkTag(x){ if(x.new) return ' <span class="tag" style="color:var(--up);border-color:var(--up)">신규</span>'; return (x.streak||0)>=2?` <span class="mu" style="font-size:var(--fs-1)">${x.streak}일째</span>`:''; }
function stkLine(o){ const z=o.ideas_streak||{}; return z.line?`<div class="${(z.new||[]).length?'mu':'am'}" style="font-size:var(--fs-1)">${esc(z.line)}</div>`:''; }
/* 트레이드 아이디어 카드 (국장 ideas_top · 미장 ideas_top 공용, 10/20 us-entry-ideas) */
function ideaCardHtml(x,mk){
  const d=mk==='US'?2:0, f0=v=>v==null?'—':Number(v).toLocaleString('ko-KR',{maximumFractionDigits:d,minimumFractionDigits:d}), go=String(x.status).startsWith('실행');
  return `<div style="flex:1;min-width:240px;max-width:100%;border:1px solid ${go?'var(--up)':'var(--line)'};padding:8px 10px;white-space:normal">
     <div style="display:flex;justify-content:space-between;gap:6px"><b><span class="am sym" data-sym="${esc(x.s)}" data-mk="${mk}">${esc(mk==='US'?x.s:x.n)}</span>${mk==='US'?` <span class="mu" style="font-size:var(--fs-1)">${esc(shortNm(x.n||''))}</span>`:''} ${esc(x.side)}</b><span class="${go?'up':'mu'}" style="font-size:var(--fs-1)">${esc(x.status)}</span></div>
     <div style="font-size:var(--fs-2)">확신도 <b>${esc(x.conv)}</b> · 사이즈 <b class="am">${(x.size*100).toFixed(1)}%</b> <span class="mu">(모델 북)</span> · ${x.payoff.toFixed(1)}R</div>
     <div style="font-size:var(--fs-2)">진입 ${f0(x.entry)}~${f0(x.entry_max)} · 손절 <span class="dn">${f0(x.stop)}</span> (${(-x.stop_pct*100).toFixed(1)}%) · 목표 <span class="up">${f0(x.target)}</span></div>
     <div style="font-size:var(--fs-2)"><span class="am">촉매</span> ${(x.catalyst||[]).map(c=>esc(String(c.date).slice(5)+' '+c.what)).join(' · ')||'<span class="mu">없음 → 대기</span>'}</div>
     <div style="font-size:var(--fs-2)"><span class="dn">kill</span> ${(x.kill||[]).map(esc).join(' / ')}</div>
     <div style="font-size:var(--fs-1);margin-top:3px">${cmtSrcHtml(x.sources)}</div>${x.score!=null?`<div class="mu" style="font-size:var(--fs-1)">확신 점수 ${x.score}</div>`:''}</div>`;
}
/* 신호 종목 forward 성과 (reports/signal_tracking.json — screener/signal_tracking.py, 10/20) */
let SIGTRK=null;
function sigTrackBox(mk){
  if(SIGTRK===null){ SIGTRK={loading:true};
    fetch('https://hk99915-bot.github.io/market-screener/reports/signal_tracking.json',{cache:'no-store'})
      .then(r=>{if(!r.ok) throw Error('sigtrk'); return r.json();}).then(d=>{SIGTRK=d; if(view==='cmt') render();})
      .catch(()=>{SIGTRK={error:true}; if(view==='cmt') render();}); }
  if(SIGTRK.loading) return '<div class="mu">신호 성과 불러오는 중…</div>';
  if(SIGTRK.error) return '<div class="am">신호 성과 자료 없음 — 다음 회의 생성 후</div>';
  const d=SIGTRK, src=new Set((d.sources||[]).filter(s=>s.tracked&&s.market===mk).map(s=>s.src));
  const pc=v=>v==null?'—':(v>0?'+':'')+(v*100).toFixed(1)+'%';
  const cell=h=>h?`<td class="${h.avg_ex>=0?'up':'dn'}">${pc(h.avg_ex)}</td><td class="mu">${Math.round(h.hit*100)}% · ${h.n}</td>`:'<td class="mu">대기</td><td class="mu">—</td>';
  const rows=(d.by_tag||[]).filter(t=>src.has(t.src)).map(t=>`<tr><td class="l">${esc(t.src)} · ${esc(t.label)}${t.side<0?' <span class="dn" style="font-size:var(--fs-1)">약세</span>':''}</td><td>${t.n_events}</td>${cell(t.h5)}${cell(t.h20)}${cell(t.h60)}</tr>`);
  const oc=d.origin_counts||{};
  return `<div style="border-top:1px solid var(--line);margin-top:10px;padding-top:8px"><b>신호 종목 성과 · 신호일 이후 시장 중앙값 대비</b>
    <div class="mu" style="font-size:var(--fs-1)">갱신 ${esc(d.generated_at||'')} · 첫 기록 ${esc(d.first||'—')} · 실시간 ${oc.live??0} · 게시본 복원 ${(oc.archive||0)+(oc.git||0)} · 사후 재계산 ${oc.recompute??0}</div>
    ${rows.length?cmtTbl(['원천 · 신호','건수','5일 초과','적중·n','20일 초과','적중·n','60일 초과','적중·n'],rows):'<div class="mu">추적 신호 없음</div>'}
    <div class="mu" style="font-size:var(--fs-1);white-space:normal">${esc(d.policy||'')}</div></div>`;
}
let CMT=null, CMTU=null, CMK='KR', DOT=null;
function cmtView(){
  if(CMK==='US') return cmtUSView();
  if(CMT===null){ CMT=false; google.script.run.withSuccessHandler(t=>{try{CMT=JSON.parse(t);}catch(e){CMT={};} if(view==='cmt') render();}).withFailureHandler(()=>{CMT={};if(view==='cmt') render();}).getCommittee(); return '<div class="load">LOADING …</div>'; }
  const o=CMT; if(!o||!o.scenarios) return cmtTabs()+'<div class="grid"><div class="p c12"><div class="b mu">운용회의 자료 생성 전</div></div></div>';
  if(o.bottom_line) return cmtTabs()+cmtV2Html(o);
  return cmtTabs()+cmtLegacyHtml(o);
}
/* 예전 형식(v1) 운용회의 — 지난 회의 기록(bottom_line 없음)을 열 때 */
function cmtLegacyHtml(o){
  const col=x=>x==null?'var(--muted)':x>0.15?'var(--up)':x<-0.15?'var(--dn)':'var(--amber)', sg=x=>x==null?'—':(x>0?'+':'')+x.toFixed(2);
  const sc=o.scenarios.map(s=>`<div style="flex:1;min-width:220px;border:1px solid var(--line);padding:8px 10px;line-height:1.6;white-space:normal">
     <div style="display:flex;justify-content:space-between"><b>${esc(s.name)}</b><b class="am" style="font-size:var(--fs-4)">${Math.round((s.prob||0)*100)}%</b></div>
     <div class="mu" style="font-size:var(--fs-1)">${esc(s.def)}</div><div style="font-size:var(--fs-2);margin-top:4px"><span class="am">전환 신호</span> ${esc(s.trigger)}</div><div style="font-size:var(--fs-2)"><span class="am">행동</span> ${esc(s.action)}</div></div>`).join('');
  const idea=(a,t)=>a.length?`<table><tr><th class="l">${t}</th><th class="l">테마</th><th>드라이버</th><th>정상화 괴리</th><th>20D</th><th>PBR</th></tr>${a.map(x=>`<tr><td class="l am sym" data-sym="${esc(x.s)}" data-mk="KR">${esc(x.n)}${x.semi?' <span class="tag">반도체</span>':''}</td><td class="l mu">${esc(x.g)}</td><td style="color:${col(x.drv)}">${sg(x.drv)}</td><td>${pct(x.nor,0)}</td><td>${pct(x.r20,0)}</td><td class="mu">${x.pbr??'—'}</td></tr>`).join('')}</table>`:'<div class="mu">해당 없음</div>';
  const tr=(o.track||{}).summary||{};
  return `<div class="grid">
   <div class="p c12"><h2>운용회의 · 국장${o.session?' · '+esc(o.session):''}<small>${esc(o.asof)} · 규칙 기반 · 검증 중</small></h2><div class="b" style="line-height:1.8;white-space:normal">${(o.head||[]).map(x=>'<div>• '+esc(x)+'</div>').join('')}<div style="margin-top:6px;border:1px solid var(--amber);padding:6px 10px"><b class="am">결론</b> ${esc(o.verdict)}</div></div></div>
   <div class="p c12"><h2>운용 시나리오<small>확률 = 1999~ 코스피 비슷한 상황 이후 20거래일 결과 분포 (${esc((o.scenario_basis||{}).basis||'')}, ${(o.scenario_basis||{}).n||0}회${(o.scenario_basis||{}).n_indep_range?' · 겹치지 않는 20일 블록 약 '+(o.scenario_basis.n_indep_range.lo===o.scenario_basis.n_indep_range.hi?o.scenario_basis.n_indep_range.lo:o.scenario_basis.n_indep_range.lo+'~'+o.scenario_basis.n_indep_range.hi)+'개':(o.scenario_basis||{}).n_indep!=null?' · 겹치지 않는 20일 블록 '+o.scenario_basis.n_indep+'개':''})</small></h2><div class="b"><div style="display:flex;gap:8px;flex-wrap:wrap">${sc}</div></div></div>
   ${o.stance?`<div class="p c12"><h2>PB 판단 · ${esc(o.stance.stance)}<small>확률 = 방향, 신호 = 타이밍 — 왜 이렇게 결정했나</small></h2><div class="b" style="line-height:1.7;white-space:normal"><div style="border:1px solid ${o.stance.stance==='관망'?'var(--amber)':o.stance.stance==='방어'?'var(--dn)':'var(--up)'};padding:6px 10px;margin-bottom:8px"><b class="am">${esc(o.stance.stance)}</b> ${esc(o.stance.plan)}</div>${o.stance.basis?`<div style="font-size:var(--fs-2);border-left:2px solid var(--amber);padding-left:8px;margin-bottom:8px"><b class="am">판단 시점 ${esc(String(o.stance.basis.at).slice(5))}</b> <span class="mu">${esc(o.stance.basis.src)} — 이 숫자를 보고 결정했어요. 아래 근거 숫자는 회의 생성 시각(${esc(o.asof)}) 기준</span>${o.stance.basis.lines.map(x=>'<div>· '+esc(x)+'</div>').join('')}</div>`:''}${o.stance.reasons.map((r,i)=>`<div style="margin:4px 0"><b>${i+1}. ${esc(r.t)}</b><div class="mu" style="font-size:var(--fs-2)">${esc(r.d)}</div></div>`).join('')}</div></div>${o.stance.exec?execHtml(o.stance.exec):''}`:''}
   ${o.derivs?derivPanel(o.derivs):''}
   <div class="p c6"><h2>업종 의견<small>공급망 체인 점수</small></h2><div class="b"><table>${(o.sectors||[]).map(r=>`<tr><td class="l">${esc(r.chain)}</td><td style="color:${col(r.score)}">${sg(r.score)}</td><td class="l ${r.stance==='비중 확대'?'up':r.stance==='비중 축소'?'dn':'mu'}">${r.stance}</td></tr>`).join('')}</table></div></div>
   <div class="p c6"><h2>테마 온도<small>드라이버 평균 상·하위 · 시총 가중 수익률</small></h2><div class="b"><table><tr><th class="l">테마</th><th>드라이버</th><th>5D</th><th>20D</th></tr>${(o.themes||[]).map(t=>`<tr><td class="l">${esc(t.theme)}</td><td style="color:${col(t.drv)}">${sg(t.drv)}</td><td>${pct(t.r5,1)}</td><td>${pct(t.r20,1)}</td></tr>`).join('')}</table></div></div>
   <div class="p c6"><h2>매수 후보<small>검증 전 후보 · 이익 신호 강함 + 평균 이익 기준 저평가 + 20일 −10% 이상 하락</small></h2><div class="b">${idea((o.ideas||{}).long||[],'종목')}</div></div>
   <div class="p c6"><h2>회피<small>검증 전 후보 · 이익 신호 꺾임 + 평균 이익 기준 고평가</small></h2><div class="b">${idea((o.ideas||{}).avoid||[],'종목')}</div></div>
   ${(o.squeeze||[]).length?`<div class="p c12"><h2>숏스퀴즈 후보<small>공매도 잔고 1% 이상 + 이익 드라이버 양호 · 반등 시 되사기 압력</small></h2><div class="b"><table><tr><th class="l">종목</th><th class="l">테마</th><th>잔고 비중</th><th>20일 변화</th><th>드라이버</th><th>20D</th></tr>${o.squeeze.map(x=>`<tr><td class="l am sym" data-sym="${esc(x.s)}" data-mk="KR">${esc(x.n)}</td><td class="l mu">${esc(x.g)}</td><td>${x.ratio.toFixed(2)}%</td><td>${x.chg20!=null?(x.chg20>0?'+':'')+x.chg20.toFixed(2)+'%p':'—'}</td><td style="color:${col(x.drv)}">${sg(x.drv)}</td><td>${pct(x.r20,0)}</td></tr>`).join('')}</table><div class="mu" style="font-size:var(--fs-1);margin-top:4px">숏스퀴즈는 반등의 방아쇠가 있어야 일어남. 잔고가 많다는 건 하락 베팅이 강하다는 뜻이기도 함.</div></div></div>`:''}
   <div class="p c12"><h2>이번 주 이벤트 · 검증 현황</h2><div class="b" style="line-height:1.8;white-space:normal">
     ${(o.events||[]).map(e=>`<div>${esc(e.date.slice(5))} ${e.imp>=3?'⭐':''} ${esc(e.name)} <span class="mu" style="font-size:var(--fs-1)">${esc(e.note||'')}</span></div>`).join('')||'<div class="mu">7일 내 주요 이벤트 없음</div>'}
     <div style="margin-top:6px" class="mu">시그널 판정: ${Object.entries(o.validation||{}).map(([k,v])=>`${esc(k)} ${esc(v||'')}`).join(' · ')||'—'}</div>
     <div class="mu">회의 성적: ${tr.h5?`매수 후보 5일 초과수익 평균 ${pct(tr.h5.long_avg,1)} (적중 ${Math.round(tr.h5.long_hit*100)}%, ${tr.h5.n}회)`:'기록 시작 — 5거래일 뒤부터 채점'}${tr.brier?` · 시나리오 브라이어 ${tr.brier.avg} (무작위 0.667, 낮을수록 좋음)`:''}</div></div></div>
  </div>`;
}
/* ───── 운용회의 v2 — 멀티매니저 모닝 미팅: 결론 → 탑다운 → 포지셔닝 → 섹터 → 종목 → 아이디어 → 헤지 → 프리모템 → 성적 ───── */
function cmtSec(no,title,sub,body,open){
  return `<details class="p c12 cmts"${open?' open':''}><summary><h2><span>${no}. ${esc(title)}</span><small>${sub||''}</small></h2></summary><div class="b" style="line-height:1.7;white-space:normal;font-size:var(--fs-2)">${body}</div></details>`; }
function cmtList(a,cls){ return (a||[]).length?(a||[]).map(x=>`<div class="${cls||''}">• ${esc(x)}</div>`).join(''):''; }
function cmtTbl(head,rows){ return `<div style="overflow-x:auto"><table><tr>${head.map((h,i)=>`<th class="${i===0?'l':''}">${h}</th>`).join('')}</tr>${rows.join('')}</table></div>`; }
function cmtSrcHtml(a){ const g=x=>x==='검증전'?'검증 전':x;
  return (a||[]).map(z=>`<div><b class="${z.side==='agree'?'v-ok':'v-bad'}">${z.side==='agree'?'＋':'－'}</b> ${esc(z.label)} <span class="tag${z.grade==='F'?' r':z.grade==='검증전'?' b':''}">${esc(g(z.grade))}</span><span class="mu" style="font-size:var(--fs-1)">${z.w!=null?' w '+(z.w>0?'+':'')+z.w:''}${z.perf?' · '+esc(z.perf):''}</span></div>`).join('')||'<span class="mu">원천 없음</span>'; }
function cmtBLCard(o){
  const bl=o.bottom_line||{}, c=({red:'var(--bad)',yellow:'var(--amber)',green:'var(--ok)'})[bl.light]||'var(--amber)';
