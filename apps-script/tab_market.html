<!-- tab_market.html — MARKET 탭 — KR/US 시장 패널·히트맵·전종목 MD 뷰 (marketView·heatView·mdView).
     apps-script/Index.html 이 include('tab_market') 템플릿 태그로 끼워 넣는다 (GAS 는 HtmlService include, Pages 는 scripts/build_pages.py 가 인라인).
     전역 도우미($·esc·num·pct·render·setView·openDetail 등)는 Index.html 에 있다. -->
<script>
/* ───── 토스 시세(toss-live 브랜치 live.json — 겸이 노트북 10분 수집·publish, 10/21) ─────
   신선하면 토스, 아니면 기존(네이버/야후/KRX). 신선도 규칙은 screener/toss_live.py 와 같다(바꾸면 둘 다):
   장중 = asof 20분 이내 · 장 밖 = 날짜 ≥ 마지막 KR 거래일(live.json trade_date). raw CDN 캐시 최대 5분 → 캐시버스터 쿼리. */
const TOSS_BASE='https://raw.githubusercontent.com/hk99915-bot/market-screener/toss-live/', TOSS_MAX_MIN=20;
let TOSS=null, TOSS_XC=null, TOSS_T=0, TOSS_ERR='';
function tossLoad(cb){
  if(Date.now()-TOSS_T<60e3){ cb&&cb(); return; } TOSS_T=Date.now();
  const g=f=>fetch(TOSS_BASE+f+'?t='+Date.now(),{cache:'no-store'}).then(r=>r.ok?r.json():Promise.reject(new Error('HTTP '+r.status)));
  Promise.all([g('live.json').then(j=>{TOSS=(j&&j.source==='toss')?j:null; TOSS_ERR=TOSS?'':'형식 오류';}).catch(e=>{TOSS=null; TOSS_ERR=String(e&&e.message||e);}),
               g('crosscheck.json').then(j=>{TOSS_XC=j;}).catch(()=>{TOSS_XC=null;})])
   .then(()=>{ const el=document.getElementById('tossbox'); if(el) el.innerHTML=tossBox(); const eu=document.getElementById('tossusbox'); if(eu) eu.innerHTML=tossUsBox(); cb&&cb(); });
}
function tossInSession(){ if(L&&L.session) return L.session==='LIVE';
  const k=new Date(Date.now()+9*3600e3), wd=k.getUTCDay(), m=k.getUTCHours()*60+k.getUTCMinutes(); return wd>=1&&wd<=5&&m>=540&&m<930; }
function tossAgeMin(ts){ const t=Date.parse(ts||''); return isNaN(t)?null:(Date.now()-t)/60e3; }
function tossExpDay(){ return (L&&L.trade_date)||new Date(Date.now()+9*3600e3).toISOString().slice(0,10); }
function tossFresh(ts){ if(!ts) return false; if(tossInSession()){ const a=tossAgeMin(ts); return a!=null&&a<=TOSS_MAX_MIN; } return String(ts).slice(0,10)>=tossExpDay(); }
function srcBadge(src,ts){ const lab={toss:'토스',naver:'네이버',yahoo:'야후',krx:'KRX'}[src]||src||'—', a=src==='toss'?tossAgeMin(ts):null;
  const when=a==null?'':a<90?` · ${Math.max(0,Math.round(a))}분 전`:` · ${esc(String(ts).slice(5,16).replace('T',' '))}`;
  return `<span title="출처 ${esc(lab)}${ts?' · asof '+esc(ts):''}" style="display:inline-block;border:1px solid ${src==='toss'?'var(--amber)':'var(--line)'};color:${src==='toss'?'var(--amber)':'var(--muted)'};border-radius:3px;padding:0 4px;font-size:var(--fs-1);margin-left:4px">${esc(lab)}${when}</span>`; }
/* 표시값 고르기: 토스가 신선하면 토스, 아니면 live.json 항목(서버가 이미 토스로 덮었을 수도 — src 그대로 표시) */
function tossPick(k){
  const o=(L&&L.items||[]).find(x=>x.key===k), t=TOSS&&(k==='USDKRW'?(TOSS.fx||{}).USDKRW:(TOSS.indices||{})[k]), tv=t&&(k==='USDKRW'?t.mid:t.last);
  if(tv!=null&&tossFresh(t.asof)){ const pc=t.prev_close||(o&&o.chg!=null&&o.last?o.last/(1+o.chg):null); return {v:tv,c:pc?tv/pc-1:null,src:'toss',ts:t.asof}; }
  return o?{v:o.last,c:o.chg,src:o.src,ts:o.asof||(L&&L.asof)}:null; }
function tossSpark(bars,w,h){ if(!bars||bars.length<2) return '<span class="mu">봉 없음</span>';
  const C=bars.map(b=>b[4]), lo=Math.min(...bars.map(b=>b[3])), hi=Math.max(...bars.map(b=>b[2])), rg=(hi-lo)||1, n=bars.length;
  const pts=C.map((c,i)=>`${(i/(n-1)*w).toFixed(1)},${(h-2-(c-lo)/rg*(h-4)).toFixed(1)}`).join(' '), up=C[n-1]>=bars[0][1];
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" preserveAspectRatio="none" role="img" aria-label="장중 1분봉 종가 ${esc(bars[0][0])}~${esc(bars[n-1][0])}"><polyline fill="none" stroke="${up?'var(--up)':'var(--dn)'}" stroke-width="1.5" vector-effect="non-scaling-stroke" points="${pts}"/></svg><div class="mu" style="font-size:var(--fs-1);display:flex;justify-content:space-between"><span>${esc(bars[0][0])} 시 ${num(bars[0][1],2)}</span><span>고 ${num(hi,2)} · 저 ${num(lo,2)}</span><span>${esc(bars[n-1][0])} ${num(C[n-1],2)}</span></div>`; }
function tossBox(){
  const T=TOSS, sg=v=>v==null?'—':`<span class="${v>0?'up':v<0?'dn':'mu'}">${v>0?'+':''}${Number(v).toLocaleString('ko-KR',{maximumFractionDigits:0})}</span>`;
  let h='';
  if(!T) h+=`<div class="am" style="margin-bottom:6px">토스 데이터 못 읽음(${esc(TOSS_ERR||'로딩 중')}) — 아래 값은 기존 소스(네이버·야후)</div>`;
  else { const a=tossAgeMin(T.published_at||T.generated_at), ok=tossFresh(T.asof);
    h+=`<div class="mu" style="font-size:var(--fs-2);margin-bottom:6px">토스 asof ${esc(String(T.asof||'').slice(5,16).replace('T',' '))} · publish ${a==null?'—':Math.round(a)+'분 전'} · ${ok?'<span class="v-ok">신선 — 토스 우선</span>':'<span class="v-bad">지연 — 기존 소스로 폴백</span>'}${(T.missing||[]).length?` · <span class="am">빠짐: ${esc(T.missing.join(', '))}</span>`:''}</div>`; }
  const rows=[['KOSPI','코스피',2],['KOSDAQ','코스닥',2],['USDKRW','원/달러(매매기준율)',2]].map(([k,lab,dg])=>{ const p=tossPick(k); if(!p) return '';
    const bars=T&&(T.indices||{})[k]&&T.date>=tossExpDay()?T.indices[k].bars:null;
    return `<tr><td class="l am">${lab}</td><td>${num(p.v,dg)}</td><td>${p.c==null?'—':pct(p.c,2)}</td><td class="l">${srcBadge(p.src,p.ts)}</td><td style="width:40%">${bars?tossSpark(bars,240,36):''}</td></tr>`; }).join('');
  h+=`<table><tr><th class="l">지표</th><th>현재</th><th>1D</th><th class="l">출처</th><th class="l">장중(1분봉 종가)</th></tr>${rows}</table>`;
  const Q=(T&&T.quotes)||{}, bk=Object.keys(Q).filter(k=>/BOND/.test(k)&&tossFresh(Q[k].asof)).sort((a,b)=>parseInt(a.replace(/\D/g,''))-parseInt(b.replace(/\D/g,'')));
  if(bk.length) h+=`<div style="margin-top:6px"><span class="mu">국고채(%)</span> ${bk.map(k=>`${esc(k.replace('KR_BOND_',''))} <b>${Number(Q[k].last).toFixed(3)}</b>`).join(' · ')} ${srcBadge('toss',Q[bk[0]].asof)}</div>`;
  // 국장 지표·ISA 코어·섹터 ETF 현재가 (10/21 겸이 "ETF도 트래킹되지?") — kr_quotes(토스 /prices, 장중 10분), 지연이면 표시 안 함
  const KQ=(T&&T.kr_quotes)||{}, KE=((T&&T.kr_meta)||{}).etfs||[], ke=KE.filter(k=>KQ[k]&&tossFresh(KQ[k].asof));
  const ETFN={'069500':'KODEX 200','229200':'KODEX 코스닥150','360750':'TIGER 미국S&P500','133690':'TIGER 미국나스닥100','148070':'KOSEF 국고채10년','305080':'TIGER 미국채10년선물','152380':'KODEX 국채선물10년','132030':'KODEX 골드선물(H)','091160':'KODEX 반도체','139260':'TIGER 200 IT','122630':'KODEX 레버리지','114800':'KODEX 인버스','252670':'KODEX 200선물인버스2X'};
  if(ke.length) h+=`<table style="margin-top:6px"><tr><th class="l">ETF</th><th>현재</th><th>1D</th><th class="l">출처</th></tr>${ke.map(k=>`<tr><td class="l am sym" data-sym="${esc(k)}" data-mk="KR">${esc(ETFN[k]||k)}</td><td>${num(KQ[k].last,0)}</td><td>${KQ[k].chg_pct==null?'—':pct(KQ[k].chg_pct/100,2)}</td><td class="l">${srcBadge('toss',KQ[k].asof)}</td></tr>`).join('')}</table>`;
  else if(T&&T.kr_quotes) h+=`<div class="mu" style="margin-top:6px">토스 ETF 현재가 지연 — 마지막 ${esc(String((KQ[KE[0]]||{}).asof||'').slice(5,16).replace('T',' '))}</div>`;
  const F=(T&&T.flows)||{}, fm=['KOSPI','KOSDAQ'].filter(m=>F[m]&&String(F[m].date||'')>=tossExpDay()&&(!tossInSession()||tossFresh(T.generated_at)));
  h+=fm.length?`<table style="margin-top:6px"><tr><th class="l">수급(억원)</th><th>개인</th><th>외국인</th><th>기관</th><th>기타법인</th><th class="l">상태</th></tr>${fm.map(m=>{const f=F[m]; return `<tr><td class="l am">${m}</td><td>${sg(f['개인'])}</td><td>${sg(f['외국인'])}</td><td>${sg(f['기관'])}</td><td>${sg(f['기타법인'])}</td><td class="l mu" title="단위 환산 ${esc(f.unit_basis||'')} · 검증전(pykrx 확정치 대조 전)">${esc(f.date||'')} ${esc(f.status||'')}${srcBadge('toss',T.generated_at)}</td></tr>`;}).join('')}</table>`
    :`<div class="mu" style="margin-top:6px">토스 수급 없음/지연 — 위 INTRADAY KR(네이버·KRX) 수급을 보세요</div>`;
  const X=(TOSS_XC&&TOSS_XC.days)||[];
  if(X.length) h+=`<div style="margin-top:8px"><span class="mu">토스 대조 ${X.length}거래일 (괴리율 %, 허용: 지수 ${TOSS_XC.tolerances.INDEX_CLOSE_TOL_PCT} · 환율 ${TOSS_XC.tolerances.FX_TOL_PCT})</span><table><tr><th class="l">날짜</th>${X[X.length-1].rows.map(r=>`<th>${esc(r.item)}</th>`).join('')}</tr>${X.slice().reverse().map(d=>`<tr><td class="l mu">${esc(d.date)}</td>${d.rows.map(r=>`<td class="${r.status==='breach'?'dn':r.status==='ok'?'':'mu'}">${r.diff_pct!=null?r.diff_pct.toFixed(3):r.mismatch_n!=null?'불일치 '+r.mismatch_n:esc(r.status)}</td>`).join('')}</tr>`).join('')}</table></div>`;
  return h; }
setInterval(()=>{ if(document.getElementById('tossbox')||document.getElementById('tossusbox')) tossLoad(); },60e3);
/* ───── TOSS LIVE US (10/21 'us' 그룹 — 토스 미장 4세션: 데이·프리·정규·애프터) ─────
   신선: 세션 창(live.json us.session, KST) 안이면 asof 20분 이내 · 창이 끝났으면 마감 30분 전 이후 값이면 '마감분' · 창 정보 없으면 20분 이내만.
   지연이면 표시만 하고 '기존 소스(야후·네이버)' 안내 — 미장 지수·종목 기존 경로는 그대로. */
function tossUsFresh(us,ts){ if(!us||!ts) return false; const a=tossAgeMin(ts); if(a==null) return false; const S=us.session, now=Date.now();
  if(S&&S.start&&S.end){ const st=Date.parse(S.start), en=Date.parse(S.end); if(now>=st&&now<=en) return a<=TOSS_MAX_MIN; if(now>en) return Date.parse(ts)>=en-30*60e3; }
  return a<=TOSS_MAX_MIN; }
function tossUsBox(){
  const T=TOSS, U=T&&T.us; if(!U) return `<div class="am">토스 미장 데이터 없음(${esc(TOSS_ERR||(T?'us 블록 없음 — 노트북 toss_md_live 작업 확인':'로딩 중'))}) — 미장 값은 기존 소스(야후·네이버)</div>`;
  const ok=tossUsFresh(U,U.asof), S=U.session, cp=v=>v==null?'—':`<span class="${v>0?'up':v<0?'dn':'mu'}">${v>0?'+':''}${Number(v).toFixed(2)}%</span>`;
  let h=`<div class="mu" style="font-size:var(--fs-2);margin-bottom:6px">토스 asof ${esc(String(U.asof||'').slice(5,16).replace('T',' '))} ${srcBadge('toss',U.asof)} · ${ok?'<span class="v-ok">신선</span>':'<span class="dn">지연 — 기존 소스(야후·네이버)를 보세요</span>'}${S?` · 세션 ${esc(String(S.start).slice(5,16).replace('T',' '))}~${esc(String(S.end).slice(5,16).replace('T',' '))} KST`:''}${(U.missing||[]).length?` · <span class="am">빠짐: ${esc(U.missing.join(', '))}</span>`:''}</div>`;
  const Q=U.quotes||{}, core=['SPY','QQQ','DIA','IWM','SOXX','SMH','TLT','HYG','GLD'].filter(k=>Q[k]), secs=['XLK','XLF','XLE','XLV','XLY','XLP','XLI','XLB','XLU','XLRE','XLC'].filter(k=>Q[k]);
  const sp=U.spark||{};
  h+=`<table><tr><th class="l">ETF</th><th>현재</th><th>등락</th><th class="l">1분봉(ET, 봉 종료 시각)</th></tr>${core.map(k=>`<tr><td class="l am sym" data-sym="${esc(k)}" data-mk="US">${esc(k)}</td><td>${num(Q[k].last,2)}</td><td>${cp(Q[k].chg_pct)}</td><td style="width:45%">${sp[k]?tossSpark(sp[k].bars,240,32):''}</td></tr>`).join('')}</table>`;
  if(secs.length) h+=`<div style="margin-top:6px"><span class="mu">섹터 SPDR</span> ${secs.map(k=>`${esc(k)} ${cp(Q[k].chg_pct)}`).join(' · ')}</div>`;
  const R=U.rank||{}, rt=(lab,a)=>a&&a.length?`<div style="flex:1;min-width:220px"><div class="mu">${lab}</div><table>${a.slice(0,10).map(r=>`<tr><td class="l am sym" data-sym="${esc(r.s)}" data-mk="US">${esc(r.s)}</td><td class="l">${esc(String(r.n||'').slice(0,14))}</td><td>${cp(r.chg_pct)}</td></tr>`).join('')}</table></div>`:'';
  h+=`<div style="display:flex;gap:12px;flex-wrap:wrap;margin-top:6px">${rt('거래대금 상위(실시간)',R.amount)}${rt('상승 상위(1일)',R.gainers)}${rt('하락 상위(1일)',R.losers)}</div>`;
  if((U.sector_rank||[]).length) h+=`<div style="margin-top:6px"><span class="mu">토스 섹터 등락(1일)</span> ${U.sector_rank.slice(0,12).map(x=>`${esc(x.name)} ${cp(x.chg_pct)}`).join(' · ')}</div>`;
  return h; }
function sigTable(rows,market){
  if(!rows||!rows.length) return '<div class="mu">—</div>';
  const kr=market==='KR';
  return `<table><tr><th class="l">SYM</th><th class="l">NAME</th><th>PX</th><th>1D</th><th>20D</th><th>T</th><th>M</th><th>RISK</th><th>ADX</th><th>RSI</th><th>52H</th><th>VOL×</th><th class="l">CLS</th></tr>`+
  rows.map(r=>`<tr><td class="l am sym" data-sym="${esc(r.symbol)}" data-mk="${market}">${esc(r.symbol)}</td><td class="l">${esc(r.name).slice(0,16)}</td><td>${num(r.close,kr?0:2)}</td><td>${pct(r.ret1)}</td><td>${pct(r.ret20)}</td><td class="am">${n0(r.trend_score)}</td><td>${n0(r.momentum_score)}</td><td class="${r.reversal_risk>=60?'dn':''}">${n0(r.reversal_risk)}</td><td>${n0(r.adx14)}</td><td>${n0(r.rsi14)}</td><td>${pct(r.from_high52,0)}</td><td class="${r.vol_ratio>=3?'am':''}">${(r.vol_ratio??0).toFixed(1)}</td><td class="l mu">${CLS[r.class]||r.class||''}</td></tr>`).join('')+'</table>';
}
function breadthPanel(mk){
  const b=(D.breadth||[]).filter(x=>x.market===mk);
  if(!b.length) return `<div class="mu">—</div>`;
  const L=b[b.length-1], P=b.length>20?b[b.length-21]:b[0];
  const p200=L.pct_above200??0, p50=L.pct_above50??0, p20=L.pct_above20??0, d200=(p200-(P.pct_above200??p200))*100;
  // 판정: 200일선 위 비율(장기 체력) × 20일선 위 비율(단기 흐름)
  const lvl=p200>=0.6?'강세':p200>=0.4?'중립':'약세', cls=p200>=0.6?'up':p200>=0.4?'am':'dn';
  const shortv=p20>=0.6?'단기 매수세 우위':p20<=0.3?'단기 투매 구간':'단기 혼조';
  const trend=b.length<6?'추이 데이터 쌓는 중':Math.abs(d200)<3?'20일 전과 비슷':d200>0?`20일 전보다 +${d200.toFixed(0)}%p 개선`:`20일 전보다 ${d200.toFixed(0)}%p 악화`;
  const verdict=`<div class="bv ${cls}"><b>${lvl}</b> 체력 · ${shortv}</div><div class="mu" style="margin-bottom:6px">200일선 위 ${Math.round(p200*100)}% (${trend}) · ${L.date} · ${L.n}종목</div>`;
  const gauge=(l,v)=>{const c=v>=0.6?'up':v>=0.4?'am':'dn'; return `<div class="bg"><span class="bl">${l}</span><span class="bt"><i class="${c}" style="width:${(v*100).toFixed(0)}%"></i><u style="left:40%"></u><u style="left:60%"></u></span><b class="${c}">${Math.round(v*100)}%</b></div>`;};
  const split=(l,a,d)=>{const t=(a+d)||1, pa=a/t*100; return `<div class="bg"><span class="bl">${l}</span><span class="bs"><i class="up" style="width:${pa.toFixed(0)}%"></i><i class="dn" style="width:${(100-pa).toFixed(0)}%"></i></span><b><span class="up">${a}</span>/<span class="dn">${d}</span></b></div>`;};
  // 30일 추이: 200일선 위 비율 선 + 40/60 기준선
  const s=b.slice(-30), w=220, h=46, X=i=>i*(w-4)/Math.max(s.length-1,1)+2, Y=v=>h-2-(v||0)*(h-4);
  const pts=s.map((x,i)=>`${X(i).toFixed(1)},${Y(x.pct_above200).toFixed(1)}`).join(' ');
  const svg=`<svg viewBox="0 0 ${w} ${h}" class="bsv" preserveAspectRatio="none"><line x1="0" x2="${w}" y1="${Y(.6)}" y2="${Y(.6)}" class="g60"/><line x1="0" x2="${w}" y1="${Y(.4)}" y2="${Y(.4)}" class="g40"/><polyline points="${pts}" class="pl"/><circle cx="${X(s.length-1)}" cy="${Y(p200)}" r="2.5" class="pd"/></svg>`;
  return `${verdict}${gauge('20일선 위',p20)}${gauge('50일선 위',p50)}${gauge('200일선 위',p200)}${split('상승/하락',L.adv,L.dec)}${split('신고가/신저가',L.new_high52,L.new_low52)}
   ${s.length>=5?`<div class="mu" style="margin-top:6px">200일선 위 비율 · 최근 ${s.length}거래일 (점선 40% / 60%)</div>${svg}`:`<div class="mu" style="margin-top:6px">추이 그래프는 5거래일 이상 쌓이면 표시</div>`}`;
}
let MV=null;
function macroPanel(mk){
  if(MV===null){ MV=false; google.script.run.withSuccessHandler(t=>{try{MV=JSON.parse(t);}catch(e){MV={};} render();}).withFailureHandler(()=>{MV={};}).getMacroView(); }
  if(MV&&MV.rows&&MV.rows.length){
    const col=x=>x==null?'var(--muted)':x>0.15?'var(--up)':x<-0.15?'var(--dn)':'var(--amber)';

function squarify(items,x,y,w,h){ // items: [{v,...}] → [{...,x,y,w,h}]

  while(rest.length){ const len=Math.min(w,h); let row=[rest[0]], i=1;
    while(i<rest.length && worst([...row,rest[i]],len)<=worst(row,len)){ row.push(rest[i]); i++; }
    const s0=row.reduce((a,o)=>a+o._a,0), thick=s0/len; let off=0;
    for(const o of row){ const l=o._a/thick; if(w>=h) out.push({...o,x:x,y:y+off,w:thick,h:l}); else out.push({...o,x:x+off,y:y,w:l,h:thick}); off+=l; }

  return out; }

function mdView(name){
  const mk=/_US$/.test(name)?'US':/_KR$/.test(name)?'KR':null;
  google.script.run.withSuccessHandler(md=>{$('#root').innerHTML=`<div class="md">${mdToHtml(md,mk)}</div>`;}).withFailureHandler(e=>{$('#root').innerHTML=`<div class="err">${esc(e.message)}</div>`;}).getMarkdown(name);
  return '<div class="load">LOADING …</div>';
}
function mdToHtml(md,mk){
  const lines=md.split('\n'); let out='',intab=false;
  const MACK={KOSPI:'KOSPI',KOSDAQ:'KOSDAQ',SPX:'SPX',NASDAQ:'NASDAQ',RUT:'RUT',VIX:'VIX',US10Y:'US10Y',DXY:'DXY',USDKRW:'USDKRW',USDJPY:'USDJPY',WTI:'WTI',GOLD:'GOLD',BTC:'BTC',
    '코스피':'KOSPI','코스닥':'KOSDAQ','S&P500':'SPX','나스닥':'NASDAQ','러셀2000(미 중소형)':'RUT','VIX(미 변동성)':'VIX','미 10년 금리':'US10Y','달러인덱스':'DXY','원/달러':'USDKRW','엔/달러':'USDJPY','WTI 유가':'WTI','금':'GOLD','비트코인':'BTC'};
  const symCell=c=>{const t=c.trim(); if(MACK[t]) return `<td class="l am mac" data-key="${MACK[t]}">${esc(t)}</td>`; return mk&&(/^[0-9A-Z]{6}$/.test(t)&&mk==='KR'||/^[A-Z][A-Z.\-]{0,5}$/.test(t)&&mk==='US')?`<td class="l am sym" data-sym="${esc(t)}" data-mk="${mk}">${esc(t)}</td>`:`<td class="l">${inline(t)}</td>`;};
  for(const l of lines){
    if(l.startsWith('|')){ if(/^\|[-| ]+\|$/.test(l.trim())) continue; const cells=l.split('|').slice(1,-1); if(!intab){out+='<table>';intab=true;out+='<tr>'+cells.map(c=>`<th class="l">${esc(c.trim())}</th>`).join('')+'</tr>';} else out+='<tr>'+cells.map((c,ci)=>ci===0?symCell(c):`<td class="l">${inline(c.trim())}</td>`).join('')+'</tr>'; continue; }
    if(intab){out+='</table>';intab=false;}
    if(l.startsWith('# ')) out+=`<h1>${esc(l.slice(2))}</h1>`; else if(l.startsWith('## ')) out+=`<h2>${esc(l.slice(3))}</h2>`;
    else if(l.startsWith('- ')) out+=`<div>• ${inline(l.slice(2))}</div>`; else if(l.trim()) out+=`<div>${inline(l)}</div>`;
  }
  if(intab) out+='</table>'; return out;
}
function inline(s){return esc(s).replace(/\*\*(.+?)\*\*/g,'<b class="am">$1</b>').replace(/\[(.+?)\]\((.+?)\)/g,'<a href="$2" target="_blank">$1</a>').replace(/([+-]\d+\.\d%)/g,m=>`<span class="${m[0]==='+'?'up':'dn'}">${m}</span>`);}

/* 상단 3칸 어댑터 (묶음 B, 10/26) — Index.html TOPF·mkTop·topMount. 기존 문장·수치 재배치만, 근거 없으면 NA(사유). */
if(typeof TOPF==='object'){
function topMarket(mk){ const S=D[mk.toLowerCase()]||{}, sec=S.sections||{}, a=(D.breadth||[]).filter(x=>x.market===mk), L=a[a.length-1];
  const cls=Object.entries(S.class_counts||{}).sort((x,y)=>y[1]-x[1]).slice(0,3).map(([k,v])=>`${CLS[k]||k} ${v}`).join(' · ');
  const what=[`${mk} ${S.n||'—'}종목 분류: ${cls||'—'}`]; if(L) what.push(`200일선 위 ${Math.round((L.pct_above200||0)*100)}% · 상승 ${L.adv}/하락 ${L.dec} · 52주 신고 ${L.new_high52}/신저 ${L.new_low52} (${L.date})`);
  const cv=((D.state||{})['close_'+mk]||{}).value||'', arrow=cv.replace(/<[^>]+>/g,'').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&amp;/g,'&').split('\n').find(x=>x.startsWith('→'));
  const so=[arrow?arrow.replace(/^→\s*/,'')+' (마감 코멘트)':NA('마감 코멘트 없음 — 분류는 후보 표시, 판단 아님')];
  const an=((D.anomalies||{})[mk]||[]).length;
  const now=[an?`이상 움직임 ${an}종목 — 상세에서 근거 확인(매매 신호 아님)`:'조치 없음(스크리너는 후보 표시 — 매매 신호 아님)'];
  return mkTop(what,so,now,['reports/dashboard.json'],S.asof||D.generated_at); }
TOPF.kr=()=>topMarket('KR'); TOPF.us=()=>topMarket('US');
TOPF.heat=()=>mkTop(`히트맵 ${typeof HMK!=='undefined'?HMK:''} — 업종·종목 등락 색 지도`,NA('표시 전용 — 해석 문장 없음'),NA('표시 전용'),['reports/heatmap_KR.json','reports/heatmap_US.json']);
TOPF.mdkr=()=>mkTop('KR 전종목 스크리너 표(latest_KR.md)',NA('원표 — 요약 문장 없음'),NA('원표'),['reports/latest_KR.md'],(D.kr||{}).asof);
TOPF.mdus=()=>mkTop('US 전종목 스크리너 표(latest_US.md)',NA('원표 — 요약 문장 없음'),NA('원표'),['reports/latest_US.md'],(D.us||{}).asof);
}
</script>
