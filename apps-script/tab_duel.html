<!-- tab_duel.html — 대결·주문표 — reports/decisions.json 진입 판·주문표·채점 (decBox·ticketBox). DAILY·QUANT 시그널 화면에 끼워짐.
     apps-script/Index.html 이 include('tab_duel') 템플릿 태그로 끼워 넣는다 (GAS 는 HtmlService include, Pages 는 scripts/build_pages.py 가 인라인).
     전역 도우미($·esc·num·pct·render·setView·openDetail 등)는 Index.html 에 있다. -->
<script>
let DEC=null, COOL=null, RENEGO=null;
// 재협상 카운터 (오너 승인 10/17 14:09): 같은 규칙 30일 안 2회째 재협상(ops/renego.json) → 주문표 ⛔ '재협상 2회째' + 사유 칸 필수. 값 = screener/defs.py RENEGO_*
const RENEGO_WARN_AT=2, RENEGO_WINDOW_DAYS=30, RENEGO_REASON_MIN=10;
// 관련 주문표만 ⛔ (screener/defs.py RENEGO_SCOPE · renego.relates): POS_BACKSTOP = 반도체 종목 또는 −20% 백스톱 아래 보유 종목. 표에 없는 규칙은 전 주문표.
const RENEGO_SCOPE={POS_BACKSTOP:'backstop'};
const SEMI_TICKERS=new Set(['MU','SNDK','NVDA','AMD','AVGO','TSM','INTC','QCOM','ARM','MRVL','LRCX','AMAT','KLAC','ASML','WDC','STX','PSI','SOXX','SMH','SOXL','SOXQ','XSD','SMHX','139260','091160','396500','395160','449450','000660','005930','042700','000990','058470','240810','403870','357780','036930','095340','039030','319660','140860']);
function tkSemi(code,name){ return SEMI_TICKERS.has(String(code||'').toUpperCase())||/반도체|semiconductor/i.test(String(name||'')); }
function renegoFor(code,name,below){ const ctx={semi:tkSemi(code,name),below:!!below}; return renegoActive().filter(x=>RENEGO_SCOPE[x.rule]!=='backstop'||ctx.semi||ctx.below); }
// 결재 #14: 레버리지·인버스 베팅은 1일 상한 라벨 (duel.lev_cap 이 못 붙인 공격 PB 문구·픽 포함 — 감사 화면 중-4)
const LEV_RE=/레버리지|인버스|곱버스|[23]\s*배|\b[23]X\b|\b(SOXL|SOXS|TQQQ|SQQQ|UPRO|SPXU|TNA|TZA|NVDL|TSLL|QLD|SSO)\b|122630|233740|252670|114800|251340/i;
const LEV_TAG='<span class="am" style="font-size:var(--fs-1)"> ⏱ 레버리지 1일 상한(결재 #14)</span>';
function levTag(t){ return LEV_RE.test(String(t||''))?LEV_TAG:''; }
function renegoActive(){ const today=new Date(Date.now()+9*36e5).toISOString().slice(0,10), lo=new Date(Date.parse(today+'T00:00:00Z')-(RENEGO_WINDOW_DAYS-1)*864e5).toISOString().slice(0,10), c={};
  for(const e of ((RENEGO&&RENEGO.events)||[])){ const r=String(e.rule||''), d=String(e.date||'').slice(0,10); if(!/^[A-Z0-9_]+$/.test(r)||d<lo||d>today) continue; const x=c[r]||(c[r]={rule:r,count:0,last:''}); x.count++; if(d>x.last) x.last=d; }
  return Object.values(c).filter(x=>x.count>=RENEGO_WARN_AT).sort((a,b)=>b.count-a.count); }
// 결재 #14 ③ (10/17): 매도(exit '매도')·포상(ops/cooldown.json) 후 30분 — 새 모의 베팅 금지, 카운트다운. 주문표 판정은 제외. 값 = screener/defs.py COOLDOWN_MIN
const COOLDOWN_MIN=30;
function coolUntil(D){ const ev=[]; const at=s=>{ const t=Date.parse(String(s).replace(' ','T')+':00+09:00'); return isFinite(t)?t:null; };
  for(const it of (D.items||[])){ if(it.kind!=='exit') continue; const me=(it.picks||{})['나']||{}; if(!me.cash) continue; const t=at(me.submitted?it.date+' '+me.submitted:(it.basis||{}).at); if(t) ev.push([t,'매도 '+(it.title||'').replace('매도 타점 대결 · ','')]); }
  for(const e of ((COOL&&COOL.events)||[])){ const t=at(e.at); if(t) ev.push([t,e.what||'포상']); }
  const now=Date.now(); let last=null; for(const [t,l] of ev){ if(t<=now&&now<t+COOLDOWN_MIN*6e4&&(!last||t>last[0])) last=[t,l]; }
  return last?{until:last[0]+COOLDOWN_MIN*6e4,from:last[0],what:last[1]}:null; }
function coolTick(){ const e=document.querySelector('[data-cool-until]'); if(!e) return; const left=+e.dataset.coolUntil-Date.now();
  if(left<=0){ if(view==='sig'||view==='daily') render(); return; } const m=Math.floor(left/6e4), s=Math.floor(left%6e4/1e3); e.textContent=`${m}:${String(s).padStart(2,'0')}`; setTimeout(coolTick,1000); }
function planHtml(p){ if(!p) return ''; const f=v=>v==null?null:(v>0?'+':'')+(v*100).toFixed(1)+'%';
  const rr=p.rr!=null?p.rr:(p.target!=null&&p.stop?Math.abs(p.target/p.stop):null);
  const a=[p.target!=null?'목표 '+f(p.target):'',p.stop!=null?'손절 '+f(p.stop):'',rr!=null?'손익비 1:'+rr.toFixed(1):'',p.win_rate!=null?`과거 승률 ${(p.win_rate*100).toFixed(0)}%${p.n?` (n=${p.n})`:''}`:'',p.ev!=null?'기대값 '+f(p.ev):'',p.basis?esc(p.basis):''].filter(Boolean);
  return a.length?`<div style="font-size:var(--fs-2);margin:2px 0"><b>🎯 ${a.join(' · ')}</b></div>`:''; }
function statLine(t){ if(!t||!t.trades) return '<div class="mu" style="font-size:var(--fs-1)">진입 판 없음</div>'; const p=v=>v==null?'—':(v>0?'+':'')+(v*100).toFixed(1)+'%';
  return `<div style="font-size:var(--fs-1);line-height:1.5">진입 ${t.trades}판 · 승률 <b>${t.hit!=null?(t.hit*100).toFixed(0)+'%':'—'}</b> · 평균 수익 ${p(t.avg_win)} / 손실 ${p(t.avg_loss)} · 손익비 <b>${t.payoff!=null?'1:'+t.payoff.toFixed(2):'—'}</b> · 기대값 <b>${p(t.ev)}</b></div>`; }
function ticketBox(D,IU){
  // 주문표(규정 [4]) — kind 'ticket' 항목: 열린 것(채점 전)은 표, 채점된 것은 R 누적. 금액은 공개 기록 규칙대로 100만 이하 또는 비중만.
  const tk=(D.items||[]).filter(it=>it.kind==='ticket'), T=(D.tally||{})['주문표'];
  const wd=(a,b)=>{let n=0; const d=new Date(a+'T00:00:00'); const e=new Date(b+'T00:00:00'); while(d<e){d.setDate(d.getDate()+1); const w=d.getDay(); if(w>0&&w<6) n++;} return n;};
  const today=new Date().toISOString().slice(0,10);
  const open=tk.filter(it=>!it.result).reverse(), done=tk.filter(it=>it.result&&!it.result.void).reverse();
  const vc=v=>v&&v.startsWith('✅')?'var(--up)':v&&v.startsWith('⚠')?'var(--amber)':'var(--dn)';
  const px=v=>v==null?'—':num(v,v<100?2:0);
  const rows=open.map(it=>{const left=Math.max(0,(it.horizon_days||0)-wd(it.date,today));
    return `<tr><td class="l"><span class="px" data-t="${esc(it.code)}">${esc(it.name||it.code)}</span> <span class="mu">${esc(it.code)}</span></td><td>${px(it.entry)}</td><td class="dn">${px(it.stop_eff||it.stop)}</td><td class="up">${px(it.target)}</td><td>1:${it.rr!=null?Number(it.rr).toFixed(1):'—'}</td><td style="color:${vc(it.verdict)}">${esc(it.verdict||'')}</td><td>${it.verdict&&it.verdict.startsWith('⛔')?'—':left+'일'}</td><td class="mu">${it.qty_max!=null?num(it.qty_max,0)+'주':'—'}${it.notional?` · ${num(Math.round(it.notional/10000),0)}만`:it.notional_pct!=null?` · ${it.notional_pct}%`:''}</td></tr>
     <tr><td colspan="8" class="l mu" style="font-size:var(--fs-1);white-space:normal;padding:0 6px 6px 14px">${esc(it.submitted||it.date)} · ${esc(it.why||'')}${(it.reasons||[]).length?' — '+esc(it.reasons.join(' / ')):''}</td></tr>`;}).join('');
  const hist=done.slice(0,8).map(it=>`<span style="margin-right:12px"><span class="mu">${esc(it.date.slice(5))}</span> ${esc(it.name||it.code)} <b class="${it.result.r>=0?'up':'dn'}">${it.result.r>=0?'+':''}${Number(it.result.r).toFixed(2)}R</b></span>`).join('');
  // 주문표 입력 (10/17 오너 요청): 종목명·티커 검색 → 최신가 자동 → 손절·목표 = 매수가 × (1 + %) 기본 −7% / +15% (손익비 2.1, 규정 −8%·1:2 안)
  const RNALL=renegoActive(); let RN=RNALL;   // 종목을 고르면 renegoFor 로 관련 규칙만 남긴다
  const TK_STOP=-7, TK_TGT=15, IS=`background:#050505;color:var(--txt);border:1px solid var(--line);font:inherit;padding:3px 6px`;
  const tform=`<span style="position:relative;display:inline-block"><input id="tkq" placeholder="종목명·티커 (예: mu, 하이닉스)" autocomplete="off" style="width:190px;${IS}"><div id="tkres" class="mu" style="display:none;position:absolute;z-index:30;left:0;top:100%;min-width:260px;max-height:260px;overflow:auto;background:var(--panel);border:1px solid var(--line);font-size:var(--fs-2)"></div></span><input id="tkcode" type="hidden"><input id="tkmk" type="hidden">
    <input id="tkentry" placeholder="매수가" style="width:90px;${IS}">
    손절 <input id="tkstopp" value="${TK_STOP}" title="매수가 대비 %" style="width:44px;${IS}">% <input id="tkstop" placeholder="손절가" style="width:90px;${IS}">
    목표 <input id="tktgtp" value="${TK_TGT}" title="매수가 대비 %" style="width:44px;${IS}">% <input id="tktarget" placeholder="목표가" style="width:90px;${IS}">
    <input id="tkdays" placeholder="보유(일)" value="5" style="width:52px;${IS}">일 <button id="tkgo" class="sbtn">주문표 열기 (깃허브 이슈)</button>
    ${RN.length?`<div id="tkrnbox" style="border:1px solid var(--alarm-bg);padding:5px 8px;margin-top:4px"><b class="v-alarm">⛔ 재협상 2회째</b> <span class="mu" style="font-size:var(--fs-1)">관련 주문표만 — POS_BACKSTOP: 반도체·−20% 아래 보유 종목</span> <label class="mu" style="font-size:var(--fs-1)"><input type="checkbox" id="tkbelow"> −20% 아래 보유 종목</label> — ${RN.map(x=>`${esc(x.rule)} ${x.count}회 · 마지막 ${esc(x.last.slice(5))}`).join(' · ')} <span class="mu" style="font-size:var(--fs-1)">(30일 안 같은 규칙 · ops/renego.json)</span>
      <textarea id="tkrn" rows="2" placeholder="재협상 사유 (필수, 10자 이상) — 이 글은 저장·전송하지 않습니다. 개인 일지에 옮겨 적으세요." style="display:block;width:100%;margin-top:4px;${IS}"></textarea></div>`:''}
    <div id="tklbl" class="mu" style="font-size:var(--fs-1)"></div>`;
  setTimeout(()=>{ const g=$('#tkgo'); if(!g) return; const v=id=>($(id).value||'').trim();
    const dp=()=>v('#tkmk')==='US'?2:0, rd=x=>dp()?Math.round(x*100)/100:Math.round(x);
    const lbl=t=>{ const e=+v('#tkentry')||0, st=+v('#tkstop')||0, tg=+v('#tktarget')||0; let h=t!=null?t:($('#tklbl').dataset.src||'');
      if(e>0&&st>0&&tg>0){ const rr=e>st?(tg-e)/(e-st):null, sd=st/e-1; h+=` · 손익비 <b class="${rr!=null&&rr>=2?'up':'dn'}">1:${rr!=null?rr.toFixed(2):'—'}</b>${rr!=null&&rr<2?' (1:2 미만 → 거부됨)':''} · 손절 <b class="${sd<-0.08?'dn':''}">${(sd*100).toFixed(1)}%</b>${sd<-0.08?' (−8% 초과 → 거부됨)':''}`; }
      $('#tklbl').innerHTML=h; };
    const fromPct=()=>{ const e=+v('#tkentry'); if(!(e>0)) return lbl(); $('#tkstop').value=rd(e*(1+(+v('#tkstopp')||0)/100)); $('#tktarget').value=rd(e*(1+(+v('#tktgtp')||0)/100)); lbl(); };
    const toPct=(px,pc)=>{ const e=+v('#tkentry'), x=+v(px); if(e>0&&x>0) $(pc).value=((x/e-1)*100).toFixed(1); lbl(); };
    ['#tkentry','#tkstopp','#tktgtp'].forEach(id=>$(id).oninput=fromPct);
    $('#tkstop').oninput=()=>toPct('#tkstop','#tkstopp'); $('#tktarget').oninput=()=>toPct('#tktarget','#tktgtp');
    const setPx=(px,src)=>{ $('#tkentry').value=rd(px); $('#tklbl').dataset.src=src; fromPct(); };
    // 최신가: 국장은 네이버 실시간(브라우저에서 막히면) → 저장소 상세의 마지막 종가. 미장은 상세 종가(무료 실시간 없음).
    const price=(sym,mk)=>{ $('#tklbl').innerHTML='가격 불러오는 중…';
      const fb=()=>google.script.run.withSuccessHandler(t=>{ try{ const d=JSON.parse(t); setPx(d.close, `종가 ${esc(String(d.asof||''))} 기준 (실시간 아님 — 장중이면 매수가 직접 수정)`);}catch(e){ lbl('가격 없음 — 매수가 직접 입력'); } }).withFailureHandler(()=>lbl('가격 없음 — 매수가 직접 입력')).getStock(mk,sym);
      if(mk!=='KR') return fb();
      const ac=new AbortController(); const to=setTimeout(()=>ac.abort(),3000);
      fetch('https://polling.finance.naver.com/api/realtime/domestic/stock/'+encodeURIComponent(sym),{signal:ac.signal}).then(r=>r.json()).then(j=>{ clearTimeout(to);
        const d=(j.datas||[])[0]||{}, px=+String(d.closePrice||d.closePriceRaw||'').replace(/,/g,''); if(!(px>0)) throw 0;
        const at=String(d.localTradedAt||'').slice(11,16); setPx(px, `현재가 네이버 실시간${at?' '+at:''}`); }).catch(()=>{ clearTimeout(to); fb(); }); };
    const scope=()=>{ const b=$('#tkrnbox'); if(!b) return; RN=renegoFor(v('#tkcode'),v('#tkq'),($('#tkbelow')||{}).checked); b.style.display=RN.length?'':'none'; };
    const pick=(sym,mk,name)=>{ $('#tkcode').value=sym; $('#tkmk').value=mk; $('#tkq').value=`${name} (${sym})`; $('#tkres').style.display='none'; price(sym,mk); scope(); };
    if($('#tkbelow')) $('#tkbelow').onchange=scope;
    $('#tkq').oninput=()=>{ const q=v('#tkq').toLowerCase(), box=$('#tkres'); if(!q){ box.style.display='none'; return; }
      loadIndex(()=>{ const r=SIX.filter(x=>x.s.toLowerCase().startsWith(q)||String(x.n).toLowerCase().includes(q))
        .sort((a,b)=>(a.s.toLowerCase()===q?-1:0)-(b.s.toLowerCase()===q?-1:0)||(String(a.n).toLowerCase().startsWith(q)?-1:1)-(String(b.n).toLowerCase().startsWith(q)?-1:1)).slice(0,10);
        box.innerHTML=r.length?r.map(x=>`<div data-tks="${esc(x.s)}" data-tkm="${x.m}" data-tkn="${esc(x.n)}" style="padding:3px 8px;cursor:pointer;color:var(--txt)">${esc(x.n)} <i class="mu">${esc(x.s)} · ${x.m}${x.e?' · ETF':''}</i></div>`).join(''):'<div style="padding:3px 8px">결과 없음 (스크리너 대상 종목만)</div>';
        box.style.display='block'; box.querySelectorAll('div[data-tks]').forEach(d=>d.onclick=()=>pick(d.dataset.tks,d.dataset.tkm,d.dataset.tkn)); }); };
    $('#tkq').onkeydown=e=>{ if(e.key==='Enter'){ const d=$('#tkres').querySelector('div[data-tks]'); if(d){ e.preventDefault(); d.click(); } } };
    g.onclick=()=>{ const c=v('#tkcode')||v('#tkq'); if(!c) return;
    // 재협상 2회째: 사유 글이 있어야 열림. 글 자체는 이슈 본문(공개)에 넣지 않고 '기재' 표시만 — 검사기(screener/ticket.py)는 이 줄로 사유 칸 확인
    scope();
    if(RN.length&&v('#tkrn').replace(/\s/g,'').length<RENEGO_REASON_MIN){ $('#tklbl').innerHTML=`<b class="v-alarm">⛔ 재협상 2회째 — 사유 칸(${RENEGO_REASON_MIN}자 이상, 공백 제외)을 먼저 적어야 주문표를 열 수 있음</b>`; $('#tkrn').focus(); return; }
    const e=+v('#tkentry')||0, st=+v('#tkstop')||0, tg=+v('#tktarget')||0; const rr=e>st&&st>0?((tg-e)/(e-st)).toFixed(2):'';
    window.open(IU('ticket '+c, `매수가 ${v('#tkentry')}\n손절가 ${v('#tkstop')}\n목표가 ${v('#tktarget')}\n근거: \n보유 ${v('#tkdays')||5}일\n`+(RN.length?'재협상사유: 기재함 — 글은 비공개(10자 이상 확인)\n':'')+(rr?`\n(손익비 1:${rr})`:'')),'_blank'); }; },0);
  return `<div style="border-top:1px solid var(--line);margin-top:8px;padding:8px 0;font-size:var(--fs-2);line-height:1.7;white-space:normal"><b class="am">주문표</b> <span class="mu" style="font-size:var(--fs-1)">매수 전 필수(규정 [4]) · 손익비 1:2 미만·레버리지·개장 30분·이벤트 당일 거부 · 추격은 절반 · 1회 리스크 = 위성 북 × r</span>${T?` <span style="font-size:var(--fs-1)">· 채점 ${T.n}건 · 승률 <b>${Math.round((T.hit||0)*100)}%</b> · 평균 <b class="${T.avg_r>=0?'up':'dn'}">${T.avg_r>=0?'+':''}${T.avg_r}R</b></span>`:''}
    ${rows?`<table style="margin-top:4px"><tr><th class="l">종목</th><th>매수가</th><th>손절(실효)</th><th>목표가</th><th>손익비</th><th>판정</th><th>남은 기간</th><th class="l">최대 수량 · 선언</th></tr>${rows}</table>`:'<div class="mu" style="font-size:var(--fs-1)">열린 주문표 없음</div>'}
    ${hist?`<div style="font-size:var(--fs-1);margin-top:4px"><span class="mu">최근 채점</span> ${hist}</div>`:''}
    <div style="margin-top:6px">${tform}</div>
    <div class="mu" style="font-size:var(--fs-1)">제목 \`ticket &lt;코드&gt;\` · 본문 매수가/손절가/목표가/근거/보유 n일 (금액은 100만 이하 또는 비중 %만 공개 기록) · 답글에 판정표</div></div>`;
}
// 최신가 (주문표·매도 타점 공용): 국장은 네이버 실시간 시도(3초) → 실패 시 저장소 상세의 마지막 종가. 미장은 상세 종가(무료 실시간 없음).
function livePx(sym,mk,cb){
  const fb=()=>google.script.run.withSuccessHandler(t=>{ try{ const d=JSON.parse(t); cb(d.close, `종가 ${esc(String(d.asof||''))} 기준 (실시간 아님)`);}catch(e){ cb(null,'가격 없음'); } }).withFailureHandler(()=>cb(null,'가격 없음')).getStock(mk,sym);
  if(mk!=='KR') return fb();
  const ac=new AbortController(), to=setTimeout(()=>ac.abort(),3000);
  fetch('https://polling.finance.naver.com/api/realtime/domestic/stock/'+encodeURIComponent(sym),{signal:ac.signal}).then(r=>r.json()).then(j=>{ clearTimeout(to);
    const d=(j.datas||[])[0]||{}, px=+String(d.closePrice||d.closePriceRaw||'').replace(/,/g,''); if(!(px>0)) throw 0;
    cb(px, `현재가 네이버 실시간${String(d.localTradedAt||'').slice(11,16)?' '+String(d.localTradedAt).slice(11,16):''}`); }).catch(()=>{ clearTimeout(to); fb(); }); }
// 내 보유 (MY 탭에 입력한 텍스트, 이 브라우저 localStorage) → [{s,m,n,qty,avg}]

/* 대결 1줄 (UXUI 재진단 Top10 #5, 10/23 겸이 승인 — 이전 10/21 접기 토글 대체): DAILY·시그널에선 대결이 펼친 채 2,522px 라 브리프가 3.3장 아래로 밀렸다.
   DAILY·시그널 = 1줄(오늘 상태 요약 + 제출 대기 배지 + 열기 →), 대결 본문(제출·매도 대결·쿨다운)은 DAILY › 성적표 맨 위 한 곳. */
// 10/21 접기 토글 이름 유지(옛 onclick·기록 호환): 이제 토글 대신 성적표로 이동, mt_duel_open 은 더 안 씀
const DUEL_OK='mt_duel_open';
function duelKey(live){ return live&&live.length?String(live[0].date)+'|'+(live[0].market||''):''; }
function duelOpen(){ return false; }
function duelTog(){ setView('score'); }
function duelSum(live,CD){ if(!live.length) return '진행 중 대결 없음 · 다음 14:55·22:00';
  const it=live[0], st=p=>!p?'—':p.pending?'대기':p.cash?'현금':esc(String(p.name||p.ticker||'').slice(0,12));
  return `${esc(String(it.date).slice(5))} ${duelIsUS(it)?'미장':'국장'} · 나: ${st(it.picks&&it.picks['나'])} · PB: ${st(it.picks&&it.picks['PB'])} · 마감 ${duelIsUS(it)?'09:30 ET':'15:30'}${live.length>1?` · 외 ${live.length-1}판`:''}${CD?' · ⏳쿨다운':''}`; }
/* 대결 박스 (DAILY 상단·QUANT 시그널): 오늘·진행 중 대결 + 제출 위주로 짧게. 성적·기록 전체는 DAILY › 성적표 */
function decBox(full){
  decLoad(); if(!DEC||!DEC.items) return '';
  const CD=decCD(); if(CD) setTimeout(coolTick,0);
  const tm=t=>new Date(t+9*36e5).toISOString().slice(11,16);
  const coolBar=CD?`<div style="border:1px solid var(--dn);padding:6px 10px;margin-bottom:6px;font-size:var(--fs-2)">⏳ <b class="dn">쿨다운</b> — ${tm(CD.from)} ${esc(CD.what)} 후 ${COOLDOWN_MIN}분: 새 모의 베팅 금지 · <b data-cool-until="${CD.until}">--:--</b> 남음 (${tm(CD.until)} 이후) <span class="mu" style="font-size:var(--fs-1)">현금 제출은 받음 · 결재 #14</span></div>`:'';
  if(!DEC.items.length) return '';
  const S=bsbLoad();
  const live=[...DEC.items].filter(it=>it.kind!=='ticket'&&it.kind!=='exit'&&!it.result).reverse().slice(0,3);
  setTimeout(()=>{ const q=$('#exq'); if(!q) return;
    const show=()=>{ const v=(q.value||'').trim().toLowerCase(), box=$('#exres'); const H=myHoldList();
      if(!H.length){ box.innerHTML='<div style="padding:3px 8px">MY 탭에 보유를 먼저 입력하면 여기서 고를 수 있어요</div>'; box.style.display='block'; return; }
      const r=H.filter(h=>!v||h.s.toLowerCase().startsWith(v)||String(h.n).toLowerCase().includes(v));
      box.innerHTML=r.length?r.map(h=>`<div data-xs="${esc(h.s)}" data-xm="${h.m}" style="padding:3px 8px;cursor:pointer;color:var(--txt)">${esc(h.n)} <i class="mu">${esc(h.s)} · ${h.m}${h.book==='isa'?' · ISA(매도 금지)':''}</i></div>`).join(''):'<div style="padding:3px 8px">보유에 없음</div>';
      box.style.display='block';
      box.querySelectorAll('div[data-xs]').forEach(d=>d.onclick=()=>{ const h=H.find(x=>x.s===d.dataset.xs&&x.m===d.dataset.xm); $('#excode').value=h.s; $('#exmk').value=h.m; q.value=`${h.n} (${h.s})`; box.style.display='none';
        $('#exlbl').innerHTML='가격 불러오는 중…';
        livePx(h.s,h.m,(px,src)=>{ if(!px){ $('#exlbl').innerHTML=src; return; }
          const fx=h.m==='US'?((typeof FX!=='undefined'&&FX)||1400):1, val=px*(h.qty||0)*fx, pnl=h.avg?px/h.avg-1:null;
          $('#examt').value=Math.min(Math.round(val),1000000);
          $('#exlbl').innerHTML=`${src} · ${h.m==='US'?'$'+px.toFixed(2):num(px,0)+'원'}${pnl!=null?` · 평단 대비 <b class="${pnl>=0?'up':'dn'}">${pnl>=0?'+':''}${(pnl*100).toFixed(1)}%</b>`:''}${pnl!=null&&pnl<=-0.2?' <b class="dn">· 규정 [5] −20% 백스톱 구간</b>':''}${h.book==='isa'?' <b class="dn">· ISA 코어는 매도 금지(연 1회 리밸런싱만)</b>':''} · 평가금액은 공개 기록이라 100만 상한으로 채움`; }); }); };
    q.onfocus=show; q.oninput=show; q.onkeydown=e=>{ if(e.key==='Enter'){ const d=$('#exres').querySelector('div[data-xs]'); if(d){ e.preventDefault(); d.click(); } } };
    document.addEventListener('click',e=>{ if(!e.target.closest('#exq,#exres')){ const b=$('#exres'); if(b) b.style.display='none'; } });
  },0);
  setTimeout(()=>{ const g=$('#exgo'); if(!g) return; g.onclick=()=>{ const c=($('#excode').value||'').trim(), a=($('#examt').value||'').trim(), act=document.querySelector('input[name=exact]:checked'); if(!c) return;
    window.open(DUEL_IU(`exit ${c}${a?' '+a:''}`, act?act.value:'보유'),'_blank'); }; },0);
  const T=(S&&S.by_who)||{}, sum=['나','PB'].map(w=>T[w]?`<span style="margin-right:12px"><span class="mu">${w}</span> <b class="${T[w].cum_ret>=0?'up':'dn'}">${duelPc(T[w].cum_ret)}</b> <span class="mu">${T[w].win}승/${T[w].n}전</span></span>`:'').join('');
  const sumLine=duelSum(live,CD), pend=live.some(it=>it.picks&&it.picks['나']&&it.picks['나'].pending);
  if(!full) return `<div class="p" id="duelbox" style="margin-bottom:10px"><div id="dueltog" role="button" tabindex="0" onclick="setView('score')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();setView('score');}" title="대결 본문·제출은 DAILY › 성적표" style="min-height:44px;display:flex;flex-wrap:wrap;align-items:center;gap:2px 8px;padding:4px 10px;cursor:pointer"><b class="am" style="letter-spacing:.06em">진입 타점 대결</b>${pend?'<span class="tag r" style="font-size:var(--fs-1)">제출 대기</span>':''}${CD?'<span class="tag r" style="font-size:var(--fs-1)">⏳ 쿨다운</span>':''}<span id="duelsum" class="mu" style="flex:1 1 160px;min-width:0;white-space:normal;font-size:var(--fs-2)">${sumLine}</span><span class="am" style="white-space:nowrap">성적표에서 열기 →</span></div></div>`;
  return `<div class="p c12" id="duelbox"><h2>진입 타점 대결<small id="duelsum" style="white-space:normal;text-align:right">${sumLine}</small></h2><div class="b" id="duelbody" style="white-space:normal">
   ${coolBar}
   <div style="font-size:var(--fs-2);display:flex;flex-wrap:wrap;align-items:center;gap:4px">${sum||'<span class="mu">누적 성과 불러오는 중</span>'}</div>
   ${live.length?live.map(it=>duelItemHtml(it,CD)).join(''):'<div class="mu" style="font-size:var(--fs-2);margin-top:4px">진행 중 대결 없음 — 다음 판은 14:55(국장)·22:00(미장) 무렵 열림</div>'}
   <details style="border-top:1px solid var(--line);margin-top:8px;padding-top:6px;font-size:var(--fs-2);line-height:1.8;white-space:normal"><summary><b class="am">매도 타점 대결 열기</b> <span class="mu" style="font-size:var(--fs-1)">팔까 말까 — PB가 규칙으로 판정, 5거래일 뒤 종가로 채점</span></summary>
     <span style="position:relative;display:inline-block;max-width:100%"><input id="exq" placeholder="내 보유에서 검색 (예: mu, 하이닉스)" autocomplete="off" style="width:210px;max-width:100%;background:#050505;color:var(--txt);border:1px solid var(--line);font:inherit;padding:3px 6px"><div id="exres" class="mu" style="display:none;position:absolute;z-index:30;left:0;top:100%;min-width:240px;max-height:260px;overflow:auto;background:var(--panel);border:1px solid var(--line);font-size:var(--fs-2)"></div></span><input id="excode" type="hidden"><input id="exmk" type="hidden">
     <input id="examt" placeholder="평가금액(원, 공개 기록 100만 상한)" style="width:120px;background:#050505;color:var(--txt);border:1px solid var(--line);font:inherit;padding:3px 6px">
     <label><input type="radio" name="exact" value="보유" checked> 나는 보유</label> <label><input type="radio" name="exact" value="매도"> 나는 매도</label>
     <button id="exgo" class="sbtn">제출 (깃허브 이슈)</button> <div id="exlbl" class="mu" style="font-size:var(--fs-1)"></div></details>
   <div class="mu" style="font-size:var(--fs-1);margin-top:4px">진입 타점 대결은 매 거래일 14:55 무렵(국장, 15:30 마감) · 22:00 무렵(미장, 09:30 ET 개장 전 마감) 텔레그램으로 열림 · 모의 기록</div></div></div>`;
}
/* 신호 성적 카드 (10/21 C 겸이 승인): reports/signal_tracking.json by_src — 원천별 5·20·60일 시장 중앙값 대비 초과.
   n<30 이면 '판단 금지(표본 부족)', 사후 재계산(recompute) 비중을 함께 보인다(당시 화면 노출분 아님). */
let SIGSC=null;
function sigScoreCard(){
  if(SIGSC===null){ SIGSC={loading:true}; getJSONrel('reports/signal_tracking.json').then(d=>{SIGSC=d; if(view==='score') render();}).catch(()=>{SIGSC={error:true}; if(view==='score') render();}); }
  if(SIGSC.loading) return '<div class="mu">신호 성적 불러오는 중…</div>';
  if(SIGSC.error||!SIGSC.by_src) return '<div class="am">신호 성적 자료 없음(signal_tracking.json)</div>';
  const d=SIGSC, NM={accum:'국장 매집',us_accum:'미장 매집',sim_kr:'국장 추세(모의)',sim_us:'미장 추세(모의)',disc_kr:'국장 추세 탐색(C)',disc_us:'미장 추세 탐색(C)'};
  const pc=v=>v==null?'—':(v>0?'+':'')+(v*100).toFixed(1)+'%';
  const cell=h=>!h||!h.n?'<td class="mu">대기</td>':`<td><span class="${h.avg_ex>=0?'up':'dn'}">${pc(h.avg_ex)}</span> <span class="mu">중앙 ${pc(h.med_ex)} · 적중 ${Math.round(h.hit*100)}% · n ${h.n}</span>${h.n<30?' <span class="tag r">판단 금지(표본 부족)</span>':''}</td>`;
  const rows=Object.entries(d.by_src).map(([k,v])=>`<tr><td class="l">${esc(NM[k]||k)}</td><td>${v.n_events??'—'}</td>${cell(v.h5)}${cell(v.h20)}${cell(v.h60)}</tr>`).join('');
  const oc=d.origin_counts||{}, tot=Object.values(oc).reduce((a,b)=>a+(b||0),0), rc=tot?Math.round((oc.recompute||0)/tot*100):0;
  return `<table><tr><th class="l">원천</th><th>신호</th><th class="l">5일 초과</th><th class="l">20일 초과</th><th class="l">60일 초과</th></tr>${rows}</table>
    <div class="mu" style="font-size:var(--fs-1);margin-top:4px;white-space:normal">기준 ${esc(d.generated_at||d.asof||'—')} · 사후 재계산 비중 <b class="${rc>=50?'dn':''}">${rc}%</b>(${oc.recompute||0}/${tot}, KR 매집만 — 당시 화면 노출분 아님) · 실시간 ${oc.live||0} · 게시본 복원 ${(oc.archive||0)+(oc.git||0)} · 비용 미반영 · 모의 · 검증전</div>`;
}
/* DAILY › 성적표 (하위 탭, 10/20 겸이 "판단 성적표가 너무 길다" → 분리) */
function scoreView(){
  decLoad(); const S=bsbLoad();
  if(DEC===false||(S&&S.loading)) return '<div class="load">LOADING …</div>';
  const CD=decCD(), D=DEC||{}, items=[...(D.items||[])].filter(it=>it.kind!=='ticket'&&it.kind!=='exit').reverse();
  const B=(S&&!S.error&&S.battles)||[], mk=m=>S&&S.by_market?S.by_market[m]||{}:{};
  const mkLine=m=>{const T=mk(m), ws=Object.keys(T).filter(w=>T[w].n); return ws.length?`<div style="font-size:var(--fs-1)"><span class="mu" style="display:inline-block;width:34px">${m==='US'?'미장':'국장'}</span>${ws.map(w=>`<span style="margin-right:10px">${esc(w)} <b class="${T[w].cum_ret>=0?'up':'dn'}">${duelPc(T[w].cum_ret)}</b> <span class="mu">${T[w].win}/${T[w].n}</span></span>`).join('')}</div>`:'';};
  const more=(arr,k,fn,label)=>arr.length>k?`<details><summary class="mu" style="font-size:var(--fs-2);cursor:pointer">${label} 더 보기 (${arr.length-k})</summary>${arr.slice(k).map(fn).join('')}</details>`:'';
  const IU=DUEL_IU;
  const shown=new Set([...(D.items||[])].filter(it=>it.kind!=='ticket'&&it.kind!=='exit'&&!it.result).reverse().slice(0,3).map(it=>it.id));   // 위 대결 칸에 나온 진행 중 판은 판단 기록에서 빼서 두 번 안 보이게
  const past=items.filter(it=>!shown.has(it.id));
  return `<div class="grid">${decBox(true)}<div class="p c12"><h2>성적표<small>나 vs PB · 확정 판 수익률 누적 · 비율만</small></h2><div class="b" style="white-space:normal">
     ${S&&S.error?'<div class="am">누적 성과판(battle_scoreboard.json) 불러오기 실패</div>':duelCards(S)}
     <div style="margin-top:8px">${duelCurve(S&&S.curve)}</div>
     <div style="margin-top:6px">${mkLine('KR')}${mkLine('US')}</div>
     <div class="mu" style="font-size:var(--fs-1);margin-top:4px">${esc((S&&S.policy)||'')}${S&&S.bench?` · 벤치마크 ${esc(S.bench.KR.name)} / ${esc(S.bench.US.name)}`:''} · 한 판은 운, 20판 이상 쌓여야 실력</div></div></div>
   <div class="p c12"><h2>대결 누적 성과판<small>판별 · 참가자별 수익률 · 벤치 대비 · 보유 중 평가</small></h2><div class="b">
     ${B.length?B.slice(0,5).map(bsbBattleHtml).join('')+more(B,5,bsbBattleHtml,'지난 판'):'<div class="mu">기록 없음</div>'}
     <details style="margin-top:6px"><summary class="mu" style="font-size:var(--fs-2);cursor:pointer">외부 일별 평가 스냅샷 (battle_daily)${(battleDailyBox(),bdSummaryTag())}</summary>${battleDailyBox()}</details></div></div>
   <div class="p c12"><h2>신호 성적<small>원천별 · 신호일 이후 시장 중앙값 대비 초과 · n&lt;30 판단 금지</small></h2><div class="b">${sigScoreCard()}</div></div>
   <div class="p c12"><h2>주문표<small>규정 [4] · 실현 R</small></h2><div class="b">${D.items?ticketBox(D,IU):''}</div></div>
   <div class="p c12"><h2>판단 기록<small>최근 3건 · 판단 근거·PB 판단·채점</small></h2><div class="b">
     ${past.slice(0,3).map(it=>duelItemHtml(it,CD)).join('')||'<div class="mu">기록 없음</div>'}${more(past,3,it=>duelItemHtml(it,CD),'지난 기록')}</div></div></div>`;
}

/* 상단 3칸 어댑터 (묶음 B, 10/26) — Index.html TOPF·mkTop·topMount. 기존 문장·수치 재배치만, 근거 없으면 NA(사유). */
if(typeof TOPF==='object'){
TOPF.score=()=>{ if(DEC===null||DEC===false) return null; const t=(DEC&&DEC.tally)||{}, h=k=>t[k]&&t[k].n?`${k} ${t[k].win}/${t[k].n}(${Math.round((t[k].win/t[k].n)*100)}%)`:null;
  const w=['나','PB','규칙'].map(h).filter(Boolean);   // 승률만 — 손익 금액 표시 안 함
  const pend=typeof homePendDuel==='function'&&DEC.items?homePendDuel(DEC.items,Date.now()):0, CD=typeof decCD==='function'?decCD():null;
  return mkTop(w.length?'누적 대결 승률 '+w.join(' · '):NA('대결 기록 없음'),'표본 적음 — 승률은 참고(검증전)',[pend?`제출 대기 ${pend}건`:null,CD?'쿨다운 중 — 새 모의 베팅 금지':null].filter(Boolean).length?[pend?`제출 대기 ${pend}건`:null,CD?'쿨다운 중 — 새 모의 베팅 금지':null].filter(Boolean):['조치 없음(대기 판 없음)'],['reports/decisions.json','reports/battle_scoreboard.json'],null,{grade:'검증전'}); };
}
</script>
