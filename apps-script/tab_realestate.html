<!-- tab_realestate.html — MARKET › 부동산 (reView). 10/23 겸이 "마켓에 부동산 누나 추가" → 이름 '부동산'(대체투자 아님) · "마켓에 부동산 탭이 아직 안 뜨네".
     설계: docs/realestate/2026-10-23_tab_design.md (부동산 데스크). 데이터: reports/realestate.json(자동 — ECOS·리츠·뉴스, screener/realestate.py) + reports/views/realestate.json(데스크 해석, 손으로).
     빈 상태: prices.status '키 필요' → 숫자 0 으로 채우지 않고 views.weekly_snapshot(2차 보도·검증전) 표시. 390px 가로 스크롤 금지.
     서울 25개 구 실거래 지도(데이터 10/24): seoul_trades(국토부 RTMS) → 없으면 views.district_takes 수치, 경계 = regions.geo.
     드릴다운(10/26 겸이 "구 클릭하면 동, 동 클릭하면 그 더 세부단위"): 구 → 법정동 → 단지 → 최근 3건, 빵부스러기로 뒤로. 구별 파일 getRealEstateGu(코드) lazy. -->
<style>

.retogs{display:flex;flex-wrap:wrap;gap:4px;margin:4px 0}

.repvit{font:inherit;font-size:var(--fs-2);text-align:left;min-height:44px;padding:6px 10px;border:1px solid var(--line);background:var(--bg2);color:var(--txt);cursor:pointer;white-space:normal;min-width:0}
.repvit.on{border-color:var(--amber)}

</style>
<script>
let REJ=null, REV=null;
function reLoad(){ if(REJ!==null) return; REJ=false; REV=false;
  google.script.run.withSuccessHandler(t=>{ try{ REJ=JSON.parse(t); }catch(e){ REJ={}; } if(view==='re') render(); }).withFailureHandler(()=>{ REJ={}; if(view==='re') render(); }).getRealEstate();
  google.script.run.withSuccessHandler(t=>{ try{ REV=JSON.parse(t); }catch(e){ REV={}; } if(view==='re') render(); }).withFailureHandler(()=>{ REV={}; if(view==='re') render(); }).getRealEstateView(); }
function rePct(x,d){ return x==null?'—':((x>0?'+':'')+(x*100).toFixed(d==null?1:d)+'%'); }
/* 서울 25개 구 실거래 지도(데이터 10/24 겸이 "표 말고 지도") — 경계 = J.regions.geo(assets/realestate_map.json, geoBoundaries CC BY 3.0, 저장소 정적),
   숫자 = J.seoul_trades(국토부 RTMS 자동, 하루 1회) → 없으면 V.district_takes(데스크 문서 수치). 색 = --ch1 농도(토큰), 범례에 구간 숫자. */
let RE_M='p59', RE_SEL=null;
const RE_MET={p59:{nm:'59㎡ 중위(진입 난이도)',cuts:[7,12],lab:['하 · 7억 미만','중 · 7~12억','상 · 12억 이상'],fmt:v=>v.toFixed(1)+'억'},
  jr:{nm:'전세가율(84㎡)',cuts:[50,60,70],lab:['50% 미만','50~60%','60~70%','70% 이상'],fmt:v=>Math.round(v)+'%'},
  old:{nm:'구축 비중(1999년 이전)',cuts:[20,40,60],lab:['20% 미만','20~40%','40~60%','60% 이상'],fmt:v=>Math.round(v)+'%'}};
function reSel(id){ RE_SEL=(RE_SEL===id?null:id); RE_DONG=null; RE_CX=null; render(); }
/* ───── 드릴다운: 구 → 법정동 → 단지 → 최근 거래 (10/26). 데이터 = reports/realestate_trades/<구코드>.json(screener/realestate.py summarize_detail, 구 누를 때만 읽음) ───── */
let RE_DONG=null, RE_CX=null, RE_CXS='n'; const RE_GUD={};
function reGuLoad(cd){ if(!/^\d{5}$/.test(cd)||RE_GUD[cd]!==undefined) return; RE_GUD[cd]=false;
  google.script.run.withSuccessHandler(t=>{ try{ const o=JSON.parse(t); RE_GUD[cd]=(o&&Array.isArray(o.dongs))?o:'err'; }catch(e){ RE_GUD[cd]='err'; } if(view==='re') render(); })
    .withFailureHandler(()=>{ RE_GUD[cd]='err'; if(view==='re') render(); }).getRealEstateGu(cd); }
function reGo(lv){ if(lv==='seoul'){ RE_SEL=null; RE_DONG=null; RE_CX=null; } else if(lv==='gu'){ RE_DONG=null; RE_CX=null; } else if(lv==='dong'){ RE_CX=null; }
  render(); const e=document.getElementById('redr'); if(e&&e.scrollIntoView) e.scrollIntoView({block:'nearest'}); }
function reDong(i){ const d=reCur(); if(!d||!d.dongs[i]) return; RE_DONG=d.dongs[i].name; RE_CX=null; render(); const e=document.getElementById('redr'); if(e&&e.scrollIntoView) e.scrollIntoView({block:'start'}); }
function reCx(i){ const L=reCxList(); if(!L[i]) return; RE_CX=(RE_CX===L[i].name?null:L[i].name); render(); }
function reCxSort(k){ RE_CXS=k; render(); }
function reCur(){ const T=(REJ||{}).seoul_trades||{}, g=RE_SEL&&(T.districts||{})[RE_SEL], d=g&&g.code&&RE_GUD[g.code]; return (d&&typeof d==='object')?d:null; }
function reCxList(){ const d=reCur(); if(!d||!RE_DONG) return [];
  const L=(d.complexes||[]).filter(c=>c.dong===RE_DONG);
  return L.sort(RE_CXS==='p'?((a,b)=>(b.med??-1)-(a.med??-1)||b.n-a.n):((a,b)=>b.n-a.n||(b.n_jeonse||0)-(a.n_jeonse||0)||String(a.name).localeCompare(b.name))); }
function reEok(v){ return v==null?'—':(v>=10?v.toFixed(1):v.toFixed(2))+'억'; }
function reDrill(J){
  const T=J.seoul_trades||{}, g=RE_SEL&&(T.districts||{})[RE_SEL];
  if(!g) return '';
  const grp=((J.regions||{}).groups||[]).filter(x=>x.id!=='seoul'&&(x.members||[]).includes(RE_SEL)).map(x=>`<span class="rebadge">${esc(x.name)}</span>`).join('');
  const crumb=`<nav class="recrumb" aria-label="부동산 위치"><button type="button" onclick="reGo('seoul')">서울</button>›${RE_DONG?`<button type="button" onclick="reGo('gu')">${esc(RE_SEL)}</button>›`+(RE_CX?`<button type="button" onclick="reGo('dong')">${esc(RE_DONG)}</button>›<b>${esc(RE_CX)}</b>`:`<b>${esc(RE_DONG)}</b>`):`<b>${esc(RE_SEL)}</b>`}${grp}</nav>`;
  const wrap=b=>`<div class="redr" id="redr">${crumb}${b}<div class="mu" style="font-size:var(--fs-1);margin-top:6px">국토부 RTMS ${esc(T.period||'')} · 취소 제외 매매 · 전세 = 월세 0 · 억 원 · 표시 전용, 매매 신호 아님</div></div>`;
  if(!g.detail||!g.code) return wrap(`<div class="mu" style="font-size:var(--fs-2)">동·단지 세부는 다음 실거래 수집(국토부 RTMS, 하루 1회) 뒤에 열려요.</div>`);
  reGuLoad(g.code);
  const D=RE_GUD[g.code];
  if(D===false||D===undefined) return wrap('<div class="mu">불러오는 중…</div>');
  if(D==='err') return wrap(`<div class="am" style="font-size:var(--fs-2)">${esc(RE_SEL)} 세부 파일을 못 읽었어요. <a href="#" onclick="delete RE_GUD['${esc(g.code)}'];render();return false">다시 시도</a></div>`);
  if(!RE_DONG){
    const ds=D.dongs||[];
    return wrap(`<div style="font-size:var(--fs-2);margin-bottom:4px"><b>${esc(RE_SEL)}</b> 법정동 ${ds.length}곳 <span class="mu">· 거래 많은 순 · 눌러서 단지 보기</span></div>
      <div class="redgrid">${ds.map((x,i)=>`<button type="button" class="redit" onclick="reDong(${i})" aria-label="${esc(x.name)} 매매 ${x.n}건 중위 ${esc(reEok(x.med))}"><span class="v">${esc(x.name)}</span> <span class="mu">${x.n}건</span>
        <small>중위 ${reEok(x.med)} · 59㎡ ${reEok(x.p59)}${x.n59?` (${x.n59})`:''} · 84㎡ ${reEok(x.p84)}${x.n84?` (${x.n84})`:''}</small><small>전세 ${x.n_jeonse||0} · 취소 ${x.n_cancel||0} · 단지 ${x.n_cx||0}</small></button>`).join('')}</div>`);
  }
  const L=reCxList(), dn=(D.dongs||[]).find(x=>x.name===RE_DONG)||{};
  const tog=[['n','거래 수'],['p','가격(중위)']].map(([k,t])=>`<button type="button" class="retog${RE_CXS===k?' on':''}" aria-pressed="${RE_CXS===k}" onclick="reCxSort('${k}')">${t}</button>`).join('');
  const det=c=>`<div class="recxd"><div class="mu" style="font-size:var(--fs-1)">${c.by?esc(String(c.by))+'년 준공 · ':''}매매 ${c.n} · 전세 ${c.n_jeonse||0} · 취소 ${c.n_cancel||0}</div>
      ${(c.areas||[]).length?`<div class="retw"><table class="regt"><tr><th>전용</th><th>건수</th><th>중위</th><th>최근가</th><th>최근일</th></tr>${c.areas.map(a=>`<tr><td>${a.a}㎡</td><td>${a.n}</td><td>${reEok(a.med)}</td><td>${reEok(a.last)}</td><td>${esc(a.last_d||'—')}</td></tr>`).join('')}</table></div>`:''}
      <div style="font-size:var(--fs-2);margin-top:4px"><b>최근 거래 ${(c.recent||[]).length}건</b></div>${(c.recent||[]).length?`<div class="retw"><table class="regt"><tr><th>날짜</th><th>층</th><th>전용</th><th>가격</th></tr>${c.recent.map(r=>`<tr><td>${esc(r.d||'—')}</td><td>${r.fl==null?'—':esc(String(r.fl))+'층'}</td><td>${r.a==null?'—':r.a+'㎡'}</td><td>${reEok(r.p)}</td></tr>`).join('')}</table></div>`:'<div class="mu" style="font-size:var(--fs-2)">이 기간 매매 없음(전세만)</div>'}</div>`;
  return wrap(`<div style="font-size:var(--fs-2);margin-bottom:4px"><b>${esc(RE_DONG)}</b> 단지 ${L.length}곳 <span class="mu">· 매매 ${dn.n??'—'}건 · 중위 ${reEok(dn.med)}</span></div>
    <div class="retogs" role="group" aria-label="단지 정렬">${tog}</div>
    <div class="recxl">${L.map((c,i)=>`<button type="button" class="redit${RE_CX===c.name?' on':''}" aria-expanded="${RE_CX===c.name}" onclick="reCx(${i})"><span class="v">${esc(c.name)}</span> <span class="mu">${c.by?esc(String(c.by))+'년':''}</span>
        <small>매매 ${c.n}건 · 중위 ${reEok(c.med)}${c.last_d?' · 최근 '+esc(c.last_d):''} · 전세 ${c.n_jeonse||0}</small>${(c.areas||[]).length?`<small>${c.areas.slice(0,3).map(a=>`${a.a}㎡ ${reEok(a.last)}`).join(' · ')}</small>`:''}</button>${RE_CX===c.name?det(c):''}`).join('')||'<div class="mu">단지 없음</div>'}</div>`);
}
function reMetric(m){ RE_M=m; render(); }
function reKey(e,id){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); reSel(id); } }
function reGuRows(J,V){
  const T=J.seoul_trades||{}, live=(T.status==='ok'||T.status==='부분')&&T.districts, DT=V.district_takes||{};
  const rows={};
  Object.keys(live?T.districts:DT).filter(k=>!k.startsWith('_')).forEach(k=>{
    const id=live?k:(k.endsWith('구')?k:k+'구'), t=DT[id]||DT[id.replace(/구$/,'')]||{}, d=live?T.districts[k]:t;
    rows[id]={id, p59:d.p59??null, p84:d.p84??null, q1:d.p84_q1??null, j84:d.j84??null, jr:d.jeonse_ratio??null, old:d.pre1999??null,
      n:d.n??null, n59:d.n59, n84:d.n84, entry:d.entry||t.entry||null, take:t};
  });
  return {rows, live, T};
}
function reSeoulMap(J,V){
  const G=((J.regions||{}).geo||{}), areas=(G.areas||[]).filter(a=>a.sido==='서울');
  const {rows, live, T}=reGuRows(J,V);
  if(!Object.keys(rows).length) return '';
  const M=RE_MET[RE_M], key=RE_M, nb=M.cuts.length+1, pct=nb===3?[18,50,85]:[15,38,62,85];
  const bin=v=>{ if(v==null) return -1; let i=0; while(i<M.cuts.length&&v>=M.cuts[i]) i++; return i; };
  const fill=i=>i<0?'var(--bg2)':`color-mix(in srgb, var(--ch1) ${pct[i]}%, var(--bg))`;
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  areas.forEach(a=>{ const n=(a.d.match(/-?\d+(\.\d+)?/g)||[]).map(Number); for(let i=0;i+1<n.length;i+=2){ x0=Math.min(x0,n[i]); x1=Math.max(x1,n[i]); y0=Math.min(y0,n[i+1]); y1=Math.max(y1,n[i+1]); } });
  const pad=2, W=(x1-x0)+pad*2, H=(y1-y0)+pad*2;
  const short=id=>id==='중구'?'중구':id.replace(/구$/,'');
  const val=(r)=>r?r[key]:null;
  const svg=areas.length?`<svg viewBox="${(x0-pad).toFixed(1)} ${(y0-pad).toFixed(1)} ${W.toFixed(1)} ${H.toFixed(1)}" role="group" aria-label="서울 25개 구 지도 — ${esc(M.nm)}">${areas.map(a=>{ const r=rows[a.id], v=val(r);
      return `<path d="${a.d}" fill="${fill(bin(v))}" class="${RE_SEL===a.id?'on':''}" tabindex="0" role="button" aria-pressed="${RE_SEL===a.id}" aria-label="${esc(a.id)} ${esc(M.nm)} ${v==null?'미확인':esc(M.fmt(v))}" onclick="reSel('${esc(a.id)}')" onkeydown="reKey(event,'${esc(a.id)}')"><title>${esc(a.id)} · ${v==null?'미확인':esc(M.fmt(v))}</title></path>`; }).join('')}</svg>
    ${areas.map(a=>{ const r=rows[a.id], v=val(r); return `<span class="relab" style="left:${((a.cx-x0+pad)/W*100).toFixed(1)}%;top:${((a.cy-y0+pad)/H*100).toFixed(1)}%">${esc(short(a.id))}<i>${v==null?'—':esc(M.fmt(v))}</i></span>`; }).join('')}`
    :'<div class="mu" style="font-size:var(--fs-2)">지도 경계 없음 — python -m screener.realestate_geo 로 재생성</div>';
  const legend=`<div class="relegend">${M.lab.map((l,i)=>`<span><b style="background:${fill(i)}"></b>${esc(l)}</span>`).join('')}<span><b style="background:var(--bg2)"></b>미확인</span></div>`;
  const tog=Object.entries(RE_MET).map(([k,m])=>`<button type="button" class="retog${k===RE_M?' on':''}" aria-pressed="${k===RE_M}" onclick="reMetric('${k}')">${esc(m.nm.split('(')[0])}</button>`).join('');
  const f=(v,u)=>v==null?'—':(u==='억'?v.toFixed(2)+'억':Math.round(v)+u);
  const s=RE_SEL&&rows[RE_SEL];
  const card=s?`<div class="regu"><div style="font-size:var(--fs-3);font-weight:700">${esc(s.id)} <span class="rebadge">진입 ${esc(s.entry||'—')}</span></div>
      <table class="regt"><tr><td>59㎡ 중위</td><td>${f(s.p59,'억')}${s.n59!=null?` <span class="mu">n ${s.n59}</span>`:''}</td></tr>
      <tr><td>84㎡ 중위</td><td>${f(s.p84,'억')}${s.n84!=null?` <span class="mu">n ${s.n84}</span>`:''}</td></tr>
      <tr><td>84㎡ 하위25%</td><td>${f(s.q1,'억')}</td></tr><tr><td>84㎡ 전세 중위</td><td>${f(s.j84,'억')}</td></tr>

    ${takes?`<h3 style="font-size:var(--fs-2);margin:12px 0 2px;color:var(--amber)">데스크 메모 <span class="mu" style="font-size:var(--fs-1)">내용·그쪽 뷰·우리 해석</span></h3>${takes}`:''}
    <details><summary><b style="font-size:var(--fs-2)">리츠·인프라 ${(J.reits||[]).filter(r=>r.status==='ok').length}종</b></summary><ul class="relist">${reits}</ul>${reitsTake}</details>
    <h3 style="font-size:var(--fs-2);margin:12px 0 2px;color:var(--amber)">뉴스 <span class="mu" style="font-size:var(--fs-1)">자동 수집 — 데스크 해석 아님</span></h3>${news||'<div class="mu">없음</div>'}
    <details><summary class="mu" style="font-size:var(--fs-2)">아직 못 쓰는 데이터 ${(J.unavailable||[]).length}</summary><ul class="relist">${unav}</ul></details>
  </div></div>${rePvSec()}</div>`;
  /* rePvFill 은 그려진 뒤 */
}
</script>
