<script>
let REJ=null, REV=null;
function reLoad(){ if(REJ!==null) return; REJ=false; REV=false;
  google.script.run.withSuccessHandler(t=>{ try{ REJ=JSON.parse(t); }catch(e){ REJ={}; } if(view==='re') render(); }).withFailureHandler(()=>{ REJ={}; if(view==='re') render(); }).getRealEstate();
  google.script.run.withSuccessHandler(t=>{ try{ REV=JSON.parse(t); }catch(e){ REV={}; } if(view==='re') render(); }).withFailureHandler(()=>{ REV={}; if(view==='re') render(); }).getRealEstateView(); }
function rePct(x,d){ return x==null?'—':((x>0?'+':'')+(x*100).toFixed(d==null?1:d)+'%'); }
/* 서울 25개 구 실거래 지도(데이터 10/24 겸이 "표 말고 지도") — 경계 = J.regions.geo(assets/realestate_map.json, geoBoundaries CC BY 3.0, 저장소 정적),
   숫자 = J.seoul_trades(국토부 RTMS 자동, 하루 1회) → 없으면 V.district_takes(데스크 문서 수치). 색 = --ch1 농도(토큰), 범례에 구간 숫자. */
let RE_M='p59', RE_SEL=null, RE_TW=false;
const RE_MET={p59:{nm:'59㎡ 중위(진입 난이도)',cuts:[7,12],lab:['하 · 7억 미만','중 · 7~12억','상 · 12억 이상'],fmt:v=>v.toFixed(1)+'억'},
  jr:{nm:'전세가율(84㎡)',cuts:[50,60,70],lab:['50% 미만','50~60%','60~70%','70% 이상'],fmt:v=>Math.round(v)+'%'},
  old:{nm:'구축 비중(1999년 이전)',cuts:[20,40,60],lab:['20% 미만','20~40%','40~60%','60% 이상'],fmt:v=>Math.round(v)+'%'}};
function reSel(id){ RE_SEL=(RE_SEL===id?null:id); RE_DONG=null; RE_CX=null; RE_DG=null; render(); }
/* ───── 드릴다운: 구 → 법정동 → 단지 → 최근 거래 (10/26). 데이터 = reports/realestate_trades/<구코드>.json(screener/realestate.py summarize_detail, 구 누를 때만 읽음) ───── */
let RE_DONG=null, RE_CX=null, RE_CXS='n', RE_DG=null; const RE_GUD={};
/* 법정동 '가' 묶음 (10/26 겸이 OK): '○○동N가' → '○○동'. 기본 화면은 묶음(색·건수 = 합친 거래), 묶음을 누르면 1가~N가로 한 번 더 확대·분리. 단지 목록은 원래 동 그대로.
   n·중위 = 생성기 dong_groups(합친 거래로 재계산, screener/realestate.py summarize_detail). 옛 파일(dong_groups 없음)은 건수만 합산·중위 '—'. */
const reGrpNm=n=>{ const m=/^(.+동)\d+가$/.exec(String(n||'')); return m?m[1]:String(n||''); };
function reGroups(TD,geo){ const G={}, add=(nm,x)=>{ const g=reGrpNm(nm), o=G[g]||(G[g]={name:g,members:[],n:0,n_cancel:0,n_jeonse:0,n_cx:0,med:null,p59:null,p84:null,n59:0,n84:0,_x:[]});
    if(!o.members.includes(nm)) o.members.push(nm); if(x&&!o._x.includes(x)){ o._x.push(x); ['n','n_cancel','n_jeonse','n_cx','n59','n84'].forEach(k=>o[k]+=x[k]||0); } };
  ((TD&&TD.dongs)||[]).forEach(x=>add(x.name,x)); (geo||[]).forEach(d=>add(d.name,null));
  const pre=(TD&&TD.dong_groups)||{};
  Object.values(G).forEach(o=>{ o.members.sort((a,b)=>a.localeCompare(b,'ko',{numeric:true})); o.multi=o.members.length>1;
    if(!o.multi&&o._x[0]) Object.assign(o,o._x[0],{name:o.name,members:o.members,multi:false});
    else if(pre[o.name]) ['n','n_cancel','n_jeonse','n_cx','med','p59','p84','n59','n84'].forEach(k=>{ if(pre[o.name][k]!==undefined) o[k]=pre[o.name][k]; }); });
  return G; }
function reDGo(g){ RE_DG=(RE_DG===g?null:g); RE_DONG=null; RE_CX=null; render(); const e=document.getElementById('redr'); if(e&&e.scrollIntoView) e.scrollIntoView({block:'nearest'}); }
function reDongP(nm){ const d=reCur(), G=reGroups(d,(reGeoCur()||{}).dongs), g=G[reGrpNm(nm)];
  if(g&&g.multi&&RE_DG!==g.name&&!RE_DONG) return reDGo(g.name); reDongG(nm); }
function reGuLoad(cd){ if(!/^\d{5}$/.test(cd)||RE_GUD[cd]!==undefined) return; RE_GUD[cd]=false;
  google.script.run.withSuccessHandler(t=>{ try{ const o=JSON.parse(t); RE_GUD[cd]=(o&&Array.isArray(o.dongs))?o:'err'; }catch(e){ RE_GUD[cd]='err'; } if(view==='re') render(); })
    .withFailureHandler(()=>{ RE_GUD[cd]='err'; if(view==='re') render(); }).getRealEstateGu(cd); }
function reGo(lv){ if(lv==='seoul'){ RE_SEL=null; RE_DONG=null; RE_CX=null; RE_DG=null; } else if(lv==='gu'){ RE_DONG=null; RE_CX=null; RE_DG=null; } else if(lv==='grp'){ RE_DONG=null; RE_CX=null; } else if(lv==='dong'){ RE_CX=null; }
  render(); const e=document.getElementById('redr'); if(e&&e.scrollIntoView) e.scrollIntoView({block:'nearest'}); }
function reDong(i){ const d=reCur(); if(!d||!d.dongs[i]) return; RE_DONG=d.dongs[i].name; RE_CX=null; render(); const e=document.getElementById('redr'); if(e&&e.scrollIntoView) e.scrollIntoView({block:'start'}); }
function reCx(i){ const L=reCxList(); if(!L[i]) return; RE_CX=(RE_CX===L[i].name?null:L[i].name); render(); }
function reCxSort(k){ RE_CXS=k; render(); }
function reCur(){ const T=(REJ||{}).seoul_trades||{}, g=RE_SEL&&(T.districts||{})[RE_SEL], d=g&&g.code&&RE_GUD[g.code]; return (d&&typeof d==='object')?d:null; }
function reCxList(){ const d=reCur(); if(!d||!RE_DONG) return [];
  const L=(d.complexes||[]).filter(c=>c.dong===RE_DONG);
  return L.sort(RE_CXS==='p'?((a,b)=>(b.med??-1)-(a.med??-1)||b.n-a.n):((a,b)=>b.n-a.n||(b.n_jeonse||0)-(a.n_jeonse||0)||String(a.name).localeCompare(b.name))); }
function reEok(v,d){ return v==null?'—':(Math.abs(v)<1?v.toFixed(2):v.toFixed(d==null?1:d))+'억'; }   // 10/27 가독성: 집계(중위)는 소수 1자리 통일 · 개별 거래가는 reEok(v,2)
function reDongLines(x){   // 동 카드 2줄: ① 59·84㎡ 중위(비교 단위) ② 전체 중위·전세·단지 — 표본 수·취소는 title
  const tip=`59㎡ ${x.n59||0}건 · 84㎡ ${x.n84||0}건 · 취소 ${x.n_cancel||0}건`;
  return `<small title="${esc(tip)}"><span class="renum">59㎡ ${reEok(x.p59)}</span> · <span class="renum">84㎡ ${reEok(x.p84)}</span></small><small><span class="renum">전체 중위 ${reEok(x.med)}</span> · <span class="renum">전세 ${x.n_jeonse||0}</span> · <span class="renum">단지 ${x.n_cx||0}</span></small>`; }
function reDrill(J){
  const T=J.seoul_trades||{}, g=RE_SEL&&(T.districts||{})[RE_SEL];
  if(!g) return '';
  const grp=((J.regions||{}).groups||[]).filter(x=>x.id!=='seoul'&&(x.members||[]).includes(RE_SEL)).map(x=>`<span class="rebadge">${esc(x.name)}</span>`).join('');
  const gb=RE_DG?`<button type="button" onclick="reGo('grp')">${esc(RE_DG)}</button>›`:'';
  const crumb=`<nav class="recrumb" aria-label="부동산 위치"><button type="button" onclick="reGo('seoul')">서울</button>›${(RE_DONG||RE_DG)?`<button type="button" onclick="reGo('gu')">${esc(RE_SEL)}</button>›`+(RE_DONG?gb+(RE_CX?`<button type="button" onclick="reGo('dong')">${esc(RE_DONG)}</button>›<b>${esc(RE_CX)}</b>`:`<b>${esc(RE_DONG)}</b>`):`<b>${esc(RE_DG)}</b>`):`<b>${esc(RE_SEL)}</b>`}${grp}</nav>`;
  const wrap=b=>`<div class="redr" id="redr">${crumb}${b}<div class="mu" style="font-size:var(--fs-1);margin-top:6px">국토부 실거래 ${esc(rePer(T.period))} · 매매 = 취소 제외 · 전세 = 월세 0 · 억 원 · 표시 전용, 매매 신호 아님</div></div>`;
  if(!g.detail||!g.code) return wrap(`<div class="mu" style="font-size:var(--fs-2)">동·단지 세부는 다음 실거래 수집(국토부 RTMS, 하루 1회) 뒤에 열려요.</div>`);
  reGuLoad(g.code);
  const D=RE_GUD[g.code];
  if(D===false||D===undefined) return wrap('<div class="mu">불러오는 중…</div>');
  if(D==='err') return wrap(`<div class="am" style="font-size:var(--fs-2)">${esc(RE_SEL)} 세부 파일을 못 읽었어요. <a href="#" onclick="delete RE_GUD['${esc(g.code)}'];render();return false">다시 시도</a></div>`);
  if(!RE_DONG){
    const G=reGroups(D,null), dsAll=D.dongs||[], gi=nm=>dsAll.findIndex(x=>x.name===nm);
    const ds=RE_DG&&G[RE_DG]?dsAll.filter(x=>reGrpNm(x.name)===RE_DG):Object.values(G).filter(g=>g.n||g.n_jeonse||g.n_cancel).sort((a,b)=>b.n-a.n||a.name.localeCompare(b.name,'ko'));
    const gbtn=x=>`<button type="button" class="redit regrp" data-grp="${esc(x.name)}" onclick="reDGo('${esc(x.name)}')" aria-label="${esc(x.name)} 묶음 ${x.members.length}곳 매매 ${x.n}건 중위 ${esc(reEok(x.med))}"><span class="v">${esc(x.name)}</span> <span class="mu">${x.n}건 · ${esc(x.members[0].replace(x.name,''))}~${esc(x.members[x.members.length-1].replace(x.name,''))} 나눠 보기 ›</span>
        ${reDongLines(x)}</button>`;
    if(!RE_DG) return wrap(`<div style="font-size:var(--fs-2);margin-bottom:4px"><b>${esc(RE_SEL)}</b> 동 ${ds.length}곳 <span class="mu">· 거래 많은 순 · 누르면 단지</span></div>
      <div class="redgrid">${ds.map(x=>x.multi?gbtn(x):`<button type="button" class="redit" onclick="reDong(${gi(x.name)})" aria-label="${esc(x.name)} 매매 ${x.n}건 중위 ${esc(reEok(x.med))}"><span class="v">${esc(x.name)}</span> <span class="mu">${x.n}건</span>
        ${reDongLines(x)}</button>`).join('')}</div>`);
    return wrap(`<div style="font-size:var(--fs-2);margin-bottom:4px"><b>${esc(RE_DG)}</b> 묶음 ${ds.length}곳 <span class="mu">· 합계 매매 ${G[RE_DG].n}건 · 중위 ${reEok(G[RE_DG].med)} · 눌러서 단지 보기</span></div>
      <div class="redgrid">${ds.map(x=>`<button type="button" class="redit" onclick="reDong(${gi(x.name)})" aria-label="${esc(x.name)} 매매 ${x.n}건 중위 ${esc(reEok(x.med))}"><span class="v">${esc(x.name)}</span> <span class="mu">${x.n}건</span>
        ${reDongLines(x)}</button>`).join('')}</div>`);

  /* 데스크 메모(STANDARD §4 세 칸) */
  const takes=(V.takes||[]).map(t=>`<details class="redesk"><summary><span style="font-size:var(--fs-3)">${esc(t.title)}</span><span class="rebadge">${esc(t.src||'')} ${esc(t.date||'')}</span>${t.source_checked===false?'<span class="rebadge" style="color:var(--dn)">검증전</span>':''}</summary>
      <div style="font-size:var(--fs-2);line-height:1.6"><div><span class="am">① 내용</span> ${esc(t.summary||'')}</div><div><span class="am">② 그쪽 뷰</span> ${esc(t.view||'')}</div><div><span class="am">③ 우리 해석</span> ${esc(t.our_take||'')}</div>${t.url?`<div class="mu" style="font-size:var(--fs-1);margin-top:3px"><a href="${esc(t.url)}" target="_blank" rel="noopener">원문 링크(깨질 수 있음)</a></div>`:''}</div></details>`).join('');
  /* 리츠 */
  const reits=(J.reits||[]).filter(r=>r.status==='ok').map(r=>`<li><b>${esc(r.name)}</b> <span class="mu">${esc(r.what||'')}</span><div style="font-size:var(--fs-2)">1주 ${rePct(r.chg1w)} · 1개월 ${rePct(r.chg1m)} · 52주 위치 ${r.pos52==null?'—':Math.round(r.pos52*100)+'%'}</div></li>`).join('');
  const reitsTake=V.reits_take?`<div class="redesk"><div class="lb">데스크 해석 · 리츠</div><div style="font-size:var(--fs-2)">${esc(V.reits_take.our_take||'')}</div></div>`:'';
  /* 자동 뉴스(7축) */
  const news=(J.news||[]).map(n=>`<details class="reauto"><summary><b style="font-size:var(--fs-2)">${esc(n.name)}</b><span class="rebadge">자동 · ${(n.items||[]).length}</span>${n.stale?'<span class="rebadge" style="color:var(--amber);border-color:var(--amber)">수집 실패 · 이전 값</span>':''}${n.items&&n.items[0]?`<span class="mu" style="font-size:var(--fs-2);margin-left:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1">${n.items[0].title!=null?esc(n.items[0].title):esc((n.items[0].src||'')+' · '+(n.items[0].time||''))}</span>`:''}</summary>
      ${n.stale?`<div class="am" style="font-size:var(--fs-1);white-space:normal">⚠ 이 축 Google News 검색 실패 — 이전 값 ${n.stale.kept??0}건 유지(stale${n.stale.since?' · '+esc(n.stale.since)+' 수집분':' · 이전 값 없음'}) · ${esc(n.stale.why||'')}</div>`:''}<ul class="relist">${(n.items||[]).map(i=>`<li>${i.title!=null?esc(i.title):`<span class="mu" title="${esc(i.title_withheld||'')}">[제목 비공개 · Google News 약관]</span>`} <span class="mu" style="font-size:var(--fs-1)">· ${esc(i.src||'')} ${esc(i.time||'')}${i.link?` · <a href="${esc(i.link)}" target="_blank" rel="noopener">링크</a>`:''}</span></li>`).join('')}</ul></details>`).join('');
  const unav=(J.unavailable||[]).map(u=>`<li><b>${esc(u.name)}</b> <span class="rebadge">${esc(u.status||'')}</span><div class="mu" style="font-size:var(--fs-2)">${esc(u.why||'')}</div></li>`).join('');
  setTimeout(rePvFill,0);
  return `<div class="grid re"><div class="p c12"><h2>부동산<small>${esc(J.asof||'—')} · 자동 수집 + 데스크 해석</small></h2><div class="b">
    ${top}${cards}
    ${reSeoulMap(J,V)}
    ${reLongView(V)}
    <h3 class="reh">금리·대출 <span class="mu">ECOS 1차</span></h3><ul class="relist">${rates||'<li class="mu">데이터 없음</li>'}</ul>${ratesTake}
    <h3 class="reh">정책·이벤트</h3><ul class="relist">${ev||'<li class="mu">없음</li>'}</ul>
    ${takes?`<h3 class="reh">데스크 메모 <span class="mu">내용·그쪽 뷰·우리 해석</span></h3>${takes}`:''}
    <details><summary><b style="font-size:var(--fs-2)">리츠·인프라 ${(J.reits||[]).filter(r=>r.status==='ok').length}종</b></summary><ul class="relist">${reits}</ul>${reitsTake}</details>
    <h3 class="reh">뉴스 <span class="mu">자동 수집 — 데스크 해석 아님</span></h3>${news||'<div class="mu">없음</div>'}
    <details><summary class="mu" style="font-size:var(--fs-2)">아직 못 쓰는 데이터 ${(J.unavailable||[]).length}</summary><ul class="relist">${unav}</ul></details>
  </div></div>${rePvSec()}</div>`;
  /* rePvFill 은 그려진 뒤 */
}

/* 상단 3칸 어댑터 (묶음 B, 10/26) — Index.html TOPF·mkTop·topMount. 기존 문장·수치 재배치만, 근거 없으면 NA(사유). */
if(typeof TOPF==='object'){
TOPF.re=()=>{ if(REJ===false||(typeof REV!=='undefined'&&REV===false)) return null; const J=REJ||{}, V=(typeof REV!=='undefined'&&REV)||{};
  if(isTop(J.top)&&!V.one_line) return J.top;
  const R=(J.rates||[]).filter(r=>r.status==='ok'&&r.last!=null).slice(0,2).map(r=>`${r.name} ${Number(r.last).toFixed(2)}${r.unit||''}(${r.month||'—'})`);
  const p=J.prices||{}; const what=[R.join(' · ')||NA('금리 데이터 없음'),`가격 지수: ${p.status||'미확인'}`];
  const so=V.one_line?[`부동산 데스크 한 줄(${String(V.updated||'—').slice(0,10)}): ${V.one_line}`]:[J.label||NA('데스크 한 줄 없음')];
  const now=(J.stale_axes||[]).length?[`뉴스 축 ${(J.stale_axes||[]).length}개 갱신 지연 — 수집 확인`]:['조치 없음(표시 전용 — 매매 신호 아님)'];
  return mkTop(what,so,now,['reports/realestate.json','reports/views/realestate.json'],J.generated_at||J.asof,{grade:'검증전'}); };
}
</script>
